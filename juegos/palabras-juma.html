<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1640">
<title>Palabras JUMA</title>
<style>
  :root {
    --glass: rgba(26,14,38,.66); --glass-2: rgba(26,14,38,.82); --borde: rgba(255,255,255,.22);
    --gold: #FFD25A; --gold-2: #C98F12; --verde: #52B23A; --verde-2: #2E7D20;
    --plum: #3A2150; --plum-2: #2A1640; --cream: #FFF3D6; --ink: #2B1A3F; --muted: #7A6A8C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; min-height: 100%; overflow-x: hidden; background: #1a1020; }
  .bg { position: fixed; inset: 0; z-index: 0; background: #1a1020 center / cover no-repeat; transition: opacity .4s; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(48,20,60,.55) 0%, rgba(40,16,50,.28) 38%, rgba(24,10,32,.72) 100%); }
  body.en-juego .bg::after { background: linear-gradient(180deg, rgba(30,12,42,.72) 0%, rgba(24,10,34,.62) 50%, rgba(16,6,24,.86) 100%); }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  svg { display: block; }
  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 18px); display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .redondo { width: 46px; height: 46px; border-radius: 50%; background: var(--glass-2); border: 2px solid var(--borde); display: grid; place-items: center; flex: 0 0 auto; }
  .redondo:active { transform: scale(.94); }
  .pill { height: 42px; padding: 0 16px 0 5px; border-radius: 999px; background: var(--glass-2); border: 2px solid var(--borde); display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #FFE98F, #E8A910); color: #4A2F00; font-size: 17px; }
  .pill.vidas .ic { background: radial-gradient(circle at 35% 30%, #FF9DB0, #E11D48); color: #fff; }
  .espacio { flex: 1; }
  .titulo { text-align: center; margin: 18px 0 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; line-height: .95; text-shadow: 0 3px 12px rgba(0,0,0,.55); }
  .titulo .a { display: block; font-size: 46px; letter-spacing: .01em; }
  .titulo .b { display: block; font-size: 44px; letter-spacing: .06em; text-transform: uppercase; }
  .insignia { width: 190px; height: 190px; margin: 22px auto 14px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.34), rgba(255,255,255,.14)); border: 2px solid rgba(255,255,255,.28); box-shadow: 0 14px 34px rgba(0,0,0,.35), inset 0 0 40px rgba(255,255,255,.1); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .insignia b { font-size: 64px; line-height: 1; font-weight: 800; text-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .insignia small { font-size: 17px; letter-spacing: .06em; font-weight: 700; margin-top: 4px; }
  .progreso { padding: 0 6px; display: flex; flex-direction: column; gap: 14px; margin-top: auto; }
  .fila-prog { position: relative; }
  .fila-prog .rotulo { font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 6px 4px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .barra { position: relative; height: 30px; border-radius: 999px; background: rgba(20,10,28,.78); border: 2px solid rgba(255,255,255,.4); margin-right: 34px; }
  .barra > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(180deg, #7FD35B, #3EA526); min-width: 0; transition: width .5s ease; box-shadow: inset 0 3px 0 rgba(255,255,255,.3); }
  .barra > span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .fila-prog .extremo { position: absolute; right: -4px; bottom: -8px; width: 52px; height: 52px; display: grid; place-items: center; }
  .regalo svg { filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); transform: rotate(8deg); }
  .mosaico { width: 42px; height: 54px; display: grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(5,1fr); gap: 1px; border-radius: 6px; overflow: hidden; border: 2px solid #fff; transform: rotate(8deg); box-shadow: 0 4px 8px rgba(0,0,0,.5); background: #222; }
  .mosaico u { background-size: 400% 500%; background-repeat: no-repeat; opacity: 0; text-decoration: none; }
  .mosaico u.on { opacity: 1; }
  .mosaico.grande { width: 190px; height: 240px; transform: none; border-radius: 12px; border-width: 4px; border-color: var(--gold); box-shadow: 0 12px 28px rgba(0,0,0,.45), 0 0 30px rgba(255,210,90,.5); margin: 10px auto; }
  .btn-grande { width: 100%; height: 68px; border-radius: 999px; font-size: 26px; font-weight: 900; letter-spacing: .02em; background: linear-gradient(180deg, #62C943, #3A9A22); box-shadow: 0 6px 0 var(--verde-2), 0 14px 24px rgba(0,0,0,.35); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .btn-grande:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--verde-2); }
  .btn-grande:disabled { background: #6B5E78; box-shadow: 0 6px 0 #463C52; color: #C9BFD6; }
  .botones2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn2 { height: 50px; border-radius: 999px; background: var(--glass-2); border: 2px solid var(--borde); font-weight: 800; font-size: 16px; }
  .btn2:active { transform: scale(.97); }
  .aviso { text-align: center; font-size: 14.5px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .aviso:empty { display: none; }
  .pie-mapa { display: flex; align-items: center; gap: 10px; }
  .pie-mapa .botones2 { flex: 1; }
  .barra-juego { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { height: 42px; padding: 0 16px; border-radius: 999px; background: var(--glass-2); border: 2px solid var(--borde); display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chip.poco { color: #FFB4B4; border-color: #FF5C5C; animation: latido 1s infinite; }
  @keyframes latido { 50% { transform: scale(1.06); } }
  .capline { text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .92; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .tablero-tarjeta { display: flex; justify-content: center; align-items: center; min-height: 150px; padding: 6px 0; }
  .tablero { position: relative; }
  .ficha { position: absolute; border-radius: 9px; background: linear-gradient(180deg, rgba(72,40,100,.9), rgba(46,24,70,.92)); border: 2px solid rgba(255,255,255,.28); display: grid; place-items: center; color: #fff; font-weight: 900; user-select: none; box-shadow: 0 4px 8px rgba(0,0,0,.35); }
  .ficha.hecha { background: linear-gradient(180deg, #FFE48A, #F0B326); color: #3B2300; border-color: #FFF3C4; }
  .ficha.pista { background: linear-gradient(180deg, #FFF8E3, #F1E3BC); color: #3B2300; border-color: #fff; }
  .ficha.activa { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,210,90,.55), 0 4px 8px rgba(0,0,0,.35); }
  .ficha .n { position: absolute; top: 2px; left: 5px; font-size: 9px; font-weight: 800; opacity: .8; }
  .pista-linea { min-height: 50px; background: rgba(255,243,214,.95); color: var(--ink); border-radius: 18px; padding: 9px 14px; font-size: 15px; line-height: 1.35; box-shadow: 0 5px 14px rgba(0,0,0,.35); }
  .pista-linea small { display: block; color: #8A3FBF; font-weight: 900; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
  .msg { min-height: 22px; text-align: center; font-weight: 800; font-size: 15.5px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .msg.ok { color: #9BEB7E; }
  .msg.mal { color: #FFB4B4; }
  .formada { min-height: 48px; display: flex; align-items: center; justify-content: center; }
  .formada span { background: rgba(255,243,214,.97); color: var(--ink); padding: 8px 22px; border-radius: 999px; font-size: 24px; font-weight: 900; letter-spacing: .14em; box-shadow: 0 4px 12px rgba(0,0,0,.35); min-width: 90px; text-align: center; }
  .formada span.vacio { background: rgba(26,14,38,.6); color: rgba(255,255,255,.85); box-shadow: none; font-size: 14px; letter-spacing: 0; font-weight: 700; }
  .formada span.sacude { animation: sacude .38s; background: #FFD6D6; color: #B91C1C; }
  @keyframes sacude { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .rueda { position: relative; width: 300px; height: 300px; margin: 4px auto 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .rueda-disco { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.96), rgba(244,234,255,.88)); border: 3px solid rgba(255,255,255,.7); box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 -8px 24px rgba(120,80,170,.25); }
  #lineas { position: absolute; left: 0; top: 0; width: 300px; height: 300px; pointer-events: none; }
  .letra { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: transparent; color: var(--plum-2); font-weight: 900; font-size: 36px; display: grid; place-items: center; transition: transform .12s, background .12s, color .12s; }
  .letra.sel { background: radial-gradient(circle at 35% 30%, #7A47B0, #3A2150); color: #fff; transform: scale(1.08); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
  .mezclar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; background: rgba(58,33,80,.12); border: 2px solid rgba(58,33,80,.25); display: grid; place-items: center; }
  .mezclar:active { transform: translate(-50%, -48%); }
  .inferior { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pista-btn { height: 54px; padding: 0 18px 0 12px; border-radius: 999px; background: linear-gradient(180deg, #FFE48A, #F0B326); color: #3B2300; font-weight: 900; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 5px 0 #A36E06, 0 10px 18px rgba(0,0,0,.3); font-size: 16px; }
  .pista-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #A36E06; }
  .pista-btn small { font-size: 13px; background: rgba(59,35,0,.16); border-radius: 999px; padding: 3px 9px; }
  .pista-btn.claro { background: rgba(255,243,214,.95); color: var(--ink); box-shadow: 0 5px 0 #B9A98A, 0 10px 18px rgba(0,0,0,.3); }
  .fondo { position: fixed; inset: 0; background: rgba(12,4,20,.7); display: none; align-items: flex-end; justify-content: center; padding: 14px; z-index: 30; }
  .fondo.on { display: flex; }
  .hoja { width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; background: linear-gradient(180deg, #FFF8E8, #F8EBD0); color: var(--ink); border-radius: 28px; padding: 22px 18px 18px; box-shadow: 0 -10px 40px rgba(0,0,0,.45); text-align: center; animation: sube .35s cubic-bezier(.23,1,.32,1); }
  @keyframes sube { from { transform: translateY(40px); opacity: 0; } }
  .hoja h3 { font-family: Georgia, serif; margin: 0 0 4px; font-size: 28px; color: var(--plum-2); font-weight: 700; }
  .hoja p { margin: 6px 0; font-size: 15px; line-height: 1.45; }
  .hoja .sub { color: var(--muted); font-size: 14px; }
  .boton { width: 100%; height: 58px; border-radius: 999px; background: linear-gradient(180deg, #62C943, #3A9A22); color: #fff; font-weight: 900; font-size: 19px; letter-spacing: .03em; box-shadow: 0 5px 0 var(--verde-2); margin-top: 14px; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .boton.sec { background: #fff; color: var(--plum-2); box-shadow: 0 5px 0 #D8CDE6; border: 2px solid #D8CDE6; text-shadow: none; }
  .boton:active { transform: translateY(3px); }
  .estrellas { font-size: 32px; letter-spacing: 6px; color: var(--gold-2); margin: 4px 0; }
  .versiculo { font-style: italic; background: #fff; border: 2px dashed #E4C56A; border-radius: 16px; padding: 12px; margin: 12px 0; font-size: 15px; line-height: 1.45; }
  .versiculo small { display: block; font-style: normal; font-weight: 800; color: var(--muted); margin-top: 6px; font-size: 12.5px; }
  .lista-relicario, .capitulo-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; text-align: left; }
  .carta, .capitulo-lista .cap { background: #fff; border-radius: 16px; padding: 10px 12px; border: 2px solid #EADFBF; }
  .carta b { color: #7A47B0; font-size: 16px; letter-spacing: .06em; }
  .carta p { margin: 4px 0 0; font-size: 14px; }
  .carta i { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .carta.bloq { background: rgba(255,255,255,.5); border-style: dashed; color: var(--muted); }
  .capitulo-lista .cap b { font-size: 15px; color: var(--plum-2); }
  .capitulo-lista .cap small { color: var(--muted); font-size: 12.5px; }
  .niveles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .niveles button { height: 40px; border-radius: 12px; background: #7A47B0; color: #fff; font-weight: 900; box-shadow: 0 3px 0 #4F2B7A; }
  .niveles button.hecho { background: #3EA526; box-shadow: 0 3px 0 #2E7D20; }
  .niveles button:disabled { background: #E4DDEE; color: #A99DBB; box-shadow: none; }
  .niveles button.actual { background: var(--gold); color: #3B2300; box-shadow: 0 3px 0 var(--gold-2); }
  .como p { text-align: left; }
  .como b { color: #7A47B0; }
  @media (max-height: 700px) { .rueda { transform: scale(.88); margin: -18px auto -18px; } .insignia { width: 150px; height: 150px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="app">
  <header class="top">
    <div class="pill" id="p-pts" title="Puntos misioneros"><span class="ic">★</span><span id="t-pts">0</span></div>
    <div class="espacio"></div>
    <div class="pill vidas" id="p-vidas" title="Vidas"><span class="ic">♥</span><span id="t-vidas">5</span></div>
    <button class="redondo" id="btn-sonido" type="button" aria-label="Sonido"></button>
    <button class="redondo" id="btn-ayuda" type="button" aria-label="Cómo jugar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.4v.5"/><circle cx="12" cy="17" r=".6" fill="#fff"/></svg>
    </button>
  </header>

  <!-- MAPA -->
  <section id="vista-mapa" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <h1 class="titulo"><span class="a">Palabras</span><span class="b">JUMA</span></h1>
    <div class="insignia"><b id="m-nivel">1</b><small id="m-capnom">NIVEL</small></div>
    <div class="progreso">
      <div class="fila-prog">
        <div class="barra"><i id="m-barra"></i><span id="m-barra-t"></span></div>
        <div class="extremo regalo" aria-hidden="true"><svg width="48" height="48" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2" fill="#9B4DFF"/><rect x="2.5" y="7" width="19" height="4.2" rx="1.5" fill="#B574FF"/><rect x="10.8" y="7" width="2.4" height="13" fill="#FFB52E"/><path d="M12 7C9 2.5 5 4.2 7 7M12 7c3-4.5 7-2.8 5 0" stroke="#FFB52E" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
      </div>
      <div class="fila-prog">
        <p class="rotulo" id="m-cap"></p>
        <div class="barra"><i id="m-barra2"></i><span id="m-barra2-t"></span></div>
        <div class="extremo" id="m-mini"></div>
      </div>
    </div>
    <button class="btn-grande" id="btn-jugar" type="button">NIVEL <span id="m-nivel2">1</span></button>
    <div class="aviso" id="m-aviso"></div>
    <div class="pie-mapa">
      <button class="redondo" id="btn-cerrar-juego" type="button" aria-label="Salir del juego"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
      <div class="botones2">
        <button class="btn2" id="btn-capitulos" type="button">Capítulos</button>
        <button class="btn2" id="btn-relicario" type="button">Relicario</button>
      </div>
    </div>
  </section>

  <!-- JUEGO -->
  <section id="vista-juego" style="display:none;flex-direction:column;gap:12px">
    <div class="barra-juego">
      <button class="redondo" id="btn-salir" type="button" aria-label="Volver al mapa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="chip" id="g-nivel">Nivel 1</span>
      <span class="chip" id="g-tiempo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="g-tiempo-t">1:30</span></span>
    </div>
    <div class="capline" id="g-cap"></div>
    <div class="tablero-tarjeta"><div class="tablero" id="tablero"></div></div>
    <div class="pista-linea" id="pista"></div>
    <div class="msg" id="msg"></div>
    <div class="formada" id="formada"></div>
    <div class="rueda" id="rueda">
      <div class="rueda-disco"></div>
      <svg id="lineas" viewBox="0 0 300 300"><polyline id="trazo" fill="none" stroke="#7A47B0" stroke-opacity=".75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" points=""/></svg>
      <button class="mezclar" id="btn-mezclar" type="button" aria-label="Mezclar letras">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3A2150" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
    </div>
    <div class="inferior">
      <button class="pista-btn" id="btn-pista" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2400" stroke-width="2.4" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        Pista <small>★15</small>
      </button>
      <button class="pista-btn claro" id="btn-borrar" type="button">Borrar</button>
    </div>
  </section>
</div>

  } else {
    btn.disabled = false;
    av.textContent = S.vidas < MAX_VIDAS ? 'Vidas: ' + S.vidas + ' de ' + MAX_VIDAS + '. Próxima en ' + mmss(faltaVida()) + '.' : '';
  }
}
function pintarVidas() {
  document.getElementById('t-vidas').textContent = S.vidas + '/' + MAX_VIDAS;
}

// ---------- Ventanas ----------
function abrirHoja(html) {
  document.getElementById('hoja').innerHTML = html;
  document.getElementById('fondo').classList.add('on');
}
function cerrarHoja() { document.getElementById('fondo').classList.remove('on'); }
function verCapitulos() {
  let h = '<h3>Capítulos</h3><p class="sub">Puedes repetir los niveles ya completados.</p><div class="capitulo-lista">';
  CAPS.forEach((c, ci) => {
    const ini = inicioCap(ci);
    h += '<div class="cap"><b>Capítulo ' + (ci + 1) + ': ' + esc(c.nombre) + '</b><br><small>' + c.dif + ' · ' + c.tema + '</small><div class="niveles">';
    for (let n = ini; n <= c.fin; n++) {
      const cls = n <= S.completados ? 'hecho' : (n === nivelActual() ? 'actual' : '');
      h += '<button type="button" class="' + cls + '" data-nivel="' + n + '"' + (n > nivelActual() ? ' disabled' : '') + '>' + n + '</button>';
    }
    h += '</div></div>';
  });
  h += '</div><button class="boton sec" type="button" data-cerrar>Cerrar</button>';
  abrirHoja(h);
}
function verRelicario() {
  const porPalabra = new Map();
  NIVELES.forEach((n) => n.palabras.forEach((p) => { if (!porPalabra.has(p.w)) porPalabra.set(p.w, p); }));
  const sabidas = S.vocab.length;
  let lista = '';
  S.vocab.slice().reverse().forEach((w) => {
    const p = porPalabra.get(w); if (!p) return;
    lista += '<div class="carta"><b>' + esc(p.w) + '</b><p>' + esc(p.pista) + '</p><i>' + esc(p.nota) + '</i></div>';
  });
  const bloq = Math.max(0, Math.min(6, TOTAL_PALABRAS - sabidas));
  for (let i = 0; i < bloq; i++) lista += '<div class="carta bloq"><b>· · · · ·</b><p>Palabra por descubrir</p></div>';
  abrirHoja('<h3>Relicario</h3><p class="sub">Palabras descubiertas: <b>' + sabidas + '</b> de ' + TOTAL_PALABRAS + '</p><div class="lista-relicario">' + (lista || '<p class="sub">Aún no tienes palabras. ¡Empieza tu primer nivel!</p>') + '</div><button class="boton sec" type="button" data-cerrar>Cerrar</button>');
}
function verAyuda() {
  abrirHoja('<h3>Cómo jugar</h3><div class="como">' +
    '<p>• Une las letras de la rueda arrastrando el dedo para formar palabras.</p>' +
    '<p>• Las palabras se cruzan en el tablero. Cada palabra encontrada se llena con sus letras.</p>' +
    '<p>• Tienes un <b>tiempo</b> para cada nivel. Si se acaba, pierdes una <b>vida</b>.</p>' +
    '<p>• Cada palabra incorrecta te quita <b>5 segundos</b>.</p>' +
    '<p>• Las vidas se recuperan solas: una cada ' + MIN_VIDA + ' minutos.</p>' +
    '<p>• Ganas <b>★ puntos misioneros</b> que se suman a tu perfil.</p>' +
    '<p>• Cada capítulo termina con un cuadro para reclamar.</p></div>' +
    '<button class="boton" type="button" data-cerrar>Entendido</button>');
}
function verSinVidas() {
  abrirHoja('<h3>Sin vidas</h3><p>Se recupera una vida cada ' + MIN_VIDA + ' minutos.</p><p class="estrellas">♥</p><p>Próxima vida en <b id="cuenta-vida">' + mmss(faltaVida()) + '</b></p><button class="boton sec" type="button" data-cerrar>Volver al mapa</button>');
}

// ---------- Juego ----------
let NV = null, encontradas = new Set(), reveladas = new Set(), celdas = new Map(), activa = 0;
let ultimoSeg = -1;
let letras = [], sel = [], arrastrando = false, juegoActivo = false, tiempoMs = 0, ultimoTick = 0;

function mostrarVista(v) {
  document.getElementById('vista-mapa').style.display = v === 'mapa' ? 'flex' : 'none';
  document.getElementById('vista-juego').style.display = v === 'juego' ? 'flex' : 'none';
  document.body.classList.toggle('en-juego', v === 'juego');
  window.scrollTo(0, 0);
}
function abrirNivel(n) {
  regenerarVidas();
  if (n > nivelActual()) return;
  if (S.vidas <= 0) { verSinVidas(); return; }
  const nv = NIVELES[n - 1];
  let retomar = S.enCurso && S.enCurso.n === n;
  if (!retomar) S.enCurso = { n: n, enc: [], rev: [], tiempo: tiempoBase(nv) };
  NV = nv;
  encontradas = new Set(S.enCurso.enc);
  reveladas = new Set(S.enCurso.rev);
  tiempoMs = S.enCurso.tiempo;
  letras = barajar(nv.base.split(''));
  sel = [];
  construirCeldas();
  activa = Math.max(0, nv.palabras.findIndex((p) => !encontradas.has(p.w)));
  const ci = capDe(n);
  fondo(ci);
  document.getElementById('g-cap').textContent = 'Cap. ' + (ci + 1) + ' · ' + CAPS[ci].nombre;
  document.getElementById('g-nivel').textContent = 'Nivel ' + n;
  document.getElementById('msg').textContent = '';
  guardar();
  mostrarVista('juego');
  dibujarTablero();
  dibujarRueda();
  dibujarPista();
  pintarTiempo();
  juegoActivo = true;
  ultimoTick = Date.now();
}
function salirAlMapa() {
  if (juegoActivo && S.enCurso) { S.enCurso.enc = Array.from(encontradas); S.enCurso.rev = Array.from(reveladas); S.enCurso.tiempo = tiempoMs; guardar(); }
  juegoActivo = false;
  NV = null;
  cerrarHoja();
  mostrarVista('mapa');
  pintarMapa();
}
function construirCeldas() {
  celdas = new Map();
  NV.palabras.forEach((p, idx) => {
    for (let i = 0; i < p.w.length; i++) {
      const r = p.dir === 'H' ? p.r : p.r + i, c = p.dir === 'H' ? p.c + i : p.c;
      const k = r + ',' + c;
      if (!celdas.has(k)) celdas.set(k, { ch: p.w[i], idx: [] });
      celdas.get(k).idx.push(idx);
    }
  });
}
function resuelta(k) {
  if (reveladas.has(k)) return true;
  return celdas.get(k).idx.some((i) => encontradas.has(NV.palabras[i].w));
}
function dibujarTablero() {
  const tab = document.getElementById('tablero');
  const ancho = Math.min(window.innerWidth, 480) - 28 - 16 - 8;
  const cs = Math.max(26, Math.min(48, Math.floor(ancho / NV.cols), Math.floor(290 / NV.rows)));
  tab.style.width = (NV.cols * cs) + 'px';
  tab.style.height = (NV.rows * cs) + 'px';
  const numeros = new Map(); let num = 1;
  [...NV.palabras].sort((a, b) => a.r - b.r || a.c - b.c).forEach((p) => { const k = p.r + ',' + p.c; if (!numeros.has(k)) numeros.set(k, num++); });
  const act = NV.palabras[activa];
  const actKeys = new Set();
  if (act) for (let i = 0; i < act.w.length; i++) actKeys.add((act.dir === 'H' ? act.r : act.r + i) + ',' + (act.dir === 'H' ? act.c + i : act.c));
  let h = '';
  celdas.forEach((info, k) => {
    const [r, c] = k.split(',').map(Number);
    const ok = resuelta(k);
    const porPista = reveladas.has(k) && !info.idx.some((i) => encontradas.has(NV.palabras[i].w));
    let cls = 'ficha';
    if (!ok) cls += ' vacia'; else cls += porPista ? ' pista' : ' hecha';
    if (actKeys.has(k)) cls += ' activa';
    const n = numeros.get(k) ? '<span class="n">' + numeros.get(k) + '</span>' : '';
    h += '<div class="' + cls + '" data-k="' + k + '" style="left:' + (c * cs) + 'px;top:' + (r * cs) + 'px;width:' + (cs - 4) + 'px;height:' + (cs - 4) + 'px;font-size:' + Math.round(cs * .5) + 'px">' + n + (ok ? info.ch : '') + '</div>';
  });
  tab.innerHTML = h;
}
function dibujarPista() {
  const p = NV.palabras[activa];
  const box = document.getElementById('pista');
  if (!p) { box.innerHTML = ''; return; }
  const dir = p.dir === 'H' ? 'Horizontal' : 'Vertical';
  const ya = encontradas.has(p.w);
  box.innerHTML = '<small>' + dir + ' · ' + p.w.length + ' letras</small>' + (ya ? '<b>' + esc(p.w) + ':</b> ' : '') + esc(p.pista);
  dibujarTablero();
}
function dibujarRueda() {
  const rueda = document.getElementById('rueda');
  rueda.querySelectorAll('.letra').forEach((el) => el.remove());
  const N = letras.length, R = 102, C = 150;
  letras.forEach((ch, i) => {
    const ang = (2 * Math.PI * i / N) - Math.PI / 2;
    const el = document.createElement('div');
    el.className = 'letra';
    el.dataset.i = i;
    el.style.left = (C + R * Math.cos(ang)) + 'px';
    el.style.top = (C + R * Math.sin(ang)) + 'px';
    el.textContent = ch;
    rueda.appendChild(el);
  });
  pintarFormada();
}
function centroLetra(i) {
  const el = document.querySelector('.letra[data-i="' + i + '"]');
  if (!el) return null;
  return [parseFloat(el.style.left), parseFloat(el.style.top)];
}
function pintarFormada() {
  const txt = sel.map((i) => letras[i]).join('');
  document.getElementById('formada').innerHTML = txt ? '<span>' + esc(txt) + '</span>' : '<span class="vacio">Une las letras</span>';
  document.querySelectorAll('.letra').forEach((el) => el.classList.toggle('sel', sel.includes(Number(el.dataset.i))));
  const pts = sel.map(centroLetra).filter(Boolean).map((p) => p.join(',')).join(' ');
  document.getElementById('trazo').setAttribute('points', pts);
}
function mensaje(txt, tipo) {
  const m = document.getElementById('msg');
  m.textContent = txt;
  m.className = 'msg' + (tipo ? ' ' + tipo : '');
}
function letraEn(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.letra') : null; }
function inicioArrastre(e) {
  if (!juegoActivo) return;
  const el = e.target.closest && e.target.closest('.letra');
  if (!el) return;
  arrastrando = true;
  sel = [Number(el.dataset.i)];
  SND.letra(0);
  pintarFormada();
  try { document.getElementById('rueda').setPointerCapture(e.pointerId); } catch (err) {}
}
function moverArrastre(e) {
  if (!arrastrando) return;
  const el = letraEn(e.clientX, e.clientY);
  if (!el) return;
  const i = Number(el.dataset.i);
  if (sel.length > 1 && i === sel[sel.length - 2]) { sel.pop(); pintarFormada(); return; }
  if (!sel.includes(i)) { sel.push(i); SND.letra(sel.length - 1); pintarFormada(); }
}
function finArrastre() {
  if (!arrastrando) return;
  arrastrando = false;
  const palabra = sel.map((i) => letras[i]).join('');
  sel = [];
  pintarFormada();
  if (palabra.length >= 2) probar(palabra);
}
function sacudir() {
  const f = document.querySelector('#formada span');
  if (!f) return;
  f.classList.remove('sacude'); void f.offsetWidth; f.classList.add('sacude');
}
function probar(p) {
  const idx = NV.palabras.findIndex((x) => x.w === p);
  if (idx < 0) {
    tiempoMs = Math.max(0, tiempoMs - PENA_MS);
    mensaje('"' + p + '" no está aquí: −5 segundos', 'mal');
    SND.error();
    sacudir();
    pintarTiempo();
    return;
  }
  if (encontradas.has(p)) { mensaje('Ya encontraste "' + p + '".', ''); activa = idx; dibujarPista(); return; }
  encontradas.add(p);
  activa = idx;
  const esBase = p === NV.base;
  S.puntos += esBase ? PT.base : PT.palabra;
  if (!S.vocab.includes(p)) S.vocab.push(p);
  S.enCurso.enc = Array.from(encontradas);
  guardar();
  if (esBase) SND.base(); else SND.acierto();
  mensaje((esBase ? '¡Palabra base! +' + PT.base : '¡Muy bien! +' + PT.palabra) + ' ★', 'ok');
  if (encontradas.size === NV.palabras.length) { juegoActivo = false; dibujarPista(); setTimeout(completarNivel, 500); return; }
  const sig = NV.palabras.findIndex((x) => !encontradas.has(x.w));
  if (sig >= 0) activa = sig;
  dibujarPista();
}
function pistaDeLetra() {
  if (!juegoActivo) return;
  let p = NV.palabras[activa];
  if (!p || encontradas.has(p.w)) p = NV.palabras.find((x) => !encontradas.has(x.w));
  if (!p) return;
  if (S.puntos < PT.pista) { mensaje('Necesitas ' + PT.pista + ' ★ para una pista.', 'mal'); return; }
  for (let i = 0; i < p.w.length; i++) {
    const r = p.dir === 'H' ? p.r : p.r + i, c = p.dir === 'H' ? p.c + i : p.c;
    const k = r + ',' + c;
    if (!resuelta(k)) {
      reveladas.add(k);
      S.puntos -= PT.pista;
      S.enCurso.rev = Array.from(reveladas);
      guardar();
      SND.pista();
      mensaje('Pista: una letra de "' + p.w + '" en azul.', '');
      dibujarPista();
      return;
    }
  }
}
function pintarTiempo() {
  const el = document.getElementById('g-tiempo');
  document.getElementById('g-tiempo-t').textContent = mmss(tiempoMs);
  el.classList.toggle('poco', tiempoMs <= 15000);
}
function completarNivel() {
  juegoActivo = false;
  const numero = NV.n;
  const bono = PT.nivel + 10 * S.vidas;
  S.puntos += bono;
  S.completados = Math.max(S.completados, numero);
  S.enCurso = null;
  guardar();
  const ci = capDe(numero);
  const v = VERSOS[(numero - 1) % VERSOS.length];
  if (numero === CAPS[ci].fin) {
    const cap = CAPS[ci];
    SND.capitulo();
    abrirHoja('<h3>¡Capítulo completado!</h3><p class="sub">Reclama tu cuadro</p>' + mosaicoHtml(cap.cuadro, 20, true) + '<b style="font-size:18px">' + esc(cap.nombre) + '</b><p>' + esc(cap.desc) + '</p><button class="boton" type="button" data-accion="reclamar">RECLAMAR</button>');
    return;
  }
  SND.nivel();
  abrirHoja('<h3>¡Felicidades!</h3><p class="estrellas">★ ★ ★</p><p>Nivel ' + numero + ' completado · <b>+' + bono + ' ★</b></p>' +
    '<div class="versiculo">“' + v.t + '”<small>' + v.r + '</small></div>' +
    (numero < NIVELES.length ? '<button class="boton" type="button" data-accion="siguiente">NIVEL ' + (numero + 1) + '</button>' : '') +
    '<button class="boton sec" type="button" data-accion="mapa">Volver al mapa</button>');
}
function tiempoAgotado() {
  juegoActivo = false;
  SND.tiempo();
  S.vidas = Math.max(0, S.vidas - 1);
  S.enCurso = null;
  guardar();
  const n = NV ? NV.n : 1;
  if (S.vidas > 0) {
    abrirHoja('<h3>Se acabó el tiempo</h3><p>Perdiste una vida. Te quedan <b>' + S.vidas + '</b>.</p><div class="versiculo">“Velad y orad en todo tiempo.”<small>Lucas 21, 36</small></div><button class="boton" type="button" data-accion="reintentar" data-n="' + n + '">Reintentar</button><button class="boton sec" type="button" data-accion="mapa">Volver al mapa</button>');
  } else {
    abrirHoja('<h3>Sin vidas</h3><p>Se acabó el tiempo y no te quedan vidas.</p><p>Se recupera una en <b>' + mmss(faltaVida()) + '</b>.</p><button class="boton sec" type="button" data-accion="mapa">Volver al mapa</button>');
  }
}

// ---------- Eventos ----------
const rueda = document.getElementById('rueda');
rueda.addEventListener('pointerdown', inicioArrastre);
rueda.addEventListener('pointermove', moverArrastre);
rueda.addEventListener('pointerup', finArrastre);
rueda.addEventListener('pointercancel', finArrastre);
document.getElementById('btn-mezclar').onclick = () => { SND.mezclar(); letras = barajar(letras); sel = []; dibujarRueda(); };
document.getElementById('btn-borrar').onclick = () => { sel = []; pintarFormada(); };
document.getElementById('btn-pista').onclick = pistaDeLetra;
document.getElementById('btn-salir').onclick = salirAlMapa;
const bc = document.getElementById('btn-cerrar-juego');
if (window.parent === window) bc.style.display = 'none';
bc.onclick = () => { try { window.parent.postMessage({ tipo: 'juma-cerrar' }, location.origin); } catch (e) {} };
document.getElementById('btn-jugar').onclick = () => abrirNivel(nivelActual());
document.getElementById('btn-capitulos').onclick = verCapitulos;
document.getElementById('btn-relicario').onclick = verRelicario;
document.getElementById('btn-ayuda').onclick = verAyuda;
document.getElementById('tablero').addEventListener('click', (e) => {
  const c = e.target.closest('.ficha');
  if (!c || !NV || !juegoActivo) return;
  const info = celdas.get(c.dataset.k);
  if (!info) return;
  const pos = info.idx.indexOf(activa);
  activa = info.idx[(pos + 1) % info.idx.length];
  dibujarPista();
});
document.getElementById('fondo').addEventListener('click', (e) => {
  if (e.target.id === 'fondo') { if (document.getElementById('hoja').dataset.bloqueo !== '1') cerrarHoja(); return; }
  const b = e.target.closest('[data-accion],[data-cerrar],[data-nivel]');
  if (!b) return;
  if (b.dataset.cerrar !== undefined) { cerrarHoja(); return; }
  if (b.dataset.nivel) { cerrarHoja(); abrirNivel(Number(b.dataset.nivel)); return; }
  const a = b.dataset.accion;
  if (a === 'mapa') { cerrarHoja(); salirAlMapa(); return; }
  if (a === 'reclamar') { cerrarHoja(); salirAlMapa(); return; }
  if (a === 'siguiente') { cerrarHoja(); abrirNivel(NV.n + 1); return; }
  if (a === 'reintentar') { cerrarHoja(); abrirNivel(Number(b.dataset.n)); return; }
});
window.addEventListener('resize', () => { if (NV && juegoActivo) dibujarTablero(); });

// Reloj: descuenta el tiempo del nivel y revisa las vidas
setInterval(() => {
  const ahora = Date.now();
  if (juegoActivo && NV) {
    tiempoMs -= (ahora - ultimoTick);
    if (tiempoMs <= 0) { tiempoMs = 0; pintarTiempo(); tiempoAgotado(); }
    else { pintarTiempo(); const seg = Math.ceil(tiempoMs / 1000); if (tiempoMs <= 10000 && seg !== ultimoSeg) { ultimoSeg = seg; SND.tic(); } }
  }
  ultimoTick = ahora;
  const antes = S.vidas;
  regenerarVidas();
  if (S.vidas !== antes) { guardar(); }
  if (!juegoActivo) {
    if (document.getElementById('vista-mapa').style.display !== 'none') pintarMapa();
  }
  const cv = document.getElementById('cuenta-vida'); if (cv) cv.textContent = mmss(faltaVida());
}, 250);

cargar();
pintarMapa();
mostrarVista('mapa');
</script>
