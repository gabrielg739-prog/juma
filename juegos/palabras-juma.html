<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A235C">
<title>Palabras JUMA</title>
<style>
  :root {
    --azul: #0A235C; --azul-2: #1E4FD8; --azul-3: #DCE7FF;
    --oro: #F5C518; --oro-2: #B88A00; --crema: #FFFBF0; --papel: #FFF8E7;
    --ink: #0F1B3D; --muted: #5B6785; --linea: rgba(10,35,92,.14);
    --ok: #15803D; --mal: #B91C1C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -180px, rgba(30,79,216,.55), transparent 70%),
      linear-gradient(180deg, #0A235C 0%, #071845 100%);
    min-height: 100%;
    overflow-x: hidden;
  }
  button { font: inherit; cursor: pointer; border: 0; }
  button:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
  .app { max-width: 520px; margin: 0 auto; padding: 12px 14px 26px; min-height: 100vh; display: flex; flex-direction: column; gap: 14px; color: #fff; }

  /* Cabecera */
  .top { display: flex; align-items: center; gap: 8px; }
  .icono-btn { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.16); }
  .titulo { flex: 1; min-width: 0; }
  .titulo small { display: block; opacity: .75; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .titulo b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 6px 11px; font-weight: 800; font-size: 14px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .pill .ico { color: var(--oro); }
  .corazones { letter-spacing: 1px; color: #FF6B8A; }
  .corazones .vacio { color: rgba(255,255,255,.3); }

  /* Tarjetas y botones */
  .tarjeta { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; padding: 14px; }
  .btn { background: var(--oro); color: #1B1400; border-radius: 14px; padding: 12px 16px; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 var(--oro-2); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--oro-2); }
  .btn.sec { background: rgba(255,255,255,.1); color: #fff; box-shadow: none; border: 1px solid rgba(255,255,255,.2); }
  .btn.blanco { background: #fff; color: var(--azul); box-shadow: 0 3px 0 #C9D4EE; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-fila { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 0; letter-spacing: -.01em; }
  .sub { margin: 4px 0 0; opacity: .85; font-size: 14.5px; line-height: 1.45; }

  /* Mapa de niveles */
  .cap-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .cap-cab h2 { margin: 0; font-size: 17px; color: var(--oro); }
  .cap-cab span { font-size: 12.5px; opacity: .8; white-space: nowrap; }
  .grid-niveles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .nv { aspect-ratio: 1; border-radius: 14px; background: #fff; color: var(--azul); font-weight: 900; font-size: 16px; box-shadow: 0 3px 0 #C9D4EE; }
  .nv.hecho { background: var(--ok); color: #fff; box-shadow: 0 3px 0 #0E5A2A; }
  .nv.actual { background: var(--oro); color: #1B1400; box-shadow: 0 3px 0 var(--oro-2), 0 0 0 4px rgba(245,197,24,.35); }
  .nv:disabled { background: rgba(255,255,255,.1); color: rgba(255,255,255,.4); box-shadow: none; }
  .mosaico { width: 100%; max-width: 200px; aspect-ratio: 4/5; margin: 12px auto 0; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(5,1fr); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .pieza { background-repeat: no-repeat; background-size: 400% 500%; background-color: rgba(10,35,92,.9); }
  .pieza.off { background-image: none !important; background-color: rgba(10,35,92,.9); }
  .pieza.off::after { content: ""; display: block; width: 100%; height: 100%; background: repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px); }
  .santo { text-align: center; font-size: 14px; margin-top: 8px; opacity: .9; }
  .aviso { font-size: 14px; line-height: 1.45; }

  /* Juego */
  .papel { background: var(--papel); color: var(--ink); border-radius: 22px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 0 1px rgba(184,138,0,.25); }
  .tablero-wrap { display: flex; justify-content: center; min-height: 120px; }
  .tablero { position: relative; }
  .celda { position: absolute; border-radius: 7px; background: #fff; border: 1.5px solid #D5DBEA; display: grid; place-items: center; font-weight: 900; color: var(--azul); user-select: none; transition: background .2s, transform .2s; }
  .celda.resuelta { background: var(--azul-2); border-color: var(--azul-2); color: #fff; }
  .celda.pista { background: var(--oro); border-color: var(--oro-2); color: #1B1400; }
  .celda.activa { box-shadow: 0 0 0 3px var(--oro); z-index: 2; }
  .celda .n { position: absolute; top: 2px; left: 4px; font-size: 9px; font-weight: 800; color: var(--muted); }
  .celda.resuelta .n { color: rgba(255,255,255,.8); }
  .celda.nuevo { animation: aparece .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes aparece { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .pista-box { border-radius: 14px; background: #fff; border: 1px solid var(--linea); padding: 10px 12px; font-size: 14.5px; line-height: 1.4; min-height: 64px; }
  .pista-box small { display: block; font-weight: 800; color: var(--azul-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .msg { min-height: 22px; text-align: center; font-weight: 800; font-size: 15px; }
  .msg.ok { color: var(--ok); }
  .msg.mal { color: var(--mal); }
  .pill-palabra { min-height: 46px; display: flex; align-items: center; justify-content: center; }
  .pill-palabra span { background: #fff; color: var(--azul); border-radius: 14px; padding: 8px 18px; font-size: 22px; font-weight: 900; letter-spacing: 3px; box-shadow: 0 3px 0 #C9D4EE; text-transform: uppercase; min-width: 70px; text-align: center; }
  .pill-palabra span.vacia { background: rgba(255,255,255,.12); color: rgba(255,255,255,.55); box-shadow: none; font-size: 14px; letter-spacing: 0; font-weight: 700; }
  .pill-palabra span.error { background: #FEE2E2; color: var(--mal); }
  .rueda { position: relative; width: 280px; height: 280px; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .rueda-fondo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.14), rgba(255,255,255,.04) 70%); border: 1px solid rgba(255,255,255,.14); }
  .letra { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #fff; color: var(--azul); font-weight: 900; font-size: 24px; display: grid; place-items: center; box-shadow: 0 4px 0 #C9D4EE; transition: transform .12s, background .12s; }
  .letra.sel { background: var(--oro); color: #1B1400; box-shadow: 0 4px 0 var(--oro-2); transform: scale(1.1); }
  .rueda-centro { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .rueda-centro button { background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 13px; border: 1px solid rgba(255,255,255,.2); }
  .acciones { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .acciones .btn { padding: 11px 6px; font-size: 13.5px; }
  .sacudir { animation: sacudir .38s; }
  @keyframes sacudir { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* Ventanas */
  .ov { position: fixed; inset: 0; background: rgba(4,12,35,.72); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .ov.on { display: flex; }
  .caja { background: #fff; color: var(--ink); border-radius: 22px; padding: 20px; width: 100%; max-width: 380px; max-height: 88vh; overflow: auto; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .caja h3 { margin: 0 0 6px; color: var(--azul); font-size: 21px; }
  .caja p { margin: 6px 0; font-size: 15px; line-height: 1.45; }
  .verso { font-style: italic; background: var(--crema); border: 1px solid rgba(184,138,0,.3); border-radius: 14px; padding: 12px; margin: 12px 0; font-size: 15px; line-height: 1.45; }
  .verso small { display: block; font-style: normal; font-weight: 800; color: var(--muted); margin-top: 6px; font-size: 12.5px; }
  .cuadro { width: 100%; aspect-ratio: 4/5; max-width: 240px; margin: 10px auto; border-radius: 14px; background: linear-gradient(135deg,#1E4FD8,#F5C518) center/cover no-repeat; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .lista-dic { text-align: left; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .entrada { border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; }
  .entrada b { color: var(--azul); font-size: 16px; letter-spacing: 1px; }
  .entrada p { margin: 4px 0 0; font-size: 14px; line-height: 1.4; }
  .entrada i { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .entrada.bloq { background: #F3F5FA; color: var(--muted); }
  .cerrar { background: var(--azul); color: #fff; border-radius: 14px; padding: 11px 18px; font-weight: 800; margin-top: 12px; width: 100%; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <button class="icono-btn" id="btn-atras" type="button" aria-label="Volver al mapa">←</button>
    <div class="titulo"><small id="t-cap">Palabras JUMA</small><b id="t-nivel">Niveles</b></div>
    <div class="pill" title="Puntos misioneros"><span class="ico">★</span><span id="t-pts">0</span></div>
    <div class="pill corazones" id="t-vidas" title="Vidas" aria-label="Vidas">♥♥♥♥♥</div>
  </header>

  <!-- MAPA -->
  <section id="vista-mapa" style="display:flex;flex-direction:column;gap:14px">
    <div>
      <h1>Palabras JUMA</h1>
      <p class="sub">Forma palabras con las letras de la rueda y completa el crucigrama. Cada nivel cuesta una vida. Al terminar cada capítulo armas un cuadro.</p>
    </div>
    <div class="tarjeta aviso" id="aviso-vidas" style="display:none"></div>
    <div id="capitulos" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="btn-fila"><button class="btn sec" id="btn-dic-mapa" type="button">Venezolario Católico</button></div>
  </section>

  <!-- JUEGO -->
  <section id="vista-juego" style="display:none;flex-direction:column;gap:14px">
    <div class="papel">
      <div class="tablero-wrap"><div class="tablero" id="tablero"></div></div>
    </div>
    <div class="pista-box" id="pista-box"></div>
    <div class="msg" id="msg"></div>
    <div class="pill-palabra" id="pill"></div>
    <div class="rueda" id="rueda"><div class="rueda-fondo"></div><div class="rueda-centro"><button type="button" id="btn-mezclar">↻ Mezclar</button></div></div>
    <div class="acciones">
      <button class="btn sec" id="btn-pista" type="button">Pista de letra<br><small>−15 ★</small></button>
      <button class="btn sec" id="btn-borrar" type="button">Borrar</button>
      <button class="btn sec" id="btn-dic" type="button">Venezolario</button>
    </div>
  </section>
</div>

<div class="ov" id="ov"><div class="caja" id="caja"></div></div>

  const pasan = Math.floor((ahora - S.ultimaVida) / INTERVALO);
  if (pasan > 0) {
    S.vidas = Math.min(MAX_VIDAS, S.vidas + pasan);

function pintarMapa() {

function abrirNivel(n) {

    if (S.vidas <= 0) { sinVidas(); return; }

  }
  NV = nv;
  encontradas = new Set(S.enCurso.encontradas);

function construirCeldas() {

  NV.palabras.forEach((p, idx) => {
    for (let i = 0; i < p.w.length; i++) {
      const r = p.dir === 'H' ? p.r : p.r + i, c = p.dir === 'H' ? p.c + i : p.c;
      const k = r + ',' + c;
      if (!celdas.has(k)) celdas.set(k, { ch: p.w[i], idx: [] });
      celdas.get(k).idx.push(idx);
    }
  });
}
function resuelta(k) {

}

  const actKeys = new Set();
  if (act) for (let i = 0; i < act.w.length; i++) actKeys.add((act.dir === 'H' ? act.r : act.r + i) + ',' + (act.dir === 'H' ? act.c + i : act.c));

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dibujarRueda() {

function pistaDeLetra() {
  let p = NV.palabras[activa];
  if (!p || encontradas.has(p.w)) p = NV.palabras.find((x) => !encontradas.has(x.w));
  if (!p) return;
  if (S.puntos < PT.pista) { mensaje('Necesitas ' + PT.pista + ' ★ para una pista.', 'mal'); return; }
  for (let i = 0; i < p.w.length; i++) {
    const r = p.dir === 'H' ? p.r : p.r + i, c = p.dir === 'H' ? p.c + i : p.c;
    const k = r + ',' + c;
    if (!resuelta(k)) {
      reveladas.add(k);
      S.puntos -= PT.pista;
      S.enCurso.reveladas = Array.from(reveladas);
      guardar();
      mensaje('Pista: una letra de "' + p.w + '" está marcada en dorado.', '');
      dibujarTablero();
      pintarCabecera();
      return;
    }
  }
}
function completarNivel() {
  const numero = NV.n;
  const bono = PT.nivel + 10 * S.vidas;
  S.puntos += bono;
  S.completados = Math.max(S.completados, numero);
  S.enCurso = null;
  const ci = capDe(numero);
  const finCap = numero === CAPS[ci].fin;
  let extra = '';
  if (finCap) {
    S.puntos += PT.cuadro;
    extra = '<p><b>¡Capítulo completado!</b> Armaste el cuadro de <b>' + CAPS[ci].santo + '</b>. +' + PT.cuadro + ' ★</p><div class="cuadro" style="background-image:url(' + CAPS[ci].cuadro + ')"></div>';
  }
  guardar();
  const v = VERSOS[(numero - 1) % VERSOS.length];
  const hayMas = numero < NIVELES.length;
  abrirCaja(
    '<h3>¡Nivel ' + numero + ' completado!</h3>' +
    '<p>+' + bono + ' puntos misioneros</p>' + extra +
    '<div class="verso">“' + v.t + '”<small>' + v.r + '</small></div>' +
    '<div class="btn-fila">' +
      '<button class="btn sec" style="color:var(--azul);background:#fff;border-color:#C9D4EE" data-accion="mapa" type="button">Ver mapa</button>' +
      (hayMas ? '<button class="btn" data-accion="siguiente" type="button">Siguiente nivel</button>' : '') +
    '</div>'
  );
}
function sinVidas() {
  abrirCaja('<h3>Sin vidas por ahora</h3><p>Se recupera una vida cada ' + MIN_VIDA + ' minutos.</p><p>Próxima vida en <b id="cuenta2">' + mmss(faltaVida()) + '</b></p><button class="cerrar" data-accion="cerrar" type="button">Entendido</button>');
}
function abrirCaja(html) {
  document.getElementById('caja').innerHTML = html;
  document.getElementById('ov').classList.add('on');
}
function cerrarCaja() { document.getElementById('ov').classList.remove('on'); }
function verDiccionario() {
  const total = TOTAL_PALABRAS, sabidas = S.vocab.length;
  const porPalabra = new Map();
  NIVELES.forEach((n) => n.palabras.forEach((p) => { if (!porPalabra.has(p.w)) porPalabra.set(p.w, p); }));
  let lista = '';
  const ordenadas = Array.from(porPalabra.values()).sort((a, b) => a.w.localeCompare(b.w, 'es'));
  ordenadas.forEach((p) => {
    if (S.vocab.includes(p.w)) {
      lista += '<div class="entrada"><b>' + p.w + '</b><p>' + esc(p.pista) + '</p><i>' + esc(p.nota) + '</i></div>';
    } else {
      lista += '<div class="entrada bloq"><b>' + '· '.repeat(Math.max(3, p.w.length)).trim() + '</b><p>Palabra por descubrir.</p></div>';
    }
  });
  abrirCaja('<h3>Venezolario Católico</h3><p>Palabras descubiertas: <b>' + sabidas + '</b> de ' + total + '</p><div class="lista-dic">' + lista + '</div><button class="cerrar" data-accion="cerrar" type="button">Cerrar</button>');
}

// ---------- Eventos ----------
const rueda = document.getElementById('rueda');
rueda.addEventListener('pointerdown', inicioArrastre);
rueda.addEventListener('pointermove', moverArrastre);
rueda.addEventListener('pointerup', finArrastre);
rueda.addEventListener('pointercancel', finArrastre);
document.getElementById('btn-mezclar').onclick = () => { letras = barajar(letras); sel = []; dibujarRueda(); };
document.getElementById('btn-borrar').onclick = () => { sel = []; pintarPalabraFormada(); };
document.getElementById('btn-pista').onclick = pistaDeLetra;
document.getElementById('btn-dic').onclick = verDiccionario;
document.getElementById('btn-dic-mapa').onclick = verDiccionario;
document.getElementById('btn-atras').onclick = () => { if (document.getElementById('vista-juego').style.display !== 'none') volverMapa(); };
function volverMapa() { NV = null; pintarMapa(); mostrarVista('mapa'); document.getElementById('t-cap').textContent = 'Palabras JUMA'; document.getElementById('t-nivel').textContent = 'Niveles'; }
document.getElementById('capitulos').addEventListener('click', (e) => {
  const b = e.target.closest('[data-nivel]');
  if (b && !b.disabled) abrirNivel(Number(b.dataset.nivel));
});
document.getElementById('tablero').addEventListener('click', (e) => {
  const c = e.target.closest('.celda');
  if (!c || !NV) return;
  const k = c.dataset.k;
  const info = celdas.get(k);
  if (!info) return;
  // Toca una casilla: elige la palabra que pasa por ella; si hay dos, alterna
  const opciones = info.idx;
  const pos = opciones.indexOf(activa);
  activa = opciones[(pos + 1) % opciones.length];
  dibujarPista();
});
document.getElementById('ov').addEventListener('click', (e) => {
  if (e.target.id === 'ov') return cerrarCaja();
  const b = e.target.closest('[data-accion]');
  if (!b) return;
  const a = b.dataset.accion;
  if (a === 'cerrar') cerrarCaja();
  if (a === 'mapa') { cerrarCaja(); volverMapa(); }
  if (a === 'siguiente') { cerrarCaja(); abrirNivel(NV.n + 1); }
});
window.addEventListener('resize', () => { if (NV) dibujarTablero(); });
setInterval(() => {
  const antes = S.vidas;
  regenerarVidas();
  if (S.vidas !== antes) { guardar(); pintarCabecera(); }
  const c = document.getElementById('cuenta'); if (c) c.textContent = mmss(faltaVida());
  const c2 = document.getElementById('cuenta2'); if (c2) c2.textContent = mmss(faltaVida());
}, 1000);

cargar();
pintarMapa();
mostrarVista('mapa');
</script>
