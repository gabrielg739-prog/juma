            <span class="mobile-ctrl-inner">
              <span id="btn-usar-icono" class="mobile-ctrl-objeto">✦</span>
              <span class="mobile-ctrl-label">PODER</span>
            </span>
          </button>
        </div>
        <div class="mobile-ctrl-cluster mobile-pedal-cluster" role="group" aria-label="Acelerar y frenar">
          <button id="btn-touch-accel" class="mobile-ctrl-btn mobile-ctrl-accel" type="button" data-control="forward" aria-label="Acelerar">
            <span class="mobile-ctrl-inner">
              <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 13 12 8 7 13"></polyline><polyline points="17 18 12 13 7 18" opacity="0.45"></polyline></svg>
              <span class="mobile-ctrl-label">ACELERAR</span>
            </span>
          </button>
          <button id="btn-touch-brake" class="mobile-ctrl-btn mobile-ctrl-brake" type="button" data-control="backward" aria-label="Frenar">
            <span class="mobile-ctrl-inner">
              <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 8 12 13 17 8"></polyline><line x1="7" y1="17" x2="17" y2="17"></line></svg>
              <span class="mobile-ctrl-label">FRENAR</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- Cinemáticas: franjas de cine, títulos y subtítulos -->
    <div id="cine" class="cine oculto" aria-live="polite">
      <div class="cine-franja arriba"></div>
      <div class="cine-franja abajo"></div>
      <div class="cine-titulo">
        <div id="cine-antetitulo" class="cine-antetitulo"></div>
        <h1 id="cine-titulo"></h1>
        <div id="cine-subtitulo" class="cine-subtitulo"></div>
      </div>
      <div id="cine-rotulo" class="cine-rotulo"></div>
      <div id="cine-saltar" class="cine-saltar">Toca o pulsa Enter para saltar ▸</div>
    </div>

    <!-- Menú -->
    <div id="menu" class="menu">
      <div class="menu-panel" id="menu-panel"></div>
    </div>

    <!-- Paneles de resultados, copa y pausa (se rellenan desde el juego) -->
    <div id="panel" class="welcome-dialog-overlay panel oculto" role="dialog">
      <div class="welcome-dialog-card panel-card" id="panel-card"></div>
    </div>

    <!-- Carga de mundo -->
    <div id="cargando" class="cargando oculto">
      <div class="cargando-cruz">✝</div>
      <div id="cargando-titulo" class="cargando-titulo">Preparando el circuito…</div>
      <div id="cargando-cita" class="cargando-cita"></div>
      <div class="cargando-barra"><span id="cargando-progreso"></span></div>
    </div>

    <div id="girar" class="girar oculto">
      <div class="girar-tel" aria-hidden="true">📱</div>
      <p>Gira el teléfono en horizontal para correr</p>
    </div>

  </body>
</html>
