<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2c7be5">
<title>Huyendo del pecado · JUMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
  :root {
    --oro: #ffc83d; --oro-osc: #a86a00;
    --azul: #2f8ff0; --azul-osc: #134c94;
    --verde: #5ccf3e; --verde-osc: #23701a;
    --rojo: #f0473c;
    --tinta: #0b1030;
    --texto: #ffffff;
    --f-titulo: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --f-texto: "Nunito", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --contorno: 0 2px 0 var(--tinta), 2px 0 0 var(--tinta), -2px 0 0 var(--tinta), 0 -2px 0 var(--tinta), 1.5px 1.5px 0 var(--tinta), -1.5px 1.5px 0 var(--tinta), 1.5px -1.5px 0 var(--tinta), -1.5px -1.5px 0 var(--tinta), 0 5px 0 rgba(11, 16, 48, .45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc6f0; color: var(--texto); font-family: var(--f-texto); user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .contorno { text-shadow: var(--contorno); }

  /* ---------- Pantalla de carga ---------- */
  .carga { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; padding: 24px; background: linear-gradient(#3a8ee2, #8cc6f0 60%, #cde6f5); transition: opacity .35s var(--ease); }
  .carga.fuera { opacity: 0; pointer-events: none; }
  .carga-titulo { font-family: var(--f-titulo); font-size: clamp(34px, 9vw, 56px); text-shadow: var(--contorno); }
  .carga-txt { margin-top: 10px; font-weight: 800; font-size: 15px; text-shadow: 0 2px 6px rgba(0, 0, 0, .35); max-width: 320px; }

  /* ---------- Marcador durante la carrera ---------- */
  .hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .25s var(--ease); }
  .hud.on { opacity: 1; }
  .b-pausa { position: absolute; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); width: 50px; height: 50px; border-radius: 15px; border: 3px solid #fff; background: linear-gradient(#58b6ff, #1f6fd6); box-shadow: 0 4px 0 var(--azul-osc), 0 8px 16px rgba(0, 0, 0, .25); pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s var(--ease); }
  .b-pausa i { width: 6px; height: 18px; border-radius: 2px; background: #fff; }
  .b-pausa:active { transform: translateY(3px); }
  .marcador { position: absolute; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); text-align: right; }
  .fila-pts { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .mult { font-family: var(--f-titulo); font-size: 19px; padding: 3px 10px 1px; border-radius: 999px; color: #5a3300; background: linear-gradient(#ffe680, #f2a91b); box-shadow: 0 3px 0 var(--oro-osc); transition: transform .2s var(--ease); }
  .mult.doble { background: linear-gradient(#ffffff, #8fe0ff); color: #0b4a7a; box-shadow: 0 3px 0 #1b6aa0; transform: scale(1.12); }
  .pts { font-family: var(--f-titulo); font-size: 34px; font-variant-numeric: tabular-nums; }
  .fila-mon { margin-top: 2px; display: flex; align-items: center; justify-content: flex-end; gap: 7px; font-family: var(--f-titulo); font-size: 25px; font-variant-numeric: tabular-nums; }
  .ico-moneda { position: relative; width: 25px; height: 25px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #fff6b8, #ffcc33 55%, #d48a0a); border: 2px solid #9a5c00; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .ico-moneda::before, .ico-moneda::after { content: ""; position: absolute; background: #fff3a8; border-radius: 1px; }
  .ico-moneda::before { left: 9px; top: 3px; width: 3px; height: 15px; }
  .ico-moneda::after { left: 5px; top: 7px; width: 11px; height: 3px; }
  .poderes { position: absolute; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 7px; }
  .poder { position: relative; overflow: hidden; display: flex; align-items: center; gap: 7px; width: 168px; height: 36px; padding: 0 10px 0 3px; border-radius: 999px; background: rgba(11, 16, 48, .72); border: 2px solid rgba(255, 255, 255, .55); font-weight: 900; font-size: 12.5px; line-height: 1.05; }
  .poder img { width: 30px; height: 30px; flex: none; }
  .poder .barra { position: absolute; left: 0; bottom: 0; width: 100%; height: 4px; background: var(--c, #ffc83d); transform-origin: left center; }
  .b-escudo { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; pointer-events: auto; background: radial-gradient(circle at 50% 38%, #fff8d6, #ffc83d 58%, #c98200); box-shadow: 0 5px 0 var(--oro-osc), 0 0 22px rgba(255, 200, 61, .55); transition: transform .12s var(--ease), filter .2s; }
  .b-escudo:active { transform: translateY(3px); }
  .b-escudo .halo { position: absolute; left: 50%; top: 50%; width: 36px; height: 14px; margin: -7px 0 0 -18px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 0 8px #fff; }
  .b-escudo b { position: absolute; right: -6px; bottom: -6px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; border: 2px solid #fff; background: var(--rojo); font-family: var(--f-titulo); font-weight: 400; font-size: 15px; display: grid; place-items: center; }
  .b-escudo.vacio { filter: grayscale(1) brightness(.85); opacity: .6; }
  .b-escudo.activo { box-shadow: 0 5px 0 var(--oro-osc), 0 0 34px 8px rgba(255, 220, 110, .85); }
  .avisos { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 100px); transform: translateX(-50%); width: min(92vw, 420px); display: grid; gap: 6px; justify-items: center; }
  .aviso { font-family: var(--f-titulo); font-size: 24px; text-align: center; text-shadow: var(--contorno); animation: aviso 2s var(--ease) forwards; }
  .aviso small { display: block; margin-top: 2px; font-family: var(--f-texto); font-weight: 900; font-size: 14px; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); }
  .aviso.oro { color: var(--oro); }
  @keyframes aviso { 0% { opacity: 0; transform: translateY(10px) scale(.94); } 10% { opacity: 1; transform: none; } 78% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px); } }
  .tuto { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); font-size: 13px !important; max-width: 300px; transform: translateX(-50%); width: min(90vw, 360px); padding: 12px 16px; border-radius: 18px; background: rgba(11, 16, 48, .78); border: 2px solid rgba(255, 255, 255, .35); font-weight: 900; font-size: 15px; display: grid; gap: 6px; transition: opacity .4s var(--ease); }
  .tuto.fuera { opacity: 0; }
  .tuto .fl { display: inline-block; min-width: 54px; color: var(--oro); font-family: var(--f-titulo); font-weight: 400; font-size: 18px; }

  /* ---------- Menú ---------- */
  .capa { position: fixed; inset: 0; z-index: 10; }
  .menu { display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  .cabecera { padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0; text-align: center; }
  .titulo { margin: 0; font-family: var(--f-titulo); font-weight: 400; line-height: .9; transform: rotate(-3deg); text-shadow: var(--contorno); }
  .titulo span { display: block; }
  .titulo .t1 { font-size: clamp(40px, 12vw, 66px); }
  .titulo .t2 { font-size: clamp(20px, 5.5vw, 30px); color: var(--oro); }
  .titulo .t3 { font-size: clamp(44px, 13vw, 72px); color: #ff7a4a; }
  .lema { margin: 10px auto 0; max-width: 300px; font-weight: 900; font-size: 14px; text-shadow: 0 2px 6px rgba(0, 0, 0, .55); }
  .hoja { pointer-events: auto; width: min(100%, 520px); max-height: 58vh; max-height: 58dvh; overflow: auto; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); border-radius: 26px 26px 0 0; background: linear-gradient(180deg, rgba(23, 32, 84, .95), rgba(13, 18, 50, .98)); border: 2px solid rgba(255, 255, 255, .16); border-bottom: 0; box-shadow: 0 -12px 34px rgba(0, 0, 0, .35); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 8px 4px 6px; border-radius: 14px; background: rgba(255, 255, 255, .08); text-align: center; }
  .stat small { display: block; font-size: 11px; font-weight: 800; opacity: .8; }
  .stat b { font-family: var(--f-titulo); font-weight: 400; font-size: 21px; color: var(--oro); font-variant-numeric: tabular-nums; }
  .btn { display: block; width: 100%; margin-top: 10px; padding: 13px 14px; border: 0; border-radius: 18px; font-family: var(--f-titulo); font-weight: 400; font-size: 21px; color: #fff; background: linear-gradient(#7ee05a, #3aa62a); box-shadow: 0 5px 0 var(--verde-osc); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); transition: transform .12s var(--ease), box-shadow .12s var(--ease); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--verde-osc); }
  .btn.grande { margin: 14px 0 14px; padding: 15px; font-size: 30px; }
  .btn.oro { color: #4a2b00; text-shadow: none; background: linear-gradient(#ffe680, #f2a91b); box-shadow: 0 5px 0 var(--oro-osc); }
  .btn.gris { background: rgba(255, 255, 255, .14); box-shadow: 0 5px 0 rgba(0, 0, 0, .35); }
  .btn[disabled] { filter: grayscale(.85); opacity: .5; pointer-events: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 4px; border-radius: 15px; background: rgba(0, 0, 0, .28); }
  .tabs button { padding: 9px 4px; border: 0; border-radius: 11px; background: transparent; font-weight: 900; font-size: 14px; color: rgba(255, 255, 255, .72); transition: background-color .15s ease, color .15s ease; }
  .tabs button[aria-selected="true"] { background: var(--azul); color: #fff; box-shadow: 0 3px 0 var(--azul-osc); }
  .tab { padding-top: 6px; }
  .nota { margin: 10px 2px; font-size: 13px; font-weight: 800; opacity: .82; line-height: 1.4; }
  .mult-info { margin: 12px 2px 4px; font-weight: 900; font-size: 15px; }
  .mult-info b { color: var(--oro); font-family: var(--f-titulo); font-weight: 400; font-size: 20px; }
  .mision { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  .mision .chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .4); display: grid; place-items: center; font-weight: 900; }
  .mision.hecha .chk { background: var(--verde); border-color: #fff; }
  .mision .mtxt { font-weight: 900; font-size: 14px; }
  .mision small { font-size: 12px; font-weight: 800; opacity: .75; font-variant-numeric: tabular-nums; }
  .prog { height: 8px; margin: 5px 0 2px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffe680, #f2a91b); }
  .item-tienda { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  .item-tienda img { width: 46px; height: 46px; }
  .item-tienda b { font-size: 15px; font-weight: 900; }
  .item-tienda small { display: block; font-size: 12px; font-weight: 800; opacity: .78; line-height: 1.35; }
  .pips { display: flex; gap: 4px; margin-top: 5px; }
  .pips i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .18); }
  .pips i.on { background: var(--verde); }
  .btn-mini { padding: 9px 11px; border: 0; border-radius: 12px; font-weight: 900; font-size: 13px; color: #4a2b00; white-space: nowrap; background: linear-gradient(#ffe680, #f2a91b); box-shadow: 0 3px 0 var(--oro-osc); transition: transform .12s var(--ease); }
  .btn-mini:active { transform: translateY(2px); }
  .btn-mini[disabled] { filter: grayscale(1); opacity: .45; pointer-events: none; }
  .ajuste { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid rgba(255, 255, 255, .08); font-weight: 900; font-size: 15px; }
  .interruptor { position: relative; flex: none; width: 54px; height: 30px; border: 0; border-radius: 15px; background: rgba(255, 255, 255, .22); transition: background-color .2s ease; }
  .interruptor::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
  .interruptor[aria-pressed="true"] { background: var(--verde); }
  .interruptor[aria-pressed="true"]::after { transform: translateX(24px); }
  .segmentado { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(0, 0, 0, .28); }
  .segmentado button { padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; font-weight: 900; font-size: 13px; color: rgba(255, 255, 255, .75); }
  .segmentado button[aria-pressed="true"] { background: var(--azul); color: #fff; }
  .como { margin-top: 12px; font-size: 13.5px; font-weight: 800; line-height: 1.45; }
  .como ul { margin: 6px 0 0; padding-left: 18px; }
  .como li { margin: 4px 0; }

  /* ---------- Paneles (pausa y final) ---------- */
  .centro { display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 30, .42); }
  .panel { width: min(100%, 400px); max-height: 92vh; max-height: 92dvh; overflow: auto; padding: 22px 18px 18px; text-align: center; border-radius: 26px; background: linear-gradient(180deg, rgba(23, 32, 84, .96), rgba(13, 18, 50, .98)); border: 2px solid rgba(255, 255, 255, .2); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); animation: entrar .3s var(--ease); }
  @keyframes entrar { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  .panel h2 { margin: 0 0 6px; font-family: var(--f-titulo); font-weight: 400; font-size: 30px; }
  .gran-pts { font-family: var(--f-titulo); font-size: 54px; line-height: 1; color: var(--oro); text-shadow: var(--contorno); font-variant-numeric: tabular-nums; }
  .record { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; background: var(--rojo); font-weight: 900; font-size: 13px; }
  .premios { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0 4px; font-weight: 900; font-size: 15px; }
  .premios span { display: inline-flex; align-items: center; gap: 6px; }
  .verso { margin: 12px 4px 4px; font-style: italic; font-size: 14px; line-height: 1.4; opacity: .92; }
  .verso small { display: block; margin-top: 3px; font-style: normal; font-weight: 800; opacity: .7; }
  .lista-mini { margin: 10px 0 2px; text-align: left; }
  .lista-mini .mision { padding: 7px 2px; }

  /* Pantallas anchas y bajas: el menú se pone a un lado */
  @media (min-aspect-ratio: 5/4) {
    .menu { flex-direction: row; align-items: stretch; }
    .cabecera { flex: 1; align-self: flex-start; }
    .hoja { width: min(46vw, 470px); max-height: 100vh; max-height: 100dvh; margin: 0; border-radius: 26px 0 0 26px; border-bottom: 2px solid rgba(255, 255, 255, .16); border-right: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .aviso { animation: none; }
    .panel { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Juego Huyendo del pecado"></canvas>

<div id="carga" class="carga">
  <div>
    <div class="carga-titulo">Huyendo del pecado</div>
    <div class="carga-txt" id="carga-txt">Preparando el camino…</div>
  </div>
</div>

<div id="hud" class="hud">
  <button id="b-pausa" class="b-pausa" type="button" aria-label="Pausa"><i></i><i></i></button>
  <div class="marcador">
    <div class="fila-pts"><span class="mult" id="h-mult">x1</span><span class="pts contorno" id="h-pts">0</span></div>
    <div class="fila-mon contorno"><span class="ico-moneda" aria-hidden="true"></span><span id="h-mon">0</span></div>
  </div>
  <div class="poderes" id="poderes"></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <button id="b-escudo" class="b-escudo" type="button" aria-label="Usar el escudo de la fe"><span class="halo" aria-hidden="true"></span><b id="h-escudos">0</b></button>
  <div id="tuto" class="tuto" hidden>
    <div><span class="fl">⟵ ⟶</span>Desliza para cambiar de carril</div>
    <div><span class="fl">⟰</span>Desliza hacia arriba para saltar</div>
    <div><span class="fl">⟱</span>Desliza hacia abajo para rodar</div>
    <div><span class="fl">2 toques</span>Escudo de la fe</div>
  </div>
</div>

<div id="menu" class="capa menu" hidden>
  <header class="cabecera">
    <h1 class="titulo"><span class="t1">Huyendo</span><span class="t2">del</span><span class="t3">pecado</span></h1>
    <p class="lema">Corre con el misionero, esquiva el pecado y recoge la gracia.</p>
  </header>
  <section class="hoja" aria-label="Menú del juego">
    <div class="stats">
      <div class="stat"><small>Récord</small><b id="m-record">0</b></div>
      <div class="stat"><small>Monedas</small><b id="m-banco">0</b></div>
      <div class="stat"><small>Puntos misioneros</small><b id="m-puntos">0</b></div>
    </div>
    <button id="b-jugar" class="btn grande" type="button">¡A CORRER!</button>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="misiones" aria-selected="true">Misiones</button>
      <button type="button" role="tab" data-tab="tienda" aria-selected="false">Tienda</button>
      <button type="button" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
    </div>
    <div class="tab" id="t-misiones"></div>
    <div class="tab" id="t-tienda" hidden></div>
    <div class="tab" id="t-ajustes" hidden></div>
  </section>
</div>

<div id="pausa" class="capa centro" hidden>
  <div class="panel">
    <h2 class="contorno">Pausa</h2>
    <div class="lista-mini" id="pausa-misiones"></div>
    <button id="b-seguir" class="btn" type="button">Seguir corriendo</button>
    <button id="b-salir" class="btn gris" type="button">Volver al menú</button>
  </div>
</div>

<div id="fin" class="capa centro" hidden><div class="panel" id="fin-panel"></div></div>

<script>
  /* Si el juego no llega a cargar (sin conexión o navegador muy antiguo), avisa en vez de quedarse en blanco */
  setTimeout(function () {
    if (!window.__huirListo) { var t = document.getElementById('carga-txt'); if (t) t.textContent = 'No se pudo cargar el juego. Revisa tu conexión e inténtalo de nuevo.'; }
  }, 15000);
</script>
<script type="module">
import * as THREE from './lib/three.module.min.js';

/* =====================================================================
   Huyendo del pecado · carrera sin fin en 3D (JUMA Duaca)
   Un misionero corre por las vías: esquiva trenes, vallas y arcos,
   sube a los techos por las rampas, recoge monedas de gracia y poderes,
   y escapa de la sombra del pecado que lo persigue.
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const rnd = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const elegir = (a) => a[Math.floor(rnd() * a.length)];
const barajar = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; };
const suave = (t) => t * t * (3 - 2 * t);
const fmt = (n) => Math.floor(n).toLocaleString('es');

/* ---------- Medidas del mundo ---------- */
const CLAVE = 'juma-huyendo-v1';
const LW = 2.6;                          // ancho de un carril
const CARRIL_X = [-LW, 0, LW];
const VISTA = 230;                       // hasta dónde se genera la pista
const TREN_ALTO = 3.4;                   // altura del techo de los trenes
const VAGON = 11;                        // largo de un vagón
const G = 62;                            // gravedad
const SALTO_V = Math.sqrt(2 * G * 2.05);
const SALTO_SUPER = Math.sqrt(2 * G * 4.7);
const ALTURA_VUELO = 8.6;
const RODAR_T = 0.62;
const X_EDIF = 7.7;                      // donde empiezan los edificios
const MAX_MONEDAS = 460;
const MEJORA_COSTOS = [250, 500, 1000, 2000, 4000];
const ESCUDO_T = 20, ESCUDO_COSTO = 400;
const PODERES = {

const redondear = (n) => (n >= 1000 ? Math.round(n / 100) * 100 : n >= 100 ? Math.round(n / 10) * 10 : Math.round(n));
function crearMisiones(nivel) {
  let semilla = (nivel * 7919 + 104729) % 233280;
  const r = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };
  const libres = PLANTILLAS.map((p, i) => i);
  const lista = [];
  while (lista.length < 3) {
    const p = PLANTILLAS[libres.splice(Math.floor(r() * libres.length), 1)[0]];
    lista.push({ id: p.id, meta: redondear(p.base + p.paso * nivel), prog: 0, hecha: false });
  }
  return { nivel, lista };
}

let AC = null, sfx = null, musGain = null, ruidoBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      sfx = AC.createGain(); sfx.connect(master);
      musGain = AC.createGain(); musGain.gain.value = 0.15; musGain.connect(master);
    } catch (e) { AC = null; return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tono(f, dur, tipo, vol, ret, hasta, destino) {
  if (!destino && !S.sonido) return;
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (ret || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = tipo || 'triangle';
  o.frequency.setValueAtTime(f, t0);
  if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(destino || sfx);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function ruido(dur, vol, frec, tipoF, ret, destino, hasta) {
  if (!destino && !S.sonido) return;
  const a = audio(); if (!a) return;
  if (!ruidoBuf) {
    ruidoBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = ruidoBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = a.currentTime + (ret || 0);
  const s = a.createBufferSource(); s.buffer = ruidoBuf;
  const f = a.createBiquadFilter(); f.type = tipoF || 'lowpass'; f.frequency.setValueAtTime(frec, t0);
  if (hasta) f.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(destino || sfx);
  s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}

const PASO = 60 / 132 / 4;
const ACORDES = [[48, 55, 60, 64], [43, 50, 55, 59], [45, 52, 57, 60], [41, 48, 53, 57]];
const MELODIA = [
  72, 0, 76, 0, 79, 0, 76, 0, 81, 0, 79, 0, 76, 0, 74, 0,
  74, 0, 79, 0, 83, 0, 79, 0, 74, 0, 0, 76, 74, 0, 71, 0,

const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
let musPaso = 0, musT = 0;
function musicaTick() {
  if (!AC || !S.musica || estado !== 'jugando') return;
  if (musT < AC.currentTime) musT = AC.currentTime + 0.05;
  while (musT < AC.currentTime + 0.14) {
    const p = musPaso % 64, q = p % 16, ac = ACORDES[Math.floor(p / 16)];
    const ret = musT - AC.currentTime;
    if (q % 4 === 0) tono(150, 0.18, 'sine', 0.55, ret, 45, musGain);
    if (q % 4 === 2) ruido(0.05, 0.16, 7000, 'highpass', ret, musGain);
    if (q === 4 || q === 12) ruido(0.14, 0.28, 1800, 'bandpass', ret, musGain);
    if (q % 2 === 0) tono(midi(ac[0] - 12 + (q % 8 === 6 ? 12 : 0)), 0.16, 'triangle', 0.32, ret, 0, musGain);
    if (q === 0 || q === 6 || q === 10) for (let i = 1; i < 4; i++) tono(midi(ac[i] + 12), 0.2, 'square', 0.045, ret, 0, musGain);
    const m = MELODIA[p]; if (m) tono(midi(m), 0.18, 'triangle', 0.15, ret, 0, musGain);
    musT += PASO; musPaso++;
  }
}

/* ---------- Texturas dibujadas en lienzo ---------- */
function lienzo(w, h, dibujo, repetir) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  dibujo(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (repetir !== false) { t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; }
  return t;
}
function motas(g, w, h, n, colores, tam) {
  for (let i = 0; i < n; i++) { g.fillStyle = colores[(Math.random() * colores.length) | 0]; g.fillRect(Math.random() * w, Math.random() * h, tam, tam); }
}
function redondo(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function arco(g, x, y, w, h) { const r = w / 2; g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + r); g.arc(x + r, y + r, r, Math.PI, 0); g.lineTo(x + w, y + h); g.closePath(); }
function vidrio(g, x, y, w, h) {
  const v = g.createLinearGradient(x, y, x + w * 0.4, y + h);
  v.addColorStop(0, '#22406c'); v.addColorStop(0.55, '#5f90c6'); v.addColorStop(1, '#1d3358');
  return v;
}

const cacheGeo = new Map();
function geometriaCaja(ancho, alto, largo, tileAncho, tileAlto) {
  const clave = [ancho, alto, largo, tileAncho, tileAlto].join('|');

  const rep = alto / tileAlto;
  for (let cara = 0; cara < 6; cara++) {

}

      <li>Toca dos veces la pantalla (o la tecla E) para usar el escudo de la fe.</li>
      <li>Si chocas de frente o tropiezas dos veces seguidas, la sombra del pecado te alcanza.</li>
    </ul></div>`;
}
function mostrarMenu() {
  estado = 'menu';
  limpiarPista();
  persD = persObj = 30;
  carril = 1; px = 0; py = 0; vy = 0; enSuelo = true; rodarT = 0; alturaSuelo = 0;
  poder = { iman: 0, alas: 0, sandalias: 0, doble: 0 }; escudoT = 0; invulT = 0;
  $('hud').classList.remove('on');
  $('pausa').hidden = true; $('fin').hidden = true;
  $('menu').hidden = false;

}
function iniciar() {
  if (estado === 'jugando' || estado === 'choque') return;
  audio();
  limpiarPista();
  distInicio = dist;
  genS = dist + 42;
  bloqueo = [dist, dist, dist]; reservado = [dist, dist, dist];
  proxPoder = dist + 160 + rnd() * 160;
  run = { monedas: 0, puntos: 0, metros: 0, saltos: 0, rodadas: 0, trenes: 0, poderes: 0, esquivar: 0, monedasBanco: 0, bonoDado: 0, bonoAcum: 0 };
  poder = { iman: 0, alas: 0, sandalias: 0, doble: 0 };
  escudoT = 0; invulT = 0; tropiezoT = 0; tropiezoCD = 0; animTropiezo = 0;
  carril = 1; carrilPrev = 1; px = 0; py = 0; vy = 0; enSuelo = true; rodarT = 0; colaSalto = 0; colaRodar = false; alturaSuelo = 0;
  tRun = 0; arranqueT = 0; revividas = 0; velocidad = 6; prevDist = dist;
  persD = 2.0; persObj = 2.0; sombraX = 1.25; acechoT = 20 + rnd() * 8; acechoDur = 0; tY = 0; tSuelo = true; bolaT = -1; SOMBRA.bola.visible = false;
  estado = 'jugando';
  musT = 0;
  $('menu').hidden = true; $('fin').hidden = true; $('pausa').hidden = true;
  $('hud').classList.add('on');
  for (const k in cacheTxt) delete cacheTxt[k];
  actualizarHud();
  generar();
  if (S.tuto) {
    const t = $('tuto'); t.hidden = false; t.classList.remove('fuera');
    setTimeout(() => t.classList.add('fuera'), 3500);
    setTimeout(() => { t.hidden = true; }, 4000);
    S.tuto = false; guardar(false);

}
function costoRevivir() { return 250 * Math.pow(2, revividas); }
function mostrarFin() {
  estado = 'fin';
  const nuevas = run.monedas - run.monedasBanco;
  S.banco += nuevas; run.monedasBanco = run.monedas;
  const bonoTotal = Math.max(run.puntos >= 50 ? 1 : 0, Math.floor(run.puntos / 300) + Math.floor(run.monedas / 15));
  const bono = Math.max(0, bonoTotal - run.bonoDado);
  run.bonoDado = bonoTotal; run.bonoAcum += bono;
  S.puntos += bono;
  const pts = Math.floor(run.puntos);
  const record = pts > S.mejor;
  if (record) S.mejor = pts;
  guardar(true);
  const costo = costoRevivir();
  const puede = revividas < 3 && S.banco >= costo;
  const v = elegir(VERSOS).split('|');
  $('fin-panel').innerHTML = `
    <h2 class="contorno">${tipoFin === 'atrapado' ? '¡El pecado te alcanzó!' : '¡Chocaste!'}</h2>
    <div class="gran-pts">${fmt(pts)}</div>
    ${record ? '<div class="record">¡Nuevo récord!</div>' : `<div class="nota" style="margin:6px 0 0">Récord: ${fmt(S.mejor)}</div>`}
    <div class="premios"><span><i class="ico-moneda" aria-hidden="true"></i>+${fmt(run.monedas)} monedas</span><span>★ +${fmt(run.bonoAcum)} puntos misioneros</span></div>
    <div class="lista-mini">${htmlMisiones()}</div>
    <p class="verso">«${v[0]}»<small>${v[1]}</small></p>
    ${revividas < 3 ? `<button type="button" class="btn oro" id="b-revivir"${puede ? '' : ' disabled'}>Seguir corriendo · ${fmt(costo)} monedas</button>` : ''}
    <button type="button" class="btn" id="b-otra">Correr de nuevo</button>
    <button type="button" class="btn gris" id="b-menu">Volver al menú</button>`;
  $('fin').hidden = false;
  const br = $('b-revivir'); if (br) br.onclick = revivir;
  $('b-otra').onclick = () => { SND.boton(); iniciar(); };
  $('b-menu').onclick = () => { SND.boton(); mostrarMenu(); };
}
function revivir() {
  const costo = costoRevivir();
  if (S.banco < costo || revividas >= 3) return;
  S.banco -= costo; revividas++;
  guardar(false);
  for (let i = obstaculos.length - 1; i >= 0; i--) {
    const o = obstaculos[i];
    if ((o.s0 < dist + 55 && o.s1 > dist - 8) || (o.movil && o.s0 < dist + 170)) quitarObstaculo(i);
  }
  estado = 'jugando'; arranqueT = 0; invulT = 2.5;
  tropiezoT = 0; tropiezoCD = 0; persObj = 16; persD = 6;
  py = 0; vy = 0; enSuelo = true; rodarT = 0; alturaSuelo = 0; px = CARRIL_X[carril]; prevDist = dist;
  $('fin').hidden = true;
  $('hud').classList.add('on');
  aviso('¡Sigue corriendo!');
}
function pausar() {
  if (estado !== 'jugando') return;
  estado = 'pausa';
  $('pausa-misiones').innerHTML = htmlMisiones();
  $('pausa').hidden = false;
}
function seguir() {
  if (estado !== 'pausa') return;
  $('pausa').hidden = true;
  estado = 'jugando';
  arranqueT = Math.min(arranqueT, 0.3);
}

/* ---------- Controles ---------- */
let toque = null, ultimoTap = 0;
cv.addEventListener('pointerdown', (e) => { toque = { x: e.clientX, y: e.clientY, hecho: false }; });
cv.addEventListener('pointermove', (e) => {
  if (!toque || toque.hecho) return;
  const dx = e.clientX - toque.x, dy = e.clientY - toque.y;
  if (Math.hypot(dx, dy) > 28) {
    toque.hecho = true;
    if (Math.abs(dx) > Math.abs(dy)) mover(dx > 0 ? 1 : -1);
    else if (dy < 0) saltar();
    else rodar();
  }
});
cv.addEventListener('pointerup', () => {
  if (toque && !toque.hecho && estado === 'jugando') {
    const ahora = performance.now();
    if (ahora - ultimoTap < 320) { usarEscudo(); ultimoTap = 0; } else ultimoTap = ahora;
  }
  toque = null;
});
cv.addEventListener('pointercancel', () => { toque = null; });
addEventListener('keydown', (e) => {
  const k = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (estado === 'menu' && (k === 'Enter' || k === 'Space')) { iniciar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') mover(-1);
  else if (k === 'ArrowRight' || k === 'KeyD') mover(1);
  else if (k === 'ArrowUp' || k === 'KeyW' || k === 'Space') saltar();
  else if (k === 'ArrowDown' || k === 'KeyS') rodar();
  else if (k === 'KeyE' || k === 'ShiftLeft' || k === 'ShiftRight') usarEscudo();
  else if (k === 'Escape' || k === 'KeyP') { if (estado === 'jugando') pausar(); else if (estado === 'pausa') seguir(); }
});
addEventListener('blur', pausar);
document.addEventListener('visibilitychange', () => { if (document.hidden) pausar(); });
$('b-pausa').addEventListener('click', pausar);
$('b-seguir').addEventListener('click', () => { SND.boton(); seguir(); });
$('b-salir').addEventListener('click', () => { SND.boton(); mostrarMenu(); });
$('b-escudo').addEventListener('click', usarEscudo);
$('b-jugar').addEventListener('click', () => { SND.boton(); iniciar(); });
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  SND.boton();
  for (const t of document.querySelectorAll('.tabs [data-tab]')) t.setAttribute('aria-selected', String(t === b));
  for (const id of ['misiones', 'tienda', 'ajustes']) $('t-' + id).hidden = id !== b.dataset.tab;
});
$('t-tienda').addEventListener('click', (e) => {
  const m = e.target.closest('[data-mejorar]');
  if (m) {
    const k = m.dataset.mejorar, nivel = S.mejoras[k], costo = MEJORA_COSTOS[nivel];
    if (nivel < 5 && S.banco >= costo) { S.banco -= costo; S.mejoras[k]++; guardar(false); SND.poder(); pintarMenu(); }
    return;
  }
  if (e.target.closest('[data-comprar]') && S.banco >= ESCUDO_COSTO) { S.banco -= ESCUDO_COSTO; S.escudos++; guardar(false); SND.escudo(); pintarMenu(); }
});
$('t-ajustes').addEventListener('click', (e) => {
  const a = e.target.closest('[data-ajuste]');
  if (a) { const k = a.dataset.ajuste; S[k] = !S[k]; guardar(false); pintarAjustes(); SND.boton(); return; }
  const c = e.target.closest('[data-calidad]');
  if (c && c.dataset.calidad !== S.calidad) { S.calidad = c.dataset.calidad; guardar(false); location.reload(); }
});

/* ---------- Bucle principal ---------- */
let ultimo = performance.now();
let rendT = 0, rendN = 0, rendSuma = 0;
function medirRendimiento(dtReal) {
  if (estado !== 'jugando') return;
  rendSuma += dtReal; rendN++; rendT += dtReal;
  if (rendT < 3) return;
  const prom = rendSuma / rendN;
  if (prom > 0.024 && prActual > 0.75) { prActual = Math.max(0.75, prActual - 0.2); renderer.setPixelRatio(prActual); ajustar(); }
  else if (prom < 0.0145 && prActual < Math.min(window.devicePixelRatio || 1, CAL.pr)) { prActual = Math.min(window.devicePixelRatio || 1, CAL.pr, prActual + 0.1); renderer.setPixelRatio(prActual); ajustar(); }
  rendT = 0; rendN = 0; rendSuma = 0;
}
function paso(dtReal) {
  const dt = clamp(dtReal, 0.001, 0.05);
  reloj += dt;
  if (estado === 'jugando') actualizar(dt);
  else if (estado === 'choque') {
    choqueT += dt;
    if (!enSuelo || py > 0) { vy -= G * dt; py = Math.max(alturaSuelo, py + vy * dt); }
    if (choqueT > 1.25) mostrarFin();
  }
  if (estado !== 'pausa') {
    generarEscena();
    animarJugador(dt);
    animarSombra(dt);
    animarEscena(dt);
  }
  actualizarCamara(dt);
  medirRendimiento(dtReal);
}
function bucle(ahora) {
  requestAnimationFrame(bucle);
  const dtReal = (ahora - ultimo) / 1000;
  ultimo = ahora;
  paso(dtReal);
  renderer.render(scene, camara);
}

/* ---------- Arranque ---------- */
escenaS = [dist - 30, dist - 30];
proxTunel = dist + 520 + rnd() * 300;
proxIglesia = dist + 40;
proxPuente = dist + 150;
generarEscena();
mostrarMenu();
paso(0.016);
renderer.render(scene, camara);
requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(bucle); });
guardar(true);
window.__huirListo = true;
const carga = $('carga');
carga.classList.add('fuera');
setTimeout(() => { carga.hidden = true; }, 400);
window.__huir = { paso, iniciar, mover, saltar, rodar, usarEscudo, revivir, mostrarMenu, get estado() { return estado; }, get dist() { return dist; }, get run() { return run; }, get obstaculos() { return obstaculos; }, get monedas() { return monedas; }, get items() { return items; }, get escena() { return escena; }, get tuneles() { return tuneles; }, acecho: () => { acechoT = 0; tRun = Math.max(tRun, 9); }, get jugador() { return { px, py, carril, enSuelo, invulT, escudoT, persD }; }, set invul(v) { invulT = v; }, scene, S };
