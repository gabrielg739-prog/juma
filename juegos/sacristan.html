<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1e1208">
<title>Sacristán · JUMA</title>
<style>
  :root { --oro: #ffd25a; --oro2: #c98f12; --crema: #fff6e0; --tinta: #2b1a10; --ease: cubic-bezier(.23, 1, .32, 1); --resorte: cubic-bezier(.34, 1.56, .64, 1); --color-tiempo: #3a9a4a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; color: #fff; font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
  .bg { position: fixed; inset: -20px; background: #1a0f08 center / cover no-repeat url(fondos/f1.jpg); filter: blur(4px) brightness(.55) saturate(1.1); }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 20%, rgba(255, 200, 120, .18), rgba(20, 10, 4, .85) 75%); }
  .motas { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .motas i { position: absolute; bottom: -20px; width: var(--t); height: var(--t); border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 170, .95), rgba(255, 210, 90, .3) 45%, rgba(255, 210, 90, 0) 70%); animation: sube var(--d) linear var(--r) infinite; opacity: 0; }
  @keyframes sube { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .8; } 85% { opacity: .5; } 100% { transform: translate(var(--x), -105vh); opacity: 0; } }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 8px; z-index: 5; }
  .redondo { width: 44px; height: 44px; border-radius: 50%; background: rgba(30, 16, 8, .75); border: 2px solid rgba(255, 255, 255, .2); display: grid; place-items: center; flex: 0 0 auto; }
  .redondo:active { transform: scale(.92); }
  .pill { height: 40px; padding: 0 12px; border-radius: 999px; background: rgba(30, 16, 8, .75); border: 2px solid rgba(255, 255, 255, .2); display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
  .pill.oro { color: var(--oro); }
  .vidas { display: inline-flex; gap: 3px; }
  .vidas svg { width: 18px; height: 24px; transition: opacity .3s, transform .3s var(--resorte); }
  .vidas svg.apagada { opacity: .2; transform: scale(.7); }
  .espacio { flex: 1; }
  .vista { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* Menú */
  .titulo { text-align: center; font-family: Georgia, serif; margin: 10px 0 4px; line-height: 1; }
  .titulo .a { display: block; font-size: 50px; font-weight: 700; background: linear-gradient(180deg, #fff6c8, #ffd25a 50%, #c98f12); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #4a2600) drop-shadow(0 10px 18px rgba(0, 0, 0, .5)); }
  .titulo .b { display: block; font-size: 15px; letter-spacing: .25em; text-transform: uppercase; margin-top: 8px; color: #fff3c4; }
  .lista-misas { display: grid; gap: 8px; margin-top: 14px; overflow: auto; padding-bottom: 8px; }
  .misa { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: rgba(40, 22, 10, .82); border: 2px solid rgba(255, 255, 255, .14); text-align: left; animation: entra .5s var(--resorte) both; animation-delay: var(--d); }
  .misa:not(:disabled):active { transform: scale(.98); }
  .misa:disabled { opacity: .45; }
  .misa .color { width: 46px; height: 46px; border-radius: 12px; flex: 0 0 auto; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3), inset 0 -4px 0 rgba(0, 0, 0, .25); display: grid; place-items: center; }
  .misa b { display: block; font-size: 16px; }
  .misa small { display: block; font-size: 12.5px; opacity: .78; line-height: 1.3; }
  .misa .est { margin-left: auto; color: var(--oro); font-size: 16px; letter-spacing: 2px; white-space: nowrap; }
  @keyframes entra { from { transform: translateY(18px) scale(.95); opacity: 0; } }
  .btn-sec { height: 46px; border-radius: 999px; padding: 0 18px; font-weight: 800; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .22); }
  .boton { width: 100%; height: 58px; border-radius: 999px; font-size: 20px; font-weight: 900; color: #fff; background: linear-gradient(180deg, #62c943, #3a9a22); box-shadow: 0 5px 0 #2e7d20, 0 12px 22px rgba(0, 0, 0, .35); margin-top: 12px; }
  .boton:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d20; }
  /* Fase 1: preparar el altar */
  .encabezado { text-align: center; margin: 8px 0 6px; }
  .encabezado h2 { margin: 0; font-family: Georgia, serif; font-size: 22px; color: #fff3c4; }
  .encabezado p { margin: 2px 0 0; font-size: 13.5px; opacity: .85; }
  .reloj { height: 10px; border-radius: 5px; background: rgba(0, 0, 0, .45); overflow: hidden; margin: 4px 0 6px; }
  .reloj i { display: block; height: 100%; background: linear-gradient(90deg, #ff6a3a, #ffd25a); transform-origin: left; }
  .escena { position: relative; flex: 1; min-height: 240px; border-radius: 22px; overflow: hidden; background: radial-gradient(ellipse at 50% 15%, #7a4a26, #3a200e 60%, #1e1006); box-shadow: inset 0 0 60px rgba(0, 0, 0, .6), 0 10px 30px rgba(0, 0, 0, .5); }
  .escena svg.fondo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .zona { position: absolute; border: 2px dashed rgba(255, 230, 160, .45); border-radius: 14px; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 2px; padding: 18px 2px 2px; transition: background .2s, border-color .2s, transform .2s var(--resorte); }
  .zona > span.rot { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #ffe9b0; text-shadow: 0 1px 3px #000; }
  .zona.sobre { background: rgba(255, 210, 90, .22); border-color: var(--oro); transform: scale(1.03); }
  .zona .puesto { width: 26px; height: 26px; animation: cae .45s var(--resorte); filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .5)); }
  @keyframes cae { from { transform: translateY(-20px) scale(1.5); opacity: 0; } }
  .bandeja { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; min-height: 64px; }
  .obj { width: 60px; height: 64px; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 246, 224, .96), rgba(240, 220, 180, .96)); color: var(--tinta); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; line-height: 1; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); touch-action: none; animation: entra .4s var(--resorte) both; animation-delay: var(--d); }
  .obj svg { width: 38px; height: 38px; pointer-events: none; }
  .obj span { pointer-events: none; text-align: center; padding: 0 2px; }
  .obj.arrastra { position: fixed; z-index: 50; pointer-events: none; transform: scale(1.15) rotate(-4deg); box-shadow: 0 16px 30px rgba(0, 0, 0, .5); animation: none; }
  .obj.fantasma { opacity: .3; }
  .colores { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .colores button { width: 58px; height: 58px; border-radius: 16px; font-size: 10px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px #000; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3), 0 4px 0 rgba(0, 0, 0, .35); border: 3px solid transparent; }
  .colores button.ok { border-color: var(--oro); animation: late .6s var(--resorte); }
  @keyframes late { 40% { transform: scale(1.18); } }
  /* Fase 2: durante la Misa */
  .partes { display: flex; gap: 3px; margin: 6px 0; }
  .partes i { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .15); position: relative; overflow: hidden; }
  .partes i b { position: absolute; inset: 0; background: var(--oro); transform-origin: left; transform: scaleX(0); transition: transform .4s var(--ease); }
  .momento { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px 4px; }
  .momento .seccion { font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); }
  .momento h2 { font-family: Georgia, serif; font-size: 30px; margin: 6px 0; color: #fff6e0; text-shadow: 0 3px 14px rgba(0, 0, 0, .7); animation: entra .45s var(--resorte); }
  .momento .que { font-size: 15.5px; line-height: 1.4; max-width: 36ch; background: rgba(30, 16, 8, .72); border: 1px solid rgba(255, 230, 160, .25); border-radius: 16px; padding: 10px 14px; animation: entra .5s var(--resorte) .05s both; }
  .momento .pide { margin-top: 10px; font-weight: 900; font-size: 15px; color: #ffe9b0; }
  .anillo { width: 64px; height: 64px; margin: 6px auto 0; }
  .anillo circle { transition: stroke-dashoffset .1s linear; }
  .herramientas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .herr { height: 74px; border-radius: 18px; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; background: linear-gradient(180deg, rgba(255, 246, 224, .97), rgba(236, 214, 170, .97)); color: var(--tinta); font-weight: 900; font-size: 14.5px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); animation: entra .35s var(--resorte) both; animation-delay: var(--d); transition: transform .12s var(--ease); }
  .herr:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .herr svg { width: 44px; height: 44px; flex: 0 0 auto; }
  .herr.bien { background: linear-gradient(180deg, #c8f5a8, #6ac94a); animation: late .5s var(--resorte); }
  .herr.mal { background: linear-gradient(180deg, #ffc8c0, #e8584a); animation: sacude .4s; }
  @keyframes sacude { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .resp { margin-top: 8px; display: grid; gap: 8px; }
  .resp button { min-height: 52px; border-radius: 16px; padding: 8px 14px; background: linear-gradient(180deg, rgba(255, 246, 224, .97), rgba(236, 214, 170, .97)); color: var(--tinta); font-weight: 800; font-size: 15px; text-align: left; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); animation: entra .35s var(--resorte) both; animation-delay: var(--d); }
  .resp button.bien { background: linear-gradient(180deg, #c8f5a8, #6ac94a); }
  .resp button.mal { background: linear-gradient(180deg, #ffc8c0, #e8584a); animation: sacude .4s; }
  .flota { position: fixed; z-index: 60; pointer-events: none; font-weight: 900; font-size: 24px; color: var(--oro); text-shadow: 0 2px 0 #5a2a00, 0 4px 10px rgba(0, 0, 0, .6); transform: translate(-50%, -50%); animation: flota 1s var(--ease) forwards; white-space: nowrap; }
  @keyframes flota { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -180%); } }
  .consagra { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: radial-gradient(circle at 50% 40%, rgba(255, 250, 220, .95), rgba(255, 220, 140, .4) 30%, rgba(255, 200, 100, 0) 60%); animation: consagra 2.4s ease-out forwards; }
  @keyframes consagra { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
  /* Hoja de resultados y fichas */
  .fondo-hoja { position: fixed; inset: 0; z-index: 30; background: rgba(10, 4, 0, .7); display: none; align-items: flex-end; justify-content: center; padding: 14px; }
  .fondo-hoja.on { display: flex; }
  .hoja { width: 100%; max-width: 460px; max-height: 88vh; overflow: auto; background: linear-gradient(180deg, #fff8e8, #f6e6c4); color: var(--tinta); border-radius: 26px; padding: 20px 18px 16px; text-align: center; animation: subeh .4s var(--ease); box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); }
  @keyframes subeh { from { transform: translateY(40px); opacity: 0; } }
  .hoja h3 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 6px; color: #4a2600; }
  .hoja p { margin: 6px 0; font-size: 15px; line-height: 1.45; }
  .estrellas { font-size: 38px; letter-spacing: 6px; color: var(--oro2); }
  .estrellas span { display: inline-block; animation: estrella .55s var(--resorte) both; }
  @keyframes estrella { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
  .cita { font-family: Georgia, serif; font-style: italic; background: #fff; border: 2px dashed #e4c56a; border-radius: 16px; padding: 12px; margin: 10px 0; }
  .cita small { display: block; font-style: normal; font-weight: 800; color: #8a6a40; margin-top: 4px; font-size: 12px; }
  .aprendido { text-align: left; display: grid; gap: 6px; margin: 8px 0; }
  .aprendido div { background: #fff; border: 2px solid #ecdcb4; border-radius: 12px; padding: 7px 10px; font-size: 13px; line-height: 1.35; }
  .aprendido b { color: #8a3a10; }
  .misal-lista { text-align: left; display: grid; gap: 6px; margin-top: 8px; }
  .misal-lista div { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid #ecdcb4; border-radius: 12px; padding: 6px 10px; font-size: 13px; line-height: 1.3; }
  .misal-lista div.bloq { opacity: .45; }
  .misal-lista svg { width: 36px; height: 36px; flex: 0 0 auto; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .motas { display: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="motas" id="motas" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <button class="redondo" id="btn-cerrar" type="button" aria-label="Salir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="redondo" id="btn-atras" type="button" aria-label="Volver" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vidas" id="vidas" hidden></div>
    <div class="espacio"></div>
    <div class="pill" id="p-puntos" hidden>0</div>
    <button class="redondo" id="btn-sonido" type="button" aria-label="Sonido"></button>
    <div class="pill oro" title="Puntos misioneros">★ <span id="t-estrellas">0</span></div>
  </header>

  <section class="vista" id="v-menu">
    <div class="titulo"><span class="a">Sacristán</span><span class="b">Sirve en la Misa · sal a la misión</span></div>
    <p style="text-align:center;font-size:14px;line-height:1.45;margin:8px 6px 0;opacity:.9">Prepara el altar, ayuda al sacerdote en cada momento de la Misa y, al final, sal a la misión. Cada Misa es más rápida y difícil.</p>
    <div class="lista-misas" id="lista-misas"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:6px"><button class="btn-sec" id="btn-misal" type="button">Mi misal: lo aprendido</button></div>
  </section>

  <section class="vista" id="v-altar" hidden>
    <div class="encabezado"><h2 id="a-titulo">Prepara el altar</h2><p id="a-sub">Arrastra cada objeto a su lugar. ¡Cuidado con lo que no va!</p></div>
    <div class="reloj"><i id="a-reloj"></i></div>
    <div class="escena" id="escena"></div>
    <div class="bandeja" id="bandeja"></div>
  </section>

  <section class="vista" id="v-misa" hidden>
    <div class="partes" id="partes"></div>
    <div class="momento" id="momento"></div>
    <div id="opciones"></div>
  </section>
</div>
<div class="fondo-hoja" id="fondo-hoja"><div class="hoja" id="hoja"></div></div>

<script src="lib/sonido.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const rnd = Math.random;
const barajar = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Guardado ---------- */
const CLAVE = 'juma-sacristan-v1';
let S = { estrellas: 0, misas: {}, max: 0, aprendido: [], sonido: true, mejor: 0 };
try { const d = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (d) S = Object.assign(S, d); } catch (e) { /* sin datos */ }
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) { /* lleno */ }
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ tipo: 'juma-puntos', juego: 'sacristan', total: S.estrellas }, location.origin); } catch (e) { /* fuera de la app */ }
  $('t-estrellas').textContent = S.estrellas.toLocaleString('es');
}

/* ---------- Dibujos de los objetos sagrados (SVG) ---------- */
const DEF = '<defs><linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e8b830"/><stop offset="1" stop-color="#8a5a08"/></linearGradient><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8c0cc"/></linearGradient><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a0603a"/><stop offset="1" stop-color="#5a2e14"/></linearGradient><radialGradient id="gl" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#ffd060"/><stop offset="1" stop-color="#ff6a1a"/></radialGradient></defs>';
const ICONO = {
  caliz: '<path d="M18 10h28c0 14-6 22-14 22S18 24 18 10z" fill="url(#go)" stroke="#7a4a08" stroke-width="1.5"/><path d="M30 32h4v12h-4z" fill="url(#go)"/><circle cx="32" cy="38" r="3.4" fill="url(#go)"/><ellipse cx="32" cy="50" rx="13" ry="4.5" fill="url(#go)" stroke="#7a4a08" stroke-width="1.2"/><ellipse cx="32" cy="11" rx="14" ry="3" fill="#7a1020"/>',
  patena: '<ellipse cx="32" cy="34" rx="24" ry="9" fill="url(#go)" stroke="#7a4a08" stroke-width="1.5"/><ellipse cx="32" cy="32" rx="16" ry="5.5" fill="#fffbea" stroke="#d8c890"/><path d="M32 28v8M28 32h8" stroke="#c9a040" stroke-width="1.6"/>',
  corporal: '<path d="M10 20l22-8 22 8-22 10z" fill="#fff" stroke="#c8c0b0" stroke-width="1.4"/><path d="M10 20v8l22 10V30zM54 20v8L32 38V30z" fill="#efe8dc" stroke="#c8c0b0" stroke-width="1.2"/><path d="M32 17v6M29 20h6" stroke="#c0262f" stroke-width="1.6"/>',
  purificador: '<path d="M14 16h36v30H14z" fill="#fff" stroke="#c8c0b0" stroke-width="1.5"/><path d="M14 24h36M14 38h36" stroke="#e8e0d0" stroke-width="2"/><path d="M32 27v8M28 31h8" stroke="#c0262f" stroke-width="1.8"/>',
  vinajeras: '<path d="M14 22h12l2 6c2 8 0 16-8 16s-10-8-8-16z" fill="#e0f2ff" stroke="#7a9ab8" stroke-width="1.4"/><path d="M14 34c4 2 10 2 14 0v4c-2 6-12 6-14 0z" fill="#b8e0ff"/><path d="M38 22h12l2 6c2 8 0 16-8 16s-10-8-8-16z" fill="#f2e0e4" stroke="#9a6a7a" stroke-width="1.4"/><path d="M38 32c4 2 10 2 14 0v6c-2 6-12 6-14 0z" fill="#9a1030"/><path d="M16 18h8v4h-8zM40 18h8v4h-8z" fill="url(#go)"/><text x="20" y="54" font-size="7" text-anchor="middle" fill="#3a5a7a" font-weight="900">A</text><text x="44" y="54" font-size="7" text-anchor="middle" fill="#7a1020" font-weight="900">V</text>',
  misal: '<path d="M12 14c8-3 14-2 20 2v34c-6-4-12-5-20-2z" fill="#a8202a" stroke="#5a0a10" stroke-width="1.4"/><path d="M52 14c-8-3-14-2-20 2v34c6-4 12-5 20-2z" fill="#c02a34" stroke="#5a0a10" stroke-width="1.4"/><path d="M44 22v12M39 27h10" stroke="url(#go)" stroke-width="2.6"/><path d="M32 50v8" stroke="#ffd25a" stroke-width="2"/><path d="M36 50v6" stroke="#2a6ad0" stroke-width="2"/>',

  if (e.target.closest('[data-cerrar]')) { $('fondo-hoja').classList.remove('on'); return; }
  if (e.target.closest('[data-sig]')) { $('fondo-hoja').classList.remove('on'); empezar(nM + 1); return; }
  if (e.target.closest('[data-otra]')) { $('fondo-hoja').classList.remove('on'); empezar(nM); return; }
  if (e.target.closest('[data-menu]')) { $('fondo-hoja').classList.remove('on'); pintarMenu(); }
});

$('motas').innerHTML = Array.from({ length: 12 }, () => `<i style="left:${(rnd() * 100).toFixed(1)}%;--t:${(4 + rnd() * 9).toFixed(0)}px;--d:${(9 + rnd() * 10).toFixed(1)}s;--r:-${(rnd() * 18).toFixed(1)}s;--x:${(rnd() * 80 - 40).toFixed(0)}px"></i>`).join('');
guardar();
pintarMenu();
window.__sac = { empezar, get S() { return S; }, faseMisa, terminar };
