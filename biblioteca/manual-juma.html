<h1 data-kicker="1er año · Oceanía (Azul) · Temas IMC">Espiritualidad allamaniana</h1>

<h2>Dinámica: el reloj</h2>
<p>El guía hará entrega a cada participante de una hoja, en la cual ellos deben dibujar un reloj de agujas indicando cada una de las horas, posteriormente les indicará a los participantes que deben buscar entre sus compañeros una cita para cada hora del día; al tener todos sus citas para el día en donde no coinciden con más de una persona, inicia el juego de preguntas: el facilitador irá generando una pregunta en cada hora y cada participante debe compartir su respuesta con la persona que se citó para dicha hora. Al terminar todas las citas se invita a los participantes a sentarse y, con la guía del facilitador, ir compartiendo las respuestas que les dieron sus citas; ej.: a las 12 la pregunta es: ¿Con qué frecuencia visitas el Santísimo?, el participante A debe compartir la respuesta que el participante B le expresó en su cita.</p>

<h2>Oración de inicio</h2>
<p>Invocación al Espíritu Santo (canto «Ven Espíritu ven»), lectura de ítems 181-182 del libro <em>Así los Quiero</em>.</p>

<h2>Tema: la espiritualidad allamaniana</h2>
<p><em>Al concluir la oración el facilitador iniciará la ponencia explicando qué es la Espiritualidad y cómo se vive desde diferentes religiones y carismas; luego, a través de una dinámica, dividirá a los participantes en 5 grupos y hará entrega a cada grupo de un cartel escrito con una característica de la Espiritualidad Allamaniana (vida Eucarística, Marianos devotos a la Advocación Consolata, Amor a la liturgia, vida comunitaria, obedientes y fidelidad a la iglesia local), para que estos reflexionen en cuanto a la misma,</em></p>

<p class="itl">en un aproximado de 5 min, y deberán exponer como ponen en práctica dicha característica y como pueden seguir fortaleciendo en lo personal y como movimiento para vivir a plenitud el Espíritu Allamaniano. Al concluir la ponencia de cada grupo, el facilitador dará un recuento de las características que integran la Espiritualidad Allamaniana iniciando su intervención desde una síntesis sobre las vivencias de Allamano, comentando como el Santo vivía cada una de estas actitudes; y les invitara a realizar un compromiso personal para con el movimiento que les impulse a fortalecer sus debilidades, siendo este compromiso parte de la Oración final.</p>

<h2>Espiritualidad Allamaniana</h2>
<p><strong>La «espiritualidad» indica una «vida» o «Camino» según el «Espíritu» (cf. Ga 5, 25: Rm 8. 4.9). Por lo que «Se llama espiritual quien obra según el «Espíritu» (san Basilio Magno, De Spiritu Sancto, cap. 26, n. 61).</strong> También se puede decir, que la Espiritualidad es el Conjunto de los principios o actitudes que configuran la vida espiritual de una persona o de un colectivo, a partir de este concepto, podemos hacer referencia a la vida espiritual que desarrollo nuestro Padre Fundador José Allamano, siendo fiel a la voluntad del Espíritu Santo, quien lo guio en su experiencia con Dios y con el otro, a través de la contemplación de la creación (entorno – naturaleza) y de las Sagradas Escrituras, donde se nos presenta el estilo de vida de nuestro Salvador, quien siguiendo el ejemplo de su Madre María, que también es nuestra Madre por herencia, vivió a plenitud las gracias del Amor de Dios, siendo fiel a su voluntad dando cumplimiento de las Bienaventuranzas que nos conducen a la Felicidad verdadera.</p>
<p>Nuestra Iglesia Católica por ser tan rica en carismas y formas de vivir unidos a Jesús nos habla de la «espiritualidad misionera» la cual ya tiene carta de ciudadanía respecto a la terminología (cf. Ad gentes, 29; Redemptoris missio, 87) y a los contenidos. Estos han quedado resumidos especialmente en Ad gentes, 23-25, Evangeli nuntiandi, 75-82 y Redemploris missio,87-92: fidelidad al Espíritu Santo, intimidad con Cristo (o experiencia de Cristo), vocación misionera, virtudes del misionero, oración y contemplación, fidelidad y amor de Iglesia, la figura materna de María. El punto de referencia es la figura del buen pastor y su imitación por parte de las diversas figuras misioneras de la historia, según las diversas líneas de la «vida apostólica» (seguimiento radical de Cristo, vida comunitaria y disponibilidad misionera).</p>
<p>A partir de esta nueva definición que nos presenta la Iglesia universal, hemos de comparar dicha Espiritualidad con las virtudes que caracterizaron a nuestro P. Allamano, y de las cuales él mismo nos exhorta a que la vivamos en nuestra cotidianidad quienes optamos por ser parte de la Familia Consolatina; entre los 5 pilares fundamentales que nos infunde el Padre Allamano están:</p>

<h3>Amor a la eucarística</h3>
<ul>
<li>San José Allamano era un hombre y un sacerdote convencido de la oración. EL no separaba en la vida espiritual este binomio de oro. Para él la cumbre de la oración era la eucaristía, luego la adoración y la contemplación.</li>
<li>El empapaba toda su vida de oración: prolongaba a lo largo del día la presencia de Jesús con la intimidad y la adoración al SSmo. Sacramento.</li>
<li>Quiso que sus misioneros fueran sacramentinos y contemplativos. Sus tres amores son la Misa, la Comunión y la Visita al SSmo. Sacramento. Para el la Eucaristía es un misterio de fe y de amor. Él decía que la Eucaristía era el tiempo más hermoso de su vida.</li>
<li>Reflexionando el texto de Pablo a los Corintios (I Cor.11, 26) … “Siempre que coman de este pan y beben de esta copa, proclamarán la muerte del Señor hasta que vuelva”.</li>
<li>Para él Jesús es el pan vivo que nos alimenta y nos fortalece en el camino de la vida.</li>
<li>Jesús es el Dios con nosotros en todo momento y lugar para llevar a cumplimiento la Misión del Reino. Nos invitaba a tenerlo siempre como amigo, gozar de su presencia y apropiándonos del Señor como decía Pablo en la Carta a los Gálatas “No soy yo quien vivo, sino es Cristo que vive en mí y llevo esta vida en la carne del Hijo de Dios.”</li>
</ul>
<p>Él afirmaba que estar en adoración no es tiempo perdido. Cuando nos dice que nos quiere sacramentinos es que nos pide ser adoradores de Dios, hermanos de Jesús Sacramentado Él estaba convencido que no somos misioneros por lo que deseamos y hablamos, sino que, como Jesús que seamos hombres y mujeres de contemplación para la Misión. La experiencia más hermosa de la vida, después de la contemplación es estar siempre en camino con Cristo. Él exhortaba a aprender siempre de Jesús que en los momentos más difíciles se apartaba Él solo a orar, entrando en intimidad con el Padre y luego tenía la fuerza y la fidelidad dinámica para la misión que Dios le había confiado.</p>
<ul>
<li>San José Allamano decía a sus hijos misioneros: “los quiero siempre en camino”; además no pierda nunca de vista a Cristo, los Apóstoles, los mártires y los testigos de la fe. (Heb. 12, 1-4)</li>
</ul>

<ul>
<li>La vida cristiana y misionera no es para mediocres o sedentarios, sino que siempre estamos llamados a crecer en santidad de vida todos nuestros días.</li>
<li>Realicemos el camino de nuestra vida iluminados por la Palabra de Dios, fortalecidos por los dones del Espíritu y acompañados por Jesús Eucaristía para ser misioneros llenos de fuego apostólico, dispuestos a continuar la misión de Jesucristo en el mundo entero.</li>
<li>Solo si somos hombres de oración, de contemplación y sacramentinos tendremos siempre fuerza y capacidad de estar en camino y trabajando con valentía y actitud profética como Cristo, siendo promotores de comunión y fraternidad para la misión.</li>
<li>En resumidas palabras debemos ser sagrarios vivientes que llevan a Cristo por los caminos del mundo, siendo testigos del amor misericordioso de Dios y del reino con sus obras.</li>
</ul>

<h3>La devoción mariana</h3>
<p>¿Quién es la Consolata para nosotros? Es ella quien ha fundado el Instituto, la que nos dirige y quien nos sustenta; la razón por la que Dios ha elegido a María es precisamente para que dé al mundo su consuelo: dar la vida a Jesús y colaborar en su misión salvadora, sí, porque la Virgen no desea otra cosa que la salvación de las almas. «Mi queridísima Madre, la Virgen Consolata».</p>
<p>María tendría que ser todo para un cristiano: <em>«la grandeza de esta dulcísima Madre debería ser, después de Dios, el objeto continuo de nuestra admiración y de nuestros pensamientos»</em>. En la Consolata se encuentra ejemplo, consuelo y fuerzas para seguir adelante en las buenas y en las malas, hemos de confiar en ella más aun estando en el campo de acción: La Virgen Consolata nos obtendrá todas las ayudas necesarias, nos consolará en la abundancia de los frutos espirituales y en el cansancio apostólico, pero sobre todo nos ayudará eficazmente a alcanzar el más alto grado de perfección, pues quien quiera alcanzar la santidad sin la Virgen, es como quien pretende volar sin alas. Para avanzar en nuestro camino a la Santidad tenemos que donarnos por completo a María. <strong>Como consecuencia práctica, hagamos todo con la Virgen, todo por la Virgen y recibamos todo de ella.</strong> Siguiendo su modelo en todas las circunstancias preguntemos nos ¿Cómo lo haría Ella? Y a ejemplo de Allamano contemplamos <strong>las virtudes de María y hagamos las nuestras</strong>, de igual forma debemos <strong>rezar el Santo Rosario</strong> constantemente y elevar <strong>oraciones a nuestra Madre</strong>, cuando nos preparemos para la Fiesta de la Consolata debemos hacerlo bien ¿es importante esta fiesta? ¡Es todo! Por lo que debemos estar dispuestos para <strong>hacer la novena y la celebración con entusiasmo</strong> ¡El corazón nos dice lo que hay que hacer por una Madre!</p>

<h3>Las virtudes que practicaba</h3>
<p>Como padre de esta familia misionera, Allamano era consciente que debía generar en ellos, como un buen padre, lo mejor: ser santos. Por consiguiente, motivar la responsabilidad ante la propia santificación era la expresión más alta de la pedagogía misionera Allamaniana. Para él no había ideales mediocres sino lo máximo: la santidad. Llevó a sus misioneros a crecer en todas las virtudes necesarias en la acción misionera: la fe, la esperanza, el amor, celo misionero, la energía, aplicación al estudio especialmente de las lenguas. Sin energía, un misionero es como si no existiera. Insistía en el estudio de las lenguas como preparación para la comprensión de la cultura y de los pueblos al que se es enviado. Es un estudio que Allamano coloca al mismo nivel de la Teología. Además de fortalecer el YO con los máximos ideales de santidad y de misión ad gentes, la pedagogía Allamaniana miraba a dar elasticidad al YO para plegarlo a las exigencias del ideal misionero: demoler los muros que impiden la serena y equilibrada acogida de lo nuevo y lo diferente; presentaba la humildad como virtud necesaria especialmente a los misioneros si querían ser de verdad, instrumentos idóneos en las manos de Dios para la misión. Junto a la humildad está el espíritu de sacrificio, como óptimo medio para moldear el propio YO a las nuevas circunstancias de la misión</p>

<h3>La pasión por el anuncio del Evangelio (misión)</h3>
<p>El Anuncio explícito de Jesucristo. El motivo principal y único de la vocación misionera según Allamano es el de llevar y comunicar la fe en los lugares donde aún no se conoce a Jesucristo. De ahí que el lema generador de energía en todo misionero de la Consolata es tomado del profeta Isaías: Anunciarán mi gloria a las naciones En el año 1909 decía en una de sus conferencias: La vocación misionera no es otra cosa que un mayor amor a Nuestro Señor Jesucristo, por el cual uno se siente incitado, animado a darlo a conocer y amar a cuantos no lo conocen y no lo aman todavía Dios quiere servirse de nosotros. Como afirma san Pablo, nosotros somos colaboradores de Dios (1Cor. 3,9). ¡Piensen en esto!: colaboradores de Dios para la salvación de la humanidad a nosotros la iglesia nos confía el gran mandato de la evangelización que recibió el Resucitado. Es la obra por excelencia. De aquí que el empeño primordial de todo Misionero y misionera de la Consolata, sea el anuncio explícito de Jesucristo. B. El aquí y el ahora. Allamano vivió su espiritualidad desde el aquí y el ahora de su época, siglo XIX. Los misioneros deberán vivir la espiritualidad desde otro punto de vista que no es el aquí de ellos mismos, sino un aquí que está más bien allá</p>

<h3>El espíritu de familia <span class="nota-i">(este último aspecto fue añadido por la Asamblea)</span></h3>

<p>La pedagogía misionera de Allamano miró también a relativizar lo que parece imprescindible (lazos familiares, afectivos), a redimensionar la propia cultura para crear un espacio de cariñosa acogida a los valores de otras culturas. Era enfático cuando hablaba del desapego de la propia vida: El misionero debe estar dispuesto al martirio, a ofrecer su vida Todo con el fin de cumplir la misión. En el respeto por otras culturas y pueblos, él hablaba de la necesidad de la paciencia y la mansedumbre para evitar reacciones negativas e imposiciones violentas. Una paciencia heroica, constante, en todo. La pedagogía Allamaniana, según Monseñor Castro, quería desarrollar a nivel de fe y a nivel de crecimiento humano, las potencialidades de una persona, para que junto con otras, en unidad de entendimientos, pudiera responder eficazmente a la misma llamada a la que respondió Abraham cuando el Señor le dijo: Vete de tu tierra y de tu patria, y de la casa de tu padre, a la tierra que yo te mostraré.</p>
<p>Estas características no son ninguna novedad para un cristiano; lo que distingue el P. Allamano y que nos debe distinguir a nosotros es el estilo y la intensidad con la que él vivía estos aspectos.</p>
<p>Es una espiritualidad vivida desde la praxis de la misión ad gentes. Por ello no basta ser devotos de la Eucaristía, hay que serlo desde la misión ad gentes. No basta una devoción mariana, hay que vivirla desde la misión ad gentes, lo mismo la santidad. La originalidad misionera de su espiritualidad tenía que llevar a sus misioneros a santificarse desde la misión. Todas sus enseñanzas y consejos, sus cartas, hacían referencia a esta perspectiva: cuando estén allá, cuando estarán en misión, cuando estén en África. El espíritu: Allamano no presentaba las virtudes y su necesidad revestida del ropaje del aquí y del ahora, El trascendía esto e insistía en el espíritu de la virtud: es así como hablaría del espíritu de familia, de obediencia, de pobreza, de sacrificio, de humildad. Lo que a él le interesa es la motivación fuerte fundamental que mueva al misionero a vivir según las exigencias de la misión. Una espiritualidad misionera no puede no ser profunda, sino que debe ser formada por un espíritu, una mística, una intensa motivación. Una espiritualidad misionera no podría no ser universal, sino en continuo movimiento hacia el otro y en disposición de acogida de la diversidad. Una espiritualidad misionera, según Allamano no podría no estar en sintonía estrecha con la realidad histórica, con sus angustias y esperanzas. La situación misionera concreta es la voz, a través de la cual, Dios guía hacia el crecimiento espiritual.</p>

<h3>Oración Nuestra Señora de la Consolata</h3>
<p class="oracion-txt">Oh Madre querida: Sé tú el consuelo único y perenne de la Iglesia a la que amas y proteges. Consuela a las comunidades cristianas en su cotidiano peregrinar de la fe. Consuela a los que llevan en sus vidas, profundas heridas por dramáticas situaciones de opresión, violencia, marginación. Consuela a todos los que sienten en el corazón una ardiente necesidad de amar y ser amados. Consuela a los jóvenes inmersos en el torbellino de falsas opciones que los asfixian y sofocan, desorientándolos y desanimándolos. Consuela a todos los que entregan sus vidas para salvaguardar los ideales de la vida. Oh Madre Consolata: Que tu presencia consoladora nos anime a dar testimonio fecundo de nuestra fe para que podamos defender, con coraje y verdad, la dignidad de cada ser humano, en la justicia, en la paz y el amor. Ayúdanos en la construcción de una sociedad fraterna, donde prevalezcan los frutos del Reino de tu Hijo Jesús. Amén.</p>

<h2>Tema: la Consolata</h2>

<h2>Historia de Nuestra Señora Virgen Consolata</h2>
<p>San Máximo colocó el cuadro traído de Tierra Santa en una capilla de Turín luego del 354. Cuenta la tradición que fue San Eusebio desterrado a Tierra Santa por el emperador Constancio, en el año 354. Y al regresar, le trajo a su amigo San Máximo, una imagen de la Virgen María que -según se decía- había pintado San Lucas. Máximo colocó el cuadro en una capilla, al lado de una iglesia dedicada a San Andrés. Y así, el pueblo de Turín comenzó a venerar a la Virgen María bajo el título de Consoladora que, en la expresión popular devino en Consolata.</p>
<p><strong>La construcción del santuario</strong> se debe a una visión de Arduino que la Virgen le pidió construir tres templos en 1016. Los obispos de Turín confiaron la imagen de la Consolata a los Padres Benedictinos en el año 840, dos acontecimientos contribuyeron a su desaparición. Primero, hubo que esconderla, debido a la persecución y destrucción de imágenes por parte de los iconoclastas. Y luego, una guerra, que destruyó el templo de San Andrés y la capilla donde estaba, sepultándola bajo los escombros y en el olvido.</p>
<p>Pero permaneció viva en la memoria de sus fieles y muchos años más tarde, Arduino, por un tiempo rey de Italia, erigió una capilla para la Virgen Consolata, en agradecimiento a una curación milagrosa y respondiendo al pedido que la misma Señora le había expresado en una visión, pero también esta capilla fue destruida y la imagen desapareció por segunda vez.</p>

<h3>El ciego de Briançon</h3>
<p>En el año 1104, la Virgen se le apareció a un ciego en Briancon, Francia, era Jean Ravais (o Ravache), a quien le prometió devolverle la vista cuando llegara al lugar que Ella le indicaría y donde encontraría la imagen perdida.</p>
<p>Jean Ravais así lo hizo y luego de un largo viaje llegó a Turín. El lugar indicado por la Virgen era la torre de una Iglesia destruida. El 20 de junio, en presencia del obispo, sus sacerdotes y el pueblo, comenzaron las excavaciones. La imagen perdida apareció debajo de las ruinas. Fue el obispo quien la sacó de entre los escombros y la expuso a la vista de todo el pueblo allí congregado, exclamado: <em>“¡Ruega por nosotros, Virgen Consoladora!”.</em> A lo que la gente respondió: <em>“Intercede por tu pueblo”.</em> Y en ese momento, Jean Ravais recobró la vista.</p>

<h3>Descripción del cuadro</h3>
<ul>
<li>El cuadro de la Virgen Consolata es un lienzo pintado con estilo de “icono” oriental-bizantino.</li>
<li>Arte sacro, que representa los valores espirituales más que la belleza física exterior, Arte simbólico más que realista.</li>
<li>Es de autor desconocido, pero rico en enseñanzas de devoción a la Virgen.</li>
<li>Contemplando la imagen impresionan los dos rostros, el de María refleja una leve tristeza templada de suave esperanza.</li>
<li><strong>Tiene la mirada dirigida a quienes la miran, como infundiéndoles sus mismos pensamientos</strong>, y la cabeza inclinada levemente hacia Jesús, fuente y causa de todas sus grandezas, consuelo de la Humanidad.</li>
<li><strong>La mano derecha contra el pecho pareciera indicar que asume como propias todas las penas de sus hijos, tarea maternal como consoladora de los afligidos.</strong></li>
<li>María Consolata nos presenta a Jesús, sentado sobre el brazo izquierdo de su Madre, lado del corazón.</li>
<li>María sostiene a su Hijo, lo cuida como Madre, lo custodia, pero no lo retiene para sí.</li>
<li>El vínculo de unión entre ellos son las dos manos izquierdas, levemente unidas, que expresan la unidad llena de cariño y de respeto, símbolo del amor más bello que une el corazón de Dios al corazón de una criatura.</li>
<li>El Niño con su mano bendice al mundo a la manera oriental: dos dedos alzados (que significan las dos naturalezas de Cristo, humana y divina), y los otros tres doblados (que indican la Trinidad).</li>
<li>Fiel al arte iconográfico, la imagen tiene en cuenta los colores:</li>
<li>-el manto de la Virgen es de un azul intenso que indica su gloria en el cielo; el borde dorado simboliza su participación en la gloria de Dios;</li>
<li>-el rojo, expresa la realeza: la de María, Reina de todo lo Creado y la de Jesús.</li>
<li>Las tres estrellas sobre el manto de la Virgen (una de ellas oculta por la figura del Niño), son signo de la virginidad de María antes, durante y después de la concepción de Jesús.</li>
<li><strong>El anillo en su dedo es expresión de autoridad y poder</strong>: Ella es la Madre del Salvador, vencedora de todo mal.</li>
<li>Por último, las dos aureolas que manifiestan la santidad y la gloria de Cristo y de María, obtenida por medio de la cruz.</li>
<li>En definitiva, el cuadro presenta a María y su Hijo estrechamente unidos: quien encuentra a María, encuentra a Jesús, y quien encuentra al Hijo encuentra a la Madre.</li>
</ul>

<h3>Oración final</h3>
<p>A través de la oración visual invitar a los jóvenes a fijar su mirada en la imagen de la Consolata, permitiendo que sus pensamientos fluyan en torno a ella, dejando que, por medio de su providente amor, surja compromisos de servicio misionero; para concluir la oración cantar o escuchar el Himno de la Consolata.</p>

<p class="himno-t"><strong>HIMNO CONSOLATA</strong></p>
<div class="himno-2c">

<h1 data-kicker="2do año · Asia (Amarillo) · Espiritualidad">La Eucaristía, vida de la Iglesia</h1>

<h2>Oración de adoración</h2>
<p>Colocados en presencia del Señor se invoca a la Santísima Trinidad, se coloca de fondo la canción <em>Milagro de Amor</em>, y el facilitador inicia la <strong>Oración de Adoración</strong> donde se reconoce a Jesús como Rey y Señor nuestro, dando Gloria y Alabanzas a él, reconociéndonos necesitados de su Misericordia. (Se sugiere realizar la Oración en una capilla donde se encuentre Jesús Sacramentado).</p>

<h2>Dinámica: sopa de letras</h2>
<p>El facilitador distribuirá entre los presentes una hoja que contiene una sopa de letras, en la cual deben encontrar palabras claves sobre el tema «La Eucaristía»; para esto se les dará un tiempo de 5 min aproximadamente; para finalizar se invitará a los participantes a compartir cuál fue la primera palabra que encontraron y a qué les motiva dicha palabra.</p>
<p class="cita-der">«Hagan esto en memoria mía» (1Cor 11, 23-25)</p>

<h2>El significado de la Eucaristía y los distintos nombres que se le da</h2>
<ul class="flechas">
<li><strong>La palabra Eucaristía significa «acción de gracias».</strong> A través de la Eucaristía, damos gracias a Dios por todo lo que ha hecho por la humanidad, por haberla creado, por haberla salvado por la muerte y resurrección de Cristo y por haberla santificado en el Espíritu Santo. Es también el sacrificio de alabanza por medio del cual, la Iglesia canta la gloria de Dios en nombre de toda la creación. (Lc 22, 19; 1Cor 11, 24).</li>
<li><strong>Fracción del Pan:</strong> Con la fracción del pan se quiere significar que todos los que comen de este único pan, partido, que es Cristo, entran en comunión con Él y forman un solo cuerpo en Él. (He 2, 42b).</li>
<li><strong>Cena del Señor:</strong> La Eucaristía es ante todo una comida, compartida, que fue instituida por Jesucristo en la última cena. Así como necesitamos del alimento corporal, también necesitamos del alimento espiritual que es el cuerpo de Cristo en la Eucaristía (Jn 6, 51- 55). La Santa Misa es la mesa compartida de la familia de los hijos de Dios.</li>
<li><strong>Sacramento Eucarístico:</strong> Un sacramento es un signo sensible de la presencia de Dios. En la Eucaristía, Jesucristo está real y verdaderamente presente bajo las apariencias del pan y del vino. (Jn 6, 51; Mc 14, 22-24). Es el gran regalo (don) de Dios a la humanidad que quiso quedarse hecho pan y vino para nuestra salvación.</li>
<li><strong>Sacrificio Eucarístico:</strong> La palabra sacrificio viene del latín <u>sacrum= sagrado – facere= hacer</u>, es decir hacer sagrada una cosa. En la Eucaristía ofrecemos al Padre lo Él mismo nos ha dado, los dones de su creación: pan y vino, convertidos por el Espíritu Santo en el Cuerpo y la Sangre de Jesús. Esto se hace en memoria del sacrificio de Cristo en la cruz, que ofreció su cuerpo y su sangre por nuestra salvación (Lc 22, 19-20; Mt 26, 28).</li>
<li><strong>Comunión:</strong> La palabra comunión= «común unión» hace referencia a la unión fraterna de quienes la comparten entre sí y con Aquel a quien se comparte. Por este sacramento nos unimos a Cristo que nos hace partícipes de su Cuerpo y de su Sangre para formar un solo cuerpo (1Cor 10, 16-17). La Eucaristía es además el momento de encuentro de la comunidad cristiana como familia. En ella nos unimos a Cristo y nos unimos a nuestros hermanos.</li>
<li><strong>Memorial de la Pascua de Cristo:</strong> La Eucaristía no es solamente un recuerdo de la muerte y resurrección de Cristo, sino que estos acontecimientos se hacen presentes y actuales. En la Eucaristía, Cristo continúa entregándose al Padre por nosotros y por nuestra salvación. (1Cor 11, 24-25; Lc 22, 19). Cuando en cada Misa se celebra el memorial de la Pascua de Cristo, las palabras y los gestos del sacerdote significan y hacen presente el sacrificio redentor de la cruz sin repetirlo.</li>
<li><strong>Misa:</strong> la celebración en la que se comparte la Eucaristía, termina con el envío de los fieles (en latín «missio» = vayan) a fin de que cumplan la voluntad de Dios en su vida cotidiana. No sirve de nada recibir la Eucaristía, si ésta no se traduce en la vida, en gestos y actitudes de testimonio cristiano. (1Cor 11, 26).</li>
<li><strong>La Eucaristía es ante todo la cena del Señor compartida como hermanos.</strong> Es el momento privilegiado de encuentro fraterno y comunión entre los miembros de la</li>
</ul>

<ul class="flechas">
<li>comunidad cristiana. Así como la mesa familiar es el momento por excelencia de encuentro de la familia, la Santa Misa es el momento de encuentro por excelencia de la Iglesia.</li>
</ul>

<h2>Frutos de la Eucaristía</h2>
<ul class="flechas">
<li>Acrecienta nuestra unión con Cristo.</li>
<li>Al unirse más a Cristo, los fieles se unen más también entre sí. Renueva, fortifica y profundiza la incorporación a la Iglesia.</li>
<li>Nos separa del pecado, puesto que al unirnos a Cristo nos purifica y preserva del pecado.</li>
<li>Conserva, acrecienta y renueva la vida de gracia. Así como la comida es alimento para el cuerpo, la Eucaristía es alimento para el alma.</li>
<li>Al fortalecernos, la Eucaristía borra los pecados veniales.</li>
<li>Robustecidos con la fuerza de la Eucaristía, el cristiano es enviado a dar testimonio de Cristo con su vida.</li>
</ul>

<h2>Disposiciones para recibirla</h2>
<ul class="flechas">
<li>consciente de que es a Jesucristo a quien se recibe en la Eucaristía, quién está realmente presente en el pan y vino. Al decir «¡Amén!» al recibir la Eucaristía estamos haciendo una profesión de fe en esta presencia. Este «amén» también compromete a quien recibe la Eucaristía a conformar su vida con la de Jesús.</li>
<li>Estar en gracia de Dios. Quien tiene conciencia de estar en pecado grave, debe acercarse al sacramento de la reconciliación antes de comulgar. Caso contrario, es conveniente hacer un examen de conciencia antes de la comunión. (1 Cor 11, 28).</li>
<li>Al ser también un sacramento de comunión con los hermanos, es preciso estar en paz con ellos para poder compartir dignamente la mesa. (Mt 5, 23-24).</li>
<li>Para prepararse convenientemente para recibir la Eucaristía, la iglesia sugiere realizar un ayuno por lo menos una hora antes, como un pequeño gesto de penitencia en preparación a la misma, contribuyendo a hacernos adquirir el dominio sobre nuestros instintos y la libertad del corazón.</li>
</ul>

<h2>Algunos gestos para vivir mejor la Eucaristía</h2>
<ul class="flechas">
<li>Hacer un momento de oración personal y un breve examen de conciencia en el momento previo a pasar a comulgar, pidiendo una mejor disposición del corazón para recibir el cuerpo de Cristo.</li>
<li>Acércanos con devoción y decoro, y al decir «Amén» se conscientes que estamos haciendo acto de fe y un compromiso de coherencia con la gracia recibida.</li>
<li>Hacer un momento de oración y recogimiento posterior a la comunión, dando gracias por los beneficios recibidos en la misma y pidiendo que produzca abundantes frutos en nosotros.</li>
</ul>

<h2>La Eucaristía, fuente, medio y culmen de nuestra misión</h2>
<ul class="flechas">
<li><strong>Fuente,</strong> quiere decir que de la Eucaristía brota la misión. De ella surge, a partir de ella se inicia.</li>
<li><strong>Medio,</strong> es decir que a través de la Eucaristía se desarrolla la Misión, se hace efectiva.</li>
<li><strong>Culmen,</strong> quiere decir que la Misión concluye nuevamente en la Eucaristía.</li>
</ul>

<h2>La Eucaristía en nuestras misiones</h2>
<p class="sub-i"><em>1. Ideas equivocadas acerca de la Eucaristía que pueden tener algunos católicos</em></p>
<ul class="flechas">
<li>Mucha gente participa de la Eucaristía sin estar debidamente preparado.</li>
<li>Falso pudor: Hay gente que nunca comulga porque siente que no es digna.</li>
<li>Idea de la Eucaristía como un «premio» que hay que ganar. Si no me lo gané no puedo comulgar, descuidando el sentido de la Eucaristía como remedio y fortaleza.</li>
<li>Otros no ven la Eucaristía como algo necesario para la vida.</li>
<li>«Yo voy a Misa y comulgo solamente cuando lo siento».</li>
<li>Otros creen que por simplemente comulgar ya son buenos, disociando eucaristía de la responsabilidad de ser un buen cristiano con mis actos y testimonio.</li>
<li>Muchas veces no se tiene la idea de la presencia de Cristo en el Sagrario.</li>
</ul>
<p class="sub-i"><em>2. Ideas diferentes tienen de la Eucaristía otros cristianos</em></p>
<ul class="flechas">
<li>Eucaristía como símbolo de Cristo. No como presencia real de Cristo. Para ellos, Cristo está presente de una manera simbólica en la Eucaristía («Consubstanciación») mientras que nuestra fe afirma que el pan y el vino se «transforman» en el cuerpo y la sangre de Cristo, quién está presente verdadera, real y substancialmente en la eucaristía («transustanciación»).</li>
<li>Eucaristía como simplemente un gesto de unidad y fraternidad, de «compartir el pan con los hermanos».</li>
</ul>
<p class="sub-i"><em>3. Ideas diferentes tiene de la Eucaristía otros cristianos</em></p>
<ul class="flechas">
<li>Existe gente malintencionada que utiliza la Eucaristía en rituales de brujería o satanismo. Es por ello que a veces puede resultar peligroso el distribuir la comunión en la mano de la persona si no se vigila que quien la recibe la consuma en el momento.</li>
</ul>

<h2>Tema: las advocaciones de la Virgen María</h2>
<p><em>Antes del encuentro, se debe haber indicado a los participantes que lleven estampas de algunas advocaciones de la Virgen María que sea de su devoción, o que conozcan, y que averigüen como nació dicha advocación, qué significado tiene la imagen, y otros datos que puedan conseguir. Al comenzar el encuentro, cada uno comparte (si son muchos participantes, en pequeños grupos de a tres) la estampa que han traído comentando por qué la ha elegido y qué conoce acerca de la misma.</em></p>
<p><em>En un segundo momento, puestas todas las estampas en un lugar donde todos puedan verla, se pide que compartan en qué se diferencian las distintas advocaciones. Surgirán respuestas como: los distintos nombres, colores de la vestimenta, posición, signos u otros objetos que acompañan la imagen de María, etc. Luego, de esto, el animador dialogará con el grupo explicando los puntos que siguen:</em></p>
<ul>
<li>La Madre de Jesús es siempre una sola y que tiene distintos nombres según el lugar y la manera en que se ha manifestado.</li>
<li>La Virgen se ha manifestado a lo largo de la historia en distintos lugares, a distintas personas.</li>
<li>El principal motivo de las apariciones es reavivar la fe de la gente y acercar a los hombres más a Jesús.</li>
<li>Las distintas apariciones de la Virgen, nos hablan de María misionera, que sale al encuentro de cada persona</li>
</ul>

<h2>María, discípula misionera</h2>
<p>María que después de la Anunciación, llena del Espíritu Santo y con el Verbo de Dios hecho hombre en sus entrañas, se transforma en la primera misionera porque el texto nos dice: partió sin demora a la casa de su prima Isabel, el motivo de su partida presurosa era una necesidad de Isabel, su prima, que en su ancianidad estaba a punto de vivir el parto y esa necesidad impulsa en María, no solo su sentimiento más noble de servir sino también nos presenta a María como la que lleva a Cristo ya en sus entrañas. Esta experiencia de encuentro con Isabel nos hace experimentar cuál es la disposición de aquellos que vamos a recibirlo a Cristo porque María nos lo ofrece y nos lo presenta. María no tiene a Cristo para sí, ella no ha recibido a Cristo en el misterio de la encarnación para ser propietaria y poseedora de Cristo, ella lo tiene para darlo, ella lo ha recibido para entregarlo a los demás.</p>

<h3>Actitudes de María</h3>
<ul class="actitudes">
<li><em>Silencio en su interior.</em> María se sobrecoge ante la visita del ángel, pero puede recibir y comprender el mensaje que él le comunica por el profundo silencio que llena su interior. Ella está acostumbrada a meditar las palabras del Señor, está acostumbrada al lenguaje Divino y lo capta con profundo recogimiento. Aprendamos de María a tener ese silencio interior que nos permita estar en sintonía con El Señor aún en medio de nuestras actividades cotidianas.</li>
<li><em>Escucha atenta.</em> María escucha reverentemente al ángel. No está pensando en ella misma, ni en lo que tiene que hacer, ni en qué cosas va a tener que dejar para ser la Madre de Jesús. Ella se dispone, escucha, se deja tocar por las palabras y las medita en su corazón. Aprendamos de María a escuchar a Dios en el silencio y en medio de las circunstancias concretas de nuestra vida, y pidámosle que nos ayude a mantener nuestro corazón abierto a su palabra.</li>
<li><em>Acogida generosa.</em> María después de escuchar acoge. Las palabras dan fruto en su interior, no pasan como el viento, sino que se quedan y echan raíces en su corazón. Aprendamos de María a vivir una acogida humilde del Plan de Dios en nuestra vida. Que ella nos enseñe a aceptar con amor los designios Divinos y a no querer otra para nuestra vida.</li>
<li><em>Búsqueda.</em> Esta actitud es la que lleva a María a preguntarse sobre el sentido profundo de las palabras del Mensajero de Dios en el momento de la Anunciación: «¿Cómo será esto, puesto que no conozco varón?». Y su pregunta no es fruto de la duda, sino fruto de un anhelo de mayor luz para poder descubrir la profundidad de su misión. En ella está el deseo de responder con mayor fidelidad y generosidad. Aprendamos de María a tener un corazón inquieto que no descanse hasta dar gloria a Dios con nuestra vida.</li>
<li><em>Disponibilidad al Plan de Dios.</em> María se muestra totalmente disponible para hacer lo que Dios le pide. Esta actitud es la de un corazón que se ha educado en decir sí en cada cosa pequeña, un corazón que se ha educado en pensar primero en los demás que en sí mismo. Aprendamos de María a tener esa apertura, esa generosidad sin medida que se entrega por completo y por amor a Dios y a los demás.</li>
<li><em>Confianza en Dios y en sus promesas.</em> María ha meditado desde pequeña las promesas hechas por Dios al pueblo de Israel. Ella las conoce y sabe que Él siempre ha sido fiel a pesar de la debilidad del pueblo. Su confianza no es ciega, está basada en las acciones de Dios. Ella ha dejado que Él sea el centro de su vida, se ha abierto a su amor. En ella están representados los anhelos y las luchas de un pueblo que, aunque frágil ha creído en Dios. Aprendamos de María a confiar en que Dios siempre cumple sus promesas y que con nosotros no va a hacer una excepción porque Él es infinitamente Bueno y fiel.</li>
<li><em>Valentía.</em> María no se achica frente a la misión excepcionalmente grande que le anuncia el ángel. Tiene miedo sí, pero se lanza con valentía a cumplir el Plan de Dios. Aunque sea una niña, ella confía profundamente en la gracia de Dios que agiganta sus pequeños esfuerzos y es capaz de reconocer el valor de su sí, el valor que Dios le da a la entrega libre de nuestra humanidad. Aprendamos de María a confiar en que Dios puede hacer cosas grandes con nuestra pequeñez cuando se la entregamos totalmente.</li>
</ul>
<p><em>Para conocer mejor a María misionera, vamos a leer algunos pasajes del Evangelio. Lo haremos utilizando las fichas que sigue durante 10 minutos (se dividen en grupos de acuerdo al número).</em></p>

<p><em>Repasar cada uno de los pasajes de la Biblia y descubrir cuál ha sido la misión de María, de qué manera la ha cumplido, qué actitudes misioneras ha tenido. Luego compartiremos lo trabajado en los grupos y el animador tendrá en cuenta las siguientes consideraciones:</em></p>
<ul>
<li>En la Anunciación (Lc 1,26-38), <strong><em>María es la primera evangelizada</em></strong>. Dios encomienda a María la misión de ser la Madre de su hijo Jesucristo. Años más tarde, desde la cruz, Jesús completa el mandato misionero de María, al encomendarle la misión de ser la madre de la Iglesia y de la humanidad redimida: «Mujer, he aquí a tu hijo» (Jn 19,25-27).</li>
<li>Apenas ha recibido la misión, María «sale de su tierra» para «llevar a Jesucristo» «más allá de las fronteras», hacia la casa de su prima Isabel (Lc 1, 39-45).</li>
</ul>

<ul>
<li>En Belén (Lc 2,1-18), <strong><em>María es la primera evangelizadora</em></strong>. Ella es misionera al dar a conocer a Jesucristo a todos los que se acercan al pesebre: los pastores y los magos, entre ellos.</li>
<li>En las bodas de Caná (Jn 2,1-11), María conduce a los sirvientes por el camino de la obediencia a Jesús «Hagan lo que Él les diga...». Por primera vez nos muestran los evangelios a María cumpliendo su <strong><em>misión como intercesora</em></strong>.</li>
<li>A los pies de la cruz, María recibe una <strong><em>nueva misión: ser madre de la Iglesia y de la humanidad</em></strong>. A partir de entonces, maría cumple el encargo de acompañar a la Iglesia y a los hombres en su peregrinar por este mundo, hasta su encuentro definitivo con el Padre.</li>
<li>En Pentecostés (He 1,12-14;2,1-11) María está junto a la Iglesia naciente. Ella <strong><em>acompaña a los apóstoles en el comienzo mismo de la misión de la Iglesia</em></strong>, cuando el Espíritu Santo desciende sobre ellos y los envía a la misión.</li>
</ul>

<h1 data-kicker="3er año · África (Verde) · Pastoral">Mundo juvenil y desafíos</h1>
<p class="subt">Juventud «cómo podemos vivir el carisma»</p>
<p class="cita-der">«La juventud es una etapa original y estimulante de la vida, que el propio Jesús vivió…» <em>Christus vivit</em> #22</p>

<h2>Objetivo y recomendación al facilitador</h2>
<p><strong>Objetivo:</strong> Brindar herramientas que inyecten un perfil Allamaniano en los jóvenes para que sean misioneros de la Consolata en los distintos contextos y situaciones de la vida familiar, social y pastoral.</p>
<p><strong>Recomendación para el Facilitador:</strong> para introducir el tema, es importante crear un clima de confianza con el grupo receptor y para lograrlo entablemos un diálogo con las palabras claves: juventud, carisma y desafío. Es importante recordar que como jóvenes seguidores de Jesús con apellido <strong><em>Consolatino</em></strong> debemos reconocer lo interesante de ser testigos de Dios en el ahora - en nuestro entorno.</p>
<p>Es decir, que una vez que se ha tenido la experiencia de encuentro con Cristo, podamos trasmitir que hay algo en nosotros que nos mueve y nos inspira. ¡Qué gloria tan grande no les esperará, entonces, a los que comunican el Espíritu! (2 Corintios 3,8) Leer 2 Corintios 3, 17 -18.</p>
<p>Un - una joven, con la experiencia del <em>encuentro</em>, continúa en la búsqueda, a fin de saciar las ansias de contagiar al resto del mundo; como la experiencia de Pablo «Ay de mí si no comparto el evangelio» (1 Cor. 9,16). Hay la necesidad dar a conocer que con Jesús vemos al Padre y en el hemos encontrado a María.</p>
<p>Un cristiano no puede quedarse para sí con todo lo que ha recibido, porque si no muere ensimismado. Es por eso que El – la joven siente arder su corazón que le da el coraje de expresarlo todo y un - una joven en clave de camino desea expresar al mundo su experiencia de fe que le motiva, le sostiene y lo hace sentirse amado y llamado. (Leer: Así los quiero #23)</p>

<h2>Ejercicios y contextualización</h2>

<h3>Contextualización: juventud – carisma – desafío</h3>
<p><strong><em>Lo fascinante de ser Joven:</em></strong> Aunque no sea fácil llegar a esta etapa de la vida porque la pubertad a veces puede llegar a ser emocionalmente no tan bella. Vivir el proceso juvenil puede convertirse en la mejor parte de nuestras vidas. Esto si realmente tenemos claro el concepto de ser joven: los libros nos pueden dar conceptos complejos pero los valores, el acompañamiento y el reconocimiento recibido en la familia combinados con los valores sociales y educativos pueden darnos la oportunidad de vivir y disfrutar agradecidos por todas las experiencias que vivimos y recordaremos siempre con el pasar de los tiempos.</p>
<p>Juventud es sinónimo de energía, fuerza y vigor. <em>«Los jóvenes son arriesgados y atrevidos cuando tienen la convicción de que están en lo correcto. La valentía y el presente vivido a fondo, son claves en la actitud de nuestra juventud que busca ser comprendida desde su condición juvenil»</em>. (CAPyM #161)</p>
<p><strong><em>Un don heredado,</em></strong> El carisma es un regalo de Dios para con nosotros, redescubrirlo a él en nuestro diario vivir y reconocerlo en el otro es la mejor experiencia que podemos tener. Los dones se nos han dado para vivirlos, disfrutarlos y poner al servicio de los demás.</p>
<p><u>Ir al otro = <em>ad gentes</em>,</u> es abrir el corazón y ser capaces compartir lo que hemos recibido y es esto lo que el San José Allamano presenció y vivió en sus largas horas de contemplación del cuadro de la Virgen Consolata. Experimento la Consolación que María recibió y que hoy nos invita a nosotros a vivirla y compartirla.</p>
<p>El momento en que comprendamos que el carisma de los misioneros de la Consolata es llevar consolación al otro, entenderemos que allí nace nuestro primer ad gentes, nuestro primer salir, un salir de sí para encontrarte en el otro, en y con el hermano.</p>
<p><strong><em>Cada despertar;</em></strong> Es un desafío, no de la forma en ahora que me toca enfrentar; sino de cómo lograr <strong><em>NO</em></strong> perder la autenticidad, es ser valientes para ser nosotros mismos a pesar de la amenaza de la presión social del que dirán, una batalla que siempre los seres humanos, pero de manera especial un joven le toca sobrellevar.</p>
<p>S.S el papa Francisco ha venido pidiendo que no, nos dejemos robar la alegría y la esperanza. ¡Ciertamente esto es un gran desafío! Pero cuando reconocemos que los jóvenes, son alegres, espontáneos y creativos sabemos bien que pueden seguir adelante tal como un nuevo día, un nuevo renacer.</p>
<p>Por lo tanto, los retos se pueden volver su plato preferido <em>«Los jóvenes viven escenarios cargados de inseguridad fragilidad, pero llenos de <strong>sueños</strong>, que le permitirán encontrar un sentido en su vida, y dar vida a la vida»</em> (CAPyM #170)</p>

<h3>Perfil allamaniano: valentía y coraje</h3>
<p>Nuestro Padre fundador José Allamano en su juventud demostró varias osadías que lo llevaron a encararse con el mismo. Una fue la experiencia del encuentro con Cristo en su aprender desde los valores cristianos del hogar, la sociedad y en el colegio de don Bosco. Valores que fueron haciendo de su corazón la necesidad de responder a lo que se sentía llamado.</p>
<p>Este discernir a una vocación específica, va más allá de un deseo propio y se vuelve en algo compartido. Su deseo de ser sacerdote estaba empujado por el servir al anuncio del evangelio con la misma vida, lo que implica el servir a los demás, en salir de sí para ir al otro. <em>Recuerden las palabras del Señor Jesús: Hay mayor felicidad en dar que en recibir.</em> (Hch.20, 35)</p>
<p>Por lo tanto, al terminar su bachillerato opto por escaparse de la órbita de don Bosco del oratorio de Valdoco, una tarde del domingo en el tiempo libre. Lo que pudo provocar que la madre lo llevara de regreso y de la oreja; pero al explicar lo que ardía en su corazón de ser sacerdote diocesano hizo que su madre comprendiera y aceptara tal aventura de escape.</p>
<p>La otra osadía fue la de enfrentar a sus hermanos mayores, que le orientaban a continuar sus estudios; pero a pesar de su corta edad, pero gran madurez de su vocación logró convencerlos con esta respuesta: <strong><em>«El Señor me llama hoy… No sé si me llamará dentro de unos años»</em></strong>. (Efren Baldasso imc 1997 Me llamo José Allamano)</p>
<p>La valentía y el coraje son considerados como cualidades que componen la capacidad transformadora de la juventud en una sociedad.</p>
<p><strong><em>Dice la canción Alto escúchame:</em></strong></p>
<p class="cita"><strong><em>…Que alegría es ser, un testigo de Dios, es sentirse con fe en el corazón, y aunque todos me digan que eso no es verdad yo lo siento en mi vida aún mas mucho más…</em></strong></p>

<h2>La clave de José Allamano: oración, estudio y disciplina</h2>
<p>¿Cómo podemos hacer el bien sino estamos unidos a él? Así los quiero #176</p>
<p>Todos preservaremos la fe, si nos mantenemos unido al Padre. En la vida y por tanto en la sociedad, se nos van a presentar obstáculos a diestra y siniestra, pero aquel que ha tenido la experiencia del ENCUENTRO sabe que el secreto está en mantenernos unidos a quien nos atrajo.</p>
<p>José Allamano en sus escritos nos habla de la importancia de la oración y de allí deriva su deseo que seamos eucarístico y marianos ¡Ya lo sabemos!, y no era secreto; cuando no se conseguía al fundador por los pasillos, se podía casi adivinar ¿Dónde estaba?, ¿Dónde permanecía?; Pues allí, en el santuario con una vista especial al santísimo y al cuadro de la Consolata. Lo que él siempre atribuyo que la valentía para fundar el instituto tanto de los sacerdotes como de las hermanas era solo obra de Ella y por ende de Dios. El sostenimiento de todo solo era posible en la relación constante de su oración.</p>
<p>Alcanzar comprender que es tener una <em>espiritualidad</em> es un paso fascinante de saber que es <em>un estilo de vida</em> que cada uno puede lograr y optar por vivir. Ese también era el secreto de Jesús el de Nazareth: Siempre buscaba un momento para eso, para encontrarse con quien lo había enviado.</p>
<p>Un joven que vive su ser cristiano = misionero debe fundamentar su vida – su fe en la oración. <em>Ustedes los reconocerán por sus frutos… Mt.7, 16.</em></p>
<p><strong><em>Nuestro actuar en la sociedad es ser profetas hoy.</em></strong></p>
<p>Muchas veces caemos en preguntarnos, pero ¿Qué puedo hacer yo?, esta pregunta ya está descartada de la lista de las excusas. Fue la misma que se hizo Jeremías (Jr. 1, 6), Salomón (1 R 3,7), Timoteo (1 Tm 4, 12). Es muy fácil tirar la toalla a la primera, pero se debe a que sentimos la inseguridad de no poder lograr con éxito de lo que nos piden, deseamos y nos proponemos.</p>
<p>Allamano se preocupó por ser un buen estudiante, él quería ser un buen sacerdote para así estar listo para la misión. Es por eso que se dedicó en estar atento, por ser juicioso en lo que quería y para que lo quería. Su formación fue sostenida por la voluntad y la pasión con que estudiaba; esa que se necesita para predicar con la vida.</p>
<p>Si la inseguridad y el desconocimiento nos atacan cuando toca hablar en público, o dirigir un momento de oración, saltamos a decir que no sabemos cómo hacerlo. Es cuando debemos tomar el ejemplo del fundador: No alcanza solo la buena voluntad. Es importante que estemos formados, es necesario que conozcamos a quien anunciamos.</p>
<p>La ley universal es que todos tengamos un conocimiento integral – amplio y el Allamano siempre fue exigente incluso con sus misioneros y misioneras. «El verdadero apóstol es también el que sabe» (Así los quiero #52). Cuando sabemos a que Dios seguimos, sabemos a que Dios queremos anunciar. Y nace el deseo inclusive de ser un imitador del resucitado ese que brindo esperanza al oprimido y vista al ciego.</p>
<p>Hoy los sitios de misión son diversos y por tanto se necesitan personas con las capacidades y demandas de esos lugares, de esas situaciones. A demás, eso nos permitirá ser coherente con el ritmo que lleva el mundo actual y los conocimientos recibidos en las formaciones, capacitaciones y experiencia misioneras serán herramientas que nos servirán para sentirnos capaces y misioneros las 24 horas del día y en cada lugar que estamos: la familia, la comunidad, la universidad, el trabajo.</p>
<p><em>Ustedes son el ahora de Dios. Leer Christus vivit #64</em></p>

<h3>Una combinación extraordinaria</h3>
<p>Para que seamos personas con una espiritualidad firme y contagiosa, y seamos capaces de atrevernos a ser profetas que anuncian y denuncian, la disciplina es la clave y esto nos fácil porque <strong>NO</strong> es cuestión de horarios y esquemas para orar o formarnos. Esto son formas que nos pueden ayudar, pero prima el deseo de ser auténticos discípulos misioneros con ella vendrán los momentos que nos forjarán cada día.</p>
<p>La clave está en ser constante, ser perseverante y es donde tal vez recordaremos algunos al +P. Andrea Bignotti imc, quienes lo conocimos podríamos calificar que su charla favorita entre varias era la de PROYECTO DE VIDA, es aprender a equilibrar lo que somos, lo que tenemos y lo que soñamos.</p>
<p>Un proyecto es un sueño y esto se ven inspirados por los deseos (Necesidades e intereses). Deseo ser misionero o tal vez santo, deseo ser un buen testigo, deseo ser fragancia que da vida. Recordemos la parábola del Joven Rico ¿Qué necesito para ganar la vida eterna?</p>
<p>Muchos podemos hacer proyectos sobre todos proyectos académicos que nos pueden estresar cuando lo necesitamos para graduarnos. Pues igual pasa con la vida que deseamos, tal como un proyecto académico puede ser más interesante cuando es aplicado, así necesitaremos en nuestro andar misionero. Necesitamos saber a dónde vamos y que queremos lograr con eso.</p>
<p>Les aseguro que la inversión disciplinaria en tu proyecto. Será lo más agradecido con tu vida, porque aprenderás a optar, valorar y equilibrar los sueños, el tiempo, las personas, entre otros. A los discípulos les tocó duro, pero la experiencia de sentirse invitados a ser parte del proyecto de Dios fue la mejor justificación teórica para haber dejado todo y seguirlo.</p>
<p class="conclusion"><strong><em>Conclusión:</em></strong> Para ser un joven identificado con el carisma Allamaniano y Consolatino, primero debemos estar consciente de nuestro ser cristiano que es corresponder a la vocación de sentirse llamado a ser discípulo. Ese que aprende y luego comparte lo que recibió. Leer Juan 15, 1 -17. ¡Ah! y no se olviden de vivir en espíritu de familia.</p>

<h2>Segundo ejercicio: «Así los quiero»</h2>
<p><strong><em>2° EJERCICIO: Así los quiero</em></strong></p>
<p>Entregar un pedazo de papel a cada joven para que el escriba aquello que desea presentarle a los pies de María. Ella que es la promotora de todo, confidente del fundador e intercesora ante el Padre hará llegar nuestras peticiones al SEÑOR. Al escribir cada joven se acercará al área donde estará oculto el espejo con sus nombres alrededor cada joven pondrá cerca a su nombre su petición. Y luego ambos cuadros se juntarán para hacer la oración final. (De fondo se puede colocar una canción que motive el momento de oración)</p>
<p><strong>Ejemplo:</strong> <em>Así los quiero…</em> (una imagen de la Virgen Consolata con tres rótulos «Nombre» junto a un espejo con otro rótulo «Nombre»).</p>

<h3>Dinámica: la «flor»</h3>
<p>Consiste en motivar a los presentes a diseñar en una hoja la imagen de una flor con pétalos según la cantidad de lo participantes (11 personas – 11 pétalos) en el centro de la flor identificarán su flor el nombre de cada uno, la dinámica consiste en ir haciendo un ejercicio de ruleta para que cada participante pudiese escribir en cada pétalo alguna palabra que les inspire la persona dueña de la flor pudiendo ser una cualidad, un mensaje, una palabra.</p>
<p>El juego se detiene cuando ya cada persona tiene su flor, quedando un pétalo vacío leerá y escribirá algo que allí cree que le falta, luego cada uno escogerá aquella que más le ha gustado y explicara porque se identificó con esta palabra y la que él mismo ha escrito. El fin de esta dinámica pueda variar, pero es importante ejecutarla con el fin de enriquecernos y animarnos mutuamente por aquellas cualidades y mensajes que se nos han dedicado.</p>

<h1 data-kicker="2do año · Asia (Amarillo) · Espiritualidad">La oración y formas de orar</h1>

<h2>Dinámica: esgrima bíblico</h2>
<p><strong>Antes de comenzar</strong></p>
<p>Este tipo de competencia se basa en encontrar un texto bíblico de la forma más rápida posible. Lo importante es que deben de saber leer y saber cómo se maneja una Biblia, es decir, encontrar pasajes bíblicos.</p>
<p>Realiza una lista de versículos bíblicos (solo nombre del libro y cita), al menos unos 10. Considera entregar un premio o recompensa al ganador, esto motivará más a los participantes. Cuando ya tengas listo lo anterior, ahora debes seguir estas instrucciones:</p>
<p>Pon en fila a todos los participantes. Cada uno tomará su Biblia con una mano y la alzará, es decir, no pueden tener su Biblia abierta, ni en el piso, ni de cualquier otra forma. Ahora, tú dirás el primer versículo bíblico, por ejemplo, Juan 3:16 (Ojo, solamente el nombre del libro y la cita, no tienes que leer que el versículo completo porque de eso se encargarán los participantes). ¡¡Cuando lo hayas dicho, tienes que gritar la palabra Esgrima!! Y es entonces cuando los participantes pueden bajar sus biblias y comenzar a buscar. ¡¡¡Cuando un participante haya encontrado el versículo, tiene que gritar rápidamente Esgrima!! y leerlo. De esta forma habrá ganado la primera ronda. Es muy importante resaltar que, si no grita la palabra Esgrima y lee el versículo, no es válido su punto.</p>
<p>Es importante que valides que el texto que estén leyendo sea el correcto, porque muchas veces confunden de libro o cita. El participante que haya tenido más puntos es el ganador.</p>

<h2>Oración inicial: oración de los 5 dedos</h2>
<p>Iniciar con la invocación a la Santísima trinidad, y pedir a cada participante que en el silencio con papel y lápiz dibujen la silueta de una mano (se pueden guiar utilizando la suya), en donde irán escribiendo una oración en cada dedo según las indicaciones que el facilitador les vaya indicando. (Ver dibujo Anexo).</p>

<h2>Tema: la oración</h2>
<p><em>El facilitador iniciará la ponencia explicando que es la Oración y a su vez dará paso a un dialogo con los participantes para enriquecer el momento de aprendizaje, seguidamente para explicar cómo podemos orar de diversas maneras, invitará a los participantes a que se dispongan a ir realizando cada tipo de Oración que se les presente y así hacer vivencial el encuentro formativo.</em></p>
<p class="cita"><strong><em>«Quiero, pues, que los hombres oren en todo lugar elevando hacia el cielo unas manos piadosas, sin ira ni discusiones.» (1 Tim 2,8)</em></strong></p>

<h3>Oración</h3>
<p>El Nuevo Catecismo nos dice: <strong>«La oración es la relación viva de los hijos de Dios con su Padre infinitamente bueno, con su Hijo Jesucristo y con el Espíritu Santo».</strong> (CC 2565).</p>
<p><strong>«La oración es el encuentro de la sed de Dios y de la sed del hombre. Dios tiene sed de que el hombre tenga sed de Él».</strong> San Agustín.</p>
<p><strong>«Para mí, la oración es un impulso del corazón, una sencilla mirada lanzada hacia el cielo, un grito de reconocimiento y de amor tanto desde la prueba como desde dentro de la alegría».</strong> Santa Teresa del Niño Jesús.</p>
<p><strong>«Cuando se ama, se desea hablar constantemente con el amado, o al menos contemplarlo incesantemente. En eso consiste la oración.»</strong> Santo Charles de Foucauld (Hermano Carlos de Jesús)</p>

<h3>¿Cómo orar podemos orar?</h3>
<ol class="inv">
<li value="8"><em>Adoración</em></li>
<li value="7"><em>Entrega</em></li>
<li value="6"><em>Alabanza</em></li>
<li value="5"><em>Agradecimiento</em></li>
<li value="4"><em>Reparación</em></li>
<li value="3"><em>Arrepentimiento</em></li>
<li value="2"><em>Intercesión</em></li>
<li value="1"><em>Petición</em></li>
</ol>

<h3>Oración de petición</h3>
<p>La forma más inferior de oración consiste en pedir cosas a Dios. No está mal, pero es la forma más baja de oración. Tenemos que tener cuidado que nuestra oración no sólo sea una pedidera, una lista de cosas para que el Señor nos las dé.</p>
<p>La mayoría de las veces nuestra oración parece una lista de mercado o de cosas por hacer.</p>

<h3>Oración de intercesión</h3>
<p>Subimos un poquitico en la escala de oración. Comenzamos a ser algo generosos, menos egoístas que con la oración de petición.</p>
<p>Consiste en pedir por alguna persona que no es uno mismo. Pedir a Dios algo para alguien, o pedir por alguna cosa más general, como, por ejemplo, la paz del mundo, etc. Es una oración un poquito menos egoísta que pedir sólo para nosotros mismos.</p>

<h3>Oración de arrepentimiento</h3>
<p>Consiste en pedir perdón por nuestros pecados. Pedir perdón cuando le fallamos a Dios. Recordemos que debemos arrepentirnos de veras, de manera perfecta: porque Dios me ama y no merece mi rechazo cuando peco... porque pecar es rechazar a Dios, expulsar a Dios de mi vida.</p>

<h3>Oración de reparación</h3>
<p>Consiste en pedir perdón por los pecados de otros. Hay gente que no se arrepiente y podemos orar a Dios por esas personas.</p>
<p>Recordemos a Jesús en la cruz. ¿Qué dijo sobre los que lo crucificaron y se burlaban de Él? <em>«Padre: perdónalos, porque no saben lo que hacen»</em> (Lc. 23, 34). Jesús estaba haciendo una oración de reparación por los pecados de esos hombres.</p>
<p>Nosotros podemos reparar por las ofensas que recibe Dios de parte de tanta gente, que lo rechaza, que lo critica, que le reclama.</p>

<h3>Oración de agradecimiento</h3>
<p>El significado de esta forma de oración es claro. Pero ... ¿cuántas veces oramos agradeciendo a Dios por <strong>todo</strong> lo que nos da? Hay que ser agradecidos con todo el mundo, pero principalmente con Dios.</p>

<h3>Oración de alabanza</h3>
<p><strong>¿Cómo alabamos a Dios?</strong> Diciéndole lo grande que es, lo bueno que es, las maravillas que ha hecho, las maravillas que hace en mi vida: todo lo que me ha dado a mi particularmente en mi vida, y todo lo que nos ha dado para el disfrute de todos.</p>
<p>Cuando vemos el mar, las montañas, el cielo, los astros ... todo lo que Dios ha puesto para nosotros ... ¿cómo no pensar en la grandeza de Dios? ¿Por qué no decírselo? (<u><strong>Salmo 139 (138) versículos 1-17</strong></u> - leer pausadamente).</p>

<h3>Oración de adoración</h3>
<p><strong>Es la adoración al Señor lo que nos hará libres, porque al adorar estamos en la Verdad:</strong> nos reconocemos creaturas, es decir, hechura de Dios, dependientes de Él. Reconocemos que no nos valemos por nosotros mismos (si cada latido de nuestro corazón depende de Él, ¿de qué podemos presumir?</p>
<p>Debemos inclinarnos, arrodillarnos, postrarnos ante El, pero no sólo con el gesto físico que debemos hacer, sino verdaderamente <strong>en actitud de inferioridad absoluta</strong> ante Quien nos posee, porque nos ha creado. En actitud de quitarnos nuestras coronas de orgullo, de engreimiento, de independencia ante Dios. Quitarnos el hábito de estar continuamente tratando de disponerle a Él.</p>
<p><em>Formas y expresiones:</em></p>
<ul>
<li>Oración Vocal</li>
<li>Oración Contemplación</li>
<li>Oración Meditación</li>
<li>Oración Postración</li>
</ul>

<h2>Lectio Divina</h2>
<p>El <strong>Papa Benedicto XVI</strong> nos recomienda esta antigua práctica que literalmente quiere decir «lectura de Dios»</p>
<h3>¿Qué es?</h3>
<p>Es la lectura de la Sagrada Escritura de un modo no académico, sino espiritual, lo que nos permitirá «conocer a Jesús de un modo cada vez más personal, escuchándolo, viviendo con él, estando con él, siendo sus amigos, en una comunión de pensamiento que «no es algo meramente intelectual, sino también una comunión de sentimientos y de voluntad, y por tanto también del obrar».</p>
<h3>Pasos</h3>
<p><strong>Invoca</strong> al Espíritu Santo. Pídele que te ilumine y te abra a la comprensión de la Palabra y que te anime a la respuesta con tu vida.</p>
<ol>
<li><strong>Leer</strong> muy despacio el texto bíblico. Vuelve a leerlo. Dale tiempo al Señor y escucha el mensaje que Él quiere darte en esta Palabra.</li>
<li><strong>Meditar</strong> Una vez que hayas captado el sentido del texto, entonces puedes hacerte esta pregunta: qué me dice esta Palabra.</li>
<li><strong>Orar</strong> Respóndele al Señor que te ha dado su mensaje en la Palabra meditada. Tu actitud sea la de la Virgen María: Hágase en mí según tu Palabra.</li>
<li><strong>Contemplar</strong> Quédate impresionado, fascinado, en silencio, en calma. Déjate animar por el ardor de la Palabra, como quien recibe el calor del sol.</li>
</ol>
<p><strong>Actúa</strong> haciendo un compromiso que brote de este encuentro con el Señor. Animado e invadido por la Palabra, regresa a la vida con otra actitud.</p>

<h1 data-kicker="2do año · Asia (Amarillo) · Espiritualidad">Encuentro con quien me ama</h1>

<h2>Oración</h2>
<p>Santiguarse e invitar a cerrar los ojos, ir respirando poco a poco, dejando fuera de sí pensamiento, relajando totalmente el cuerpo, iniciar a Alabar a Dios con una Palabra e ir repitiendo la misma palabra en cada inhalación por unos minutos, luego hacerse consciente del momento que Dios les ha regalado de calma y paz y dar espontáneamente acciones de gracias a Dios.</p>

<h2>Dinámica: las rosas</h2>
<p>Esta dinámica se pueden hacer durante o al final de la exposición y también es una manera práctica de dar a entender el mensaje que tratamos de trasmitir.</p>
<p>Consiste en representar las vidas de los participantes con la rosa, la belleza de la misma proyecta la hechura perfecta del ser humano al nacer, pero, mientras nos desarrollamos y vamos creciendo en edad, esta rosa se ha ido deshojando. Durante el relato, (se deshoja poco a poco) se señala como los golpes de la vida, las malas experiencias, traumas, frustraciones, faltas de amor, no aceptación, y toda clase de heridas han ido quitando la belleza con la que fuimos creados. Cuando queda totalmente deshojada, representa muchas veces como nos encontramos en este momento. Es más, puede suceder que haya habido personas que hasta nos han pisoteado y nos encontremos así... por los suelos. (Lo fuerte de la dinámica es «no quedarse hasta ahí, sino, hacerle saber que el Amor de Dios es tan grande y maravilloso que el día hoy quiere restaurar la belleza original con la que te creo y que para el siempre eres bello(a) a sus ojos, no importando todo lo que hayas sufrido. Eres bello (a) otra vez. (La persona que está dando el tema regala una rosa a alguno de los asistentes, si es posible se puede, con la ayuda del equipo, regalar una a cada participante.</p>

<h2>El encuentro personal con Jesucristo</h2>
<h3>La persona es fruto, en gran parte, de sus encuentros</h3>
<p>Toda persona ha llegado a ser lo que es, en buena medida, por los encuentros que se han producido en su vida: Encuentros con la naturaleza, con la ciencia, con la música, con el trabajo, con la poesía, con amigos, con maestros, con la familia (padres, hijos, hermanos, parientes…), con el grupo, asociación, movimiento, etc. Encuentros, incluso, con la enfermedad o limitación. Y otros muchos encuentros que no mencionamos aquí y que seguramente recordaremos…</p>
<p>Todo encuentro termina por enriquecer a la persona, aunque sean encuentros desagradables, sobre todo si uno lo sabe situar en su interior, porque todo encuentro con otro afecta a lo más íntimo de la persona humana.</p>
<p>Cada persona tiene una intimidad invisible, que manifiesta en gestos y palabras y símbolos visibles:</p>
<p>Una cara larga, manifiesta tristeza; un apretón de manos puede expresar acogida; la alianza que se entregan los novios el día de su boda simboliza compromiso de amor y fidelidad…</p>

<h3>El encuentro con el Dios de Jesucristo</h3>
<p>La persona humana, invisible en su intimidad, se manifiesta por símbolos, gestos… El encuentro con Dios ocurre de la misma manera que el encuentro entre personas. Dios «a quien nadie ha visto jamás» (Jn. 1, 18) también se nos manifiesta de forma simbólica. Si un gesto material puede ser portador de un sentido humano y personal, de la misma manera, una realidad humana, un acontecimiento histórico o natural, puede estar cargado de presencia de Dios: la belleza de la naturaleza, la amistad ofrecida a otro enfermo o discapacitado, la lucha en la vida, la reivindicación por eliminar barreras, la solidaridad, el amor de una familia, el respeto a los otros, el nacimiento o la muerte de un ser querido… De esta manera, nuestro yo íntimo y personal, toda persona humana, la naturaleza, la sociedad, la historia son el lugar del encuentro con Dios y expresión del mismo Dios. Pero la manera más completa de manifestación de Dios ha sido su Hijo Jesucristo, con su talante personal y su manera de relacionarse con los demás y de presentar al propio Dios como Padre. A través de sus gestos, de sus palabras, de sus compromisos, de su manera de entender la vida y las relaciones entre las personas, de sus denuncias, de sus silencios y retiros para orar…, es como Jesucristo nos revela al Dios cristiano. Y ello, con su cuerpo y las manifestaciones que se expresan a través de él, con sus sentidos, su manera de hablar y escuchar, sus formas de mirar, la expresión de sus sentimientos de pena, alegría, amor… El encuentro con el Dios cristiano no es un encuentro cualquiera con la divinidad, con un Dios sin rostro o un Dios lejano y temible. Se da cuando nos encontramos con Cristo y tratamos de reproducir en nuestras vidas la experiencia que Jesús tuvo de encuentro con el Padre y con las personas, sus hermanos. No se puede entender a Dios sin lugares privilegiados y concretos de encuentro.</p>

<h3>La Iglesia, lugar de encuentro con Cristo</h3>
<p>Sin la Iglesia sería imposible encontrarnos con Jesucristo. Sin la Iglesia, Jesucristo habría quedado reducido al anonimato de la historia.</p>
<p>Si cada uno hemos oído hablar de Jesucristo, de lo que significa ser cristiano, si hemos encontrado su mensaje, la riqueza de su persona y su acción liberadora, ha sido porque nos hemos encontrado con grupos o con cristianos que realizan la misión de la Iglesia: Anunciar a Jesucristo.</p>
<p>La Iglesia, a pesar de sus ambigüedades y de sus defectos, ha continuado a lo largo de la historia la misión liberadora de Jesús, siendo sacramento, es decir, signo y símbolo de su presencia, su palabra, su amor y liberación entre los hombres.</p>

<h3>Los pobres, lugar de encuentro con Cristo</h3>
<p>El Dios de Jesús es un Dios que se ha manifestado a los pobres y que ha sido experimentado como liberador por los pobres; es un Dios que asume la causa de los pobres, de los enfermos y limitados y toma partido por ellos. A ellos les promete su Reino.</p>
<p>Por eso, el encuentro con el Dios cristiano nunca puede ser pleno sin el encuentro con los pobres, sin solidaridad con ellos y sin un compromiso en su proceso de auto-liberación. Desde la experiencia de solidaridad con los pobres y oprimidos podemos encontrarnos con el Dios revelado por Jesucristo, podemos captar el auténtico mensaje cristiano. Son los pobres, en cuanta víctima de la opresión y la injusticia, de la estructura social, de la enfermedad, quienes nos hacen descubrir el verdadero sentido de la vida, de la obra y del mensaje de Cristo.</p>

<h1 data-kicker="3er año · África (Verde) · Pastoral">Discípulo misionero</h1>

<h2>Oración inicial</h2>
<p><em>Inicia con la invocación a la Santísima trinidad y se invita a escuchar activamente el relato siguiente:</em></p>

<h2>El hombre más extraordinario</h2>
<p>Tiene entre 30 y 40 años. Es un obrero robusto, capaz de sufrir noches de vigilia, largas jornadas de camino bajo el sol. Su presencia y su mirar seducen. Sabe estar tan lleno de piedad como de indignación. Sus palabras son a veces rudas, otras afectuosa, pero siempre directa. Muestra que penetra los pensamientos y los corazones de los que lo rodean. Conoce el trabajo de los hombres, porque lo ha practicado largo tiempo.</p>
<p>Es un hombre lleno de buen sentido que no se contenta con palabras, que quiere actos.</p>
<p>No es un intelectual, porque no ha frecuentado las escuelas, pero sus conocimientos son profundos y amplios, animados de una viva imaginación: sabe presentar las escenas de la vida cotidiana, los oficios, las fiestas, las estaciones del año.</p>
<p>Comprende a las gentes por instinto, porque su sensibilidad, que es viva, abre los corazones a las necesidades de los otros. Y todo esto lo realiza sin demagogia.</p>
<p>Guarda en todo un equilibrio magnífico. No como todo el mundo. Es un separado. Ha dejado su trabajo profesional para cumplir una misión itinerante, ¿De qué vive entonces? De la hospitalidad de los amigos, de los regalos. Además, de todo eso no se preocupa.</p>
<p>Un régimen frugal, en un ambiente que le encanta, le es suficiente, sin desdeñar la ocasión de hacer honor al que le invita. Y esta vida ruda, día a día es la que propone a sus compañeros.</p>
<p>No está casado, pero no tiene repulsa hacia las mujeres. Les habla directamente y con cortesía. Libre de todo lazo, se pone a disposición de todos, para servirles, para amarles y hacerles amar. Los que sufren en su alma o en su cuerpo son los que atraen su benevolencia. Es sencillo, acogedor, hombre de pueblo y gran señor a la vez.</p>
<p>No se une a una clase social, a pesar de su preferencia hacia los pobres. Guarda una soberana independencia respecto a los que le solicitan: familia, amigos, adversarios, autoridades religiosas y civiles, opinión pública.</p>
<p>No hace política. No se mezcla en negocios. Su empresa va más lejos y más alto. Cumple su misión con una impresionante autoridad. Que nadie busque influenciarle, para hacerle torcer la línea de su destino: entonces reacciona vivamente. Además, jamás consulta a nadie sobre lo que tiene que decir o hacer.</p>
<p>Nunca se vuelve atrás. Jamás duda. Tranquilo, seguro de sí, domina y construye su destino, su drama. Saber actuar con paciencia, progresar, adaptarse, pero siempre marchando en línea recta.</p>
<p>Afronta lúcidamente, valientemente la incomprensión, la envidia, el odio, a lo largo de una lucha sin tregua. Nadie le asusta. Dice la verdad, guste o no guste. Le causan horror los hipócritas y los orgullosos. Permanece insensible ante el entusiasmo irreflexivo de sus admiradores. Sabe descubrir fácilmente las trampas de sus enemigos. Con toda paciencia corrige los errores de sus amigos. Admira la fe y la generosidad de los humildes, anima la confianza que le dan sus compañeros, pero sin adularlos nunca. Les confía sus designios, los asocia a su misión. Este retrato es rigurosamente histórico. Este hombre es auténtico. SE LLAMA JESUS.</p>
<p>Su grandeza intriga, pero no aplasta. Su amor libera y estimula.</p>
<p class="firma">«MAURICE PROIX».</p>

<h2>Dinámica: la red (la llamada)</h2>
<p>El facilitador invitará a los participantes a que se coloquen en círculo y con hilo en mano les indicará la presentación que deben realizar cada uno antes de tirar el rollo de hilo a otro compañero, al concluir todos (o al terminarse el hilo), habrán conformado una red, en base a la cual el facilitador compartirá una pequeña reflexión en relación a la lectura escuchada en el momento de oración y que dará inicio a la ponencia de la temática, (la red se dejará en el piso, sirviendo de ambientación y como complemento para la oración final).</p>

<h2>Tema: ser discípulo de Jesús</h2>
<h3>Introducción</h3>
<p>Podemos comenzar por conocer más a profundidad de donde proviene la palabra ¿discípulo? Originalmente de griego «maqhth» que se dirige a todo aquel «Estudioso», «aquel que sigue al maestro» Jesús enseñaba en las sinagogas de los judíos (Lc 4, 15). Así mismo desde Juan comienza a preparar el camino del Señor… comienza a Bautizar (Mc 1, 1-5); por medio del bautismo somos ungidos por el Espíritu Santo enviados por el Padre a comprender su palabra hacerla nuestra vida cotidiana logrando un aprendizaje por medio de ella, para poder anunciarla por medio del testimonio. No podemos anunciar a un Dios que no conocemos que no habita en nosotros (Ap. Cap 1-22). Para ser Discípulo solo hay que decir como Samuel habla que tu siervo escucha (1Sam 3, 10).</p>

<h3>Desde el primer momento, Jesús hace discípulos</h3>
<p>Los evangelios nos muestran a Jesús rodeándose desde el principio de algunos compañeros, a quienes invita a dejarlo todo y a venir en su seguimiento. Serán los primeros discípulos Simón, Andrés, Santiago y Juan (Mc 1. 16-20).</p>
<p>Del análisis de estas escenas se desprenden conclusiones importantes. Para ser discípulo de Jesús es necesario:</p>
<ol>
<li>«Ser visto» por Jesús: Que él tome la iniciativa y penetre con su mirada nuestro yo.</li>
<li>«Ser llamado» por Jesús: «Venid conmigo», «Ven y sígueme» (Mc 10, 10-21). Es la gracia del llamamiento gratuito.</li>
<li>«Dejarlo todo y seguirlo»: Es la parte del hombre. Es la aceptación y la correspondencia a la invitación del Señor.</li>
<li>«Para ser pescadores de hombre»: En la noción misma de «discípulo» de Jesús está ya escondido un anhelo misionero, tarea apostólica, una donación personal para servir a los demás en orden a conducirlos a Dios.</li>
</ol>

<h3>Diferencia entre «ser discípulo de Jesús y ser de la multitud»</h3>
<p>El evangelio nos muestra que hay una diferencia notable entre aquellas personas que acuden en multitud a Jesús para verlo y escucharlo, y aquellos que son propiamente discípulos suyos.</p>
<p>*Lc 6, 12-13. 17-18 (leer).</p>
<p>Si examinamos con atención este relato, descubriremos fácilmente que existen tres grupos diferentes de personas:</p>
<ol>
<li>«Los Doce» recién elegidos Apóstoles.</li>
<li>«La gran multitud de discípulos».</li>
<li>«La gran muchedumbre del pueblo» que ha venido para implorar favores.</li>
</ol>
<div class="box nota">
<p>Todos en la Iglesia estamos llamados a ser discípulos misioneros, es necesario formarnos y formar a todo el pueblo de Dios para cumplir con responsabilidad y audacia esta tarea… (Ap. Pág. 25)</p>
</div>

<h3>Enseñanzas de Jesús Maestro</h3>
<ol>
<li><strong>Discurso inaugural de Jesús.</strong> La doctrina de Jesús-Maestro no es un sistema de verdades ocultas destinada solamente a iniciados. Su mensaje es universal y desea que llegue a todo el mundo. Por eso razón, ante un numeroso y bien heterogéneo auditorio pronuncia Jesús su «Discurso inaugural» que es el programa del discipulado. Este programa de vida es, en el evangelio de San Mateo. «El sermón de la montaña (Mt 5-7); y en el Evangelio de San Lucas «El sermón en la llanura (Lc 6, 20-49)».</li>
<li><strong>«El Sermón en la Llanura (Lc 6, 20-49):</strong> San Lucas ha captado a través de las palabras de Jesús la hondura de su espíritu, y describe a Jesús profeta «alzando los ojos hacia sus discípulos» y presentándole la Carta Magna del Reino de Dios que él ha venido a inaugurar.</li>
<li><strong>La nueva Ley de Jesús.</strong> *Lc 6, 27-49.</li>
</ol>
<p>Este discurso inaugural de Jesús, lleno de exigentes compromisos, pero pleno también de misericordia y compasión, es todo un programa de conducta para aquellos que queremos ser y nos decimos «discípulos de Jesús».</p>
<p>Este mensaje constituye un detallado cuestionario que nos interpreta profundamente y ante el cual podemos preguntarnos ¿Soy verdadero discípulo de Cristo?</p>

<h3>Lo que Jesús exige a sus discípulos</h3>
<p>Ser discípulo de Jesús es una gracia: se requiere ser llamado y elegido por el Maestro. Es un verdadero privilegio. Pero Jesús es exigente, y solo con la fuerza del Espíritu Santo podrá el discípulo seguir las huellas del Maestro.</p>
<p>¿Acaso no fue el Espíritu Santo quien, como fuerza de Dios, acompaño también a Jesús y lo impulso durante todo su ministerio, desde el Jordán hasta el Calvario?</p>
<ol>
<li>La Cruz de cada día (Lc 9, 23)</li>
<li>Una fe inquebrantable (Mt 8, 23-27)</li>
<li>Un desprendimiento total e inmediato (Lc 14, 26)</li>
<li>Con la Cruz en pos de Jesús (Lc 14, 27)</li>
<li>Una renuncia a todos los bienes (Lc 14, 33)</li>
<li>Abandono total a la Providencia Divina (Mt 6, 25. 32-33)</li>
<li>Ser como niños (Mc 10, 14-15), (Lc 10, 23-24).</li>
</ol>
<p>Para lograr ser verdaderos Discípulos misioneros de Dios debemos atender a su llamado, añadirlo a nuestra vida «buscar la vida en él» «Encontrarlo» y las escrituras nos lo confirman de la siguiente manera:</p>
<ul>
<li>Mc. 3,13 Llamo a los que él quiso…</li>
<li>Mt. 6, 5-7 Los envió de dos en dos…</li>
<li>Mt. 28, 16-19 A donde él les indico – Dios autoridad…</li>
<li>Mc. 16, 15 Vayan por todo el mundo…</li>
</ul>
<p>Al darse el encuentro con el Padre y dejar obrar en nuestras vidas podemos gozar y expresar la alegría de estar en su presencia, así como los discípulos del Señor y de haber sido enviados con el tesoro del evangelio. Se cristiano no es una carga es un Don (Ap. Cap. 1-23) al darse el encuentro y la formación nace la intimidad con Jesús el enviado del Padre y comienza la conversión (Mc. 1,15) para esto es necesario reconocer que Dios es uno y trino y es el espíritu santo actúa en nuestra vida nos hace comprender el llamado y abrir el corazón y la mente revestirse de Cristo y oler a Cristo como lo expresa San Pablo…</p>
<p>Discípulo es aquel que, habiendo respondido el llamado, lo sigue paso a paso por los caminos del evangelio… se ha identificado con el maestro y se siente impulsado al amor y al servicio…</p>
<div class="box nota">
<p>El llamado a ser discípulo-misionero nos exige una decisión clara por Jesús y su evangelio, coherencia entre la fe y la vida, encarnación de los valores del Reino (Ap pág. 24)</p>
</div>
