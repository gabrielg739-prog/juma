    return h <= limit || (src.matches(KEEP_WHOLE) && h <= mbody.clientHeight * 0.92);
  }
  function splitContainer(src, chain) {
    if (avoidSplit(src, chain)) { breakPage(chain); place(src, chain); return true; }
    var lv = { src: src, shell: src.cloneNode(false) };
    lv.shell.setAttribute('data-shell', '');
    hostOf(chain).appendChild(lv.shell);

    if (g !== lastG) { html += '<div class="grp">' + esc(g) + '</div>'; lastG = g; }
    var ki = kickerInfo(c.kicker);
    var dot = ki.color && DOTS[ki.color] ? ' style="background:' + DOTS[ki.color] + '"' : '';
    html += '<div class="ch" data-ci="' + ci + '"><div class="ch-row flex items-stretch rounded-[10px]">' +
      '<button type="button" class="ch-btn" data-go="' + c.page + '"><span class="dot"' + dot + '></span><span class="ct">' + esc(c.title) + (ki.small ? '<small>' + esc(ki.small) + '</small>' : '') + '</span><span class="pn">' + folioOfPage(c.page) + '</span></button>' +
      (c.secs.length ? '<button type="button" class="ch-tg" aria-label="Mostrar secciones" aria-expanded="false">' + ICON_CH + '</button>' : '') +
      '</div>';
    if (c.secs.length) {
      html += '<div class="secs">';
      c.secs.forEach(function (s, si) { html += '<button type="button" class="sec-btn" data-go="' + s.page + '" data-si="' + si + '"><span>' + esc(s.title) + '</span><span class="pn">' + folioOfPage(s.page) + '</span></button>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  tocEl.innerHTML = html;
}
tocEl.addEventListener('click', function (e) {
  var tg = e.target.closest('.ch-tg');
  if (tg) { var ch = tg.closest('.ch'); var o = ch.classList.toggle('open'); tg.setAttribute('aria-expanded', o); return; }
  var b = e.target.closest('[data-go]');
  if (b) {
    var idx = parseInt(b.getAttribute('data-go'), 10);
    var chEl = b.closest('.ch');
    if (b.classList.contains('ch-btn') && chEl) { chEl.classList.add('open'); var t2 = $('.ch-tg', chEl); if (t2) t2.setAttribute('aria-expanded', 'true'); }
    goPage(idx);
    if (!isWide()) setSidebar(false);
  }
});
function markCurrent(vis) {
  if (!S.chapters.length) return;
  var cp = null, idx = -1;
  for (var i = vis.length - 1; i >= 0; i--) if (vis[i] && vis[i].kind === 'content') { cp = vis[i]; idx = S.pages.indexOf(vis[i]); break; }
  var ci = cp ? cp.chapter : -1;
  $$('.ch', tocEl).forEach(function (el) {
    var on = parseInt(el.getAttribute('data-ci'), 10) === ci;
    if (on !== el.classList.contains('cur')) {
      el.classList.toggle('cur', on);
      if (on) { el.classList.add('open'); var t = $('.ch-tg', el); if (t) t.setAttribute('aria-expanded', 'true'); }
    }
  });
  $$('.sec-btn.cur', tocEl).forEach(function (b) { b.classList.remove('cur'); });
  if (ci >= 0) {
    var c = S.chapters[ci], best = -1;
    c.secs.forEach(function (s, si) { if (s.page >= 0 && s.page <= idx) best = si; });
    if (best >= 0) { var b = $('.ch[data-ci="' + ci + '"] .sec-btn[data-si="' + best + '"]', tocEl); if (b) b.classList.add('cur'); }
    if (sbOpen && !currentQuery) {
      var row = $('.ch[data-ci="' + ci + '"]', tocEl);
      if (row && row.scrollIntoView) { try { row.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }
  }
}

/* ---------------------------------------------------------------
   Buscador
---------------------------------------------------------------- */
var currentQuery = '';
var qIn = $('#q'), resEl = $('#results'), metaEl = $('#sb-meta'), searchBox = $('#sb-search');
var qTimer = 0;
function clearMarks() {
  $$('mark.sh').forEach(function (m) {
    var p = m.parentNode;
    if (!p) return;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  });
}
function termsOf(q) { return fold(q).split(/\s+/).filter(function (t) { return t.length >= 2; }); }
function highlightPage(idx, terms) {
  var p = S.pages[idx];
  if (!p || p.kind !== 'content') return;
  var leafIdx = S.mode === 'single' ? idx : (idx >> 1);
  var lf = S.leaves[leafIdx];
  if (!lf) return;
  var body = $('.pg-body', lf.el.children[S.mode === 'single' || idx % 2 === 0 ? 0 : 1]);
  if (!body) return;
  var tw = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
  var nodes = [], n;
  while ((n = tw.nextNode())) nodes.push(n);
  nodes.forEach(function (node) {
    var text = node.nodeValue, f = fold(text), ranges = [];
    terms.forEach(function (t) {
      var from = 0, i;
      while ((i = f.indexOf(t, from)) >= 0) { ranges.push([i, i + t.length]); from = i + t.length; }
    });
    if (!ranges.length) return;
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    ranges.forEach(function (r) {
      var l = merged[merged.length - 1];
      if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice());
    });
    var frag = document.createDocumentFragment(), pos = 0;
    merged.forEach(function (r) {
      if (r[0] > pos) frag.appendChild(document.createTextNode(text.slice(pos, r[0])));
      var m = document.createElement('mark'); m.className = 'sh'; m.textContent = text.slice(r[0], r[1]);
      frag.appendChild(m); pos = r[1];
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}
function snippet(idx, terms) {
  var raw = S.texts[idx], f = S.folded[idx];
  var at = -1;
  terms.forEach(function (t) { var i = f.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; });
  if (at < 0) at = 0;
  var a = Math.max(0, at - 44), b = Math.min(raw.length, at + 110);
  var slice = raw.slice(a, b), fs = f.slice(a, b), ranges = [];
  terms.forEach(function (t) {
    var from = 0, i;
    while ((i = fs.indexOf(t, from)) >= 0) { ranges.push([i, i + t.length]); from = i + t.length; }
  });
  ranges.sort(function (x, y) { return x[0] - y[0]; });
  var out = '', pos = 0;
  ranges.forEach(function (r) {
    if (r[0] < pos) return;
    out += esc(slice.slice(pos, r[0])) + '<mark>' + esc(slice.slice(r[0], r[1])) + '</mark>';
    pos = r[1];
  });
  out += esc(slice.slice(pos));
  return (a > 0 ? '… ' : '') + out + (b < raw.length ? ' …' : '');
}
function runSearch(q, keepOpen) {
  currentQuery = q.trim();
  searchBox.classList.toggle('has', !!currentQuery);
  clearMarks();
  var terms = termsOf(currentQuery);
  if (!terms.length) {
    resEl.hidden = true; tocEl.hidden = false;
    metaEl.textContent = currentQuery ? 'Escribe al menos 2 letras.' : '';
    return;
  }
  var hits = [];
  for (var i = 0; i < S.folded.length; i++) {
    var f = S.folded[i];
    if (!f) continue;
    var ok = terms.every(function (t) { return f.indexOf(t) >= 0; });
    if (ok) hits.push(i);
  }
  tocEl.hidden = true; resEl.hidden = false;
  var total = hits.length;
  metaEl.textContent = total ? (total + (total === 1 ? ' página con resultados' : ' páginas con resultados') + (total > 60 ? ' (se muestran 60)' : '')) : '';
  if (!total) { resEl.innerHTML = '<div class="nores">Sin resultados para «' + esc(currentQuery) + '».<br>Prueba con otra palabra o con menos letras.</div>'; return; }
  var html = '';
  hits.slice(0, 60).forEach(function (idx) {
    var ch = S.pages[idx].chapter;
    html += '<button type="button" class="res" data-p="' + idx + '"><div class="rh flex justify-between gap-2"><span>' + esc(chapterTitle(ch)) + '</span><span>Pág. ' + S.pages[idx].folio + '</span></div><div>' + snippet(idx, terms) + '</div></button>';
  });
  resEl.innerHTML = html;
  hits.slice(0, 60).forEach(function (idx) { highlightPage(idx, terms); });
}
qIn.addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(function () { runSearch(qIn.value); }, 120); });
qIn.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { var f = $('.res', resEl); if (f) f.click(); }
  if (e.key === 'Escape' && qIn.value) { e.stopPropagation(); clearSearch(); }
});
function clearSearch() { qIn.value = ''; runSearch(''); qIn.focus(); }
$('#q-clr').addEventListener('click', clearSearch);
resEl.addEventListener('click', function (e) {
  var b = e.target.closest('.res');
  if (!b) return;
  goPage(parseInt(b.getAttribute('data-p'), 10));
  if (!isWide()) setSidebar(false);
});

/* ---------------------------------------------------------------
   Barra de control, sidebar, teclado, gestos
---------------------------------------------------------------- */
var sidebar = $('#sidebar'), scrim = $('#scrim'), btnToc = $('#b-toc');
function setSidebar(on) {
  sbOpen = on;
  sidebar.classList.toggle('open', on);
  sidebar.setAttribute('aria-hidden', on ? 'false' : 'true');
  if ('inert' in sidebar) sidebar.inert = !on;
  scrim.classList.toggle('on', on && !isWide());
  btnToc.setAttribute('aria-expanded', on);
  fit();
  if (on) {
    if (isWide()) setTimeout(function () { qIn.focus({ preventScroll: true }); }, 120);
    if (S.pages.length) markCurrent(visiblePages());
  } else if (sidebar.contains(document.activeElement)) { btnToc.focus(); }
}
if ('inert' in sidebar) sidebar.inert = true;
btnToc.addEventListener('click', function () { setSidebar(!sbOpen); });
$('#sb-close').addEventListener('click', function () { setSidebar(false); });
scrim.addEventListener('click', function () { setSidebar(false); });

$('#b-prev').addEventListener('click', function () { prev(true); });
$('#b-next').addEventListener('click', function () { next(true); });
zl.addEventListener('click', function () { prev(true); });
zr.addEventListener('click', function () { next(true); });

/* ir a página */
var indBtn = $('#b-ind');
indBtn.addEventListener('click', function () {
  if ($('.gotoin', indBtn)) return;
  var old = indBtn.innerHTML;
  indBtn.innerHTML = '';
  var inp = document.createElement('input');
  inp.type = 'number'; inp.min = 1; inp.max = S.folios; inp.className = 'gotoin'; inp.placeholder = '1–' + S.folios;
  inp.setAttribute('aria-label', 'Número de página');
  indBtn.appendChild(inp);
  inp.focus();
  var done = false;
  function end(go) {
    if (done) return; done = true;
    var v = parseInt(inp.value, 10);
    indBtn.innerHTML = old;
    if (go && v) goFolio(v);
  }
  inp.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); end(true); indBtn.focus(); }
    if (e.key === 'Escape') { end(false); indBtn.focus(); }
  });
  inp.addEventListener('blur', function () { end(false); });
  inp.addEventListener('click', function (e) { e.stopPropagation(); });
});

/* zoom de texto */
function updZoomUi() {
  $('#zlab').textContent = Math.round(S.zoom * 100) + '%';
  $('#b-zm').disabled = S.zoom <= ZOOMS[0];
  $('#b-zp').disabled = S.zoom >= ZOOMS[ZOOMS.length - 1];
}
function stepZoom(d) {
  var i = ZOOMS.indexOf(S.zoom);
  if (i < 0) i = 2;
  var j = Math.max(0, Math.min(ZOOMS.length - 1, i + d));
  if (j === i) return;
  S.zoom = ZOOMS[j];
  store.set('zoom', S.zoom);
  updZoomUi();
  rebuild({ skipFonts: true });
}
$('#b-zm').addEventListener('click', function () { stepZoom(-1); });
$('#b-zp').addEventListener('click', function () { stepZoom(1); });

/* temas */
function setTheme(t) {
  S.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  store.set('theme', t);
  $$('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-th') === t); });
  var bt = $('#b-th'); if (bt) { bt.title = 'Modo de lectura: ' + THEME_NAMES[t] + ' (tocar para cambiar)'; bt.setAttribute('aria-label', 'Modo de lectura: ' + THEME_NAMES[t] + '. Tocar para cambiar'); }
  var mc = $('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', t === 'dark' ? '#0d1117' : t === 'sepia' ? '#c9b48e' : '#14213c');
}
$$('.seg button').forEach(function (b) { b.addEventListener('click', function () { setTheme(b.getAttribute('data-th')); }); });
var THEME_NAMES = { light: 'Claro', sepia: 'Sepia', dark: 'Oscuro' };
$('#b-th').addEventListener('click', function () { var o = ['light', 'sepia', 'dark']; setTheme(o[(o.indexOf(S.theme) + 1) % 3]); });

/* teclado */
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': next(true); e.preventDefault(); break;
    case 'ArrowLeft': case 'PageUp': prev(true); e.preventDefault(); break;
    case ' ': if (tag !== 'button') { (e.shiftKey ? prev : next)(true); e.preventDefault(); } break;
    case 'Home': goSpread(0); e.preventDefault(); break;
    case 'End': goSpread(S.N); e.preventDefault(); break;
    case 'Escape': if (sbOpen) setSidebar(false); break;
    case '+': case '=': stepZoom(1); break;
    case '-': case '_': stepZoom(-1); break;
    case '/': setSidebar(true); setTimeout(function () { qIn.focus(); }, 60); e.preventDefault(); break;
  }
});

/* gestos táctiles */
(function () {
  var vp = $('#viewport'), sx = 0, sy = 0, st = 0, active = false;
  vp.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    active = true; sx = e.clientX; sy = e.clientY; st = Date.now();
  });
  vp.addEventListener('pointerup', function (e) {
    if (!active) return; active = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 700) { if (dx < 0) next(true); else prev(true); }
  });
  vp.addEventListener('pointercancel', function () { active = false; });
})();

/* tamaño de ventana */
var rz = 0;
window.addEventListener('resize', function () {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(function () {
    if (S.pages.length && desiredMode() !== S.mode) rebuild({ skipFonts: true });
    else fit();
  });
});
if (reduceMq.addEventListener) reduceMq.addEventListener('change', function () { document.documentElement.style.setProperty('--dur', DUR() + 'ms'); });

/* fuentes que llegan tarde → repaginar una vez */
var lateFonts = 0;
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', function () {
    if (!S.pages.length || building) return;
    if (lateFonts++ < 2) rebuild({ skipFonts: true });
  });
}

/* ---------------------------------------------------------------
   Inicio
---------------------------------------------------------------- */
(function init() {
  var z = parseFloat(store.get('zoom', '1'));
  S.zoom = ZOOMS.indexOf(z) >= 0 ? z : 1;
  var th = store.get('theme', document.documentElement.getAttribute('data-theme') || 'light');
  setTheme(th === 'sepia' || th === 'dark' ? th : 'light');
  updZoomUi();
  rebuild({ anchor: store.get('anchor', '') }).then(function () {
    window.JUMA = {
      state: function () { return { s: S.s, N: S.N, mode: S.mode, pages: S.pages.length, folios: S.folios, zoom: S.zoom, scale: S.scale }; },
      goPage: goPage, goSpread: goSpread, next: next, prev: prev, goFolio: goFolio, chapters: function () { return S.chapters; },
      pages: function () { return S.pages; }, search: function (q) { qIn.value = q; runSearch(q); }, setSidebar: setSidebar, stepZoom: stepZoom, setTheme: setTheme
    };
    document.documentElement.setAttribute('data-ready', '1');
  });
})();

})();

</script>
</body>
