<style>/* ============ JUMA · Manual de identidad — libro 3D ============ */
:root{
  --f-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --desk:#e4ded1; --desk-2:#cfc7b5;
  --paper:#fbf8f1; --paper-2:#f3eee2;
  --ink:#231d17; --ink-2:#463c32; --muted:#7b6f61;
  --accent:#a63a2b; --accent-2:#1f3f7a;
  --rule:rgba(35,29,23,.16); --rule-2:rgba(35,29,23,.09);
  --tint:rgba(166,58,43,.07); --tint-2:rgba(110,86,48,.075); --tint-b:rgba(31,63,122,.07);
  --gut:rgba(70,45,20,.26);
  --tex-o:.5;
  --ui-bg:rgba(252,249,242,.94); --ui-ink:#231d17; --ui-muted:#6f6455; --ui-line:rgba(35,29,23,.14);
  --ui-hover:rgba(35,29,23,.07); --ui-on:#231d17; --ui-on-ink:#fbf8f1;
  --mark:#ffe58a;
  --c-azul:#2f62b0; --c-amarillo:#e3b02b; --c-verde:#3f9150; --c-rojo:#c33a2c; --c-blanco:#f7f4ec;
  --z:1; --pw:560px; --ph:780px; --mx:54px;
  --dur:820ms;
  --ease-flip:cubic-bezier(0.77,0,0.175,1);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
html[data-theme="sepia"]{
  --desk:#c9b48e; --desk-2:#b79f74;
  --paper:#f2e5c9; --paper-2:#ead9b6;
  --ink:#3a2a18; --ink-2:#55402a; --muted:#85694a;
  --accent:#9a3524; --accent-2:#2a4670;
  --rule:rgba(58,42,24,.22); --rule-2:rgba(58,42,24,.12);
  --tint:rgba(154,53,36,.09); --tint-2:rgba(90,60,20,.09); --tint-b:rgba(42,70,112,.09);
  --gut:rgba(80,50,15,.32); --tex-o:.6;
  --ui-bg:rgba(244,232,205,.95); --ui-ink:#3a2a18; --ui-muted:#7b6040; --ui-line:rgba(58,42,24,.2);
  --ui-hover:rgba(58,42,24,.09); --ui-on:#3a2a18; --ui-on-ink:#f2e5c9; --mark:#f3c969;
}
html[data-theme="dark"]{
  --desk:#0a0d12; --desk-2:#06080c;
  --paper:#1f242d; --paper-2:#262b35;
  --ink:#e8e3d8; --ink-2:#c9c3b6; --muted:#8e897e;
  --accent:#e58370; --accent-2:#86a9ea;
  --rule:rgba(232,227,216,.2); --rule-2:rgba(232,227,216,.1);
  --tint:rgba(229,131,112,.1); --tint-2:rgba(134,169,234,.09); --tint-b:rgba(134,169,234,.1);
  --gut:rgba(0,0,0,.5); --tex-o:.18;
  --ui-bg:rgba(24,28,36,.94); --ui-ink:#e8e3d8; --ui-muted:#9a9488; --ui-line:rgba(232,227,216,.16);
  --ui-hover:rgba(232,227,216,.09); --ui-on:#e8e3d8; --ui-on-ink:#171a21; --mark:#7a6314;
  --c-blanco:#e9e5da;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.28),rgba(0,0,0,0) 60%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.22),rgba(0,0,0,0) 55%);z-index:0}
html[data-theme="dark"] body::before{background:radial-gradient(ellipse at 50% 40%,rgba(80,100,140,.14),rgba(0,0,0,0) 62%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.skip{position:fixed;left:8px;top:-60px;background:var(--ui-on);color:var(--ui-on-ink);padding:8px 14px;border-radius:8px;z-index:99999;font:600 14px var(--f-ui)}
.skip:focus{top:8px}

/* ---------- escritorio / escenario ---------- */
#app{position:fixed;inset:0;z-index:1}
#viewport{position:absolute;left:var(--sbw,0px);right:0;top:0;bottom:0;overflow:hidden;transition:left 340ms var(--ease-out)}
#scaler{position:absolute;left:50%;top:50%;transform-origin:center center;transition:transform 340ms var(--ease-out)}
#shift{position:absolute;left:0;top:0;width:100%;height:100%;transition:transform var(--dur) var(--ease-flip)}
#book{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%}
.book-shadow{position:absolute;left:2%;right:2%;bottom:-24px;height:44px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);filter:blur(6px);pointer-events:none}
html[data-theme="dark"] .book-shadow{background:radial-gradient(ellipse at center,rgba(0,0,0,.8),rgba(0,0,0,0) 70%)}
.stack{position:absolute;top:5px;bottom:5px;pointer-events:none;border-radius:2px;
  background:repeating-linear-gradient(to right,var(--paper-2) 0 1px,var(--rule) 1px 2px);transition:width var(--dur) var(--ease-flip)}
.stack.l{right:50%}
.stack.r{left:50%}
.single .stack.l{display:none}
.single .stack.r{left:0}

.leaf{-webkit-transform-style:preserve-3d;will-change:transform;position:absolute;top:0;width:var(--pw);height:var(--ph);left:var(--pw);transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);transition:transform var(--dur) var(--ease-flip);display:none}
.single .leaf{left:0}
.leaf.on{display:block}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.instant{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:9;background:linear-gradient(to right,rgba(20,10,0,0),rgba(20,10,0,.55))}
.face.back .fs{background:linear-gradient(to left,rgba(20,10,0,0),rgba(20,10,0,.55))}
.leaf.fl-next .face.front .fs{animation:shF var(--dur) var(--ease-flip) both}
.leaf.fl-next .face.back .fs{animation:shB var(--dur) var(--ease-flip) both}
.leaf.fl-prev .face.front .fs{animation:shB var(--dur) var(--ease-flip) both reverse}
.leaf.fl-prev .face.back .fs{animation:shF var(--dur) var(--ease-flip) both reverse}
@keyframes shF{0%{opacity:0}55%{opacity:.5}100%{opacity:.85}}
@keyframes shB{0%{opacity:.85}45%{opacity:.5}100%{opacity:0}}
.leaf.fl-next .face,.leaf.fl-prev .face{box-shadow:0 4px 26px rgba(0,0,0,.3)}

/* zonas de clic en bordes */
.zone{position:absolute;top:0;bottom:0;z-index:9999;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.zone{width:calc(var(--pw) * .18)}
.zone.l{left:0}
.zone.r{right:0}
.single .zone{width:calc(var(--pw) * .3)}
.zone.off{display:none}
.zone.wide,.single .zone.wide{width:var(--pw)}
.zone i{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:var(--ui-bg);color:var(--ui-ink);
  box-shadow:0 2px 10px rgba(0,0,0,.2);opacity:0;transform:scale(.92);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out);pointer-events:none}
.zone.l i{left:10px}.zone.r i{right:10px}
.zone i svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.zone:hover i{opacity:1;transform:scale(1)}}

/* ---------- página ---------- */
.pg{position:absolute;inset:0;width:var(--pw);height:var(--ph);background:var(--paper);color:var(--ink);overflow:hidden;--fz:calc(14.5px * var(--z))}
.pg::before{content:"";position:absolute;inset:0;background-image:var(--tex);opacity:var(--tex-o);pointer-events:none}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:15%;pointer-events:none;z-index:8}
.pg.left::after{right:0;background:linear-gradient(to left,var(--gut),rgba(0,0,0,0))}
.pg.right::after{left:0;background:linear-gradient(to right,var(--gut),rgba(0,0,0,0))}
.pg.left{box-shadow:inset 6px 0 14px -10px rgba(0,0,0,.25)}
.pg.right{box-shadow:inset -6px 0 14px -10px rgba(0,0,0,.25)}
.pg-head{position:absolute;top:26px;left:var(--mx);right:var(--mx);height:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  font:600 9.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:6px}
.pg-head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-foot{position:absolute;bottom:26px;left:var(--mx);right:var(--mx);display:flex;justify-content:center;align-items:center;gap:10px;font:500 11.5px/1 var(--f-display);color:var(--muted);font-variant-numeric:lining-nums}
.pg-foot::before,.pg-foot::after{content:"";width:22px;height:1px;background:var(--rule)}
.pg-body{position:absolute;top:60px;left:var(--mx);right:var(--mx);bottom:64px;overflow:hidden;font-family:var(--f-body);font-size:var(--fz);line-height:1.52;color:var(--ink);
  hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;display:flow-root;font-kerning:normal}
.pg-body>:last-child{margin-bottom:0!important}
.pg-body>:first-child{margin-top:0!important}
#measurer{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;width:var(--pw);height:var(--ph)}
.pg.blank .pg-head,.pg.blank .pg-foot{display:none}
.pg.blank .fin{position:absolute;left:0;right:0;top:46%;text-align:center;font:italic 400 15px var(--f-display);color:var(--muted);letter-spacing:.04em}
.pg.blank .fin::before{content:"✦";display:block;font-size:18px;margin-bottom:10px;font-style:normal;color:var(--accent);opacity:.7}
.pg.plain .pg-head,.pg.plain .pg-foot{display:none}

/* ---------- portada y contraportada ---------- */
.pg.cover{background:#14213c;color:#f4ecd9;overflow:hidden}
.pg.cover::before{opacity:1;mix-blend-mode:normal;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,rgba(0,0,0,0) 1px 3px),radial-gradient(ellipse at 30% 20%,rgba(80,120,200,.28),rgba(0,0,0,0) 62%),linear-gradient(160deg,#1b2f58 0%,#14213c 55%,#0d1730 100%)}
.pg.cover::after{left:0;right:auto;width:9%;z-index:8;background:linear-gradient(to right,rgba(0,0,0,.5),rgba(255,255,255,.07) 40%,rgba(0,0,0,0))}
.pg.cover.back::after{left:auto;right:0;background:linear-gradient(to left,rgba(0,0,0,.5),rgba(255,255,255,.07) 40%,rgba(0,0,0,0))}
.pg.cover .cv{position:absolute;inset:26px 26px 26px 34px;border:1px solid rgba(244,236,217,.38);outline:1px solid rgba(244,236,217,.16);outline-offset:5px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 28px 28px;z-index:2}
.pg.cover.back .cv{inset:26px 34px 26px 26px;justify-content:center;gap:18px}
.cv .portada-sup{font:600 11px/1.4 var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:#e6c98a;margin:0 0 22px}
.cv .cv-logo{background:#fbf8f1;border-radius:22px;padding:14px 22px 10px;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08);margin-bottom:26px}
.cv .cv-logo img{display:block;width:210px;height:auto}
.cv h1{margin:0;font:600 38px/1.08 var(--f-display);letter-spacing:-.01em;color:#fbf5e4;text-wrap:balance}
.cv h1 small{display:block;margin-top:12px;font:italic 400 21px/1.2 var(--f-display);letter-spacing:.005em;color:#e9dcc0}
.cv .cv-stripes{display:flex;width:150px;height:6px;margin:26px 0 20px;border-radius:3px;overflow:hidden}
.cv .cv-stripes i{flex:1}
.cv .cv-stripes i:nth-child(1){background:#3a76d0}.cv .cv-stripes i:nth-child(2){background:#f0bd32}.cv .cv-stripes i:nth-child(3){background:#46a35a}.cv .cv-stripes i:nth-child(4){background:#d4412f}.cv .cv-stripes i:nth-child(5){background:#f7f4ec}
.cv .portada-sub{font:500 13px/1.4 var(--f-ui);letter-spacing:.08em;color:#d9ceb4;margin:0}
.cv .portada-anio{margin:auto 0 0;font:500 15px var(--f-display);letter-spacing:.3em;color:#e6c98a}
.cv .cv-lema{font:italic 400 20px/1.35 var(--f-display);color:#f4ecd9;margin:0;text-wrap:balance}
.cv .cv-ref{font:600 11px var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:#e6c98a;margin:0}
.cv .cv-mini{font:500 12px/1.5 var(--f-ui);color:#cfc4aa;margin:0}
.cv .cv-orn{width:60px;height:1px;background:#e6c98a;opacity:.6}
.pg.guarda{background:var(--paper-2)}
.guarda .gd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 70px;text-align:center}
.guarda .gd img{width:150px;height:auto;opacity:.92}
html[data-theme="dark"] .guarda .gd img{background:#fbf8f1;border-radius:14px;padding:10px}
.guarda .gd .g-lema{font:italic 400 21px/1.35 var(--f-display);color:var(--ink);margin:0;text-wrap:balance}
.guarda .gd .g-ref{font:600 10px var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0}
.guarda .gd .g-orn{width:46px;height:1px;background:var(--accent);opacity:.5}
.guarda .gd .g-txt{font:400 12.5px/1.6 var(--f-body);color:var(--muted);margin:0;max-width:300px}

/* ---------- tipografía de contenido ---------- */
.pg-body h1{font:600 2.1em/1.08 var(--f-display);letter-spacing:-.015em;margin:0;color:var(--ink);text-wrap:balance;hyphens:manual}
.pg-body .opener{margin:0 0 1.15em;padding-bottom:.9em;border-bottom:1px solid var(--rule);position:relative}
.pg-body .opener::after{content:"";position:absolute;left:0;bottom:-1px;width:3.2em;height:2px;background:var(--accent)}
.pg-body .kicker{display:flex;align-items:center;gap:.55em;margin:0 0 .75em;font:600 .66em/1.3 var(--f-ui);letter-spacing:.17em;text-transform:uppercase;color:var(--accent);text-align:left}
.kicker .kd{width:.95em;height:.95em;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.kd.k-azul{background:var(--c-azul)}.kd.k-amarillo{background:var(--c-amarillo)}.kd.k-verde{background:var(--c-verde)}.kd.k-rojo{background:var(--c-rojo)}.kd.k-blanco{background:var(--c-blanco)}
.pg-body h2{font:600 1.32em/1.18 var(--f-display);letter-spacing:-.01em;margin:1.35em 0 .55em;color:var(--ink);text-wrap:balance;hyphens:manual;padding-left:.7em;position:relative}
.pg-body h2::before{content:"";position:absolute;left:0;top:.22em;bottom:.22em;width:.2em;border-radius:.1em;background:var(--accent)}
.pg-body h3{font:italic 600 1.1em/1.25 var(--f-display);margin:1.15em 0 .4em;color:var(--accent-2);text-wrap:balance;hyphens:manual}
.pg-body h3.nivel{font-style:normal;display:flex;align-items:center;gap:.6em;color:var(--ink);padding:.45em .7em;border-radius:.5em;background:var(--tint-2);border-left:.4em solid var(--c-azul);margin-top:1.2em}
.pg-body h3.nivel.n-amarillo{border-left-color:var(--c-amarillo)}.pg-body h3.nivel.n-verde{border-left-color:var(--c-verde)}.pg-body h3.nivel.n-rojo{border-left-color:var(--c-rojo)}.pg-body h3.nivel.n-blanco{border-left-color:var(--muted)}
.pg-body h4{font:700 .72em/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;margin:1em 0 .4em;color:var(--accent);hyphens:manual}
.pg-body p{margin:0 0 .72em;text-align:justify;text-wrap:pretty}
.pg-body p.dropcap::first-letter{font:600 3.5em/.8 var(--f-display);float:left;padding:.07em .1em 0 0;color:var(--accent)}
.pg-body strong,.pg-body b{font-weight:650}
.pg-body u{text-decoration-thickness:.06em;text-underline-offset:.16em;text-decoration-color:var(--accent)}
.pg-body mark{background:var(--mark);color:inherit;border-radius:.2em;padding:0}
.pg-body .lead-in{margin:1em 0 .35em;text-align:left}
.pg-body .itl{font-style:italic}
.pg-body .subt{font:italic 500 1.12em/1.3 var(--f-display);color:var(--accent-2);text-align:center;margin:0 0 .9em;text-wrap:balance}
.pg-body .sub-i{margin:1em 0 .35em;color:var(--ink-2);text-align:left}
.pg-body .cita-der{text-align:right;font-style:italic;color:var(--ink-2);margin:.2em 0 .9em;padding-left:2em}
.pg-body blockquote{margin:1em 0;padding:0}
.pg-body blockquote.cita-l{padding:.2em 0 .2em 1em;border-left:.2em solid var(--accent);font-style:italic;color:var(--ink-2)}
.pg-body blockquote.cita-l p{margin:0 0 .5em}
.pg-body blockquote.lema{position:relative;margin:1.5em 0 1.1em;padding:1.4em 1.2em 1em;text-align:center;font:italic 400 1.18em/1.4 var(--f-display);color:var(--ink);background:var(--tint);border-radius:.6em;text-wrap:balance}
.pg-body blockquote.lema::before{content:"“";position:absolute;left:50%;top:-.42em;transform:translateX(-50%);font:600 2.6em/1 var(--f-display);color:var(--accent);background:var(--paper);padding:.12em .22em 0;border-radius:50%;height:.7em;line-height:.8}
.pg-body blockquote cite{display:block;margin-top:.55em;font:600 .6em/1.3 var(--f-ui);font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.pg-body .conclusion{margin:1em 0;padding:.8em 1em;border-radius:.5em;background:var(--tint);border-left:.25em solid var(--accent);text-align:left}
.pg-body .oracion-txt{font-style:italic;padding:.1em 0 .1em 1em;border-left:.18em solid var(--accent-2);color:var(--ink-2)}
.pg-body .rec,.pg-body .nota-i{font-size:.92em;color:var(--ink-2);background:var(--tint-2);padding:.6em .85em;border-radius:.45em;margin:.5em 0 .9em;text-align:left}
.pg-body .nota-fig{font:italic 400 .84em/1.45 var(--f-body);color:var(--muted);border:1px dashed var(--rule);border-radius:.5em;padding:.55em .85em .55em 2.1em;margin:.7em 0 .9em;position:relative;text-align:left}
.pg-body .nota-fig::before{content:"▤";position:absolute;left:.7em;top:.5em;font-style:normal;color:var(--accent);opacity:.8}
.pg-body .cierre{text-align:center;font-family:var(--f-display);font-style:italic;font-size:1.1em;margin:1.2em 0}
.pg-body .sello-t{text-align:center;font:600 .8em/1.6 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 1.4em;padding:.9em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pg-body .firma{text-align:center;margin:1.6em 0 .6em;padding-top:.55em;border-top:1px solid var(--rule);width:62%;margin-left:auto;margin-right:auto}
.pg-body .firma strong{display:block;font:600 .7em/1.4 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pg-body .firmas{display:grid;grid-template-columns:1fr 1fr;gap:1.5em 2em;margin:1.2em 0 1.4em}
.pg-body .firmas span{display:block;height:2.6em;border-bottom:1px solid var(--ink-2)}

/* listas */
.pg-body ul,.pg-body ol{margin:0 0 .8em;padding:0 0 0 1.55em}
.pg-body li{margin:0 0 .38em;text-align:justify;text-wrap:pretty}
.pg-body li>p{margin-bottom:.35em}
.pg-body ul{list-style:none}
.pg-body ul>li{position:relative}
.pg-body ul>li::before{content:"";position:absolute;left:-1.1em;top:.62em;width:.38em;height:.38em;background:var(--accent);transform:rotate(45deg);border-radius:.06em}
.pg-body ul ul>li::before{background:none;border:1.5px solid var(--accent);width:.3em;height:.3em}
.pg-body ol{list-style-type:decimal}
.pg-body ol[type="a"]{list-style-type:lower-alpha}
.pg-body ol[type="A"]{list-style-type:upper-alpha}
.pg-body ol[type="i"]{list-style-type:lower-roman}
.pg-body ol>li::marker{font:600 .95em var(--f-display);color:var(--accent)}
.pg-body li.cont{list-style:none}
.pg-body li.cont::before{display:none!important}
.pg-body ul.ck{padding-left:1.8em}
.pg-body ul.ck>li::before{content:"✓";background:none;border:0;transform:none;width:auto;height:auto;left:-1.35em;top:0;font:700 .9em/1.6 var(--f-ui);color:var(--accent)}
.pg-body ul.flechas>li::before{content:"→";background:none;border:0;transform:none;width:auto;height:auto;left:-1.3em;top:-.02em;font:700 .95em/1.6 var(--f-ui);color:var(--accent-2)}
.pg-body ul.enlaces>li{font:500 .78em/1.45 var(--f-ui);color:var(--accent-2);overflow-wrap:anywhere;hyphens:none;text-align:left;margin-bottom:.45em}
.pg-body ul.enlaces>li::before{background:none;border:0;transform:none;content:"↗";left:-1.35em;top:0;width:auto;height:auto;font-weight:700;color:var(--accent)}
.pg-body ul.letanias{padding-left:0;text-align:center;margin:.6em 0}
.pg-body ul.letanias>li{text-align:center;margin:0 0 .22em;font-style:italic}
.pg-body ul.letanias>li::before{display:none}
.pg-body ul.colab{padding-left:0}
.pg-body ul.colab>li{padding:.35em .2em .35em 1.5em;border-bottom:1px solid var(--rule-2);margin:0;text-align:left}
.pg-body ul.colab>li::before{left:.2em;top:.95em}
.pg-body ul.actitudes>li{margin-bottom:.55em}
.pg-body ol.temas{list-style:none;padding-left:0}
.pg-body ol.temas>li{position:relative;padding:.28em .6em .28em 2.7em;margin:0 0 .26em;background:var(--tint-2);border-radius:.4em;text-align:left}
.pg-body ol.temas>li::before{content:counter(list-item);position:absolute;left:.55em;top:.34em;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font:700 .76em var(--f-ui);color:var(--ui-on-ink);background:var(--accent-2)}
.pg-body ol.pilares{list-style:none;padding-left:0}
.pg-body ol.pilares>li{position:relative;padding:.7em .9em .7em 3.1em;margin:0 0 .6em;border:1px solid var(--rule);border-radius:.55em;background:var(--tint);text-align:justify}
.pg-body ol.temas>li.cont::before,.pg-body ol.pilares>li.cont::before{display:none!important}
.pg-body ol.pilares>li::before{content:counter(list-item);position:absolute;left:.7em;top:.62em;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font:600 1em var(--f-display);color:#fff;background:var(--accent)}

/* tablas */
.pg-body table{width:100%;border-collapse:collapse;margin:.6em 0 1em;font-size:.88em;line-height:1.38}
.pg-body table th{font:700 .82em/1.25 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:.55em .6em;background:var(--accent-2);color:#fff;border:1px solid var(--accent-2)}
html[data-theme="dark"] .pg-body table th{background:#2c4a82}
.pg-body table td{padding:.5em .6em;border:1px solid var(--rule);vertical-align:top;text-align:left}
.pg-body table.tabla tbody tr:nth-child(even) td{background:var(--tint-2)}
.pg-body table td p{margin:0 0 .3em;text-align:left}
.chip{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-right:.25em;border:1px solid rgba(0,0,0,.25)}
.chip.azul{background:var(--c-azul)}.chip.amarillo{background:var(--c-amarillo)}.chip.verde{background:var(--c-verde)}.chip.rojo{background:var(--c-rojo)}.chip.blanco{background:var(--c-blanco)}
.pg-body table.fichas{table-layout:fixed}
.pg-body table.fichas td{padding:.55em;background:var(--paper-2);text-align:center}
.pg-body table.fichas b{display:block;font:600 .95em var(--f-display);color:var(--accent);margin-top:.35em}
.pg-body table.fichas span{display:block;font-size:.85em;color:var(--muted)}
.globo{position:relative;padding:.45em .6em;margin:0 0 .5em;background:var(--tint-2);border-radius:.8em;font-style:italic;font-size:.92em;line-height:1.35;border:1px solid var(--rule-2);text-align:left}
.globo.b{background:var(--tint);margin-left:.8em}
.pg-body table.form td{height:2.6em}
.pg-body table.form th{text-align:center}
.pg-body table.mano td:first-child{width:2.4em;text-align:center;font:700 1.1em var(--f-display);color:var(--accent);background:var(--tint)}
.pg-body table.calendario td:first-child,.pg-body table.fechas td:first-child{white-space:nowrap;font-weight:650}

/* varios */
.pg-body .cita{text-align:center;font-style:italic;color:var(--ink-2);margin:.6em 1em .9em}
.pg-body .letania{margin:.5em 0 1em;padding-left:1em;border-left:.18em solid var(--accent-2)}
.pg-body .letania p{text-align:left;margin-bottom:.4em}
.pg-body table.tri td{height:3.4em}
.pg-body ol.inv>li{font-style:italic}

/* cajas */
.pg-body .box{margin:.8em 0 1em;padding:.7em .95em .5em;border:1px solid var(--rule);border-radius:.55em;background:var(--tint-2);position:relative}
.pg-body .box-t{font:700 .7em/1.2 var(--f-ui)!important;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);margin:0 0 .5em!important;text-align:left!important}
.pg-body .box p{text-align:left}
.pg-body .box.dinamica{border-left:.3em solid var(--accent-2)}
.pg-body .box.cuento{border-left:.3em solid var(--c-amarillo);background:var(--tint)}
.pg-body .box.compromiso{border-left:.3em solid var(--accent);background:var(--tint)}
.pg-body .box.compromiso .box-t,.pg-body .box.cuento .box-t{color:var(--accent)}
.pg-body .par2{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin:.7em 0}
.pg-body .par2 .box{margin:0}
.pg-body .momentos{margin:.4em 0 1em}
.pg-body .mom{display:flex;gap:.8em;align-items:flex-start;margin:0 0 .65em;padding:.6em .8em;border:1px solid var(--rule-2);border-radius:.55em;background:var(--tint-2)}
.pg-body .mom p{margin:0;text-align:left}
.ic{flex:none;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;font:600 1.05em/1 var(--f-ui);background:var(--accent);color:#fff}
.pg-body .mapas{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:.6em 0}
.pg-body .mapas span{display:block;aspect-ratio:1.2;border:1.5px dashed var(--rule);border-radius:.8em 2em .8em 2em;background:var(--tint-2)}

/* esquemas */
.pg-body .esq{margin:.5em 0 1em}
.pg-body .esq>div{position:relative;margin:0 0 .7em;padding:.65em .9em .45em 1.1em;border:1px solid var(--rule);border-radius:.5em;background:var(--tint-2)}
.pg-body .esq>div::before{content:"";position:absolute;left:0;top:.5em;bottom:.5em;width:.22em;border-radius:.11em;background:var(--accent-2)}
.pg-body .esq>div:nth-child(even)::before{background:var(--accent)}
.pg-body .esq p{text-align:left;margin-bottom:.45em}
.pg-body .esq.esq-guia>div{display:flex;align-items:center;gap:.7em;padding-top:.5em;padding-bottom:.5em}
.pg-body .esq.esq-guia>div ul{margin:0}
.pg-body .esquema{display:flex;align-items:center;justify-content:center;gap:.8em;margin:.7em 0}
.pg-body .esquema span{padding:.4em .9em;border:1.5px solid var(--accent-2);border-radius:2em;font:700 .74em var(--f-ui);letter-spacing:.14em;color:var(--accent-2);background:var(--tint-2)}
.pg-body .esquema i{font:700 1.3em var(--f-ui);font-style:normal;color:var(--accent)}
.pg-body .cuadrante{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.55em;margin:.8em 0 1em}
.pg-body .cuadrante .q{padding:.7em .8em .3em;min-height:5.2em;border-radius:.6em;border:1px solid var(--rule);font-size:.92em;background:var(--tint-2)}
.pg-body .cuadrante .q p{margin:0 0 .45em;text-align:left}
.pg-body .cuadrante .q1,.pg-body .cuadrante .q3{padding-right:4.2em}.pg-body .cuadrante .q2,.pg-body .cuadrante .q4{padding-left:4.2em}
.pg-body .cuadrante .q1{background:rgba(47,98,176,.1)}.pg-body .cuadrante .q2{background:rgba(227,176,43,.14)}.pg-body .cuadrante .q3{background:rgba(195,58,44,.1)}.pg-body .cuadrante .q4{background:rgba(63,145,80,.12)}
.pg-body .cuadrante .centro{position:absolute;left:50%;top:50%;width:13.6em;height:13.6em;transform:translate(-50%,-50%);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border-radius:50%;overflow:hidden;border:.45em solid var(--paper);box-shadow:0 0 0 1px var(--rule),0 3px 10px rgba(0,0,0,.18);font:700 .56em/1 var(--f-ui);letter-spacing:.04em}
.pg-body .centro span{display:grid;color:#fff;padding:0 .9em}
.pg-body .centro .c1{place-items:end end}.pg-body .centro .c2{place-items:end start}.pg-body .centro .c3{place-items:start end}.pg-body .centro .c4{place-items:start start}
.pg-body .centro .c1,.pg-body .centro .c2{padding-bottom:1.6em}.pg-body .centro .c3,.pg-body .centro .c4{padding-top:1.6em}
.pg-body .centro .c1{background:var(--c-azul)}.pg-body .centro .c2{background:#d19a14}.pg-body .centro .c3{background:var(--c-rojo)}.pg-body .centro .c4{background:var(--c-verde)}
.pg-body .foda{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:.6em 0 1em}
.pg-body .foda .fq{padding:.6em .8em;border:1px solid var(--rule);border-radius:.5em;background:var(--tint-2);font-size:.9em}
.pg-body .foda .fq p{margin:0 0 .25em;text-align:left}
.pg-body .ln{height:1.7em;border-bottom:1px solid var(--ink-2);margin:0 0 .35em!important;opacity:.55}
.pg-body .cruz4{display:grid;grid-template-columns:1fr 1fr;gap:.35em;margin:.3em 0}
.pg-body .cruz4 span{padding:.55em .3em;text-align:center;font:italic 600 .85em var(--f-display);border-radius:.4em;background:var(--tint);color:var(--accent)}
.pg-body .anexo{margin:.4em 0}
.pg-body .anx{margin:0 0 .8em;padding:.7em .9em .45em;border:1px solid var(--rule);border-radius:.55em;background:var(--tint-2)}
.pg-body .anx-t{font:600 1em/1.25 var(--f-display)!important;color:var(--accent-2);margin:0 0 .5em!important;text-align:left!important}
.pg-body .anx ol{margin-bottom:.3em}
.pg-body .trio{display:flex;gap:.5em;justify-content:center;margin:.8em 0}
.pg-body .trio span{padding:.45em 1.1em;border-radius:2em;background:var(--accent);color:#fff;font:600 .82em var(--f-ui);letter-spacing:.08em}

<h1 data-kicker="Portada">Manual de identidad<br>Juventud Misionera Allamaniana</h1>
<p class="portada-sub">Misioneros de la Consolata · Venezuela</p>
<p class="portada-anio">2025</p>

<h1 data-kicker="Preliminares">Presentación</h1>
<p>Queridos animadores y jóvenes de la Juventud Misionera Allamaniana (JUMA),</p>
<p>Les presento este manual, fruto de la colaboración de sacerdotes, laicos y coordinadores del movimiento. A lo largo de más de 10 años, estas experiencias formativas han sido pulidas y enriquecidas por la participación de quienes forman parte de nuestra comunidad. El manual se apoya en la Palabra de Dios y en el carisma heredado de nuestro fundador, San José Allamano.</p>
<ul>
<li><strong>Propósito central</strong>: ofrecer una guía clara y estructurada para el camino formativo de la Juventud Misionera Allamaniana, así como para todos aquellos que desean acompañar a los jóvenes consolatinos.</li>
<li><strong>Enfoque formativo</strong>: fomentar un crecimiento integral (espiritual, personal y comunitario) dentro del marco de la fe, la misión y la pertenencia a la Iglesia.</li>
<li><strong>Aplicabilidad</strong>: herramientas, dinámicas, contenidos y pautas que pueden adaptarse a distintos contextos parroquiales y grupos juveniles.</li>
</ul>
<p>Mis agradecimientos a cada uno de ustedes: los jóvenes y los animadores que son parte de nuestra familia Consolata. Gracias por su compromiso, testimonio y colaboración en la vida de la misión. Cada aporte, por pequeño que parezca, ha contribuido a fortalecer la experiencia formativa y la presencia del carisma Consolata entre nosotros.</p>
<p>Espero que este manual sea una herramienta útil para acompañar, guiar y enriquecer el camino de formación de todos los jóvenes que forman parte de nuestra familia.</p>
<p>Que el Señor nos bendiga, y que la intercesión de Nuestra Madre Virgen Consolata, así como el ejemplo y la guía de nuestro fundador José Allamano, nos acompañen en cada paso de este camino formativo.</p>
<p class="firma">Padre Nebyu Elias Gabriel<br>Caracas 2025</p>

<h1 data-kicker="Manual de identidad">Identidad del movimiento</h1>

<h2>Lema</h2>
<blockquote class="lema">«Deben ser misioneros en la cabeza, en la boca y en el corazón.» <cite>San José Allamano</cite></blockquote>

<h2>¿Quiénes somos?</h2>
<p>Somos un movimiento juvenil, que pertenecemos al Instituto de los Misioneros (as) de la Consolata, con tinte vocacional, guiados por el Carisma del San José Allamano, como jóvenes, nos preparamos para la evangelización y la misión ad gentes, enfocándonos en el trabajo con jóvenes y comunidades. Llevamos a cabo nuestras actividades misioneras en los diferentes proyectos y espacios que nos ofrece el instituto y la iglesia local.</p>

<h2>Misión</h2>
<p>Fortalecer y expandir el Movimiento Juvenil en las diferentes misiones donde se encuentre la presencia de los misioneros de la Consolata en Venezuela y fomentar el espíritu misionero en los jóvenes a través de su proyecto de vida.</p>

<h2>Visión</h2>
<p>Proyectarnos como un movimiento juvenil para la formación, evangelización y misión entre los jóvenes y diferentes comunidades. De manera que, se puedan fomentar nuevas vocaciones misioneras.</p>

<h2>Objetivo general</h2>
<p>Promover en los jóvenes espacios de formación, evangelización y misión a través del carisma de los misioneros de la Consolata.</p>

<h2>Objetivos específicos</h2>
<ul class="ck">
<li>Formar jóvenes para la evangelización y misión</li>
<li>Desarrollar la formación humana y espiritual para el crecimiento personal de los miembros del movimiento.</li>
<li>Promover espacios de evangelización enfocados en las diferentes opciones misioneras del carisma.</li>
<li>Participar y apoyar las diferentes actividades juveniles de la Iglesia local.</li>
<li>Acompañar a los jóvenes del movimiento en las distintas áreas de trabajo Espiritualidad, Liturgia, Recreación, Visita a hogares, Coro Juvenil, Redes Sociales, Logistica, metodología y servicio social.</li>
<li>Realizar retiros, campamentos y misiones.</li>
</ul>

<h2>El misionero de JUMA</h2>
<p class="lead-in"><strong>Un misionero de JUMA es:</strong></p>
<ol>
<li>Principalmente una persona católica que vive los sacramentos.</li>
<li>Una persona a quien Dios le ha hecho un llamado específico para ser misionero, en un contexto juvenil es por ello que su corazón debe arder por la misión, debe de amarla y estar en constante misión.</li>
<li>Se identifica un integrante de JUMA porque tiene un profundo amor a María santísima bajo la advocación de la Consolata, y a nuestro fundador San José Allamano.</li>
</ol>
<p><strong>Este misionero cumplirá</strong> con algunas normas para el bien suyo y del movimiento. El misionero JUMA debe vivir plenamente la fraternidad, esta no se restringe a los momentos de reunión, oración y apostolados sino en todo momento.</p>
<p><strong>El apostolado</strong> se desarrollará según lo acordado en conjunto con plena autorización del asesor del movimiento, estos se llevarán a cabo en: casas, hospitales, capillas, comunidades, colegios, etc. Según sean las necesidades pastorales. [Podrá llevar la tutela en grupos misioneros como Infancia y Adolescencia misionera, siempre y cuando no interfiera con las actividades del movimiento] El apostolado frecuente es parte de nuestra identidad.</p>
<p><strong>Datos fundamentales que debe saber el misionero JUMA:</strong> las fechas y contextos históricos del fundador del IMC, así como de la advocación de la Consolata, conocimiento del superior en la región de Venezuela.</p>
<p><strong>Bibliografía de cabecera</strong>: indispensable la Biblia, Catecismo de la Iglesia Católica, Así los quiero del San José Allamano y otros libros de formación misionera, misión hoy, misión de la Consolata, diversas revistas... Es importante que el movimiento esté en sintonía con la programación misionera (congresos, retiros, encuentros misioneros). Ej. OMP</p>
<p><strong>En los encuentros ordinarios (reuniones)</strong>: se establece Oración Inicial, formación tanto espiritual como doctrinal, se podrá realizar una lectura del libro Así los quiero o Lectio Divina con meditación y compartir, logística de lo previsto, evaluación de lo realizado, puntos varios, Oración final.</p>
<p>Debido a que la misión conlleva una gran responsabilidad es necesario que el misionero goce de preparación: esta preparación será tanto doctrinal-magisterial, apologética, espiritual y cultural.</p>
<p>Esto se dispone más que a una evangelización efectiva a cuidar la integridad del misionero, su fe, su alma, su identidad tanto como católico como misionero de JUMA.</p>
<p>La oración es indispensable para que el misionero vaya creciendo en la vida espiritual y en la misión. Ha de orar por las misiones en el mundo tanto en los encuentros como en su oración personal.</p>
<blockquote class="lema">«Si tu corazón no arde de amor cuando haces misión, no te emocionas, permaneces indiferente deberías cuestionarte si este Carisma es para ti».</blockquote>
<p><strong>Disposiciones para miembros directivos (Asesor):</strong> Este guiará de la mano al misionero nuevo; se deberá tener referencia de esta persona para ayudarlo (situación familiar, escolar, psicológica, hasta sentimental) no con el propósito de curiosear sino de ayudar; debe enamorarlo de la misión; se le hará sentir importante como un miembro.</p>

<h2>Reglamentos</h2>
<h3>Reglamento general</h3>
<p>Esta normativa va dirigida a todos los miembros del movimiento.</p>
<ul>
<li>Estar presente en la reunión a la hora pautada para comenzar temprano con el encuentro.</li>
<li>Mantener silencio cuando un integrante hace uso de la palabra.</li>
<li>El integrante que traiga consigo celular, deberá ponerlo en silencio o vibrador, guardarlo y no hacer uso del mismo durante el encuentro para así no perjudicar la atención de los miembros. En caso de una emergencia notificar al encargado.</li>
<li>Mantener orden y disciplina en la reunión.</li>
<li>La persona que llegue retrasada por algún motivo deberá ingresar con cuidado a la reunión para no distraer a los demás (No saludar a todos hasta tener un tiempo propicio para hacerlo).</li>
<li>No se aceptará agresión física, ni verbal, ni psicológica, por parte de algún miembro.</li>
<li>Tener un lenguaje adecuado, por ende, no se aceptará expresiones fuertes o expresiones vulgares.</li>
<li>Mantener un ambiente de armonía, alegría, unión y respeto y mucha disposición en las etapas de la reunión.</li>
<li>En caso que algún miembro haya ingerido bebidas alcohólicas, antes de cualquier actividad, se le recomienda no asistir para no crear comentarios que dañen la reputación de la persona y del movimiento. De ser así acarrea una sanción.</li>
<li>Todos deben estar presente antes de la hora, para acondicionar la reunión y organizar los detalles del desarrollo de la misma: Temas, dinámicas, músicas de alabanza, avisos, etc.</li>
<li>Evitar el uso de apodos.</li>
<li>Evitar la jerarquización entre los miembros del movimientos.</li>
<li>No aprovechar el movimiento para relaciones amorosas.</li>
<li>No usar como escudo el movimiento.</li>
</ul>
<h3>Reglamento para los Amigos de JUMA</h3>
<ul>
<li>Respetar las decisiones de la coordinación.</li>
<li>Apoyar en la medida posible al movimiento en sus necesidades.</li>
<li>Mantener orden y disciplina en los encuentros.</li>
<li>Mantener un ambiente de armonía, alegría, unión y respeto y mucha disposición en los diferentes encuentros.</li>
<li>Tener un lenguaje adecuado, por ende, no se aceptará expresiones fuertes o expresiones vulgares.</li>
</ul>

<h2>Funciones y responsabilidades de los miembros del movimiento</h2>

<h3>Asesor General</h3>
<p>Es el consejero y mentor espiritual del movimiento. Por lo general, es un sacerdote o laico con formación, que guía a los líderes y asegura que el grupo se mantenga fiel a la doctrina y a la misión de la Iglesia. Su rol es el de acompañamiento y discernimiento, sin intervenir en la gestión operativa. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Formar a los participantes del movimiento en su camino cristiano con el carisma del Instituto Misioneros de la Consolata.</li>
<li>Velar porque cada uno de los participantes del movimiento cumplan sus roles.</li>
<li>Mantener comunicación con los diferentes asesores de las distintas misiones en donde esté el movimiento.</li>
<li>Programar las reuniones con los distintos asesores y coordinadores del movimiento para definir los eventos a desarrollar en las respectivas zonas y a nivel nacional.</li>
<li>Mantener comunicación con el superior de los Misioneros de la Consolata en la delegación de Venezuela.</li>
<li>Tomar todas las decisiones a ejecutar junto con el superior de la delegación, los coordinadores y miembros del movimiento.</li>
<li>Sustituir a algún coordinador del movimiento con previo aviso en caso de que el mismo no se pueda estar presente en las distintas actividades del movimiento o no cuente con la disposición para seguir llevando su rol.</li>
</ul>

<h3>Coordinador General</h3>
<p>Es la máxima autoridad y líder operativo del movimiento. Su rol es velar por el correcto funcionamiento de todas las áreas, tomar las decisiones más importantes y representar al grupo. Es el principal responsable de la visión, el espíritu y la cohesión de la comunidad. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Junto con la directiva del movimiento motivar constantemente a los jóvenes a conocer y servir de una forma comprometida la vida cristiana según el carisma misionero de San José Allamano.</li>
<li>Dirigir las reuniones ordinarias y extraordinarias para la planificación de los distintos eventos a desarrollar.</li>
<li>Velar junto con la directiva del movimiento por el bienestar de los miembros en cada uno de los eventos a desarrollar.</li>
<li>Mantener constante comunicación con el asesor y la junta directiva</li>
<li>Mantener un ambiente de respeto, cooperación y confianza dentro de los miembros del movimiento.</li>
<li>Velar porque las actividades del movimiento sean siempre de bienestar y no interfieran en los programas de actividades de sus respectivas parroquias. Excepto las actividades nacionales.</li>
<li>Delegar funciones y responsabilidades a los miembros del movimiento.</li>
<li>En caso de la ausencia del coordinador asume su rol el Sub-Coordinador.</li>
<li>Junto con la directiva, presentar un informe del trabajo misionero realizado a los diferentes grupos del movimiento.</li>
<li>Todas las decisiones que tome deberán ser consultadas y aprobadas con el asesor inmediato.</li>
<li>Sustituir al asesor del movimiento en caso de que el mismo no se pueda estar presente en cualquier reunión.</li>
<li>Sustituir a algún coordinador del movimiento con previo aviso en caso de que el mismo no se pueda estar presente en las distintas actividades del movimiento o no cuente con la disposición para seguir llevando su rol.</li>
<li>Asistir a las reuniones convocadas por la congregación de los Misioneros de la Consolata.</li>
</ul>

<h3>Sub-Coordinación</h3>
<p>Es el apoyo directo y mano derecha del Coordinador General. Su función es asistir en la gestión y planificación de las actividades, asumir las responsabilidades del Coordinador en su ausencia y liderar proyectos específicos. Trabaja en estrecha colaboración para asegurar la continuidad del trabajo. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>En caso de la ausencia del coordinador asume su rol el Sub-Coordinador.</li>
<li>Ayudar al Coordinador a motivar constantemente a los jóvenes a conocer y servir de una forma comprometida la vida cristiana según el carisma misionero de San José Allamano.</li>
<li>Velar junto con la directiva del movimiento por el bienestar de los miembros en cada uno de los eventos a desarrollar.</li>
<li>Mantener constante comunicación con el coordinador y la junta directiva.</li>
<li>Ayudar a mantener un ambiente de respeto, cooperación y confianza dentro de los miembros del movimiento.</li>
<li>Asistir a las reuniones convocadas por la congregación de los Misioneros de la Consolata.</li>
<li>Trabajar en conjunto con el coordinador velando por el cumplimiento de la normativa y la planificación estipulada.</li>
</ul>

<h3>Secretario</h3>
<p>Es la figura responsable de la gestión de la información y la comunicación interna. Se encarga de documentar las reuniones, llevar un registro de los miembros y mantener al día la correspondencia del movimiento. Su función es vital para la organización y el flujo de información dentro del grupo. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Estar presente en cada reunión que sea convocado. En caso de no asistir avisar con tiempo al coordinador y delegar su función a otro miembro de la directiva.</li>
<li>Tomar notas y elaborar el acta de todos los puntos tratados, definidos y tareas encomendadas a los integrantes de cada reunión.</li>
<li>Crear la agenda de las reuniones ordinarias y extraordinarias junto al coordinador y asesor.</li>
<li>Mantener la comunicación en conjunto con el asesor y el coordinador.</li>
<li>Recolectar la información de cada evento para ser archivado física y digitalmente como una memoria de eventos realizados por el movimiento cada año.</li>
<li>Llevar el registro de las asistencias.</li>
<li>Llevar a cabo el proceso de inscripciones y su respectivo archivado física y digitalmente.</li>
<li>Trabajar en conjunto con tesorería para llevar un registro veraz en el fondo del movimiento.</li>
</ul>

<h3>Tesorero</h3>
<p>Es el encargado de la administración de los recursos financieros. Su labor es gestionar el presupuesto, llevar un registro detallado de ingresos y gastos, y rendir cuentas de forma transparente. Su principal tarea es garantizar el uso responsable y eficiente del dinero del movimiento. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Llevar la administración del dinero recolectado por parte de los miembros del movimiento.</li>
<li>Tener un registro (Físico y Digital) donde mantenga junto al asesor del grupo la explicación de los ingresos y egresos del dinero del movimiento.</li>
<li>Notificar mediante un informe escrito el uso de los fondos disponibles en cualquier responsabilidad adquirida en las diferentes reuniones ordinarias.</li>
<li>Cotizar y pagar junto con el asesor todas aquellas responsabilidades adquiridas por el movimiento. (Todo el dinero disponible y recolectado deberá ser entregado al asesor del movimiento).</li>
<li>Junto con la junta directiva del movimiento llevar las actividades planificadas</li>
</ul>

<h3>Animación</h3>
<p>Se refiere a las personas o equipos encargados de mantener la energía y el espíritu festivo durante las actividades. Su objetivo es crear un ambiente de alegría y participación a través de cantos, dinámicas y juegos, facilitando la integración de los jóvenes y promoviendo un clima de sana convivencia. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Velar por el bienestar de los miembros en cada uno de los eventos a desarrollar.</li>
<li>Mantener constante comunicación con la junta directiva</li>
<li>Mantener un ambiente de respeto, cooperación y confianza dentro de los miembros del movimiento.</li>
<li>Asistir a las reuniones convocadas por la congregación de los Misioneros de la Consolata.</li>
<li>Acompañar a los miembros del movimiento en sus diferentes procesos.</li>
<li>Organizar dentro de cada actividad espacios de recreación.</li>
<li>Realizar la agenda de cumpleaños y fechas importantes del movimiento.</li>
<li>Trabajar en conjunto con la junta directiva velando por el cumplimiento de la normativa y la planificación estipulada.</li>
</ul>

<h3>Compromisos</h3>
<p>Son el corazón operativo del movimiento. Son los jóvenes que, a través de su servicio, asumen la responsabilidad de gestionar y liderar las áreas de trabajo. Su dedicación asegura la vitalidad y el correcto funcionamiento de las actividades del grupo, sirviendo de ejemplo para la comunidad. Cada área cuenta con un Encargado y un Auxiliar, lo que garantiza la eficiencia y la continuidad en la labor. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Cumplir con las responsabilidades asignadas en las distintas áreas de trabajo.</li>
<li>Comprometerse con la formación de liderazgo.</li>
<li>Asistir a las reuniones propuestas por la junta directiva.</li>
<li>Apoyar a la coordinación en la ejecución de las actividades.</li>
<li>Asistir a las reuniones y eventos organizados por el movimiento.</li>
<li>Velar por su crecimiento espiritual y humano.</li>
<li>Ejecutar con responsabilidad las tareas delegadas en cada evento.</li>
<li>Mantener un ambiente de respeto, confianza y responsabilidad dentro del movimiento.</li>
</ul>

<h3>Miembros en general</h3>
<p>Son todos los jóvenes que forman parte del movimiento. Su rol es participar activamente en las reuniones y actividades, integrándose a la comunidad y viviendo los valores del grupo. A través de su asistencia y compromiso, son los que dan vida al movimiento y lo hacen crecer. A continuación, se desglosan cada una de estas funciones y responsabilidades:</p>
<ul>
<li>Asistir a las reuniones y eventos organizados por el movimiento.</li>
<li>Velar por su crecimiento espiritual y humano.</li>
<li>Ejecutar con responsabilidad las tareas delegadas en cada evento.</li>
<li>Cooperar en todo lo necesario para que cada evento alcance las metas propuestas.</li>
<li>Mantener un ambiente de respeto, confianza y responsabilidad dentro del movimiento.</li>
</ul>

<h2>Periodos de coordinación</h2>
<p>La coordinación del movimiento opera bajo un sistema de periodos definidos para garantizar una rotación de liderazgo y permitir la renovación constante de ideas y enfoques. La duración de cada periodo de coordinación es de tres años.</p>
<div class="stat-row"><div class="stat"><b>3</b><span>años por periodo de coordinación</span></div><div class="stat"><b>2</b><span>periodos consecutivos como máximo</span></div></div>
<p>Al finalizar este lapso, es obligatorio llevar a cabo un proceso de elección para seleccionar a la nueva coordinación. Este procedimiento asegura la legitimidad y la participación de los miembros del movimiento en la elección de sus líderes.</p>
<p>Es importante destacar que cualquier coordinador en funciones puede ser reelegido, pero está sujeto a una limitación de periodos. Un coordinador puede ocupar el cargo por un máximo de dos periodos consecutivos.</p>
<p>Una vez que un individuo ha servido en el rol de coordinador durante dos periodos completos, ya sea de forma consecutiva o no, queda inelegible para futuras reelecciones. Esta norma promueve el desarrollo de nuevos líderes y evita la concentración del poder en un solo individuo o grupo a lo largo del tiempo.</p>

<h2>Áreas de trabajo</h2>
<p>Para garantizar la eficiencia, la continuidad y la buena gestión de cada área, es fundamental que la estructura de liderazgo se organice con claridad. Por ello, cada una de las áreas de trabajo, sin excepción, deberá contar con un <strong>Encargado</strong> y un <strong>Auxiliar</strong>. El Encargado será el líder principal, responsable de planificar, coordinar y ejecutar las tareas, así como de guiar a su equipo. El Auxiliar, por su parte, trabajará en estrecha colaboración, apoyando al Encargado en todas sus funciones, asumiendo tareas específicas y estando preparado para tomar el rol de liderazgo en caso de ser necesario. Esta dinámica de trabajo en equipo asegura que las responsabilidades se distribuyan de forma efectiva y que el funcionamiento del movimiento se mantenga sólido, incluso ante la ausencia temporal de un líder.</p>
<ul>
<li><strong>Redes Sociales:</strong> Esta área es la voz digital del movimiento, responsable de construir y mantener una presencia vibrante y atractiva en línea. Sus funciones principales incluyen la creación de una estrategia de contenido que refleje los valores católicos y el carisma del grupo, la producción de material visual y escrito de alta calidad (como imágenes, videos cortos y textos inspiradores), la gestión activa de las cuentas en plataformas como Instagram, Facebook y TikTok, y la interacción constante con la comunidad de seguidores para fomentar un sentido de pertenencia. Su objetivo es usar la tecnología como una herramienta para la evangelización, difundiendo información sobre actividades, testimonios y reflexiones de fe.</li>
<li><strong>Espiritualidad:</strong> El corazón de esta área es el crecimiento en la fe de cada joven. Se encarga de la planificación y ejecución de actividades que nutran la vida interior, como la organización de retiros espirituales, la programación de momentos de oración y meditación, y la coordinación de charlas formativas sobre temas de fe, moral y doctrina. Además, tiene la responsabilidad de fomentar la devoción a los sacramentos, especialmente la Eucaristía y la Reconciliación, y de proveer recursos y acompañamiento para que los jóvenes puedan profundizar su relación personal con Dios, ayudándolos a encontrar un sentido más profundo en su vida a través de la fe.</li>
<li><strong>Liturgia:</strong> Esta área es fundamental para garantizar que las celebraciones litúrgicas sean una experiencia de fe profunda y significativa para todos los miembros. Sus responsabilidades abarcan la preparación de todos los elementos necesarios para la Santa Misa, incluyendo la selección de lecturas bíblicas, la preparación de las oraciones de los fieles y la coordinación de los ministros litúrgicos. También se encarga de la ambientación del espacio sagrado y de guiar la participación activa de la asamblea. La meta es asegurar que cada liturgia sea un verdadero encuentro con Cristo, donde la belleza, el orden y la solemnidad inviten a la comunidad a adorar y a celebrar su fe con fervor.</li>
<li><strong>Visita a hogares:</strong> Esta área tiene la importante misión de construir y fortalecer los lazos comunitarios del movimiento a nivel familiar y personal. Se encarga de coordinar visitas periódicas a las casas de los jóvenes y sus familias, creando un espacio de cercanía, escucha y acompañamiento pastoral. Durante estas visitas, se busca conocer sus inquietudes, invitarlos a participar en las actividades del movimiento y ofrecerles apoyo espiritual y moral. La labor de esta área es vital para que las familias se sientan parte del movimiento y para que los jóvenes encuentren en el grupo un segundo hogar, basado en el amor y el apoyo mutuo.</li>
<li><strong>Recreación:</strong> Esta área es la encargada de fomentar un ambiente de alegría, camaradería y sana diversión dentro del movimiento. Sus funciones incluyen la organización de actividades lúdicas, como juegos, dinámicas de grupo, paseos, y eventos deportivos, que promuevan la integración y el trabajo en equipo. El objetivo no es solo la diversión, sino también el fortalecimiento de los lazos de amistad y la creación de un espacio donde los jóvenes puedan liberar tensiones y construir recuerdos felices juntos. A través de la recreación, se busca demostrar que la vida de fe es también una vida llena de gozo y fraternidad.</li>
<li><strong>Logística:</strong> Esta área es el pilar operativo y la espina dorsal del movimiento, garantizando que cada evento se desarrolle sin contratiempos. Sus responsabilidades abarcan la planificación detallada de todos los recursos necesarios, desde la gestión de espacios y equipos de sonido, hasta la provisión de alimentos y bebidas para los eventos. También son responsables de la coordinación del transporte, la seguridad y la correcta disposición de los materiales. Su labor es prever y resolver cualquier desafío práctico, asegurando que los líderes de las demás áreas puedan enfocarse en sus tareas específicas sin preocuparse por los detalles operativos.</li>
<li><strong>Metodología:</strong> El área de metodología es la encargada de la estructura y el plan de formación del movimiento. Su función principal es diseñar el currículo de las reuniones semanales, los talleres y los encuentros formativos, asegurando que los temas de fe, crecimiento personal y liderazgo se presenten de manera clara y progresiva. También son responsables de la formación continua de los líderes del grupo, proporcionándoles las herramientas pedagógicas y el conocimiento necesario para guiar a los jóvenes de manera efectiva. Esta área garantiza que la formación sea coherente y que el crecimiento espiritual de los miembros del movimiento sea constante y bien estructurado.</li>
<li><strong>Coro juvenil:</strong> Esta área tiene el don de elevar las celebraciones y los momentos de oración a través de la música. Su misión es la de animar las liturgias, encuentros y eventos especiales del movimiento, seleccionando cantos que refuercen el mensaje de la fe y que inviten a la participación activa de la asamblea. El coro se encarga de los ensayos periódicos para perfeccionar la armonía y la ejecución de los cantos. Su labor es vital para crear una atmósfera de alabanza y adoración que toque el corazón de los jóvenes, permitiendo que la música se convierta en una forma de oración.</li>
<li><strong>Ambientación:</strong> La ambientación es el área que da vida y calidez a cada espacio de reunión, transformándolos para que reflejen el espíritu de cada evento. Sus funciones incluyen la planificación y ejecución de la decoración para las reuniones, retiros, celebraciones litúrgicas y encuentros especiales. Se encargan de crear una atmósfera visual y sensorial que sea acogedora y que apoye la temática de la actividad, utilizando elementos como pancartas, telas, luces y objetos simbólicos. Su trabajo contribuye a que los jóvenes se sientan bienvenidos y a que el entorno físico sea un reflejo de la belleza de la fe.</li>
<li><strong>Servicio social:</strong> El área de servicio social es la manifestación concreta de la fe del movimiento en la comunidad. Su objetivo es organizar y coordinar proyectos de voluntariado y obras de caridad que ayuden a los más necesitados, cumpliendo así con el mandato de Jesús de servir al prójimo. Las actividades pueden incluir visitas a asilos, hospitales, la recolección y distribución de alimentos, y la participación en proyectos comunitarios. A través de esta labor, los jóvenes aprenden el valor de la solidaridad, la empatía y el amor al prójimo, convirtiendo su fe en acción.</li>
</ul>

<h1 data-kicker="Manual de identidad">Estructura formativa</h1>

<h2>Estructura formativa mensual</h2>
<ol class="pilares">
<li><strong>Formación:</strong> Este pilar se enfoca en el crecimiento intelectual y espiritual de los jóvenes a través del estudio. Su objetivo es profundizar en la fe católica, la doctrina, la Biblia, la misión y el plan vocacional, ayudando a cada miembro a comprender su identidad como hijo de Dios y a discernir cómo aplicar estos conocimientos en su vida diaria y en su servicio a la Iglesia.</li>
<li><strong>Evangelización:</strong> Este es el motor de la misión del movimiento. La evangelización no es solo la predicación verbal, sino la acción viva de los jóvenes que, con su testimonio, llevan la alegría del Evangelio a su entorno. Se trata de compartir la fe de manera natural y auténtica, sirviendo a los demás y manifestando el amor de Cristo en cada encuentro, para que otros puedan conocer a Jesús y su mensaje de esperanza.</li>
<li><strong>Animación:</strong> La animación es el corazón que mantiene al grupo vibrante y unido. Su función principal es nutrir la vida comunitaria a través de la oración en grupo, los momentos de reflexión, la música y las celebraciones litúrgicas. Busca fortalecer los lazos de fraternidad, alentando a los jóvenes a apoyarse mutuamente en su camino de fe y a crecer juntos como una verdadera comunidad.</li>
<li><strong>Recreación y Compartir:</strong> Este espacio es esencial para fomentar lazos de amistad genuina y un ambiente de alegría. A través de actividades lúdicas, deportivas y momentos de convivencia, los jóvenes pueden relajarse, compartir sus experiencias de vida y construir relaciones sólidas. Este pilar demuestra que la fe no es solo seriedad y estudio, sino también felicidad y fraternidad compartida en un entorno sano y seguro.</li>
</ol>

<h1 data-kicker="Metodología">Orientaciones pedagógicas</h1>
<p class="lead-in"><strong>Momentos del desarrollo del tema formativo.</strong></p>
<p><u>RECOMENDACIÓN:</u> Es importante que los momentos vayan acompañados de una ambientación simbólica, que introduzca al joven de manera visual o auditiva a la jornada.</p>

<h3>Stop y seguimos</h3>
<p>Los jóvenes muchas veces llegan al grupo con situaciones complicadas de la vida personal y esto es una limitante para que pueda aprovechar al máximo la jornada del día, es por ello, que cada encuentro debe ir acompañado de un momento de cohesión grupal, donde se experimente el compañerismo, la valoración del otro, los dones y talentos, la integración y la oportunidad de reír y jugar dejando a un lado lo que nos agobia para entonces, desde ese dinamismo, promover un espacio de recreación y antes de dar inicio a los momentos de reflexión y formación.</p>

<h3>Abro las ventanas del alma</h3>
<p>Momento en el cual, desde la oración y meditación, nos disponemos para abrir las ventanas del alma, que son nuestros oídos y ojos para la escucha y atención activa de lo que iremos descubriendo en el desarrollo del tema formativo. Se invita al Joven a experimentar la presencia de Dios que se manifiesta en el facilitador, en los recursos, en sus compañeros y en todo lo que lo rodea, pues el mismo Cristo nos ha llamado a cada uno por nuestros nombres para que estemos con el (Mc. 3, 14). Es esta experiencia de “estar con Jesús” la que moverá nuestros sentidos para la evangelización en los distintos lugares y contextos del joven.</p>

<h3>Profundizo y construyo</h3>
<p>Espacio donde se le brinda al joven la formación e información, que, a su vez, vaya generando en el participante inquietudes e ideas que ayuden en la construcción de propuestas significativas que movilicen no solo al joven en particular, si no, al grupo en general. Es la oportunidad de nutrirnos, de fortalecer nuestras experiencias, de acrecentar y consolidar la formación misionera en todo tiempo <em>-tengan el espíritu de los Misioneros y misioneras de la Consolata en los pensamientos, en las palabras y en las obras, - (San José Allamano, #41, Los Quiero Así).</em></p>

<h3>Punto de partida</h3>
<p>Es aquí donde el joven misionero deberá emprender un camino en relación con lo aprendido, poner en práctica lo reflexionado y asumir compromisos que lo lleven a mantener el espíritu misionero. Desde pequeños trabajos de grupos y motivando a actuar en torno al tema, se les invita a los participantes a dar opciones y propuestas.</p>
<p>Para llevar a su entorno social, académico, familiar y pastoral los aprendizajes adquiridos durante la jornada formativa. Es importante que el joven vea sus aportes como signo de compromiso y estilo de vida, no basta con creer lo que se aprende, hay que ponerlo en práctica (Stg. 2,26).</p>

<h1 data-kicker="1er año · Oceanía (Azul) · Temas IMC">Biografía de San José Allamano</h1>

<h2>Dinámica de presentación</h2>
<div class="box dinamica">
<p class="box-t">Dinámica</p>
<p>El guía hará entrega de una hoja y un lápiz a cada participante y les dictará las siguientes preguntas: ¿Cuál es tu nombre completo? ¿Dónde naciste? ¿Cuántos hermanos tienes? ¿Qué querías ser de niñ@? ¿Qué te gustaba hacer en el bachillerato? ¿Cuál es tu meta actual?, seguidamente se invitarán a los participantes a realizar esas preguntas entre sí, pero con la dificultad que solo tendrán 7 min para compartir sus respuestas, y ganará quien haya conseguido entrevistar a más compañeros, como penitencia a quienes logren menos entrevistas deberán compartir sin leer las repuestas que pudo obtener de algún compañero, esto con la finalidad de que se puedan conocer entre sí un poco más, y así dar paso para conocer sobre el Fundador del Instituto.</p>
</div>

<h2>Oración inicial</h2>
<p>El guía invita a los participantes a colocarse en una postura cómoda y respetuosa para invocar a la Santísima Trinidad, y pedir al Espíritu Santo que se haga presente, para que sea él con su gracia quien dirija el Encuentro. Se entrega la Oración de José Allamano a dos de los participantes para que sea recitada por ellos a dos voces.</p>

<h2>La ponencia del guía</h2>
<p><strong>El guía inicia la ponencia:</strong> se sugiere que para la aplicación del tema sean distribuidos los espacios en cuatro áreas: la primera, donde se exponga sobre la niñez y juventud; en el siguiente espacio se comparta su formación como sacerdote; posteriormente su labor como sacerdote local, donde da relevancia e impulso a la fe mariana; y por último la fundación de los Institutos, dejándonos como legado «Anunciarán mi Gloria a las Naciones» (Isaías 66, 19) y «Primero Santos, luego misioneros». En cada espacio formativo se pueden colocar las fechas y lugares claves como parte de la ambientación, así como elementos y signos relacionados a cada etapa, por ejemplo libros, Biblia, imagen de la Consolata, cartas, frases.</p>

<h2>Pasos luminosos de San José Allamano</h2>
<p>José Allamano nació el 21 de enero de 1851 en Castelnuovo d’Asti, el pueblo natal de San José Cafasso y San Juan Bosco. José Allamano era el cuarto de cinco hijos de una familia campesina y cristiana. Su papá se llamaba José y su mamá María Ana Cafasso. Habiendo perdido a su padre aun cuando no tenía tres años, influyó decisivamente sobre él su madre María Ana Cafasso, la hermana de San José Cafasso, una mujer educadora convencida, y llena de amor por sus propios hijos. Además, era una mujer de oración y ejemplo precioso para los hijos, en particular para José, que lo conservará toda su vida. Doña María Ana muere en el año 1870.</p>
<p>Finalizada la escuela primaria en 1862 entró en el oratorio salesiano de Valdocco. Allí permaneció cuatro años, donde concluyó la primera etapa de los estudios secundarios. Durante cuatro años se confiesa regularmente con don Juan Bosco y decía que «daba la sensación de que leyese mi corazón por dentro y que adivinase muchas cosas», pero una cosa que ni siquiera don Bosco consiguió adivinar quedó secreta en su corazón: la desazón ante un estilo de vida que el joven estudiante cree que no va de acuerdo con su carácter ni con lo que espera del futuro. Sintiéndose llamado al sacerdocio diocesano, dejó Valdocco sin despedirse, para entrar en el seminario de Turín. Luego Don Bosco le pregunta con estas palabras: «Lo que me hiciste es muy grave; te fuiste sin saludarme. Si hubiese sabido que te ibas al seminario, no te habría dejado salir tan fácilmente». Don Bosco veía en él a un futuro miembro de su Instituto. La tímida respuesta de José fue «No deseaba…», porque como lo quería mucho a Don Bosco, no quería darle un disgusto.</p>
<p>Su decisión de entrar en el seminario diocesano no fue aceptada por parte de sus hermanos, no porque no estuvieran de acuerdo con la vocación sacerdotal, sino porque querían que primero terminara sus estudios. El joven José les respondió a sus hermanos con una sola frase: «El Señor me llama hoy…… no sé si me llamará aún dentro de dos o tres años». Así en 1866 entró en el seminario. Ya desde el primer año se manifestó la fragilidad física que lo acompañará durante toda su vida, llevándolo inclusive a estar, en más de una ocasión, en peligro de muerte. José, en su formación como seminarista se distinguió por su firmeza ante los principios y la delicadeza en sus responsabilidades. Su compañero de seminario Mons. G. G. Resia, decía sobre él «Era el primero, no sólo alfabéticamente, sino por sus estudios y sus virtudes, su mansedumbre y la bondad de su corazón de Jesús, el más amigo era Allamano, con el que nadie osaba compararse». Allamano fue ordenado sacerdote el 20 de septiembre de 1873, al día siguiente de su ordenación lo destinaron a la formación de los seminaristas primero como asistente (1873-1876), luego como director espiritual del seminario mayor (1876-1880), luego como rector del santuario de la Consolata de Turín. Además de ser rector del santuario del Consolata, José Allamano también era rector del santuario de S. Ignacio en las colinas de Lanzo Torinese. En esta tarea le fueron unánimemente reconocidos excelentes cualidades que lo convirtieron en un verdadero «maestro en la formación del clero».</p>
<p>Además de todo lo que hemos señalado, José Allamano estaba involucrado, directa o indirectamente, en tantas otras obras apostólicas en la Iglesia local. Animado por este intenso celo apostólico, unido a un sentido vital de la misión de la Iglesia, ensanchó sus horizontes hacia el mundo entero. Sintió la urgencia del mandato de Cristo a anunciar el Evangelio a todos. Desde su temprana edad, Allamano había manifestado su deseo de ir a misiones y seguía con ardor la obra misionera que Guillermo Massaia, misionero capuchino, había realizado en Etiopía. A través del libro escrito por Massaia, «Mis 35 años de misión en la alta Etiopía», Allamano percibía las necesidades espirituales, morales, sociales y pastorales de ese pueblo y lo dejaban impresionado. De esa manera fue surgiendo el ideal de fundar un Instituto misionero. En 1891 le pareció que había llegado el momento de realizar su proyecto de fundar, pero no fue posible. En enero de 1900, una enfermedad contraída mientras asistía a una pobre mujer en un altillo helado lo llevó a estar en peligro de muerte. La curación, considerada un milagro de la Consolata, fue para él la señal de que el Instituto se debía fundar. Al año siguiente, el 29 de enero de 1901, nació el Instituto Misiones Consolata.</p>
<p>Los primeros misioneros, dos sacerdotes y dos laicos partieron hacia Kenya el 8 de mayo de 1902. Después de diez años de la fundación del Instituto para masculinos, el 29 de enero de 1910 nació el Instituto de las Misioneras de la Consolata.</p>
<p>A sus hijos e hijas dedicó las mayores atenciones, a través de contactos personales, cartas, encuentros formativos. Convencido de que a la misión se le debe dar lo mejor, dio más importancia a la calidad que a la cantidad. Quería evangelizadores preparados, «santos en modo superlativo», generosos hasta dar la vida. Su lema era: «primero santos, después misioneros». José Allamano murió el 16 de febrero de 1926 en el santuario de la Consolata.</p>
<p>Fue beatificado el 7 de octubre de 1990 por Juan Pablo II. Durante la homilía de la beatificación, el Papa dijo: «En el momento en el que es incluido entre los beatos, José Allamano nos recuerda que para permanecer fieles a nuestra vocación cristiana es necesario saber compartir los dones recibidos de Dios con los hermanos de todas las razas y de todas las culturas; es necesario anunciar con coraje y coherencia a Cristo a todas las personas que encontremos, especialmente a los que aún no lo conocen».</p>
<p>No es hasta 24 años después que se lleva a cabo por parte del Papa Francisco la canonización durante el mes de las misiones de nuestro Padre fundador en la Plaza San Pedro del Vaticano el 20 de octubre de 2024, junto a otros 13 nuevos santos. Francisco recordó que estos nuevos santos vivieron según el estilo de Jesús, que es «el servicio»: «La fe y el apostolado que llevaron a cabo no alimentaron en ellos deseos mundanos ni ansias de poder, sino que, por el contrario, se hicieron servidores de sus hermanos, creativos para hacer el bien, firmes en las dificultades, generosos hasta el final».</p>
<p>El milagro de la canonización fue el concedido al indígena Sorino yanomami, en la selva, quien fue atacado por un jaguar, y su cráneo quedó en parte destrozado, con pérdida de masa cerebral. Sorino perdió la vista. En esos días comenzó la novena del Beato José Allamano, y las Hermanas de la Consolata en la misión de Catrimani lo invocaron por la curación de esta persona. Lo encontraron de repente curado y ya entonces se consideró un milagro.</p>
<p>Asimismo, el día de la canonización durante el Ángelus el Papa Francisco nos recuerda que «El testimonio de san Giuseppe Allamano nos recuerda la atención necesaria hacia las poblaciones más frágiles y más vulnerables […] Hago un llamamiento a las autoridades políticas y civiles, para que aseguren la protección de estos pueblos y de sus derechos fundamentales y contra todo tipo de explotación de su dignidad y de sus territorios».</p>

<h2>Actividad de cierre y oración final</h2>
<p><em>Al concluir la ponencia sobre la Vida del Santo, el guía divide a los presentes en 4 grupos, y a cada uno le hace entrega de un sobre que contendrá información sobre una etapa de la vida del Allamano, es decir, tendrá fechas, nombres, lugares, frases, que hagan referencia a un momento vivido por el Santo, ejemplo infancia y juventud, sacerdocio, fundación de los Institutos, muerte y beatificación; se pedirá a cada grupo que identifique cuál es la etapa que les tocó según los datos encontrados en su sobre y deben en orden cronológico armar una línea de tiempo, reafirmando así los conocimientos obtenidos acerca de la vida de José Allamano y sus momentos más resaltantes.</em></p>

<h1 data-kicker="1er año · Oceanía (Azul) · Temas IMC">Carisma ad gentes de los Misioneros de la Consolata</h1>

<h2>Oración inicial</h2>
<p>Invocación al Espíritu Santo y canto «Me has seducido, Señor».</p>

<h2>Dinámica: el ladrillo</h2>
<p>Se distribuyen en 5 grupos y se les pide escuchen con atención el siguiente cuento, y deben elegir un representante por grupo que expondrá las conclusiones a los presentes. (Se puede distribuir el cuento en físico para los grupos).</p>
<div class="box cuento">
<p class="box-t">El ladrillo</p>
<p>Qué hermosos edificios hay en las ciudades. ¡Cuánta gente habrá trabajado en la construcción de cada uno de ellos! ¡Qué solución para aprovechar los espacios reducidos en las zonas urbanas! Pero pensaba que, como todas las cosas, un buen edificio, por más alto e imponente que sea, necesita de lo elemental que, en este caso, no es otra cosa que un simple ladrillo. Algo con menos gracia que un ladrillo, es difícil de encontrar, nada en él llama la atención. Por más que se lo quiera evitar, siempre estará polvoriento. Se quiebra con facilidad ante el choque con algo duro y hasta su forma carece de belleza. Pero, aun con todos esos «defectos», es imprescindible para poder construir un edificio.</p>
<p>Hay otros tipos de ladrillos, los que son decorativos, los que van a la vista, los que «se hacen ver»; pero los que realmente son edificantes son los otros, los que no se ven, los que permanecen ocultos y, quizás, incluso, son más toscos, pero se necesitan… Claro que un único ladrillo, por sí solo, no puede hacer nada, estaría tirado en algún corralón. Necesita de la unión con otros ladrillos para poder ser útil. Y, sobre todo, necesita del albañil para ponerlo en el lugar que le toca. Unos por abajo, otros muy arriba, algunos, quizás, tengan que «sufrir», ser partidos al medio; pero todos cumplen con su tarea de manera oculta y «silenciosa», aportando su existencia para la construcción.</p>
<p>Ahora bien, el ladrillo, si tuviera vida, al descubrirse tal cual es, podría lamentarse por su rusticidad y no entregarse al albañil. Pero, aun en ese caso, debiera saber que, sin el ladrillo común y silvestre, no se podrían construir ni las casas más sencillas ni los más hermosos rascacielos…</p>
</div>
<p class="lead-in"><strong>Preguntas para reflexionar:</strong></p>
<ol>
<li>¿Qué significado le encuentras al relato?</li>
<li>¿Qué clases de ladrillos aparecen?</li>
<li>¿A quiénes representan los ladrillos?</li>
<li>¿De qué necesita un ladrillo?</li>
<li>¿Con cuál ladrillo te identificarías? ¿Por qué?</li>
</ol>
<p class="lead-in"><strong>Plenaria</strong></p>
<p>El facilitador da paso a la plenaria donde los 5 representantes de cada grupo expondrán sus respuestas; al finalizar la participación de cada miembro se dará inicio al tema tomando como referencia el análisis compartido sobre el cuento de los ladrillos.</p>

<h2>Tema: el carisma de los Misioneros de la Consolata</h2>
<p class="cita">[Recibieron de su fundador la dispensación de la Consolación de Dios al mundo entero.]</p>
<p>El Carisma es un don especial y una gracia especial que configura forma de vida, habilita para vivenciar, comunica funciones, virtudes, ministerios etc. Y capacita para desempeñarlos (1 Cor 12, 4 ss.). Inspirado por la teología de Pablo, el Concilio Vaticano II define el carisma como un don o gracia especial de origen divino, otorgado por el Espíritu Santo a los fieles cristianos para la renovación y la edificación de la Iglesia (1Cor 12, 7; LG 12). Así que, los carismas son regalos del Espíritu de Dios y son dados a la Iglesia para su utilidad y edificación, aunque se concedan a una persona o a un grupo en particular.</p>

<h3>El Fundador y el Instituto</h3>
<p>El Carisma de la vida religiosa ha sido dado a la Iglesia a través de personas concretas que han fundado institutos religiosos o congregaciones en las distintas épocas de la historia. Por lo tanto, el carisma de la vida religiosa se encarna en los institutos religiosos. Esto lleva a hablar del carisma del Fundador y del carisma del instituto.</p>
<p>Así que, no se puede hablar del carisma del Instituto Misiones Consolata, sin entender el carisma de San José Allamano, su fundador. Por carisma del fundador se entiende una especial comunicación de gracias, concedida directamente por el Espíritu de Dios a una persona, a fin de capacitarla para fundar un instituto religioso y configurar su fisonomía e identidad.</p>
<p>Esta especial comunicación que es objetiva, lleva al fundador a vivir los elementos comunes de la vocación cristiana, la vida religiosa y los elementos propios y diferenciados de su carisma, es decir, una especial vocación personal, una espiritualidad propia, una visión profética, un estilo de vida particular.</p>
<p>Con eso se puede hablar del carisma del fundador con un don de gracia destinado a iniciar una forma de vida apta para ser vivida por muchos y, por lo mismo, como don colectivo, trasmisible, perdurable y con capacidad de ser desarrollado y actualizado.</p>

<h2>Fundamentos del carisma</h2>
<p>El carisma de los Misioneros de la Consolata es el espíritu que recibieron directamente de su fundador, el San José Allamano desde el primer día de su fundación hasta el día de hoy, para la dispensación de la Consolación de Dios al mundo entero.</p>
<p>Se trata del Espíritu que el beato José inculcó en los misioneros y las misioneras de la Consolata: la manera de vivir y de hacer la misión, como estilo de vida. <em>«El Instituto es una familia de consagrados para la misión ad gentes por toda la vida, en la comunión fraterna, en la profesión de los consejos evangélicos, y teniendo a María modelo y guía»</em> (Constituciones IMC, n° 4).</p>
<p>San José Allamano recibió y heredó al Instituto de la Consolata el llevar una <strong>vida en Familia</strong>, es decir, una familia de misioneros consagrados a la misión. El deseo del fundador era que sus misioneros vivieran como en una familia: «Recuerden que el Instituto no es un colegio, tampoco un seminario, sino una familia. Son todos hermanos; deben vivir juntos, prepararse juntos, para luego trabajar juntos durante toda la vida». La familia Consolata está constituida por misioneros con diversos trasfondos culturales, pero unidos por alcanzar un mismo fin: <strong>la evangelización de los pueblos</strong>. Igualmente, el Instituto se reúne en nombre del Señor, donde todos se acogen como hermanos, interesados los unos por los otros, viviendo la misión en unidad y haciendo propias las alegrías, sufrimientos y esperanzas de sus hermanos.</p>
<p>Un aspecto relevante del Carisma del Instituto es la <strong>dimensión mariana</strong>. Los misioneros de la Consolata son marianos por excelencia y así lo deja manifiesto el San José Allamano: «La Virgen, bajo todas las advocaciones, es una sola; pero ustedes sean le devotos, especialmente bajo el título de la Consolata». Los misioneros y las misioneras de la Consolata participan de la misión materna de María de llevar al mundo la Consolación que es Jesucristo. Con la Santísima virgen María Consolata anuncian la gloria de Dios a la humanidad, porque es protectora de las misiones.</p>
<p>Vale la pena notar que la <strong>Eucaristía</strong> constituye una identidad peculiar de los misioneros de la Consolata: «La vida del misionero es una vida eucarística» (Constitución n°12). La Eucaristía es la cumbre de todo ser y quehacer del misionero de la Consolata. De ella los misioneros sacan la fuerza para llevar adelante la obra evangelizadora y, ante todo, es el centro al cual tiende la vida espiritual de la persona del misionero y de las comunidades.</p>
<p>Gracias al carisma ad gentes que el Instituto recibió del San José Allamano, varios misioneros de la Consolata han entregado su vida predicando el evangelio en los cuatro continentes (África, América, Europa y Asia), sirviendo a los menos favorecidos de la sociedad, en aquellos lugares donde nadie quiere ir.</p>
