<h1 data-kicker="3er año · África (Verde) · Pastoral">Misionero o turista</h1>

<h2>Dinámica: maniquí</h2>
<p>El facilitador dividirá a la participantes en proporción a la cantidad de asistentes (2 máximo 4 grupos) deberán elegir entre sí un voluntario que hará la función de maniquí, al cual sus compañeros deben vestir según una temática específica (elegida por el facilitador) o con la mayor cantidad de piezas en un tiempo determinado, al concluir la vestimenta y seleccionar el equipo ganador, el facilitador compartirá una pequeña reflexión de la dinámica con referencia al tema a desarrollar, pues muchas veces nos pasa que al ir de misión invertimos más tiempo que las cosas superficiales como la ropa o como se verán, o simplemente nos quedamos allí para que la gente nos mire como se miran a los maniquí en las tiendas.</p>

<h2>Oración</h2>
<p>Invocación al Espíritu Santo a través de un canto; e invitar a los participantes a cerrarlos ojos y realizar un silencio profundo que los lleve a estar a solas con Jesús, sacando todo pensamiento de sí y quedar vacíos para que, entre Jesús, dejando todo lo del mundo fuera, permanecer en busca de esa conexión íntima con Dios por unos minutos y luego ir evocando palabras de alabanzas a Dios que inviten a los participantes a salir de la contemplación.</p>

<h2>Tema: vocación de turista, vocación misionera</h2>
<p><strong>Relato: Vocación de turista, vocación misionera</strong></p>
<p>Oye, ¿qué vas hacer este verano? - Creo que voy a Guatemala un mes, de voluntario en un proyecto con unos misioneros. - ¿Ya es el tercer año que vas, no? – Sí, la verdad es que allí hace falta y yo aprendo un montón de la gente de allí.</p>
<p>Esta conversación puede que no te resulte tan extraña. Hoy día hay muchos jóvenes que deciden compartir parte de su tiempo con los empobrecimientos del Sur. Esta experiencia no es tan sencilla lograrla, además que tienen que trabajar durante el año para pagarse su viaje, tienen que prepararse haciendo algún curso y tienen que ser asiduos colaboradores de la organización con la que vayan.</p>
<p>Este hecho que comienza a ser bastante corriente me ha hecho preguntarme donde dónde está la frontera entre turismo y misión. En teoría, parece que la diferencia estaría muy clara, pero hay situaciones donde se disfraza de voluntariado lo que simple y llanamente es otra forma de vacaciones y una experiencia más que añadir al currículo personal. La virtud que resalta en el voluntario es, como su propio nombre indica, la voluntad: la persona tiene ganas de irse al Sur y luchar contra el empobrecimiento y, mientras siga teniendo «voluntad», hará estos viajes.</p>
<p>Por tanto, el sujeto único de la acción es la propia persona, ella es sensible a una realidad e intenta poner los medios que tiene a su alcance para no quedarse de brazos cruzados. Normalmente, concebirá su estar allá como un trabajo, como una profesión, con un horario determinado y unos espacios de ocio. Por ello, no se preocupará demasiado de cómo la población local reacciona ante sus comportamientos.</p>
<p>El voluntario va a hacer un trabajo y a «tener» experiencias nuevas de contacto con personas de otras culturas. Por ejemplo, para ver si uno va al Sur de turista o bien de misionero, será bueno preguntarse como gestiona su tiempo libre, si se dedica a estar con la gente o si lleva un ritmo de vida superior al de la población autóctona. En cambio, lo que resalta en el misionero es la «misión», que según el diccionario es el poder que se le da a un enviado para desempeñar algún cometido. Aquí, el sujeto de la acción es doble: la propia persona y Dios Padre. La persona se siente enviada por Dios dentro de su proyecto de extensión del Reinado de Dios, se siente llamada dentro de un proyecto mayor, un proyecto del Espíritu.</p>
<p>Por tanto, más que de un trabajo, aquí se trata de una actitud vital, de una forma de ser y de estar en el Sur. Lo importante no es solo lo que hace la persona sino como lo hace. El misionero tiene en cuenta la repercusión que conlleva su presencia en una cultura ajena. De hecho, es fácil que dedique más de un año a conocer el entramado cultural del lugar donde llega enviado.</p>
<p>Quisiera aclararte que estoy intentando provocar una reflexión sobre las actitudes, no estoy diciendo que todo voluntario vaya de turista por el mundo ni que todo misionero tenga en cuenta la cultura local. Puede haber voluntarios que vivan su vocación con el contenido que expresé de la vocación misionera y viceversa. Además, cuando hablo de misioneros siempre me estoy refiriendo a hermanas/os, Laicos/as, sacerdotes que estén un tiempo prolongado en el Sur.</p>
<p>Concluyo invitándote a responder la pregunta que nos colocaba nuestro fundador, José Allamano: ¿es que todo vale para la misión? Creo que podemos caer en disfrazar de opción por los pobres lo que sólo es realización personal narcisista; o puede que nos dediquemos al turismo a costa de los pobres (aunque siempre pagándonos nuestro viaje); o que llamemos solidaridad a lo que solo es paternalismo...</p>
<p>No sé si te parecerán frases duras, pero creo que urge una reflexión antes de que volvamos a recibir cartas como la de Talambula, refugiado congoleño: «no volvías más, no os aprovechéis jamás de la miseria de los pobres para enriqueceros. Si estáis sin trabajo en vuestro país, no vengáis aquí para aliviar vuestra miseria aumentada la nuestra. Quedaos en vuestro país y dejadme morir en mi miseria». Son palabras fuertes, pero, a veces, actitudes enquistadas necesitan auténticos revolcones para provocar la reflexión y la reacción. La pregunta sigue ahí, ¿tienes vocación de turista o de misionero?</p>
<p class="firma">Ramón Lázaro Esnaola<br>Misionero de la Consolata, Madrid.</p>

<h2>Trabajo grupal: para ser misionero</h2>
<p><em>Luego de leer el relato, él facilitador dará una pequeña reflexión en base a la misma, y dividirá a las participantes en 4 grupos, para que realicen un trabajo grupal, en el cual deben esquematizar y presentar el punto que les haya tocado del siguiente material:</em></p>
<h3>Para ser misionero</h3>
<h4>1. Acción misionera conmigo mismo:</h4>
<p><em>Descubro:</em> en mí mismo la necesidad que tengo de ir hacia los demás, porque, solo así voy haciéndome persona, abriéndome a los otros. Una dimensión universal porque solo así evito el individualismo, el grupismo o el nacionalismo y soy verdaderamente católica.</p>
<p><em>Procuro:</em> a partir del evangelio conocer más a Cristo misionero, el enviado del Padre a todos los hombres y en todos los tiempos.</p>
<p><em>Me Intereso:</em> por conocer más la Acción misionera de la iglesia en sus diversas manifestaciones y situaciones.</p>
<p><em>Me esfuerzo por:</em> ir hacia aquellos que estando a mi alcance, no conocen o no siguen a Jesucristo. Para lograr esto cultivo en mí:</p>
<ul>
<li>Capacidad de diálogo.</li>
<li>Actitudes de servicio.</li>
<li>Disponibilidad para apreciar los valores ajenos.</li>
</ul>
<p><em>Tomo en consideración:</em> la vida misionera como una de las opciones vocacionales para mi presente y para mi futuro, expresada como entrega definitiva a la misión AD GENTES.</p>

<h4>2. Acción misionera con mi comunidad cristiana:</h4>
<p><em>Estímulo:</em> La comunidad cristiana a la que pertenezco sea grande o pequeña (Diócesis, parroquia, colegio, grupo parroquial, comunidad de base), para que se abra misioneramente, a aquellos que, viven en el mismo ambiente geográfico.</p>
<p><em>Animo:</em> mi comunidad cristiana para que se informe cada vez más de los problemas misioneros de su nación y de todo el mundo.</p>
<p><em>Muevo:</em> mi comunidad de fe para que conozca, apoye y este en contacto con los misioneros que han salido de la misma.</p>
<p><em>Insisto:</em> en mi comunidad de fe para que apoye espiritual y económicamente a los jóvenes que en la misma quieren ser misioneros.</p>
<p><em>Colaboro:</em> en la promoción vocacional estimulando a los jóvenes para que, dentro de sus opciones, consideren también la vida misionera como forma de entrega definitiva.</p>
<p><em>Relaciono:</em> los jóvenes de mi comunidad de fe y con otros jóvenes cuya vivencia cristiana es nula o pobre, para una inter experiencia juvenil.</p>
<p><em>Organizo:</em> actividades en favor de los más necesitados de mi comunidad cristiana para manifestar el Espíritu de servicio misionero en una ayuda concreta.</p>
<p><em>Fomento:</em> las intenciones misioneras en las liturgias eucarísticas.</p>
<p><em>Coordino:</em> encuentros de estudio sobre temas misioneros o relacionados con la Acción misionera.</p>
<p><em>Contacto:</em> los organismos y centros misioneros de mi comunidad cristina para colaborar con los mismos en la Acción misionera.</p>
<p><em>Organizo:</em> grupos misioneros que tengan como objetivo la Acción misionera y en especial la animación en mi comunidad.</p>
<p><em>Asesoro:</em> grupos juveniles que tengan como objetivo la reflexión sobre la vocación misionera en vista de una opción futura.</p>
<p><em>Me uno a:</em> otras personas con entusiasmo misionero no sea «Mi Actitud» sino de todo un grupo vivencia y convencido, y sea así más eficaz como testimonio.</p>

<h4>3. Acción Misionera con otras comunidades cristianas:</h4>
<p><em>Doy:</em> Mi colaboración, como puedo y como está a mi alcance, a otras comunidades cristianas y acojo con aprecio sus valores.</p>
<p><em>Estímulo:</em> Mi comunidad de fe para que envía algunos de sus cristianos (sacerdotes, religiosos, laicos) a otras comunidades de fe para compartir, en la ayuda mutua, experiencias de fe enriquecedoras.</p>
<p><em>Acojo:</em> Con entusiasmo a quienes vienen a ayudar en la propia comunidad de fe.</p>
<p><em>Me convierto en:</em> Un canal de comunicaciones de fe, diversas y enriquecedoras.</p>

<h4>4. Acción Misionera con los no cristianos «Misión Ad gentes»:</h4>
<p><em>Acepto formarme:</em> Y ser enviado como misionero más allá de las fronteras de mi comunidad.</p>
<p><em>Procuro conocer:</em> Más de la realidad y forma de vida religiosa de «los no cristianos».</p>
<p><em>Concientizo:</em> Mi comunidad cristiana para que apoye el deseo de quien quiere ser enviado a los no cristianos como misionero de Cristo.</p>
<p><em>Fomento:</em> En mi comunidad el conocimiento de la Acción misionera de la Iglesia entre los «no cristianos».</p>
<p><em>Animo:</em> A los jóvenes para que se pongan en contacto con los misioneros que trabajan entre los «no cristianos».</p>
<p><em>Oro a diario:</em> Para que Cristo sea conocido por todos y todos los pueblos le alaben.</p>
<p><em>Insisto:</em> En los encuentros Eucarísticos.</p>
<p><em>Sensibilizo:</em> Mi comunidad cristiana a través de mi actividad para que apoye espiritual y económicamente a los misioneros.</p>

<h2>Exposición del facilitador: el misionero que sale</h2>
<p><em>El facilitador dará una ponencia en referencia a la siguiente información y abrirá el espacio para que los participantes hagan una reflexión sobre lo que exigen la misión y como ellos está respondiendo a la misma.</em></p>
<p class="lead-in"><strong>El misionero que sale… Es la expresión de la comunidad que lo envía.</strong></p>
<p><strong>EVANGELIO:</strong> Jn 16, 16 «Los apóstoles están tristes porque su amigo va a salir»</p>
<ol>
<li><strong>Es una exigencia de la comunidad cristiana «ENVIAR»</strong>
<ol type="a">
<li>Toda comunidad tiene sus exigencias de comunión entre los miembros, de intercambio con los de «afuera».</li>
<li>Es natural comunicar lo que uno ha descubierto (1Jn 1, 1-4).</li>
<li>Es deber de justicia dar a los otros lo que les falta (Stgo 2, 14-17).</li>
</ol></li>
<li><strong>Es la realización de ser Iglesia:</strong>
<ol type="a">
<li>La iglesia es para llevar la salvación a los otros (LG. 1)</li>
<li>La iglesia es cuerpo de Cristo (1 Cor 12)</li>
<li>La iglesia es imagen de la Trinidad (Jn 17, 18; AG. 2)</li>
</ol></li>
<li><strong>Es la expresión de ser Iglesia:</strong> Es el cuerpo de Cristo que es la Iglesia, el Misionero es un poco miembro operativo (manos, piernas…), pero es todo el cuerpo que contribuye al movimiento.</li>
</ol>
<div class="esquema"><span>COMUNIDAD</span><i>→</i><span>MISIONERO</span></div>
<ol type="a">
<li><strong>La comunidad hacia el misionero:</strong>
<ul>
<li>el misionero nace de la comunidad (AG. 23, 28)</li>
<li>es sostenido por la comunidad (AG. 35, 36, 37)</li>
<li>«cuanto más una comunidad es madura, más misioneros produce».</li>
</ul>
<div class="esquema"><span>MISIONERO</span><i>→</i><span>COMUNIDAD</span></div></li>
<li><strong>El misionero hacia la comunidad:</strong>
<ul><li>el misionero hace propia, enriquece la comunidad que le envía.</li></ul></li>
</ol>
<h3>La propuesta de Cristo</h3>
<p>La primera comunidad cristiana:</p>
<ul>
<li>Es una comunidad apostólica (Hechos 2, 40 ss; 4, 32 ss).</li>
<li>Tiene misioneros que ella misma produce, envía, sostiene (Hechos 9, 9-19; 30; 13,1ss).</li>
<li>Realiza el mandato de Cristo, participación a su misma misión (Jn 17, 18; 20, 29; Mt 18, 1-19; Mc 16, 15 ss).</li>
</ul>
<h3>¿Qué exige de mí?</h3>
<p><strong>¿Yo soy un misionero?</strong></p>
<ul>
<li>Que exige de mí este hecho.</li>
<li>Los otros se dan cuenta: ¿mis compañeros de trabajo, de escuela, de grupo…?</li>
<li>Cuáles son los momentos de mi jornada, de mi vida en el cual me siento un verdadero misionero?</li>
<li>En la comunidad se ve y se siente esta realidad?</li>
<li>Somos verdaderos misioneros en nuestro ambiente social? ¿Cómo?</li>
</ul>
<p><strong>¿Es mi deber ayudar a los misioneros?</strong></p>
<ul>
<li>Conozco personalmente a unos misioneros?</li>
<li>Como los considero.</li>
<li>En que forma los ayudo?</li>
<li>Los siento parte de mí mismo?</li>
</ul>
<h3>Reflexión en grupo</h3>
<p><strong>1. SER MISIONERO: (AG. 28)</strong></p>
<p>¿EN QUE FORMA?</p>
<ul>
<li>Renovación (AG. 35)</li>
<li>Testimonio de palabras y de vida (AG. 11)</li>
<li>Oración Sacrificio (AG. 35)</li>
</ul>
<p>¿EN QUE LUGAR?</p>
<ul>

</ul>
<p><strong>2. AYUDAR A LOS MISIONEROS: (AG. Cap. VI)</strong></p>
<p><strong>CONCRETAMENTE:</strong></p>
<ul>
<li>¿Cómo podemos ayudarlos?</li>
<li>El misionero que sale, que se va, tiene necesidad de nosotros.</li>
<li>Que iniciativas podemos realizar para hacer más sensibles nuestra colaboración.</li>
</ul>

<h2>El Papa Francisco invita a jóvenes misioneros a no ver la realidad como si fueran turistas</h2>
<p>Durante su viaje apostólico a Génova, se encontró con jóvenes misioneros y les animó a ir a la misión con un corazón abierto y listo para amar, y no ver la realidad como la ven los turistas: por medio de fotografías.</p>
<p>En el encuentro, en el Santuario de Nuestra Señora de la Guardia, el Santo Padre habló sobre las transformaciones que se producen en el interior del que acude a las misiones. «El ser misionero te lleva a aprender a mirar; a aprender a mirar con ojos nuevos, porque con la misión los ojos se renuevan; Aprender a mirar la ciudad, nuestra vida, la familia, todo lo que está a nuestro alrededor. La experiencia misionera te abre los ojos y el corazón».</p>
<p>El Papa dijo a los jóvenes que cuando decidan ir de misiones, no lo hagan como turistas. Ser verdaderos misioneros ayuda a dejar de ser «turistas de la vida para convertirnos en hombres y mujeres jóvenes que aman con compromiso la vida».</p>
<p>El Santo Padre insistió en ese concepto de «turistas de la vida» contrapuesto al misionero. «Habéis visto a estos que hacen fotos de todo cuando van de turismo, y no miran nada. Luego miran las fotografías en casa. Pero una cosa es mirar la realidad y otra mirar las fotografías, y si nuestra vida es de turista solo miraremos las fotografías o las cosas que pensamos que es la realidad. «Es una tentación para los jóvenes el ser turistas, el mirar la vida con ojos de turista, superficialmente. No toco la realidad, no miro las cosas que suceden, no miro las cosas como son. Abandonad esa actitud de turistas para volveros jóvenes con compromisos serios con la vida. Las misiones os ayudan a permanecer más atentos, más sensibles, y a mirar con atención».</p>
<p>La misión, «al enseñarte a mirar con ojos nuevos, te acerca al corazón de muchas personas, y destruye la hipocresía. Encontrar a gente adulta hipócrita es algo feo, pero encontrar a un joven que comienza la vida con una actitud de hipocresía, esto es suicida». Por otro lado, el Pontífice también invitó a reflexionar sobre los motivos de la misión: «Cuando voy a la misión no se trata solo de mi decisión, hay otro que me envía a la misión, y no se puede ser misionero sin ser enviado de Jesús». «Es el mismo Jesús el que trabaja en tú corazón, el que cambia tu mirada y te hace mirar con ojos nuevos y no con ojos de turista. Debemos vivir en misión, lo cual implica escuchar aquel que me envía, que es Jesús».</p>
<p>La misión también ayuda a profundizar en la fraternidad entre los hombres, «a mirarnos a los ojos y entender que somos hermanos. Que no hay una Iglesia y una ciudad de buenos y una Iglesia y ciudad de malos».</p>
<p>Francisco explicó que un elemento esencial de la misión es el amor al prójimo. «No podemos hacer nada sin amor. Un gesto de amor, una mirada de amor. Puedes hacer toda clase de planificaciones para ayudar, pero sin amor…».</p>
<p>«El amor es dar la vida. No hay amor más grande que el que da la vida. Jesús dio ejemplo de esto dando su vida. Si no estás dispuesto a amar, no podrás hacer una buena misión». En ese caso, «la misión pasará como una aventura, un viaje de turismo». Para evitarlo, hay que «prepararse e ir con un corazón listo para amar».</p>
<p>Ahora bien, ¿qué significa amar? Para el Papa Francisco «amar es la capacidad de estrechar una mano sucia, de mirar a los ojos a aquellos que están en situación de degrado, y decirles: ‘Para mí Tú eres Jesús’. Y este es el inicio de toda misión.</p>
<p>Siendo misionero se puede contribuir a la lucha contra la «cultura del vacío». «Venimos de una cultura del vacío, de la soledad. La gente, por dentro, está sola». Esa cultura del vacío «es la propuesta del mundo y no es compatible con la alegría. Si hay algo que destruye nuestra ciudades es ese aislamiento». «Ir a la misión es ayudar a salir del aislamiento y hacer comunidad, fraternidad, pero sin adjetivar. Si Dios ama a todos, yo también tengo que estar dispuesto a amar a todos», subrayó. «Hay muchos hermanos nuestros con la mirada y el rostro desfigurado por una sociedad que se defiende con la exclusión, aislando a la gente, ignorando. Si queremos ser misioneros y llevar el evangelio y esa alegría, nunca ignores, asiles o excluyas a nadie».</p>
<p>Francisco comparó el corazón de un misionero, de un discípulo con el corazón de un marinero. Ambos tienen las mismas características: «Horizonte y coraje». «Si no tienes horizonte y solo puedes mirar hasta donde llega tu nariz, nunca serás un buen misionero, y si no tienes coraje, nunca serás un buen misionero».</p>
<p>Por último, hizo hincapié en que, para poder realizar la misión, hay que tener «una vida espiritual sana, la cual genera jóvenes valientes que, ante algunas cosas que te propone esta ‘cultura normal’ del vacío, son capaces de preguntarse: ¿esto es normal o no es normal?». «Los jóvenes son las primeras víctimas de estos vendedores de humo que les meten tantas cosas en la cabeza. Y ante eso hay que preguntarse: ¿esto es normal o no es normal? Hay que tener coraje de buscar la verdad». Por ejemplo: «¿es normal que el Mediterráneo se haya convertido en un cementerio? ¿es normal que tantos países cierren sus puertas a estas personas que huyen del hambre de la guerra, y vienen a buscar un poco de seguridad? Haceros esa pregunta. Si no es normal, debo implicarme para que eso no suceda, y hacer eso que requiere valentía, coraje», finalizó.</p>

<p>Sociedad es un término que describe a un grupo de individuos marcados por una cultura en común, un cierto folclore y criterios compartidos que condicionan sus costumbres y estilos de vida y que se relacionan entre sí en el marco de una comunidad.</p>
<p>En toda sociedad, específicamente como la de Venezuela tan variada y cambiante, la acción de los jóvenes es fundamental. Con su alegría, dinamismo, perseverancia y entrega pueden contribuir al desarrollo y mejora de la misma; pero para que esto ocurra es importante inculcar a parte de valores, un compromiso para trabajar en pro y a favor de todos los individuos que forman parte de la sociedad, transmitiendo al mismo tiempo un mensaje de fe, amor y esperanza en Cristo Jesús.</p>
<p>La Juventud Misionera Allamaniana (JUMA), es un movimiento juvenil que forma parte de la gran familia de los Misioneros de la Consolata, su carisma es la misión Ad Gentes, la cual se podría definir como ese “Ir hacia la gente”, llegar y evangelizar a aquellos que aún no conocen de Cristo o que sean alejado de Él. Siguiendo la espiritualidad de San José Allamano.</p>
<p>El amor a Jesús Eucaristía y María Consolata son dos aspectos que están muy arraigados en los corazones de estos jóvenes misioneros, que siempre adoptando una actitud de servicio están dispuestos a salir al encuentro con el más necesitado y desde la alegría de ser jóvenes y seguidores de Jesús animar y acompañar a otros jóvenes a seguir por el camino de nuestro Salvador.</p>

<h2>Desarrollo del tema</h2>
<p>En pleno siglo XXI y en medio de grandes transformaciones tanto tecnológicas como sociales, el papel de las “nuevas” generaciones cristianas debe ser evaluado. La relativización de las cosas, el apego a lo material y la cultura del desecho son algunas características del mundo de hoy, las cuales ciertamente deben ser combatidas. Para ello se requiere de un compromiso de nuestra parte (todos, jóvenes y adultos) y una auténtica preocupación por el entorno; sin embargo, encontrar un equilibrio entre nuestra consciencia social -guiada por la fe y la vida cotidiana- no es un camino fácil. El contexto se presenta de manera especialmente desafiante para los jóvenes, a quienes les cuesta encontrar referentes y muchos viven preocupados más por ellos mismos que por su entorno. Ante esta situación, la respuesta de la Iglesia no se hace esperar y nos plantea el desafío de ser propulsores de un cambio.</p>
<p>El Papa Francisco en su última gira por Sudamérica mencionó: <strong>“Necesitamos jóvenes con esperanza y fuertes de espíritu, no jóvenes debiluchos, que ni sí ni no. No queremos jóvenes que se cansen rápido, y que estén con cara de aburridos”.</strong> Con su mensaje directo busca llegar a nuestros corazones y nos invita a ser los responsables de una mejora en nuestro país. Para ello no podemos quedarnos callados, más bien el Papa nos propone “hacer lío, pero organizarlo bien”. Un primer paso fundamental es la reflexión sobre nuestro entorno, la concientización del lugar donde vivimos y especialmente, el caer en la cuenta de los problemas que enfrentamos. Lamentablemente no son muchos los jóvenes realmente conscientes de esta situación.</p>
<p>Dada la manera como se presenta nuestra realidad, no podemos quedarnos tranquilos ante tantas cifras desalentadoras: millones de personas mueren al año porque contaminamos el ambiente, otros niños mueren en las alturas del Perú por el frío y nulas medidas de precaución (a pesar de la recurrencia); al mismo tiempo, algo más cerca, millones de personas son desplazados de sus países por motivos de violencia y muchos se vuelven refugiados.</p>
<p>Seguramente esta lista puede continuar y cada quien encontrará aquellos hechos concretos que suscitan emociones en nosotros (hagamos el ejercicio de recordarlos) y a partir de allí caer en la cuenta que negarlos o ser indiferentes ante ellos, no es una respuesta cristiana. Lo que se requiere más bien son actitudes proactivas, probablemente de enojo, pero acompañadas principalmente de propuestas que permitan la construcción de un país y una sociedad más justa.</p>
<p>En el mismo orden de ideas, en la siguiente actividad profundizaremos sobre 4 puntos importantes que engloban el tema de sociedad y la participación del joven en la misma.</p>
<p>Estos son:</p>
<ul>
<li><strong>Reconocimiento de los derechos y deberes como miembros de la sociedad</strong></li>
</ul>
<p>Cada ser humano es único porque Dios lo ha creado como una persona irrepetible, lo ha creado por amor y lo ha salvado con un amor más grande. Esto nos muestra la dignidad del ser humano, como debemos tomar en serio a cada persona y como debe ser tratado con máxima estima. Esta exigencia también es válida para los sistemas e instituciones políticas, que no solo deben respetar la libertad y dignidad de la persona humana, sino también</p>

<p>contribuir a su desarrollo integral. Una comunidad no puede excluir del desarrollo a determinado individuo o a grupos enteros.</p>
<p>Una sociedad justa debe cuidar y exigir la dignidad de la persona humana El ordenamiento social está al servicio de las personas y debe procurar lo necesario para vivir dignamente. Esto excluye todo tipo de explotación.</p>
<ul>
<li><strong>El valor y la responsabilidad con la familia.</strong></li>
</ul>
<p>La familia constituye el fundamento de la sociedad, a partir de ella surge todos los ordenamientos sociales. Debido a esta enorme importancia, la iglesia ve a la familia como una institución divina.</p>
<p>La experiencia insustituible que los seres humanos tienen en una buena familia se resume a lo siguiente: <em>yo soy amado incondicionalmente</em>. En ella viven reciprocamente diversas generaciones experimentando el afecto, solidaridad el aprecio, el esfuerzo desinteresado, la ayuda y la justicia. Cada miembro de la familia es reconocido, aceptado y respetado en su dignidad. Cada uno es amado por lo que es. Los individuos no son un medio para conseguir algo, sino un fin en sí mismos. En la familia puede experimentarse que la lógica de la entrega y aceptación es previa y más importante que la lógica del intercambio y el mercado. La familia aporta el significado de responsabilidad y solidaridad social ya que: quien en «lo pequeño» se muestra muy responsable y solidario, hará lo mismo también «en lo grande».</p>
<ul>
<li><strong>Búsqueda del bien común y la solidaridad como joven cristiano</strong></li>
</ul>
<p>El bien común, dice el Concilio Vaticano II “es el conjunto de condiciones de la vida social que hacen posible a las asociaciones y a cada uno de sus miembros el logro más pleno y más fácil de la propia perfección” (GS 26). El fin del hombre es hacer el bien y el de la sociedad es el bien común.</p>
<p>Querer el bien común significa ser capaces de pensar más allá de las propias necesidades. Debemos interesarnos por el bien de todos, también de aquellos en los que nadie piensa. Los bienes de la tierra son para todos y si cada uno solo piensa en sí mismo la vida en común se convierte en una guerra de todos contra todos.</p>
<p>La solidaridad, es tanto un principio social como una virtud moral. En cuanto principio de ordenación social sirve para vencer a las «estructuras de pecado» (Juan Pablo II, SRS 36) y crear así una civilización del amor. En cuanto a virtud moral, la solidaridad significa defender concretamente y con contundencia el bien de los demás, en particular el de los necesitados. De nada sirve aquí las meras palabras de compasión.</p>
<ul>
<li><strong>El compromiso y la responsabilidad como miembro de un movimiento juvenil.</strong></li>
</ul>
<p>No se puede ser cristiano solo para su provecho personal. Acercarse a Jesús, buscar su amistad seguirle, significa también confesarle públicamente. Hablar de él y recibir una misión de parte de él.</p>
<p>No hay nada que motive más profundamente que el amor. Quien ama puede hacer grandes obras y recorrer largas distancias. Por eso el primer paso que se da desde la fe para adquirir un compromiso social es construir una intensa relación personas con Jesús, desarrollar un amor cada vez más profundo a la iglesia y llevar una vida social comprometida. Esto anima a no olvidar a los más pequeños, por lo que tanto amor sentía Jesús, y anima también a dar testimonio de Fé, incluso en un entorno que se encuentra adverso a ella. Motiva también a llevar un estilo de vida alternativo, caracterizado por la hospitalidad, la reconciliación y la paz, y ánima incluso a dar la vida en caso necesario, si la lucha por la verdad y la justicia así lo requiere.</p>
<p>¡Actúa como Dios: ¡Se Humano! <em>Franz Kamphaus (1932), Obispo.</em></p>
<p>En ningún lugar se guarda mejor lo humano que es Dios. Quien cumple la voluntad de Dios defiende los verdaderos intereses de las personas, precisamente allí donde el ser humano es débil, necesita ayuda y aparentemente es inútil.</p>
<p>“Queridos jóvenes, no vinimos a este mundo a vegetar, a pasarla cómodamente, a hacer de la vida un sofá que nos adormezca: al contrario, hemos venido a otra cosa, a dejar una huella. Es muy triste pasar por la vida sin dejar una huella. Pero cuando optamos por la comodidad, por confundir felicidad con consumir, entonces el precio que pagamos es muy, pero muy caro; perdemos la libertad. No somos libres de dejar una huella.” <em>(Papa Francisco, JMJ 2016)</em></p>

<h3>Actividad</h3>
<p>Dividir a los participantes en 4 grupos y hacer entrega de algunas parábolas, las cuales deberán compartir y reflexionar. Para luego, responder a una serie de preguntas que se encuentran al final de las mismas.</p>

<h3>Parábolas</h3>
<h4>1. La fábula de los animales</h4>
<p>Asustados por la creciente violencia, los animales decidieron convocar a una asamblea para encontrar una solución al problema que a todos angustiaba.</p>
<p>A la hora acordada, en un inmenso claro del bosque, se reunieron todos: grandes y pequeños, cuadrúpedos, aves, reptiles. Unos más resaltantes, otros más humildes, sin embargo, todos estaban decididos a intentar lograr una solución beneficiosa para ellos. Como era de esperarse, la reunión estuvo totalmente desorganizada. Cada quien quería exponer sus apreciaciones, pero ninguno quería escuchar a los demás. Realmente fue una conversación entre sordos, tal como sucede hoy en muchos sitios.</p>
<p>Finalmente, el panorama quedó más o menos de este modo: El león propuso que todos los animales renunciaran al veneno, porque tenía miedo de la serpiente; a su vez, la serpiente sugirió que el desarme consistiría en la eliminación de garras y picos; el burro quería que el toro dejada de utilizar sus cuernos; la gallina se sublevó contra el hocico de la zorra; la cucaracha no tenía inconveniente alguno con que el caimán continuara con su boca llena de dientes, pero estaba en contra del pico de la gallina… En medio de la falta de entendimiento general, el oso hormiguero sugirió la extinción de las armas y la adopción del abrazo universal.</p>
<p class="lead-in"><u>Preguntas:</u></p>
<ul>
<li>¿Conocen sus derechos y deberes con la sociedad?</li>
<li>¿Por dónde debemos comenzar el cambio del mundo?</li>
</ul>

<ul>
<li>¿Existe el dialogo en su movimiento juvenil?</li>
</ul>
<h3>Reflexión del facilitador</h3>
<p>La fábula de los animales se repite en la vida de las personas. Las naciones se reúnen para el desarme cuando en realidad solo quieren las armas de los demás. En las familias cada quien se fija en los errores de los otros. Por un lado, los padres se quejan de los hijos porque gastan en exceso, no los comprenden ni respetan; por su lado, los hijos protestan porque sus padres nunca están en casa. En todas partes sucede lo mismo. Todos están recelosos de sus derechos, pero olvidan sus deberes. Quieren ser libres, pero ninguno sabe respetar la libertad del otro. La gente quiere cambiar al mundo, sin embargo, se olvidan de empezar en su propio corazón. Vivir en sociedad implica fundamentalmente respeto y tolerancia hacia los demás.</p>
<p>A diario podemos observar que muchos jóvenes se quejan todo el día sobre las cosas que los políticos hacen mal, sobre lo que no ha hecho el gobierno, de cómo las promesas electorales nunca son cumplidas, de las injusticias sociales y el poco involucramiento del mundo en ello. Lo primero que debemos tener claro es que los jóvenes no somos el futuro, somos el presente. Los cambios en la sociedad nos corresponden a todos. ¿Tienen alguna causa por la cual luchar? ¿Tienen algún proyecto para ayudar a los demás? Comiencen a trabajar por las cosas que desean y den testimonio de esperanza a los demás.</p>

<h3>2. El jabón</h3>
<p>Un niño pobre, de aproximadamente 12 años vestido y calzado humildemente, entra a una tienda toma un jabón corriente y le pide al dueño que lo envuelva para regalo.</p>
<p>«Es para mí mamá», dijo orgulloso.</p>
<p>El dueño de la tienda quedó conmovido ante la sencillez de aquel regalo. Miró con compasión a su cliente y sintiendo una gran lástima tuvo la bondad de prestarle ayuda. Pensó que podía envolver, junto con el jabón, algún otro artículo más representativo. Sin embargo, estaba indeciso: miraba al pequeño y miraba los productos que tenía en su tienda.</p>
<p>El niño, percibiendo la indecisión del hombre pensó que dudaba de su capacidad de pago. Introdujo la mano en el bolcillo sacó las monedas que tenía y él dejó sobre el mostrador. El vendedor quedó todavía más conmovido al ver que las monedas valían tan poco.</p>
<p>Personalmente consideraba que, si el niño pudiese compraría algo mucho mejor para su mamá.</p>
<p>Del otro lado del mostrador, el pequeño comenzó a ponerse nervioso. Algo parecía no estar bien. ¿Por qué no envolvía el jabón? ¿Cuál es el problema?</p>
<p>Impaciente, le preguntó: «¿Señor, falta algo?».</p>
<p>«No —respondió el dueño de la tienda—, solo que de pronto recordé a mi madre. Murió cuando era muy joven. Siempre quise darle un presente, pero desempleado, nunca logré darle nada».</p>
<p>Con la espontaneidad de sus 12 años, el niño le preguntó: «¿Ni siquiera un jabón?» El hombre dejó de hablar. Reflexionó un poco y desistió de la idea de mejorar el regalo.</p>
<p>Envolvió el jabón con el mejor papel de regalo que tenía en la tienda, le colocó una cinta y despachó al cliente, sin decir nada más.</p>
<p class="lead-in"><u>Preguntas:</u></p>
<ul>
<li>¿Valoran los pequeños gestos que les ofrecen los demás? (amor, caricias, consejos, tiempo).</li>
<li>¿Depositan amor en los detalles que ofrecen a sus familiares y amigos?</li>
<li>Como miembros de una familia ¿Consideran que tienen alguna responsabilidad? Da un ejemplo.</li>
</ul>
<h3>Reflexión del facilitador</h3>
<p>Los jóvenes, hoy en día estamos sumergidos en un mundo material, donde el foco de atención es: el dinero, la moda, tecnología, tendencias, redes sociales etc. Lo que muchas veces, nos invitan a ser personas superficiales, incapaces de ofrecer algo más sencillo y significativo que lo material.</p>
<p>Es por esto, que dejamos a un lado a las personas que forman parte de nuestro entorno. Y no estamos dando el suficiente valor que se merecen. No esperemos que sea demasiado tarde, nuestra familia y amigos también forman parte de nuestra sociedad y uno de nuestros principales objetivos debe ser fortalecer los lazos fraternos entre las personas que amamos o consideramos importantes en nuestras vidas.</p>

<h3>3. La cruz y el puente</h3>
<p>Érase una vez un rey muy justo y bondadoso que hacía todo por sus súbditos. Una vez prometió que llevaría a todos los que así lo merecieran hacia una maravillosa tierra, donde vivirían con abundancia y seguridad, pero para merecer tal lugar, cada habitante debería cargar una cruz hasta la tierra prometida. Esto significaba una caminata de varios días.</p>
<p>Todas las cruces tenían el mismo tamaño, lo que ocasionó una protesta por parte de los más débiles, uno de ellos se reveló y decidió hacer unos arreglos. Tomó la cruz y, en medio de la caminata, decidió cortarla para hacerla más pequeña. Inmediatamente, el grupo se encontró con una situación que detuvo la continuación de la caminata. Había un río con los bordes muy altos, escarpados y rocosos, que impedían que todos pasaran.</p>
<p>En ese momento uno de los caminantes tuvo la idea de utilizar la Cruz como puente para atravesar el río. De este modo, descubrieron que el tamaño de la cruz era exactamente de la misma distancia que había entre los bordes. Todos lograron atravesar el río y continuaron con su caminata; excepto uno: aquel que hizo un arreglito a la cruz para que quedara más pequeña fue llevado por la corriente.</p>
<p class="lead-in"><u>Preguntas:</u></p>
<ul>
<li>¿De qué manera asumen la cruz de la familia, los estudios, el trabajo?</li>
<li>¿Acostumbran a quejarse de sus deberes?</li>
<li>¿Alguna vez por hacer un arreglito, han perdido su puente?</li>
</ul>

<h3>Reflexión del facilitador</h3>
<p>Como miembro de un movimiento juvenil y este caminar misionero esta parábola puede tomar significado desde los diferentes apostolados, bien sea con niños, jóvenes o adultos. Así como también, en las tareas que les son asignadas. Ej: Limpiar un algún espacio, Animar en una actividad, dirigir una oración etc... Esto podría traer quejas de «¿Por qué a mí? ¿Otra vez yo? o queremos desplazar esa tarea hacia otra persona. Y no nos damos cuenta de que eso es lo que quiere Dios para nosotros y la recompensa es mucho mejor de lo que podríamos imaginar. La mejor forma de llevar una vida exitosa es enfrentar tanto las crisis como las oportunidades. Los obstáculos del camino son puentes para el éxito. Mucho cuidado con esos arreglitos porque de lo contrario podrían perder su puente.</p>

<h3>4. El niño y la anciana</h3>
<p>Había un niño que quería encontrarse con Dios. Él sabía que tenía un largo camino por delante. Entonces llenó un morral con pasteles y jugo e inicio su camino. Después de tres cuadras, encontró a una anciana sentada en un banco de la plaza mirando los pájaros. El niño se sentó cerca de ella, abrió el morral, saco el jugo y bebió un trago. Al mirar a la anciana se dio cuenta de que tenía hambre y le ofreció un pastel. Muy agradecida acepto y le sonrió al niño. Su sonrisa era tan increíble que quiso volver a verla y entonces le dio jugo. La anciana sonrió una vez más y el niño se puso muy contento.</p>
<p>Se quedaron allí sentados, sonriendo, comiendo pastel y tomando jugo toda la tarde, sin hablar. Cuando empezó a oscurecer, el niño estaba cansado y decidió regresar a casa. Sin embargo, antes de irse le dio un abrazo a la anciana quien le sonrió como nadie lo había hecho antes.</p>
<p>Así el niño entró a la casa y su mamá, sorprendida por la felicidad reflejada en su rostro, le pregunto: ¿Qué hiciste hoy que estas tan alegre? El respondió: «Pase la tarde con Dios». Y añadió: «¿Sabes? ¡Tiene la sonrisa más linda que he visto!». Al mismo tiempo, la anciana llego a su casa radiante y su hijo le pregunto: ‘¿dónde estabas? ¿Y qué te dejo tan feliz?’ ella le respondió: ‘comí pasteles y bebí jugo en el parque con Dios’. Antes que su hijo pudiese decir algo, le dijo: ‘¿Sabes qué él es muy distinto de aquel hombre mayor de barbas blancas que siempre imagine?’.</p>
<p class="lead-in"><strong>Preguntas:</strong></p>
<ul>
<li>¿Acostumbran a dar limosna con buen corazón o para librarse del mendigo?</li>
<li>¿Consideran que ayudar al necesitado sea una responsabilidad y un compromiso como joven cristiano?</li>
<li>Actualmente ¿En dónde vez reflejado el rostro de Dios?</li>
</ul>
<h3>Reflexión del facilitador</h3>
<p>Muchas veces siendo jóvenes, creemos que Dios está en un templo, en el cielo o simplemente encerrado en el sagrario. Sin darnos cuenta que día a día en las distintas actividades que realizamos podemos contemplarle en nuestro entorno. Es decir, en la naturaleza, en el aire que respiramos, en el compañero de clase, en nuestros amigos en la señora que pide en la plaza y hasta en los rincones más ocultos. Trabajemos en reconocerle en cada una de ellas, en la alegría, tristeza y en las dificultades de otros. Solo así podremos descubrir el llamado que Dios nos hace a Servir.</p>

<p>Finalmente, tomando en cuenta los compromisos y en el mismo sentido de recogimiento y silencio culminar con la oración, la cual invite a los participantes a dar gracias por el encuentro y espontáneamente realizar alguna petición. Realizar como hermanos la oración del Padre Nuestro, saludar a María y cerrar con un canto de alegría y esperanza.</p>

<h1 data-kicker="3er año · África (Verde) · Pastoral">Documentos de la Iglesia sobre la misión</h1>

<h2>Oración</h2>
<p>Invocación al Espíritu Santo, pidiendo que derrame su Don de sabiduría y así comprender y hacer propios las propuestas presentadas en cada documento de la iglesia con respecto a la misión; colocar el audio o cantar la canción del «Profeta».</p>

<h2>Dinámica: el camión se accidenta</h2>
<p>En primer lugar se solicita que todos los participantes deben ponerse de pie.</p>
<p>El facilitador cuenta una historia, adaptada al medio y lugar. Por ejemplo, se dice: todos nosotros estamos viajando en un camión a Caracas, salimos del barrio y en el camino se rompen los frenos del camión y para no morir todos tenemos que agruparnos en grupos de cuatro personas. Por lo tanto cada grupo debe estar conformado por cuatro personas, si en el grupo hay menos o más personas, el facilitador los declara eliminados.</p>
<p>Se repite la historia, esta vez cambiando la causa del accidente y también el número de personas que deben formar cada grupo. Por ejemplo: continuamos viajando, cuando de pronto una enorme piedra aparece en el camino y para que el camión no se vuelque tenemos que agruparnos de 2 personas. Como en toda dinámica de animación, las órdenes deben darse rápidamente para hacerla ágil, sorpresiva y humorística.</p>

<h2>Tema</h2>
<p>El facilitador iniciará con una breve explicación sobre el origen de los documentos de nuestra Iglesia que nos hablan sobre la Misión, posteriormente hará la dinámica del <strong>El camión se accidenta</strong> para distribuir a los participantes en 4 grupos de trabajo, a quienes se les entregará la información un documento específico, en base al cual cada grupo luego de leer debe analizar y a través de un esquema presentar el objetivo del documento y evaluar si este es conocido y aplicado en su parroquia, al mismo tiempo les hará entrega de un sobre sellado y les indicará que solo podrán abrir lo cuando se les indique.</p>
<p class="cita-der"><em>Ad Gentes, Evangelii Nuntiandi, Redemptoris Missio y Diálogo y Proclamación</em></p>
<p>Para tener un cuadro más completo de la enseñanza contemporánea de la iglesia sobre la misión es necesario partir del Decreto sobre la actividad misionera del Vaticano II, Ad Gentes, e incluir también el documento Diálogo y Proclamación (DP), publicado por la Congregación para la Evangelización de los Pueblos y el Consejo Pontificio para el Diálogo poco después de la RM. Este último documento, publicado en 1991, ya ha cumplido 18 años. Desde entonces, el Magisterio romano ha publicado otros dos documentos importantes para la misión de la iglesia: Dominus Iesus en 2000 y Notas doctrinales sobre algunos aspectos de la evangelización en 2007, ambos de la Congregación para la Doctrina de la Fe. Se trata, sin embargo, de documentos que revisten un carácter más bien admonitorio y, en cuanto tales, no representan una enseñanza nueva o constructiva</p>

<h3>Ad Gentes (1965)</h3>
<p>Es, sin duda, un documento de gran trascendencia.</p>
<p>El primer aspecto de la enseñanza de Ad Gentes que ha destacar se encuentra en el párrafo 2, que se refiere al fundamento último de la actividad misionera de la iglesia: su participación en la misión del Hijo y del Espíritu Santo. La participación por el bautismo en la vida misma de la Trinidad hace que la iglesia sea «misionera por su propia naturaleza». El texto completo reza así: «La Iglesia peregrinante es, por su naturaleza, misionera, puesto que toma su origen de la misión del Hijo y de la misión del Espíritu Santo, según el propósito de Dios Padre». Se trata de una declaración radical bajo muchos aspectos. En primer lugar, destaca el hecho de que la misión no es sólo una de las cosas que la iglesia hace, sino que es constitutiva de su propio ser. En otras palabras, ser cristiano significa ser absorbido por la vida misma de Dios, que consiste en salir de sí y proyectarse con una presencia salvadora en el mundo. Toda la iglesia es misionera. La misión no es algo que hacen algunos especialistas, los misioneros en este caso, sino algo a lo que están llamados todos los cristianos. Esta teología, redactada en su última versión por Congar y enérgicamente defendida por la comisión de redacción, descarta la idea de la misión como una actividad atribuida exclusivamente a la Congregación romana de la Propagación de la Fe y la coloca, en cambio, en simbiosis con la vida diaria de la iglesia como tal, y en ese sentido, bajo la responsabilidad de cada obispo local (algo sobre lo que el Decreto vuelve una y otra vez), la misión no es algo que se realiza sólo por mandato,</p>

<p>ni siquiera el “gran mandato” de Mt 28, 19-20. En su identidad más profunda, la misión es un privilegio y una gracia. En esto, el decreto no siempre es coherente, pero es la conclusión lógica que se desprende de la esencial identidad misionera de la iglesia. O sea que la misión ya no se define como un concepto territorial, sino como una actitud básica de la iglesia dondequiera que se encuentre. Cruzar fronteras, trascender los propios confines, es un elemento central de la identidad de la iglesia. Aunque la pastoral es un elemento central en la vida de la iglesia, no debe eclipsar la proyección de la iglesia hacia el mundo, en el que se presenta con una diferencia cualitativa neta. De ahí que la misión no sea una cuestión de ir de aquí para allá visitando lugares, sino un servicio a las personas, de cerca y de lejos, del propio país o de ultramar, de la propia cultura o de otras culturas. Aunque tampoco en esto el documento se manifiesta totalmente coherente, ya que en diversas partes alude a las “iglesias más jóvenes” o a las “iglesias de misión” dando a entender que las “misiones” están en los “países de misión”, lo importante es que las semillas ya estaban sembradas.</p>

<h4>Hacia la inculturación</h4>
<p>Ad Gentes no usa la palabra “inculturación”, que recién empieza a aparecer en la bibliografía teológica y misionológica en los años setenta, y aparece por primera vez en un documento magisterial romano en la exhortación apostólica Catechesi Tradendi de Juan Pablo II en 1979. Ello, no obstante, el documento contiene pasajes que hacen entrever los debates sobre la inculturación que se producirían en el decenio sucesivo. La expresión más contundente de la necesidad de apreciar la cultura y emplearla en la evangelización aparece quizás en el párrafo 11:</p>
<blockquote class="cita-l"><em>Para que los mismos fieles puedan dar fructuosamente este testimonio de Cristo, reúnanse con aquellos hombres por el aprecio y la caridad, reconózcanse como miembros del grupo humano en que viven, y tomen parte en la vida cultural y social por las diversas relaciones y negocios de la vida humana, estén familiarizados con sus tradiciones nacionales y religiosas, descubran con gozo y respeto las semillas de la Palabra que en ellas laten; pero atiendan, al propio tiempo, a la profunda transformación que se realiza entre las gentes y trabajen para que los hombres de nuestro tiempo, demasiado entregados a la ciencia y a la tecnología del mundo moderno, no se alejen de las cosas divinas, más todavía, para que despierten a un deseo más vehemente de la verdad y de la caridad revelada por Dios. Como el mismo Cristo escudriñó el corazón de los hombres y los ha conducido con un coloquio verdaderamente humano a la luz divina, así sus discípulos, inundados profundamente por el espíritu de Cristo, deben conocer a los hombres entre los que viven, y tratar con ellos, para advertir en diálogo sincero y paciente las riquezas que Dios generoso ha distribuido a las gentes, y, al mismo tiempo, esfuércense en examinar sus riquezas con la luz evangélica, liberarlas y reducirlas al dominio de Dios Salvador</em></blockquote>
<p>En el párrafo 22 encontramos otro pasaje semejante en el que se anticipa el tema de la inculturación. El pasaje está en el capítulo III del Decreto sobre “Las iglesias particulares”. Este capítulo contiene otra enseñanza de gran importancia de AG, que consiste en que más allá de que una iglesia sea “joven” o frágil, es siempre una iglesia en el verdadero sentido de la palabra, y debe ser tratada como tal. En concreto, el párrafo se refiere a la importancia de elaborar en cada iglesia particular una filosofía y, especialmente, una teología que, al mismo tiempo que se conecta con la tradición cristiana más amplia, recibe “de las costumbres y tradiciones, de la sabiduría y doctrina, de las artes e instituciones de los pueblos todo lo que puede servir para expresar la gloria del Creador, para explicar la gracia del Salvador y ordenar debidamente la vida cristiana”. Sometiendo la revelación de Dios a “nueva investigación” se puede elaborar una nueva comprensión del cristianismo que se acomode a cualquier cultura o contexto. “Así aparecerá más claramente por qué caminos puede llegar la fe a la inteligencia, teniendo en cuenta la filosofía y la sabiduría de los pueblos, y de qué forma pueden compaginarse las costumbres, el sentido de la vida y el orden social con las costumbres manifestadas por la divina revelación”.</p>

<h4>Cualidades de los misioneros</h4>
<p>El capítulo IV, titulado simplemente “Los misioneros”, es considerado por muchos comentaristas como el mejor capítulo del Decreto. En él se afirma con claridad que la del misionero es una vocación, un llamado particular que Dios hace a personas dotadas de “un carácter natural conveniente” e “idóneas por sus buenas dotes e ingenio”. Además de la idoneidad necesaria, se establece el tipo de capacitación y formación que los misioneros necesitan. La lista de las cualidades y aptitudes que han de adquirir es larga. Han de ser personas perseverantes, generosas y valientes, dispuestas incluso a dar la vida por la fe, si fuera necesario. Dotadas de capacidad de adaptación, espíritu de oración, y conocimiento de la historia de los pueblos a los que son enviadas, así como de los problemas actuales que caracterizan su situación particular. No han de escatimar esfuerzos para aprender el idioma o los idiomas locales. Han de estar preparadas tanto en teología como en misionología. Una recomendación significativa es la de completar la formación en las tierras a las que serán enviados, no sólo en el caso de los misioneros extranjeros sino también de los locales, porque el simple hecho de ser local no habilita para trabajar eficazmente en el lugar. Por supuesto que todo esto es un cuadro muy teórico, y hasta se podría decir romántico, de la vida misionera. Pero en realidad son criterios con los cuales deberían confrontarse las congregaciones y los organismos. Es sabido que en el pasado ha habido casos lamentables de mujeres y hombres colocados en situaciones transculturales sin la más mínima preparación, ni siquiera en materia de idioma. Estos casos eran más frecuentes antes del Concilio, y a ellos se refiere el Decreto.</p>

<h3>Evangelii Nuntiandi (1975)</h3>
<p>La evangelización, una realidad multifacética Una de las enseñanzas más importantes de la exhortación apostólica es la ampliación, por parte de la iglesia, del concepto de misión, que comprende una variedad de actividades, además de la proclamación directa del evangelio, las acciones encaminadas a suscitar la conversión, y la implantación de la iglesia. Ya AG insinuaba esta riqueza de significado de la misión, pero la EN va más allá todavía. En el pasado existía la tendencia a reducir la evangelización a la proclamación directa de Cristo a los que todavía no lo conocían. Pero, dice el papa, “ninguna definición parcial y fragmentaria refleja la realidad rica, compleja y dinámica que comporta la evangelización, si no es con el riesgo de empobrecerla e incluso mutilarla. Resulta imposible comprenderla si no se tienen en cuenta simultáneamente todos sus elementos esenciales”.</p>
<p>El papa insiste a continuación en que, si bien la predicación de Cristo es importante (sin ella no hay evangelización, EN 22), existen también otros “elementos esenciales”. En primer lugar, el testimonio de una comunidad cristiana vibrante, sin la cual la iglesia no goza de credibilidad. En un pasaje famoso</p>

<p>el papa cita una alocución que hacía poco había dirigido a un grupo de laicos, a quienes indicaba que “el hombre contemporáneo escucha más a gusto a los que dan testimonio que a los que enseñan, o si escuchan a los que enseñan, es porque dan testimonio” (véase EN 41). En segundo término, el papa subraya la importancia de la evangelización de las culturas, “no de una manera decorativa, como un barniz superficial, sino de manera vital, en profundidad y hasta sus mismas raíces” (EN 20).</p>

<h4>Evangelización y liberación</h4>
<p>La enseñanza de la EN sobre liberación y evangelización es muy equilibrada e insiste en dos cosas. En primer lugar, la evangelización no ha reducirse al bienestar político o económico. En efecto, la dimensión espiritual del evangelio es la fuente de la liberación más profunda de la humanidad. Segundo, la iglesia no puede aceptar la violencia, porque sabe que la “violencia engendra inexorablemente nuevas formas de opresión y de esclavitud, a veces más graves que aquéllas de las que se pretende liberar” (EN 37). Se podría decir mucho más acerca de esta “carta magna” de los documentos de misión, pero los tres puntos señalados pueden bastar. El programa de la EN continua y se amplía en el documento que conmemora el 25° aniversario de AG y su propio 15° aniversario, la monumental encíclica Redemptoris Missio de Juan Pablo II (1990).</p>

<h3>Redemptoris Missio (1990)</h3>
<p>Es el documento del magisterio romano que más se ha acercado a la elaboración de una reflexión completa y sistemática sobre la misión, y si bien no es tan inspiradora como la EN, representa un gran adelanto en la enseñanza oficial de la iglesia sobre lo que se ha dado en llamar su “misión evangelizadora”. Me centraré en tres aspectos importantes de la enseñanza de la RM: su enfoque cristocéntrico, su comprensión más amplia de la misión, y la inclusión del diálogo interreligioso como constitutivo de la misión de la iglesia.</p>
<h4>Enfoque cristocéntrico</h4>
<p>La insistencia del papa en la centralidad de Cristo se manifiesta en todas las secciones de la RM, y constituye sin lugar a dudas el tema teológico más importante de la encíclica. En el capítulo I se trata directamente de esta enseñanza, y se hace hincapié en que la fe explícita en Cristo es lo que da la plenitud de vida a hombres y mujeres. Toda persona tiene derecho a la verdad y a la vida que el evangelio ofrece, pero el evangelio es siempre una propuesta, nunca una imposición (RM 7-8). En el capítulo II se reflexiona sobre la centralidad del Reino de Dios en el ministerio de Jesús, y se dice claramente que la iglesia no es un fin en sí misma (tal vez la afirmación más clara en este sentido que un documento magisterial haya formulado hasta el momento (véase RM 18), pero ello no significa que el Reino de Dios esté separado de Jesús o de la iglesia. En efecto, como el papa insiste, el Reino de Dios no es un concepto, una doctrina o un programa; es una persona, la persona de Jesús de Nazaret (ibíd.). El capítulo III está dedicado al Espíritu Santo, y a la vez que lo considera “protagonista de la evangelización” (véase el título del capítulo), el papa insiste en que el Espíritu es el Espíritu de Jesús, y no una forma vaga y genérica de la presencia de Dios (véase RM 29). En cada uno de estos tres capítulos se contrasta todo tipo de generalización o adulteración de la especificidad de Cristo: la misión consiste en proclamar la persona y la obra de Cristo, y no en ayudar a las personas a que reconozcan una presencia misteriosa de Dios como Logos, o los “valores del Reino”, o una presencia generalizada del Espíritu. “¿Por qué la misión?” pregunta el papa. “Porque a nosotros, como a san Pablo, ‘se nos ha concedido la gracia de anunciar a los gentiles las inescrutables riquezas de Cristo’ (Ef 3, 8) . . . .” (RM 11)</p>

<h4>Ampliación del concepto de misión</h4>
<p>En dos partes de la encíclica Juan Pablo amplía el concepto de misión. La primera, cuando distingue tres “situaciones” de la actividad misionera de la iglesia. La segunda, cuando se refiere a la misión como a una “realidad unitaria, pero compleja” compuesta de diversos elementos.</p>
<p>La primera “situación” de la actividad misionera de la iglesia es la de la misión ad gentes, o sea el testimonio directo y la proclamación de Cristo en situaciones en las que no se lo conoce, o donde faltan comunidades cristianas suficientemente maduras como para poder encarnar la fe en el propio ambiente y anunciarla a otros grupos (RM 33). Esta es propiamente la misión ad gentes. Pero el papa habla también de la actividad pastoral realizada en las iglesias establecidas, y de lo que había estado llamando la “nueva evangelización” en las iglesias “donde grupos enteros de bautizados han perdido el sentido vivo de la fe o incluso no se reconocen ya como miembros de la iglesia, llevando una existencia alejada de Cristo y de su evangelio” (ibíd.). Éstas últimas son las iglesias en las que el evangelio se ha anunciado desde hace mucho tiempo, como las de Europa o de América del Norte y del Sur, o incluso las iglesias que han recibido el evangelio hace poco, como las de las zonas urbanas de África o de Asia.</p>

<h4>Diálogo interreligioso</h4>
<p>El papa insiste en que el diálogo con otras creencias es perfectamente coherente con la obligación de la iglesia de proclamar a Cristo en todos los pueblos como salvador universal. Aunque el objetivo del diálogo es descubrir en otras religiones el destello de aquella verdad que ilumina a todos los hombres (véase Nostra Aetate 2), cada interlocutor ha de estar plenamente convencido de su fe. Aunque los cristianos están llamados a dialogar, siempre han de tener presente el carácter único de Cristo y que “la iglesia es el camino ordinario de la salvación y que sólo ella posee la plenitud de los medios de salvación” (Ibíd.).</p>
<p>No obstante, dice el papa, el diálogo no es una especie de táctica, destinada en última instancia a la conversión (RM 56). Nace del respeto por las otras religiones, y se practica con el deseo sincero de conocer otros caminos religiosos y aprender de ellos. Incluso cuando el diálogo es difícil, por ejemplo, en algunas zonas musulmanas, los cristianos deberían estar abiertos a pesar de las dificultades y de los riesgos (RM 57). Por último, el diálogo no es algo exclusivo de expertos o representantes oficiales de otras religiones. El papa señala que es una tarea de todo cristiano, y exhorta especialmente a los laicos a participar en él (ibíd.).</p>
<p class="lead-in"><em>El facilitador podrá concluir al terminar la ponencia de cada grupo:</em></p>
<ul>
<li>Ad gentes: La Iglesia es "misionera por su propia naturaleza." No se trata de un concepto territorial, sino de una actitud básica de cruzar fronteras y desplazarse más allá de sí misma.</li>
<li>Evangelii nuntiandi: Misión (evangelización) es nuestra "identidad más profunda." La Iglesia debe evangelizarse a sí para que pueda continuar la misión de Jesús y todos en la Iglesia deben ser sujetos de participación.</li>
</ul>

<ul>
<li>Redemptoris Missio: La Misión "abarca toda la vida de la Iglesia." Cristo debe ser el eje de nuestra proclamación y de nuestro testimonio al involucrarnos en el diálogo interreligioso.</li>
</ul>
<p>Al reflexionar sobre la Iglesia en nuestro país, ¿dónde ha abrazado ella estas ideas y cómo se deja cuestionar por las mismas? ¿La Iglesia que tú conoces es una misión, o tiene una misión? ¿Cómo esto te desafía personalmente?</p>

<h2>Dinámica: mi vida en un dibujo</h2>
<p>Organizar al grupo en parejas, a cada pareja se le dará una hoja y una pluma de manera individual.</p>
<p>Se pedirá que dividan la hoja en tres columnas; la primera columna se titulara “pasado”, la siguiente “presente” y la última “futuro”.</p>
<p>Explicar que en cada columna tendrán que dibujar algo sobre su pasado, su presente y lo que les gustaría lograr o hacer en el futuro. Cada pareja de manera individual realizará este dibujo.</p>
<p>Después de un tiempo considerable, dar la indicación que cada una de las parejas debe compartir con su compañero qué fue lo que dibujaron. Luego, esa pareja deberá buscar otra pareja para que entre ellos comenten sus dibujos, finalmente ese cuarteto irá en busca de otro para compartir sus dibujos de manera que al final 8 personas se habrán juntado para compartir algunas vivencias y sueños personales por media de esta dinámica.</p>
<p>Para cerrar, se puede juntar a todo el grupo y preguntar: ¿Cómo se sintieron con la dinámica? ¿Hubo cosas en común entre ustedes? ¿Qué aspectos les llamaron la atención de sus compañeros? ¿Sintieron la confianza para contar un poco de ustedes a otros?</p>

<h2>Tema: ponencia</h2>
<h3>¿Qué es Pastoral Juvenil?</h3>
<p>Es la acción organizada de la Iglesia para acompañar a los jóvenes a descubrir, seguir y comprometerse con Jesucristo y su mensaje para que, transformados en hombres nuevos, e integrando su fe y su vida, se conviertan en protagonistas de la constricción de la Civilización del Amor.</p>
<h3>¿Qué es la Civilización del Amor?</h3>
<p>Es “aquel conjunto de condiciones morales, civiles y económicas que permiten a la vida humana una condición mejor de existencia, una racional plenitud, un feliz destino eterno”: dignidad, liberación y pleno desarrollo de toda persona y de toda la persona, nueva cultura de la vida y de la solidaridad, verdad, justicia y libertad planificada por el amor.</p>
<h3>¿Qué son los programas Nacionales?</h3>
<p>Son servicios del Departamento de Pastoral de Adolescencia y Juventud, de formación, organización, animación y acompañamiento a los jóvenes en áreas específicas de la acción pastoral, animados por equipos de jóvenes militantes.</p>

<h3>¿Qué es el servicio de Jovenmisión?</h3>
<p>Es un servicio de animación y cooperación misionera conformado por jóvenes para la evangelización de los jóvenes. Tiene como finalidad de ofrecer a los jóvenes un itinerario de espiritualidad, formación y acciones misioneras que le permita crecer en la conciencia de su corresponsabilidad en la misión evangelizadora de la iglesia, poniendo a su disposición experiencias y herramientas necesarias que los impulsen y capaciten para ejercer su vocación misionera en sus ambientes y en las situaciones ad gentes, ad intra, ad extra.</p>

<h3>¿Qué es la Red de Movimientos Juveniles?</h3>
<p><em>Es el espacio de vinculación e integración entre los Movimientos Juveniles con la acción organizada de la Pastoral Juvenil de Venezuela, así como fortalecer la comunión entre los Movimientos donde puedan compartir sus diferentes experiencias de oración y apostolado.</em></p>

<h3>¿Qué es una Instancia?</h3>
<p>Se entiende como cada uno de los grados o niveles de acción en los que se puede organizar la Pastoral Juvenil, se constituyen como instancias de decisión al momento de establecer de manera organizada los equipos respectivos. Ejemplos: Nacional, Provincial, Arqui/Diócesana/Vicarial.</p>

<h3>Instancia Parroquial</h3>
<p><strong>¿Qué es el grupo o comunidad juvenil?</strong></p>
<p>Es la experiencia central de la propuesta evangelizadora de la Pastoral Juvenil. Favorecen la animación, formación, coordinación y acompañamiento entre los jóvenes, a través de procesos que generan en ellos educación en su fe y vida; debe estar conformado por adolescentes y jóvenes de ambos sexos, con un nivel de participación estable y ritmo periódico de reuniones debidamente planificadas, con una estructura interna mínima de organización para su desarrollo y crecimiento.</p>
<p><strong>Entre sus tareas podemos encontrar:</strong></p>
<ul>
<li>Promover la vida grupal.</li>
<li>Promover y participar en actividades de interés social y comunitario.</li>
<li>Fomentar espacios que permitan la integración de los jóvenes a la comunidad parroquial resaltando el sentido de pertenencia y comunión eclesial.</li>
</ul>
<p><strong>¿Qué es la instancia parroquial en Pastoral Juvenil?</strong></p>
<p>La Parroquia es la comunidad de comunidades que viven en un determinado territorio. Atenta a las diversas experiencias de juventud que surgen en su interior, se convierte en centro de coordinación y de animación de comunidades, grupos y <em><strong>movimientos juveniles.</strong></em> La organización parroquial supone la participación de todos los jóvenes, los grupos y una coordinación estable y dinámica, que se expresan en la Asamblea Parroquial y en Equipo Parroquial de Pastoral Juvenil (EPPJ).</p>
<p>En sus principales tareas tenemos:</p>
<ul>
<li>Animar el proceso de educación en la fe, de los jóvenes integrantes del grupo.</li>
<li>Concretar las líneas y proyectos determinados por la Asamblea Parroquial de Pastoral Juvenil.</li>
<li>Sensibilizar a la Comunidad Parroquial sobre la realidad juvenil, favorecer la toma de conciencia y la realización práctica y efectiva de la opción preferencial por los jóvenes.</li>
</ul>
<p>El Coordinador Parroquial de Pastoral Juvenil, en comunión con el Equipo y con el Asesor, es el responsable de la articulación de las experiencias juveniles de la Parroquia. Anima al equipo a asumir las tareas que les corresponden, <em>busca garantizar que se realicen los procesos y facilita la utilización de los servicios que se ofrecen desde las Instancias Zonales, diocesanas y nacionales.</em></p>
<p>El Asesor es un laico(a) / religioso (a) o sacerdote cercano a la realidad juvenil y eclesial, una persona adulta en la fe que haya vivido de cerca el caminar por las diferentes instancias de la Pastoral Juvenil, siendo así el enlace entre el mundo juvenil y el mundo adulto de la Parroquia y se convierte en un apoyo fundamental para la animación y coordinación de la Pastoral Juvenil.</p>

<h3>Instancia Zonal / Arciprestal / Vicaría / Decanato en Pastoral Juvenil</h3>
<p>Es la articulación de las parroquias pertenecientes a Arqui/Diócesis/Vicariato que son territorialmente muy extensas, muy pobladas o tienen realidades sociales y pastorales muy diferentes, para lograr una mejor animación y una mayor eficacia en el trabajo pastoral, A través del Coordinador Zonal en comunión con los coordinadores de Grupos y Movimientos Parroquiales que integran el Equipo Zonal.</p>

<h3>Instancia Arqui/Diocesana o Vicariato Apostólico</h3>
<p>Es aquella que desarrolla su acción pastoral teniendo en cuenta las orientaciones de los planes pastorales de la iglesia en particular. Busca integrar a las Zonas/Arciprestazgos/vicarías/Decanatos y Parroquias con la visión de Pastoral Juvenil Nacional, incentivando el caminar como proceso de formación, animación y acción en su instancia, Representa a la juventud de la Arqui/Diócesis/Vicariato en la Asamblea Nacional de Pastoral Juvenil y las acciones que ella realizan.</p>
<p>Entre sus principales tareas se destacan:</p>
<ul>
<li>Fortalecer los procesos de formación que se desarrollar en los Grupos Juveniles, elaborando itinerarios formativos y materiales de apoyo adecuados a las distintas realidades.</li>
<li>Facilitar la capacitación de los Animadores y Asesores, implementando cursos de formación, talleres, retiros, intercambios, convivencias etc.</li>
<li>Impulsar la planificación y la evaluación permanente de la Pastoral Juvenil.</li>
</ul>
<p>Cabe destacar que cada instancia tiene su coordinador, asesor y equipo el cual se reúnen en Asamblea para concretar sus líneas de acción.</p>

<li>Utilizar también la naturaleza como signo vivo según el tema</li>
</ul>
<p class="cierre"><strong>Pueden agregar más elementos según su creatividad y dinamismo</strong></p>

<h2>Tiempo y modalidad</h2>
<p>Puedes determinar el tiempo según la modalidad y el desarrollo del tema.</p>
<p>Modalidad de tiempo según el desarrollo o estilo del mismo con actividades de por medio: <strong>Convivencia, Retiro, Charla.</strong></p>

<h3>Actividades de modalidad</h3>
<ul class="ck">
<li>Conformar grupos y hacer discusiones</li>
<li>Conversatorios</li>
<li>Obras recreativas formativas</li>
<li>Plenaria de algún acontecimiento vivido en la formación</li>
<li>Tareas misioneras</li>
<li>Mesas de trabajo</li>
<li>Grupos Creativos</li>
</ul>
<p class="cierre"><strong>PUEDEN AGREGAR MÁS ELEMENTOS SEGÚN SU CREATIVIDAD Y DINAMISMO</strong></p>

<h3>Recursos y materiales a utilizar</h3>
<ul class="ck">

<li>Música Misioneras</li>
<li>Guías o Documentos</li>
<li>Computadoras</li>
<li>Cornetas o equipo de sonido</li>
<li>Diapositivas</li>
<li>Materiales de secretaría: Hojas Blancas, Papel bond, lápices, marcadores, bolígrafos, plastilinas, tijeras, pegas, revistas, afiches, pintura, entre otros.</li>
<li>Materiales creativos: Balones, globos, vestimentas, signos, símbolos, entre otros.</li>
<li>Bailes o música según el tema formativo</li>
<li>Danzas espirituales o formativas</li>

<h1 data-kicker="Cierre">Aprobación</h1>
<p class="sello-t"><strong>Instituto Misiones Consolata<br>Juventud Misionera Allamaniana<br>–Aprobación–</strong></p>
<p>Luego de haber presentado el Manual de la Juventud Misionera Allamaniana en Barquisimeto, el cual, tiene como objetivo ser guía al equipo integrador para su estilo, formación y carisma en su caminar y así poder ser testigos de amor y consolación a la humanidad.</p>
<p>Queremos juntos dejar por asentado su aprobación, para que todos los miembros del movimiento juvenil puedan dar testimonio del servicio por el cual hemos sido llamado bajo la espiritualidad del Padre José Allamano y el amparo de María Consolata y puedan seguir sus lineamientos con compromiso y responsabilidad. Así mismo, damos gracias al Señor por cada por cada servidor que dio su aporte para el desarrollo de este manual formativo:</p>

<h1 data-kicker="Cierre">Compromiso</h1>
<p class="sello-t"><strong>Juventud Misionera Allamaniana<br>–Compromiso–</strong></p>
<p>Como miembros del Movimiento Juventud Misionera Allamaniana, perteneciente al Instituto Misiones Consolata, hacemos el compromiso de velar por el cumplimiento de dicho manual y ser agentes multiplicadores del carisma de consolación a la humanidad</p>
<p>Somos conscientes de que fuimos amados, llamados, elegidos y enviados a cumplir la misión de llevar la Gloria a las Naciones, aportando nuestros dones y talentos al servicio de nuestra iglesia local y universal.</p>
<p>También de dar testimonio con pasión misionera, mansedumbre, constancia siendo una familia que crece en el amor fraterno</p>

<h1 data-kicker="Nota editorial">Sobre esta edición digital</h1>
<p>Esta edición reúne en un solo libro el manual impreso (fotografiado página por página y transcrito a texto) y el <strong>Manual JUMA nuevo</strong>. Cuando ambos fuentes dicen cosas distintas, <strong>prevalece el manual nuevo</strong>.</p>

<h2>Qué se conserva del manual impreso</h2>
<p>Los temas formativos con sus dinámicas, oraciones y recursos, la biografía de San José Allamano, el carisma, la espiritualidad, la historia de la Consolata, los documentos de la Iglesia sobre la misión, las actividades de apostolado, las celebraciones, las orientaciones pedagógicas y los anexos.</p>

</ul>

<script>
(function () {
'use strict';

/* ================================================================
   Manual de identidad JUMA — motor del libro
   1) Paginador: reparte el texto HTML en páginas de tamaño fijo
   2) Hojas 3D (CSS) con volteo realista
   3) Índice, buscador, zoom de texto, temas
   ================================================================ */

var PW = 560, PH = 780;            // tamaño lógico de una página (se ajusta en modo móvil)
var ZOOMS = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4];
var $ = function (s, r) { return (r || document).querySelector(s); };

var store = {
  get: function (k, d) { try { var v = localStorage.getItem('juma.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('juma.' + k, v); } catch (e) {} }
};
var reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');
var DUR = function () { return reduceMq.matches ? 420 : 820; };

/* textura de papel */
(function () {
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .2  .55 0 0 0 -.12'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
  document.documentElement.style.setProperty('--tex', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
})();

function injectLogo(root) {
  $$('img[data-logo]', root).forEach(function (i) { i.src = window.JUMA_LOGO; });
}
injectLogo(document);

/* ---------------------------------------------------------------
   Fuente: capítulos
---------------------------------------------------------------- */
var tpl = $('#chapters');
var SRC = Array.prototype.slice.call(tpl.content.children);
var anchorSeq = 0;
SRC.forEach(function (el, i) {
  el.setAttribute('data-bid', i);
  $$('h1,h2', el).forEach(function (h) { h.setAttribute('data-a', 'a' + (anchorSeq++)); });
  if (el.matches('h1,h2')) el.setAttribute('data-a', 'a' + (anchorSeq++));
});
function plain(el) { return (el.innerHTML || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(); }
function fold(s) {
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    var n = c.normalize ? c.normalize('NFD').charAt(0) : c;
    out += n.toLowerCase().charAt(0) || c;
  }
  return out;
}

var CHAPTERS = [];  // {title, kicker, aid, secs:[{title,aid}]}
(function () {
  var cur = null;
  SRC.forEach(function (el) {
    if (el.matches('[data-page-kind="cover"]')) return;
    if (el.tagName === 'H1') {
      cur = { title: plain(el), kicker: el.getAttribute('data-kicker') || '', aid: el.getAttribute('data-a'), secs: [] };
      CHAPTERS.push(cur);
    } else if (el.tagName === 'H2' && cur) {
      cur.secs.push({ title: plain(el), aid: el.getAttribute('data-a') });
    }
  });
})();
var COVER_SRC = SRC.filter(function (e) { return e.matches('[data-page-kind="cover"]'); })[0];

/* ---------------------------------------------------------------
   Paginador
---------------------------------------------------------------- */
var INLINE = /^(A|B|STRONG|EM|I|U|SPAN|BR|SUP|SUB|CITE|MARK|SMALL|ABBR|Q|S|IMG)$/;
var ATOMIC = '.cuadrante,.org,.esquema,.stat-row,.cruz4,.foda,.mapas,.trio,figure,.logo,.sello-t,.centro,.mom,.fq,.anx,.prov,.org-row,.org-link,.firma,.nota-fig,.mano';
var KEEP_WHOLE = '.box,.himno,.poema,.conclusion,.oracion-txt,.rec,.momento-compromiso,.par2,.letra,.esq>div,.provincias,.anexo';
var MIN_WORDS_SPLIT = 14;

var mbody = $('#mbody');
var mpg = mbody.parentElement;

function paginate(zoom) {
  mpg.style.setProperty('--z', zoom);
  mbody.innerHTML = '';
  var out = [];          // {nodes, chapter}
  var chapterIdx = -1;
  var placed = 0;

  function fits() { return mbody.scrollHeight <= mbody.clientHeight + 0.5; }
  function hostOf(chain) { return chain.length ? chain[chain.length - 1].shell : mbody; }
  function emptyShell(el) {
    if (el.tagName === 'TABLE') return !el.querySelector('tbody tr');
    return !el.firstElementChild;
  }
  function prune() {
    var sh = $$('[data-shell]', mbody).reverse();
    sh.forEach(function (s) { if (s.parentNode && emptyShell(s)) s.parentNode.removeChild(s); });
  }
  function flush() {
    prune();
    var nodes = Array.prototype.slice.call(mbody.childNodes);
    if (!nodes.length) return;
    var pulled = [];
    while (nodes.length > 1 && nodes[nodes.length - 1].nodeType === 1 && nodes[nodes.length - 1].hasAttribute('data-keep')) pulled.unshift(nodes.pop());
    out.push({ nodes: nodes, chapter: chapterIdx });
    mbody.innerHTML = '';
    pulled.forEach(function (n) { mbody.appendChild(n); });
    placed = 0;
  }
  function breakPage(chain) {
    flush();
    placed = 0;
    var parent = mbody;
    chain.forEach(function (lv) {
      lv.shell = lv.src.cloneNode(false);
      lv.shell.setAttribute('data-shell', '');
      parent.appendChild(lv.shell);
      parent = lv.shell;
    });
  }
  function shrink(el) {
    var z = 1;
    while (!fits() && z > 0.45) { z -= 0.04; el.style.zoom = z.toFixed(2); }
  }
  function kind(el) {
    var t = el.tagName;
    if (/^H[1-6]$/.test(t)) return 'leaf';
    if (el.matches(ATOMIC)) return 'atomic';
    if (t === 'TABLE') return 'table';
    if (t === 'UL' || t === 'OL') return 'container';
    if (t === 'FIGURE' || t === 'IMG') return 'atomic';
    var kids = Array.prototype.slice.call(el.children);
    var hasBlock = kids.some(function (c) { return !INLINE.test(c.tagName); });
    if (!hasBlock) return 'text';
    if (t === 'LI') return 'atomic';
    return 'container';
  }

  /* --- texto: dividir por palabras --- */
  function wordMap(src) {
    var tw = document.createTreeWalker(src, NodeFilter.SHOW_TEXT, null);
    var list = [], total = 0, n;
    while ((n = tw.nextNode())) {
      var re = /\S+/g, m, ends = [];
      while ((m = re.exec(n.nodeValue))) ends.push(m.index + m[0].length);

  }
  function locate(map, nth) {   // nth = 1-based palabra (la última de la cabeza)
    for (var i = 0; i < map.list.length; i++) {
      var it = map.list[i];
      if (nth <= it.start + it.ends.length) return { node: it.node, off: it.ends[nth - it.start - 1] };
    }
    return null;
  }
  function trimEdge(el, atStart) {
    for (;;) {
      var f = atStart ? el.firstChild : el.lastChild;
      if (!f) return;
      if (f.nodeType === 3 && !f.nodeValue.trim()) { el.removeChild(f); continue; }
      if (f.nodeType === 1 && f.nodeName === 'BR') { el.removeChild(f); continue; }
      if (f.nodeType === 1 && /^(STRONG|EM|B|I|U|SPAN|CITE)$/.test(f.nodeName)) {
        trimEdge(f, atStart);
        if (!f.firstChild) { el.removeChild(f); continue; }
      }
      return;
    }
  }
  function makeHead(src, map, nth) {
    var loc = locate(map, nth);
    var r = document.createRange();
    r.setStart(src, 0); r.setEnd(loc.node, loc.off);
    var h = src.cloneNode(false);
    h.appendChild(r.cloneContents());
    trimEdge(h, false);
    return h;
  }
  function makeTail(src, map, nth) {
    var loc = locate(map, nth);
    var txt = loc.node.nodeValue, off = loc.off;
    while (off < txt.length && /\s/.test(txt.charAt(off))) off++;
    var r = document.createRange();
    r.setStart(loc.node, off); r.setEnd(src, src.childNodes.length);
    var t = src.cloneNode(false);
    t.appendChild(r.cloneContents());
    trimEdge(t, true);
    t.classList.add('cont');
    t.classList.remove('dropcap');
    return t;
  }
  function splitText(src, chain) {
    var map = wordMap(src);
    if (map.total < MIN_WORDS_SPLIT) return false;
    var host = hostOf(chain);
    var lo = 1, hi = map.total - 1, best = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var h = makeHead(src, map, mid);
      host.appendChild(h);
      var ok = fits();
      host.removeChild(h);
      if (ok) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best > map.total - 6) best = map.total - 6;
    if (best < 6) return false;
    var head = makeHead(src, map, best);
    host.appendChild(head);
    var lh = parseFloat(getComputedStyle(head).lineHeight) || 20;
    if (head.offsetHeight < lh * 1.9 || !fits()) { host.removeChild(head); return false; }
    placed++;
    var tail = makeTail(src, map, best);

    place(tail, chain);
    return true;
  }

  /* --- contenedores --- */
  function avoidSplit(src, chain) {
    if (placed === 0) return false;
    var host = hostOf(chain);
    host.appendChild(src);
    var h = src.offsetHeight;
    host.removeChild(src);
