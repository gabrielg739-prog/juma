<!doctype html>
<html lang="es" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Los quiero así · José Allamano</title>
<meta name="description" content="Los quiero así: espiritualidad y pedagogía misionera del beato José Allamano. Libro para leer en la biblioteca JUMA.">
<meta name="theme-color" content="#e4ded1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213c'/%3E%3Cpath d='M9 7h14v3H17v10a5 5 0 0 1-5 5H9v-3h2a2 2 0 0 0 2-2V10H9z' fill='%23fbf8f1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{--f-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;--f-body:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;--f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--desk:#e4ded1;--paper:#fbf8f1;--ink:#231d17;--muted:#7b6f61;--accent:#a63a2b;--rule:rgba(35,29,23,.16);
--ui-bg:rgba(252,249,242,.94);--ui-ink:#231d17;--ui-muted:#6f6455;--ui-line:rgba(35,29,23,.14);--ui-hover:rgba(35,29,23,.07);--ui-on:#231d17;--ui-on-ink:#fbf8f1;--mark:#ffe58a;
--pw:400px;--ph:560px;--fs:15px;--dur:820ms;--ease-flip:cubic-bezier(0.77,0,0.175,1);--ease-out:cubic-bezier(0.23,1,0.32,1)}
:root[data-theme="sepia"]{--desk:#d6c39e;--paper:#f4e9d0;--ink:#3a2a18;--muted:#85694a;--accent:#9a3524;--rule:rgba(58,42,24,.22);--ui-bg:rgba(244,232,205,.95);--ui-ink:#3a2a18;--ui-muted:#7b6040;--ui-line:rgba(58,42,24,.2);--ui-hover:rgba(58,42,24,.09);--ui-on:#3a2a18;--ui-on-ink:#f4e9d0;--mark:#f3c969}
:root[data-theme="oscuro"]{--desk:#0a0d12;--paper:#1f242d;--ink:#e8e3d8;--muted:#8e897e;--accent:#e58370;--rule:rgba(232,227,216,.2);--ui-bg:rgba(24,28,36,.94);--ui-ink:#e8e3d8;--ui-muted:#9a9488;--ui-line:rgba(232,227,216,.16);--ui-hover:rgba(232,227,216,.09);--ui-on:#e8e3d8;--ui-on-ink:#171a21;--mark:#7a6314}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.28),rgba(0,0,0,0) 60%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.22),rgba(0,0,0,0) 55%)}
:root[data-theme="oscuro"] body::before{background:radial-gradient(ellipse at 50% 40%,rgba(80,100,140,.14),rgba(0,0,0,0) 62%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit}
/* ---------- carga ---------- */
#loading{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--desk);transition:opacity .35s var(--ease-out)}
#loading.hide{opacity:0;pointer-events:none}
#loading .lw{text-align:center;font:500 13px var(--f-ui);color:var(--ui-muted)}
#loading .lw b{display:block;font:600 20px var(--f-display);color:var(--ink);margin-bottom:10px}
#loading .bar{width:180px;height:3px;border-radius:2px;background:var(--ui-line);margin:0 auto;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:ld 1.1s var(--ease-flip) infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* ---------- escenario (sin cabecera: la barra flota abajo, como el Manual) ---------- */
#area{position:fixed;left:0;right:0;top:0;bottom:70px}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--pw);height:var(--ph)}
#stage.spread{width:calc(var(--pw)*2)}
.book-shadow{position:absolute;left:3%;right:3%;bottom:-16px;height:34px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);filter:blur(6px);pointer-events:none;display:none}
#stage.spread .book-shadow{display:block}
:root[data-theme="oscuro"] .book-shadow{background:radial-gradient(ellipse at center,rgba(0,0,0,.8),rgba(0,0,0,0) 70%)}
#shift{position:absolute;left:0;top:0;width:100%;height:100%;transition:transform var(--dur) var(--ease-flip)}
#shift.nosnap{transition:none}
#book{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
#L{left:0}
#R{left:var(--pw)}
#stage:not(.spread) #R{display:none}
#stage.spread::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--pw) - 14px);width:28px;background:linear-gradient(to right,transparent,rgba(0,0,0,.12) 50%,transparent);pointer-events:none;z-index:4}
#stage.spread.solo::after{display:none}
/* ---------- páginas ---------- */
.pg{position:relative;width:100%;height:100%;background:var(--paper);border-radius:3px 6px 6px 3px;box-shadow:0 10px 26px -14px rgba(0,0,0,.45),inset 0 0 0 1px var(--rule);overflow:hidden}
.pg.blank{background:none;box-shadow:none}
.pg .inner{position:absolute;inset:0;padding:calc(var(--ph)*.085) calc(var(--pw)*.1) calc(var(--ph)*.11);overflow:hidden;font-size:var(--fs);line-height:1.55}
.rh{position:absolute;top:calc(var(--ph)*.032);left:calc(var(--pw)*.1);right:calc(var(--pw)*.1);text-align:right;font:600 9.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.folio{position:absolute;left:0;right:0;bottom:calc(var(--ph)*.04);display:flex;justify-content:center;align-items:center;gap:10px;font:500 12px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.folio::before,.folio::after{content:"";width:22px;height:1px;background:currentColor;opacity:.45}
/* portada: la misma del Manual (azul marino, marco dorado, franjas JUMA) */
.pg.cover{background:#14213c;color:#f4ecd9;overflow:hidden}
.pg.cover::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,rgba(0,0,0,0) 1px 3px),radial-gradient(ellipse at 30% 20%,rgba(80,120,200,.28),rgba(0,0,0,0) 62%),linear-gradient(160deg,#1b2f58 0%,#14213c 55%,#0d1730 100%)}
.pg.cover::after{content:"";position:absolute;top:0;bottom:0;left:0;width:9%;z-index:8;background:linear-gradient(to right,rgba(0,0,0,.5),rgba(255,255,255,.07) 40%,rgba(0,0,0,0))}
.pg.cover .cv{position:absolute;inset:26px 26px 26px 34px;border:1px solid rgba(244,236,217,.38);outline:1px solid rgba(244,236,217,.16);outline-offset:5px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 22px 24px;z-index:2}
.cv .portada-sup{font:600 10.5px/1.4 var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:#e6c98a;margin:0 0 20px}
.cv .cv-logo{background:#fbf8f1;border-radius:22px;padding:14px 22px 10px;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08);margin-bottom:24px}
.cv .cv-logo img{display:block;width:min(190px,calc(var(--pw)*.5));height:auto}
.cv h1{margin:0;font:600 calc(var(--pw)*.092)/1.08 var(--f-display);letter-spacing:-.01em;color:#fbf5e4;text-wrap:balance}
.cv h1 small{display:block;margin-top:12px;font:italic 400 calc(var(--pw)*.05)/1.25 var(--f-display);letter-spacing:.005em;color:#e9dcc0}
.cv .cv-stripes{display:flex;width:130px;height:6px;margin:22px 0 18px;border-radius:3px;overflow:hidden}
.cv .cv-stripes i{flex:1}
.cv .cv-stripes i:nth-child(1){background:#3a76d0}.cv .cv-stripes i:nth-child(2){background:#f0bd32}.cv .cv-stripes i:nth-child(3){background:#46a35a}.cv .cv-stripes i:nth-child(4){background:#d4412f}.cv .cv-stripes i:nth-child(5){background:#f7f4ec}
.cv .portada-sub{font:500 12.5px/1.4 var(--f-ui);letter-spacing:.06em;color:#d9ceb4;margin:0}
.cv .portada-anio{margin:auto 0 0;font:600 10px/1.4 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:#e6c98a}
/* volteo (igual al Manual) */
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;transform:rotateY(0deg);z-index:6}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:3px 6px 6px 3px}
.face.back{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:9;background:linear-gradient(to right,rgba(20,10,0,0),rgba(20,10,0,.55))}
.face.back .fs{background:linear-gradient(to left,rgba(20,10,0,0),rgba(20,10,0,.55))}
.leaf.fl-next .face.front .fs{animation:shF var(--dur) var(--ease-flip) both}
.leaf.fl-next .face.back .fs{animation:shB var(--dur) var(--ease-flip) both}
.leaf.fl-prev .face.front .fs{animation:shB var(--dur) var(--ease-flip) both reverse}
.leaf.fl-prev .face.back .fs{animation:shF var(--dur) var(--ease-flip) both reverse}
@keyframes shF{0%{opacity:0}55%{opacity:.5}100%{opacity:.85}}
@keyframes shB{0%{opacity:.85}45%{opacity:.5}100%{opacity:0}}
.leaf.fl-next .face,.leaf.fl-prev .face{box-shadow:0 4px 26px rgba(0,0,0,.3)}
/* zonas de borde con icono circular (como el Manual) */
.zone{position:absolute;top:0;bottom:0;z-index:12;border:0;background:none;padding:0;cursor:pointer;width:18%;-webkit-tap-highlight-color:transparent}
.zone.l{left:0}
.zone.r{right:0}
#stage:not(.spread) .zone{width:30%}
.zone.off{display:none}
.zone i{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:var(--ui-bg);color:var(--ui-ink);box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transform:scale(.9);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out);pointer-events:none}
.zone.l i{left:10px}
.zone.r i{right:10px}
.zone i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover) and (pointer:fine){.zone:hover i{opacity:1;transform:scale(1)}}
/* ---------- texto seguido ---------- */
#desp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
#desp.on{display:block}
.desp-in{max-width:700px;margin:0 auto;padding:22px 22px 96px}
/* ---------- tipografía ---------- */
.tx h2{position:relative;font:600 calc(var(--fs)*1.7)/1.12 var(--f-display);color:var(--ink);margin:0 0 .9em;padding-bottom:.55em;border-bottom:1px solid var(--rule);scroll-margin-top:12px}
.tx h2::after{content:"";position:absolute;left:0;bottom:-1px;width:48px;height:2px;background:var(--accent)}
.tx h3{font:600 calc(var(--fs)*1.06)/1.25 var(--f-display);color:var(--ink);margin:1.1em 0 .4em;scroll-margin-top:12px}
.tx p{margin:0 0 .72em;text-align:justify;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tx p.nota{font-size:.8em;line-height:1.45;color:var(--muted);border-top:1px solid var(--rule);padding-top:.35em;margin:.5em 0 .7em}
.tx p.cron{text-align:left;margin:0 0 .45em}
.tx p.cron b{font:600 .92em var(--f-ui);color:var(--accent)}
.tx p.bib{text-indent:-1.2em;padding-left:1.2em;font-size:.92em;text-align:left;margin-bottom:.5em}
#desp .tx{font-size:var(--fs);line-height:1.7}
#desp .tx p{text-align:left;margin-bottom:.8em}
#desp .tx h2{margin-top:1.4em}
#desp .tx h2:first-child{margin-top:0}
.hit{animation:flash 2.2s ease-out 1}
@keyframes flash{0%,30%{background:var(--mark)}100%{background:transparent}}
/* ---------- barra inferior (como el Manual) ---------- */
#bar{position:fixed;z-index:50;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px 8px;border-radius:16px;background:var(--ui-bg);color:var(--ui-ink);border:1px solid var(--ui-line);box-shadow:0 8px 30px rgba(0,0,0,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100vw - 16px);overflow:hidden}
#bar .sep{width:1px;height:22px;background:var(--ui-line);margin:0 6px;flex:none}
#bar .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width var(--dur) var(--ease-flip)}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:inherit;flex:none;transition:background-color .15s,transform .12s var(--ease-out)}
.ibtn:active{transform:scale(.94)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover) and (pointer:fine){.ibtn:hover:not(:disabled){background:var(--ui-hover)}}
.pind{width:132px;height:38px;padding:0 10px;border-radius:10px;border:0;background:none;text-align:center;font:600 13px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;color:inherit;display:grid;place-items:center;align-content:center;flex:none}
.pind span,.pind small{display:block;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pind small{font:500 10.5px/1.2 var(--f-ui);color:var(--ui-muted);margin-top:2px}
@media (hover:hover) and (pointer:fine){.pind:hover{background:var(--ui-hover)}}
.zlab{font:600 12px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ui-muted);min-width:38px;text-align:center}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--ui-hover);flex:none}
.seg button{height:32px;padding:0 11px;border-radius:8px;border:0;background:none;font:600 12.5px var(--f-ui);color:var(--ui-muted);transition:background-color .15s,color .15s,transform .12s var(--ease-out)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--ui-on);color:var(--ui-on-ink)}
.vbtn{height:38px;padding:0 10px;border-radius:10px;border:0;background:none;color:inherit;display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--f-ui);white-space:nowrap;flex:none;transition:background-color .15s,transform .12s var(--ease-out)}
.vbtn:active{transform:scale(.97)}
#vista-n{min-width:96px;text-align:left}
.vbtn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover) and (pointer:fine){.vbtn:hover{background:var(--ui-hover)}}
#b-th{display:none}
/* ---------- índice y buscador (como el Manual) ---------- */
#sidebar{position:fixed;z-index:60;left:0;top:0;bottom:0;width:min(340px,92vw);display:flex;flex-direction:column;background:var(--ui-bg);color:var(--ui-ink);border-right:1px solid var(--ui-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateX(-102%);transition:transform 340ms var(--ease-out);box-shadow:0 0 40px rgba(0,0,0,.18);visibility:hidden}
#sidebar.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
@media (min-width:1100px){#scrim{display:none}}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.sb-head img{width:40px;height:auto;flex:none}
html[data-theme="oscuro"] .sb-head img{background:#fbf8f1;border-radius:8px;padding:3px}
.sb-head .t{min-width:0;flex:1}
.sb-head .t b{display:block;font:600 15px/1.2 var(--f-display)}
.sb-head .t span{display:block;font:500 11px/1.3 var(--f-ui);color:var(--ui-muted)}
.sb-search{position:relative;margin:0 14px 10px}
.sb-search input{width:100%;height:40px;padding:0 38px;border-radius:10px;border:1px solid var(--ui-line);background:var(--paper);color:var(--ink);font:500 14px var(--f-ui)}
.sb-search input::-webkit-search-cancel-button,.sb-search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sb-search input::placeholder{color:var(--ui-muted)}
.sb-search>svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--ui-muted);pointer-events:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sb-search .clr{position:absolute;right:3px;top:2px;width:36px;height:36px;display:none}
.sb-search.has .clr{display:inline-grid}
.sb-scroll{flex:1;overflow:auto;padding:0 8px 24px;overscroll-behavior:contain;scrollbar-width:thin}
.sb-meta{padding:4px 10px 8px;font:500 12px/1.3 var(--f-ui);color:var(--ui-muted)}
.sb-meta:empty{display:none}
.grp{padding:16px 10px 6px;font:700 10px/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.ch{margin:1px 0}
.ch-row{display:flex;align-items:stretch}
.ch-btn{flex:1;min-width:0;display:flex;gap:9px;align-items:flex-start;text-align:left;padding:8px 8px 8px 10px;border:0;background:none;border-radius:10px;font:600 13.5px/1.3 var(--f-ui);color:inherit;transition:background-color .15s}
.ch-btn .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ui-muted);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.ch-btn .ct{flex:1;min-width:0}
.ch-btn .pn,.sec-btn .pn{flex:none;font:600 11.5px/1.5 var(--f-ui);color:var(--ui-muted);font-variant-numeric:tabular-nums;padding-top:1px}
.ch-tg{flex:none;width:30px;border:0;background:none;border-radius:10px;color:var(--ui-muted);display:grid;place-items:center;transition:background-color .15s}
.ch-tg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease-out)}
.ch.open .ch-tg svg{transform:rotate(90deg)}
.ch.cur>.ch-row{background:var(--ui-hover)}
.ch.cur .ch-btn{color:var(--accent)}
.ch.cur .ch-btn .dot{background:var(--accent)}
.secs{display:none;padding:2px 0 6px 28px}
.ch.open .secs{display:block}
.sec-btn{width:100%;display:flex;gap:8px;text-align:left;padding:6px 8px;border:0;background:none;border-radius:8px;font:500 12.5px/1.35 var(--f-ui);color:var(--ui-ink);opacity:.88}
.sec-btn span:first-child{flex:1;min-width:0}
.sec-btn.cur{background:var(--ui-hover);color:var(--accent);opacity:1;font-weight:600}
body.modo-desp .pn{display:none}
@media (hover:hover) and (pointer:fine){.ch-btn:hover,.ch-tg:hover,.sec-btn:hover,.res:hover{background:var(--ui-hover)}}
.res{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:10px;background:none;font:400 13px/1.4 var(--f-ui);color:inherit;margin-bottom:2px}
.res .rh2{display:flex;justify-content:space-between;gap:8px;font:600 12px/1.3 var(--f-ui);color:var(--accent);margin-bottom:3px}
.res .rh2 span:last-child{color:var(--ui-muted);font-variant-numeric:tabular-nums;flex:none}
.res mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.nores{padding:24px 12px;text-align:center;font:500 13px/1.5 var(--f-ui);color:var(--ui-muted)}
/* ir a una página */
.gotobox{position:fixed;z-index:70;left:50%;bottom:76px;transform:translateX(-50%);padding:10px 12px;border-radius:14px;background:var(--ui-bg);color:var(--ui-ink);border:1px solid var(--ui-line);box-shadow:0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100vw - 24px)}

<template id="portada"><div class="cv"><p class="portada-sup">Biblioteca JUMA</p><div class="cv-logo"><img src="../img/logo.png" alt="Logo JUMA"></div><h1>Los quiero así<small>Espiritualidad y pedagogía misionera</small></h1><div class="cv-stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p class="portada-sub">José Allamano</p><p class="portada-anio">Instituto Misiones Consolata</p></div></template>
<div id="medida" aria-hidden="true"><div class="pg"><div class="inner tx" id="medida-in"></div></div></div>

<script type="application/json" id="datos">{"secs": [{"id": "presentacion", "t": "Presentación"}, {"id": "biografia", "t": "Biografía de José Allamano"}, {"id": "cronologia", "t": "Cronología de José Allamano"}, {"id": "introduccion", "t": "Introducción"}, {"id": "cap1", "t": "1. Misioneros y misioneras sí, pero santos"}, {"id": "cap2", "t": "2. Amados y llamados"}, {"id": "cap3", "t": "3. Formados para la misión"}, {"id": "cap4", "t": "4. Misterios de Salvación"}, {"id": "cap5", "t": "5. Virtudes teologales"}, {"id": "cap6", "t": "6. Votos religiosos y misioneros"}, {"id": "cap7", "t": "7. Actitudes misioneras"}, {"id": "cap8", "t": "8. Eucaristía: misterio de fe y amor"}, {"id": "cap9", "t": "9. Todas las generaciones me llamarán feliz"}, {"id": "cap10", "t": "10. Con los ojos dirigidos al Señor"}, {"id": "cap11", "t": "11. Caminar en el Espíritu"}, {"id": "cap12", "t": "12. Modelos e intercesores"}, {"id": "bibliografia", "t": "Bibliografía esencial"}, {"id": "ficha", "t": "Ficha del libro"}], "items": [{"k": "h2", "t": "Presentación", "s": 0}, {"k": "p", "t": "Con alegría y gratitud presentamos este nuevo libro con la Espiritualidad y la Pedagogía misionera de nuestro fundador, el beato José Allamano. Nosotros, Misioneros y Misioneras de la Consolata, tenemos el privilegio de poder contar con una gran cantidad de enseñanzas de nuestro Padre. Las fuentes donde podemos encontrarlas son ricas y genuinas. Las hemos recibido de todos los que han sido educados por él y las conservamos cuidadosamente como un valioso tesoro. Sobre todo nos referimos a sus Conferencias o conversaciones dominicales, que contienen su modo de pensar más auténtico. Nuestros primeros hermanos y hermanas, que tuvieron la gracia de escucharlas directamente de él, se preocuparon por recogerlas y transmitírnoslas. De esta manera nosotros, al leerlas, podemos imaginar que es él mismo quien nos habla.", "s": 0}, {"k": "p", "t": "Estas Conferencias están publicadas en seis volúmenes: tres con las conferencias a los misioneros y tres con las conferencias a las misioneras. Ellas contienen los apuntes manuscritos que José Allamano preparaba semanalmente, así como las anotaciones de aquellos que lo escuchaban. Es necesario mencionar la gran obra surgida de la mente y el corazón del P. Lorenzo Sales llamada \"La Vida Espiritual\". Esta recoge en forma orgánica todo el pensamiento del Fundador, tal como se desprende de las Conferencias dominicales a los misioneros y a las misioneras, durante veinticuatro años.", "s": 0}, {"k": "p", "t": "Los Misioneros y Misioneras de la Consolata queremos seguir inspirándonos en este patrimonio que nos pertenece, con una fidelidad dinámica, para ser auténticos hijos e hijas de José Allamano y saber transmitirlo a las nuevas generaciones, no solo porque está escrito sobre el papel, sino porque lo encarnamos en nuestras vidas y lo expresamos mediante nuestras opciones. Para lograrlo, creemos que la actitud fundamental es la de estar unidos al Fundador. Nunca olvidamos esa famosa frase que, pronunciada hacia el final de su vida, resuena como una admonición: \"Yo daré mi espíritu a los que estarán unidos a mí\".", "s": 0}, {"k": "p", "t": "En estos últimos tiempos, en nuestros Institutos hemos sentido la necesidad de reconsiderar las fuentes que nos transmiten el pensamiento del Padre, para quitar cuanto ha sido propuesto de otro modo o superado por la renovación de la Iglesia, sobre todo a partir del Concilio Vaticano II. Nos damos cuenta de que se trata de una operación delicada, porque para nosotros todo lo que el Padre nos ha dicho o escrito es importante y no queremos perderlo. Sin embargo, después de una reflexión profunda, tomamos la decisión de confiar a un misionero y a una misionera, con la colaboración de otros hermanos y hermanas, la tarea de buscar en \"La Vida Espiritual\", y eventualmente también en los volúmenes de las Conferencias, lo esencial del pensamiento de José Allamano a la luz de la renovación de la Iglesia. De allí surgió este libro, en el que ha sido conservado el espíritu de nuestro Fundador. Al leerlo, tenemos la im-presión de que es él mismo quien paternalmente nos habla, con el estilo que lo caracterizaba, mientras nos propone los temas que él consideraba importantes.", "s": 0}, {"k": "p", "t": "Ponemos este libro sobre todo en las manos de los y las jóvenes de nuestros Institutos, para que puedan profundizar más fácilmente las enseñanzas del Fundador. También lo ponemos en las manos de todos sus hijos e hijas, de los laicos misioneros y de cuantos desean acercarse al espíritu de este gran hombre de Dios, educador de sacerdotes y padre de dos familias misioneras. Evidentemente, las fuentes en las que nos hemos inspirado no han sido superadas; ellas siguen siendo el punto de referencia privilegiado para todos los que desean comprender mejor el pensamiento de José Allamano.", "s": 0}, {"k": "p", "t": "Agradecemos al P. Francesco Pavese y a la Hna. Ángeles Mantineo que con corazón de hijos y capacidad de trabajo en común han llevado a cabo esta iniciativa, así como expresamos nuestra gratitud a todos los que han colaborado. Es nuestro deseo que cuantos lean estas páginas puedan vivir la misma experiencia que uno de nuestros misioneros ha atestiguado de este modo: \"Después de cada conferencia nos surgía espontáneo repetir con los discípulos de Emaús: ¿No ardía nuestro corazón mientras Él nos hablaba y nos explicaba las Escrituras?\"", "s": 0}, {"k": "p", "t": "Que la Santísima Consolata y el beato José Allamano nos iluminen y nos bendigan.", "s": 0}, {"k": "p", "t": "P. Aquiléo Fiorentini IMC Superior General", "s": 0}, {"k": "p", "t": "Hna. Gabriella Bono MC", "s": 0}, {"k": "p", "t": "Superiora General", "s": 0}, {"k": "h2", "t": "Biografía de José Allamano", "s": 1}, {"k": "p", "t": "José Allamano, el cuarto de cinco hijos, nació el 21 de enero de 1851 en Castelnuovo d'Asti, el pueblo natal de san José Cafasso y san Juan Bosco. Habiendo perdido a su padre cuando aún no tenía tres años, influyó decisivamente sobre él la madre María Ana Cafasso, hermana del santo, de quien continuará la tarea de formar al clero y reproducir su santidad, al punto de ser considerado \"un Cafasso resucitado\" y \"una copia casi perfecta de su gran predecesor y tío\".", "s": 1}, {"k": "p", "t": "Con Don Bosco. Finalizada la escuela primaria, en otoño de 1862 entró en el oratorio salesiano de Valdocco, teniendo como confesor habitual al mismo Don Bosco. Allí permaneció cuatro años, donde concluyó la primera etapa de los estudios secundarios. Sintiéndose llamado al sacerdocio diocesano, dejó Valdocco sin despedirse, para entrar en el seminario de Turín. Don Bosco, que tal vez veía en él a un futuro miembro de su Instituto, lo regañó dulcemente con estas palabras: \"Lo que me hiciste es muy grave; te fuiste sin saludarme\". La tímida respuesta fue: \"No deseaba…\", porque como José Allamano quería mucho a Don Bosco —y lo seguirá queriendo durante toda su vida—, no quería darle un disgusto.", "s": 1}, {"k": "p", "t": "En el seminario diocesano. Su decisión de entrar en el seminario diocesano tuvo que superar un inesperado obstáculo familiar. No fue su madre, sino sus hermanos los que se opusieron, y no porque no estuvieran de acuerdo con la vocación sacerdotal, sino porque querían que primero terminara la escuela secundaria. El joven José, con total convicción, les respondió a sus hermanos con una sola frase: \"El Señor me llama hoy… no sé si me llamará aún dentro de dos o tres años\". Así, en 1866 entró en el seminario. Ya desde el primer año se manifestó la fragilidad física que lo acompañará durante toda su vida, llevándolo inclusive a estar, en más de una ocasión, en peligro de muerte. El período de preparación al sacerdocio fue muy positivo. Mons. G. B. Ressia, su compañero de seminario y luego obispo de Mondoví, dijo sobre él: \"Era el primero, no sólo alfabéticamente, sino por sus estudios y sus virtudes, su mansedumbre y la bondad de su corazón. Todos sabían que el más cercano al Corazón de Jesús, el más amigo era Allamano, con el que nadie osaba compararse\".", "s": 1}, {"k": "p", "t": "Educador de seminaristas. Ordenado sacerdote el 20 de septiembre de 1873, habría preferido dedicarse al trabajo pastoral, pero lo destinaron a la formación de los seminaristas, primero como asistente (1873-1876), luego como director espiritual del seminario mayor (1876-1880). Los proyectos de José Allamano, en realidad, eran muy diferentes. Cuando el arzobispo mons. Lorenzo Gastaldi le comunicó el destino, él balbuceó respetuosamente una objeción: \"Mi intención era ir como vicepárroco y luego tal vez como párroco en algún pueblito…\" A lo que el prelado respondió: \"¿Querías ir de párroco? Si es por eso, te doy la parroquia más importante de la diócesis: ¡el seminario!\".", "s": 1}, {"k": "p", "t": "Como educador de candidatos al sacerdocio, se distinguió por su firmeza ante los principios y la delicadeza para solicitar que fueran puestos en práctica. En esta tarea le fueron unánimemente reconocidas excelentes cualidades que lo convirtieron en un verdadero \"maestro en la formación del clero\". Paralelamente siguió estudiando, hasta obtener la licenciatura en teología en la facultad teológica de Turín (30 de julio de 1876) y la habilitación para ejercer la docencia a nivel universitario (12 de junio de 1877). A continuación fue nombrado miembro adjunto de la facultad de derecho canónico y civil, cubriendo también el cargo de decano en ambas facultades.", "s": 1}, {"k": "p", "t": "Rector del santuario de la Consolata. En octubre de 1880 fue nombrado rector del santuario de la Consolata de Turín. Desde entonces hasta su muerte, su actividad se desarrolló a la sombra del santuario mariano de la arquidiócesis. También este nuevo destino le costó mucho a José Allamano, sacerdote de apenas 29 años. Años más tarde, él mismo contó la conversación que había tenido con el arzobispo: \"Pero monseñor, soy muy joven\", le dijo con confianza filial, recibiendo esta respuesta paterna y alentadora: \"Verás que te amarán. Es mejor ser joven, así, si cometerás errores, tendrás tiempo para corregirlos\".", "s": 1}, {"k": "p", "t": "Como primer colaborador solicitó la ayuda del sacerdote Santiago Camisassa, que había conocido y apreciado en el seminario cuando era director espiritual. Lo invitó escribiéndole frases que dejan entrever su proyecto pastoral: \"Mire, querido padre, trataremos de hacer juntos un poco de bien a los demás y de honrar con el Sagrado Culto a nuestra querida madre María, Consuelo de los Afligidos\". Su fraterna colaboración sacerdotal duró toda la vida, y se caracterizó por el respeto mutuo del propio rol y el ideal común. Podemos constatar el admirable ejemplo de amistad y de colaboración apostólica entre estos dos sacerdotes, no sólo en las obras que realizaron juntos, sino también por lo que José Allamano dijo después de la muerte de Camisassa: \"Estaba siempre dispuesto a sacrificarse con tal de que no tuviera que hacerlo yo\"; \"Con su muerte he perdido los dos brazos\"; \"Hacía 42 años que estábamos juntos, éramos una cosa sola\"; \"Todas las noches compartíamos largas horas en mi estudio…\"; \"Nos habíamos prometido decirnos siempre la verdad y lo cumplimos\".", "s": 1}, {"k": "p", "t": "El santuario, deteriorado físicamente y venido a me-nos espiritualmente, bajo la dirección de José Allamano recobró vida. Con la activa colaborazión de Camisassa, lo transformó en una joya artística, resplandeciente de oro y mármoles, como se lo puede ver en la actualidad. Se ocupó de las actividades pastorales, litúrgicas y de los asociaciones laicales. Poco a poco el santuario se convirtió en un centro de espiritualidad mariana y renovación cristiana para la ciudad y la región. Allamano contribuyó a ello también con el carisma que había recibido de Dios para aconsejar y consolar. Personas de todas las clases sociales experimentaron los secretos de su mente iluminada y su gran corazón. Como observó el Card. J. Villot, José Allamano se convirtió en \"un punto de referencia para todos los que veían en él a un verdadero sacerdote, revestido de una misión providencial para una diócesis como Turín: la misión de aconsejar y dirigir, animar y orientar, volver a dar a las almas, con la gracia del sacramento de la reconciliación, la alegría y la paz de la renovada amistad con Dios, alentar toda obra apostólica\".", "s": 1}, {"k": "p", "t": "Director de ejercicios espirituales. Además de ser rector del santuario de la Consolata, José Allamano también era rector del santuario de S. Ignacio, en las colinas de Lanzo Torinese, del que dependía también una casa de ejercicios espirituales anexa. Este centro de espiritualidad era muy famoso, ya que allí mismo había predicado durante tantos años el mismo S. José Cafasso. Aquí José Allamano encontró un campo privilegiado para la formación de sacerdotes y laicos. Como atestiguó un estrecho colaborador suyo, el", "s": 1}, {"k": "p", "t": "Canónigo G. Cappella: \"Siempre quiso dirigirlos personalmente, y mientras los dirigía también quería hacerlos, porque decía: No quiero ser sólo como una cascada que da agua a los demás, sino también un recipiente que recibe las gracias del santo espíritu\" […] Se puede decir que bajo su dirección, la casa de S. Ignacio se convirtió en una Casa de Ejercicios de primer nivel, al punto que no había nunca una habitación vacía\".", "s": 1}, {"k": "p", "t": "Por la senda del tío José Cafasso. Con la finalidad de ofrecer un modelo de vida especialmente a los sacerdotes, recogió las memorias sobre José Cafasso, publicó una biografía y sus escritos, e inició la causa de canonización, que llevó hasta la beatificación, el 3 de mayo de 1925. Lo confesó cándidamente él mismo: \"Puedo decir que he introducido este proceso, no tanto por el afecto o por el parentezco, sino por el bien que puede producir la exhaltación de este hombre, para que los que lean sobre sus virtudes se conviertan en buenos sacerdotes, buenos cristianos y ustedes buenos misioneros\". También el canónigo N. Baravalle confirma esta intención: \"Nunca hizo alarde del parentezco con el Beato, y con frecuencia durante la causa decía: Yo, como pariente, no debería ni siquiera ocuparme, y no es este el espíritu que me anima a hacerlo; lo llevo a cabo como Rector del Convictorio, ya que, siendo su sucesor en la enseñanza y en la dirección del Clero, es mi deber indicar al Clero la virtud y la santidad de Cafasso\".", "s": 1}, {"k": "p", "t": "A los misioneros y misioneras, después de la beatificación del tío, les escribió una circular llena de alegría y conmoción, diciendo, entre otras cosas: \"El beato José Cafasso es Protector del Convictorio del que es Cofundador, su orgullo y modelo para las almas piadosas, especialmente las eclesiásticas; pero también es nuestro especial protector y, como ustedes lo llaman, \"su Tío\"; como tal lo deben honrar e imitar sus virtudes. En él pienso haberles propuesto un gran medio de santificación, y de haber cumplido en parte mi misión ante ustedes\".", "s": 1}, {"k": "p", "t": "Maestro de sacerdotes en el Convictorio. José Allamano también se comprometió a sanar la grave herida que se había creado en la diócesis con el cierre del Convictorio Eclesiástico para la formación de los sacedotes jóvenes, decidida por el arzobispo a causa de las controversias sobre la enseñanza de la moral. En 1882 logró su reapertura y lo dirigió hasta su muerte. Le importaba particularmente la formación espiritual, intelectual y pastoral de los jóvenes sacerdotes, actualizándola frente a las nuevas exigencias. Sobre todo les inculcó el fin último de la vocación sacerdotal: la salvación de nuestros hermanos. A los internos les propuso e inculcó con convicción la dimensión misionera vinculada a la consagración sacerdotal, afirmando que \"la vocación a las misiones es esencialmente la vocación de todo santo sacerdote. Ella no es más que un gran amor a nuestro Señor Jesucristo, que nos lleva a darlo a conocer y amar a cuantos aún no lo conocen y aman\". El haber convencido al arzobispo de la reapertura del Convictorio Eclesiástico en la Consolata siempre fue reconocido como un mérito extraordinario de José Allamano.", "s": 1}, {"k": "p", "t": "Apóstol en la Iglesia local. Además de todo lo que hemos señalado, José Allamano estaba involucrado, directa o indirectamente, en tantas otras obras apostólicas. Fue canónigo de la catedral, miembro de comisiones y comités, superior religioso de las hermanas de la Visitación y de las Hermanas de San José. También fue intensa su actividad en ocasión de varias celebraciones, aniversarios y durante la primera guerra mundial en la asistencia a los prófugos, los sacerdotes y los seminaristas militarizados. José Allamano supo colaborar con las más variadas formas de apostolado, como atestigua el can. N. Baravalle, que vivía con él en el santuario: \"Las formas más modernas del apostolado católico, como el de la buena prensa y otros similares, no sólo las apreciaba y tenía muy en cuenta, sino que también las apoyaba económicamente, algo que en esa época llamaba mucho la atención\". Mons. G.B. Pinardi, obispo auxiliar de Turín, afirmó que \"todas las iniciativas de la época encontraron eco en la irradiación apostólica que brotaba del Convictorio de la Consolata\".", "s": 1}, {"k": "p", "t": "En modo particular, José Allamano sostuvo el periodismo católico no sólo cuando era más joven, en la plenitud de su vida apostólica, sino siempre, hasta la muerte. Mons. B. Castelli, director del periódico católico turinés, aseguró que \"el periódico católico siempre contó con su calificado y cordial apoyo moral\". Y el canónigo A, Cantono atestiguó: \"Era alguien que estimaba objetivamente nuestra forma de hacer periodismo, de la que esperaba que fuese ágil y bien hecha. Me decía que no había que tener miedo de aplicar ciertas innovaciones con respecto a la forma y a la técnica\".", "s": 1}, {"k": "p", "t": "Padre de misioneros y misioneras. Animado por este intenso celo apostólico, unido a un sentido vital de la misión de la Iglesia, José Allamano ensanchó sus horizontes hacia el mundo entero. Sintió la urgencia del mandato de Cristo a anunciar el Evangelio a todos. Le parecía innatural que en su Iglesia local, fecunda de tantas instituciones dedicadas a las obras de caridad, faltara una dedicada exclusivamente a las misiones. Por eso decidió solucionarlo. De esa manera habría ayudado a los que se sentían atraídos por el ideal misionero a realizarlo y al mismo tiempo lo habría despertado en los demás. La fundación del instituto de los misioneros no surgió de improviso en la mente de José Allamano; maduró en su espíritu a través de una larga preparación espiritual y no fue llevado a cabo sino después de haber superado grandes pruebas y contradicciones. No cabe duda de que el camino de la fundación fue dificultoso y cansador para José Allamano, ya muy ocupado en el Santuario, en el Convictorio, en S. Ignacio y en la Causa de José Cafasso.", "s": 1}, {"k": "p", "t": "En 1891 le pareció que había llegado el momento de realizar su proyecto de fundar un Instituto misionero para sacerdotes y hermanos laicos, pero sólo lo podrà concretar cuando ocupará la cátedra de San Máximo el card. Agustín Richelmy, su compañero de seminario y amigo. Con él no sólo pudo compartir los mismos ideales sino también recibir el apoyo necesario. Las dudas fueron superadas definitivamente gracias a una intervención de la Providencia. En enero de 1900, una enfermedad contraída mientras asistía a una pobre mujer en un altillo helado lo llevó a estar en peligro de muerte. La curación, considerada un milagro de la Consolata, fue para él la señal de que el Instituto se debía fundar. Al año siguiente, el 29 de enero de 1901, nació el Instituto Misiones Consolata.", "s": 1}, {"k": "p", "t": "La motivación profunda de la fundación debe buscarse en su mismo espíritu. El P. L. Sales, su primer biógrafo e hijo muy querido, afirmó que la raíz de la fundación está en la santidad de José Allamano, que explicaba: \"No habiendo podido ser yo mismo misionero, quiero que no dejen de serlo los que desean seguir ese camino\". Después hubo razones contingentes concretas que han contribuido para que se pudiera comenzar la obra, como el deseo de continuar la obra del card. Guillermo Massaia, así como el espíritu misionero y la insistencia de algunos sacerdotes del Convictorio. El mismo José Allamano lo afirma cuando le escribe al Card. A. Richelmy, el 6 de abril de 1900: \"Con la experiencia adquirida a lo largo de tantos años en la educación del Clero, debo confesar que muchas veces he encontrado verdaderas vocaciones a las misiones\". La decisión definitiva de fundar el Instituto misionero fue tomada sólo después de una orden explícita del arzobispo, al que José Allamano respondió como Pedro a Jesús en ocasión de la pesca milagrosa: \"En tu nombre echaré las redes\".", "s": 1}, {"k": "p", "t": "El 8 de mayo de 1902 partieron hacia Kenya los primeros cuatro misioneros, dos sacerdotes y dos laicos, seguidos al poco tiempo por otros. Muy pronto, vista la necesidad de una presencia femenina en las misiones, José Allamano logró que los superiores del Cottolengo le cedieran algunas hermanas Vicentinas, que acompañaron la labor de los Misioneros de la Consolata en Kenya desde 1903, durante más de 22 años. Por dificultades surgidas entre mons. Felipe Perlo, vicario apostólico apenas elegido, y los superiores del Cottolengo, a partir de 1909 el envío de hermanas fue interrumpido y, gradualmente, las que estaban en Kenya regresaron a su país.", "s": 1}, {"k": "p", "t": "José Allamano, que había seguido estos eventos con dolor sin poder evitar las consecuencias, se vio obligado a intervenir para asegurar la indispensable presencia de las hermanas en las misiones. De esta manera, tras la insistencia de mons. F. Perlo, de acuerdo con su arzobispo y reconfortado por la opinión del card. Jerónimo Gotti, Prefecto de Propaganda Fide, y especialmente por la del Papa S. Pío X, el 19 de enero de 1910 nació el Instituto de las Misioneras de la Consolata. Él mismo les contaba paternamente a las hermanas cómo había ido madurando su fundación. Pidiéndoles que rezaran por el card. Gotti, gravemente enfermo, explicaba: \"Fue él el que me animó a fundar a las hermanas; él mismo me dijo: \"Es la voluntad de Dios que existan las hermanas. — Pero, le respondí, hermanas ya hay muchas. — Muchas hermanas, pocas misioneras\". Sobre todo subrayaba la intervención del Papa: \"Es el Papa Pío X quien quiso que las fundara; él me dio la vocación para formar misioneras\". Y después recordaba con gusto la conversación mantenida con Pío X, al que le había presentado la dificultad de encontrar personal femenino idóneo y suficiente para las misiones: \"Es necesario —respondió el Papa— que usted mismo cree un Instituto de hermanas misioneras, así como fundó el de los misioneros\"; \"Santidad —se permitió objetar José Allamano— ya hay tantas Familias religiosas femeninas\"; \"Sí, pero no exclusivamente misioneras\"; \"Pero yo, Beatísimo Padre, ¡no siento la vocación de fundar religiosas!\"; \"Si no la tiene, se la doy yo\". El comentario que luego José Allamano hacía a las misioneras era coherente: \"¿Ven? No fui yo quien quiso que existieran, sino el Papa; por lo tanto, tienen que ser papales\".", "s": 1}, {"k": "p", "t": "En los años siguientes, otros campos de trabajo fueron confiados a los Misioneros y Misioneras de la Con-solata, en Etiopía, Tanzania, Somalia, Mozambique. Hoy están presentes en 26 países de África, América, Europa y Asia.", "s": 1}, {"k": "p", "t": "A sus hijos e hijas dedicó las mayores atenciones, a través de contactos personales, cartas, encuentros formativos. Convencido de que a la misión se le debe dar lo mejor, le dio más importancia a la calidad que a la cantidad. Quería evangelizadores preparados, \"santos en modo superlativo\", generosos hasta dar la vida. Su lema era: \"Primero santos, después misioneros\", comprendiendo el \"primero\" no en sentido temporal, sino como valor prioritario y absoluto.", "s": 1}, {"k": "p", "t": "Desde el cielo nos anima y bendice. José Allamano murió el 16 de febrero de 1926 en el santuario de la Consolata. Sus restos hoy reposan en la iglesia de la Casa Madre de los", "s": 1}, {"k": "p", "t": "Misioneros de la Consolata, en Corso Ferrucci, Turín, meta de permanentes peregrinaciones de misioneros y misioneras, así como de amigos de las misiones y de tantos peregrinos. Más que una tumba, el sarcófago de José Allamano es un altar sobre el que se celebra la Eucaristía. Y junto a sus restos, sus hijos e hijas han querido colocar también las de Santiago Camisassa, su fiel colaborador y Cofundador de ambos Institutos.", "s": 1}, {"k": "p", "t": "José Allamano fue beatificado el 7 de octubre de 1990 por Juan Pablo II, quien selló con su autoridad el reconocimiento tributado en vida y después de su muerte, con diferentes apelativos: \"santo de la Consolata\", \"padre providente\", \"formador y maestro del clero\", \"sacerdote para el mundo\". Durante la homilía de la beatificación, el Papa, entre otras cosas, dijo: \"En el momento en el que es incluido entre los beatos, José Allamano nos recuerda que para permanecer fieles a nuestra vocación cristiana es necesario saber compartir los dones recibidos de Dios con los hermanos de todas las razas y de todas las culturas; es necesario anunciar con coraje y coherencia a Cristo a todas las personas que encontremos, especialmente a los que aún no lo conocen\".", "s": 1}, {"k": "p", "t": "En su testamento, José Allamano dejó escrito a los misioneros y misioneras palabras de aliento, que seguramente se pueden considerar como dirigidas a todos los que desean seguir su espiritualidad misionera: \"Por ustedes he vivido tantos años, y por ustedes he consumido bienes, salud y vida. Espero que, al morir, pueda convertirme en su protector desde el cielo\".", "s": 1}, {"k": "h2", "t": "Cronología de José Allamano", "s": 2}, {"k": "cron", "d": "21 de enero de 1851", "t": "Nace en Castelnuovo d'Asti. Sus padres son José Allamano y María Anna Cafasso, hermana de San José Cafasso. Es bautizado en la iglesia", "s": 2}, {"k": "cron", "d": "22 de enero de 1851", "t": "parroquial con los nombres de José Octavio.", "s": 2}, {"k": "cron", "d": "17 de octubre de 1860", "t": "Recibe el sacramento de la Confirmación.", "s": 2}, {"k": "cron", "d": "1861-1866", "t": "Es alumno del Oratorio salesiano y tiene como director espiritual a San Juan Bosco.", "s": 2}, {"k": "cron", "d": "1866-1873", "t": "Estudia Filosofía y Teología en el seminario de Turín. Es ordenado diácono.", "s": 2}, {"k": "cron", "d": "29 de marzo de 1873", "t": "", "s": 2}, {"k": "cron", "d": "20 de septiembre de 1873", "t": "Es ordenado sacerdote.", "s": 2}, {"k": "cron", "d": "21 de septiembre de 1873", "t": "Celebra la primera misa en Castelnuovo.", "s": 2}, {"k": "cron", "d": "1873-1876", "t": "Es asistente en el seminario diocesano de Turín. Obtiene la licenciatura en Teología. Es director espiritual en el seminario. Es agregado como Doctor Colegiado en la Facultad Teológica de Turín. Es nombrado rector del santuario de la Consolata, del Convictorio Eclesiástico y del santuario de San Ignacio. Comienza su servicio como rector del santuario de la Consolata Es nombrado canónico honorario de la Iglesia Metropolitana. Grave enfermedad y curación milagrosa. Desde Rívoli envía la carta para la fundación del Instituto IMC al card. A. Richelmy. Decreto de fundación del Instituto Misiones Consolata.", "s": 2}, {"k": "cron", "d": "30 de julio de 1876", "t": "", "s": 2}, {"k": "cron", "d": "17 de octubre de 1876", "t": "", "s": 2}, {"k": "cron", "d": "12 de junio de 1877", "t": "Septiembre de 1880", "s": 2}, {"k": "cron", "d": "2 de octubre de 1880", "t": "", "s": 2}, {"k": "cron", "d": "10 de febrero de 1883", "t": "", "s": 2}, {"k": "cron", "d": "19-29 de enero de 1900", "t": "", "s": 2}, {"k": "cron", "d": "24 de abril de 1900", "t": "", "s": 2}, {"k": "cron", "d": "29 de enero de 1901", "t": "", "s": 2}, {"k": "cron", "d": "18 de junio de 1901", "t": "Inauguración de la primera Casa Madre (la \"Consolatina\") en Turín. Partida de los primeros cuatro misioneros de la Consolata para el Kenya. Celebraciones por el centenario del santuario de la Consolata. Constitución del vicariado apostólico del Kenya. Apertura de la casa madre en Corso Ferrucci, Turín. \"Decreto de Alabanza\" del Insituto. Fundación del Instituto de las Misioneras de la Consolata. Las primeras 15 misioneras de la Consolata parten para el Kenya. Muerte del cofundador canónigo Santiago Camisassa. Propaganda Fide aprueba definitivamente las constituciones IMC.", "s": 2}, {"k": "cron", "d": "8 de mayo de 1902", "t": "", "s": 2}, {"k": "cron", "d": "11-20 de junio de 1904", "t": "", "s": 2}, {"k": "cron", "d": "28 de junio de 1909", "t": "", "s": 2}, {"k": "cron", "d": "9 de octubre de 1909", "t": "", "s": 2}, {"k": "cron", "d": "28 de diciembre de 1909", "t": "", "s": 2}, {"k": "cron", "d": "29 de enero de 1910", "t": "", "s": 2}, {"k": "cron", "d": "3 de noviembre de 1913", "t": "", "s": 2}, {"k": "cron", "d": "18 de agosto de 1922", "t": "", "s": 2}, {"k": "cron", "d": "7 de septiembre de 1923", "t": "", "s": 2}, {"k": "cron", "d": "20 de septiembre de 1923", "t": "50º aniversario de ordenación sacerdotal. José Allamano va a Roma para la beatificación de José Cafasso. Muerte de José Allamano. Beatificación de José Allamano.", "s": 2}, {"k": "cron", "d": "3 de mayo de 1925", "t": "", "s": 2}, {"k": "cron", "d": "16 de febrero de 1926", "t": "", "s": 2}, {"k": "cron", "d": "7 de octubre de 1990", "t": "", "s": 2}, {"k": "h2", "t": "Introducción", "s": 3}, {"k": "p", "t": "Las charlas de José Allamano a los misioneros y misioneras. Las charlas formativas que José Allamano tenía cada domingo con los misioneros y las misioneras por separado, son una fuente inagotable de la que se pueden extraer una espiritualidad y una pedagogía misioneras de gran importancia. Por la espontaneidad y la sencillez con que fueron realizadas, estas charlas son consideradas más bien conversaciones espirituales que un padre realiza con sus hijos e hijas para prepararlos ante su futura misión. De las mismas se conservan 16 cuadernos de 552 páginas, escritas de puño letra por José Allamano y que él mismo legara a sus dos Institutos.", "s": 3}, {"k": "p", "t": "Al entregárselos al maestro de novicios, el p. José Nepote, dijo: \"Estos Manuscritos de las Charlas contienen mis verdaderos pensamientos\". Mientras José Allamano hablaba, los jóvenes misioneros y misioneras se preocuparon por tomar nota cuidadosamente, logrando transcribir casi en forma literal sus palabras, tal cual fluían de la viva voz del Fundador. José Allamano sabía de la existencia de estas transcripciones y las permitió con comprensión paterna, comentando: \"Contienen la substancia, ya que les hablo espontáneamente\".", "s": 3}, {"k": "p", "t": "Es bello recordar el interés que los jóvenes misioneros y misioneras demostraban hacia las charlas del Fundador. El encuentro de los domingos se había convertido en el evento formativo por excelencia. José Allamano, como padre, se encontraba con sus hijos e hijas, todos jóvenes, que lo conocían y amaban. Los encuentros se realizaban con el espíritu de familia que reinaba en el Instituto. Por eso lo esperaban, esperaban sus palabras, las charlas les resultaban demasiado breves, nadie se aburría. Esta no es una descripción idílica, sino la síntesis de muchos testimonios que demuestran el clima que se había creado en la comunidad cuando él los visitaba los domingos por la tarde. He aquí algunos de ellos: \"Los domingos los dedicaba exclusivamente a sus hijos. Sus charlas no eran ni catedráticas ni rígidas, sino que era el Padre que, sentado en medio de sus hijos, a quienes quería cerca suyo, especialmente a los hermanos, nos hablaba espontáneamente. Eran consejos dichos casi al oído, pero que nos quedaban impresos en el alma y nos empapaban de su espíritu\" (hno. Benito Falda); \"Su celo por nuestra formación y santificación se manifestaba sobretodo en las maravillosas charlas del domingo. Llegaba sonriente, se sentaba, sacaba un pequeño papel, y nosotros nos quedábamos encantados ante sus palabras. ¡Cuánto anhelábamos esos momentos, que para nosotros eran demasiado breves\" (p. Vicente Dolza); \"Periódicamente venía al Instituto a darnos consejos, siempre prácticos y paternos. Nos hablaba con mucha sencillez, claridad y profundidad. No dudaba en hablar de sí mismo cuando quería que nos comportáramos como lo habría hecho él mismo en circunstancias similares …\" (hna. Margarita Demaria); \"A veces venía para la charla del domingo, aun cuando la hemicránea todavía no había desaparecido del todo y nos daba pena, porque se veía claramente cuánto sufría\" (hna. Miguelita Abbà).", "s": 3}, {"k": "p", "t": "Las palabras de José Allamano transmitidas a los que estaban lejos. Una forma de apreciar el pensamiento del Fundador, ya durante su vida, fue el de comunicar sus valiosas palabras a los que estaban lejos. Los alumnos de Turín cada tanto mandaban las transcripciones de las charlas a los hermanos que estaban en África y, durante la guerra, también a los que realizaban el servicio militar. La revista interna de los misioneros, llamada \"Da Casa Madre\" 1 , ya desde su primer número de mayo de 1918, comenzó con una sección titulada \"La palabra del Padre\". Al principio el mismo Allamano escribía una breve carta a sus hijos cercanos y lejanos. En medio de la primera guerra mundial, la palabra del Padre se dirigía sobre todo a los hijos que estaban bajo las armas. No había pasado un año aún cuando esta sección dejó de existir, pero la palabra y el recuerdo del Fundador, en todos los números de la revista, siempre fueron abundantes. Desde noviembre de 1921, \"Da Casa Madre\", que antes era mimeografeado, empezó a salir impreso. A partir de ese momento, la sección \"La palabra del Padre\" reapareció con pasajes de las charlas de los domingos. Después de la muerte de José Allamano, adquirió un significado \"especial\" convirtiéndose en un punto de referencia al que todos recurrían espontáneamente y con frecuencia. En el segundo número de 1926 la sección fue introducida con las siguientes delicadas palabras: \"Nuestro muy venerado Padre y Fundador ya no está entre nosotros, es verdad: en el cielo ahora goza de la merecida recompensa de sus buenas obras; sin embargo, creemos hacer algo que agradará a todos los hermanos al referir algunos pasajes de aquellas queridas y anheladas conferencias que venía a darnos los domingos por la tarde. En la familiaridad de sus palabras sencillas, pero profundas y oportunas para nosotros, para nuestras necesidades, se sentirá de nuevo el eco de su voz con su natural acento e inflexión, que nos hacen revivir tantas horas bellas pasadas", "s": 3}, {"k": "nota", "t": "1 Desde la Casa Madre (n. del tr.).", "s": 3}, {"k": "p", "t": "con Él, y nos bendecirá una vez más con la misma efusión del corazón con la que entonces paternalmente nos bendecía\".", "s": 3}, {"k": "p", "t": "Aproximadamente lo mismo sucedió en el Instituto de las misioneras, que enviaban las copias de las charlas del Padre a las hermanas presentes en las misiones a través de un breve periódico, llamado \"Alle sorelle d'Oltremare, Filo d'oro, Supplemento del Da Casa Madre\". 2", "s": 3}, {"k": "p", "t": "Las transcripciones de sus charlas. Tanto los misioneros como las misioneras siempre demostraron tener una profunda veneración por las enseñanzas del Fundador, apreciándolo mucho en el ámbito de la formación, sobre todo a favor de los jóvenes. De las charlas manuscritas y de las transcripciones verbales se realizaron varias transcripciones taquigráficas. Además de las que se realizaron con motivo de la causa de canonización, las principales transcripciones de las charlas a los misioneros son dos: La primera es la que estuvo a cargo del p. Chiomio en 1938, directamente de los escritos autógrafos. Esta obra fue más tarde controlada por otros misioneros, que garantizaron su autenticidad. En el prefacio, el p. Chiomio escribe: \"La finalidad fue rendirle homenaje filial al Padre de nuestra pequeña obra, iniciada y llevada a término con el objetivo exacto de contrarrestar y preservar de los daños que produce el tiempo y otros peligros, como los incendios, etc., este insustituible Tesoro que contiene las enseñanzas de la Fundación ne pereant scripta Patris [para que los escritos del padre no se perdieran]\".", "s": 3}, {"k": "p", "t": "La segunda transcripción de las conferencias del Fundador es la que estuvo a cargo del p. José Gallea, en ocho volúmenes,", "s": 3}, {"k": "nota", "t": "2 A las Hermanas de Ultramar, Hilo de oro, Suplemento de Desde la Casa Madre (n. del tr.).", "s": 3}, {"k": "p", "t": "entre los años 1947-1966. El criterio observado fue el de fusionar en un solo texto los manuscritos de José Allamano con las transcripciones de sus discípulos. La obra fue realizada con verdadero amor de hijo. En el ámbito de las misioneras, de las 506 charlas conservadas, se realizó una primera edición mecanografiada en dos volúmenes en 1944, en preparación al proceso de beatificación del Fundador.", "s": 3}, {"k": "p", "t": "Síntesis de las enseñanzas de José Allamano. Finalmente el p. Lorenzo Sales, uno de los primeros misioneros que conoció muy de cerca a José Allamano, por expreso pedido de sus superiores se ocupó de una edición de las charlas, que se convirtió en la versión oficial, publicada en dos volúmenes impresos en 1949, con el título \"La Doctrina Espiritual\". En 1962 fue realizada una segunda edición, con el título actual de \"La Vida Espiritual\", en un único volúmen de 898 páginas.", "s": 3}, {"k": "p", "t": "Según sus mismas palabras, en la obra del p. Sales se encuentran las enseñanzas de José Allamano en su conjunto, expresadas con sus mismas palabras. Los temas están presentados según un orden lógico, uniendo lo que el Fundador escribió en sus apuntes y lo que luego dijo de viva voz sobre un determinado argumento, en diferentes circunstancias y momentos. Como la obra fue realizada por los misioneros, todo el discurso fue expresado en género masculino, aun cuando las expresiones habían sido dirigidas a las hermanas.", "s": 3}, {"k": "p", "t": "De la lectura de las páginas de \"La Vida Espiritual\" emerge en forma evidente el objetivo que José Allamano se había propuesto con sus charlas de los domingos: acompañar de cerca de sus discípulos y discípulas durante su preparación misionera y transmitirles su espíritu. El resultado es un valioso tratado de espiritualidad y pedagogía misionera, que conservó intacta su validez hasta el día de hoy. De hecho, estos consejos fueron inspirados, ante todo, por la Palabra de Dios; luego fueron abundantemente enriquecidos por el pensamiento de los Padres de la Iglesia, las enseñanzas de muchos santos y una sana doctrina teológica; por último, fueron completados y actualizados a partir de su experiencia de vida.", "s": 3}, {"k": "p", "t": "La publicación del texto integral de las charlas. Más tarde, durante los años '80, en los dos Institutos surgió la necesidad de acercarse al Fundador en las mismas condiciones en que lo hicieron los primeros misioneros y misioneras, leyendo las conferencias como él mismo las había preparado y pronunciado domingo a domingo y año tras año, desde 1902 hasta 1925. De este modo fue creciendo la necesidad de revivir, también hoy, el mismo clima de los orígenes. Para responder a esta sensibilidad, las conferencias de los misioneros, acompañadas por un índice analítico, fueron publicadas en 1981, a cargo del p. Igino Tubaldo, en tres volúmenes de 2288 páginas en total. Las conferencias a las misioneras, también acompañadas por un índice analítico, fueron publicadas en 1984, a cargo del departamento histórico del Instituto, en tres volúmenes con un total de 1777 páginas. En ambas publicaciones, para la mayor parte de las conferencias, primero fue colocado el manuscrito de José Allamano y luego la transcripción de lo que dijo.", "s": 3}, {"k": "p", "t": "Los Misioneros y las Misioneras de la Consolata agradecen a su Padre por este inestimable don. Tanto los volúmenes de las conferencias como el de la \"Vida Espiritual\" siguen siendo un punto de referencia de indiscutible valor, que ha contribuido en la formación de muchas generaciones de apóstoles. Estos textos contienen la inspiración original de José Alamano tal como fue concebida y transmitida por él. Por este motivo son considerados textos \"sagrados\" y no deben ser modificados.", "s": 3}, {"k": "p", "t": "Origen de este libro. Los dos Institutos, al comenzar el tercer milenio, sintieron la necesidad de releer el pensamiento del Fundador despojado de las formas lexicales así como de las expresiones ascéticas y pedagógicas propias de su período histórico. De hecho, algunos argumentos de los que se ocupaba José Alamano o están superados o han sido profundamente modificados por la renovación conciliar y posconciliar. Hoy ya no pueden proponerse de la misma manera, especialmente a los jóvenes, que tendrían muchas dificultades para comprenderlos en todo su significado, al menos con la forma en la que fueron transmitidos por nuestras fuentes.", "s": 3}, {"k": "p", "t": "Partiendo de estas premisas, y como fruto de una reflexión común, las direcciones generales de los Misioneros y las Misioneras de la Consolata decidieron realizar esta obra, confiando su realización a dos miembros de ambos Institutos, con la colaboración de otros más, que sugirieron específicos criterios de trabajo.", "s": 3}, {"k": "p", "t": "Claves de lectura. Para comprender más fácilmente las páginas de este volúmen que, precisamente, es el fruto de una decisión común de ambos Institutos misioneros fundados por José Allamano, es necesario dar algunas indicaciones, a modo de claves de lectura.", "s": 3}, {"k": "p", "t": "a. La fuente principal de la cual fue tomado el material es \"La Vida Espiritual\", porque en ella está contenida, en modo fiel y ordenado, toda la substancia del pensamiento de José Allamano. Sin embargo, cuando fue considerado útil para completar o volver más comprensible el texto, también se utilizaron algunos párrafos tomados directamente de los tomos de las conferencias, que el p. Sales no había usado.", "s": 3}, {"k": "p", "t": "b. Los Misioneros y las Misioneras de la Consolata estamos unánimemente convencidos de que tanto los tomos de las conferencias como \"La Vida Espiritual\" siguen siendo las fuentes clásicas en las que se encuentran el pensamiento y las enseñanzas del Fundador, por lo que es necesario recurrir a ellas para comprender mejor y profundizar la inspiración original. De esto se deduce que la presente obra no es una reedición, ni una síntesis o una reestructuración de \"La Vida Espiritual\", mucho menos de los volúmenes de las conferencias, si-no una nueva presentación del pensamiento de José Allamano pero que elabora su contenido sólo a partir de esas fuentes. Por lo tanto, el autor de estas páginas es el mismo José Allamano. Es él quien nos habla. De esta manera, el lector toma contacto directo con su palabra y su modo de expresarse y, por ende, con su verdadero espíritu.", "s": 3}, {"k": "p", "t": "c. Ha sido realizado un leve retoque lingüístico, ya que José Alamano, al hablar en forma espontánea, usaba el lenguaje simple de quien conversa familiarmente, in-clusive con alguna influencia del dialecto piamontés. Sin embargo, se conservaron cuidadosamente tanto la formulación como el estilo original de las expresiones.", "s": 3}, {"k": "p", "t": "d. De las numerosas páginas de \"La Vida Espiritual\" fueron elegidos temas actuales, después de un cuidadoso discernimiento, para transmitir con fidelidad el genuino carisma de José Allamano a los obreros de la misión del tercer milenio. Por lo tanto, se evitaron argumentos, palabras y expresiones superados por la renovación eclesial, o excesivamente relacionados con las formulaciones teológicas y ascéticas contemporáneas a José Allamano. Pero cuando se han realizado modificaciones lingüísticas importantes, se advierte oportunamente al lector con una nota explicativa a pie de página.", "s": 3}, {"k": "p", "t": "e. Como ya dijimos, el volumen de \"La Vida Espiritual\" habla en género masculino, no obstante José Allamano haya hablado también al género femenino. Así como en una familia los padres educan tanto a hijos como a hijas en los mismos valores, aun teniendo en cuenta de las diferentes sensibilidades, lo mismo hacía José Allamano con los misioneros y las misioneras. De hecho, daba las conferencias a las dos comunidades por separado, pero con el mismo esquema autógrafo. No trataba argumentos diferentes, porque daba la misma formación misionera tanto a los hijos como a las hijas. Era su forma de expresarse, el tono y las insistencias los que tantas veces cambiaban, como se puede ver en las transcripciones. No estaría mal realizar dos volúmenes como este, uno en género masculino y otro en género femenino, inspirándose en las respectivas conferencias a los misioneros y a las misioneras. Los temas tratados resultarían más o menos los mismos, pero seguramente serían diferentes el clima, la forma de expresarse y las acentuaciones realizadas. Por razones obvias, se decidió reunir todo el material, ofreciéndolo a los hijos y las hijas de José Allamano y a todos los hombres y mujeres que colaboran con ellos. Esto explica por qué en estas páginas el discurso está en general dirigido a todos indistintamente.", "s": 3}, {"k": "p", "t": "f. Con respecto a la metodología, es necesario tener presente que los títulos de los capítulos y de sus subdivisiones no son los originales, sino creados por los responsables de esta edición. Allí donde fue posible los títulos corresponden a frases de José Alamano. Las notas a pie de página son de dos tipos: o presentan a algunos personajes que tuvieron un vínculo particular con José Allamano, o explican el porqué de algunos retoques lingüísticos. En general, en sus manuscritos indicaba muy brevemente la obra de la que tomaba frases de Santos Padres o de autores de ascética. El texto del p. Sales es rico de abundantes notas bibliográficas, a las cuales reenviamos a quien quisiera profundizar científicamente ciertos conceptos. De todos modos, el presente volumen, que no contiene las notas bibliográficas, es acompañado por una bibliografía esencial, y por un índice de las citaciones bíblicas. Por último, un índice analítico. Para facilitar las referencias, se pensó en numerar progresivamente los párrafos principales.", "s": 3}, {"k": "p", "t": "g. Es evidente que el pensamiento de José Allamano es abordable no sólo a través de estas fuentes que contienen sus conversaziones, sino también con la ayuda de otras fuentes publicadas o conservadas en los archivos. Entre las obras publicadas se deben indicar en primer lugar los 11 volúmenes, editados durante los años 1990-2002, con el título \"Quasi una vita\" 3 , a cargo del p. Cándido Bona. Ellos contienen todas las cartas escritas o recibidas por José Allamano, junto a un importante comentario. Además, no es menos importante la selección de las cartas dirigidas sólo a los misioneros y las misioneras, publicadas en un volumen en 2004 a cargo del p. I. Tubaldo, que no posee comentarios. Entre los principales escritos conservados en los archivos se deben señalar las conferencias formativas y las notas para las clases de teología moral a los sacerdotes del convictorio ; diferentes homilías realizadas a los clérigos del seminario mayor diocesano, la explicación del Reglamento, los apuntes para las ceremonias, agendas o \"memoriales\" sobre la vida del seminario; algunas homilías a los fieles en diferentes circunstancias; por último, documentaciones variadas: tres capítulos para la biografía del tío José Cafasso, una novena a la Consolata, el diario de su peregrinación a Roma y a otras localidades de Italia, etc.", "s": 3}, {"k": "p", "t": "Destinatarios. Los destinatarios privilegiados del pensamiento de José Allamano contenido en esta obra, necesariamente", "s": 3}, {"k": "nota", "t": "3 \"Casi una vida\" (n.del tr.).", "s": 3}, {"k": "p", "t": "son los misioneros y las misioneras en formación, para los que hoy es difícil, por diferentes motivos, acercarse a los textos integrales de \"La Vida Espiritual\" y de las conferencias, sin verse en la obligación de tener que recibirir siempre explicaciones de sus formadores para comprender mejor su sentido. Evidentemente, también está destinado a los hermanos y hermanas de ambos Institutos, así como a los laicos misioneros de la Consolata. Es indudable que el contenido de este texto, expresión espontánea de la experiencia espiritual de un hombre de Dios, podrá ser útil también a sacerdotes, religiosos, religiosas y a todos los que deseen conocer y vivir su espíritu.", "s": 3}, {"k": "p", "t": "Es nuestro deseo que todos los que se acerquen a las páginas de este libro sientan el deseo de conocer más profundamente a José Alamano, recurriendo a las fuentes completas que las inspiraron.", "s": 3}, {"k": "h2", "t": "1. Misioneros y misioneras sí, pero santos", "s": 4}, {"k": "h3", "t": "Santidad y misión del Instituto", "s": 4}, {"k": "p", "t": "1. \"Esta es la voluntad de Dios: que ustedes sean santos\" (1Tes 4,3). Dios pide santidad y la pide a todos, inclusive a los simples cristianos que pueden alcanzarla viviendo los mandamientos de Dios y de la Iglesia, practicando las virtudes cristianas y realizando las obligaciones propias del estado de vida de cada uno. Si esa es la voluntad de Dios para todos los cristianos, ¿qué podemos decir de nosotros que recibimos de Dios la más santa de las vocaciones?", "s": 4}, {"k": "p", "t": "Mi más grande y constante preocupación es esta: la santificacion de ustedes. De hecho, no basta con haber recibido de Dios una vocación tan especial, así como no basta con gozar de sus virtudes y beneficios. Es necesario apreciarla caminando en la perfección que ella requiere. Por eso éste es nuestro ideal: llegar a ser santos, grandes santos, muy pronto santos.", "s": 4}, {"k": "p", "t": "Como religiosos y religiosas, ustedes tienen el deber particular de corresponder a la vocación. Con esto no quiero decir que tengan que ser perfectos ya cuando ingresan, sino que tienen el compromiso de buscar la santidad con decisión y constancia. Como sacerdotes o aspirantes al sacerdocio están llamados a ser más santos aún. San Pablo pedía que sus pastores fueran irreprensibles y un ejemplo de todas las virtudes", "s": 4}, {"k": "p", "t": "(cf Tit 2,7). Como misioneros y misioneras se les propone el ideal de ser no sólo santos, sino santos en modo superlativo. Ustedes están aquí para esto, es su primer deber, el primer fin de su vocación, el primer instrumento de apostolado. Su santidad debe ser especial, inclusive heroica y, si fuera necesario, extraordinaria hasta el punto de hacer milagros. Para ustedes no son suficientes las otras dotes. Se necesita la santidad, una gran santidad.", "s": 4}, {"k": "p", "t": "2. Abrazar el fin del Instituto. El fin primario del Instituto es la santificación de sus miembros. Quien viene aquì lo hace para abrazar este fin. En las Constituciones 1 la referencia a la santificación de los miembros del Instituto no fue puesto porque sì, sino para que se convierta en realidad en la vida concreta. Las Contituciones no bajaron del cielo, pero tienen el mismo peso como si de allí provenieran. Son el fruto de la experiencia, de estudios serios sobre muchas otras reglas, de oraciones especiales, revisadas y aprobadas, además, por la autoridad de la Iglesia. Recíbanlas como de las manos de Dios. Este espíritu de fe los ayudará a apreciar cada palabra, a amarlas y a observarlas fielmente.", "s": 4}, {"k": "p", "t": "Si realmente quieren hacerse santos, el Instituto les ofrece los medios para lograrlo. También los propios límites y los de los demás pueden ayudarlos a alcanzar esa meta. Como afirma san Pablo: \"Nosotros sabemos que todo contribuye al bien", "s": 4}, {"k": "nota", "t": "1 José Allamano se refería al texto de las Constituciones de los Misioneros de la Consolata de 1909, art 1: \"El Instituto tiene por finalidad: primero la santificación de sus miembros mediante la observancia de los votos religiosos y de sus Constituciones; […]\"; así como en las Constituciones de las Misioneras de la Consolata de 1913, art 1: \"El Instituto tiene como finalidad: primero, la santificación de las Misioneras mediante la observancia de los votos religiosos y de las Constituciones; […]\".", "s": 4}, {"k": "p", "t": "de los que aman a Dios, al bien de los que fueron llamados según sus designios\" (Rom 8,28). Y ustedes están entre los que fueron llamados a la santidad, y a una santidad especial. Por lo tanto, obren de tal manera que todo, incluidos sus defectos y los de los demás, sirvan para su propio bien.", "s": 4}, {"k": "p", "t": "Fìjense que las Contituciones están escritas en plural: santificación de los misioneros y de las misioneras. En el Instituto todo está pensado para que cada uno de ustedes sea santo. No algunos, sino todos. De esto se deriva que cada uno deba trabajar, no sólo por la propia santidad, sino también por la de los demás. De este modo, toda la comunidad se empeña en la santidad de cada miembro y cada miembro se ocupa de la santidad de toda la comunidad. Por lo tanto, quien no se hace santo, además que a sí mismo, le hace un daño al Instituto, porque está restándole importancia al fin del mismo. Con frecuencia, algunos obran demasiado por cuenta propia, se interesan sólo de sus cosas, sin pensar en ayudar a los demás. Este no es el espíritu de familia, tan necesario en una comunidad, en cuanto ayuda a todos a santificarse a sí mismos y a los demás. Sì, cada uno de ustedes tiene que hacerse santo, pero es necesario que haya ayuda recíproca. Tenemos que desear la santidad de los demás tanto como la nuestra.", "s": 4}, {"k": "p", "t": "Además es necesario no dejarse arrastrar por los menos fervorosos o por consideraciones puramente humanas. No digan que no les toca a ustedes ser los primeros en el fervor, en la puntualidad, en la observaciòn de las reglas. Que cada uno empiece por sí mismo. Si pretendo que los demàs sean perfectos, es justo que trate de serlo yo también. ¿No les parece que si cada uno se propusiera esto, en poco tiempo serían todos santos? Que todos, hasta el último que llegó a la comunidad, caminen firmemente hasta alcanzar las virtudes, sin miedo de parecer raros ante los demàs o de ser señalados por eso.", "s": 4}, {"k": "p", "t": "3. Primero santos, después misioneros. Están aquí para ser Misioneros y Misioneras de la Consolata. No pueden serlo sino viviendo y obrando según el fin del Instituto, que es la santificación de sus miembros y la evangelización de los pueblos. Es lo que permanentemente les repito: las personas se salvan con la santidad 2 . Es decir, querer que los demàs sean buenos sin serlo nosotros es pretender algo imposible. Nadie puede dar lo que no tiene. Podríamos dar un sacramento aun sin ser santos, pero convertir personas no. Normalmente Dios no concede el poder de tocar los corazones de los demás a quien no está unido a él con una caridad muy grande, hasta el punto de poder pretender que haga milagros. Crean en esto: quien no arde, no incendia, quien no tiene el fuego de la caridad, no puede comunicarlo. Para dedicarse a los demás no es necesario descuidar la unión con Dios y sacrificar la propia santificación.", "s": 4}, {"k": "p", "t": "Si alguien dijera: \"!Vine para hacerme misionero y nada más!\", estaría equivocado. No, no es suficiente. Es importante no invertir el orden: primero nuestra santificación, luego la conversión de los demás. Misioneros y misioneras, sí, pero santos. Que cada uno piense en el compromiso que asumió al entrar en el Instituto; que piense en la voz de Dios que lo llama a ser santo. Cada día en la santa comunión y en la visita", "s": 4}, {"k": "nota", "t": "2 Para no traicionar el pensamento de José Allamano es necessario aclarar dos cosas. En primer lugar: cuando él, siguiendo el lenguaje de la época usaba la palabra \"almas\", seguramente se refería a \"personas\", término más adecuado según el uso actual y que algunas veces es empleado en estas páginas. En segundo lugar: cuando usaba la expresión \"convertir con la santidad\", que en estas páginas ha sido conservada, se refería a la tarea de evangelizar sobre todo con el testimonio de la santidad de vida.", "s": 4}, {"k": "p", "t": "a Jesús sacramentado renueven este propósito y díganle: quiero hacerme santo, quiero ser un gran santo, quiero ser santo muy pronto. Lo puedo, lo debo, por lo tanto, lo quiero. Entonces, primero santos, después misioneros. 4. No una santidad por capricho. La santidad a la que aspiran como Misioneros y Misioneras de la Consolata no debe ser una santidad por capricho, haciendo cada uno lo que más le gusta, sino una santidad que se traduce concretamente en el camino indicado por las Constituciones y por las directivas de los legítimos superiores.", "s": 4}, {"k": "p", "t": "La santidad es una sola, pero diferentes son las formas y los caminos para alcanzarla. Por ejemplo, se equivocaría quien preparándose a ser religioso-misionero quisiera seguir las reglas de los Cartujos o de los sacerdotes diocesanos. Cada instituto tiene sus características y sus propios medios de santificación.", "s": 4}, {"k": "p", "t": "Yo veo en la comunidad una santidad demasiado común y sin sin ser fortalecida por las dificultades. Me explico: ustedes son buenos, piadosos, obedientes cuando todo funciona según su voluntad, pero si se les hace una observación, algo que contrasta con sus deseos, entonces aparece la debilidad de la virtud. La santidad exige energía. \"Progresarás en la medida en que te esfuerces\", dice la Imitación de Cristo. Además me gustaría que la santificaciòn de ustedes fuera una cosa seria y sólida, sin altibajos. Por lo tanto, que sea este nuestro propósito: dedicarse enseguida, con todas las fuerzas, a alcanzar la santidad, no con deseos efímeros, sino comprometiéndose concretamente en las pequeñas dificultades de cada día, tratando de superarlas. Sean fuertes y constantes en el tipo de vida santa que eligieron. No será premiado el que empezó bien, sino el que persevere hasta el final.", "s": 4}, {"k": "p", "t": "5. Extraordinarios en lo ordinario. La santidad que yo quisiera para ustedes no es que hagan milagros, sino que hagan todo bien. En el Evangelio leemos que, después del milagro realizado por Jesús en la curación del sordomudo, la gente asombrada exclamó: \"Todo lo hizo bien\" (Mc 7,37). ¿No les parece que, como consecuencia del milagro, habría debido exclamar, como en otras ocasiones: \"Vimos cosas extraordinarias\"? (Lc 5,26). En cambio dijo: \"!Todo lo hizo bien!\" Con estas palabras la gente le hizo a Jesùs el mejor de los elogios, porque afirmaron que hacía todo bien no sólo en las cosas extraordinarias, sino también en las comunes y corrientes. Estas tres palabras deberían ser escritas en las paredes de nuestras casas y el día de nuestra muerte se deberían poder escribir sobre nuestra tumba: Bene omnia fecit, todo lo hizo bien.", "s": 4}, {"k": "p", "t": "Ya me quedan pocos años, pero podrían ser muchos; por eso quiero vivirlos haciendo el bien, y haciéndolo bien. 3 Yo pienso, como José Cafasso, 4 que el bien hay que hacerlo bien y sin ruido. Hacer el bien con disponibilidad, con exactitud, con buena voluntad. No basta rezar el rosario, hay que rezarlo bien. Si estudiamos, estudiamos bien. Si trabajamos, trabajamos bien y lo mismo para todas las actividades del día.", "s": 4}, {"k": "nota", "t": "3 José Allamano pronunció estas palabras el 28 de octubre de 1906, a los 55 años vivendo aùn casi 20 años: un largo camino en el que hizo bien el bien.", "s"
