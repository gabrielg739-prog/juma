a nosotros mismos para la misión. Lo que se puede hacer hoy no hay que dejarlo para más adelante o para mañana. Los que no arden de este fuego divino, ¡nunca serán misioneros o misioneras!", "s": 10}, {"k": "p", "t": "Nuestro compromiso apostólico, además, debe ser completado, perfeccionado por la ciencia. De esto ya les he hablado. Es necesario saber y, por lo tanto, estudiar; desde ahora debemos adquirir los conocimientos necesarios, sin esperar la ciencia infusa. Un párroco me escribía: \"Aquí tenemos a un seminarista que no es muy inteligente, pero para ser misionero alcanza\". ¡En absoluto! Para ser misionero no basta; que se lo guarde. En las misiones también es necesaria la ciencia.", "s": 10}, {"k": "p", "t": "Por último, el verdadero apóstol es estable gracias a la paciencia y la constancia. Constancia, sin desanimarse cuando los resultados son escasos. San Bernardo afirma que \"Dios pretende de ti el cuidado, no la curación\", es decir espera la evangelización, no la conversión de las personas, que es su tarea. Deseen hacer el bien y suspiren por el día en que podrán hacerlo. Sí, deseen y suspiren por el día en el que podrán partir hacia las misiones, con tal de que todo ello sea en vistas de la evangelización. Hay lugar y trabajo para todos, ¡quédense tranquilos! Por lo tanto, ¡ánimo! El Señor tiene sed de almas y a ustedes les toca saciar esa sed. Él quiere que todos lleguen al conocimiento de la verdad y se salven, pero quiere que lleguen por medio de ustedes. ¡Reflexionemos sobre esta voluntad de Dios! Sí, llénense desde ahora de estos sentimientos; prepárense para las misiones con la oración, el estudio, el trabajo; den importancia a todo, porque un día todo les servirá para hacer el bien.", "s": 10}, {"k": "p", "t": "Durante la adoración eucarística cantamos el salmo 116, que tiene un significado misionero. Él es como un dúo entre los pueblos y los evangelizadores. En el primer versículo los pueblos son invitados a rendir gloria a Dios: \"Alaben al Señor, todas las naciones, glorifíquenlo todos los pueblos!\" (v. 1). En el segundo versículo está contenido el reconocimiento de la misericordia del Señor: \"Porque es inquebrantable su amor por nosotros, y su fidelidad permanece para siempre\" (v.2). Todos juntos, ellos y nosotros, nos unimos con gloria en un canto de alabanza y agradecimiento a Dios por el llamado de los pueblos a la fe.", "s": 10}, {"k": "h3", "t": "Mansedumbre", "s": 10}, {"k": "p", "t": "123. Jesús es nuestro modelo de vida. La excelencia de la mansedumbre aparece en modo evidente en las enseñanazas y ejemplos de Jesús: \"Aprendan de mí, porque soy paciente y humilde de corazón\" (Mt 11,29). Basta abrir el Evangelio para ver cómo Jesús amó y practicó la mansedumbre. Los Judíos dicen que está endemoniado y Él se limita a responder: \"Yo no estoy endemoniado\" (Jn 8,49). Durante la pasión calla y, si habla, sus palabras son serenas: \"¿Por qué me pegas?\" (Jn 18,23). También con los apóstoles, ¡cuánta mansedumbre! A Judas, en el Getsemaní, le dice: \"Amigo, ¡cumple tu cometido!\" (Mt 26,50). Según san Pablo, la mansedumbre fue la característica de Jesús: \"Yo mismo los exhorto por la mansedumbre y la benevolencia de Cristo\" (2Cor 10,1). También san Pedro resalta esta virtud de Jesús, el cual \"cuando era insultado, no devolvía el insulto\" (1Pe 2,23). El mismo Isaías representa al mesías como un manso cordero: \"Al ser maltratado, se humillaba y ni siquiera abría su boca: como un cordero llevado al matadero, como una oveja muda ante el que la esquila, él no abría la boca\" (Is 53,7). Por lo tanto, Jesús se presenta a nosotros como modelo de mansedumbre a aceptar e imitar. Créanlo, esta virtud es muy necesaria para los misioneros y misioneras.", "s": 10}, {"k": "p", "t": "124. Necesidad de la mansedumbre en las misiones. Cuando estén en las misiones la mansedumbre tendrá para ustedes una importancia extraordinaria. Ahora les parece que son mansos, pero ¿qué sucederá cuando estén en las misiones? Algunos son blandos de carácter y creen que son mansos. Pero no basta con tener el carácter, también hay que tener la virtud. Algunos episodios de violencia en el pasado han alejado a las personas. Permítanme que yo, con auténtico dolor, desapruebe a un misionero nuestro porque, no obstante mis permanentes recomendaciones, llegó a hablar duramente y hasta a pegarle a alguien del lugar. Lloré al recibir la noticia y le pedí al Señor que hiciera olvidar a esa persona la mala impresión. También un misionero anotaba en el diario de la misión: \"Todavía se recuerda la falta de mansedumbre de un sacerdote\". No nos engañemos confundiendo el ardor apostólico con nuestra pasión. A veces nos parece una ira justa, pero no lo es. Para mí la mansedumbre es muy importante. La experiencia demuestra que los misioneros y las misioneras cuanto más mansos son, más bien hacen. No olviden nunca cuánta importancia le doy a esta virtud. 125. Trabajar el propio corazón. La mansedumbre es una virtud moral necesaria en las relaciones con los demás y en vistas del bien que queremos brindarles. El Señor dice: \"Felices los pacientes porque recibirán la tierra en herencia\" (Mt 5,5). Esto significa que serán dueños de su propio corazón y, después, del corazón de los demás y hasta del corazón de Dios. Pídanle al Señor un buen conocimiento de esta virtud y que los ayude a apreciar su importancia.", "s": 10}, {"k": "p", "t": "La mansedumbre es contraria a la ira. Santo Tomás define a la mansedumbre: \"la virtud que modera la ira según la recta razón\", es decir la tiene dentro de sus justos límites: que no sea demasiada, ni fuera de lugar o de tiempo. Es una virtud difícil que requiere tiempo, esfuerzo, violencia. Para adquirirla es necesario combatir, enfrentando, o al menos no evitando, ciertas ocasiones. San Basilio considera la mansedumbre \"la virtud más elevada\", es decir la más importante para quien está en contacto con el prójimo.", "s": 10}, {"k": "p", "t": "Escuchemos las palabras de san Pablo a Tito: \"Recuérdales [...] que no injurien a nadie y sean amantes de la paz, que sean benévolos y demuestren una gran humildad con todos los hombres\" (Tit 3,2). Toda la mansedumbre posible al hablar, al obrar y en toda ocasión. Y esto siempre, cuando se está de buen o de mal humor, en las alegrías y en las penas. Y hacia todos, incluso hacia las personas más indiscretas. San Pablo continúa: \"También nosotros antes éramos insensatos\" (Tit 3,3), es decir, teníamos los mismos defectos. Si por la gracia de Dios ahora nos hemos liberado de ellos, sepamos comprender a los demás. Este es el largo y fuerte empeño formativo al que están llamados desde ahora, si quieren ser mansos en todo momento. Estén atentos al modo en que reaccionan en medio de las pruebas que encuentran ahora, para así entrenarse y enfrentar con éxito las pruebas más grandes que hallarán en las misiones.", "s": 10}, {"k": "h3", "t": "Energía y constancia", "s": 10}, {"k": "p", "t": "126. Seguir adelante con energía. En las montañas los caminos tienen muchas curvas; son más transitables, pero alargan el trayecto. Si, en cambio, uno va en línea recta, es verdad que cuesta más, pero alcanzará la meta en menos tiempo. Lo mismo sucede en el camino de la santidad: no hay que dejarse estar, sino despertarse y continuar con energía.", "s": 10}, {"k": "p", "t": "A veces nos lamentamos por no sentirnos a gusto. Se entiende, somos fríos, no somos generosos. Nos gustaría que el Señor nos hiciera santos sin nuestra cooperación; ¡esta no es energía espiritual! Estamos hechos así: proponemos, pero no siempre demostramos poner la misma energía en todas las cosas.", "s": 10}, {"k": "p", "t": "Nuestra vida vale en la medida en que es activa para nosotros y para los demás. Tantas veces nos gustaría estar una hora ante Jesús Sacramentado, en cambio estamos sólo unos pocos minutos y luego vamos a trabajar. Yo sonrío cuando escucho decir que hay tanto trabajo. Más trabajo hay, más se trabaja; pero hay que trabajar con energía, que es la característica del misionero. Un verdadero misionero y una verdadera misionera saben duplicar las fuerzas. Si somos activos, siempre tendremos tiempo para todo y hasta de sobra. 127. Valorizar el tiempo. Estimemos y valoricemos tanto el tiempo para que no perdamos ni siquiera una mínima parte del mismo. San Bernardo dice que no hay nada más valioso que el tiempo, y agrega que también es el menos apreciado. Lamentablemente nosotros no lo valorizamos lo suficiente, no pensamos que cada minuto tiene un valor inmenso para la eternidad. Los santos tenían muy en cuenta este don de Dios.", "s": 10}, {"k": "p", "t": "Podemos perder el tiempo de diferentes maneras, y harían bien en examinarse al respecto. Se puede perder el tiempo haciendo el mal, siendo ociosos, no obrando el bien que se debe, o no haciéndolo como Dios quiere. Por lo tanto, que nuestro propósito común sea valorizar el tiempo. Si lo hacemos ahora, un día podremos cosechar buenos frutos.", "s": 10}, {"k": "p", "t": "Benito Cottolengo, como canónigo en el \"Corpus Domini\", habría podido llevar adelante una vida tranquila: rezar el breviario, pasear, cenar sin preocupaciones... En cambio ustedes saben cuánto ha hecho. Yo también podría vivir más tranquilo: ir al coro de los canónigos, luego a almorzar, después leer el periódico, más tarde descansar... y luego... ¡me moriría desquiciado! ¿Esta es la vida que debemos conducir? ¡Estamos destinados a amar al Señor y debemos hacer el bien, el mayor bien posible! ¡Trabajar, trabajar, porque la vida es corta! El Señor distribuye sus gracias según el esfuerzo que quiere hacer cada uno. En las misiones se puede perder el tiempo o hacer el bien. Hacer las cosas bien sí, pero con soltura. Examínense sobre lo que hacen y sobre lo que podrían hacer. 128. Un alto grado de fortaleza. El misionero y la misionera necesitan un alto grado de fortaleza, que les permitirá ganar aquellas batallas que tratarán de abatirlos. Sin un ánimo fuerte es fácil dejarse dominar por melancolías inútiles. La virtud no debe vacilar ante pequeñeces, como el calor, el frío, un malestar. Si no son fuertes aquí, tampoco lo serán en las misiones. Con frecuencia, por un pequeño malestar, por una insignificancia, ya no se hace todo el bien que se debería y se piensa en un montón de curas que creemos necesarias. Esos pequeños caprichos, pequeños deseos, hay que superarlos, porque después se agravan. No quiero que piesen en las futuras cruces poéticamente, como hacen algunos que piensan y dicen: \"¡Ah, haré esto, haré aquello...! Y al final no hacen nada. En la comunidad es desagradable obrar por costumbre: debemos despertarnos, se necesita energía. Los misioneros santos no son voluntades a medias. ¡El fin del Instituto es formar misioneros y misioneras heroicos! No hay infelicidad mayor que vivir en comunidad tibiamente. El Señor no favorece la pereza. ¡En el camino de la perfección no debemos arrastrarnos débilmente, sino con energía!", "s": 10}, {"k": "p", "t": "El error mayor creo que sea creer que nos hemos entregado totalmente al Señor. Se es virtuosos mientras no sucede nada que nos ponga a prueba, pero basta un contratiempo para derribar una montaña de santidad. Que cada uno diga: ¡cueste lo que cueste, quiero responder al llamado y ser todo de Dios y que mi vida no sea sólo veleidad, sino voluntad! Ya les he recordado lo que decía san Francisco de Sales: \"¡Si en mi corazón descubriera tan sólo una fibra que no fuera para el Señor, la arrancaría sin piedad!\". ¡Cuántas fibras tenemos en nuestro corazón! La fibra de la soberbia, de la gula, de los celos, de las faltas de caridad. Es necesario trabajar para cortarlas a todas. La energía es el don que el Señor da a quien lo ama. ¡Ánimo! 129. Con constancia. En el trabajo misionero es necesaria la estabilidad. Vale más un bien pequeño hecho con constancia, que emprender tantas obras grandiosas y dejarlas por la mitad. La constancia es una característica del misionero y de la misionera. San Pablo nos anima a correr para poder alcanzar la meta (cf. 1 Cor 9,24). Nosotros corremos algunos días, después reducimos la velocidad, nos cansamos. ¡Ah, la estabilidad del espíritu! ¡Estar un día llenos de entusiasmo y otro ser completamente débiles, no sirve! Cuando sabemos que debemos hacer una determinada cosa, hay que hacerla hasta el final. Hay que saber dominarse, para ser siempre estables.", "s": 10}, {"k": "p", "t": "La parábola del grano de mostaza (cf. Mt 13,31-35) puede ser aplicada al modo en que se hacen las pequeñas cosas en la comunidad; muy pequeñas, pero de un gran valor ante Dios, porque están hechas por amor a él. Tenemos que hacerlas con constancia; no un día sí y otro no. Para hacer las cosas importantes estamos dispuestos, pero ante las pequeñas actividades cotidianas nos cansamos fácilmente. Hoy hacemos todo bien... obediencia perfecta... caridad cordial..., pero mañana... ya no tenemos constancia. Sin embargo nuestra santificación consiste precisamente en eso, en hacer todas las pequeñas cosas bien y siempre.", "s": 10}, {"k": "p", "t": "El card. Cayetano Bisleti apreciaba mucho a José Cafasso y decía: \"Nunca vi a un santo como él\". El heroísmo de su virtud consiste en la constancia. El heroísmo no consiste en hacer milagros, sino en el esfuerzo constante, en querer hacer siempre el bien, en no perder el tiempo. Muchos quieren santificarse, pero son pocos los que lo desean constantemente, todos los días. Recuérdenlo, la santidad exige constancia, una voluntad firme. Quien quiera hacerse santo sólo debe corresponder cada día y cada hora a las gracias que recibe de Dios; ser fiel desde la mañana hasta la noche, y no ceder a la melancolía o a los caprichos. Debemos servir al Señor con fidelidad constante y enérgica. Para formar a un verdadero misionero, a una verdadera misionera, se necesita espíritu y voluntad, constancia indefectible y equilibrio de espíritu.", "s": 10}, {"k": "h3", "t": "Amor como en una familia", "s": 10}, {"k": "p", "t": "130. Un corazón grande. El amor a Dios y al prójimo son dos virtudes tan unidas entre sí que pueden considerarse un solo amor. El amor al prójimo debe ser sobrenatural, es decir partir de Dios y volver a Él. El que ama al prójimo lo ama en Dios y por Dios. De esto se desprende que quien ama a Dios, necesariamente ama también al prójimo. Por lo tanto, no se tiene verdadero amor al prójimo cuando se ama por simpatía, por interés o por pasión. El amor al prójimo es un precepto que el Señor llama \"suyo\" y \"nuevo\": \"Este es mi mandamiento: Ámense los unos a los otros, como yo los he amado\" (Jn 15,12). \"Les doy un mandamiento nuevo: ámense los unos a los otros. Así como yo los he amado, ámense también ustedes los unos a los otros\" (Jn 13,34).", "s": 10}, {"k": "p", "t": "San Gregorio Magno dice que quien no ama al prójimo no puede dedicarse a la evangelización. San Lorenzo Justiniani le da la razón, diciendo que esto es esencialmente un servicio de caridad; ¿cómo puede comunicar el fuego que no posee? El misionero y la misionera deben tener un corazón grande, lleno de compasión hacia sus hermanos. ¿Acaso no fueron inducidos a abrazar la vida misionera por el deseo de hacer el bien al prójimo y de salvar las almas?", "s": 10}, {"k": "p", "t": "En los sacerdotes, particularmente, todo lleva al amor del prójimo: el altar sobre el que, como víctimas de expiación, se ofrecen ellos mismos al Señor para la remisión de sus pecados y de los del pueblo; el sacramento de la Reconciliación, donde ejercen una caridad paciente y compasiva; y lo mismo en todos los demás servicios. El sacerdote, y mucho más el misionero, es el hombre de la caridad.", "s": 10}, {"k": "p", "t": "\"La caridad no piensa mal de los demás\" (1 Cor 13,5). No hablo de los pensamientos y los juicios que nos pasan por la mente, que es mejor ahuyentar o no darles importancia. Me refiero a los juicios voluntarios, permitidos, especialmente los temerarios. Pasamos por alto tantas buenas cualidades del prójimo para después detenernos en un pequeño defecto. Con frecuencia juzgamos algunas intenciones que sólo Dios puede juzgar: \"El hombre ve las apariencias, pero el Señor ve el corazón\" (1 Sam 16,7). En cambio, aun cuando vemos algo que es evidentemente malo, deberíamos disculpar la intención, la ignorancia o la inadvertencia. Nuestro Señor nos ha advertido diciendo: \"No juzguen y no serán juzgados, no condenen y no serán condenados\" (Lc 6,37). Y la Imitación de Cristo dice: \"Mírate a ti mismo y no juzgues lo que hacen los demás\". San Francisco de Sales decía: \"Si una acción tiene cien caras, hay que observar la que está mejor\". ¡Cuántas veces vemos la paja en el ojo del hermano y no nos damos cuenta de la viga que tenemos en el nuestro! \"La medida con que ustedes midan también se usará para ustedes\" (Lc 6,38).", "s": 10}, {"k": "p", "t": "Sobre todo no hablen mal del prójimo. Es fácil criticar pero, después, ¿cómo reparamos el daño? Nunca nos arrepentiremos de haber hablado poco, pero sí de haber hablado demasiado. Hay tantas cosas buenas que se pueden decir sin hacer el mal. Ustedes siempre pueden dar un buen consejo, una palabra de consuelo, de ánimo, sobre todo el buen ejemplo y la oración.", "s": 10}, {"k": "p", "t": "Muchas veces se cuenta lo que se oyó sin exactitud, provocando inconvenientes. ¡Sucede tan seguido! A veces se hace sin malas intenciones, pero la verdad es que no se transmiten las cosas tal cual son: o se dice algo diferente o se agrandan. Cuánto daño puede producirse en una comunidad por parte de uno o dos que comunican mal las cosas. Que nuestros discursos sean prudentes. No todo lo que es verdad debe ser dicho, algunas cosas es mejor no decirlas. Además, seamos caritativos: ¡con qué facilidad se falta a la caridad cuando se habla de los demás! 131. Amarse como hermanos y hermanas. Hablar de caridad entre nosotros parece casi una ofensa. Sin embargo, nuestro Señor repitió muchas veces el precepto de la caridad fraterna. San Juan no hacía más que recomendar la caridad mutua, hasta el punto de ser llamado el Apóstol de la caridad. En sus últimos años de vida, no hacía más que repetir: \"Hijos, ámense los unos a los otros\". Y a los discípulos, que se lamentaban por tener que escuchar siempre las mismas palabras, respondía: \"En esto está todo; ¡si hacen esto, lo hacen todo, porque es el precepto del Señor!\". San Juan Crisóstomo, refiriendo el hecho, comenta: \"¡Una sentencia breve pero grande, importante, conclusiva!\". Yo haré como san Juan, repetiré siempre lo mismo, así lo recordarán cuando estarán en las misiones.", "s": 10}, {"k": "p", "t": "Todos los fundadores de institutos religiosos siempre pedían a sus hijos e hijas que vivieran la caridad recíproca, sobre todo hacia el final de sus vidas. Yo hago lo mismo; y este es el último recuerdo que confío a los misioneros y misioneras que parten a las misiones. Si vinieran aquí a preguntarnos: \"¿Viven la caridad?\", responderemos: \"¡Sí, sí, y caridad perfecta!\". Un día, justamente, le hice esta pregunta a la superiora de nuestras hermanas. Parecía como si desconfiara de ella... pero yo soy el hombre de los miedos, dudo siempre. Quiero poder decir: \"Nos faltarán tantas otras virtudes, pero la caridad no\". Desde el paraíso mandaré rayos si veo que faltan a la caridad.", "s": 10}, {"k": "p", "t": "Siempre habrá dificultades en el diario vivir, pero hay que estar atentos y no estropear el encanto de la caridad. No se ilusionen: si no viven la caridad aquí, tampoco la vivirán en las misiones. Si no se enriquecen ahora de la verdadera y perfecta caridad, después darán un testimonio negativo. Quiero que vivan la caridad intensamente. No podrán amar al prójimo lejano si desde ahora no tienen caridad hacia aquellos con los que tratan todos los días. Si no basan sus vidas en la caridad fraterna, en ciertas circunstancias no sabrán superar las dificultades, y sentirán la tentación de pedir ser cambiados de casa ¡o de que cambien a tal hermano o hermana de comunidad ¡Ni hablar de cambios! Cambia tú y todo estará en su lugar. Por lo tanto, hagamos un examen serio sobre la caridad fraterna, sobre la caridad actual, entre nosotros, no sobre la caridad futura o del prójimo que encontraremos más adelante.", "s": 10}, {"k": "p", "t": "Un párroco una vez fue a verlo al padre Cafasso para que le asignaran un vicario, pero tenía que ser como quería él. Cafasso escuchó todas las bellas cualidades que aquel párroco deseaba que tuviera el nuevo vicario, luego le respondió: \"Mire, señor párroco, a pocos pasos de aquí, frente a la plaza del Seminario, hay una fábrica de estatuas; ¡vaya y hágase una como más le guste a usted!\". ¿A ustedes les parece? ¡Hay que aceptar a los demás como son! ¿Significa que si uno tiene defectos ya no puede estar en ningún lugar? Si un misionero o una misionera pretendiera hacer sólo y siempre todo lo que le gusta, nunca estará de acuerdo con los hermanos y hermanas de su comunidad. Hay que tener un poco de paciencia, un poco de condescendencia, y ver si la caridad tiene todas las características descriptas por san Pablo: si no es ambiciosa, si no se busca a sí misma, etc. No quiero que entre ustedes haya siquiera una mínima falta contra la caridad. Querer del mismo modo a todos, estar dispuestos a dar la vida por los hermanos y hermanas.", "s": 10}, {"k": "p", "t": "Los primeros cristianos eran un solo corazón y una sola alma. Cuando repartían los bienes que les llevaban a los", "s": 10}, {"k": "p", "t": "Apóstoles, no se daba una cantidad fija a cada uno, sino según la necesidad de cada uno. También de este modo se garantizaba la igualdad. Pretender la igualdad en sentido absoluto es un error. 132. Los signos de la caridad fraterna. Los cuatro signos para saber si realmente vivimos la caridad fraterna son: alegrarnos por los bienes y las alegrías de los demás; sufrir con el que sufre; corregir los propios defectos por amor al prójimo y soportar los de los demás; perdonar las ofensas, aun más, adelantarse a quien nos ha ofendido.", "s": 10}, {"k": "p", "t": "\"Alégrense con los que están alegres\" (Rom 12,15). ¿Nosotros lo hacemos? ¿Nos alegramos por el bien de nuestros hermanos, de nuestras hermanas? Sí, la caridad se alegra por el bien de los demás, y dice: \"Lo importante es que se sirva a Dios; si soy yo u otro a realizarlo, es secundario\". ¡Es difícil que uno sienta en sí verdadera alegría cuando a otro le va bien! La envidia nos impide gozar del bien de los demás como si fuera nuestro y, por lo tanto, alegrarnos con quien es feliz. Debemos alegrarnos por el bien de nuestros hermanos y hermanas y estar contentos de que en el Instituto alguien se vuelva más sabio y santo que nosotros. Que no se nos escapen palabras que oscurecen la fama de los demás y tampoco seamos como los que nunca alaban a nadie. ¡Eso tampoco, vamos! Si podemos felicitar a alguien, sin hacerlo caer en soberbia, ¡entonces participemos de su alegría!", "s": 10}, {"k": "p", "t": "\"Lloren con los que lloran\" (Rom 12,15). Nuestros gestos no deben ser inoportunos, sino respetuosos: una oración, una pequeña atención, etc., expresiones que, aunque no son vistosas, rodean de afecto al hermano o a la hermana y alivian indirectamente la pena. Si nos duele un dedo, sufre todo el cuerpo; lo mismo debe suceder en nuestras comunidades. Cuando vemos a alguien que no está bien, debemos interesarnos inmediatamente. También tenemos que estar dispuestos a pasar la noche junto a la cama de un hermano o una hermana enfermos. Lo mismo si se muere un familiar de ellos, debemos sentir el mismo dolor que ellos sienten. ¡Qué feo es no participar de los sufrimientos de los demás! ¿No es verdad que con frecuencia una palabra buena puede alejar melancolías y dificultades?", "s": 10}, {"k": "p", "t": "\"Ayúdense mutuamente a llevar las cargas\" (Gál 6,2). Ante todo debemos tratar de extirpar de nosotros mismos aquellos defectos que pueden causar fastidio al prójimo. Deben ser los primeros a ser tenidos en cuenta. Los defectos pueden provenir de nuestro carácter, de nuestro modo de hablar o de obrar. Al mismo tiempo debemos soportar los defectos de los demás, tratar de corregirlos fraternamente si podemos, de lo contrario, debemos soportarlos con paciencia. ¿Quién no tiene defectos? La caridad debe soportarlo todo: la forma poco delicada de tratar a los demás de uno, la agresividad de otro, la comodidad de quien nos incomoda, etc. Un poco de caridad ajusta y nivela todas las cosas. Sin caridad la vida comunitaria se vuelve insoportable. Somos como muchas vasijas de barro puestas una al lado de la otra, fastidiándonos mutuamente. Tiene razón la Imitación de Cristo cuando dice: \"Si quieres mantener la paz y la concordia con tus hermanos, es necesario que soportes muchas cosas\". Por lo tanto, debemos soportar con paciencia los defectos del prójimo, tanto físicos como morales e intelectuales. Si no se acostumbran a soportarse, después en las misiones deberán ser cambiados continuamente de comunidad. ¡Da pena pensar que un misionero, una misionera, que hicieron tantos sacrificios dejando patria y familia, soportando tantas burlas y comentarios negativos, después no sepan soportar al propio hermano o hermana!", "s": 10}, {"k": "p", "t": "\"Si se enojan, no se dejen arrastrar al pecado ni permitan que la noche los sorprenda enojados\" (Ef 4,26). Hablar de perdón de las ofensas a misioneros y misioneras parece absurdo, porque tantas veces al día repetimos: \"Perdona nuestras ofensas, como nosotros perdonamos a los que nos ofenden (Mt 6,12). Es necesario perdonar todas las pequeñas ofensas que, quieran o no, puedan recibir. Y si no pueden pedir perdón (a veces no es ni siquiera necesario), al menos acercarse y hablar con la persona. ¡Qué feo es cuando dos personas no se hablan! ¿Cómo un día van a poder predicar el perdón a los enemigos si no dan el ejemplo? Dirán: \"¡A mí no me toca!\" Nos toca a todos, a quien sea. Que no llegue la noche sin que esté todo en su lugar. ¿Notaron lo que dice el Evangelio al respecto? \"Si al presentar tu ofrenda en el altar, te acuerdas de que tu hermano tiene alguna queja contra ti, deja tu ofrenda ante el altar, ve a reconciliarte con tu hermano, y sólo entonces vuelve a presentar tu ofrenda\" (Mt 5,23-24). El Evangelio no dice: \"si le hiciste algo a tu hermano\", sino: \"si tu hermano tiene alguna queja contra ti, ve a reconciliarte con él\". ¿Quién es tan santo como para que nunca se le escape algo que pueda ofender a otros? Son cosas que el Señor permite para nuestra humillación. Entonces, ¿por qué enseguida nos ofendemos? ¿Para qué alimentamos rencores? ¡Tengamos un corazón grande! ¿Acaso nuestro Señor no nos ha dado un ejemplo sublime, pidiendo al Padre que perdonara a los que lo habían crucificado? ¡Parece increíble, pero nosotros no somos capaces de perdonarnos por pequeñeces!", "s": 10}, {"k": "p", "t": "En una carta circular a los misioneros en África, escribí que inclusive entre los santos puede surgir una diferencia de opiniones y hasta un modo vehemente de defenderlas. Entonces les recordé las palabras de san Pablo: \"Si se enojan, no se dejen arrastrar al pecado ni permitan que la noche los sorprenda enojados\" (Ef 4,26). Estén equivocados o tengan razón, reconcíliense enseguida. No esperen ni un día, ni una hora, ni cinco minutos, sino inmediatamente. Entonces sí que la gente podrá decir de ustedes: \"¡Cómo se quieren los misioneros!\". Y este amor lo infundirán en los demás, signo de que se perdonan las ofensas es rezar y desearle el bien a quien nos ha ofendido. Escuchemos de nuevo a san Pablo, que nos exhorta: \"Ámense cordialmente con amor fraterno\" (Rom 12,10). Amarnos, amarnos los unos a los otros, con amor verdaderamente fraterno. Sí, quisiera que estas palabras mías las recordaran siempre. 133. Espíritu de cuerpo. El apóstol Pablo explica los motivos que tienen los cristianos para conservar entre ellos la unidad: \"Hay un solo Cuerpo y un solo Espíritu, así como hay una misma esperanza, a la que ustedes han sido llamados, de acuerdo con la vocación recibida. Hay un solo Señor, una sola fe, un solo bautismo. Hay un solo Dios y Padre de todos, que está sobre todos, lo penetra todo y está en todos\" (Ef 4,4-6). Lo que san Pablo escribe a los efesios, con más razón nos sirve a nosotros que formamos un cuerpo moral, por la unión espiritual de la vocación religiosa, sacerdotal y misionera. Se necesita esta unión de todos para disfrutar de la paz en la comunidad. ¡Esto es lo que les recomiendo seguido! Si san Pablo no se cansaba de repetir a los cristianos esta advertencia, tampoco yo debo cansarme, por el bien de todos y de cada uno. Esta unión, que es bella y santa, puede considerarse el bien más importante de las comunidades.", "s": 10}, {"k": "p", "t": "Para poseer la verdadera caridad se necesita la unión, pero la unión entre todos. Uno para todos y todos para uno. Lo repito: en una comunidad esto es lo más importante. Donde no existe esta unión, es un desastre. Cueste lo que cueste, hay que estar unidos. Nosotros formamos un solo cuerpo moral y deberíamos tener entre nosotros la misma unión que existe entre los miembros del cuerpo físico. Esta unión es necesaria para vivir en paz y ser fuertes. La unión hace la fuerza. La unión entre los miembros de una comunidad la convierte en un ejército bien aguerrido y ordenado (cf. Cant 6,4), capaz de vencer a cualquier enemigo u obstáculo. Al contrario, la desunión destruye a la comunidad.", "s": 10}, {"k": "p", "t": "Todos los institutos tienen un fin especial, que se obtiene con la cooperación de todos. Así lo hacen los miembros de los institutos bien organizados que, sin creerse superiores a los demás, prefieren al propio y tratan de que sea cada vez mejor. Nosotros seamos humildes, como los últimos llegados, pero al mismo tiempo sintámonos felices de pertenecer a nuestro Instituto y cultivemos en nosotros la convicción de que el Señor nos ha favorecido llamándonos a formar parte de esta Familia. Es necesario amar a la propia comunidad así como a la propia vocación. Entonces hay unión de pensamiento y avanzan todos unidos. Una comunidad en la que se mantiene esta unión no puede no hacer el bien. Por lo tanto, traten de alcanzarla y mantenerla. ¡La unión es la substancia de la caridad! 134. Espíritu de familia. San Pedro escribe: \"Sobre todo, ámense profundamente los unos a los otros\" (1 Pe 4,8). De hecho, la caridad es lo que distingue a los verdaderos discípulos de nuestro Señor Jesucristo. Ustedes saben lo que se decía de los primeros cristianos: \"¡Miren cómo se aman!\". No dudo de que aquí haya amor fraterno; sin embargo, estemos atentos y reflexionemos seguido si esta caridad es siempre completa. A veces vivimos la caridad, pero no siempre con todos, ni en todas las circunstancias. A veces somos solitarios, se va para adelante sin mirar a los demás por egoísmo. No queremos tocarnos por miedo a quemarnos. Esto no está bien, no es espíritu de familia. Que nadie diga: ¿a mí qué me importa? Sí, te importa también a ti, para que no sólo tú sino todos sean misioneros y misioneras santos y preparados.", "s": 10}, {"k": "p", "t": "No se puede tener sólo una caridad espiritual sino también material, es decir ayudarnos mutuamente, compartir los cansancios, darnos una mano en los trabajos. ¡Qué hermoso es cuando en una comunidad se da esta preocupación por ayudarse los unos a los otros! ¡Esta sí que es caridad! ¿Acaso no es así en las familias? Vivamos un amor práctico, como entre hermanos y hermanas: cada tanto seamos gentiles, realicemos esos gestos que la caridad sabe inspirarnos. ¡No seamos como estatuas que nunca se tocan! Es necesario que todos sintamos y nos interesemos por el bien de la comunidad, siendo miembros vivos y concordes. Sí, quiero que exista este amor fraterno. Quisiera que cada uno hiciera el bien, gozara y sufriera con el hermano o la hermana, y lo ayudase en todo lo que pueda. Quisiera que haya entre ustedes pequeñas gentilezas, pequeñas ayudas, pequeños gestos de caridad, que demuestren que se aman de verdad. Recuerden que el Instituto no es un colegio, tampoco un seminario, sino una familia. Son todos hermanos; deben vivir juntos, prepararse juntos, para luego trabajar juntos durante toda la vida. En el Instituto debemos ser una cosa sola hasta dar la vida los unos por los otros. \"No hay amor más grande que dar la vida por los amigos\" (Jn 15,13). Amarnos fraternamente: los dolores de uno son los dolores de todos; el interés de uno es el interés de todos. Si en una comunidad todos trataran de complacer a los demás, ¡sería una comunidad ideal! \"¡Qué bueno y agradable es que los hermanos vivan unidos!\" (Sal 132,1). ¡Qué hermoso es estar todos juntos, no como las estatuas de un museo, ni como los presidiarios, sino como hermanos o hermanas en una misma casa, que forman una sola familia! 135. Promoción fraterna. 2 \"Hermanos, si alguien es sorprendido en alguna falta, ustedes, los que están animados por el Espíritu, corríjanlo con dulzura\" (Gál 6,1). La promoción fraterna hace parte del espíritu de familia. Por lo tanto, deben estar contentos de ser corregidos y, al hacerlo ustedes, usar la misma caridad hacia los demás. A veces todos ven y conocen un defecto nuestro que sólo nosotros no percibimos. ¡Qué útil es la palabra de un hermano o de una hermana! En cambio no somos capaces de vivir la caridad de esta manera. No juzguemos, no, pero cuando un defecto es claro, debemos corregirnos. ¿Acaso no es nuestro deber hacia la caridad?", "s": 10}, {"k": "p", "t": "La promoción fraterna debe ser bien hecha, con discreción, en el modo adecuado, en tiempo oportuno, pero debe ser hecha. De esta manera es siempre inspirada por la caridad y la caridad hay que vivirla como corresponde. No tomar a las personas de sopetón. Todos debemos vivir la caridad en esto, entonces la nuestra será una comunidad de espíritu. Ustedes dirán: \"Pero esto no es contrario a lo que nos inculcó tantas veces, que debemos soportarnos los unos a los otros?\". No, no es contrario. Imitemos las virtudes y corrijamos los defectos, con una santa libertad. El que es corregido acepte la corrección como si viniera de Dios. La nuestra quiere ser una comunidad delicada y fraterna, por lo tanto ayudémonos mutuamente a superar los defectos, con espíritu de delicadeza y caridad.", "s": 10}, {"k": "nota", "t": "2 José Allamano usaba habitualmente la expresión \"corrección fraterna\". En estas páginas, sin modificar el contenido original, se prefiere usar el lenguaje de la psicología actual, que habla más bien de \"promoción fraterna\".", "s": 10}, {"k": "h3", "t": "Amor a la cruz y espíritu de sacrificio", "s": 10}, {"k": "p", "t": "136. Mucho más como misioneros y misioneras. Hacia el final de su vida terrena, Jesús decía a los apóstoles: \"Ahora subimos a Jerusalén, donde se cumplirá todo lo que anunciaron los profetas sobre el Hijo del hombre. Será entregado a los paganos, se burlarán de él, lo insultarán, lo escupirán y, después de azotarlo, lo matarán\". Y el Evangelio continúa: \"Ellos no comprendieron nada de todo esto\". Y, como si no hubiera sido claro, agrega que \"les resultaba oscuro y no captaban el sentido de estas palabras\" (Lc 18,31-34). Es una gran lección para nosotros que, después de tantas meditaciones sobre la Pasión de nuestro Señor y sobre el deber de seguirlo por el camino del Calvario, aún no hemos comprendido prácticamente este espíritu. Amemos y abracemos el sacrificio, tanto como personas marcadas por el pecado, que como cristianos, y mucho más como misioneros y misioneras.", "s": 10}, {"k": "p", "t": "Pídanle al Señor el amor al sufrimiento. Nuestro Señor dijo a Ananías, a propósito de san Pablo: \"Yo le haré ver cuánto tendrá que padecer por mi Nombre\" (Hech 9,16). No dice que le habría dado a conocer dulzuras y consolaciones, sino sufrimientos. Lo mismo con los apóstoles, prediciéndoles lo que habrían debido sufrir por amor a él. Lo mismo hace con nosotros. Por lo tanto, acostúmbrense desde ahora a los pequeños sufrimientos para ser generosos en los grandes; pidan al Señor luz y gracia para comprender sus sufrimientos, así como la fuerza para sufrir bien. Sin espíritu de sacrificio no serán santos misioneros y misioneras, así como tampoco recibirán aquellos favores especiales de consolaciones que los fortalecerán y los ayudarán, y su ministerio será estéril. Cuando concibieron la idea de hacerse misioneros y misioneras, tal vez sintieron también el deseo del martirio. Pero eran y son sólo ideas si después, en la práctica, se desaniman frente a los pequeños sacrificios. Luchemos contra nosotros mismos, contra la naturaleza indolente del sufrir. ¡Véncete a ti mismo! No pretendamos que el Señor nos haga santos sin nuestra cooperación.", "s": 10}, {"k": "p", "t": "El Señor nos ha dado un ejemplo de sacrificio sufriendo en el alma y en el cuerpo, como afirma la carta a los Hebreos: \"En lugar del gozo que se le ofrecía, soportó la cruz sin tener en cuenta la infamia\" (Hebr 12,2). Ese mismo camino lo recorrieron todos los santos. Por eso san Pablo decía: \"Sigan mi ejemplo, así como yo sigo el ejemplo de Cristo\" (1 Cor 11,1). ¡Cuántos sufrimientos físicos y morales tuvo que soportar el gran apóstol! Sufrimientos corporales: flagelaciones, lapidaciones, naufragios; sufrimientos internos causados por su ministerio, como él mismo afirmaba: \"Y dejando de lado otras cosas, está mi preocupación cotidiana: el cuidado de todas las Iglesias\" (2 Cor 11,28). Los ejemplos del apóstol son un regaño a nuestro poco amor al sufrir, a la facilidad con que nos desanimamos en la actividad apostólica, especialmente cuando no nos sentimos correspondidos.", "s": 10}, {"k": "p", "t": "Amemos mucho la cruz, pero no sólo poéticamente. Cuando no tenemos sufrimientos es fácil desear sufrir, pero es cuando los debemos soportar que se demuestra si poseemos la virtud. Amar la cruz es muy perfecto, pero empecemos a pedir la gracia de soportarla.", "s": 10}, {"k": "p", "t": "Es necesario que todos nos persuadamos de la necesidad del sacrificio para ser verdaderos discípulos de nuestro Señor. No olviden nunca que son apóstoles y que las almas se salvan con el sacrificio. En la vida apostólica hay muchas rosas, pero también tantas espinas, tanto físicas como espirituales. Algunos se imaginan el ideal misionero como algo muy poético, olvidando que las almas no se salvan sino con la cruz y desde la cruz, como hizo Jesús. La gracia de Dios no falta y, si seremos generosos al soportar las pruebas que el Señor nos manda, podremos repetir con san Pablo: \"Esto me llena de consuelo y me da una inmensa alegría en medio de todas las tribulaciones\" (2 Cor 7,4). Por lo tanto, las tribulaciones no sólo no nos deben paralizar, sino más bien empujarnos a ser apóstoles.", "s": 10}, {"k": "p", "t": "Sí, formémonos al verdadero espíritu de sacrificio, también espiritual. Amar el sufrimiento, aprender a sufrir algo sin darlo a conocer a todos. ¡Quiero que sean fuertes! Entonces el Señor bendice. Por eso un misionero y una misionera de buena voluntad, llenos de espíritu de sacrificio, pueden hacer el trabajo de muchas personas. Entonces, vida de sacrificio desde la mañana hasta la noche. ¡Sí! Hacer todas las cosas por amor a Dios, renunciar a su propia voluntad y al propio juicio, llevar cada día la propia cruz, es un martirio lento, prolongado. El martirio cruento tal vez sea más vistoso, ¡pero aquel vale mucho más! 137. La mortificación no es algo del pasado. Un misionero y una misionera que no tengan la costumbre, el espíritu de mortificación, no pueden hacer nada. San Pablo dice: \"Los atletas se privan de todo\" (1 Cor 9,25). En nuestros tiempos no se quiere oir hablar más de mortificaciones externas, corporales. Se dice que basta con mortificar el espíritu, que las corporales no pueden ser soportadas por los físicos de hoy, que son propias de los ermitaños.Ustedes no piensen así.", "s": 10}, {"k": "p", "t": "¿Hay que mortificar el espíritu? Claro, ¿quién lo niega? Es más, ante todo y siempre la mortificación espiritual. Pero junto a la espiritual se necesita también la corporal. ¿Que estas mortificaciones no pueden ser soportadas por las contexturas físicas de ahora? Ante todo no hay que exagerar con nuestra debilidad física. Son innumerables las mortificaciones externas que no son nocivas para la salud; es más, algunas la conservan y aumentan. ¿Qué son propias de los ermitaños? No, hoy también tantas personas con deseos de santificarse ayunan, pasan la noche rezando, hacen penitencia.", "s": 10}, {"k": "p", "t": "Por lo tanto, es necesaria la mortificación externa, además de la interna. Esto resulta de la Palabra de Dios y del ejemplo de los santos. El Señor Jesús ayunó cuarenta días (cf. Mt 4,1- 11). San Pablo castigaba su propio cuerpo para poder dominarlo (cf. 1 Cor 9,25). San Vicente de Paul decía: \"Quien da poca importancia a las mortificaciones externas, demuestra que no es mortificado ni exterior ni interiormente\". Recuérdenlo especialmente cuando estén en las misiones. Para obtener gracias se necesita la oración y la mortificación. Yo les hablaré siempre de la mortificación interna, pero recuerden que también es necesaria la externa. 138. Pequeños sacrificios que nadie ve. No pretendo de ustedes las grandes penitencias de los santos, si bien son algo excelente. Pero ustedes pueden y deben hacer pequeños y permanentes sacrificios cotidianos, para luego ser capaces de sacrificios grandes y hasta heroicos, como lo requiere la vida apostólica. Nunca será fuerte quien no aprende a frenarse a sí mismo, quien no adquiere establemente la virtud. El que quiera sacrificarse debe estar atento a las pequeñas cosas. El Señor desea el sacrificio pequeño pero perseverante. Desde ahora deben mortificar los sentidos: la vista, no queriendo verlo todo, incluso lo que es lícito; el oído, no siendo curiosos y queriendo saber todo; el gusto, comiendo moderadamente y contentándose de lo que puede ofrecer la comunidad; el tacto, respetando el cuerpo que es santificado por el", "s": 10}, {"k": "p", "t": "Bautismo, la Confirmación y tantas Comuniones. Además, hay que estar listos para levantarse enseguida. Parece algo insignificante, pero yo creo que si uno fuera siempre fiel a este acto, seguramente tendría buen espíritu. Es tan feo concederle el primer acto del día a la pereza. El Señor quiere este sacrificio matutino, que atrae las bendiciones sobre todo el resto de la jornada. Comportándose de esta manera serán cada vez más generosos en las misiones. La gran dificultad que tenemos para hacernos santos es causada por no ser constantes en estos sacrificios.", "s": 10}, {"k": "p", "t": "En particular, mortifiquemos la lengua. Hay un tiempo para hablar y otro para callar. San Santiago, en su muy hermosa carta, entre otras cosas habla bastante del bien y del mal que se puede hacer con la lengua. Es un pequeño miembro —escribe— pero se vanagloria de muchas cosas. En efecto, con la lengua podemos hablar bien y constructivamente, rezar y cantar las alabanzas al Señor. En cambio podemos usarla para pronunciar palabras ociosas, es decir ni útiles, ni convenientes; palabras contra la caridad, como críticas, murmuraciones y calumnias; palabras contra la verdad, agrandando las cosas, diciéndolas con imprecisiones; palabras de vanidad, de soberbia, etc. (cf. Sant 3,5). ¿Pondrían en labios de Jesús todo lo que dicen? ¡Cuánta ligereza y, por lo tanto, cuántos defectos al hablar, en quien no sabe frenar la lengua! Es un vicio bastante común. ¿Y quién puede calcular los daños, quién puede medir las consecuencias de una palabra dicha con malas intenciones, especialmente cuando está dirigida contra el honor y la fama del prójimo? ¡Ah, qué fácil es pecar con la lengua! San Santiago dice: \"Si alguien no falta con las palabras es un hombre perfecto\" (Sant 3,2). Y en el Eclesiástico: \"Feliz el que no ha incurrido en falta con su lengua!\" (Ecli 25,8).", "s": 10}, {"k": "p", "t": "Ustedes me dirán: \"¡Entonces estaremos en silencio y no hablaremos más!\". Miren: si tuvieran que estar encerrados dentro de estas cuatro paredes, estaría de acuerdo; pero ustedes no son ni Cartujos, ni Trapenses. No se trata de callar siempre, sino simplemente de reflexionar antes de hablar. San Ambrosio se pregunta: \"¿Es conveniente estar siempre callados?\" y responde que no. Por lo tanto, da una regla para hablar bien: \"O te callas, o dices cosas que sean mejores que el silencio\". San Francisco de Sales, desarrollando el mismo concepto, dice: \"Que nuesto hablar sea poco y bueno, poco y dulce, poco y simple, poco y caritativo, poco y amable\". Por lo tanto, hay que hablar con moderación, con prudencia, con caridad y piedad.", "s": 10}, {"k": "h3", "t": "Paciencia", "s": 10}, {"k": "p", "t": "139. Indispensable en las misiones. La paciencia es una gran virtud que, si bien es necesaria para todos, para los misioneros y misioneras resulta indispensable. San Pablo, hablando de las virtudes necesarias en un apóstol, pone en primer lugar la paciencia, entendida como constancia: \"Siempre nos comportamos como corresponde a ministros de Dios, con una gran constancia en las tribulaciones, en las adversidades, en las angustias al soportar los golpes, en la cárcel, en las revueltas, en las fatigas, en la falta de sueño, en el hambre\" (2Cor 6,4-5). Miren qué importante y necesaria es la paciencia. La experiencia lo demuestra: la mayor o menor paciencia en el misionero o en la misionera incide mucho sobre la conversión de las personas. La paciencia nunca será suficiente. Todos la necesitamos, porque se podría decir que debemos practicarla en cada momento.", "s": 10}, {"k": "p", "t": "La excelencia de esta virtud emerge de la Palabra de Dios. El Señor, en la Pasión, demostró tener una paciencia extrema para soportar todo tipo de sufrimientos, y el máximo de la mansedumbre hacia Judas, hacia sus flageladores, hacia los que lo crucificaron. San Santiago escribe que la paciencia es necesaria para alcanzar la perfección: \"Y la paciencia debe ir acompañada de obras perfectas, a fin de que ustedes lleguen a la perfección y a la madurez, sin que les falte nada\" (Sant 1,4). San Cipriano, que tenía un espíritu fuerte, habla muy bien de ella. \"La paciencia —dice— nos hace agradables a los ojos de Dios, templa la ira, frena la lengua, gobierna la mente, custodia la paz, rige la disciplina, rompe el ímpetu de la sensualidad...\", y sigue con las más bellas alabanzas. La paciencia sostiene todas las otras virtudes que, sin ella, se apagarían.", "s": 10}, {"k": "p", "t": "La paciencia es la virtud que modera la tristeza provocada por los males presentes; modera los movimientos del ánimo, para que no sea oprimido por las adversidades y permanezca estable, soportándolas con tranquilidad. Ahora bien, hay dos tipos de males que pueden afligirnos en esta vida: males externos y males internos. Los males externos son, por ejemplo: la pérdida de los bienes o de los familiares, las maldades contra nosotros, el desprecio, alguna enfermedad u otros inconvenientes que nos puedan suceder. Los males internos son: el tedio, las oscuridades interiores, las arideces del espíritu, los disgustos, los escrúpulos. Todos estos males tienden a entristecer el corazón y requieren paciencia para ser soportados. El Señor sufrió estos males en el Getsemaní, sin embargo no se desanimó. Acostumbrémonos a pasar por encima de tantas miserias y no dejemos que el corazón se entristezca. Una mirada al Crucifijo pone todo en su lugar. 140. En aumento. En el ejercicio de la paciencia hay diferentes grados. El primero es el de los que soportan los males sin rebelarse, incluso lamentándose; buscan consolaciones y quieren ser confortados en sus dolores. Esto es virtud, con tal de que los males sean soportados por amor a Dios, pero es lo mínimo que podemos hacer. Un segundo grado es el de los que soportan todo resignándose ante la voluntad de Dios, sin lamentarse ni buscar consolaciones. Y un tercer grado es el de los que soportan los males no sólo con resignación sino con alegría. Tienen tanto amor que casi no sienten más el mal. Esto les sucedía a los mártires, los cuales deseaban tanto identificarse con Jesús crucificado que vencían el dolor.", "s": 10}, {"k": "p", "t": "Este es el grado de paciencia que Jesús nos propone y hacia el cual debemos tender. No quiero decir que tengamos que gozar de los males por sí mismos, sino gozar porque con ellos nos identificamos más con Jesús sufriente y cooperamos más eficazmente en la salvación de las almas. ¿Acaso los Apóstoles, arrastrados a los tribunales y castigados, no salieron contentos por haber sido ultrajados por amor del nombre de Jesús? (cf. Hech 5,41). ¿Y san Pablo? Para él no había otro motivo de gloria que en la cruz de nuestro Señor Jesucristo (cf. Gál 6,14). Por eso san Pedro exhortaba a los cristianos diciendo: \"Alégrense en la medida en que puedan compartir los sufrimientos de Cristo. Así, cuando se manifieste su gloria, ustedes también desbordarán de gozo y de alegría\" (1 Pe 4,13).", "s": 10}, {"k": "p", "t": "Comencemos al menos con el segundo grado: no nos lamentemos, ni deseemos ser compadecidos. Esto vale tanto para los males del cuerpo como para los sufrimientos morales y espirituales. Las cosas no saldrán nunca como nosotros queremos. Siempre tendremos que soportar algún mal, algún sufrimiento. Por lo tanto, es necesario armarse de paciencia, empeñarse hasta alcanzar el tercer grado: aceptar con alegría los males que recibimos. Sin paciencia no hay paz ni en el corazón, ni en la comunidad, ni en el mundo.", "s": 10}, {"k": "p", "t": "Hay muchos medios para adquirir la paciencia: pedirla al Señor en la oración; no dejarnos abatir por las pequeñas dificultades, para que, cuando vengan los grandes problemas, podamos soportarlos sin amargarnos; habituarnos a considerar los males como permitidos por Dios y no sólo como provenientes de la malicia humana; recibir las cruces no sólo de manos del Señor, sino de su amor; en las pruebas, mirar el Crucifijo, porque él explica todo; hacer frecuentes actos de conformidad a la voluntad de Dios; pensar en el paraíso.", "s": 10}, {"k": "p", "t": "Durante el tiempo de formación deben ejercitarse en la paciencia, para luego tenerla en las misiones. ¡A veces la paciencia es tan limitada! Somos como el vidrio, que al golpe más liviano se parte. Por lo tanto, seamos superiores a estas debilidades y superémonos a nosotros mismos con energía. La paciencia debe ser sembrada por doquier. Si un misionero o una misionera se dejan abatir y no reaccionan ante la tristeza, ¿qué podrán hacer en las misiones? Cuando estamos mal por algo, es signo de que el Señor nos quiere. ¡Nunca se en-tiende lo suficiente el misterio del dolor! Comprometámonos a ejercer esta virtud. De esa manera alcanzaremos la paz con nosotros mismos y con los demás.", "s": 10}, {"k": "h3", "t": "Humildad", "s": 10}, {"k": "p", "t": "141. Sólo Jesús es realmente humilde. El Señor Jesucristo proclamó: \"Aprendan de mí, porque soy paciente y humilde de corazón\" (Mt 11,29). San Agustín comenta que el Señor no nos propone imitarlo en la construcción del mundo, en crear las cosas visibles e invisibles, en obrar milagros y resucitar a los muertos, sino en el ser pacientes y humildes de corazón. En esto quiere que lo imitemos. Si nos pidiera que lo imitáramos en su extrema pobreza, o en la total inmolación hasta la muerte en la cruz, podríamos tener la excusa de ser débiles. Pero imitarlo en la humildad es posible a todos, por tratarse de una condición propia del límite humano, mientras que para Jesús fue \"rebajarse\". Él fue el único realmente humilde. Por eso los Santos Padres llaman a la humildad \"virtud de Cristo\".", "s": 10}, {"k": "p", "t": "Observemos el Evangelio: toda la vida de Jesús fue un ejemplo de humildad. Él declaraba que lo que enseñaba no le pertenecía, sino que provenía del Padre: \"Mi enseñanza no es mía, sino de aquel que me envió\" (Jn 7,16). Cuando lo llamaban maestro bueno, respondía: \"Sólo Dios es bueno\" (Mc 10,18). Acaso el Padre no había dicho de él: \"Este es mi Hijo muy querido, en quien tengo puesta toda mi predilección\" (Mt 3,17)? A pesar de ser el Señor del universo, Jesús no dudó en hacerse siervo de los apóstoles, hasta rebajarse y lavarles los pies. El más grande prodigio de humildad fue su muerte, con todas las atrocidades que lo acompañaron, a las que Él se sometió plenamente: \"Se humilló hasta aceptar por obediencia la muerte y muerte de cruz\" (Fil 2,8).", "s": 10}, {"k": "p", "t": "Jesús fue humilde por su propia voluntad. Aun pudiendo alejar de sí las humillaciones, las aceptó a todas. Se dice de él que \"al ser maltratado, se humillaba y ni siquiera abría su boca\" (Is 53,7); es decir, no se dice que haya sido humillado, sino que fue él quien se humilló: \"se humilló hasta aceptar por obediencia la muerte\" (Fil 2,8). 142. Inevitablemente humildes. Nosotros somos humildes porque no podemos no serlo debido a nuestra naturaleza débil y a nuestros defectos. Ser humildes en las palabras no es demasiado difícil; podemos serlo aun escondiendo la soberbia más sutil. Más difícil, en cambio, es saber mantenerse humildes en medio de las acciones que nos engrandecen. Por un cierto espíritu de humana prudencia, nos preocupa darnos a conocer por lo que somos, pero en el corazón disfrutamos de la gloria humana, mostrándonos, al mismo tiempo, despreocupados de las alabanzas recibidas. Esta no fue la humildad de Jesús. Él tuvo un verdadero amor a la humildad.", "s": 10}, {"k": "p", "t": "¿Por qué hablamos tanto de humildad? Esta es la respuesta: ninguna virtud, por maravillosa que sea, es sólida si no está acompañada de la humildad. San Agustín, al ser interrogado sobre cuál era la virtud más importante, respondió: \"La primera virtud es la humildad, la segunda la humildad, la tercera la humildad\". San Jerónimo la llama la virtud de los cristianos, justamente porque se encuentra en todas las virtudes; y sin humildad también las cosas buenas se deterioran.", "s": 10}, {"k": "p", "t": "La humildad es necesaria para rezar bien. De hecho, sólo las oraciones de los humildes pueden llegar al cielo, las de los soberbios no, como sucedió con la oración del fariseo (cf. Lc 18,10-14). El Señor ve la humildad de la oración. Del mismo modo, sin humildad no hay fe. ¿Cómo puede un soberbio someter el propio intelecto y la razón a la autoridad de la Iglesia? El que es soberbio no cree. Además, sin humildad no hay esperanza. En efecto, ¿cómo podrá abandonarse en Dios quien sólo confía en sí mismo? ¿Y qué podemos decir de la virtud de la caridad? El soberbio se ama a sí mismo y no al Señor. San Agustín dice: \"Donde hay humildad, hay caridad\". En sentido opuesto, se puede decir: donde no hay humildad, no hay caridad. 143. Servir con humildad. La humildad es muy necesaria en nuestro ministerio como misioneros y misioneras, ya que es un servicio. Para ser siervos se necesita la humildad. Jesús decía a los apóstoles: \"El que es más grande, que se comporte como el menor, y el que gobierna, como un servidor\" (Lc 22,26). También el Eclesiástico afirma: \"Cuanto más grande seas, más humilde debes ser\" (Ecli 3,18). Así vivió la Virgen que, cuando se le anunció que recibiría la dignidad de ser la Madre de Dios, respondió: ¡He aquí la sierva del Señor! (cf. Lc 1,38). Por lo tanto, nuestro ministerio es llamado por san Isidro, \"el ministerio de la humildad\".", "s": 10}, {"k": "p", "t": "Además, la virtud de la humildad es tan necesaria en los misioneros y las misioneras, que sin ella no pueden obrar ningún bien. ¿Quieren (deben quererlo) ser santos, lo más santos posible? Empéñense en ser humildes. La humildad los ayudará también en el ejercicio de las virtudes. Si hay personas que deben ser humildes, esos son, precisamente, ustedes.", "s": 10}, {"k": "p", "t": "Los Misioneros y las Misioneras de la Consolata deben vivir con un gran espíritu de fe, de sacrificio, de caridad fraterna, pero sobre todo con espíritu de profunda humildad. Convenzámonos de la necesidad de esta virtud, no tengamos miedo de rebajarnos demasiado. Si seremos humildes, también como Instituto, el Señor nos ensalzará. Quiero que nuestro lema sea: \"Lo protegeré porque todo lo atribuye a mí\" (cf. Sal 90,14). 144. La humildad es la verdad. La humildad es el conocimiento \"real\" de nosotros mismos. Conocernos por lo que somos. Esto no significa que, para ser humildes, haya que pensar que somos peor de lo que realmente somos, porque la humildad, siendo una virtud, debe fundarse no sobre la falsedad sino sobre la verdad. La humildad tampoco consiste en ciertas afirmaciones como: \"¡No sirvo para nada!\" u otras similares. Con frecuencia estas frases se dicen para hacerse alabar. Algunos creen que es humildad despreciar una obra bien realizada. No, la virtud rechaza siempre la falsedad. Cuando se realiza un trabajo, hay que realizarlo en el mejor modo posible. Vayamos despacio a la hora de creer que tenemos tantas virtudes, pero si las tenemos, reconozcámoslas, como recibidas de Dios, a quien todo lo referimos. Que la humildad sea simple; no hagan tonterías para evitar las alabanzas. La humildad debe basarse en el conocimiento verdadero, objetivo de nuestro ser y de nuestros méritos, tanto en el orden natural como en el de la gracia.", "s": 10}, {"k": "p", "t": "Observémonos. ¿Qué somos en el orden natural? Polvo y cenizas. ¿Y qué nos pertenece? Así como es Dios quien nos dió el ser, quien nos conserva, del mismo modo es Dios el que nos dio todas las capacidades y talentos que adornan nuestra persona. Por lo tanto, el cuerpo, el alma, la salud que tenemos, la belleza y el ingenio de los que nos vanagloriamos, todo viene de Dios. \"¿Qué tienes que no hayas recibido? Y si lo has recibido, ¿por qué te glorías como si no lo hubieras recibido?\" (1 Cor 4,7). Las mismas consideraciones, todas verdaderas, podemos y debemos aplicar en el orden de la gracia. Si somos cristianos, es por gracia de Dios. Y el haber sido llamados a esta casa, ¿es acaso mérito nuestro? ¡En absoluto! Es el Señor quien nos ha guiado hasta aquí. La misma buena voluntad es un don de Dios. En el orden sobrenatural, todo viene del Señor. Por eso comprendemos cómo los santos, aun obrando maravillas, pudieron seguir siendo tan humildes. San Pablo decía: \"Jesucristo vino al mundo para salvar a los pecadores, y yo soy el peor de ellos\" (1 Tim 1,15). Hay que pedir la humildad a Dios todos los días, para poder entrar en nosotros mismos, saber lo que somos y estar contentos de nuestra nada. 145. la humildad no es una virtud infusa. Normalmente la humildad no nos es regalada, sino que la obtenemos con nuestra colaboración. Se adquiere con la repetición de los actos. Cada vez que surge algún pensamiento soberbio, debemos decir enseguida: \"¡Sólo Dios, sólo Dios!\". Los gestos interiores nos ayudan mucho, pero no bastan. También son necesarios los externos que son manifestaciones de la humildad interior. Santo Tomás nos enseña que de la disposición interior a la humildad nacen los signos externos que se manifiestan en las palabras y en los gestos. Por lo tanto, no hablemos para alabarnos; pocas veces para despreciarnos; cuando seamos corregidos, estemos atentos a no reaccionar y buscar excusas; no hagamos nada por hacernos ver, nada con soberbia; sobre todo aceptemos con gusto las humillaciones que el Señor nos manda. De esta manera seremos verdaderamente humildes; y, sólo si seremos humildes, seremos santos.", "s": 10}, {"k": "p", "t": "Para adquirir el espíritu de humildad, no debemos darnos demasiada importancia, tampoco dársela a nuestras opiniones, a lo que sabemos, a nuestras capacidades, a la estima de los demás, que son los puntos sobre los que se apoya la soberbia. Si nos diéramos cuenta de que nuestra cabeza es pequeña y nuestra inteligencia limitada, sabríamos aceptar que muchas veces nos equivocamos y que, por lo tanto, deberíamos aceptar también la opinión de los demás, sobre todo de los que tienen más experiencia que nosotros. Por lo tanto, recuerden esto: pedirle a Dios la humildad, meditar sobre nuestras debilidades, aceptar las humillaciones que Dios nos envía.", "s": 10}, {"k": "p", "t": "Además, cuidemos nuestro buen nombre como sugiere el Eclesiástico: \"Cuida tu buen nombre\" (Ecli 41,12); o como dice jesús: Así debe brillar ante los ojos de los hombres la luz que hay en ustedes, a fin de que ellos vean sus buenas obras y glorifiquen al Padre que está en el cielo\" (Mt 5,16). Pero siempre debemos obrar con fines sobrenaturales, no para que nos estimen, para tener privilegios, sino para agradar a Dios. A veces nuestro amor propio hace de velo y nos hace ver la gloria de", "s": 10}, {"k": "p", "t": "Dios o el bien de las almas, cuando en realidad es la gloria del propio yo. Los títulos, los cargos, etc. son sólo aire, no valen nada. El Señor no mira los títulos.", "s": 10}, {"k": "p", "t": "Ya pasaron cuarenta años desde que soy superior y... ¡sería hora de dejar de serlo! Dejaría con gusto la Consolata, el Seminario, el canonicado... no digo que los dejaría también a ustedes, pero... Vuelvo sobre algo que quería decirles ya otras veces. Ustedes me besan la mano y yo siempre los he dejado hacerlo, pero ya no quiero que lo hagan más. Sé que me quieren, pero esto es demasiado. Dejémoslo así, me besarán la mano cuando haya muerto, si quieren. Les agradezco por las demostraciones de respeto, pero no quiero que sean demasiado abundantes. Además, no quiero sentir más el superlativo de \"Veneradísimo\". En el \"Da Casa Madre\" conté al menos ocho: es demasiado. ¿José Cafasso apenas es venerable y yo ya debo ser veneradísimo? Sólo el Señor sabe si lo soy... No lo hagan más, porque me parece una exageración. Imitando a María Santísima, atribuyámonos sólo nuestras debilidades y demos a Dios todo el honor y la gloria (cf. Lc 1,47-48).", "s": 10}, {"k": "h2", "t": "8. Eucaristía: misterio de fe y amor", "s": 11}, {"k": "h3", "t": "Jesús víctima", "s": 11}, {"k": "p", "t": "146. Celebración del Sacrificio Eucarístico. En la Eucaristía Jesús es víctima, alimento y amigo. La misa, la comunión y la visita al Santísimo Sacramento: ¡estos son nuestros tres amores! Me gustaría que meditaran más sobre este misterio de amor. Sí, ¡la Eucaristía es un misterio de fe y de amor!", "s": 11}, {"k": "p", "t": "En la celebración de la santa misa Jesús es víctima por nosotros y por nuestros pecados (cf. 1 Jn 2,2). Todos los días y en muchos momentos de la jornada él se entrega por nosotros. En la santa misa no sólo se representa sino que se renueva el", "s": 11}, {"k": "nota", "t": "1 Sobre la Eucaristía José Allamano seguía la típica espiritualidad de su tiempo, centrada en la \"presencia real\" de Jesús, enriquecida por una carga afectiva, que se manifestaba en algunas actitudes y expresiones suyas. La renovación conciliar ha puesto en evidencia la unidad de la Eucaristía, que comprende al mismo tiempo e inseparablemente la celebración de la misa, la comunión y la presencia real. En particular, con respecto a la Misa el Concilio mismo resalta también la Palabra de Dios proclamada y la comunidad reunida alrededor del altar. José Allamano no ignoraba todos estos elementos, pero normalmente los presentaba en otros contextos. En estas páginas reportamos su espiritualidad sobre la Eucaristía, pero con algún retoque en el lenguaje. Por ejemplo, en vez de \"decir\" o \"asistir\", se usan \"celebrar\" o \"participar de\" la santa misa; y esto también porque José Allamano, más allá de la terminología, estaba convencido de que en la celebración era necesaria una participación activa.", "s": 11}, {"k": "p", "t": "mismo sacrificio de la cruz. Es la misma víctima, la misma finalidad. Pero es diferente el modo en el que se realiza la oblación: sobre el calvario la víctima fue ofrecida en modo cruento; en la misa, en cambio, en modo incruento. ¡Qué bello es pensar que, cada vez que celebramos o participamos de la Eucaristía, estamos justamente allí, en el calvario, a los pies de la cruz, con la Virgen y san Juan! Siguiendo las palabras de Jesús: \"Hagan esto en memoria mía\" (Lc 22,19), santo Tomás define la celebración eucarística como el memorial de la Pasión del Señor. También lo afirma san Pablo: \"Siempre que coman este pan y beban esta copa, proclamarán la muerte del Señor hasta que Él vuelva\" (1 Cor 11,26). El mismo martirio no es nada en comparación con la misa, porque el martirio es el sacrificio que el hombre hace a Dios de su propia vida, mientras que en la celebración eucarística es el Hijo de Dios el que sacrifica su propio cuerpo y su propia sangre por el hombre.", "s": 11}, {"k": "p", "t": "La Eucaristía se celebra para rendir a Dios el honor que le es debido; para pedir perdón por las ofensas que le hemos hecho; para agradecerle por todos los beneficios que nos ha dado y para obtener las gracias que necesitamos. 147. El tiempo más hermoso de nuestra vida. ¿Ven qué importante es la misa? Y nosotros, ¿ la valoramos? ¿Nos alegramos por poder celebrarla o poder participar de la misma? La misa es el tiempo más bello de nuestra vida; una sola bastaría para hacer feliz a quien llegue a celebrarla. Aunque tuviéramos que prepararnos durante quince o veinte años para celebrar una misa, ¡qué felices seríamos! ¡Eso ya sería una gran consolación! ¡Qué felicidad siento al celebrar la Eucaristía! Y cuando, como en Navidad, celebramos tres en un día, ¡qué placer! Una sirve para prepararse a la siguiente; ¡es una alegría! ¡Ah, si comprendiéramos lo que significa una Eucaristía más!", "s": 11}, {"k": "p", "t": "Recuerden que el sacerdote, celebrando la Eucaristía, debe ofrecerse a sí mismo como oblación pura y santa, con todas las fuerzas y con el máximo fervor. Por lo tanto, cada vez que participamos de la misa, pensemos en la ofrenda que Jesús hace de sí mismo al Padre y pidámosle la gracia de sacrificarnos con él en todo. ¡Es por esto que les repito siempre que deben ser holocaustos! ¡Sí, sean holocaustos!", "s": 11}, {"k": "p", "t": "Cada vez que el sacerdote celebra o participa de la misa, para él debe ser una acción tan grande, tan nueva y tan feliz, como si en ese mismo día el Señor Jesucristo, descendiendo en el seno de la Virgen, se hiciera hombre. Prepárense para celebrar bien la Eucaristía conservando la santidad, viviendo las virtudes y con un gran espíritu de fe. Celébrenla pensando en lo que dicen y hacen. Si cada cosa es hecha seriamente, ¡con mucha más razón la celebración de la misa! Siempre digo a los sacerdotes jóvenes: deben celebrarla todos los días, salvo que tengan que decirla a las apuradas. He sacado muchos pensamientos del opúsculo de san Alfonso \"La misa maltratada\" y los reduje a treinta breves meditaciones, una para cada día del mes. Leo una todas las mañanas y me doy cuenta de que me ayuda a prepararla. Luego, en la misa, es necesario que agradezcamos convenientemente.", "s": 11}, {"k": "p", "t": "Después de tantos años de sacerdocio, estoy contento; no tengo ningún remordimiento por haber celebrado mal la Eucaristía; y esto no lo digo por soberbia. Las ceremonias siempre las he celebrado bien. Y esto me consuela. Tengo tantas miserias, pero la Misa siempre traté de celebrarla bien. En las genuflexiones, a pesar de la edad, trato de tocar el piso.", "s": 11}, {"k": "p", "t": "Lo que dijimos del sacerdote que celebra, también se pue-de decir de los que participan de la santa misa. Esta es la devoción de las devociones. Admiremos y tratemos de comprender el gran misterio que celebramos en ella. San Alfonso dice: \"Muchos hacen largos viajes, van a visitar este o aquel santuario; para mí, el santuario de los santuarios ¡es el sagrario!\". Él hablaba de la visita al Santísimo Sacramento; pero lo mismo y con más razón podemos afirmar de la celebración eucarística. La santa misa incluye todas las oraciones privadas, porque no somos nosotros los que rezamos, sino Jesús el que intercede por nosotros.", "s": 11}, {"k": "p", "t": "¿Cómo debemos participar de la misa? Ante todo reavivando la fe: tener una fe viva, una caridad ardiente, como si estuviéramos en el monte Calvario. Luego, recordando que es la renovación real del sacrificio de la cruz; pidiendo la gracia de que la participación a la misma rinda frutos en nosotros; dejando hablar al corazón para que alabe al Señor, porque quien tiene sentimientos no necesita de las palabras; confiando en su misericordia; ofreciéndonos a él; agradeciéndole por todos sus beneficios. Cada vez que participamos de la misa, pensemos en la ofrenda que Jesús hace de sí mismo al Padre y pidámosle la gracia de sacrificarnos con él en todo. Sintamos el deseo de participar de la misa.", "s": 11}, {"k": "p", "t": "Algo excelente es también tener la intención de participar espiritualmente de todas las celebraciones eucarísticas del mundo. \"Desde la salida del sol hasta su ocaso, mi Nombre es grande entre las naciones y en todo lugar se presenta a mi Nombre un sacrificio de incienso y una ofrenda pura; porque mi Nombre es grande entre las naciones, dice el Señor de los ejércitos\" (Mal 1,11). ¡A cuántas misas podemos participar espiritualmente!", "s": 11}, {"k": "h3", "t": "Jesús, pan vivo", "s": 11}, {"k": "p", "t": "148. Vengan, coman mi pan. Jesús es alimento en el Santísimo Sacramento: \"Yo soy el pan de Vida\" (Jn 6,48). Este es el fin principal de su permanencia en medio de nosotros. Él nos repite: \"Vengan, coman mi pan\" (Prov 9,5), que es el pan de vida. Cuando ustedes comulguen, den gracias al Señor, porque pueden participar íntimamente de su sacrificio.", "s": 11}, {"k": "p", "t": "Quiero hacerles observar el inmenso amor que Jesús tiene por nosotros. El alimento se convierte en la sustancia de quien lo come, y Jesús dijo: \"El que me come vivirá por mí\" (Jn 6,57). Nos ha demostrado su amor dándose totalmente a nosotros. Y nosotros, ¿cómo respondemos a tanto amor? Dándonos a él sin medida, con amor. Santa Teresa dice que \"basta una comunión bien hecha para santificar un alma\". ¿Por qué nosotros, después de tantas comuniones aún no somos santos y arrastramos siempre los mismos defectos? Sí, debilidades tendremos siempre; pero al menos ofrezcamos a Jesús un deseo sincero de corregirnos y algún esfuerzo concreto. Por otra parte, no dejar la comunión sólo por estas debilidades o porque se cometió algún pecado menor. No es necesario ser santos para poder acercarse a la comunión; acerquémonos a ella para santificarnos. 149. ¡Aquí estoy, porque me has llamado! No hay que hacer la comunión por costumbre, ni por condicionamientos humanos, sino para responder al deseo de Dios y para crecer en la gracia. Esto es lo que debemos llevar a cada comunión: una recta intención, buena voluntad y fervor. Si uno va a sacar agua con un vaso, sólo llena un vaso; si va con un balde, llena un balde. Lo mismo sucede con la comunión. Comprometámonos a vencer nuestros defectos más frecuentes. Hace tiempo en los seminarios ni siquiera se conservaba el Santísimo Sacramento y la comunión se hacía sólo los domingos. También en mi época la comunión no era cotidiana. Si fuera por mí, me gustaría que la hicieran hasta dos veces al día, si estuviera permitido… Cuando en el \"Padrenuestro\" piden el \"pan cotidiano\", pidan hacer bien la comunión.", "s": 11}, {"k": "p", "t": "Para obtener frutos abundantes de la comunión eucarística, además del estado de gracia, es necesario estar libres de pecados veniales y hacer una buena preparación junto a una oportuna acción de gracias. Apropiémonos de las expresiones del profeta: \"¡Si rasgaras el cielo y descendieras!\". Imitemos a Aman que, invitado a almorzar a lo del rey Asuero, repetía lleno de alegría: \"¡Mañana seré invitado a lo del rey!\" (Est 5,12). Estaba feliz por poder almorzar con el rey; nosotros debemos estar más felices por poder sentarnos en este banquete divino en el que el Señor nos hace realmente partícipes de sí mismo, ¡se convierte en nuestro alimento! Imaginemos que Jesús nos diga como a Zaqueo: \"Baja pronto, porque hoy tengo que alojarme en tu casa\" (Lc 19,5). El Señor desea venir a nosotros y también nosotros debemos desearlo. Con Samuel digámosle: \"Aquí estoy, porque me has llamado\" (1 Sam 3,6). Nuestra vida debería ser eucarística. Nuestra mente y nuestro corazón deberían estar permanentemente ocupados en el Santísimo Sacramento: no sólo antes y después de la comunión y en las visitas a Jesús Sacramentado, sino también durante el día, en el estudio y en el trabajo.", "s": 11}, {"k": "p", "t": "Recibimos a Jesús en cuerpo, sangre, alma y divinidad, vivo como está vivo en el cielo. Acerquémonos a él con humildad, examinemos nuestro corazón, humillémonos por nuestras debilidades y expresémosle nuestros deseos. El Señor sólo nos pide amor; tampoco puede desearlo quien no lo ama. Hablémosle como a un amigo, digámosle lo que sentimos en el corazón. Mientras miramos la Hostia consagrada, imaginemos que nuestro Señor nos dice: ¡Soy realmente yo, Jesús! Por lo tanto, adorémoslo y agradezcámosle por tantos beneficios, por la vocación, por haber correspondido tan poco; démonos totalmente a él: corazón, voluntad, etc.; pidámosle gracias temporales y espirituales para nosotros y para los demás, y ofrezcámosle actos de reparación y de consolación. Entonces, nuestras comuniones serán fervorosas; viviremos de Jesús toda la vida; todo lo dirigiremos a él. Enriquezcámonos de este espíritu de fe espiritualizándonos. ¡Felices nosotros si viviremos unidos a Jesús sacramentado! Él será nuestra felicidad en la tierra y nuestro premio en el cielo.", "s": 11}, {"k": "h3", "t": "Jesús es el Dios con nosotros", "s": 11}, {"k": "p", "t": "150. Como amigo. Jesús está en el Santísimo Sacramento como amigo, por lo tanto tratémoslo como tal. Él nos quiere mucho y nosotros lo queremos mucho a él. Comprendan bien este misterio de amor para nosotros: cada vez que vamos a visitarlo, como amigo nos acoge con afecto, es más, con un encendido deseo. Respondamos a tanta bondad yendo con gusto, aun por breves instantes, permaneciendo en su presencia con fe y amor, sintiéndonos felices por esa familiaridad. Sí, tener fe; pensar que está presente allí, hacer bien las genuflexiones, evitar lo que nos distrae. Al irnos del templo, permanecer en comunión espiritual con él. ¡Entre amigos hay que mantenerse unidos! Felices ustedes si permanecerán siempre unidos a Jesús Sacramentado. Él los formará a todas las virtudes y encenderá en ustedes ese fuego que vino a traer sobre la tierra y que, por nuestro intermedio, quiere que se encienda. ¡Felices ustedes si en las misiones estarán llenos de este amor! Entonces Jesús será su sostén, su consuelo, su todo.", "s": 11}, {"k": "p", "t": "Nuestro Instituto debe formar misioneros y misioneras enamorados de Jesús Sacramentado. ¡Sí, vivan enamorados de Jesús", "s": 11}, {"k": "p", "t": "Sacramentado! Que esta sea nuestra devoción principal. Cuando está él, no falta más nada; a sus pies todo tiene una explicación, todo se arregla. Jesús Sacramentado es el centro alrededor del cual giramos continuamente. Es el centro del que parten todas las gracias para el Instituto. Es Jesús desde el sagrario quien sostiene esta casa y todas las comunidades en las misiones. 151. Gozar de su presencia. Hagamos con fe y devoción la visita al Santísimo Sacramento. Permanezcamos con gusto en su presencia. También en las misiones sigan visitando a Jesús en las capillas y hacia él dirijan día y noche el pensamiento y el corazón, como a un punto central. ¡Cuánto gozo al ver que Dios, por nuestro intermedio, va multiplicando los santos sagrarios! ¡Y cuántos más surgirán con el tiempo! Son fogones de amor para nosotros y de misericordia para la gente. ¡Qué suerte tener ya tantos en las misiones! Creo, es más, estoy seguro de que deben atraer muchas gracias sobre esas tierras.", "s": 11}, {"k": "p", "t": "Sólo nuestro Señor sabe dar el verdadero consuelo, para que se lo busque en él o al menos también en él, que es la fuente de toda consolación. Podemos confiarle lo que sea, que él siempre nos escuchará, nos consolará en nuestras penas y ayudará a soportarlas. Estas visitas a Jesús Sacramentado mantienen viva la vida de fe. Quiero que se vinculen con Jesús Sacramentado, de tal manera que no puedan más vivir sin él. Y cuando llega la hora de la visita, estén contentos, listos; no lamenten el tener que dejar sus otras ocupaciones.", "s": 11}, {"k": "p", "t": "Si el Señor nos hiciera la gracia de la adoración cotidiana, día y noche, como los Sacramentinos, deberíamos estar contentos. ¡Si nosotros también pudiéramos tener la adoración perpetua! No son pocos los Institutos que la tienen. Al menos la quiero desde el momento de mi muerte hasta el de mi sepultura. Recuérdenlo también cuando estén en las misiones. Más tiempo pasamos ante Jesús Sacramentado, más deseamos permanecer junto a él. Nunca nos aburrimos cuando hablamos con él. Al hacer la visita, hablemos un poco con él, pero después dejemos que él nos hable. Estén ante él como si estuvieran ante un amigo. Si serán devotos de Jesús Sacramentado, sin dudas serán misioneros y misioneras santos. 152. \"Apropiarnos\" del Señor. Cuando no puedan hacer la visita a Jesús Sacramentado, piensen que él está presente en alguna iglesia, y para él no cuentan las distancias. Esto no es algo imaginario. ¡Qué hermoso es recorrer espiritualmente las iglesias: son tantas! A lo largo del día, multipliquen el deseo de estar con Jesús Sacramentado, como tantos rayos que parten de él y vuelven a él. Un pensamiento dirigido a Jesús siempre ayuda. Eso es todo: ¡saber vivir prácticamente de la fe! Quisiera que todos fueran muy devotos de Jesús Sacramentado; quisiera que sus ojos miraran tan fijamente el sagrario, que fueran tan penetrantes, al punto de poder ver a Jesús en él. No es imposible… ¡se necesita la fe!", "s": 11}, {"k": "p", "t": "¡Deseo tanto que se compenetren de nuestro Señor!... El que ama al Señor, nunca se cansa, tampoco se siente solo… ¡\"Apropiarnos\" del Señor! Quiero que amen mucho a Jesús Sacramentado con un amor que dure no sólo cuando estamos en el templo, sino siempre y en todas partes. Me gusta tanto cuando, sobre la puerta del sagrario, veo representado un pelicán. ¡Vivamos unidos a Jesús Sacramentado y gocemos de poder nutrirnos de su sangre!", "s": 11}, {"k": "p", "t": "Estoy muy contento de que mi habitación esté en dirección al Santísimo Sacramento; me da tanto placer. ¡Él tiene buena vista! Así, también desde la cama se extiende un hilo no sólo eléctrico, ¡sino también \"telefónico\"! Y esto ayuda mucho, especialmente cuando tenemos algún problema.", "s": 11}, {"k": "p", "t": "153. Especialmente en las misiones. Estar día y noche frente a Jesús Sacramentado, ¿es tiempo perdido? Si un misionero o una misionera creen que pueden llevar a cabo su ministerio con muchos viajes y trabajando en exceso, se equivocan. No, no, ¡hay que ser sacramentinos! Los quiero sacramentinos, es decir hijos e hijas afectuosos de Jesús Sacramentado. Este título debería poder aplicarse a todos los cristianos, especialmente a los religiosos y los sacerdotes, y más aún a los misioneros y misioneras. Ustedes, si bien son de vida activa, pueden y deben ser sacramentinos y mantener el recogimiento en la clausura de sus corazones.", "s": 11}, {"k": "p", "t": "Lo mismo deben hacer en las misiones cuando tengan que afrontar días difíciles y sufrimientos, los llevarán a los pies de Jesús, le dirigirán tantas flechas de amor; y así, unidos a él, podrán hacer mucho bien a los demás. Que sean tantos sacramentinos: este es el propósito que les doy y que deseo pongan en práctica. ¡Sacramentinos, no sólo Consolatinos! No basta con trabajar, también hay que rezar, reparar. Apóyense siempre en la presencia permanente de Jesús Sacramentado en ustedes y en el santo sagrario. Especialmente en las misiones, que Jesús Sacramentado sea para ustedes consejero, consuelo, ayuda. Cuando exista alguna miseria, inclusive algún pecado, recurra
