nosotros, por eso disfruto tanto de estos encuentros con ustedes: debemos comprendernos íntimamente. Miremos el presente y preguntémonos: ¿anda bien nuestra comunidad?... ¿Podría ir mejor?... ¿Qué medios deberíamos adoptar?... ¿Qué obstáculos debemos evitar?... El futuro del Instituto depende del presente.", "s": 6}, {"k": "p", "t": "De ustedes, como misioneros y misioneras, el Señor quiere que se interesen concretamente por el bien común. Recuerden que el bien, para que sea realmente un bien, debe ser completo. Además, quien no es ordenado en las cosas materiales, tampoco lo es en sus pensamientos y en todo lo demás. Como ya se los he repetido, el bien hay que hacerlo bien pero, por nuestra misma vocación, es necesario hacerlo cada día mejor, es decir con espíritu. Lo que cuenta no es tanto la acción en sí misma, sino el espíritu con el que se la realice. Que así sea nuestra comunidad: ordenada en lo material, vivificada por el buen espíritu. 48. ¡A mí también me toca! Vivamos unidos e interesémonos por todo en la casa, como si cada metro cuadrado fuera nuestro. Es necesario que todos y cada uno demuestre interés; que cada uno se sienta miembro vivo del mismo cuerpo; trabajar todos de acuerdo y por el bien de todos, como hacen los miembros del cuerpo humano. ¿No tenemos todos el mismo fin? Sí, el mismo fin y el mismo deseo: que nuestra comunidad, que el Instituto proceda bien, prospere y realice su misión. Por lo tanto, no digan: \"a mí no me toca\". Nos toca a todos. Si alguien tropieza con una silla puesta fuera de lugar, con la excusa de que \"a mí no me toca\", no piensa en ponerla en su lugar; si encuentra en el piso un pedazo de papel, no lo recoge; si siente que se golpean una ventana o una puerta, no las cierra. Primero debemos hacer aquellas cosas de las que somos responsables, hacerlas bien, hasta el final, con espíritu; después interesarse también de todo lo demás. 49. Disciplina no sólo observada sino amada. Pero la disciplina no sólo debe ser observada, sino también amada. Si no se la ama será casi imposible llevar a cabo nuestras obras con alegría y constancia. Me parece que en las comunidades no falta tanto la observancia material cuanto más bien el amor a la disciplina. Por lo tanto, mientras todos hacen las mismas cosas, algunos las disfrutan porque las hacen con amor; otros, en cambio, no pudiendo vivir de otra manera, sólo sienten su peso.", "s": 6}, {"k": "p", "t": "Esto no significa que la observancia de la disciplina no cueste. Se trata de trabajar sobre la propia voluntad y de purificar sin reservas las propias tendencias desordenadas. Todo esto cuesta, pero el amor lo hace dulce y suave. No olviden la advertencia del Espíritu Santo: \"El que desprecia la sabiduría es un desdichado\" (Sab 3,11). Al contrario, quien la observa con amor goza de la paz perfecta. En vez de aspirar a cosas imposibles, hagan lo que deben hacer, háganlo bien, en el tiempo, lugar y modo indicados; y no por períodos, siguiendo el humor del día, sino siempre, todos los días y durante todo el día. ¡Eso es tener espíritu de disciplina! Sobre todo en las misiones es necesaria la disciplina, observada por deber y con amor. Dadas las circunstancias en las que se lleva a cabo el trabajo en las misiones, un hecho de indisciplina puede provocar desorden y perjuicios en la evangelización. 50. Buena educación y delicadeza. Más allá de cualquier consideración, la disciplina, como buena educación, también es necesaria para el apostolado. Un misionero y una misionera que no saben ser educados, no pueden ser estimados y, por lo tanto, les resulta difícil hacer el bien a la gente.", "s": 6}, {"k": "p", "t": "La educación también es necesaria para conservar la caridad. En las comunidades, como en las familias y en la sociedad, se necesitan ciertas atenciones. La educación bien entendida nos lleva a la delicadeza en los sentimientos, prepara el camino para que pensemos con humildad sobre nosotros mismos, para que no ofendamos a los demás, para que los prefiramos a nosotros mismos, para que seamos agradecidos. Así como la educación ayuda a vivir la caridad, la caridad, a su vez, ennoblece la educación. La caridad es mayor cuando más educación hay. Las comunidades más educadas viven más fácilmente la caridad entre sus miembros; en cambio, alí donde se empieza con palabras groseras, se termina faltando a la caridad. Por lo tanto, deseo que entre ustedes haya mucha delicadeza. Que cada uno se examine a sí mismo para ver si algo no corresponde a la misma. Quisiera que tuvieran esta caridad fina y que nuestra comunidad pudiera ser considerada una comunidad delicada.", "s": 6}, {"k": "p", "t": "¿Cómo se puede legar a ser finos y educados? Reflexionando y trabajando sobre nosotros mismos para quitar de nuestras costumbres lo que no corresponde a personas educadas. Créanme, está bien gastado el tiempo que empleamos para mirarnos a nosotros mismos, para preguntarnos si no hacemos algo que no corresponda a una persona educada, algo que pueda molestar a los demás. Además, se llega a ser finos y educados con la corrección fraterna. A veces uno no se da cuenta de los propios gestos ordinarios, por lo tanto es caridad auténtica decírselo. Las faltas contra la educación son pequeñas cosas que debemos corregirnos mutuamente.", "s": 6}, {"k": "p", "t": "A este tema de la buena educación le doy mucha importancia y nunca dejaré de insistir sobre él. Que la nuestra sea una comunidad educada. Junto con la piedad y el estudio, quiero buena educación y que todas las cosas estén bien hechas, con dignidad, moderación y delicadeza. No, no permito ninguna grosería aquí dentro. Es claro que, como hace notar san Bernardo, la educación no constituye la perfección religiosa, sino un medio que la favorece. Los buenos modales, en relación a las virtudes, son como las flores en relación a los frutos. Son sólo flores, pero flores que nos permiten esperar en los frutos. Vivamos así y el Señor nos bendecirá, así nuestra comunidad será, también en esto, una comunidad ordenada. ¡Nuestra Consolata es delicada y quiere que sus hijos también lo sean! 51. Control de sí mismo y modestia en el comportamiento. La modestia, entendida como discrecion y dignidad en el comportamiento, abraza todo lo que es nuestro aspecto exterior, \"de los pies a la cabeza\", como decía san José Cafasso. Esta es una gran virtud que proviene del dominio interno sobre las propias pasiones, y presupone otras virtudes, como la paciencia, la mansedumbre, la humildad, etc. Además requiere un continuo trabajo de autocontrol. Dios, invisible, se hace visible también en nosotros: no sólo a través de nuestras virtudes, sino también en el comportamiento externo. Por lo tanto, no sean modestos sólo por ustedes mismos, sino también para dar testimonio al prójimo.", "s": 6}, {"k": "p", "t": "¿Cómo adquirir la modestia? Ante todo con el ejercicio de la presencia de Dios. Sí, Dios está cerca nuestro y nos ve. Acostumbrémonos a vivir en Su presencia; entonces, solos o en compañía, siempre seremos reservados y dignos. Además, es necesario reflexionar con frecuencia sobre nosotros mismos para ver si hay algo contrario a la modestia y,en tal caso, intervenir inmediatamente. Sì, deseo que aprecien mucho la modestia.", "s": 6}, {"k": "p", "t": "En esto consiste la disciplina. Ámenla y obsérvenla. Ella es como la ley de Dios, que los acompaña en todas las acciones del día. Está escrito: \"Mucha paz para el que ama tu ley\" (Sal 118,165). Esta expresión siempre me gustó. Sí, recuerden que la paz abundante sólo viene del amor, por lo tanto de la observancia vivida por amor.", "s": 6}, {"k": "h3", "t": "Formación al estudio y al trabajo", "s": 6}, {"k": "p", "t": "52. Necesidad del estudio. Al misionero y a la misionera no les basta la santidad, también necesitan saber. En efecto, la piedad puede formar a un buen eremita, pero sólo los conocimientos, unidos a la piedad pueden formar buenos evangelizadores. El verdadero apóstol es también el que sabe. El estudio debe ser considerado en función de las misiones. No basta una preparación intelectual mediocre, sino una verdadera formación profesional. El misionero ignorante es un ídolo de tristeza y de amargura.", "s": 6}, {"k": "p", "t": "La necesidad del estudio es evidente en la Sagrada Escritura. En el Antiguo Testamento se lee en Malaquías: \"De hecho, los labios del sacerdote deben custodiar la ciencia y de su boca se busca la preparación, porque él es un mensajero del Señor de los ejércitos\" (Mal 2,7). El pueblo buscaba la verdad en los sacerdotes, quienes, por lo tanto, debían poseerla. Y en Oseas está escrito: \"Perece mi pueblo por falta de conocimiento. Como tú rechazas el conocimiento, te rechazaré a ti como sacerdote\" (Os 4,6). En el Nuevo Testamento el Señor dijo a los Apóstoles: \"Vayan e instruyan a todas las naciones\" (Mt 28,19). Pero para enseñar a los demás es necesario tener la preparación necesaria. Es por este motivo que san Pablo recordaba a Timoteo: \"Vigila sobre ti mismo y sobre tus enseñanzas y sé perseverante\" (1Tim 4,16).", "s": 6}, {"k": "p", "t": "San Francisco de Sales consideraba al estudio como \"el octavo sacramento\". Ustedes saben que santa Teresa decía que entre un confesor preparado y menos bueno y otro más bueno pero menos preparado, habría elegido, para tranquilidad de su alma, el más preparado. No hay que pretender tener la ciencia infusa, como en los Apóstoles, quienes, sin embargo, se formaron durante tres años en la escuela de Jesús. Créanme: harán mucho o poco bien también en proporción a los estudios que hayan realizado.", "s": 6}, {"k": "p", "t": "Un misionero o una misionera sin preparación intelectual son como una lámpara apagada. Por eso, sus conocimientos deben ser lo más amplios posible. Todo está pensado para formarlos, tanto en los estudios como en la piedad. Quien se comprometa en los estudios, al final de su formación se encontrará con todo lo necesario y útil para realizar bien la misión que el Señor le confiará. Recuerden también el dicho: \"las cosas repetidas ayudan\". Es necesario volver sobre las cosas que se estudian. La primera vez que se estudia un tema es para decirlo; la segunda, se empieza a asimilarlo; la tercera, se gusta la verdad.", "s": 6}, {"k": "p", "t": "53. Estudio de los idiomas. Les recomiendo en particular el estudio y práctica de los idiomas, para poder hablar y comunicar con la gente. En efecto, ¿para qué les servirían los estudios de filosofía, teología, etc., si después no se supiera comunicar a los demás el contenido de los estudios? Si las lenguas se hablan mal, el fruto será escaso, con la consecuencia de que se perderá el deseo de evangelizar, o se hará con poca energía o incluso con poca autoridad. Por lo tanto, recuerden: primero la filosofía, la teología, la Sagrada Escritura, después enseguida los idiomas. Considero este punto como un signo de vocación misionera en nuestro Instituto.", "s": 6}, {"k": "p", "t": "Las cartas de misioneros y misioneras con frecuencia contienen un lamento: no saber la lengua indígena y, por lo tanto, no poder evangelizar enseguida. Con ustedes no deberá pasar lo mismo. Estudien con empeño los idiomas. Cuando uno hace todo lo posible por aprender, el Señor, si es necesario, le dará el don de lenguas prometido a los Apóstoles. Cuando enviamos a Roma el primer vocabulario y la primera gramática kikuyu, realizados completamente por nuestros misioneros, el card. Cayetano De Lay escribió una larga carta de felicitaciones, comparando a nuestros misioneros con los santos Cirilo y Metodio, diciendo que, así como estos dos santos habían puesto por escrito la lengua de los pueblos eslavos, nuestros misioneros en cierto modo dieron vida a la lengua de los Kikuyu.", "s": 6}, {"k": "p", "t": "No basta con estudiar la gramática de un idioma, también hay que practicarlo. Quien no tiene inclinación y empeño para estudiar las lenguas, difícilmente vivirá su vocación misionera. Por lo tanto, insisto en el estudio de los idiomas. Es realmente una necesidad para los misioneros y misioneras.", "s": 6}, {"k": "p", "t": "54. Estudio para la misión. Se debe estudiar con humildad, energía, templanza y piedad. Con humildad: de esto hablaremos más detenidamente cuando hablemos de la virtud de la fe. Con energía: quiere decir estudiar con profundidad y sin perder tiempo. Con templanza: es decir no estudiar ni más ni menos de lo que hay que estudiar, sin sentir que se robó al estudio el tiempo que la obediencia destina a otras obligaciones. Aquí dentro, lo repito, todo está en función de las misiones.", "s": 6}, {"k": "p", "t": "En particular, estudiar con piedad: para un misionero y una misionera todo está dirigido a la piedad, inclusive el estudio. Mons. Eduardo Pulciano, cuando era seminarista, deploraba que entre la escuela y la capilla hubiera como una barrera. ¿Cómo se puede estudiar el sacramento del Bautismo sin que surja del corazón un gesto de agradecimiento a Dios que, sin ningún mérito, nos hizo ese don? ¿Cómo podemos estudiar la Eucaristía sin hacer alguna comunión espirtual? ¿O estudiar el sacramento de la Reconciliación y no agradecer al Señor por todas las veces que hemos recibido y recibimos este sacramento?", "s": 6}, {"k": "p", "t": "Estudiar con piedad también significa recurrir al Señor para tener la luz necesaria. Santo Tomás afirmaba haber aprendido más a los pies del Crucifijo que sobre los libros. Por lo tanto, estudien con devoción, como si lo hicieran en el templo. El Cura de Ars estudiaba siempre en la sacristía, para estar cerca del Señor. En la época de san Francisco de Sales circulaba la frase: \"Si quieres confundir al adversario usa el recurso que quieras, pero si quieres convertirlo recurre al obispo de Ginebra\".", "s": 6}, {"k": "p", "t": "El fin de los estudios no es otro que nuestra santificación y el servicio al Instituto y a la misión. Por lo tanto, no se estudia por motivos humanos. Todo lo que hagan, no lo olviden nunca, es en función de la evangelización. Quisiera que estas palabras del salmo se convirtieran en una oración constante: \"Enséñame el juicio y la sabiduría\" (Sal 119,66).", "s": 6}, {"k": "p", "t": "55. Trabajo: deber y honor. El misionero y la misionera deben distinguirse por su amor al trabajo. Quien no se adapte a los trabajos manuales no tiene espíritu misionero. Es necesario tener espíritu de oración y de trabajo; trabajo intelectual y trabajo manual. En los trabajos sean activos y en las cosas espirituales contemplativos.", "s": 6}, {"k": "p", "t": "El trabajo es un deber, pero es también un honor por haber sido santificado por la Sagrada Familia. Hasta los treinta años Jesús trabajó con san José en el humilde oficio de carpintero. María tampoco vivió toda su vida rezando; también trabajaba mucho, llevando a cabo las tareas de la casa de Nazaret. San Pablo, aun debiendo predicar, trabajaba para proveer a sus necesidades y a las de los demás: \"Nos agotamos, trabajando con nuestras manos\" (1 Cor 4,12). En los Hechos de los Apóstoles está escrito que san Pablo \"encontró a un judío llamado Aquila, originario del Ponto, que acababa de llegar de Italia con su mujer Priscila, [...]. Pablo fue a verlos, y como ejercía el mismo oficio, se alojó en su casa y trabajaba con ellos haciendo tiendas de campaña\" (Hech 18,2-3). El Card. Massaia 5 remendaba las ropas y reparaba los calzados de aquellos que quería evangelizar. ¿Acaso no hicieron lo mismo los Benedictinos y otros monjes, para evangelizar a los bárbaros?", "s": 6}, {"k": "nota", "t": "5 Guillermo Massaia (1809-1889), nacido en Piovà (Asti, Italia), entró en la Orden de los Capuchinos de Turín en 1826. Ordenado sacerdote en 1832, fue capellán del hospital Mauriziano de Turín y maestro de filosofía y teología en el convento de Testona (TO). Consagrado obispo en 1846, pudo entrar en la misión de Etiopía sólo en 1852, después de un largo viaje leno de sufrimientos y de peripecias inauditas. En 1879 fue expulsado por el emperador Joannes", "s": 6}, {"k": "p", "t": "Especialmente en la misión, la ciencia del trabajo no es menos necesaria que las otras ciencias.", "s": 6}, {"k": "p", "t": "Quien no sabe o no tiene ganas de trabajar no es un verdadero misionero o una verdadera misionera; le falta algo a su vocación. Cuando se llega a las misiones y todavía no se conoce la lengua local, ¿qué debemos hacer? Se empieza a trabajar y, mientras tanto, trabajando en contacto con la gente, se aprende el idioma. Si alguien dijera: \"Sólo quiero predicar, no trabajar\", cometería un error. Desde el África una misionera me escribía: \"Entre las cosas más necesarias en la vida de las misiones, junto con la obediencia y la caridad mutua, está el amor al cansancio\". Esto es válido también para los misioneros sacerdotes. 56. Ayudarse mutuamente. ¡Qué bueno cuando en una comunidad se da este competir en el ayudarse mutuamente! ¿Acaso no es así también en las familias? Es hermoso que todos cooperen en hacer el bien. Tanto quien barre, como quien trabaja o estudia, que lo haga por amor a Dios. En nuestro Instituto hay muchos servicios por realizar; uno tiene la capacidad para una cosa y el otro para otra, así entre todos se hace todo. Lo importante es hacerlo por amor a Dios, para santificarnos, para salvar almas. 57. Proveer al manteniento. Se va a las misiones para evangelizar, pero también es necesario mantenerse y, por lo tanto ocuparse del propio sustento. Cuando uno trabaja debe pensar", "s": 6}, {"k": "nota", "t": "IV, dejando en Etiopía varias comunidades cristianas. En 1884 fue creado cardenal por el Papa León XIII, el cual le pidió que escribiera sus recuerdos misioneros, publicados en 12 volúmenes apartir de 1885 con el título: Mis 35 años de misión en la alta Etiopía. Esta obra puede ser considerada una obra maestra de la literatura misionera internacional. José Allamano fundó el Instituto también con el fin de continuar la obra de Guillermo Massaia.", "s": 6}, {"k": "p", "t": "que colabora en el ahorro de la comunidad. Tratar de ganar algo para la comunidad es un deber porque somos miembros vivos del Instituto. Esto no es un colegio donde se paga, sino una familia donde todos pagamos de la misma manera. Si podemos ser útiles en algo, considerémonos afortunados y, por lo tanto, hagámoslo con gusto. Trabajar para mantenerse, pero también para ayudar a los demás. También san Pablo exhortaba a los cristianos a ponerse \"a trabajar honestamente con sus manos, para poder ayudar al que está necesitado\" (Ef 4,28).", "s": 6}, {"k": "p", "t": "Pienso que, para prepararnos bien a las misiones, es bueno aprender algún oficio y a hacer un poco de todo. Recuérdenlo: no quiero que aquí adentro los talentos no sean puestos en práctica. Que se valorice todo lo que se sabe y sirva. Que todas las capacidades sean cultivadas. No hay que tener miedo de ensuciarse las manos, sino de no aprender a realizar los trabajos manuales, inclusive los más humildes de la casa. Quien tenga problemas para hacerlos o los hace sin ganas, no está hecho para ser misionero o misionera. Aprendan de todo, den importancia a todas las cosas, tengan un espíritu de observación, sean emprendedores y amen el trabajo.", "s": 6}, {"k": "p", "t": "Es necesario trabajar bien, con esmero, pensando en lo que se está haciendo y sin perder el tiempo, con una auténtica voluntad de aprender. Trabajar con energía y no evitar la fatiga buscando la propia comodidad. Más hay para hacer, más se hace. Aquí se trabaja sólo por amor a Dios y, por lo tanto, el poco cansancio que sentimos, pensemos que es por el Señor y para hacernos santos. En todo hagamos la voluntad de Dios. Si hubiesen sido unos \"blandos\", no habrían venido a este Instituto.", "s": 6}, {"k": "h2", "t": "4. Misterios de Salvación", "s": 7}, {"k": "h3", "t": "Fundamento de la fe: la Santísima Trinidad", "s": 7}, {"k": "p", "t": "58. El misterio de la Santísima Trinidad es el fundamento de toda nuestra fe. Es un misterio incomprensible que debemos creer y adorar… además de tener la humildad de vernos tan mezquinos frente a tanta majestad, estar contentos de la infinita grandeza de Dios… así como darlo a conocer. La santa misa es el primer tributo, el único verdaderamente digno de la Santísima Trinidad. Honramos al Padre, al Hijo y al Espíritu Santo también con la señal de la cruz, el \"Gloria\", el \"Credo\" y, al concluir los himnos litúrgicos, alabando y glorificando la Trinidad. Recemos el \"Gloria\" muchas veces al día con afecto y entusiasmo, con la intención de rendir a la Santísima Trinidad toda la gloria que merece, también en nombre de todos los que no le rinden a Dios el honor que le es debido. El \"Gloria\" es un acto de perfecto amor a Dios con el que lo alabamos y queremos que sea glorificado por todos. Sí, ¡gloria a Dios por toda la eternidad!", "s": 7}, {"k": "p", "t": "La señal de la cruz es el signo del cristiano, es una oración, una alabanza a la Santísima Trinidad, es una profesión de fe. Los primeros cristianos se persignaban muy seguido, prácticamente en cada acción del día. Tertuliano dice: \"Ante cada hecho, cada vez que entramos o salimos de casa, cada vez que nos vestimos, cuando nos lavamos, cuando encendemos las lámparas, cuando conversamos, siempre nos hacemos la señal de la cruz\". Si no tuviéramos otro propósito que hacernos siempre la señal de la cruz, sólo con eso ya estaríamos honrando ampliamente a la Santísima Trinidad.", "s": 7}, {"k": "p", "t": "También es un homenaje a la Santísima Trinidad atribuir a su gloria todo lo que hagamos. Todo es de Dios, todo viene de Dios y todo está en Dios. Todo lo que existe le pertenece a Dios, porque él lo creó y todo lo que tenemos lo hemos recibido de Dios. Por lo tanto, todo debe volver a Dios, a Su honor y gloria, como decía san Ignacio \"Ad maiorem Dei gloriam\", para la mayor gloria de Dios. Así como la sangre arterial, partiendo del corazón, lleva la vida a la periferia del cuerpo y, por lo tanto, regresa al corazón la sangre venosa para que sea purificada, del mismo modo nuestras acciones tendrán valor y vida en la medida en que partan de Dios, de su santa voluntad y sean orientadas a su única y mayor gloria con una intención pura. Sí, todo en honor y gloria de la Santísima Trinidad.", "s": 7}, {"k": "p", "t": "Se puede decir que la Iglesia celebra a la Santísima Trinidad durante todo el año. Todos los domingos, todos los días, todas las horas son la fiesta de la Santísima Trinidad. Siempre se honra al Padre, al Hijo y al Espíritu Santo.", "s": 7}, {"k": "p", "t": "Todos los cristianos, pero especialmente los misioneros y las misioneras, deben honrar a la Santísima Trinidad. ¿Cómo anunciarla en forma creíble a los no cristianos? Sobre todo con nuestra fe, rindiendo honor y gloria a la Santísima Trinidad. De esta manera tendrán una gracia particular cuando presenten este misterio. ¡Es admirable que tantos no cristianos acepten y crean en un Dios Uno y Trino! \"Al Rey de los siglos incorruptible, invisible y único Dios, honor y gloria por los siglos de los siglos. Amén\"", "s": 7}, {"k": "h3", "t": "Año litúrgico", "s": 7}, {"k": "p", "t": "59. \"Dios amó tanto al mundo que entregó a su Hijo único\" (Jn 3,16). El Hijo se encarnó por nuestro amor: \"Por nosotros los hombres y por nuestra salvación\", como proclamamos en el \"Credo\". Dios, que nos amó desde toda la eternidad, nos da lo que él más ama: su propio Hijo Unigénito. Que sea \"Unigénito\" nos dice claramente hasta qué punto nos amó. Y el Hijo vino porque nos ama. ¿Qué se podía esperar? El amor pide amor. Este es un misterio de amor.", "s": 7}, {"k": "p", "t": "Como hijos de Dios y miembros de la Iglesia tenemos el deber no sólo de saber qué nos enseña en las diferentes fiestas durante el año sino de participar de las mismas. Cuando sea Adviento viviremos pensando en el Mesías, en la espera de quienes aún no lo conocen, de los profetas, etc. Si es un domingo, escuchando las lecturas y celebrando la Liturgia de las Horas participaremos de los sentimientos que la Iglesia propone particularmente a los fieles en ese día. De esta manera, debemos ser devotos de los santos, etc. Vivamos del espíritu de la Iglesia, que es el espíritu del Señor. Cada día él nos ofrece su propio alimento espiritual.", "s": 7}, {"k": "h3", "t": "Adviento", "s": 7}, {"k": "p", "t": "60. Con el Adviento empieza el año litúrgico. Es un tiempo de espera. Lo podríamos considerar una larga preparación a la santa Navidad. La Iglesia ha establecido cuatro semanas para prepararnos a conmemorar el nacimiento del Hijo de Dios. Este tiempo de Adviento nos recuerda las tres venidas de nuestro Señor Jesucristo: la venida al mundo con la Encarnación; la venida escatológica para el juicio universal; la venida espiritual en cada persona. ¡Qué importante es prepararnos a la venida de Jesús en nosotros! Entremos en este espíritu, apropiémonos de las invocaciones de los profetas que la Iglesia nos sugiere en la sagrada liturgia y repitámoslas con frecuencia durante el día: \"Si rasgaras el cielo y descendieras\" (Is 63,19).", "s": 7}, {"k": "p", "t": "En la liturgia, durante este tiempo, hay tantas aspiraciones: \"Despliega Señor tu poder y ven; defiéndenos de los peligros que nos acechan por culpa de nuestros pecados y sálvanos\". Pero, ¿nuestro corazón está preparado para recibir al Señor? Y luego aún: \"Despierta, Señor, nuestros corazones, y prepara en ellos el camino para tu Hijo Unigénito, para que con la gracia de su venida podamos servirte con una mente pura\"; \"Señor, escucha nuestra oración. Con la gracia de tu visita ilumina las tinieblas de nuestra mente, para que comprendamos bien el misterio que celebramos\". Tratemos de vivir este espíritu de la Iglesia.", "s": 7}, {"k": "p", "t": "El Adviento es un tiempo de renovación: aplanemos las colinas y colmemos los valles, evitando los pecados y poniendo en práctica las virtudes. Preparémonos, animémonos nuestro corazón para amar, para que el Señor lo llene de sus gracias. Jesús no viene si no es deseado. Jesús vendrá a nosotros con mayores gracias en proporción a nuestra preparación y a nuestros deseos. ¡Qué bueno es el Señor! Él escucha nuestras súplicas y viene a habitar en nosotros.", "s": 7}, {"k": "p", "t": "La Iglesia precede la Navidad con una novena particular, muy querida y seguida por todos, que nos estimula a invocar: \"Vengan, adoremos al Rey y Señor que viene\"; \"El Señor ya está cerca, vengan, adoremos\". En esta novena aprendan a vivir la fe: \"El justo vive de la fe\" (Rom 1,17). Y, sobre todo, arrodíllense ante este misterio. No pensemos que es una humillación el honrar al Niño. Deseen mucho que venga a nacer espiritualmente en ustedes y también en la comunidad. Ya en nuestra infancia hemos aprendido a amar este misterio y con qué devoción hacíamos la novena de Navidad. Recordemos lo que vivimos en ese entonces. Para mí es un recuerdo muy dulce.", "s": 7}, {"k": "h3", "t": "Navidad", "s": 7}, {"k": "p", "t": "61. Nuestro Señor quiso anonadarse hasta hacerse Niño. El pesebre nos habla de la humildad y la sencillez del Señor. Si él se hizo pequeño, ¿por qué no deberíamos hacernos pequeños nosotros? San Bernardo afirma que Jesús se hizo tan pequeño cuanto amable. San Agustín dice que el Redentor quiso nacer como un Niño para ser amado. San Francisco de Asís iba por las calles exclamando: \"¡Amemos al Niño de Belén! ¡Amemos al Niño de Belén!\". Y lo repetía a todos los que encontraba. ¿Quién no ama al Niño? En esta fiesta no se debe participar sólo con la razón, sino también con el corazón. Y quien no sienta este amor, que se lo pida a Jesús mismo por intercesión de la Santísima Virgen, que ardía de amor mientras esperaba a su hijo Jesús.", "s": 7}, {"k": "p", "t": "¡Qué importante es el misterio de Belén! Es maravilloso meditar sobre la Pasión, pero también lo es meditar sobre la Navidad. El santo Niño nos ha dado una importante lección al vencer las tres concupiscencias humanas: los placeres, las riquezas, los honores, para enseñarnos a vencerlas también nosotros. Él nos ha dado el ejemplo con sus sufrimientos, con la pobreza y la humildad. Naciendo tan pobre, el Señor ha querido alejarnos de todas las comodidades de este mundo. Y así, canonizó la pobreza.", "s": 7}, {"k": "p", "t": "La Navidad no es una fiesta sólo para los niños, sino también para nosotros, que debemos hacernos pequeños para poder entrar en el Reino de los cielos. Ejercitémonos en aquellas virtudes propias del santo Niño: la sencillez y la humildad. ¡Qué importante es la virtud de la sencillez para un misionero y una misionera, inclusive para ser felices aquí en la tierra! ¿Y qué podemos decir de la humildad? Nuestro Señor se hizo muy pequeño; después se rebajó, se anuló hasta la muerte en la cruz. Cuando vayan al templo, mirando a Jesús en el sagrario y, luego, contemplando al Niño en el pesebre, díganle: \"¡Quiero tener todas las virtudes!\".", "s": 7}, {"k": "p", "t": "Debemos amar al santo Niño por sí mismo. Él descendió del cielo y se encarnó precisamente por nosotros, por cada uno de nosotros y por nuestra salvación. Meditemos a fondo este \"exceso\" de amor de Jesús y, así, también nosotros lo amaremos. Pidámosle a Dios con insistencia este amor, repitiendo con san Agustín: \"¡Señor, que yo te ame!\".", "s": 7}, {"k": "h3", "t": "El Nombre de Jesús", "s": 7}, {"k": "p", "t": "61. El Padre ha dado a su Hijo el nombre de Jesús, que quiere decir Salvador, porque debía salvar al mundo. Así, cada nombre es como el programa de vida de quien lo lleva. San Pablo afirma que el Padre ha dado al Hijo un nombre que está por encima de cualquier otro nombre, porque ante su nombre toda rodilla se doble en los cielos, sobre la tierra y por debajo de la tierra. Y agrega que toda lengua proclame que Jesucristo es el Señor para gloria de Dios Padre (cf. Fil 2,9-11). En los Hechos de los Apóstoles se lee: \"No existe bajo el cielo otro nombre dado a los hombres por el cual podamos alcanzar la salvación\" (Hch 4,12). ¡Qué dulce es este nombre! Es miel en los labios, luz para la mente y amor para el corazón. San Pablo, en sus cartas, lo escribía muchísimas veces.", "s": 7}, {"k": "p", "t": "Jesús dice: \"todo lo que pidan al Padre en mi Nombre, él se lo concederá\" (Jn 15,16). Por eso la Iglesia concluye sus oraciones con la expresión: \"Por Cristo nuestro Señor\". Si para todos los cristianos este nombre tiene que ser dulce, cuánto más lo debe ser para ustedes que, como misioneros y misioneras, están destinados a anunciarlo a los no creyentes y, a ejemplo de san Pablo, inclusive sufrir por este nombre: \"Yo le haré ver cuánto tendrá que padecer por mi Nombre\" (Hch 9,16). Sí, soportar lo que sea, con tal de que el nombre de Jesús sea conocido y amado. Oremos para que este nombre, junto con el nombre de María, sea el último que pronunciemos antes de morir. Por lo tanto, gran devoción a este nombre. ¡Que él sea nuestro consuelo!", "s": 7}, {"k": "h3", "t": "Fin de año", "s": 7}, {"k": "p", "t": "63. Estamos a fin de año y, como en toda administración, necesitamos hacer nuestro balance final y elaborar el presupuesto para el futuro. Hoy hacemos el primero, mañana el segundo. En el balance final ponemos las ganancias y las pérdidas.", "s": 7}, {"k": "p", "t": "En las ganancias ponemos las gracias recibidas en el orden tanto natural como sobrenatural. En el orden natural: la conservación de la vida, que es una creación permanente; luego, la salud física. Porque si el Señor nos puso a prueba con algún dolor, también eso, en la mente de Dios, no fue un mal, sino una gracia. Estas son todas gracias que hemos recibido. En el orden sobrenatural: la vocación y la perseverancia. Este es un gran pensamiento que nunca podremos comprender adecuadamente. Después, para algunos la profesión religiosa, para otros los ordenes sagrados; para todos las homilías, las lecturas, las meditaciones, etc. Agreguen los sacramentos: las comuniones y, para nosotros los sacerdotes, todas las misas.", "s": 7}, {"k": "p", "t": "Además: las oraciones, las buenas inspiraciones… ¡Cuántas gracias! Debemos agradecer al Señor por todo esto.", "s": 7}, {"k": "p", "t": "A nuestro favor también podemos agregar un poco de buena voluntad para responder a la vocación, la corrección de los defectos, alguna mortificación interna y externa. Agradezcamos al Señor si logramos hacer algo, porque sin él no podemos hacer nada, ni mucho ni poco, ¡nada!", "s": 7}, {"k": "p", "t": "Entre las pérdidas no hay nada que provenga de Dios, de manera que él podría decir del Instituto, como de cada uno de nosotros: ¿qué más podría haber hecho por mi viña que no le haya hecho? (cf. Is 5,4). Sin embargo, ¡cuántas cosas nuestras encontramos entre las pérdidas! Que nadie diga: \"Antes era mejor\". Creo que nadie podrá decir eso, si bien todos tenemos cosas que mejorar. No nos desanimemos si hemos crecido poco y recemos a la Virgen María para que nos ayude a crecer más. Ella suple nuestras deficiencias si ve que tenemos buena voluntad. Lo mismo hace el Señor, que es un Padre bueno, dispuesto a perdonar todas las cosas con tal de que nos decidamos a hacer el bien. La perfección se adquiere con una voluntad firme, que renovarán cada mañana en la Comunión y varias veces al día, y que renovarán sobre todo en los retiros mensuales y con motivo de las fiestas.", "s": 7}, {"k": "h3", "t": "Año nuevo", "s": 7}, {"k": "p", "t": "64. Ayer hemos cantado el \"Te Deum\" por todas las gracias recibidas, y hoy el \"Veni Creador\" por el nuevo año. Empecemos el año con energía y de igual modo todos los días, cada momento, sin desanimarnos nunca. Y esto, háganlo aquí, así podrán hacerlo luego en las misiones. Este es el espíritu con el que tenemos que emprender el nuevo año. No pensemos más en el pasado; el presente está en nuestras ma-nos. Todos y todas llenos de buena voluntad. Esperemos llegar al final de este año agradeciéndoselo, así como ayer por la noche le hemos agradecido el año que pasó. La vida y la muerte son un misterio. El tiempo pasa y no regresa. Si no estamos atentos en responder a la gracia de cada uno de los momentos que componen un año, no podremos volver atrás para recuperarla; como el tiempo, la gracia que no sabemos recibir en su momento, se pierde para siempre.", "s": 7}, {"k": "p", "t": "En este nuevo año es necesario que nos comportemos como si fuera el último de nuestra vida. Si estuviéramos convencidos de esto, haríamos todo con más voluntad. Quiero decirles lo que hago yo cuando voy al coro de la catedral: medito sobre la muerte. Pienso que el día de mi muerte me sepultarán en la catedral y que los canónicos pasarán por la calle S. Clara, la calle Basílica, hasta la Catedral. ¿Les parece que pensar en esto me haga mal? Al contrario, ¡me hace bien! Un buen día pasaré por esas mismas calles, ya no caminando con mis propias piernas, sino llevado por otros, y entonces ¡cómo me habría gustado hacer bien este trayecto! Por lo tanto, pienso en el bien y en el mal que podrán decir sobre mí. Si conocieron mis defectos, dirán: \"Ese sacerdote no era bueno, etc.\" Después llego a la catedral. Allí hay una estatua de la Virgen María; es la que más quiero, después de nuestra Consolata. La saludo con una reverencia y pienso que me colocarán allí adelante y que, entonces, ella me sonreirá. Por lo tanto, me llevarán frente al altar del Santísimo Sacramento. Espero que nuestro Señor, al verme, se complazca y me mire diciéndome: \"Muy bien, siempre viniste aquí a rezar con fe; ahora me ocupo yo de tu alma\". Les digo que esto me hace bien porque son cosas que sucederán.", "s": 7}, {"k": "p", "t": "Miren el año que tienen por delante y hagan un examen preventivo. Como lo hacemos cada mañana frente a la jornada, lo mismo debemos hacer con respecto a todo el año. Recuerden la hermosa oración de santa Isabel, reina de Francia: \"¿Qué me sucederá este año? No lo sé, pero sé que no me sucederá nada que no haya sido previsto, pensado y ordenado desde toda la eternidad\". Digamos lo mismo nosotros e identifiquémonos con la voluntad de Dios: acepto todo, quiero todo sin restricciones. Ese acto tiene mucho valor: identificarnos con la voluntad de Dios no sólo en general, sino también en las más pequeñas circunstancias. ¡Que no vivamos nada, ni una palabra ni una obra que no sean para Ti, mi Dios!", "s": 7}, {"k": "p", "t": "Por eso es importante apuntar bien la mira. Tratemos de pasar este nuevo año lo mejor posible; si habrá debilidades, tratemos de repararlas enseguida; que no haya ningún día inútil. ¡Que el nuevo año sea un año con tantas bendiciones, para nuestros Institutos, para las misiones, para los misioneros y las misioneras!", "s": 7}, {"k": "h3", "t": "Epifanía", "s": 7}, {"k": "p", "t": "65. \"Vino la Luz verdadera, la que ilumina a todos los hombres\" (Jn 1,9). Epifanía es una palabra griega que significa \"manifestación\" o \"aparición\". El Niño Jesús, después de haberse manifestado a los judíos, representados por los pastores, por medio de los ángeles, se dio a conocer a los paganos, representados por los Reyes Magos, por medio de una estrella. Agradezcamos al Señor el haber sido llamados, por la manifestación a los Reyes Magos, a gozar de los frutos de la Redención, con el don de la fe. Agradezcámosle también en nombre de los no cristianos, porque ellos también son llamados a la fe, a conocer y amar a Jesús. Agradezcámosle especialmente por la vocación misionera, a través de la cual Jesús sigue manifestándose a los no cristianos, haciéndonos participar de esta misión universal. Por último, agradezcámosle por las gracias concedidas a nuestros Institutos, así como por todo el bien que se realiza en las misiones.", "s": 7}, {"k": "p", "t": "Imitemos a los Reyes Magos respondiendo a nuestra vocación con prontitud, generosidad y constancia. ¡Qué hermoso es meditar sobre ellos! ¿Qué podemos aprender? Me parece que el pensamiento principal que podríamos conservar durante todo el año es su fidelidad al llamado de Dios. La estrella que apareció en Oriente seguramente fue vista por muchas personas, pero sólo los Reyes Magos, iluminados internamente por la gracia, reconocieron en ella el signo del nacimiento del Mesías; por eso se pusieron en movimiento, partieron y llegaron a Belén: \"Hemos visto… y hemos venido\" (cf. Mt 2,2). También muchos y muchas entre ustedes sintieron la voz de Dios llamándolos al apostolado pero, pasado el primer entusiasmo, todo se desvaneció. No basta con haber dado rápidamente el primer paso; también hay que corresponder a esta primera gracia. San Agustín nos exhorta a estar atentos al \"tiempo de la estrella\" para no dejar que el Señor pase de largo con sus gracias.", "s": 7}, {"k": "p", "t": "Los Reyes Magos demostraron no sólo una fidelidad inmediata, sino también generosa y constante. Se dirigieron enseguida hacia la meta, a pesar de la distancia y las dificultades del camino, así como de la momentánea desaparición de la estrella. Superaron con generosidad todas estas dificultades porque creían firmemente en Dios y en sus promesas. Apliquemos esto a nosotros mismos. ¿Es así nuestra respuesta cotidiana a la gracia? ¿Enfrentan con fuerza las pruebas que encuentran a su paso? ¿Se entrenan para ser generosos frente a los problemas de la misión? ¿Son fuertes en la fe? El Señor no les manda solo una, sino muchas estrellas, que son las gracias para permanecer de pie y hacerse santos misioneros y misioneras. Por lo tanto: fidelidad generosa y constante para responder a la gracia de la vocación.", "s": 7}, {"k": "p", "t": "Los Reyes Magos, después de haber encontrado al Niño, le ofrecieron oro, incienso y mirra, que simbolizan la caridad, la oración y la mortificación. Del mismo modo deben obrar ustedes cada día, y hasta diría cada hora: tratar de crecer en el amor de Dios y del prójimo; recen fervorosamente para que Jesús les infunda el espíritu apostólico; revístanse del espíritu de mortificación, que deberá acompañarlos durante toda la vida. La Epifanía es nuestra fiesta. Debemos ser misioneros y misioneras con la cabeza, la boca, el corazón, es decir en los pensamientos, las palabras y las obras. Nuestra estrella es llegar a ser santos Misioneros y Misioneras de la Consolata. No debemos hacer otra cosa que seguirla.", "s": 7}, {"k": "h3", "t": "Presentación de Jesús en el templo", "s": 7}, {"k": "p", "t": "66. Después de apenas cuarenta días desde su nacimiento, Jesús es presentado al Padre en el templo. Esta entrega corresponde a la que él, más tarde, hará de sí mismo en el Calvario, para expiar los pecados de toda la humanidad. Ya el profeta había puesto en sus labios aquellas palabras que dicen: \"Tú no quisiste víctima ni oblación; pero me diste un oído atento; no pediste holocaustos ni sacrificios, entonces dije: Aquí estoy\" (Sal 40,7-8). Jesús fue llevado al templo para ser ofrecido a Dios, y María se unió a él. Simeón lo llamó \"Luz para alumbrar a las naciones paganas\" (Lc 2,32) y predijo a su Madre: \"y a ti misma una espada te atravesará el corazón\" (Lc 2,35). Ella generosamente aceptó y se ofreció para llevar a cabo el plan de Dios.", "s": 7}, {"k": "h3", "t": "Cuaresma", "s": 7}, {"k": "p", "t": "67. \"Y porque somos sus colaboradores, los exhortamos a no recibir en vano la gracia de Dios. Porque Él nos dice en la Escritura: En el momento favorable te escuché, y en el día de la salvación te socorrí. Este es el tiempo favorable, este es el día de la salvación\" (2Cor 6,1-2). Pablo llama \"tiempo favorable\", \"día de la salvación\", es decir digno de ser aceptado con gratitud y amor, el tiempo del Evangelio. La Iglesia aplica estas palabras de Pablo a la Cuaresma y nos las repite frecuentemente. De hecho, el tiempo de Cuaresma es realmente favorable. En él el Señor acepta encantado todo lo que hacemos, escucha nuestras súplicas más que en otros momentos. Por lo tanto, debemos despertarnos, no dejarlo pasar en vano: debemos valorarnos mucho y no decir: \"Pero yo no puedo ayunar, no puedo rezar más de lo que ya rezo\". No es la cantidad lo que importa, sino la intensidad. Necesitamos estar más unidos a Dios y no pasar horas enteras sin pensar en Jesús. ¡Eso es todo! Esas mismas palabras podemos aplicarlas a ustedes que se preparan para ir a las misiones. Es necesario responder en este tiempo de Cuaresma, porque es el tiempo favorable, estar animados y no formar parte del grupo de los que caminan a tientas…", "s": 7}, {"k": "p", "t": "La Cuaresma es un tiempo especial de penitencia y oración. Nosotros todavía no somos como aquellos santos que se alimentaban sólo a pan y agua. De todos modos, el espíritu de penitencia es necesario para acostumbrarse a las exigencias de la vida. El Señor ama los pequeños sacrificios, perennes, puntuales. Hay tantos modos de hacer penitencia y de ayunar. El que no lo hace de una forma, debe hacerlo de otra. Además del ayuno de alimentos existe el de los ojos, el de la imaginación y el del espíritu. 68. La Iglesia, especialmente en este tiempo cuaresmal, recurre mucho al salmo 50, el \"Miserere\", que nos hace rezar la Liturgia de las Horas. Esto es muy oportuno por ser un salmo penitencial, compuesto por David después de su pecado. Él nos enseña el temor, la esperanza y los buenos propósitos. Examinémoslo y apliquémoslo a nosotros.", "s": 7}, {"k": "p", "t": "El Miserere puede ser dividido en dos partes. Ante todo, David para obtener misericordia le presenta al Señor cinco razones. La primera es la gran misericordia de Dios, su infinita compasión por nuestras miserias: \"Piedad de mí, Señor, según tu misericordia\" (v.1). Señor, borra mis pecados a la luz de tu misericordia. No te guíes según la justicia, sino según tu bondad: \"Lávame de todas mis culpas\" (v.4).", "s": 7}, {"k": "p", "t": "La segunda razón es que David reconoce su propia bajeza y detesta sinceramente el propio pecado: \"Reconozco mi culpa, mi pecado está siempre delante de mis ojos\" (v.5). Por lo tanto, el pecado no está más en mí, sino sólo frente a mí, para ayudarme a ser humilde. El tercer motivo es que, habiendo ofendido a Dios, sólo de Dios puede recibir el perdón: \"Contra ti, solo contra ti he pecado\" (v.6). Luego, la cuarta razón es que él merece compasión, porque todos somos débiles y nos inclinamos al mal. No quiero excusar mi pecado, aún más, estoy triste por él, sin embargo me siento inclinado a él desde mi nacimiento: \"Fui engendrado en la culpa, en el pecado me ha concebido mi madre\" (v.7). Por último, la quinta razón está constituida por las gracias y los favores especiales recibidos. Tú, Señor, has hecho tanto por mí antes de que pecara. Ahora purifícame, de modo tal que pueda recuperar tu amistad: \"Tu quieres la sinceridad del corazón y en mi interior me enseñas la sabiduría\" (v.8).", "s": 7}, {"k": "p", "t": "Con estos motivos como premisa, en la segunda parte David confía en la justificación: \"Devuélveme la alegría de la salvación\" (v.14). Y promete enseñar a los demás los caminos del Señor: \"Enseñaré tus caminos a los que están perdidos y los pecadores volverán a ti\" (v.15).", "s": 7}, {"k": "p", "t": "Así es como debemos meditar y aplicar a nosotros este hermoso salmo. Cada uno, para su propio provecho espiritual, realice las aplicaciones que Dios le inspira. Quien desee hacer una penitencia auténtica sólo debe rezar el Miserere despacio. Aprendan esto, porque les servirá en las misiones. Un Miserere bien dicho, consuela.", "s": 7}, {"k": "h3", "t": "Pasión y muerte", "s": 7}, {"k": "p", "t": "69. Todos los santos fueron muy devotos de la Pasión de Jesús. Si todos deben pensar en la Pasión de Jesús, con más razón los misioneros y misioneras. Para ustedes debe ser una de las devociones más importantes. El mismo Santísimo Sacramento es un memorial y una renovación de la Pasión.", "s": 7}, {"k": "p", "t": "Meditemos la Pasión del Señor y nuestro corazón, si no es de piedra, se conmoverá. Jesús sufrió por cada uno de nosotros, como si no existiera nadie más: \"me amó y se entregó por mí\" (Gál 2,20). Quien reflexiona sobre el hecho de que Jesús fue sacrificado por nuestros delitos (cf. Is 53,5), debe arrepentirse y reparar con la penitencia sus propias culpas. Unamos nuestros dolores, nuestros sufrimientos a los dolores de Jesús, como Pablo, que decía: \"yo llevo en mi cuerpo las cicatrices de Jesús\"", "s": 7}, {"k": "p", "t": "(Gál 6,17) y \"completo en mi carne lo que falta a los padecimientos de Cristo\" (Col 1,24). Expresemos nuestros afectos ante los dolores soportados por nuestro Señor. Así lo hacía san Pablo: \"Yo sólo me gloriaré en la cruz de nuestro Señor Jesucristo, por quien el mundo está crucificado para mí, como yo lo estoy para el mundo\" (Gál 6,14). Todo esto significa que debemos apropiarnos de la Pasión del Señor, es decir tratar de que siempre esté presente en nuestra mente, en nuestro corazón, en nuestro cuerpo, en nuestro espíritu.", "s": 7}, {"k": "p", "t": "Meditemos profundamente sobre los sufrimientos de Jesús. De allí surgirá también en nosotros el deseo de sufrir por él, de hacer sacrificios, de vencer las penas del corazón y del espíritu y, hasta donde sea posible, también las del cuerpo. Hasta que no estemos bien empapados de la Pasión de Jesús, no lograremos vivir con generosidad el espíritu de sacrificio. Crezcan en el amor, fortalézcanse en el espíritu de la Pasión. Lo que más les dará fuerzas cuando estén en las misiones, será precisamente pensar en la Pasión de Jesús. ¿Qué podrán hacer un misionero y una misionera sin el amor a Jesús crucificado? La meditación sobre la Pasión del Señor los ayudará a comprender su expresión \"tengo sed\" (Jn 19,28), y encenderá en ustedes el ardor misionero. 70. Seamos devotos del Crucifijo. Tratemos de tenerlo en nuestras habitaciones, sobre nuestro cuerpo; dirijámosle con frecuencia gestos de fe y de amor. Al Santísimo Sacramento no lo tendrán siempre con ustedes, pero al Crucifijo sí. ¿Qué es el Crucifijo para un misionero, para una misionera? Es un \"libro\", un \"amigo\" y un \"arma\". Un libro para leer y meditar, un amigo que consuela y ayuda, un arma muy potente contra el demonio. No basta con llevar el Crucifijo, también hay que imitarlo. Nos guste o no, nuestra vida está sembrada de sufrimientos; nadie está exento de ellos. El secreto está en soportarlos con paciencia, aun más, en amarlos e, incluso, desearlos. Jesús no ha dejado la cruz a mitad de camino; cayó, pero se volvió a levantar y siguió hasta el final. Pidámosle que nos dé luz sobrenatural y amor para llevar nuestra cruz detrás de él y por amor a él, sin arrastrarla por obligación.", "s": 7}, {"k": "p", "t": "Nuestra cruz no es pesada como la suya y, si la llevamos unidos a él, en el amor, se vuelve liviana. Es fácil decir que amamos al Crucificado, pero después, cuando se trata de llevar un poco la cruz, de soportar inclusive pequeñas cosas, damos marcha atrás. Sin embargo, el Señor nos lo dijo claramente: \"El que quiera venir detrás de mí, que renuncie a sí mismo, que cargue con su cruz y me siga\" (Mt 16,24). San Pablo exclamaba: \"Yo estoy crucificado con Cristo\" (Gál 2,19). ¡Esto es amar la cruz!", "s": 7}, {"k": "p", "t": "Es por medio de la cruz que nos santificamos, no por medio de las palabras o de las simples oraciones. Indudablemente éstas también son útiles; pero siempre lo más importante es saber llevar bien la cruz. El camino por excelencia que conduce al paraíso es y será siempre el de la cruz. Para alcanzar la gloria no hay otro camino que imitar a Jesús sufriente. Pero él no se deja ganar en generosidad y nos regala tanta paz y alegría. Sufrir bien es un don de Dios; ¡feliz aquel que lo recibe!", "s": 7}, {"k": "p", "t": "Siempre tenemos que tener este espíritu, durante toda la vida: sacrificarnos siempre. La Pasión del Señor nos sostendrá en el cansancio y en los sufrimientos provocados por el apostolado, así como en la misma muerte. ¡En la cruz el Señor nos lava en su sangre! Pongámonos a los pies de Jesús crucificado y pidámosle que nos purifique. Es a sus pies que podemos aprender a ser generosos en los sacrificios. Quien no participa con amor al recuerdo que la Iglesia hace de la Pasión de Jesús, o no tiene corazón, o perdió la razón.", "s": 7}, {"k": "h3", "t": "Pascua de resurrección", "s": 7}, {"k": "p", "t": "71. La Pascua es una fiesta que disfrutábamos ya en nuestra infancia, porque es una fiesta que llega al corazón. \"Cristo, después de resucitar, no muere más, porque la muerte ya no tiene poder sobre él\" (Rom 6,9). Debemos resucitar en el fervor; no sólo del pecado, sino de todas nuestras debilidades. Conservemos siempre el fervor que sentimos en esta fiesta. ¡Ya no moriremos! Que todos se digan a sí mismos: \"Hemos resucitado, no queremos morir más, queremos ser verdaderos misioneros, verdaderas misioneras!\". ¡No tengan miedo de ser demasiado fervorosos! 72. Apareciéndose a los apóstoles, después de la resurrección, Jesús los saludó deseándoles la paz. ¡Qué importante es la paz! San Agustín dice que ésta consiste en la tranquilidad del orden. Cuando todo está en orden en nosotros y a nuestro alrededor, entonces estamos en paz. Por lo tanto, es necesario estar en paz con Dios, cumpliendo su voluntad; en paz con nosotros mismos, evitando las distracciones, controlando las pasiones y liberándonos de los deseos inútiles; y en paz con el prójimo, sobre todo aceptando sus límites y tratando bien a todos. También podemos conservar la paz en medio de los sacrificios y las dificultades, pero no cuando pecamos. Con esta paz, que es un don de Dios, avanzarán tranquilos y les irá mejor en todo. Pídansela a nuestro Señor, que es el Príncipe de la paz. Él se las dará, con tal de que estén dispuestos a hacer todo lo necesario por conservarla.", "s": 7}, {"k": "p", "t": "73. En este tiempo pascual se siente la necesidad de gritar con fuerza: ¡Aleluya! La Iglesia nos lo hace repetir muchas veces en la liturgia, junto a: \"Este es el día que ha hecho el Señor: alegrémonos y regocijémonos en él\" (Sal 117,24). Y también es suave y dulce al corazón la oración que durante todo el tiempo pascual dirigimos a María Santísima: \"¡Reina del cielo, alégrate, aleluya!\". El espíritu de la Iglesia en este tiempo es un espíritu de alegría. Quien no participara de esta fiesta, quien no sintiera alegría en su corazón, no tiene ni corazón ni espíritu.", "s": 7}, {"k": "p", "t": "La alegría es una virtud necesaria. Nunca estamos lo suficientemente alegres. Podemos tener alegría, pero de aquella mundana y grosera; la verdadera, la del corazón y el espíritu, nunca es demasiada. Estemos siempre alegres, todos los días, todo el año. El Señor ama y prefiere a las personas alegres. El salmo dice: \"Sirvan al Señor con alegría\" (Sal 99,2). San Pablo exhorta: \"Alégrense en el Señor, siempre\"; y, como si no bastara, repite: \"alégrense\" (Fil 4,4). El Señor quiere que estemos siempre alegres, incluso… mientras dormimos, como los niños que, cuando duermen, tienen una expresión tan bella y sonriente. Con alegría se vive mejor y más perfectamente. El salmo dice: \"Me alegro de cumplir tus prescripciones\" (Sal 118,14), es decir cuando confío. Por eso, es como si corriéramos por el camino de sus mandamientos. En cambio, cuando somos melancólicos, es como si camináramos despacio, con pies de plomo.", "s": 7}, {"k": "p", "t": "Seamos alegres también con el prójimo, de modo tal que no deba soportarnos, sino que pueda decir: \"¡Estos misioneros y misioneras dejan su casa, sus familiares, todo y, sin embargo, siempre están alegres!\". Si se quiere hacer el bien, es necesario estar alegres: el prójimo es edificado y atraido por esta virtud. Uno puede ser santo, pero si está encerrado en sí mismo, infunde miedo y nadie quiere acercársele.", "s": 7}, {"k": "p", "t": "Naturalmente, la alegría no debe ser grosera. Ella no consiste en la disipación, en gritar fuerte, en poner la casa patas para arriba. Hablar, sonreír, pero sobre todo con moderación, porque la alegría es una virtud; estén atentos a no salirse de los carriles. 74. La alegría se opone a la tristeza. Es necesario animarse pa-ra que la tristeza no se transforme en desesperación. Cuando se vive con melancolía ya no se puede hacer el bien. Algunos son melancólicos de nacimiento, por temperamento. Otros lo son sin saber el porqué. A otros todo les pesa: nunca están contentos, quieren cambiar siempre, necesitan de novedades permanentemente y, por lo tanto, se dejan dominar por el aburrimiento y la melancolía. Tenemos que ser estables; no como cañas agitadas por el viento, es decir un poco alegres y un poco melancólicos. Si se comportarán así en las misiones, ¿qué sucederá? La tristeza ofusca la mente, enfría la voluntad y quita la paz.", "s": 7}, {"k": "p", "t": "Venzamos la tristeza con la oración, con el deseo de santificarnos, contentos de nuestro estado actual, aceptando el bien y el mal de las manos de Dios; y con paciencia, para soportar las adversidades. Propongámonos vivir una vida santamente alegre y fervorosa. Una comunidad donde todos tuvieran este propósito sería un anticipo del paraíso. Debilidades siempre habrá, pero estamos aquí para aceptarnos, sostenernos y santificarnos. No debemos ceder a la melancolía; en cambio pongamos todo en las manos de Dios para edificarnos mutuamente y también a los que no pertenecen a la comunidad. No quiero que ésta sea la casa de la melancolía, sino de la alegría. En las misiones, si no sabrán vencerse a ustedes mismos, si no sabrán frenar el malhumor, sólo harán el mal a los demás.", "s": 7}, {"k": "p", "t": "Me gustan los que hacen siempre la voluntad de Dios, los que buscan y encuentran la seguridad en sus manos. ¡Qué placer cuando alguien avanza siempre, sin retroceder nunca! Los quiero alegres. Hay que estar bien de alma y de cuerpo. Yo deseo que se conserve y crezca cada vez más el espíritu de tranquilidad, de libertad, de serenidad. ¡Este es el espíritu que yo quiero: siempre alegría, siempre caras alegres!", "s": 7}, {"k": "h3", "t": "Ascensión", "s": 7}, {"k": "p", "t": "75. La Ascensión es un misterio que llega al corazón y llena el alma de paraíso. El Señor conduce a los apóstoles sobre la montaña para hacerlos partícipes de su gloriosa Ascensión al cielo. A lo largo del camino, él les hace las últimas advertencias, hasta que una \"nube\" viene a llevárselo ante sus propios ojos. Ellos permanecen inmóviles, pero un ángel los sacude diciéndoles: \"Hombres de Galilea, ¿por qué miran al cielo? Este Jesús, que ha estado entre ustedes y ha ascendido al cielo, volverá un día del mismo modo en que lo vieron ir al cielo\" (Hech 1,9-11). Tal vez los apóstoles habrían debido responder: ¡nosotros también queremos ir al paraíso! No, no, primero vayan a trabajar por muchos años, hagan lo que él le dijo. Entonces regresaron a Jerusalén.", "s": 7}, {"k": "p", "t": "Por lo tanto, la Ascensión es la fiesta del paraíso. Nuestro corazón está con Jesús y ascendemos con Él. Él ha sido glorificado y está sentado a la derecha del Padre para interceder por nosotros (cf. Heb 7,25) y nos prepara un lugar, según la promesa hecha a los apóstoles (cf. Jn 14,2-3). Sí, Jesús tiene preparado ese lugar en el paraíso para mí, para cada uno de ustedes, si es que lo deseamos. Este pensamiento debe animarnos, debe estimularnos a ser dignos misioneros y misioneras, comprometernos a trabajar un poco en esta vida, para luego poder gozar de su presencia en la eternidad. ¡Coraje y constancia! El paraíso cuesta, pero nunca lo habremos pagado lo suficiente.", "s": 7}, {"k": "p", "t": "Consideremos particularmente las últimas palabras que Jesús dirigió a los apóstoles antes de subir al cielo: \"Vayan por todo el mundo y prediquen el Evangelio a todas las criaturas\" (Mc 16,15). Jesús entregó el mandato a los misioneros y a las misioneras. ¡Miren qué consuelo! En ese momento el Señor pensó en cada uno de nosotros. Se ve cuánto amaba a su Iglesia. Como recuerdo podía decir a los apóstoles: sean más pacientes, más buenos, más caritativos, más humildes, etc... En cambio no: vayan por todo el mundo.", "s": 7}, {"k": "p", "t": "Jesús quiso agregar también la promesa de ayudas sobrenaturales y extraordinarias: \"Estos serán los signos que acompañarán a los que creen: en mi nombre echarán a los demonios, hablarán lenguas nuevas\" (Mc 16,17). En esos momentos, él pensó en nosotros, misioneros y misioneras, que continuamos la misión confiada a los apóstoles. ¡Cuánto deben consolarnos esas promesas que se verificaron en los apóstoles de todos los tiempos! Antes de subir al cielo Jesús también les dijo: \"quédense en la ciudad hasta que no sean revestidos de la potencia que viene de lo alto\" (Lc 24,48). Es como si hubiera dicho: no se dejen dominar por la ansiedad de querer ir a evangelizar; primero prepárense. Por lo tanto, antes de comenzar la misión es necesaria la preparación a través de la gracia comunicada por el Espíritu Santo.", "s": 7}, {"k": "h3", "t": "Pentecostés", "s": 7}, {"k": "p", "t": "76. Jesús dice: \"Ahora les digo la verdad: es mejor para ustedes que yo me vaya, porque si no me voy, no vendrá a ustedes el", "s": 7}, {"k": "p", "t": "Consolador; pero cuando me habré ido, se los mandaré\" (Jn 16,7). El Espíritu Santo no desciende sólo con sus dones y su frutos, sino él mismo en Persona. El Señor no dijo: \"Reciban los dones del Espíritu Santo\", sino: \"Reciban el Espíritu Santo\" (Jn 20,22).", "s": 7}, {"k": "p", "t": "Es el Espíritu Santo quien aplica los méritos de la Redención realizada por Jesús, quien convierte y santifica a las personas. Él nos ilumina y da calor, nos concede la gracia para salvarnos y santificarnos, nos ofrece sus dones. En todos los tiempos es el Espíritu Santo el que forma a los santos.", "s": 7}, {"k": "p", "t": "Los apóstoles, habiéndose retirado en el Cenáculo, eran perseverantes y permanecían unidos en la oración, junto con María (cf. Hech 1,14). Ella ayudó a los apóstoles a recibir la abundancia del Espírtu Santo y, del mismo modo, también nos ayudará a nosotros. El Espíritu Santo no viene en medio del ruido y la disipación, sino en el recogimiento. Hagan todo con el fin de obtener la plenitud del Espíritu Santo. En el Cenáculo estaban todos unidos, todos de acuerdo. Esto es importante, porque donde no hay amor, el Espíritu Santo no entra.", "s": 7}, {"k": "p", "t": "La Iglesia nació en Pentecostés con la efusión del Espíritu Santo. Es él quien dirige la Iglesia hasta el final de los tiempos. El Papa y los obispos siguen guiándola bajo la inspiración del Espíritu Santo. Pentecostés ha sido llamada la \"segunda Pascua\". San Juan Crisóstomo la define el cumplimiento de todas las otras solemnidades. San Máximo escribe que no es sólo una conmemoración, sino la renovación de la venida, siempre de un modo nuevo, del Espiritu Santo. Como entonces, también hoy el Espíritu Santo desciende, aún invisiblemente, sobre la Iglesia y sobre los fieles que están preparados. La misma difusión de la fe es el efecto de la acción del Espíritu Santo. Por lo tanto, a él hay que atribuirle todo el bien que se realiza en las misiones.", "s": 7}, {"k": "p", "t": "77. Al Espíritu Santo se atribuyen las obras del amor y la gracia. Él es todo amor y, por el amor que nos trae, desea ardientemente entrar en contacto con nosotros. Ahora bien, el amor exige amor. Nuestros deberes hacia el Espíritu Santo son: conocerlo, amarlo y seguirlo. Pidámosle que encienda nuestro corazón para que seamos creaturas nuevas. Del Espíritu Santo se reciben todas las gracias, pero sobre todo el amor. No traicionamos al Padre si amamos al Hijo, así como no traicionamos al Hijo si amamos al Espíritu Santo. Este amor es el que impulsó a los apóstoles a evangelizar con ardor. También nosotros lo necesitamos, y es del Espíritu que debemos obtenerlo.", "s": 7}, {"k": "p", "t": "Es difícil que quien vive bajo su influencia no se vuelva santo. Escuchemos con atención su voz en nuestro corazón, que es la voz de la gracia, y tratemos de traducirla en gestos concretos. Sigamos al Espíritu Santo con generosidad y constancia. Si lo recibiéramos como se debe, todos seríamos verdaderos y santos apóstoles. Pongámonos en sus manos, dejémoslo obrar en nosotros, sigámoslo dócilmente: que él lleve a cabo nuestra santificación. Cuando recibimos al Espíritu Santo con sus dones y sus frutos, somos transformados.", "s": 7}, {"k": "p", "t": "San Pablo dice: \"No entristezcan al Espíritu Santo de Dios, que los ha marcado con un sello para el día de la redención\" (Ef 4,30). Tres cosas impiden su venida a nosotros: el pecado, el espíritu mundano y una visión demasiado terrena de la vida. 1 Ante todo el pecado, porque el Santo de los Santos no podrá venir ni habitar donde vive y reina el pecado. Es el", "s": 7}, {"k": "nota", "t": "1 José Allamano, para expresar la posición de aquellos que viven sin tener en cuenta los principios de la fe, usaba la expresión: \"espíritu demasiado humano\". Teniendo en cuenta la sensibilidad y el modo de expresarse que hoy tienen las ciencias antropológicas, el pensamiento de José Allamano se expresaría mejor de esta manera: \"visión demasiado terrena de la vida\"", "s": 7}, {"k": "p", "t": "pecado el que apaga en nosotros la gracia de Dios y, por lo tanto, el Espíritu Santo. San Pablo nos recomienda: \"No apaguen el Espíritu\" (1Tes 5,19).", "s": 7}, {"k": "p", "t": "También el espíritu mundano y la visión demasiado terrena de la vida impiden la venida del Espíritu Santo, porque él es \"Espíritu de verdad que el mundo no puede recibir, porque no lo ve y no lo conoce\" (Jn 14,17). San Pablo explica que: \"aquellos que viven según la carne, piensan en las cosas de la carne; los que en cambio viven según el Espíritu, a las cosas del Espíritu\" (Rom 8,5). San Juan Crisóstomo explica que la luz del Espíritu Santo puede ser apagada por el viento o por la falta de aceite, es decir por el espíritu del mundo o la falta de buenas obras. 78. Cuando todavía era seminarista, recuerdo que fui a acompañar al Santísimo Sacramento que era llevado a un sacerdote gravemente enfermo. Aquel santo sacerdote, mientras esperaba para recibir la Eucaristía, como preparación repetía la secuencia \"Ven, Espíritu Santo\". A veces yo también la digo antes de celebrar la santa misa y ustedes podrían hacer lo mismo. Cuando digamos las palabras: \"Ven, Padre de los pobres\", nosotros, que somos tan débiles y llenos de defectos, sintámonos aludidos, porque el Espíritu se presenta como protector de los últimos. Dicen que las abejas huyen del bullicio; del mismo modo el Espíritu quiere tranquilidad, es decir, recogimiento. De la secuencia \"Ven, Espíritu Santo\" hagan tantas invocaciones para repetir durante el día. Digamos al Señor: \"Envía tu Espíritu para que cree en mí un corazón nuevo\".", "s": 7}, {"k": "p", "t": "Recemos también el himno \"Ven, Espíritu Creador\". Si lo meditamos bien, nos ayuda mucho. Empieza así: \"Ven, Espíritu Creador, ilumina, visita nuestra mente, y llena los corazones que tu bondad ha creado\". Ante todo hagamos esta invocación, para que venga el Espíritu a llenarnos con su gracia. Después vienen los títulos: \"Tú que eres llamado Paráclito, que eres también el don del Altísimo, fuente viva, fuego y caridad\". Qué hermosos títulos, todos tomados de la Sagrada Escritura. Después pasa a los dones: \"Tú nos das siete dones, eres el dedo de la derecha del Padre, has sido prometido a los apóstoles\". Dicho esto, se hace una oración: \"Enciende la luz en nuestra mente, en nuestro intelecto, y ayúdanos con tu fuerza\". Después se vuelve a pedir por la paz, que evitemos el pecado, que podamos conocer al Padre y al Hijo.", "s": 7}, {"k": "p", "t": "Debemos continuamente hacer crecer en nosotros la gracia y responder a la misma. Sí, responder a la gracia, para que no se extinga en nosotros la caridad, que es el Espíritu Santo. A veces los dones del Espíritu son muy pobres en nosotros porque no tenemos energía, vivimos una vida mediocre. Reavivemos la gracia de Dios que está en nosotros. Sin dudas, el Espíritu Santo obrará por su cuenta, pero primero quiere que nosotros hagamos todo lo que podamos. 79. Porque los dones son un regalo del Espíritu Santo, pidámosle que los haga crecer en nosotros: la sabiduría, para gustar de las cosas espirituales, buscar sólo el paraíso y no darle demasiasda importancia a las cosas temporales; el entendimiento, es decir saber leer adentro nuestro, que es una luz que disipa las tinieblas, que nos hace penetrar en los misterios y da la paz en la fe; el consejo, para dirigirnos a nosotros y a los demás a la virtud y la santidad; la fortaleza, para vencer la debilidad en las adversidades y en los peligros, preparándonos al sacrificio y también al martirio; la ciencia, para elevarnos de la consideración de las cosas temporales a las eternas; la piedad para honrar a Dios como Padre y a los demás como hermanos y hermanas; el temor de Dios, para estar atentos y no ofenderlo, porque es nuestro Padre.", "s": 7}, {"k": "p", "t": "Los frutos del Espíritu Santo, según san Pablo, son: \"amor, alegría, paz, paciencia, benevolencia, bondad, fidelidad, mansedumbre, dominio de sí\" (Gál 5,22). Según san Ambrosio son frutos porque \"llenan el alma de amor sincero y contienen una gran dulzura y suavidad\". Quien goza de estos frutos vive del Espíritu Santo. Es necesario gustarlos, y para gustarlos es necesario ser devotos del Espíritu Santo. Son suaves para el corazón, nos hacen pasar por encima de las miserias de esta vida y amar los sacrificios. 80. San Pablo también afirma que somos templos del Espíritu Santo: \"¿No saben que son templos del Espíritu de Dios que vive en ustedes?\" (1 Cor 3,16). Ahora bien, si somos templos de Dios, somos como tantas iglesias. ¿Qué se hace en una iglesia? Muchas cosas: se presta atención a la limpieza tanto material como espiritual; se hace silencio y no se divaga con la mente; se reza; se hacen sacrificios, mientras participamos del Sacrificio Eucarístico; se escucha la Palabra de Dios y el Espíritu que nos habla; se celebran fiestas, con alegría y adornando el corazón con hechos virtuosos.", "s": 7}, {"k": "p", "t": "Cuando se recibe el Espíritu Santo es como hacer la Comunión Eucarística, es decir se lo recibe a Él en persona. El Espíritu Santo se complace en habitar en nosotros. Meditemos con frecuencia sobre esta grande y consoladora verdad. En las misiones necesitarán del Espíritu Santo. Él los ayudará y, si será necesario, por ustedes hará milagros. Esta es una devoción que debe encarnarse en ustedes. Es necesario conservarla durante toda la vida, todos los meses, todos los días, todas las horas. Los ayudará mucho en ciertos momentos de tristeza y melancolía, especialmente en las misiones. Si invocan al Espíritu Santo en esos momentos, Él seguramente los animará y les dará un gran empuje. El Espíritu consuela y sana todas las heridas.", "s": 7}, {"k": "p", "t": "Entonces, estamos de acuerdo: nunca abandonaremos al Espíritu Santo, siempre lo tendremos dentro de nosotros. San Felipe Neri quería que sus religiosos fueran todos hijos del Espíritu Santo, y yo deseo lo mismo para ustedes. ¡Sí, sean todos hijos e hijas del Espíritu Santo!", "s": 7}, {"k": "h3", "t": "Corpus Domini (Cuerpo y Sangre del Señor)", "s": 7}, {"k": "p", "t": "81. Estaría faltando a mi deber y a mi devoción si dejara pasar la solemnidad del \"Cuerpo del Señor\" sin subrayar la importancia de este gran misterio. Justamente, la fiesta de la Santísima Eucaristía se conmemora el Jueves Santo, en el contexto de la celebración de la Pasión del Señor. Para solemnizarla aún más, la Iglesia la trasladó después de Pentecostés.", "s": 7}, {"k": "p", "t": "Esta debe ser la fiesta del corazón, del agradecimiento. Que en el Instituto, el día del \"Cuerpo del Señor\" sea una ocasión para renovar y hacer crecer el amor a Jesús Sacramentado. Con fe y con el corazón, recen la oración: \"Oh sacrum Convivium\". Díganla con devoción: \"¡Oh sagrado Banquete en el que recibimos a Cristo!\". En él Jesús está realmente presente como lo está en el paraíso.", "s": 7}, {"k": "p", "t": "Se recuerda la Pasión: \"Hagan esto en memoria mía\", dijo Jesús a los apóstoles como leemos en san Lucas (Lc 22,19) y también confirma san Pablo: \"Cada vez que coman de este pan y bevan de este cáliz, están anunciando la muerte del Señor hasta que Él venga\" (1 Cor 11,26).", "s": 7}, {"k": "p", "t": "La mente está lena de gracia: de este Sacramento se recibe no sólo un poco de gracia, sino su plenitud. En la Comunión deberíamos ser inundados de la gracia hasta no dejar ningún rincón vacío. ¿Acaso no recibimos al mismo Autor de la gracia?", "s": 7}, {"k": "p", "t": "Y nos es dada la garantía de la gloria futura: la Eucaristía es un anticipo. Jesús, queriéndonos dejar un don, se dio a sí mismo. Ya tenemos el paraíso en la tierra. En este Sacramento realmente encontramos todos los tesoros de la sabiduría y la ciencia divina. Dándose a sí mismo, Jesús nos dio todo. San Agustín dice: \"Aunque era omnipotente, no le fue posible darnos más. Aunque era extremadamente sabio, no supo darnos más. Aunque era muy rico, no pudo darnos más\".", "s": 7}, {"k": "h3", "t": "Sagrado Corazón de Jesús", "s": 7}, {"k": "p", "t": "82. La fiesta del Sagrado Corazón es como una continuación, un cumplimiento de la fiesta del \"Cuerpo del Señor\". La Iglesia nos enseña que esta fiesta fue establecida para recordarnos la caridad de Jesús hacia nosotros en su Pasión, de la que la Eucaristía es el memorial perenne. Es por esto que estas dos fiestas, si bien diferentes, están íntimamente unidas.", "s": 7}, {"k": "p", "t": "Al Corazón de Jesús debemos rendirle el mismo honor que a la Santísima Eucaristía. Sus devociones, aun teniendo un fin distinto, se explican e integran mutuamente. La devoción al Corazón de Jesús nos hace comprender el amor inmenso de nuestro Señor, que se dio a nosotros en la Santísima Eucaristía; la Eucaristía, a su vez, nos hace comprender y nos da el Corazón de Jesús.", "s": 7}, {"k": "p", "t": "El Corazón de Jesús que la Iglesia venera, es el mismo que sufrió tanto durante su vida terrena, especialmente en el momento de la Pasión; es ese corazón el que en el Getsemaní soportó el dolor por el pecado de la humanidad y fue traspasado sobre la cruz. A este Corazón abierto por la lanza le rendimos honor, adoración y amor. Quiero que comprendan bien en qué consiste esta devoción, cuyo objeto es el Corazón vivo del Señor. ¿Por qué la Iglesia prefiere honrar el corazón? Porque, por una opinión común y popular, es como la sede de los afectos. Todo parte de la voluntad y del corazón. Si este se detiene, cesa la vida. Esta devoción no es nueva; aun más, es tan antigua como la venida del Hijo de Dios sobre la tierra.", "s": 7}, {"k": "p", "t": "Nuestros Institutos están consagrados al Corazón de Jesús. Esta consagración es la renovación y confirmación de la que hemos realizado en el Bautismo; es el reconocimiento de los derechos que tiene el Señor sobre nosotros; es el culto de honor y de justicia que le debemos por miles de motivos a nuestro Creador, nuestro Redentor, nuestro Sumo Bien. Esta es una devoción que debe continuar siempre y de la que espero recibir tantas gracias, la llegada de nuevos misioneros y misioneras, su santidad y la pasión por las misiones.", "s": 7}, {"k": "h3", "t": "Fiesta de Todos los Santos", "s": 7}, {"k": "p", "t": "83. Tengamos los ojos y el corazón fijos en el paraíso, para alegrarnos con los santos. Pensar en el paraíso debe ser nuestro pensamiento principal durante este día. Estoy convencido de que en el paraíso hay santos que son más santos que los que veneramos en los altares. No es necesario un proceso canónico para serlo; lo hace el Señor después de la muerte, en un momento. ¡Cuántas cosas veremos!", "s": 7}, {"k": "p", "t": "¡Qué bello es todo lo que nos propone la Iglesia! Es necesario vivir del espíritu de la Iglesia, que cada día nos da nuestro alimento espiritual y nos hace vivir del espíritu del Señor. Hoy la Iglesia nos invita a alegrarnos: \"Gocemos todos en el Señor, celebrando la fiesta de todos los santos!\". Para que nuestra alegría produzca frutos de santificación, consideremos cómo acercarnos a los santos y cuáles son nuestros deberes hacia ellos. Ante todo, honrarlos porque son los amigos de Dios, nuestros hermanos mayores y bienhechores. Es muy buena la práctica que tienen nuestros Institutos de proponernos un santo cada año, para honrarlo particularmente e imitarlo. También el aniversario del santo del que llevamos el nombre debe celebrarse especialmente. Honremos también a los santos de cada día, y seamos particularmente devotos de los patronos de la diócesis, de la parroquia, de nuestros Institutos y de los lugares adonde vamos.", "s": 7}, {"k": "p", "t": "Además, invoquémoslos. Ellos son nuestros intercesores, que pueden y quieren ayudarnos a obtener las gracias que necesitamos. Por lo tanto, recurramos a ellos con confianza, con amor. Cuando necesitamos una virtud particular, recurramos a la intercesión de aquellos santos que la vivieron muy especialmente: santo Tomás, san Alfonso, san Francisco de Sales para la ciencia; san Luis, san Juan Berchmans, san Estanislao Kostka para la pureza; san Francisco Javier, san Pedro Claver, san Fidel de Sigmaringa, el Beato Chanel, para el ardor apostólico, etc. También les recomiendo una especial devoción a los santos menos recordados. El padre, la madre, un conocido... ellos también pueden ser santos. Es mi modo de razonar, pero no deja de ser verdad.", "s": 7}, {"k": "p", "t": "Por último, imitarlos. Los santos son modelos que pueden ser imitados por todos, porque con sus vidas presentan ejemplos variados de virtud. Aquí en la tierra ellos también sufrieron tribulaciones y tentaciones; también tuvieron defectos, pero con la gracia de Dios se santificaron. Digámosnos a nosotros mismos, con san Agustín: \"Si ellos pudieron, ¿por qué no yo?\" Si ellos en mis mismas condiciones de vida pudieron santificarse, ¿por qué no puedo hacerlo yo? Este es el fruto que debemos obtener de la fiesta de todos los santos.", "s": 7}, {"k": "p", "t": "Por lo tanto, elevemos nuestro pensamiento a los santos, para honrarlos, invocarlos e imitarlos; pensemos en lo que nos dicen del paraíso. Ahora ellos son totalmente felices, pero si aún pudieran desear algo, sería haber sido más virtuosos, más apóstoles, etc. A algunos les parece ya suficiente con ser misioneros o religiosos. ¡Pobres de nosotros! ¡Vivimos demasiado de tejas abajo! ¡Elevémonos! ¡Quiero vivir deseando el paraíso, el paraíso!", "s": 7}, {"k": "p", "t": "Pidamos a los santos que nos hablen, y nosotros escuchémoslos e imitémoslos. La Iglesia nos hace venerar una multitud enorme de santos, para que con su intercesión multipliquen las gracias que recibimos. ¡La memoria de los que son santos dura eternamente! Por lo tanto, ¡elevemos la mirada, bien alto! ¡Elevemos nuestros corazones!", "s": 7}, {"k": "h3", "t": "Conmemoración de los fieles difuntos", "s": 7}, {"k": "p", "t": "84. La existencia de la \"comunión de los santos\", que profesamos en el Credo, es un dogma de fe. La Iglesia es militante, purgante y triunfante. Son como tres ramas de las misma planta, tres provincias de un reino, tres órdenes de ciudadanos en una ciudad, etc. Con la muerte no se rompe esta unión. San Pablo escribía a los Romanos que nosotros formamos un solo cuerpo en Jesucristo y que cada uno es miembro de este cuerpo (cf. Rom 12,5).", "s": 7}, {"k": "p", "t": "Ya saben que existen el purgatorio y la comunión de los santos. Por lo tanto, rezar por nuestros difuntos, según santo Tomás y san Buenaventura, es un gran gesto de caridad hacia Dios y hacia el prójimo. Los medios de sufragio son las obras de caridad, las oraciones públicas y privadas, los sacrificios, la limosna. El principal es siempre la santa misa, porque los difuntos son ayudados por el agradable sacrificio del altar.", "s": 7}, {"k": "p", "t": "Recemos tanto por las almas del purgatorio, sobre todo por las de los misioneros y misioneras. Nuestras Constituciones indican los sufragios que deben hacerse después de la muerte. También recemos por nuestros bienhechores difuntos. Este es un deber sagrado de reconocimiento. De hecho, ¿qué habríamos podido o podremos hacer sin ellos? Entre los primeros recordemos a mons. Demichelis, de quien recibimos la primera Casa Madre; a su hermana, que nos dejó la casa de Rivoli; al ingeniero Felizzati que era profesor de matemáticas en la universidad y quería hacerse misionero. Antes de morir, a los 42 años, me nombró su heredero, aunque yo no quería; pero él me respondió: \"¡Permítame morir en paz!\"; al abad Nicolis di Robilant, etc. Ellos, desde el cielo, donde ven todo en Dios, conocen nuestras necesidades y enviarán buenas inspiraciones a quienes nos puedan ayudar.", "s": 7}, {"k": "p", "t": "No nos olvidemos de nuestros hermanos y hermanas difuntos. Todos los días recemos por ellos, especialmente en la Santa Misa. Qué hermoso cuando en las comunidades se dice: \"recordamos el aniversario de la muerte del hermano o de la hermana...\". Todos están invitados a rezar por ellos. Y todo lo que se realiza en la comunidad siempre es en sufragio por ellos. La comunidad siempre estará formada por los vivos y los difuntos, y este vínculo nunca se romperá, ni siquiera en el paraíso.", "s": 7}, {"k": "p", "t": "En estos días hice una peregrinación, solo y a pie, hasta el cementerio. Entré primero en la capilla, pero no estaba el Santísimo Sacramento. Al salir empecé mi peregrinación. No me detuve a contemplar grandes monumentos, sino que empecé por la derecha, por la tumba del P. Ignacio Viola, que celebraba bien la santa misa. Después fui a la tumba donde antes estaban los restos de san José Cafasso, pero ahora ya no están; me parecía leer sobre la tumba: \"¡No está aquí!\" (cf Mt 28,6). En ese lugar también hay muchos sacerdotes de la Pequeña Casa del Cottolengo, incluido el teólogo L. Guala, el cual disfrutaba trabajando para la gloria de Dios. Conversé con ellos, pidiéndoles un buen espíritu. Después fui a la tumba del can. G. M. Soldati, antiguo rector del seminario en
