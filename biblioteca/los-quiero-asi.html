: 4}, {"k": "nota", "t": "4 San José Cafasso (1811-1860) era hermano de Mariana Cafasso, madre de José Allamano, que se ocupó de la causa de beatificaciòn y sobre el cual siguió dos biografìas: una escrita por el canónigo Santiago Colombero (publicada en 1895); y otra escrita por el abad Nicolás de Robilant (publicada póstuma en 1912); además publicó las Meditaciones y las Instrucciones realizadas durante los ejercicios espirituales (1892-1893). José Cafasso, en 1836, fue llamado por el teólogo Luis Guala a colaborar con él en la direcciòn del Convictorio Eclesiástico, del que es considerado cofundador, para la formación de los jóvenes sacerdotes de la diócesis de", "s": 4}, {"k": "p", "t": "Felices los misioneros y misioneras que, al arrodillarse por la noche frente a Jesùs sacramentado, pueden afirmar concientemente: ¡Hice bien todas las cosas! Contentémonos con hacernos santos en la vida cotidiana.", "s": 4}, {"k": "p", "t": "El Señor, que inspiró el Instituto, también inspiró las prácticas y los medios para adquirir la perfección y hacernos santos. Los santos son santos no porque hicieron milagros, sino porque hicieron bien todas las cosas. No le pidan al Señor la gracia de hacer milagros, porque es una de esas gracias que concede a quien quiere y que no son necesarias para nuestra santificaciòn. Yo no quiero que esta sea la casa de los milagros; tenemos tantas otras cosas por hacer antes de hacer milagros. El milagro que sí quiero que hagan es el de hacer todo con perfección, desde la mañana hasta la noche. De san José Cafasso escribieron \"que era extraordinario en lo ordinario\". Normalmente no tenemos la ocasión de hacer cosas extraordinarias, mientras que las ordinarias se dan cada día y todo el día. A mí no me interesa si realizaron diez mil bautismos, sino si fueron excelentes misioneras y misioneros, fervientes, fieles, atentos en modo superlativo. Sí, superlativos en todo. No cosas extraordinarias, sino extraordinarios en lo ordinario.", "s": 4}, {"k": "nota", "t": "Turín. Luego fue rector del mismo y maestro de teología moral, con un claro enfoque alfonsiano, desde 1848 hasta la muerte. Educó en la espiritualidad y el apostolato innumerables generaciones de sacerdotes, entre los cuales san Juan Bosco. Se entregó totalmente en cada obra apostólica, y se destacó como confesor y predicador de ejercicios espirituales al clero y al pueblo. Fue consuelo de prisioneros y condenados a muerte, consejero requerido por personas de todas las classe sociales, inspirador y sostén de instituciones religiosas. Fue ejemplo luminoso de esperanza cristiana y predicador incansable de la misericordia divina. Beatificado el 3 de mayo de 1925 por Pío XI, fue canonizado el 22 de junio de 1947 por Pío XII. En estas páginas es citado como \"san J. Cafasso\" o \"José Cafasso\".", "s": 4}, {"k": "p", "t": "Hagámonos santos sin bombos ni platillos. ¡No es hacer muchas cosas lo que cuenta, sino el hacerlas bien! Dios está presente tanto en las cosas grandes como en las pequeñas. 6. Hacer bien el bien. ¿De qué manera se pueden hacer bien todas las cosas? San José Cafasso nos sugiere algunos medios. El primero es el de hacer todo como lo haría el Señor. Vivamos como Jesús, hagamos todo como lo haría él, de manera que sea él quien vive y obra en nosotros. Por lo tanto, preguntémonos: \"Si Jesús estuviera en mi lugar, ¿qué haría? ¿Pensaría asì? ¿Hablaría así? ¿Obraría así?\". Realmente me gustaría que cada uno de ustedes fuera una imagen viviente de Nuestro Señor. Todos los santos trataron de identificarse con el Señor. Otro medio es hacer cada cosa como si fuera la última de nuestra vida. Cualquier cosa que hagan, háganla de tal forma que estén en paz con su conciencia, aun cuando tuvieran que morir inmediatamente después. Por último, hacerlo todo como si no tuviéramos más nada por hacer. Age quod agis, haz bien todo lo que hagas. Poner todo nuestro empeño en lo que debemos hacer ahora, sin pensar en lo que hicimos antes o en lo que debemos hacer después.", "s": 4}, {"k": "p", "t": "Con frecuencia, frente a Dios me pregunto: ¿el Instituto procede bien, según Su voluntad? Todos hacen las mismas cosas, pero no de la misma manera. Podríamos decir que nuestra santificación, especialmente en comunidad, depende de la fidelidad en las pequeñas cosas. Las cosas grandes no suceden muy seguido, no les suceden a todos y, además, está el peligro de caer en soberbia. En cambio las cosas pequeñas se dan todos los días, a todas las horas, y están al alcance de la mano de todos.", "s": 4}, {"k": "p", "t": "Frente a Dios, pregúntense: ¿soy consciente de que se puede ofender a Dios también en las pequeñas cosas? Saben lo que es el pecado venial: una pequeña mentira voluntaria, las distracciones voluntarias en la oración, la falta de caridad fraterna y ciertas repugnancias frente a los defectos morales y físicos de las personas, las pequeñas faltas contra la pobreza y la mortificación, la falta de obediencia a los superiores, las críticas y las murmuraciones, que son la peste de las comunidades, etc. Sin embargo, no basta con evitar estos males, aun cuando sean pequeños; tenemos que ir más lejos y hacer el bien, aun cuando sea un bien pequeño. Si no adquirimos el hábito de hacer bien las cosas pequeñas, llegado el caso tampoco haremos bien las grandes. ¡Cuántas ocasiones se nos presentan a lo largo del día para multiplicar estos pequeños actos de virtud! Por lo tanto, que este sea su propósito: evitar hasta las pequeñas culpas voluntarias y poner en práctica pequeños actos de virtud. Son las pequeñas cosas hechas bien las que hacen que una comunidad sea perfecta. Que los miembros de nuestro Instituto se santifiquen siendo fieles a las pequeñas cosas. ¡Que Dios los ayude a comprender esto y los fortalezca con su gracia!", "s": 4}, {"k": "p", "t": "7. Evangelizar con la santidad de vida. Que el misionero y la misionera sean y parezcan santos y hablen a la gente con la santidad de su vida. Es necesario que la gente pueda ver a Dios en ellos. Jesús dice a los apòstoles: \"El que me ve a mí, ve al Padre\" (Jn 14,9); que ustedes, a su vez, puedan decir: quien me ve, ¡ve a Jesùs! No basta el hábito religioso, tampoco las palabras para demostrar que son verdaderos misioneros y misioneras; se necesitan las obras. Estas son las que dan testimonio de lo que son ante la gente. Digamos con Jesùs: \"Las obras que el Padre me pidiò que realizara, las que estoy llevando a cabo, dan testimonio de mí. Las obras que yo realizo, dan testimonio de mí\" (Jn 5,36).", "s": 4}, {"k": "p", "t": "El demonio es como el \"fuerte armado\" que somete con las cadenas de las pasiones y de las supersticiones. Para vencerlo no basta con ser los invitados de nuestro Señor Jesucristo, sino que, además, es necesario tener el espíritu de santidad. Al misionero, a la misionera, se le pide más oración, más mortificación, más santidad, una santidad extraordinaria.", "s": 4}, {"k": "p", "t": "El poco fruto de la misión puede muy bien depender de nosotros, porque no somos instrumentos idóneos en las manos de Dios. No digo que sea siempre así, pero es verdad que, si fuéramos verdaderamente santos, el Señor se serviría de nosotros para obrar un bien mayor. La conversión de las personas es algo completamente sobrenatural. Cuanto más íntima sea nuestra amistad con Jesús, tanto más podremos esperar en la intervención de su gracia. Preguntémonos si, al menos en parte, no se deba atribuir a la deficiencia de esta santidad el hecho de que después de tantos siglos de apostolado una gran parte del mundo aún no sea cristiana. Convenzámonos de la necesidad de ser santos. 8. Los santos son las personas más felices. El que se entrega de verdad y totalmente al Señor goza del bienestar y la felicidad también en esta vida. Cuanto mayor sea el hambre y la sed de santidad, el hambre y la sed de Dios, más feliz se es. Los santos que tienen este hambre y sed son las personas más felices. Su paz interior y la alegría de su corazón son tan grandes, que se refelajn exteriormente y se comunican a los demás. De san José Cafasso se dice que bastaban su presencia y unas pocas palabras suyas para devolver a las personas la alegría del espíritu. De san Vicente de Paul se decía: \"¡Vicente, siempre Vicente!\", es decir siempre contento, siempre fiel a sí mismo en todas las situaciones de la vida. No es que seamos indiferentes, que no sintamos, sino que el amor de Dios nos permite soportar todo alegramente. Cuando tenemos el corazón en paz, cuando sentimos que el Señor nos quiere, ¿qué podría angustiarnos? Podemos repetir con san Pablo: \"¿Quién podrá separarnos del amor de Cristo? ¿La tribulaciòn, la angustia, la persecución, el hambre, la desnudez, el peligro, la espada? En todas estas cosas somos más que vencedores gracias a aquel que nos ha amado\" (Rom 8,35.37). 9. Dar el primer paso con coraje. Por lo tanto, tenemos que hacernos santos y empezar enseguida, ponernos a trabajar en nuestra santificación. La gracia de hoy ciertamente ya no la tendremos mañana. La gracia que descuidas en este momento no la recibiràs nunca más. Recibirás otras, pero esta no, y de ella deberás rendirle cuentas a Dios. Dar el primer paso con coraje. Hoy, no mañana. Y aquí, en esta casa.", "s": 4}, {"k": "p", "t": "Si de esta casa salen sólo misioneros buenos, ciertamente no mejoraràn ni seguirán santificándose. Si no adquieren aquí una buena dosis de virtud, en las misiones, en vez de crecer en la perfección, retrocederán. Dios los provee aquí de muchas gracias particulares específicamente para ustedes, para su santificación. 10. Vayamos a la práctica. Como enseña san Ignacio de Loyola, las personas que tienden a la santidad pueden distinguirse en tres categorías. La primera es la de los que tienen un concepto muy alto de la santidad, conocen sus exigencias y desean alcanzarla, pero se detienen en este punto y no usan los medios para adquirirla. Y esto se manifiesta por cómo viven. Ahora bien, una cosa es desear y saber y otra poner en práctica. Es verdad que santa Teresa de Ávila nos exhorta a tener grandes deseos, pero se trata de deseos eficaces, acompañados de obras. Los que pertenecen a este primer grupo viven una vida llena de gracias sin aprovecharlas y, al final, se encuentran con las manos vacías.", "s": 4}, {"k": "p", "t": "La segunda categoría es la de los que no se conforman con simples deseos, dan algunos pasos por el camino de la santidad, pero a su manera. No son generosos, se atan a las pequeñas comodidades, no tienen coraje para experimentar los efectos de la pobreza y negocian con Dios. Estudian y trabajan, pero no se agotan por ello; obedecen, pero hasta un cierto punto; rezan, pero sólo lo necesario. En fin, a ellos les basta ser buenos, pero no les importa llegar a ser santos. A este grupo pertenecen los inconstantes, es decir aquellos que, aun preocupados por responder, aun amando las prácticas de oración y todas las virtudes, apenas aparece un obstáculo, una prueba espiritual o física, se desalientan y pierden los buenos deseos y propósitos.", "s": 4}, {"k": "p", "t": "La tercera categoría es la de los que desaprovechan ningún medio para hacerse santos, no admiten demoras y son perseverantes en su compromiso. Habiendo entrado en el Instituto con una motivación auténtica, desean responder generosamente a la gracia de Dios y no omiten nada de lo que pueda conducirlos a la santidad. Son personas generosas, fuertes y constantes que, habiéndose propuesto alcanzar la meta, es decir la santificación, siguen adelante aun en medio de las pruebas con una confianza total en Dios. Pensar en lo que hicieron los santos, y más aún lo que hizo el Señor Jesús, los sostiene en los momentos oscuros, de los que no están exentos. San Ignacio dice de ellos: \"Con ánimo grande y generoso sirven a Dios con todo su entusiasmo\". Así es como se hacen santos. A fin de cuentas, no es tan difícil. Me consuelo pensando que muchos de ustedes pertenecen a esta tercera categoría y doy gracias al Señor. Esto no significa que no tengan límites, ni horas y hasta algunos días de aridez espiritual, pero conservan siempre firme la voluntad de corregirse, de responder a la gracia de santificarse. Examínense frente a Dios: ¿a qué clase pertenecen? Como religiosos y misioneros tienen el deber de tender a la santidad y, por lo tanto, de pertenecer todos a la tercera categoría.", "s": 4}, {"k": "h3", "t": "Actitudes en el camino hacia la santidad", "s": 4}, {"k": "p", "t": "11. Voluntad total, enérgica y constante. Ahora, después de haber considerado los motivos para hacernos santos, reflexionemos sobre algunas actitudes o disposiciones necesarias en quien desea tender seriamente a la santidad. La primera de ellas es el deseo, la voluntad total, enérgica y constante de santificarse. La voluntad \"total\" no pone límites, no teme a las alturas, a lo que pueda parecer demasiado. ¡Algunos parecen tener miedo de que los lleguen a poner sobre los altares! No pensemos en esto, no es un problema nuestro; en todo caso, se ocuparán los demás. Pero nosotros tenemos que tender hacia la santidad de altar. Que nadie diga: \"Me conformo con ser bueno y dejo a los demás estas grandes aspiraciones\". ¡No, no! El espíritu que se respira en esta casa es el mismo para todos y es un espíritu de santidad. No es presunción querer hacerse santos y, aún más, grandes santos. Presunción sería creer que se pueda llegar a serlo sin la ayuda de Dios. Por lo tanto, quien quiera ponerle límites a la santidad, quien crea poder limitar su respuesta a la gracia, sepa que nunca la alcanzará, ni siquiera una santidad común. No, con el Señor no se negocia: o todo o nada. O nos hacemos santos como Él quiere, o no lo seremos nunca.", "s": 4}, {"k": "p", "t": "La voluntad \"enérgica\" es la que tiene aquel que se dice a sí mismo: \"Quiero hacerme santo con todas mis fuerzas, por lo tanto me comprometo hasta el punto de casi no poder tener la libertad de renunciar a ello\". Entonces el Señor lo ayuda. Las voluntades débiles, a medias, nunca lograrán nada, nunca darán ni siquiera un paso en el camino de la perfección; son los espiritualmente perezosos que se pierden entre el querer y no querer. El perezoso quiere y no quiere (cf. Prov 13,4). Hoy sí, mañana no. Confunden la voluntad con la veleidad. No rechazan la santidad, pero con tal de que no implique esfuerzos ni sacrificios.", "s": 4}, {"k": "p", "t": "La voluntad \"constante\" es la de quien no se desanima nunca. Lamentablemente la inestabilidad hace parte de nuestra naturaleza. Siempre necesitamos de que alguien nos sacuda un poco. Basta una tontería para abatirnos; basta un poco de aridez, un sacrificio un poco difícil para detenernos en nuestro crecimiento espiritual. Santa Teresa de Ávila, durante los largos años de total aridez de espíritu, no sólo no faltó a su vocación, sino a ninguno de sus propósitos. ¿A cuántas pruebas no tuvo que hacer frente santa Margarita María Alacoque? Su vida fue una maraña de dificultades a cuál más dolorosa. Pero no perdió el rumbo y las superó a todas con una constancia heroica. Si estas mujeres pudieron perseverar en estos grandes sufrimientos, ¿por qué no podríamos hacerlo nosotros en las pequeñas renuncias, en los actos de fidelidad que exige nuestra santificación? La gracia de Dios, que sostuvo a todos estos santos y santas, a nosotros no nos falta y, con ella, nosotros también podemos alcanzar el grado más alto de la santidad. 12. Confianza en Dios. El secreto de todos los santos fue este: confiar en Dios y desconfiar de sí, sin desanimarse por los propios límites, por estar siempre lejos del ideal al que sinceramente y con todas las fuerzas se aspira. No se desanimen, confíen siempre, en toda ocasión; confíen sobre todo después de las propias faltas, con tal de que tengamos la buena voluntad de amar a Dios y de servirlo a la perfección. Así se comportaba san Felipe Neri, que iba por las cales de Roma gritando: \"¡Estoy desesperado, estoy desesperado!\". Y a quien le pedía explicaciones, respondía: \"¡Estoy desesperado por mí, quiero confiar sólo en Dios!\"", "s": 4}, {"k": "p", "t": "La desconfianza hacia sí mismos, si se transforma en desánimo, es un obstáculo que por sí sola nos impide seguir por el buen camino. Quien desconfía es como un pájaro al que le cortaron las alas y, por lo tanto, no puede levantar vuelo.", "s": 4}, {"k": "p", "t": "Pidámosle al Señor que nos dé un conocimiento perfecto de nuestra nada. No se trata de considerarnos peores de lo que somos. Si nos volvemos soberbios es porque no nos conocemos. Sólo los mediocres y los imperfectos se creen importantes. El conocimiento de la propia nada, es decir la desconfianza en nosotros mismos, no debe ser más que el punto de apoyo para crecer en la confianza en Dios. No debemos desanimarnos nunca por nuestras fragilidades indeseadas, sino aferrarnos a Él, abandonarnos en Él, que no sólo quiere y puede hacernos santos, sino que, por ser omnipotente, puede construir la santificación sobre nuestras debilidades; pero, repito, siempre que tengamos el deseo sincero, la voluntad firme de responder a sus gracias. 13. Educación del carácter. Para crecer en el camino de la santidad son necesarios un esfuerzo permanente y generoso y la buena voluntad para educar nuestro carácter y formarlo a la virtud. Para adquirir la verdadera virtud se necesita tiempo. Con el tiempo se repiten las obras y se adquieren las buenos hábitos que son las virtudes; con el ejercicio de estas virtudes, se adquiere la santidad.", "s": 4}, {"k": "p", "t": "En las comunidades puede darse que los demás nos conozcan como seres envidiosos, obstinados, coléricos, y que sólo nosotros no nos veamos así o no querramos aceptar que lo somos. Que nadie justifique la falta de perfección por culpa de su carácter. La verdadera causa es la pereza, porque ningún carácter, en sí mismo, puede impedirnos crecer en santidad y alcanzarla. Santos hubo de muchos tipos y caracteres. Algunos justifican sus defectos diciendo: \"¡Es mi carácter!\" Eso no es una excusa válida. Tampoco significa que se deba anular el proprio carácter, sino de corregirlo. Es un trabajo largo y agotador, pero necesario si queremos tener un buen carácter y que no sea un peso para los demás. No tengamos miedo de examinarnos profundamente para descubrir nuestras debilidades y fragilidades. Si se supera totalmente un defecto, junto a él se superan muchos otros, porque un defecto siempre tiene raíces en otras imperfecciones.", "s": 4}, {"k": "p", "t": "Aunque hoy seamos muy imperfectos, si el Señor ve en nosotros buena voluntad, Él mismo irá colmando de a poco esos espacios vacíos, colocando en su lugar la abundancia de sus dones. La Virgen María cubre nuestros defectos con su enorme manto si nosotros los combatimos con firmeza.", "s": 4}, {"k": "h3", "t": "Obstáculos en el camino de la santidad", "s": 4}, {"k": "p", "t": "14. Falsas motivaciones. 5 El compromiso con la santidad puede ser obstaculizado por diferentes causas. Ante todo, por la falta de rectitud del fin, es decir por falsas motivaciones. El Señor no puede bendecir a quien entra en el Instituto con un fin que no sea bueno. Por lo tanto, es imposible verificar un", "s": 4}, {"k": "nota", "t": "5 El primer obstáculo a la santidad para José Alamano es \"la falta de rectitud del fin\", que aquí y en otras páginas de esta obra es interpretado en sentido dinámico como \"falsas motivaciones\", porque esta es su línea pedagógica.", "s": 4}, {"k": "p", "t": "progreso en el camino a la santidad, así como tampoco puede germinar la semilla que se sembró en un terreno equivocado. Esto vale también cuando el objetivo personal no es malo en sí mismo, pero no coincide con el fin específico del Instituto. Aquí el Señor ha puesto sus gracias para la santificación de todos los que son llamados a ser Misioneros y Misioneras de la Consolata. 15. Disipación. Otro obstáculo es la disipación o la superficialidad, que es la consecuencia del espíritu mundano, del que la santidad está tan lejos como la luz de las tinieblas, como el fuego del frío. El Señor nos pide una separación neta: Ustedes \"no son del mundo, sino que yo los elegí y los saqué de él\" (Jn 15,19); es la misma separación que puso entre él y el mundo: \"Yo no soy de este mundo\" (Jn 8,23).", "s": 4}, {"k": "p", "t": "No podemos servir a dos señores: a Jesús y al mundo. Mucho menos desear realmente la santidad mientras conservemos en nosotros los deseos del mundo. Estamos aquí para hacernos santos, santos misioneros y misioneras. Queremos ocuparnos sólo de esto, y nada más. Seguir a Jesús: este es nuestro ideal. Seguirlo de cerca, con amor y fidelidad; esto es lo que lleva a la santificación y, por lo tanto, se convierte en nuestra única ocupación. La disipación es como el viento que arrastra todas las cosas. Estamos presentes con el cuerpo, pero ausentes con la mente. Así pasan días enteros con la mente dispersa, con el corazón vacío de Dios, con el espíritu frío hacia todo lo que es piedad, con la voluntad débil en el servicio de Dios y el cumplimiento del proprio deber. ¿Cómo se puede, en ese estado, rezar bien, vivr en intimidad con Jesús? ¿Cómo podemos santificarnos? La disipación casi siempre está acompañada por la ligereza, por la tendencia a ridiculizarlo todo y por el respeto humano que impide tratar un tema espiritual o al menos útil, por el miedo a parecer diferentes. Esto impide apreciar todo lo que aquí dentro está en función de la santificación de cada uno. 16. Tibieza. También la tibieza es un obstáculo a la santidad. Tibio es el que ondula entre la virtud y el vicio, aquel que querría huir de los pecados, ser fiel a todo, pero nunca se decide a combatirlos con coraje, porque teme el esfuerzo que implica la virtud. Los síntomas principales de la tibieza son: caer habitualmente y deliberadamente en pecados veniales y no preocuparse por ello; omitir fácilmente o realizar mal las oraciones, como por oficio o necesidad, sin vivificarlas con la atención de la mente y el afecto del corazón; perder la estima y el amor por el proprio estado de vida, como si estuvieran arrepentidos del paso que dieron, y por lo tanto buscar distracciones en los intereses mundanos. El estado del tibio es muy peligroso y los daños de la tibieza se pueden descubrir en las palabras que en el Apocalipsios son dirigidas al ángel de la Iglesia de Laodicea: \"Conozco tus obras: no eres frío ni caliente. ¡Ojalá fueras frío o caliente! Por eso, porque eres tibio, te vomitaré de mi boca\" (Ap 3,15-16). 17. Desgano. En el camino a la perfección, el desgano o relajo es un obstáculo muy parecido a la tibieza. Nuestra frágil naturaleza humana nos inclina a perder el fervor inicial, dejándonos caer. Los síntomas de relajo son: ser negligentes en la observancia de las reglas y de la vida en común; justificarse con facilidad cuando se cometen errores o ante una corrección; abatirse o burlarse del fervor de los demás, que sentimos como si fueran un reproche a nuestro relajo; descuidar tantas inspiraciones y gracias de Dios; obrar con superficialidad o por un fin puramente humano; la falta de energía para vencer una pasión dominante o para tender hacia la santidad.", "s": 4}, {"k": "p", "t": "18. Crítica destructiva. 6 También la crítica destructiva y la murmuración contra los superiores y el prójimo impiden adquirir el espíritu de santidad. Son un vicio horrible, no las quiero, no quiero que entren en el Instituto. Algunos piensan siempre lo contrario de sus superiores y siempre tienen algo que decir, juzgar o quejarse. Es soberbia pura, una gran soberbia. Este es el motivo por el que, con un espíritu como este, no se hacen milagros en las misiones. Con esto no quiero decir que deben desinteresarse completamente de la comunidad. No, el bien y el mal del Instituto conciernen a todos por igual. Por lo tanto, si se descubre algún desorden, está bien referirlo al responsable, porque es un deber y un acto de caridad. Pero murmurar a escondidas, ¡eso no! ¡Pobres de aquellas comunidades en las que entra este espíritu! Es el comienzo del derrumbe. Siempre lo digo. Pidamos a Jesús que nos haga humildes de corazón y de espíritu; pidámosle a la Consolata que mantenga lejos de nuestro Instituto esta peste del espíritu de crítica, y entonces todo marchará bien, el Señor nos bendecirá y las cosas del Instituto prosperarán. 19. Desunión. Otro obstáculo más es la parcialidad o la desunión, que impide armonizar nuestras diferencias. No es raro que este sentimiento surja de una cierta envidia, de un poco de celos.No es que sea una falta \"sentir\" envidia, pero debemos reaccionar para no dejarla entrar y se convierta en una actitud negativa permanente. Todos somos iguales. Que no haya diferencias por el país de origen, ni simpatías o antipatías,", "s": 4}, {"k": "nota", "t": "6 La palabra \"crítica\", en una época usada en sentido negativo en los textos de ascética porque equivalente a \"denigración\", quí se hace más explícita con el adjetivo \"destructiva\", para evitar que se la comprenda erróneamente.", "s": 4}, {"k": "p", "t": "sino un solo corazón en perfecta unidad. Son todos hermanos o hermanas que deberán vivir juntos toda la vida. Por lo tanto, también por caridad fraterna, no pretendan que los demás no tengan defectos. Corrijamos nuestros límites y soportemos los de los demás. 20. Obstinación. Otro obstáculo es la obstinación en las propias ideas, que nos lleva a querer tener siempre razón, dominar o no admitir que podemos equivocarnos. Quien no luche contra este espíritu no avanzará nunca en el camino de la perfección. Porque si además se creyera ya perfecto, sería un gran iluso y un frustrado. 21. Pecados veniales. El mayor obstáculo en el camino de la santidad son los pecados veniales. Algunos son por fragilidad: un hecho impulsivo, una reacción impaciente, etc. Son nuestros límites, son debilidades. Si no hubiera nada de voluntad al cometerlos, ni siquiera serían pecados. No nos podemos liberar de ellos sin una ayuda especial de Dios. Pero podemos reducir su número y la voluntad al cometerlos, prestando más atención sobre nosotros mismos y sirviendo a Dios con más fervor. Estas fragilidades no nos impiden hacernos santos; es más, pueden ser medios para avanzar en el camino de la santidad, si sabemos valorarlos para crecer en la humildad y unirnos más a Dios con amor y confianza.", "s": 4}, {"k": "p", "t": "En cambio, los verdaderos pecados veniales son los voluntarios. Por ejemplo, sé que está mal sentir rencor hacia el prójimo y, sin embargo, no hago ningún esfuerzo par vencerme a mí mismo; sé que, afirmando o negando algo, miento y de todos modos lo hago, etc. Cuando estos pecados son habituales, es decir son cometidos con una cierta frecuencia, aún peor si los justificamos, constituyen el peor estado de tibieza y el signo claro de que hemos renunciado a cualquier propósito eficaz de perfección. El mejor consejo es sacudirnos, estar atentos y controlar nuestras pasiones, nuestras palabras y acciones, buscando con valentía la virtud. Debemos decirnos permanentemente: sí, quiero salvarme y quiero santificarme porque los medios espirituales que tengo a disposición son muchísimos y porque me he comprometido a vivir como religioso y misionero.", "s": 4}, {"k": "p", "t": "22. Tentaciones. Todos estos obstáculos a la santidad pueden ser el efecto de las tentacciones del demonio. Tentaciones son esos actos con los que el demonio trata de inducirnos al pecado y así impedirnos alcanzar la felicidad eterna. Puede ayudarnos a estar alerta recordar lo que dicen san Pablo y san Pedro: \"Revístanse con la armadura de Dios, para que puedan resistir las insidias del demonio\" (Ef 6,11); \"Sean sobrios y estén siempre alerta, porque su enemigo, el demonio, ronda como un león rugiente, buscando a quién devorar\" (1Pe 5,8). El Señor, en sus insondables proyectos, puede permitir que los demonios nos tienten, pero nunca más allá de nuestras fuerzas. \"Dios es fiel y él no permitirá que sean tentados más allá de sus fuerzas. Al contrario, en el momento de la tentación, les dará el medio de librarse de ella, y los ayudará a soportarla\" (1Cor 10,13). Para vencer las tentaciones, además de estar atentos, debemos evitar las situaciones peligrosas e invocar con rapidez, humildad y confianza la ayuda de Dios, encomendándose a la intercesión de la Santísima Virgen, del ángel de la guarda y los santos. La Iglesia nos sugiere la oración: \"Visita, Padre, nuestra casa y mantén alejados de ella los ataques del enemigo; que vengan los santos ángeles a protegernos en la paz, y que tu bendición permanezca siempre con nosotros\".", "s": 4}, {"k": "h2", "t": "2. Amados y llamados", "s": 5}, {"k": "h3", "t": "Vocación misionera", "s": 5}, {"k": "p", "t": "23. Amados desde la eternidad. Dios ha pensado en ustedes desde toda la eternidad. No tenían ningún mérito, y sin embargo Él los ha amado. \"Te he amado con amor eterno\" (Jer 31,3). Te he amado a ti, justamente a ti, y no a otra persona.", "s": 5}, {"k": "p", "t": "Él los ha llamado al apostolado por su sola bondad. No necesita de nada ni de nadie para hacerlo. Ha realizado esta gracia a ustedes, prefiriéndolos entre tantos otros más dignos y que, tal vez, habrían respondido mejor a su llamado. Entonces, ¿por qué justamente a ustedes? Porque los ha amado con un amor especial. Ha hecho con ustedes lo que hizo con aquel joven del Evangelio: \"Y Jesús, mirándolo fijo a los ojos, lo amó y le dijo: ven y sígueme.\" (Mc 10,21). ¡En eso consiste la vocación! Es esta mirada de predilección de Jesús.", "s": 5}, {"k": "p", "t": "24. Amor por Dios y pasión por las almas. 1 La vocación misionera es propia de todos los que aman mucho al Señor y desean hacerlo conocer, dispuestos a cualquier sacrificio. No", "s": 5}, {"k": "nota", "t": "1 Aun conservando todo su valor, la expresión \"celo por las almas\", que José Allamano pronunciaba habitualmente, a veces es reemplazada por \"pasión\" por las almas, término que él también conocía, o también por \"ardor\" misionero, porque de esta manera su pensamiento adquiere mayor actualidad.", "s": 5}, {"k": "p", "t": "se necesita nada más. Esta vocación es ese gesto providente con el que Dios elige a algunos y les concedes las capacidades apropiadas para evangelizar a las personas en los países y grupos humanos no cristianos. 2 El Señor Jesucristo, comenzando por los apóstoles, transmite siempre a algunas personas su misma misión: \"Como el Padre me ha enviado a mí, del mismo modo yo los envío a ustedes\" (Jn 20,21). La Iglesia toma conciencia de esto y, a su vez, confirma esa misión divina. Los misioneros y las misioneras obran en nombre de la Iglesia.", "s": 5}, {"k": "p", "t": "Los santos siempre han deseado ir a las misiones: S. Francisco de Asís, S. Romualdo, S. Teresa de Ávila, S. María Magdalena de Pazzi y S. Teresa del Niño Jesús, proclamada por la Iglesia patrona de las misiones. 25. Sacerdote misionero por naturaleza. Con respecto a los sacerdotes, ¿qué diferencia hay entre predicar el Evangelio en nuestros países de origen y anunciarlo a los no cristianos? ¿No es la misma vocación? ¿Esto no es un deber de cada sacerdote? Todos los sacerdotes, por naturaleza, son misioneros. Esencialmente no hay diferencias entre la vocación sacerdotal y la vocación misionera. Sólo se necesitan un gran amor a Dios y pasión por las almas. No todos los que lo deseen podrán ir a las misiones, pero esa aspiración deberían tenerla todos los sacerdotes. El apostolado en los territorios de misión es, bajo este punto de vista, el grado superlativo del sacerdocio. Cuando se trata de un religioso no sacerdote y de una religiosa de vida activa, especialmente si trabajan en países", "s": 5}, {"k": "nota", "t": "2 Cuando José Allamano, siguiendo la forma de expresarse de la misionología preconciliar, hablaba de \"países paganos\", en ciertos contextos de su reflexión, hemos preferido usar la expresión \"grupos humanos\". El criterio geográfico para indicar los límites de la misionología, hoy es considerado como no exclusivo.", "s": 5}, {"k": "p", "t": "de misión, ellos también son verdaderos misioneros. Es el caso de nuestros hermanos y nuestras hermanas.", "s": 5}, {"k": "p", "t": "26. La vocación misionera, un don de Dios. Según san Pablo, Dios da diferentes dones naturales y sobrenaturales; y el Espíritu Santo se adapta a la índole, a las fuerzas, a las capacidades de cada persona, para hacernos santos a todos. S. Pablo enseña que cada uno de nosotros ha recibido un don de Dios (cf. 1Cor 7,7). Para nosotros, ese don es la vocación misionera, que podremos valorar adecuadamente sólo en la vida eterna. ¿Rechazarlo, entonces, no significa nada? El Señor nos invita a un estado de perfección, nos ofrece un lugar específico en la Iglesia, nos demuestra su predilección: ¿podemos rechazar semejante don? ¿Les parece poco? Algunos podrían decir que se trata sólo de un consejo. Tal vez, pero ¿así apreciamos los consejos de Dios? Si san Francisco Javier hubiera rechazado este don de Dios, ¿qué sería hoy de él? Seguramente no habría llegado a la santidad.", "s": 5}, {"k": "p", "t": "¡Cuántas personas desorientadas espiritualmente en el mundo por haber rechazado el don de Dios! Recuerden siempre que la primera oferta para el Instituto, de cien liras, la recibí de un sacerdote del cual nunca supe el nombre, que decía enviarla para aplacar el remordimiento de no haber seguido en su juventud la llamada al apostolado entre los no cristianos. 3 ¡Ah, no, no creamos que le estamos haciendo un", "s": 5}, {"k": "nota", "t": "3 Como para los textos de misionología y las revistas misioneras de la primera mitad del siglo pasado, también para José Allamano la palabra \"infieles\", como sustantivo, indicaba simplemente los no cristianos, sin por esto pretender juzgar su responsabilidad ante la adhesión a la fe cristiana. Para no traicionar su pensamiento, ya que no tenía una visión trágica de la situación religiosa de la humanidad, este término es substituido siempre con otros equivalentes usados hoy, como \"no cristianos\", \"miembros de otras religiones\", raramente también \"paganos\".", "s": 5}, {"k": "p", "t": "favor a Dios si respondemos a su llamado! Es él quien nos hace a nosotros un gran regalo. 27. Sin signos extraordinarios. A veces podemos dudar de ser llamados al apostolado. Es una pena dolorosa que hizo que se perdieran muchas vocaciones o al menos entibió el fervor de otros para prepararse bien al apostolado. ¿Ustedes tienen esta vocación? Les respondo afirmando que no es necesario haber recibido signos extraordinarios, y tampoco pretenderlos de parte de Dios. Inclusive, si viniera un ángel podríamos siempre dudar de que se trate de una ilusión. Basta con haber tenido algún signo especial, que tal vez nos ha parecido casual cuando en realidad era querido por Dios en vistas de la vocación: la lectura de un periódico o un libro misionero, una homilía sobre las misiones, el ejemplo de un compañero, la palabra del párroco o del confesor, inclusive algunas circunstancias familiares, etc. Estos signos bastan. Ellos son el modo ordinario del que se sirve Dios para despertar la vocación misionera en aquel que ha elegido. 28. Sólo para la evangelización. Quien entrara en nuestro Instituto con una finalidad diferente a la de convertirse en un Misionero o Misionera de la Consolata, sería un intruso y debería dar cuentas de ello ante Dios, la comunidad y los bienhechores. El Instituto no es un colegio o un seminario en el que puedan madurar diferentes vocaciones, sino sólo la vocación misionera, y de la Consolata. Si alguien hubiera entrado con buenas intenciones y luego se diera cuenta de que no tiene esta vocación, después de escuchar el consejo prudente de los superiores, debería retirarse y volver a casa o al estado que le corresponde. También faltaría a su deber quien, llamado por Dios, no respondiera afirmativamente y no se formara según el espíritu misionero del Instituto.", "s": 5}, {"k": "h3", "t": "Respuesta a la vocación", "s": 5}, {"k": "p", "t": "29. ¡Si conocieras el don de Dios! Felices ustedes que escucharon la invitación de Dios y, confirmados a través de la oración y de los sabios consejos recibidos, con coraje dejaron de lado su ámbito de vida, las comodidades y, superando juicios y motivos humanos, entraron en el Instituto con el fin de prepararse para las misiones.", "s": 5}, {"k": "p", "t": "Por lo tanto, déjenme repetirles las palabras del Señor: \"¡Si conocieras el don de Dios!\" (Jn 4,10). ¡Si conocieras el gran don que te ha hecho Dios llamándote a este Instituto misionero! A este don le seguirán cada vez más gracias que Jesús, desde el sagrario, les hará si serán capaces de apreciar esta vocación y responder a ella. Ustedes que están aquí, así como quienes los han precedido, gozan de los mismos beneficios y de las mismas gracias. Pero, ¿perdurarán todos en la vocación recibida? No basta con ser llamados, ni con responder al llamado, tampoco con entrar en el Instituto ni con ir a las misiones. No todos los llamados perseveran, porque no todos responden adecuadamente. No olviden que perseverar es un deber cuando hemos aceptado libremente un estado de vida y a él nos hemos vinculado con promesas solemnes. Es un deber hacia Dios, por quien hemos hechos los votos, y es un deber hacia nosotros mismos. Sólo el que perseverará hasta el final oirá la invitación divina: \"¡Ven, siervo bueno y fiel!\" (Mt 25,21).", "s": 5}, {"k": "p", "t": "30. Responder bien. Están en el Instituto con la esperanza y también la certeza de tener vocación. Pero ahora que se les explica más profundamente la naturaleza del Instituto y de la vocación apostólica, pídanle al Señor que los ilumine a ustedes, a los superiores y formadores, para que vean con mayor claridad si han sido llamados por Dios y si están realmente decididos a responderle con todo el corazón y con todas las fuerzas para llegar a ser auténticos misioneros y misioneras; lo mismo para ver si son estables y constantes ante las dificultades y los peligros de la vida en las misiones.", "s": 5}, {"k": "p", "t": "No me cansaré nunca de exhortarlos a que consideren bien la realidad de su vocación, para que aumente su estima hacia ella, agradecerle al Señor cada día y tratar de responderle con un ánimo fuerte y constante. \"Los exhorto a comportarse en modo digno de su vocación\" (Ef 4,1). El apóstol se refería a la gracia de la fe. Yo les hago la misma advertencia con respecto a la gracia de la vocación misionera que, si no es tan necesaria como la fe, es siempre una gracia de predilección. Les digo que no la reciban en vano, sino de responder en consecuencia y hacerla fecunda, ahora que se encuentran en el momento propicio para ello, los días de gracia especial que el Señor derrama sobre su preparación a las misiones. Por eso, ¡vivamos esto seriamente! Es necesario responderle y responderle bien, del mejor modo posible. No se necesitan voluntades a medias, sino voluntades decididas. Antes que convertirse en misioneros o misioneras a medias, es mejor no serlo.", "s": 5}, {"k": "p", "t": "Si alguien no hubiera respondido bien, que retome el camino: \"¡Nunc coepi!\" (Sal 76,11), ¡empiezo ahora! Retome el buen camino, cueste lo que cueste, y renueve cada día esta buena voluntad. Ciertamente, nuestra respuesta nunca será suficiente, pero al menos hagamos todo lo que esté a nuestro alcance. El Señor arreglará el resto y colmará las nuestras deficiencias. Él sabe que somos débiles, pero quiere que tengamos buena voluntad. ¿Todos ustedes tienen la firme voluntad de ofrecerse al Señor para que los forme según su Corazón, para ser un día santos Misioneros y Misioneras de la Consolata?", "s": 5}, {"k": "p", "t": "A veces uno puede haber vivido 50 años en un instituto y seguir siendo un niño, es decir no ha hecho nada para crecer. Observen si los años que vivieron en comunidad fueron escritos con oro, o con tinta, o con agua. Examinen su respuesta y pregúntense: un santo misionero o una santa misionera, ¿cómo habrían transcurrido estos años? Y cada uno de ustedes se pregunte: ¿cómo seré dentro de 20 años? Por lo tanto, examinen su vocación en relación al modo en el que están respondiendo a ella. Los medios para responder son los mismos que para tender hacia la propia santificación, que es el bien primario del Instituto y, por lo tanto, de la misma vocación. 31. Con recta intención. ¿Por qué están aquí? Todos responderían: para ser misioneros. Si alguien tuviera otra finalidad, se equivocaría, porque aquí el aire sólo es bueno para quien quiere ser misionero. El primer medio para responder a la vocación es la recta intención. Por lo tanto, el que haya venido al Instituto con un motivo diferente al de hacerse Misionero o Misionera de la Consolata, ¡que se aleje, por el amor de Dios! En conciencia, no puede quedarse. Sería como una planta colocada en un terreno desfavorable, como un hueso fuera de lugar. Es decir, sería de daño para los demás, un obstáculo a la armonía de la comunidad y para alcanzar el fin común. Que enderece sus propias motivaciones, o que se vaya. 32. Con una gran estima. En segundo lugar, es necesario que aprecien mucho su vocación. ¡Cuántas veces escucharon hablar de su grandeza! Ustedes mismos, antes de venir al Instituto, estimaban tanto este estado de vida que nada les ha parecido más hermoso, más grande, más santo. Por eso han decidido hacerse misioneros o misioneras a cualquier precio y, con tal de alcanzar este fin, han afrontado los más grandes sacrificios. Desde ese entonces la vocación misionera les ha parecido la más santa de las vocaciones. Leyendo el Evangelio, quién sabe cuántas veces pensaron: ¡Cómo me hubiera gustado ser también yo uno de los Apóstoles! Pues bien, ahora lo son, porque a cada uno de ustedes particularmente el Señor les ha dado el mismo mandato que a los Doce: \"Vayan por todo el mundo, prediquen el Evangelio a todas las criaturas\" (Mc 16,15). Podríamos decir que Él ha puesto en manos de los misioneros toda la tierra, todas las naciones, todos los pueblos. ¿Se puede desear algo más?", "s": 5}, {"k": "p", "t": "También tengan en cuenta las diferentes vocaciones con las que una criatura puede relacionarse con Dios; verán que no van a encontrar una más perfecta que la de ustedes. Es como que el Señor para ustedes ha agotado su infinito amor en lo que respecta a vocaciones. No sabría y no podría darles una más excelente, porque les ha dado su misma misión: \"Como el Padre me ha enviado a mí, yo los envío a ustedes\" (Jn 20,21). La misma misión que Jesús recibió del Padre él se la transmite a ustedes. Y con ella, su mismo poder: \"Me fue dado todo poder en el cielo y en la tierra. Por eso, vayan y prediquen a todas las naciones\" (Mt 28,18-19). 33. Con un amor concreto. Pero no basta con estimar el propio estado de vida, también debemos amarlo. Amarlo concretamente, no obstante todas las debilidades que podamos tener y que el Señor permite para que crezcan nuestros méritos. Amarlo de corazón, de modo tal que todo lo que el mundo podría ofrecernos de interesante nos parezca una nada frente a la belleza y grandeza de nuestra vocación. Si alguien les dijera: \"Tienes talentos, en el mundo habrías podido recibir honores, hacer carrera, etc.\", ustedes deberían responder con S. Pablo: \"Todo me parece una desventaja comparado con el inapreciable conocimiento de Cristo Jesús, mi Señor. Por él, he sacrificado todas las cosas, a las que considero como desperdicio, con tal de ganar a Cristo\" (Fil 3,8).", "s": 5}, {"k": "p", "t": "Del amor a la propia vocación brota espontáneo y con la misma fuerza el amor al propio Instituto. Estimarlo, amarlo y sentirse santamente orgullosos de pertenecer a él, de ser no sólo misioneros, sino Misioneros y Misioneras de la Consolata. El Instituto los ha recibido entre sus brazos, los nutre y los prepara para las misiones. Es el lugar de su santificación, porque aquí y no en otro lugar encontrarán todas las gracias necesarias para santificarse. Quien no tuviera estos sentimientos demuestra que el Instituto no es para él, o bien que no está respondiendo a la gracia de la vocación.", "s": 5}, {"k": "p", "t": "¡Si reflexionáramos bien, estimaríamos más el don de la vocación y nos comprometeríamos respondiendo a ella totalmente! ¡Oh, el paraíso de un misionero y de una misionera que no están detrás de pequeñeces, que tengan intensa vida, que sean despiertos! Ven, no habiendo podido ser yo misionero, quiero que no se vean impedidos a serlo los que desean abrazar este estado de vida. Cada misionero resplandecerá en el cielo como una estrella fija, y a su alrededor todas las almas salvadas por medio de su apostolado. Si se supiera, si se entendiera qué significa ser misionero, ¡todos querrían serlo! 34. Con voluntad constante. Todos, pero ustedes en modo particular, necesitan tener buena voluntad. Es su característica específica, lo que los distingue, la virtud propia de su estado de vida. En medio de los constantes sacrificios de la vida misionera, entre tantas pruebas, es necesario tener virtudes sólidas, que permanezcan intactas cuando se hace el bien. Pero para tener estas virtudes en las misiones es necesario que las adquieran ahora en modo estable. Firmeza desde ahora en los pequeños sacrificios, en la fidelidad al reglamento, en la puntualidad y precisión en todo. Así durante todo el año y a lo largo de todos los años de formación. ¡Entonces sí se convertirán en verdaderos misioneros y misioneras!", "s": 5}, {"k": "p", "t": "Con frecuencia, pensando en ustedes, digo: \"¡Si comprendieran bien la importancia de su vocación! Si hicieran un poco de esfuerzo, si tuvieran un poco más de energía, el Señor vendría a su encuentro y se serviría de ellos para hacer milagros!\" En cambio a veces son tan débiles, desganados, poco generosos y tan inconstantes!", "s": 5}, {"k": "p", "t": "La gracia de la vocación no debe ser tratada como si fuera un objeto que pueda ser tomado o dejado según me plazca. ¿Por qué subordinar la vocación a los caprichos de una voluntad inconstante? Sean fuertes y tenaces en su vocación. El can. Santiago Camisassa, 4 nuestro muy querido vicerrector, obró durante toda su vida con voluntad tenaz. Un sacerdote me decía de él: \"En ese hombre siempre he admirado la constancia. No se dejaba condicionar por nadie, ni por los comentarios, ni por ninguna otra cosa, sino que seguía siempre adelante.\"", "s": 5}, {"k": "nota", "t": "4 Santiago Camisassa (1854-1922): nació en Caramagna Piemontese, quinto hijo de Gabriel Camisassa e Inés Perlo. Después de haber trabajado como aprendiz una herrería en 1868 entró en el Oratorio salesiano de Turín, y después en el seminario de Chieri para los estudios filosóficos y, en 1873, pasó al seminario de Turín para la teología. Aquí tuvo como asistente y director espiritual a José Allamano. Fue ordenado sacerdote en 1878 y, a continuación, integró el cuerpo de profesores de las Facultades de Teología y de derecho de Turín. Desde el 1880 estuvo junto a José Allamano como ecónomo, luego como vicerrector del santuario y del Convicto Eclesiástico de la Consolata. En 1892 fue nombrado canónico de la catedral de Turín. Colaboró con José Allamano en la fundación", "s": 5}, {"k": "p", "t": "Ustedes creen que nunca encontró dificultades? Fueron innumerables y de todo tipo. Si ante cada obstáculo que aparecía nos hubiéramos detenido o inclusive desanimado, el santuario estaría aún como lo encontramos y el Instituto todavía no estaría fundado. En cambio, una vez que se conoce la voluntad de Dios, se sigue adelante, confiando ciegamente en la ayuda divina. Quisiera que de cada uno de ustedes se pudiera decir el mismo elogio del vicerector. No se olviden de este hombre; es más, recen para que les transmita un poco de su energía.", "s": 5}, {"k": "p", "t": "La constancia es totalmente necesaria para responder a la vocación, porque las pruebas existen y existirán. Ustedes mismos, antes de venir, ¿qué pensaban de este estado de vida? ¿Cómo se lo imaginaban? ¿Cómo un estado de vida de tranquilidad y de comodidad, o más bien como de batalla y sacrificio? ¿Ustedes creen que en el mundo no haya dificultades? Basta con tener un mínimo de experiencia, basta preguntarle a la gente o recordar lo que ha sucedido en nuestras propias familias. Lo que en el mundo tantos hacen por necesidad, ustedes háganlo por amor. Así los quiero: generosos, firmes y constantes en la vocación.", "s": 5}, {"k": "nota", "t": "de los Misioneros de la Consolata en 1901 y de las Misioneras de la Consolata en 1910. Junto a él fundó y dirigió la revista La Consolata, que sirvió para hacer conocer la vida del santuario, los trabajos de restauración y, luego, la vida y el desarrollo del Instituto y de las misiones. Desde febrero de 1911 hasta abril de 1912, por encargo de José Allamano visitó las misiones de Kenya. Vivió durante 42 años en profunda comunión, sincera amistad y compartió los mismos ideales con él. Cada proyecto ha sido siempre estudiado y evaluado juntos, respetando recìprocamente responsabilidades y capacidades. Con justo derecho el can. Camisassa es reconocido como Cofundador de los Institutos de los Misioneros y de las Misioneras de la Consolata.", "s": 5}, {"k": "h3", "t": "Obstáculos para responder al llamado", "s": 5}, {"k": "p", "t": "35. Apego a la propia voluntad. Nuestro corazón está hecho de manera tal que siempre necesita apegarse a algo. Si se apega a la tierra, es como la tierra. Si se apega a Dios, es como Dios. Ustedes han hecho tantos sacrificios para dejar el mundo, empéñense ahora en despegar de él su corazón. El que no sea generoso en esta separación, no será ni de Dios ni del mundo. Entre los obstáculos para responder totalmente a la vocación, S. Alfonso María Ligorio pone en primer lugar el apego a la propia voluntad. Es verdad, todos tenemos voluntad propia. El \"quiero\" y el \"no quiero\" dominan el mundo, pero también existen en las comunidades religiosas y misioneras. No siempre esta hierba mala puede verse, pero tarde o temprano sale a relucir. El p. Juan Semeria 5 escribe: \"Si el religioso trabajará mucho y por largos años pero a su capricho, no valdrá nada. Si estudiará para ser erudito y sabio, así como un elocuente predicador, de nada le valdrá. Si será diligente y fervoroso en la oración, humilde y modesto al hablar, hará algo positivo. Si luego por amor de Dios renunciará a su propia voluntad, esto es mucho, es lo máximo, es todo\". Y agrega que esto es un martirio incruento mucho más doloroso del verdadero martirio, una batalla por la que Dios concede en el cielo la corona del vencedor, el camino estrecho indicado por Jesús.", "s": 5}, {"k": "nota", "t": "5 P. Semeria Juan (1867.1931), lígure, orador y prolífico escritor barnabita. Invitado por José Allamano, en 1903 inauguró la práctica de los \"Nueve sábados de la Consolata\". Acusado de modernismo fue destinado a trabajar fuera de Italia. A comienzos de la\"primera guerra mundial (1915-1918), regresó como capellán militar. En 1918 fundó L'Opera nazionale del mezzogiorno d'Italia a favor de los huérfanos de guerra. José Allamano cita varias veces su libro La Vita Religiosa, Trattato ascetico, Savona 1896, pp. 320.", "s": 5}, {"k": "p", "t": "¡Ay de los que llevan a las misiones su propia voluntad! No harán el bien en ningún lugar y tampoco les va a venir bien ningún lugar. Habría que crearles uno especialmente para ellos, y aun así tendrían algo de qué lamentarse. Nunca están contentos, quieren descalificar todo: un verdadero suplicio para las comunidades, un tormento para los superiores, un escándalo para los hermanos, una vida inútil y de daño para sí mismos y para el Instituto. ¡Ustedes saben que tengo mucha experiencia en esto! Dirigí a varias comunidades tanto de hombres como de mujeres, por eso sé lo que digo. ¡Ay del que sigue apegado a su propia voluntad!", "s": 5}, {"k": "p", "t": "A trabajar sobre la propia voluntad nos deben empujar el ejemplo y las enseñanzas del Señor Jesús. Él hizo de la voluntad del Padre la norma de toda su vida. Ya por la boca del Profeta había dicho: \"En el libro de la Ley está escrito lo que tengo que hacer: yo amo, Dios mío, tu voluntad\" (Sal 40,9). Esta voluntad del Padre la tuvo bien guardada en su corazón: \"Tu ley está en mi corazón\" (Sal 40,9). Se alimentó constantemente de ella: \"Mi comida es hacer la voluntad de aquel que me envió\" (Jn 4,34). En el cumplimiento perfecto de la voluntad del Padre sintetizó toda su misión divina: \"He bajado del cielo no para hacer mi voluntad, sino la de aquel que me envió\" (Jn 6,38). Por lo tanto siempre obró en conformidad a la misma: \"Lo que yo busco no es hacer mi voluntad, sino la de aquel que me envió\" (Jn 5,30). Todo esto, ¿no debería inducirnos a renunciar de una buena vez a nuestra propia voluntad?", "s": 5}, {"k": "p", "t": "A nosotros Jesús nos dirigió un mensaje muy especial: \"El que quiera venir detrás de mí, que renuncie a sí mismo\" (Mt 16,24). ¿Qué significado tienen estas palabras? S. Gregorio Magno responde que, habiéndole propuesto a sus seguidores de renunciar a todas las cosas, el Señor aquí da un paso hacia delante diciendo que es necesario renunciar también a sí mismos, lo cual es más perfecto, pero también más difícil. 36. Apego a los bienes y a las comodidades. El segundo obstáculo para responder bien a la vocación es el apego a los bienes y a las comodidades. Es necesario que los misioneros y las misioneras renuncien también a estas cosas. En las comunidades son pocos los que viven realmente desapegados de las pequeñas comodidades, que son indiferentes hacia la habitación, los alimentos, la ropa, etc. Si lo vivieran habitualmente y llevaran esta sana costumbre a las misiones, ¡cuánto mayor sería el bien realizado!", "s": 5}, {"k": "p", "t": "El p. J. Semeria describe: \"El amor a las comodidades viene detrás de la tibieza. Para un tibio mil cosas se vuelven necesarias, las mismas que un fervoroso miraría con desprecio. Las bellas expresiones de que \"los tiempos han cambiado\", \"las circunstancias no son las mismas\", \"la constitución física es más débil\", etc., son muy adecuadas para justificar lo que no debería ser concedido.", "s": 5}, {"k": "p", "t": "Sobre todo, ¡estén atentos en las misiones! Se dejan la patria, la familia, las comodidades de nuestro ambiente y todo ha sido sacrificado generosamente a Dios. Pero tengan cuidado de que no aparezcan otros apegos: preferencias, propia voluntad, amor a las comodidades. La Divina Providencia piensa en ustedes y nunca les faltará lo necesario, basta que no ustedes no busquen lo superfluo. En lo posible deben acostumbrarse a los alimentos locales y no pretender comer los de su país de origen.", "s": 5}, {"k": "p", "t": "Ciertamente el Señor, al mandar a los Apóstoles a predicar, no los proveyó como hacemos nosotros con nuestros misioneros. Sin embargo, cuando los interrogó si alguna vez les había faltado algo, ellos respondieron: \"Nada\". Con ustedes sucederá lo mismo. Y si alguna vez no pudieran tener enseguida algo que parece necesario, acuérdense que hicieron el voto de pobreza, cuyo espíritu exige que se experimenten sus efectos soportándolos pacientemente, es más, con alegría. 37. Apego a los familiares. El mundo hace dos acusaciones opuestas a los religiosos y a los misioneros; haber perdido el afecto a los familiares u ocuparse demasiado de ellos. La primera acusación es falsa. No es verdad que no tengan sentimientos. Los tienen y muy buenos, y por eso ayudan espiritualmente a sus familias. De hecho, ellas participan de todo el bien que el hijo o la hija realizan: obras buenas, oraciones, mortificaciones, etc.; así como de todo el bien que se realiza en las misiones. Su misma santificación produce en ellos ventajas incalculables, inclusive temporales.", "s": 5}, {"k": "p", "t": "Por lo tanto, nosotros amamos a nuestros familiares ahora más que antes, deseando lo mejor para ellos. Los beneficiamos al máximo, por lo tanto, los amamos más que cualquier otra persona. Y los beneficiamos en las cosas más importantes, las espirituales. Siempre recuerdo lo que me decía mi madre: \"Todos los demás se olvidarán de mí, pero tú no; tú celebras la misa y cada día rezarás por mí\". ¿Ven que no dejamos de amar a nuestros familiares? En el momento de morir y en la eternidad, ellos verán lo útil que ha sido para ellos haber dado un hijo o una hija a las misiones, al servicio de Dios.", "s": 5}, {"k": "p", "t": "En cambio, la segunda acusación tiene su razón de ser. S. José Cafasso decía: \"Señor, haz que pueda sentir desapego ante aquellas cosas por las que más siento afecto\". Así hicieron todos los santos. Por lo tanto, que nuestro propósito sea el de apegarnos al Señor, sólo a Él. Él quiere ser el primero y el último, es decir el único y poseer nuestro corazón. Y tiene todo el derecho. Si nuestros padres nos han dado la vida, el", "s": 5}, {"k": "p", "t": "Señor se las dio a ellos. Por lo tanto, el que quiera amar al padre y a la madre más que a Él, no es digno de Él. El Señor es celoso de nuestros corazones.", "s": 5}, {"k": "p", "t": "Recuerden el mandato de Dios a Abraham: \"Deja tu tierra natal y la casa de tu padre\" (Gén 12,1). A cada uno de nosotros ha dirigido la misma invitación: deja a tus padres, abandona tu casa, despídete de todo, de todo, ven y sígueme. Y ustedes lo escucharon. ¡Y qué recompensa! \"Yo haré de ti —dijo Dios a Abraham— una gran nación y te bendeciré, y haré grande tu nombre y serás bendecido\" (Gén 12,2). Ustedes recibirán la misma recompensa. El Señor hará de ustedes una gran nación por el número de personas convertidas a la fe, hará grande su nombre en los cielos, serán bendecidos ustedes y sus familias en el tiempo y en la eternidad. 38. Pruebas y tentaciones. Nadie debe sorprenderse si este gran don de la vocación debe pasar por el tamiz de las pruebas y las tentaciones. Con frecuencia, al principio todo procede bien, pero luego llegan las arideces, el tedio, las desolaciones del espíritu… entonces uno se siente abandonado por Dios, se entristece, y con facilidad pierde el rumbo. ¡No! Las desolaciones del espíritu son comunes a todas las personas que tienen una espiritualidad intensa, en el estado que sea, inclusive en el mundo. Son una prueba para purificar y perfeccionar el espíritu. Son un gesto amoroso de Dios hacia nosotros. Un mes de aridez nos puede llevar más rápidamente a la perfección que muchos años sin fervor sensible.", "s": 5}, {"k": "p", "t": "Pidámosle al Señor que nos confirme en el camino que hemos emprendido, que nos de la gracia de responder, para así perseverar hasta el final. \"Confirma, Señor, cuanto haz hecho por nosotros\" (Sal 68,29).", "s": 5}, {"k": "h2", "t": "3. Formados para la misión", "s": 6}, {"k": "h3", "t": "Formación misionera", "s": 6}, {"k": "p", "t": "39. Formarse aquí y ahora. Los institutos religiosos al comienzo fueron muy fervorosos. Los individuos se preocupaban por su propia santificación, unían una sólida virtud al celo apostólico y presentaban esta unión recíproca, que es uno de los signos más seguros de la caridad. Pero no todos continuaron en ese fervor, y así volvió el espíritu mundano y tomó la delantera. ¿Qué podemos decir de nuestro Instituto? Subsistirá; pero preguntémonos: ¿se mantendrá siempre en ese fervor? Esta es la gracia que debemos pedirle incesantemente al Señor. Estén atentos a no dejar enfriar el fervor de los comienzos, porque es más fácil fundar que reformar una congregación. Si un día el espíritu del Instituto disminuye, ¡espero hacerme escuchar desde el paraíso!", "s": 6}, {"k": "p", "t": "Esta casa fue erigida para su formación. El Señor es el que puso aquí las reglas, los formadores y todas las gracias necesarias. Y si le dan importancia a todo, si demuestran ser dóciles para recibir día tras día, hora tras hora, las influencias de esta permanente lluvia de gracias, serán como el Señor quiere que sean y alcanzarán el fin de su vocación.", "s": 6}, {"k": "p", "t": "\"En el momento favorable te escuché, y en el día de la salvación te socorrí. Este es el tiempo favorable, este es el día de la salvación\" (2 Cor 6,2). San Pablo define el \"tiempo favorable\", el tiempo del Evangelio, que debemos aceptar con gratitud y amor. La Iglesia aplica estas palabras al tiempo de Cuaresma. Uso estas mismas palabras para dirigirme a ustedes, aplicándolas a la gracia de la vocación y al tiempo que transcurren aquí para formarse en las virtudes sacerdotales, religiosas y misioneras.", "s": 6}, {"k": "p", "t": "Reflexionen bien: este es para ustedes el tiempo oportuno. Recuerden lo que decía san Jerónimo, quien vivió mucho tiempo en Jerusalén: \"No es el vivir en Jerusalén lo que importa, sino el vivir allí santamente\". Esta casa es su Jerusalén. Pero no basta con haber ingresado en ella, con permanecer y ocupar un lugar, así como no basta con llamarse misioneros y misioneras; lo que sí importa es formarse y vivir el espíritu misionero. Pero para lograrlo -no lo repetiré nunca lo suficienteno deben esperar a estar en las misiones. Cada día es el tiempo favorable. Es aquí y ahora que deben formarse. Si alguien pensara que para hacerse santo hay que ir a las misiones se equivocaría profundamente. ¡No, no! Si no serán santos aquí, si no lo serán antes de partir, no lo serán nunca. Créanme: en las misiones recogerán lo que han sembrado aquí y nada más. Pobre, entonces, del que se aburre, del que no ama su propia formación. Se lo repito: déjense formar, acepten ser guiados y corregidos, busquen su propia perfección según la naturaleza y el fin del Instituto. Por lo tanto, que este sea el propósito de todos: aprovechar el tiempo, no perder ni un segundo. Si ahora se comportan así, un día recogerán muchos frutos.", "s": 6}, {"k": "p", "t": "Sean fieles a las gracias de Dios y a sus divinas inspiraciones. El Señor golpea con frecuencia la puerta de nuestro corazón. Estemos atentos para abrirle enseguida. Nos presenta ocasiones para realizar pequeños sacrificios y, si los hacemos con generosidad, nos presentará otros más grandes y más tarde otros enormes, hasta hacernos vivir las virtudes heroicamente. 40. En el espíritu del Instituto. El estilo de vida que deberán asumir en el Instituto es el que me inspiró y me inspira el Señor; y yo, atemorizado ante tanta responsabilidad, quiero que el Instituto se perfeccione y viva una vida perfecta. Pienso que el bien hay que hacerlo bien; si no, entre tantas otras ocupaciones, no habría asumido además la enorme responsabilidad de fundar una congregación. La experiencia de comunidad, que he vivido durante toda mi vida, quiero aplicarla a ambos Institutos.", "s": 6}, {"k": "p", "t": "Presten atención a mis recomendaciones, a mis exhortaciones e inclusive a mis expresiones de deseo más sencillas, que bien conocen. Esto es lo que quisiera de ustedes: buena voluntad, esfuerzo generoso y constante para asimilar el espíritu del Instituto. Vivan de tal manera que puedan repetir con S. Paolo: \"Ya no vivo yo, sino que Cristo vive en mí\" (Gál 2,20). Y esto era así porque el Espíritu del Señor lo había invadido hasta el punto de transformarlo completamente. Renuévense espiritualmente (cf. Ef 4,23), para que también ustedes sean personas nuevas, con todas las virtudes de nuestro Señor.", "s": 6}, {"k": "p", "t": "Por lo tanto ustedes son Misioneros y Misioneras de la Consolata. Pero, ¿lo son también de hecho o sólo de nombre? Demostrarán serlo verdaderamente si tendrán el espíritu del Instituto y a la luz del mismo vivirán su vida de cada día y de cada hora. Es el espíritu lo que da forma y vida a las instituciones así como a cada uno de sus miembros. Cada institución tiene su propio espíritu, del cual y por el cual vive. Los individuos son miembros de un instituto en la medida en que poseen su mismo espíritu. Aquel que entre ustedes quiera asimilar totalmente el espíritu de nuestro Instituto necesita comenzar enseguida, sin perder el tiempo. 41. En los pensamientos, en las palabras y en las obras. Los pensamientos que pueblan su mente durante el día, ¿son dignos de misioneros y misioneras de la Consolata? ¿Están dirigidos constantemente a considerar el fin por el cual vinieron al Ins-tituto? Es decir, ¿desean santificarse? ¿Pueden repetir con san Pablo que tienen \"los pensamientos de Cristo\"? (cf. 1 Cor 2,16).", "s": 6}, {"k": "p", "t": "Sus palabras, sus discursos, ¿son dignos de misioneros? Deberían hablar con frecuencia de temas espirituales o útiles, ayudarse mutuamente a crecer en las virtudes o en la ciencia. ¡En cambio, tantas veces sus charlas son tan banales!... Queridos míos, es todo tiempo perdido para su formación. Bastaría que uno de ustedes tuviera el coraje de dar el primer paso, pero nadie se atreve. ¡Y, sin embargo, estarían todos de acuerdo y contentos! Este es un punto que me preocupa en su formación. Quisiera que en sus conversaciones fueran siempre dignos de santos misioneros y misioneras.", "s": 6}, {"k": "p", "t": "Con respecto a las obras, examínense con frecuencia: no basta obrar como cristianos, tienen que hacerlo como buenos misioneros. Si un buen cristiano no tiene que buscar las comodidades, mucho menos deberá buscarlas un misionero. Lo mismo en lo que respecta a la piedad, al trabajo y a todas las virtudes. No basta el hábito y no bastan las palabras para demostrar que son verdaderos misioneros y misioneras, se necesitan las obras. Estas son las que deben dar testimonio de ustedes ante el mundo. Por lo tanto, tengan el espíritu de los Misioneros y las Misioneras de la Consolata en los pensamientos, en las palabras y en las obras.", "s": 6}, {"k": "p", "t": "42. Guiados por los superiores y los formadores. 1 Los superiores y formadores son como centinelas puestos por Dios en el Instituto para promover y conservar el fervor y el buen espíritu. Este es un gran servicio y deber.", "s": 6}, {"k": "p", "t": "Nuestro primer deber como superiores es el de orar por ustedes. Los recordamos en la santa Misa y los encomendamos al Espíritu Santo para que les conceda el don de fortaleza, a fin de que puedan superar las dificultades y combatir los defectos cotidianos, así como también el don de piedad, para que se conviertan en auténticos hombres y mujeres de oración. Nuestro segundo deber como superiores es el de estar presentes en la comunidad, serviciales y atentos. Esta es una responsabilidad grave de la que depende la vida, la prosperidad o la decadencia de las congregaciones. San Pablo ponía su disponibilidad hacia todas las Iglesias por sobre todas las cosas (cf. 2 Cor 11,28).", "s": 6}, {"k": "p", "t": "En tercer lugar, es nuestro deber no dejar pasar nunca un error sin corregirlo, como un maestro de música que no deja pasar una nota falsa con la excusa de que sea pequeña. Recuerdo las directivas que me dio el arzobispo mons. Lorenzo Gastaldi 2 cuando me mandó al seminario. Me dijo:", "s": 6}, {"k": "nota", "t": "1 Para referirse a los educadores de los seminarios o de las casa religiosas, José Allamano seguía el uso común y hablaba normalmente de \"superiores\". La responsabilidad formativa de los superiores con respecto a los miembros de sus comunidades es innegable. Al haber sido él mismo un gran formador, para hacer que su pensamiento sea más explícito aún, cuando él usa sólo el término \"superior\", refiriéndose a su acción formativa, aquí se lo explicita y completa con el término \"formador\".", "s": 6}, {"k": "nota", "t": "2 Lorenzo Gastaldi (1815-1883), arzobispo de Turín, fue un apóstol activo, comprometido y de profunda cultura. Fue doctor en Teología, miembro del Colegio Teológico de la Universidad de Turín y canónigo de la iglesia de la Santísima Trinidad. En 1851 entró con los Rosminianos y el mismo Rosmini lo envió a Inglaterra, donde trabajó durante 10 años. Por motivos de salud,", "s": 6}, {"k": "p", "t": "\"Te recomiendo dos cosas: primero una gran caridad, sin pronunciar nunca palabras duras que puedan ofender a los jóvenes y llevarlos a pensar que su formador no los estime. En segundo lugar, nunca dejes pasar un error sin corregirlo\". Esta es la responsabilidad de los superiores y formadores.", "s": 6}, {"k": "p", "t": "Cuando era director espiritual en el seminario, con frecuencia tenía la tentación de huir para liberarme de esa responsabilidad, que con respecto a ustedes es inclusive mayor y permanente. Por mi parte, me siento responsable de cada uno de ustedes, de su santificación, de la salvación de tantas almas. Quiero presentarme ante Dios con la conciencia de haber hecho mi deber de formador de misioneros y misioneras y, hasta que mis débiles fuerzas me lo permitan, espero poder cumplirlo.", "s": 6}, {"k": "p", "t": "Dios me ha puesto a mí, a sus superiores y formadores para que los guiemos. Por lo tanto, somos nosotros quienes debemos evaluar su vocación y formarlos en el verdadero espíritu del Instituto como Misioneros y Misioneros de la Consolata. Deberemos rendir cuentas ante Dios de cómo hemos llevado a cabo esta misión particular, si fuimos ministros", "s": 6}, {"k": "nota", "t": "en 1862, dejó la congregación y regresó a la diócesis. Elegido obispo de Saluzzo en 1865, participó del Concilio Vaticano I, defendiendo con pasión y maestría la infalibilidad pontificia. Cuando la sede episcopal de Turín quedó vacante, siguiendo el consejo de Don Bosco, Pío IX lo nombró arzobispo. Gastaldi apreció mucho a José Allamano, a quien nombró asistente y luego director espiritual del seminario apenas después de su ordenación, y rector del santuario de la Consolata cuando sólo tenía 29 años. El mérito especial de mons. Gastaldi fue el haber confiado en José Allamano, permitiéndole reabrir el Convictorio Eclesiástico para la formación de los jóvenes sacerdotes en el santuario de la Consolata así como el haber puesto en sus manos la cátedra de teología moral. Allamano siempre sintió una profunda veneración por su arzobispo.", "s": 6}, {"k": "p", "t": "y transmisores fieles de las gracias recibidas para que se las comunicáramos a ustedes. ¡Pobres de nosotros si habremos sido infieles por miedo a ofenderlos! Para ustedes el camino a seguir es el que les indicamos. Si somos nosotros los transmisores de la gracia de Dios hacia ustedes, de esto se desprende que nadie más, ni sacerdote, ni laico, aunque fuera más santo y sabio que nosotros, puede y debe intervenir o dar consejos. Ustedes sólo deberán responder ante Dios por haberme obedecido a mí y a quien los guíe en mi nombre. Espero que todos ustedes tengan esta buena voluntad de dejarse formar. 43. Con corazón abierto y confiado. Aquí todo debe ser amor. Amar a los superiores y a los formadores que por ustedes soportan penas y cansancio; el afecto de ustedes los consolará. Deben ser respetados sin tener en cuenta sus cualidades personales, sino solamente su servicio como representantes de Dios, cada uno según su propia responsabilidad. ¿Tienen ustedes este espíritu de fe práctica?", "s": 6}, {"k": "p", "t": "Permítanme insistir sobre la necesidad de confiar en los superiores y formadores. Nosotros aquí formamos una familia. 3 Ahora bien, en las buenas familias los hijos sienten el deber de comunicarle al padre, para que este los guíe, los pensamientos y afectos, los bienes y los males. Ustedes son los hijos, los superiores y formadores son sus padres en el Señor. Día y noche ellos están a su lado, piensan, oran, trabajan por ustedes, conscientes de la responsabilidad que tienen frente al", "s": 6}, {"k": "nota", "t": "3 Aún conociendo la problemática inherente al concepto de \"familia\" que existe hoy en determinados contextos culturales, aquí se mantiene la terminología y el pensamiento de José Allamano sobre la familia, conservados tradicionalmente en nuestros Institutos y que corresponden exactamente a las enseñanzas del magisterio de la Iglesia.", "s": 6}, {"k": "p", "t": "Instituto, a la Iglesia y a Dios. Por lo tanto, sus corazones tienen que estar abiertos, como el de hijos con su propio padre. Esto es todo lo que ellos desean. Y no olviden nunca que recibieron de Dios una gracia muy especial para guiarlos y formarlos a la santidad necesaria para su estado de vida.", "s": 6}, {"k": "p", "t": "Créanme, sin esta apertura de ánimo se hace mucho más difícil responder dignamente a la vocación, porque es a través de los superiores y formadores, como a través de un canal, que el Señor hace llegar sus gracias a las almas. Creo poder afirmar que el buen espíritu de una comunidad religiosa y misionera florece o se marchita según cómo se ponga en práctica esta confianza.", "s": 6}, {"k": "p", "t": "En las comunidades hay individuos que viven lo que sienten, tratando de observar las reglas, están siempre tranquilos y… ¡Deo gratias! Sigan así todo el año. Pero hay otros —y son la mayoría—, para los que la apertura constante con los superiores y formadores es una verdadera y absoluta necesidad, tanto para no desanimarse en las dificultades como para crecer con mayor rapidez y seguridad en la vida religiosa y misionera.", "s": 6}, {"k": "p", "t": "Para concluir, les puedo decir lo siguiente: nunca nadie se arrepintió de haber confiado. Al contrario, muchos lamentan, pero demasiado tarde, haber descuidado este potente medio de formación: habría bastado un acto de humildad al confiar dificultades y penas, así como habría sido suficiente una palabra de quien guía para salvar una vocación que ahora se ha perdido para siempre. ¡Feliz aquel que comprende y vive estas cosas! Cuando estaré en el paraíso los voy a bendecir todavía más; siempre estaré asomado al balcón… 44. Con sencillez y sinceridad. La sencillez consiste en excluir del espíritu toda segunda intención, para no buscarse a sí mismos sino sólo lo que contribuye a la mayor gloria de Dios y es de utilidad al prójimo: este es el gran secreto de la sencillez, tan amada por el Señor. Él dice: \"Sean sencillos como las palomas\" (Mt 10,16) y nos exhorta a hacernos pequeños si queremos entrar en el Reino. Aquí adentro necesitamos formarnos al espíritu de sencillez. El simple piensa, habla y obra con la verdad.", "s": 6}, {"k": "p", "t": "Si se busca (como se debería) sólo la voluntad de Dios y nuestro bien, confiemos todo (menos el pecado) a los superiores y a los formadores, que nos ayudarán a conocer la voluntad de Dios y, además, nos impedirán encarar un camino que Dios no quiere que transitemos. En vez de buscar todos los medios para darse a conocer y ser ayudados a corregirse y perfeccionarse, algunos tratan de esconder y cubrir sus debilidades. Así no se comportan los santos. Si nos hiciéramos el propósito de obrar como los niños, que dicen todo lo que piensan, sería mejor. No tengan miedo de que se conozcan sus defectos, porque de esa manera los demás podrán ayudarlos a corregirlos. Tengan miedo de tener defectos, pero no de que los demás los conozcan. Tengan un espíritu recto, sean sencillos, sin ambigüedades… La realidad es la que es. ¡Recuerden que el Señor no obra en el agua turbia! Que lo que sale de la boca surja del corazón. La verdad es la verdad y debemos amarla. Esto es lo que quiero: espíritu límpido, neto, claro; que lo que tengamos adentro concuerde con lo que se ve por fuera. 45. De calidad. El Señor ha mandado vocaciones a nuestro Instituto y, si hay un buen espíritu, mandará otras, porque el Instituto es obra suya así como las vocaciones. Que el Señor nos siga mandando vocaciones, pero de buena madera. Esto es lo que quiero: pocos pero buenos, pocos pero en regla: que tengan espíritu, que sean voluntariosos y capaces de trabajar por tres. No es el número lo que cuenta, sino la calidad y el espíritu, aunque el número también tiene su importancia siempre que vaya acompañado de la calidad.", "s": 6}, {"k": "p", "t": "¿Para qué quiero tener cincuenta o cien jóvenes en formación si no son como yo los quiero? ¡Cuántas veces me oyeron decir: cuidado con abrir de par en par la puerta de entrada! ¡Cuidado con el miedo a rechazar jóvenes! Siempre les repito lo mismo; pero lo repito porque el número me asusta si no va acompañado de las necesarias virtudes que debe tener cada miembro. Cuando son muchos no se pueden formar tan bien, como cuando son pocos. Se los he dicho y lo repito: mejor pocos, pero como se debe. Y si alguien que aún no ha hecho los votos perpetuos siente que no logra vivir como debería, hace bien en dejar la comunidad. Es mejor para él, para el Instituto y para la misión. 46. Sin apuro por ir a las misiones. Ustedes son como tiernas plantas en el jardín de la Iglesia y el Señor quiere que crezcan bien, derechos, llenos de vida. Pero para lograrlo es necesario dejarse cultivar. De corazón, pongan manos a la obra. ¡Feliz aquel que se ha preparado bien! Para adquirir virtudes sólidas, plenas, macizas, se necesita tiempo.", "s": 6}, {"k": "p", "t": "No estén apurados por ir a las misiones. Es justo que sientan tantos deseos de partir, porque este es el fin por el que vinieron y hacia el cual se dirigen. Hacia el mismo está orientada la formación que reciben en el Instituto. Siempre les digo que su corazón debe estar en las misiones. Sin embargo, este deseo debe estar acompañado por un santo temor. De hecho, no basta con querer partir, porque para poder hacerlo hay que estar preparados, no sólo en lo que respecta a los conocimientos, sino y sobre todo, en las virtudes. En las misiones el árbol dará sus frutos: serán pacientes, generosos, desarraigados frente a las comodidades si se ejercitaron en todas estas cosas durante el período de formación, si adquirieron el hábito. Este es el justo temor que experimentan todos los que tienen un buen espíritu y comprenden el valor del apostolado.", "s": 6}, {"k": "p", "t": "¡Dejemos la ansiedad de vivir corriendo! Les recomiendo que tengan calma y paciencia para prepararse bien. Quiero que vayan despacio para poder caminar bien. No basta con tener mucha tierra para cultivar si después faltan los brazos para trabajarla o si los obreros no son idóneos para realizar el trabajo. Se necesita gente capaz, bien formada. Me gustaría que estas consideraciones se les grabaran en la mente. Que deseen ir a las misiones está bien, pero también deben temer no estar lo suficientemente preparados. La Iglesia no necesita tantas personas; aun sin ellos continuará su misión: En cambio necesita apóstoles preparados y bien formados en el espíritu. Nadie es necesario, pero todos son útiles. Lo mismo podemos decir de nuestro Instituto.", "s": 6}, {"k": "h3", "t": "Formación a una vida ordenada", "s": 6}, {"k": "p", "t": "47. Interés y colaboración de todos. La disciplina 4 es importante porque favorece la formación de las personas y la organización", "s": 6}, {"k": "nota", "t": "4 En la pedagogía de José Allamano, como era costumbre en su época, la palabra \"disciplina\" implicaba diferentes actitudes que iban desde la observancia de las normas, a la regularidad y el modo de tratar con las personas. Estas actitudes se pueden sintetizar en una sola: \"ser fieles en modo ordenado a la propia vida\". La disciplina, en realidad, no significaba tanto una fidelidad externa a normas o deberes, sino una coherencia interior a los compromisos asumidos. Para no modificar las palabras de José Allamano, en estas páginas se mantiene la palabra \"disciplina\", que debe ser interpretada a la luz de estas aclaraciones.", "s": 6}, {"k": "p", "t": "de la comunidad. Ésta abarca un ámbito muy amplio que incluye la puntualidad en el cumplimiento de las propias obligaciones, la fidelidad a las normas y costumbres de la comunidad, la buena educación, la urbanidad, etc.", "s": 6}, {"k": "p", "t": "Los antiguos padres de familia, como los patriarcas, cada tanto solían reunir a sus hijos mayores, a los más juiciosos, y discutían con ellos sobre cosas de la familia. Hablaban del pasado, del presente y del futuro: cómo les iba en los negocios, qué mejoras se podían aportar, lo que se debía corregir en la vida de la familia. Conocí a uno de estos padres: ¡qué bien marchaban las cosas en su casa! ¡Para ellos era común ponerse de acuerdo y comprometerse! Del mismo modo debemos hacer
