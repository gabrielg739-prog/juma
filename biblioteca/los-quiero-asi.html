n al Santísimo Sacramento.", "s": 11}, {"k": "p", "t": "La consolación más hermosa que podrán tener en las misiones es la visita a Jesús Sacramentado. Cuando estarán allí, no dejen nunca de hacerla, ningún día del año. Debemos ser sacramentinos aquí y en las misiones. Por lo tanto, sean muy devotos de Jesús Sacramentado; si tienen esta devoción, entonces lo tienen todo. Lo comprobarán en las misiones. Quiero que ésta sea la devoción del Instituto.", "s": 11}, {"k": "h2", "t": "9. Todas las generaciones me llamarán feliz", "s": 12}, {"k": "h3", "t": "Cooperadora de Jesús", "s": 12}, {"k": "p", "t": "154. Reina de los misioneros y las misioneras. Creo que faltaría a mi deber y a mi especial afecto a la Santísima Virgen, si no aprovechara de todas las ocasiones propicias para hablar de ella. La Virgen es la Reina de los misioneros y las misioneras. Es una gracia poder hablar de esto; en cierto modo estamos colaborando con el cumplimiento de su profecía: \"Todas las generaciones me llamarán feliz\" (Lc 1,48). En efecto, no hay ningún pueblo o aldea donde no haya una iglesia, un altar o un monumento con la imagen de la Virgen. La piedad mariana está basada en el Evangelio. ¿Hay alguien que la haya amado y honrado más que Jesús? En las bodas de Caná, en respuesta a su pedido, hizo el primer milagro. La Iglesia pone en labios de la Santísima Virgen las palabras de la Sagrada Escritura: \"El que me encuentra ha encontrado la vida y ha obtenido el favor del Señor\" (Prov 8,35). La piedad mariana es una necesidad. Si no tienen devoción a la Virgen, y no sólo devoción, sino una tierna devoción, ¡no podrán ser santos!", "s": 12}, {"k": "p", "t": "155. A Jesús por María. El deso de la Virgen es cooperar para que la sangre de su Hijo no haya sido derramada en vano. Corredentora con nuestro Señor, Ella también ha llevado el peso de nuestros pecados. Todo lo que hiere a Jesús, la hiere y disgusta a María. Ella quiso dar su nombre a nuestro Instituto para que colaboremos en la salvación de la mayor cantidad de almas posible. Si uno quiere salvarse sin pasar por María, se equivoca. No se puede llegar a Jesús si no es por medio de ella: ¡a Jesús por María!", "s": 12}, {"k": "p", "t": "La piedad mariana es un signo de predestinación. Sí, porque la Virgen no desea otra cosa que la salvación de las almas. A veces nos preguntamos sorprendidos: ¿Cómo es posible que tal persona, después de tantos años de vida desordenada, se haya convertido y haya muerto reconciliada con Dios?\". La explicación la encontramos siempre en el mismo lugar: un poco de devoción a la Virgen. Conocí a alguien que desde hacía más de cuarenta años había dejado todas las prácticas religiosas, conservando sólo la pía devoción de rezar tres Avemarías todos los días. La Virgen le concedió la gracia de tener una buena muerte. Con esto no quiero decir que basten tres Avemarías mientras se sigue pecando; quiero decir que la Virgen, por un pequeño gesto de amor, incluso después de treinta o cuarenta años, induce a la persona al arrepentimiento.", "s": 12}, {"k": "p", "t": "La piedad mariana no sólo es garantía de predestinación, sino también de santificación. Quien quiera alcanzar la santidad sin la Virgen, es como quien pretende volar sin alas. Más recurrimos a ella para obtener gracias y santidad, más le causamos placer a nuestro Señor. Todos los santos fueron devotos de María. La homilía más bella de san Jerónimo es la que le dedicó a la Virgen. Nunca me habría imaginado que un santo como él, más bien rústico, hubiera podido ser tan tierno al hablar de ella. San Bernardo dice que la Virgen es fuente y canal. Es fuente de gracia, basta ir a buscarla; y es canal, porque todas las gracias pasan por ella. Lo que Dios puede por omnipotencia, la Virgen lo puede con la oración. La", "s": 12}, {"k": "p", "t": "Virgen es omnipotente por gracia. En Dios y con Dios lo puede todo. Es tesorera y dispensadora de todas las gracias. Según los santos, Ella es la omnipotencia suplicante. 156. La devoción a María nunca es excesiva. Con su ternura materna la Virgen entra en las intenciones de su Hijo. Sabe cuánto le hemos costado, conoce exactamente la voluntad de Dios que quiere que todas las personas se salven. No teman ser demasiado devotos de la Virgen, de honrarla demasiado. Más la amamos, más recurrimos a ella y más placer le provocamos a Jesús. Todos los títulos honoríficos son adecuados para María y la piedad cristiana le atribuyó todas las funciones propias de una Madre piadosa y misericordiosa. Por lo tanto, también es honrada e invocada como protectora de las santas almas del purgatorio. Verdaderamente, la Santísima Virgen es Reina, Madre y Consoladora también de esas almas. Por lo tanto, recuérdenlo: si no seremos devotos de la Virgen, nunca haremos nada, ni por nosotros, ni por los demás.", "s": 12}, {"k": "p", "t": "Ante todo consideremos a María nuestra verdadera Madre, a ejemplo de san José Cafasso, que decía: \"Acuérdense que tienen en María una segunda Madre, que los ama más que la primera, sin por ello ocupar su lugar\". A una madre se le tiene confianza, se la ama. Encendamos en nosotros el amor filial a la Virgen, deseemos sentirlo cada vez más intenso en nosotros y digámosle con afecto: \"¡Madre mía!\". ¿Cómo no sentir cariño por la mamá? Y si se lo siente por la madre terrena, ¿por qué no por la del cielo?", "s": 12}, {"k": "p", "t": "Para avanzar en el camino hacia la santidad, según las enseñanzas de san Luis María Grignon de Monfort, hagámonos \"esclavos\" de María, como san Francisco Javier que se hacía esclavo de Jesús. A nosotros nos gusta más ser hijos; de todos modos, somos esclavos voluntarios. Esta esclavitud consiste en una donación total de nosotros mismos a María. Como consecuencia práctica, hagamos todo con la Virgen, todo por la Virgen y recibamos todo de ella. San José Cafasso decía que había que tener a María como \"socia\" en todo. \"Cuando vayan a predicar —agregaba— lleven con ustedes a la Virgen. Vayan a predicar juntos y díganle: \"yo pondré la voz, pero predicarás tú\". Él decía que la Virgen era su \"socia\". En realidad yo quería sacar la palabra \"socia\", pero la dijo él... Hacer todo con María quiere decir tomarla como nuestro modelo en todas las acciones: ¿cómo lo haría ella? Démonos por entero a María, en cuerpo y alma, para que disponga de nosotros como mejor le plazca y nos ayude a ser santos.", "s": 12}, {"k": "h3", "t": "Hijos e hijas de la Consolata", "s": 12}, {"k": "p", "t": "157. La pupila de sus ojos. La Virgen, bajo todas sus advocaciones, es una sola; pero ustedes séanle devotos, especialmente bajo el título de \"Consolata\". De hecho, la Santísima Virgen, bajo este título, no es acaso nuestra Madre y no somos nosotros sus hijos e hijas? Sí, nuestra Madre muy tierna, que nos ama como la pupila de sus ojos, que pensó en nuestro Instituto, lo sostuvo en todos estos años material y espiritualmente, y siempre está lista para responder a nuestras necesidades. La verdadera fundadora es María Santísima.", "s": 12}, {"k": "p", "t": "No hay dudas de que todo lo que se hizo es obra de la Santísima Consolata. Ella hizo por este Instituto milagros cotidianos; hizo hablar a las piedras, llover dinero. En los momentos dolorosos, la Virgen intervino siempre de forma extraordinaria. He visto mucho, mucho... Y si ustedes estuvieran atentos, verían y comprenderían que el buen espíritu que hay en la comunidad, el mismo deseo de hacerse buenos, todo, todo es gracia de la Santísima Consolata. Por no hablar de las gracias que nos ha concedido a lo largo del año, incluso de orden temporal, como el pan cotidiano. Sí, hasta esto le encargo a la Virgen. Nunca he perdido ni el sueño ni el apetito por los gastos enormes del Instituto y de las misiones. Digo a la Santísima Consolata: \"¡Ocúpate tú! ¡Si haces buena figura, eres tú!\". 158. Especialmente nuestra. La Consolata es especialmente nuestra y tenemos que estar felices de tenerla como Protectora, estar santamente orgullosos de que nuestro Instituto se llame \"de la Consolata\". Somos un milagro viviente de las gracias de la Virgen. Tratemos de merecer cada día más el hermoso título que nos ha dado. Somos Consolatinos. Debemos sentirnos afortunados por llevar el nombre de la Virgen. Cuando ustedes van por la calle, la gente no dice: \"Son los misioneros o las misioneras\", sino: \"Son los Misioneros o las Misioneras de la Consolata\". No pueden nombrarlos sin nombrarla a ella. Todos nos consideran los hijos menores de María y confían tanto en nuestras oraciones.", "s": 12}, {"k": "p", "t": "Lo repito: debemos estar santamente orgullosos de pertenecer a la Virgen bajo este título que muchos nos envidian. ¡Y cuántos nos quieren por llamarnos \"Misioneros o Misioneras de la Consolata\"! El nombre que llevan debe animarlos a convertirse en lo que deben ser. Es casi un error decirle a María las palabras de san Bernardo: \"Muéstrate como Madre\". ¡Evidentemente no necesita que se lo recordemos! Más bien, ella podría decirnos a nosotros: \"¡Muéstrate como Hijo!\". Somos hijos e hijas predilectos de la Consolata, pero en lo concreto, ¿vivimos como tales? El amor filial es tierno por naturaleza; necesitamos recurrir a lo largo del día a Ella, exactamente como a una madre. Quien no tiene un poco de sentimiento y de amor particular a la Santísima Consolata, no tiene corazón, ¡y nosotros debemos tenerlo! 159. Novena y fiesta de la Consolata. Cuando comienza la no-vena en preparación a la fiesta de la Consolata, les haría una ofensa recordarles que deben hacerla bien. ¡Basta saber que nos acercamos a festejar a nuestra querida Madre para que esté todo dicho! Para nosotros, hijos e hijas predilectos de la Consolata, ¿es importante esta fiesta? ¡Es todo! No, no quiero decirles que deben prepararse; estoy seguro de que todos están bien dispuestos para hacer bien la novena y celebrar con entusiasmo la fiesta. ¡El corazón nos dice lo que hay que hacer por una madre! Por lo tanto, pongamos empeño para rendirle honor. Pidamos tantas gracias para nosotros y para el Instituto: en primer lugar que, creciendo numéricamente, se crezca también en gracia para reponder adecuadamente. Por lo tanto, que el fruto de esta fiesta sea tratar de complacer cada vez más a la Virgen y ofrecerle los mejores dones que corresponden a sus hijos e hijas. Si celebramos con intensidad de amor todas las fiestas de la Virgen, con cuánta más razón ésta que es \"nuestra\" fiesta, es decir nos pertenece de modo particular. 160. Oración de José Allamano a la Consolata: \"Te agradezco, María, por ser desde hace ya 35 años el custodio de tu santuario... ¿Qué he hecho en estos 35 años?... Si otro hubiese estado en mi lugar, ¿qué habría hecho?... No importa. Si no lo hubiera hecho bien, no me habrías dejado tantos años. ¡Este es un signo claro de predilección!... Si hice algo mal, ocúpate tú, arréglalo tú y listo; acepta todo como si lo hubiera hecho perfectamente. No quiero complicaciones, toma las cosas tal como son; si me has dejado aquí significa que debes estar contenta!\". Y me pareció que la Virgen sonreía.", "s": 12}, {"k": "h3", "t": "Misterios marianos", "s": 12}, {"k": "p", "t": "161. Inmaculada Concepción. La Inmaculada Concepción de María es un misterio lleno de alegría. Es una fiesta que llega al corazón. ¡Las fiestas de la Virgen son una más hermosa que las otras! Recuerdo las celebraciones grandiosas que se realizaron en 1854, cuando fue proclamado el dogma de la Inmaculada Concepción, cuando yo todavía era un niño. Más tarde, como director espiritual en el seminario, exhortaba a celebrar bien la novena y la fiesta. Pasaron tantos años y, por voluntad de Dios, me encuentro de nuevo haciendo la misma exhortación. Debemos estar contentos de que nuestra Madre sea Inmaculada desde su concepción. Un hijo se alegra por las virtudes de su madre. Por lo tanto, alegrémonos con María: \"Toda bella eres María y la mancha original no existe en ti\". Dios la preservó del pecado original, previendo los méritos de nuestro Señor Jesucristo. La Virgen no tenía la inclinación al mal y no podía pecar. Desde el primer instante fue colmada de Espíritu Santo, llena de gracia por encima de todas las criaturas.", "s": 12}, {"k": "p", "t": "\"El Señor la fundó sobre las altas montañas\" (Sal 86,1). Los Padres, comentando este salmo, lo aplican a la Virgen. La Iglesia, en este misterio, festeja todos los privilegios y dones que ella recibió: \"¡Toda bella eres María!\"; \"¡Llena de gracia!\". Cuando pronunciemos estas palabras, pensemos que no fueron sólo para la Virgen, sino también para nosotros: \"¡Vengan a mí los que me desean, y sácience de mis productos!\" (Ecli 24,18). Por lo tanto, acudamos a María con confianza y siempre. El Señor la ha convertido en depósito de la gracia.", "s": 12}, {"k": "p", "t": "El verdadero amor a la Virgen no consiste en el sentimiento, sino en la voluntad, dispuesta a poner en práctica lo que concierne al servicio de Dios y al honor de la Santísima", "s": 12}, {"k": "p", "t": "Virgen. La ternura es un agregado no necesario. Tenemos que rezar a la Inmaculada e imitarla, sobre todo en la pureza de nuestras intenciones. Nosotros somos los hijos predilectos de María y un día deberemos ser como los brillantes de su corona. Pero los brillantes deben ser purificados; por eso también nosotros debemos purificarnos y dejarnos modelar así como son trabajadas y modeladas las piedras preciosas. 162. Presentación de María en el templo. La fiesta de la Presentación de María Santísima en el templo siempre fue celebrada en Oriente, donde la devoción a la Virgen fue siempre muy rica, promovida e impulsada por tantos santos Padres, como Juan Damasceno, Juan Crisóstomo, etc. También en Occidente la Santísima Virgen era venerada bajo este misterio, pero privadamente. Fue el Papa Sixto V quien la prescribió para toda la Iglesia. Es una fiesta muy querida que me gusta tanto y que hemos propuesto al Noviciado como fiesta propia. En efecto, María Santísima, en este misterio, es un modelo para la formación religiosa, sacerdotal y misionera. Es un modelo de vida escondida, de obediencia, de laboriosidad y de caridad. Con el ejercicio de estas virtudes la Virgen se preparó para la alta dignidad de Madre de Dios. Ustedes deben hacer lo mismo como preparación para la misión.", "s": 12}, {"k": "p", "t": "Tengan en cuenta cómo la ofrenda que María hizo de sí misma al Señor en el misterio de su presentación al templo, ha sido rápida, total, irrevocable. Ante todo rápida. En las pinturas María es representada en el momento en que sube las escalinatas del templo; parece ir corriendo, para llegar enseguida. Respondió inmediatamente al llamado de Dios, que ama las primicias: quien da enseguida, da dos veces. ¿Y nosotros? ¿Estamos dispuestos, rápidos y alegres para el llamado del Señor? Al menos estemos preparados para responder ahora. La ofrenda de María, además, fue total, sin reservas. Se dio por entero, con todas las fuerzas, para ser siempre y totalmente consagrada a Dios. Ella permaneció en el templo con la plena voluntad de no rechazar nada de lo que venía del Señor. ¿Y nosotros? ¿Le hemos dado todo al Señor: mente, corazón, alma? Si, después de tantas gracias, tantas luces, somos siempre los mismos, es porque no nos damos al Señor en todo y para todo. No hay que excluir nada. Por último, María se ofreció en modo irrevocable. ¿Y nosotros? También nuestra entrega debe ser irrevocable; seguir avanzando, sin detenerse. No es tan malo caerse sino no levantarse. Volvamos a empezar siempre sin cansarnos nunca. El Señor es generoso con nosotros, pero quiere que también nosotros seamos generosos con Él, que hagamos nuestra parte. Por lo tanto, pidamos esta gracia a la Virgen: que nuestra respuesta sea rápida, total, irrevocable. 163. La Anunciación a María. La Navidad es una gran solemnidad, pero la verdadera fiesta de la Encarnación del Verbo es la Anunciación a María Santísima. Saludada como \"llena de gracia\", se le dijo que el Señor estaba con ella y que debía convertirse en la Madre de Jesús. Inclinándose ante la voluntad de Dios, se proclamó la Sierva del Señor. ¿Qué debemos hacer para vivir este misterio? En particular: participar fervorosamente de la celebración eucarística, en la que se proclaman esas bellas palabras: \"Y el Verbo se hizo carne\"; rezar bien el Avemaría, que recuerda este misterio de la Anunciación; agradecer a la Santísima Trinidad por este don de los dones, que es la Divina Encarnación; ofrecer los pequeños sacrificios de la vida y congratularnos con la Virgen por haber sido elegida para ser la Madre del Verbo Encarnado. 164. La Visitación a Santa Isabel. La Iglesia celebra el misterio de la Visitación de María a Isabel. Durante los tres meses transcurridos con ella, María vivió una vida extremadamente ordinaria, pero no de forma ordinaria. Hacía como las mujeres cuando van a ayudar a las vecinas en circuntancias similares, es decir dando una mano en todos los servicios de la casa. Ustedes también deben santificarse del mismo modo y hacer todas las cosas bien y sólo por amor a Dios. ¡Qué difícil es que hagamos todo con recta intención! Lo importante no es hacer mucho, sino hacerlo todo bien.", "s": 12}, {"k": "p", "t": "Este misterio nos enseña que María Santísima es el canal de todas las gracias. En efecto, fue al sentir su voz en el saludo a santa Isabel que Juan Bautista exhultó en el seno de la madre y fue santificado. Proclamada por Isabel \"bendita entre las mujeres\", dio gloria y honor a Dios con el cántico del Magníficat. El p. Henri Didon escribe: \"El Magníficat sobrepasa cualquier capacidad humana; es el más espléndido grito de alegría que haya podido surgir de un corazón humano. María no piensa en su propia bajeza y se exalta únicamente en Dios. Predice su gloria, pero en eso ve sólo el triunfo de Dios\".", "s": 12}, {"k": "p", "t": "El Magníficat contiene palabras de la Sagrada Escritura. Tiene diez versos y se divide en tres partes. En la primera, María exalta los beneficios concedidos por Dios sólo a ella, especialmente la Divina Maternidad: \"Mi alma canta la grandeza del Señor, porque él miró con bondad la pequeñez de su servidora...\". El Señor miró su pequeñez, la nada de su servidora, la exaltó, hizo cosas maravillosas en ella, de forma tal que todas las generaciones, llenas de admiración, ¡la llamarán feliz! En la segunda parte, María exalta los beneficios otorgados por Dios a la humanidad a lo largo de la historia: \"Su misericordia se extiende de generación en generación...\", primero al pueblo elegido, luego a los paganos y a todos los que temen al Señor. \"El Todopoderoso ha hecho en mí grandes cosas, desplegando la fuerza de su brazo...\". ¿Qué obras? Humillar a los soberbios y elevar a los humildes; saciar a todos aquellos que tienen hambre de justicia y de verdad. \"Colmó de bienes a los hambrientos...\": significa que el Señor siempre está listo para colmar de bienes a aquellos que lo desean. En la tercera parte, María vuelve al beneficio soberano de la redención iniciada en ella misma al concebir a Jesús, y extendida a todas las generaciones futuras, \"como había prometido a Abraham\": que en él todas las generaciones habrían sido bendecidas, porque de su estirpe habría nacido el Redentor. Tratemos de meditar con frecuencia el Magníficat, rezándolo o cantándolo con el espíritu y el entusiasmo con que la Virgen lo proclamó, identificándonos con sus mismos sentimientos.", "s": 12}, {"k": "p", "t": "165. La Dolorosa. El 20 de septiembre, día de mi primera misa, celebré la liturgia de Nuestra Señora de los Dolores. Debemos serle devotos. El culto a los dolores de María Santísima es uno de los más amados por ella y eficaces para nosotros. Meditemos seguido cuánto le hemos costado a la Virgen, porque ella estuvo íntimamente vinculada a la pasión de nuestro Señor; todos los dolores de él se proyectaron sobre el corazón de la Madre. Ya desde que fue elegida para ser la Madre del Redentor, Dios le preanunció, con la profecía de Simeón, el martirio incruento que iba a tener que soportar. Toda la vida de María Santísima, como la del Señor, fue cruz y martirio. Sólo un corazón delicado es capaz de compadecer a la Madre en sus grandes dolores. La Madre no puede no apreciar un homenaje de ese tipo, y no sólo ella, sino también el Hijo. Este es un deber de todos los cristianos, pero especialmente nuestro que, como hijos e hijas de la Consolata, tenemos el deber especial de consolar a nuestra madre, hacer que realmente sea \"Consolata\". No por nada llevamos este título.", "s": 12}, {"k": "p", "t": "San Alfonso dice que María Santísima fue la Reina de los mártires, porque su martirio fue más largo y doloroso que el de todos los mártires juntos. San Bernardo explica que María Santísima fue mártir en el espíritu. Todo lo sufrió por nosotros y nuestra salvación. Meditando los dolores de la Virgen que cada uno diga: \"¡Ha sufrido por mí!\". No sólo debemos cultivar esta devoción por amor y agradeciemiento hacia nuestra Madre, sino también por nuestro provecho. San José Cafasso dice que es útil durante la vida y cuando estamos cercanos a la muerte. Como cristianos, y más aún como misioneros y misioneras, todos debemos sufrir. ¿Quién nos sostendrá? La mejor ayuda la recibiremos de María Santísima. Ella nos ayudará en todos los sacrificios que encontraremos y también a arrepentirnos de nuestros pecados con una ayuda especial, especialmente si estamos cercanos a la muerte.", "s": 12}, {"k": "p", "t": "Durante el rezo del rosario, cuando mediten los misterios dolorosos, cuando piensen en nuestro Señor sufriente, piensen también en los sufrimientos de la Virgen. Ella lo acompañó en este camino de dolor desde el Getsemaní hasta el Calvario. El culto a la Dolorosa rompe la dureza de nuestros corazones y nos permite gustar de la oración. ¡Honremos y consolemos a la Dolorosa, nosotros que somos hijos e hijas de la Consolata! 166. Asunción. Esta es la fiesta más solemne que la Iglesia, desde los primeros siglos, celebra en honor a María. San Ambrosio escribe: \"Como María Santísima es la Madre de Jesús, que es la cabeza de la Iglesia, en cierto modo ella es la Madre de la Iglesia\".", "s": 12}, {"k": "p", "t": "En esta fiesta conmemoramos el Tránsito de la Beata Virgen y su gloriosa Asunción al cielo en cuerpo y alma. San Juan escribe en el Apocalipsis que ha visto en el cielo una Mujer vestida de sol, con la luna bajo los pies, y en su cabeza una corona de doce estrellas (cf Apoc 12,1). Esta mujer es símbolo, sobre todo, de la Iglesia y las doce estrellas representan a los Apóstoles. Los santos Padres ven en esta Mujer resplandeciente como el sol, a María Santísima. Ella resplandece en el cielo como el sol, que es Jesús, porque está a su derecha: \"Una hija de reyes está de pie a tu derecha: es la reina, adornada con tus joyas y con oro de Ofir\" (Sal 44,10). El mejor modo de celebrar la fiesta de la Asunción es imitar a la Virgen en el modo en que se preparó, durante esta vida, para recibir en el paraíso la gloria de la que ahora goza. A imitación suya, hagamos permanentes gestos de desapego de la tierra y de las cosas terrenales, y tratemos de vivir cada día como si fuera el último de nuestra vida. ¡Qué afortunados seríamos si pudiéramos morir, como María, de amor a Dios!", "s": 12}, {"k": "p", "t": "En la Liturgia de las Horas la Iglesia nos hace cantar esta bella antífona: \"Ave Reina del Cielo\". ¡Cantémosla y recémosla frecuentemente con afecto y alegría, gozando de que nuestra querida Madre sea elevada tan alto, hasta ser coronada como Reina del Cielo! Por lo tanto, ¡ánimo! ¡Ojos y corazón en dirección al paraíso! ¡Y no sólo hoy, sino siempre!", "s": 12}, {"k": "h3", "t": "Oraciones a María", "s": 12}, {"k": "p", "t": "167. Avemaría. La oración más excelente a la Santísima Virgen ciertamente es el Avemaría. ¿Cómo nació esta plegaria? El arcángel Gabriel, por encargo de Dios, dijo: \"¡Alégrate, llena de gracia, el Señor está contigo!\" (Lc 1,28). Santa Isabel, inspirada en el Espíritu Santo, pronunció las palabras: \"¡Tú eres bendita entre todas las mujeres y bendito es el fruto de tu vientre!\" (Lc 1,42). La Iglesia, inspirada también ella por el Espíritu Santo, agregó las otras palabras.", "s": 12}, {"k": "p", "t": "¡Cuántas veces se reza el Avemaría! En el Angelus, tres veces al día; cincuenta veces en el rosario. Por lo tanto, ¡cuántas veces lo rezamos en un día, en un mes, en un año! ¡Cuántos Avemarías a lo largo de toda una vida! San Alfonso explica que, con este saludo, en cierto modo le volvemos a hacer sentir a María la alegría de la Anunciación. Recémosla siempre bien, identificándonos con los sentimientos del Ángel, de santa Isabel y de la Iglesia. Cada vez que rezamos el Avemaría deberíamos hacerlo con tanto entusiasmo que se nos debería salir el corazón por la boca. Si lo gustáramos, si lo recitáramos con amor en vez de decirlo a las apuradas, podríamos meditar cada una de sus palabras.", "s": 12}, {"k": "p", "t": "168. Salve Regina. Después del Avemaría, la oración más bella y útil es el Salve Regina. San Alfonso la llama una \"devotísima oración en la que se encuentran descritas la misericordia y la potencia de la Santísima Virgen\". Esta oración se compone de tres partes. La primera, \"¡Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra, Dios te salve!\", es como un proemio en el que nos dirigimos a Ma-ría Santísima con cinco títulos honoríficos. La Virgen es Reina y es Madre. Es \"Reina\", ¡y cuántas veces en las letanías la invocamos con este título! Es \"Madre\" de misericordia que nos ha sido dada por nuestro Señor. Los otros tres títulos los comparte con Jesús, que es nuestra verdadera \"vida\", \"dulzura\" y \"esperanza\". La segunda parte es una súplica. Pidamos a la Virgen que nos ayude en este \"valle de lágrimas\", que sea nuestra abogada ante su Hijo, para que obtengamos las gracias que necesitamos aquí en la tierra, ¡para así un día poder ver y gozar del fruto bendito de su vientre: Jesús! Después viene la tercera parte, que es la imploración final, la cual, se dice, tuvo origen en este hecho: en una iglesia se cantaba el Salve Regina y, al finalizar, san", "s": 12}, {"k": "p", "t": "Bernardo, que estaba presente, gritó: \"¡Oh clemente, oh piadosa, oh dulce Virgen María!\". Los santos estaban enamorados de esta oración, así como del Avemaría.", "s": 12}, {"k": "p", "t": "169. Rosario. Tantas veces han oído hablar de la excelencia del santo rosario: tanto en sí mismo como por la estima que le tuvieron los sumos pontífices y los santos, así como por las numerosas gracias espirituales y temporales que nos concede a nosotros y a los demás para la vida temporal y la vida eterna. El rosario es una oración vocal y mental. Como oración vocal, hace parte de la misma, ante todo, el Padrenuestro. San Agustín dice que es una oración breve, pero en la que no ha sido excluida ninguna gracia. El padre José Bruno 1 solía repetir la afirmación, atribuida a Tertuliano, que el Padrenuestro, con sus siete pedidos, es como un compendio del Evangelio. Del Avemaría ya hemos hablado. Estas dos oraciones contienen lo mejor para rezarle al Señor y a la Virgen.", "s": 12}, {"k": "p", "t": "Además, el rosario es una oración mental. Es la mejor meditación sobre la vida del Señor y de María, meditación que vuelve suave su rezo. No es necesario meditar todo el tiempo cada misterio, pero si podemos, mejor. Ni siquiera es necesario aferrarse a los misterios determinados para tal o cual día. En el rezo privado uno puede hacer lo que más le guste. Por ejemplo, durante la Cuaresma puedo rezar y meditar cada día los misterios dolorosos. Cuando se medita, dice san Agustín,", "s": 12}, {"k": "nota", "t": "1 P. Bruno José (1826-1907), de los padres felipinos, celante párroco de la iglesia de san Eusebio, más conocida como San Felipe, en Turín. Además que del can. Soldati, José Allamano recibió del p. Bruno el característico amor a las sagradas ceremonias, incluso las más pequeñas. Cf. La biografía anónima Chi era il P. Bruno (Quién era el P. Bruno), Turín 1908. José Allamano cita con frecuencia su texto Conferenze al Clero (Conferencias al Clero), Turín 1909, pp.347.", "s": 12}, {"k": "p", "t": "debemos dejarnos llevar por el corazón. Si lo rezamos de esta manera, el rosario sacia el corazón y el espíritu, haciéndonos sentir un nuevo impulso hacia esta santa oración.", "s": 12}, {"k": "p", "t": "Algunos objetan: \"¡Se repite siempre la misma oración!\". El amor, dijo Lacordaire, cuenta con una sola palabra; más se la repite, más es dulce y siempre nueva. Cuando uno quiere a su mamá, no necesita de muchas palabras para decírselo. ¿Se puede uno cansar de repetir: Ave María? Podríamos estar en éxtasis durante todo el día con sólo meditar estas palabras: ¡Ave María! Es aburrido repetirla para quien no ama a la Virgen, para quien no tiene espíritu. Si la primera vez la dije con fervor, la segunda la diré con entusiasmo. Amen y estimen esta práctica; no la sientan como un peso. Grábenla en sus corazones e inclúyanla entre sus propósitos. 170. Mes de María. Como hijos e hijas de la Consolata, vivamos bien el mes dedicado a María Santísima. Si todos deberían ser afectuosos con María, con más razón los misioneros y las misioneras. Por lo tanto, tratemos de santificar este mes honrándola y creciendo cada vez más en el amor hacia ella. Sobre todo recen bien, lo mejor que puedan y unan a la Virgen con el Señor todo el día. El Reina del Cielo o el Angelus, el rosario y las otras invocaciones en honor de la Virgen, rezarlas con corazón sincero y entusiasmo. Quisiera que la Virgen estuviera realmente contenta de ustedes.", "s": 12}, {"k": "p", "t": "Hacer sacrificios en honor de María está bien, pero vale más la imitación de sus virtudes. Por lo tanto, tratemos de vivir este mes -mes de gracias particularesesforzándonos por crecer en la virtud que la Virgen nos sugiera. Oraciones, homenajes, actos de virtud: esto es todo lo que debemos hacer en este mes para honrar a María. Mientras tanto, pidamos al Señor un amor constante, fuerte, confiado en Ella, como hacia una madre. ¡Qué bella y plena es la vida cuando se es devoto de María! Quiero que para ustedes sea \"mes de María\" todo el año, porque deben estar como enamorados de la Virgen. Ella sigue haciéndonos ver que ama a nuestro Instituto. ¡La he puesto como patrona y protectora para que se ocupe ella! Por todas partes tenemos la imagen de la Consolata: saludémosla de corazón.", "s": 12}, {"k": "h2", "t": "10. Con los ojos dirigidos al Señor", "s": 13}, {"k": "h3", "t": "Palabra de Dios", "s": 13}, {"k": "p", "t": "171. El corazón de Dios en su Palabra. En el libro de los Macabeos se lee que Areios, rey de los Espartanos, le escribió a Jonatán para renovar la antigua alianza con el pueblo judío, ofreciendo en su ayuda sus propias tierras y sus propias armas. Jonatán, que era sumo sacerdote, le dio esta hermosa respuesta: \"No tenemos necesidad de esas cosas, porque encontramos el consuelo en los Libros santos que están en nuestras manos\" (1 Mac 12,9). Para consolarlos en medio de tantas tribulaciones bastaba la Sagrada Escritura. Lo mismo repetía san Pablo a los Romanos: \"Ahora bien, todo lo que ha sido escrito en el pasado, lo ha sido para nuestra instrucción, a fin de que, por la constancia y el consuelo que dan las Escrituras, mantengamos la esperanza\" (Rom 15,4). Con esto quería decir que la lectura de la Sagrada Escritura fortifica nuestra esperanza y nos consuela en las tribulaciones de la vida.", "s": 13}, {"k": "p", "t": "Los santos consideran a la Sagrada Escritura depósito de todo sostén. Los primeros Padres de la Iglesia, Jerónimo, Agustín, Ambrosio, etc. no tenían libros de teología. La Sagrada Escritura era su libro. San Jerónimo llega a afirmar que nuestra vida vale muy poco si ignoramos a la Sagrada Escritura. \"En ella —dice san Gregorio Magno— debemos reconocer el corazón de Dios\". Y san Agustín: \"No hay enfermedad del alma que no encuentre remedio en la Sagrada Escritura\". San Carlos Borromeo, interrogado sobre el motivo por el que no iba nunca a pasear al jardín, respondió que su jardín era la Sagrada Escritura. Los Santos encontraban en ella una fuente de consolación y de vida. La Palabra de Dios penetra como una espada en el alma y se ocupa de todas nuestras necesidades. 172. Palabra de Dios útil, viva y cálida. Muy excelente en sí misma, la Sagrada Escritura es de suma utilidad para nosotros y para nuestro ministerio. Lo expresa muy bien san Pablo a Timoteo: \"Toda la Escritura está inspirada por Dios, y es útil para enseñar y para argüir, para corregir y para educar en la justicia, a fin de que el hombre de Dios sea perfecto y esté preparado para hacer siempre el bien\" (2 Tim 3,16). ¡Vean qué importante es la Sagrada Escritura para nosotros y para los demás! Allí está todo; es Palabra de Dios, palabra viva y cálida. San Jerónimo escribía: \"Que la Sagrada Biblia no caiga nunca de nuestras manos, que el sueño nos sorprenda siempre con el libro entre las manos\".", "s": 13}, {"k": "p", "t": "Leer la Sagrada Escritura enciende en nuestros corazones el amor a Dios. Señor, tus palabras son fuego y, si son fuego, calientan. Miren los discípulos de Emaús: han acompañado al Señor sin reconocerlo. Luego, cuando se dieron cuenta de que era él, exclamaron: \"¿No ardía acaso nuestro corazón mientras nos hablaba en el camino y nos explicaba las Escrituras?\" (Lc 24,32). ¡Las palabras de nuestro Señor son fuego!", "s": 13}, {"k": "p", "t": "Benedicto XV, en ocasión del 15º centenario de la muerte de san Jerónimo, en 1920, escribió la Encíclica Spiritus Paraclitus en la que, entre otras cosas, confirma que toda la Sagrada", "s": 13}, {"k": "p", "t": "Escritura debe considerarse inspirada por Dios, y recomienda su estudio para la piedad y la predicación. Unos años antes, también el Papa León XIII había promulgado la Encíclica Providentissimus Deus para animar al estudio de la Sagrada Escritura, definiendo su inspiración divina. Recordemos, entonces, que toda la Escritura es \"Palabra de Dios\" y, por lo tanto, apreciémosla y estudiémosla como tal. Nuestra biblioteca es una de las más ricas en Sagrada Escritura. Tambien en las misiones tendrán una pequeña biblioteca. 173. Leer y examinar las Escrituras. ¿Cómo acercarnos a las Escrituras? ¿Cómo usarlas? Ante todo, leerlas y, después, examinarlas atentamente: \"Ustedes examinan las Escrituras [...]; ellas dan testimonio de mí\" (Jn 5,39). Por lo tanto, no las lean sólo superficialmente; tomen, por ejemplo, pocos versículos y deténganse sobre ellos. San Agustín afirma que las palabras de Dios tienen una profundidad maravillosa. Son como un pozo profundo, que exige esfuerzo para sacar el agua, pero ese esfuerzo es dulce y consolador. Se equivocan los que creen que basta tener en la mano las Sagradas Escrituras para entenderlo todo. Dios se revela sólo a los simples, mientras se esconde a los soberbios. Hay que estudiar la Sagrada Escritura con humildad, sencillez y según las enseñanzas de la Iglesia. La Imitación dice: \"Quien quiere comprender bien y gustar las palabras de nuestro Señor Jesucristo debe esforzarse en asimilar su propia vida a la vida de Él\". Se podrán y deberán usar los criterios de interpretación, pero tomados de fuentes sanas.", "s": 13}, {"k": "p", "t": "Otras disposiciones para leer bien la Sagrada Escritura son la pureza de vida y, después, la oración: rezar mientras se lee, pidiendo al Señor que nos ilumine. Además, gran respeto, como san Carlos Borromeo, que la leía con la cabeza descubierta y de rodillas. Por último, leerla con ese espíritu con el que fue escrita. Si tenemos estas disposiciones, la Sagrada Escritura nos hará bien. 174. Nuestro libro. La Sagrada Escritura perfecciona a aquellos que la estudian y los prepara para cumplir cualquier obra buena; concede todas las gracias, todas las virtudes, todos los medios para santificarse. Es un verdadero tesoro, un depósito de medicinas en el que podemos encontrar todo aquello que necesitamos. En él se encuentra el remedio para todo; se encuentra todo lo que puede ser útil para nosotros y los demás. ¿Ven?, cuando uno tiene algún problema o está preocupado por el futuro, que lea un texto de la Sagrada Escritura y encontrará el consuelo.", "s": 13}, {"k": "p", "t": "Les digo todo esto para que sigan leyendo atentamente la Sagrada Escritura, para que aprendan a amarla. Es nuestro libro. Quien lee la Biblia se llena de buen espíritu. No sólo conocer el libro inspirado, sino también gustarlo, convertirlo en un alimento vital. San Agustín decía que si se trataba de interpretar a la Sagrada Escritura para nuestro bien espiritual, que nos sintiéramos libres, ya que todas las aplicaciones están bien. Sucede como para las inspiraciones; no es necesario que provengan de lo que se ha leído; con tal de que nos hagan bien, podemos seguirlas.", "s": 13}, {"k": "p", "t": "¡Ah, la Escritura! ¡Más la leemos, más se estudia y más uno la ama y la disfruta! En el Instituto la Sagrada Escritura siempre tuvo el primer lugar, y siempre será así. Este es el primer estudio, el más importante que forma parte de todos los cursos teológicos, y que se debe seguir estudiando. En las misiones deberá ser su lectura cotidiana y su consuelo. En los momentos difíciles estudien la Sagrada Escritura. Habría que estudiarla toda y meditarla. Esta es una escuela que no termina más. Amémosla mucho, especialmente los Evangelios y las Cartas de san Pablo. ¡Quiero que amen la Sagrada Escritura!", "s": 13}, {"k": "h3", "t": "Oración", "s": 13}, {"k": "p", "t": "175. Recen siempre sin desanimarse. Hay que vivir de la vida interior. Que cada una de nuestras acciones, espiritual o material, empiece en Dios y termine también en Él. Este es el espíritu que debe acompañarnos cada día y todos los días; sólo así nuestra vida será toda del Señor. Ciertamente la primera, la más excelente y potente oración es la Santa Misa. Hacia ella, como hacia un centro, confluyen todas las otras oraciones. Santo Tomás dice que la oración eleva la mente, el corazón, toda el alma a la presencia de Dios. ¿Es necesario rezar? El Señor recomienda la oración: hay que \"orar siempre, sin desanimarse\" (Lc 18,1); \"Estén prevenidos y oren\" (Mt 26,41). San Pablo exhorta: \"Oren sin cesar\" (1 Tes 5,17). Además, el Señor nos da el ejemplo: \"En esos días, Jesús se retiró a una montaña a orar, y pasó toda la noche en oración con Dios\" (Lc 6,12); \"En medio de la angustia, él oraba más intensamente\" (Lc 22,44). Así hicieron los apóstoles: \"De esa manera, podremos dedicarnos a la oración\" (Hch 6,4).", "s": 13}, {"k": "p", "t": "Rezar es necesario para vivir bien. San Agustín afirma que quien aprende a rezar bien, aprende a vivir bien. De san Martín de Tours se dice que su vida era una oración permanente: tenía los ojos y las manos siempre elevados al cielo. Quien reza, responde a la vocación y es fiel a la misma. La perseverancia en la vocación es una gran gracia de Dios, que no se obtiene sino rezando mucho y bien. Por experiencia, puedo afirmar que todos los que rezan conservan la vocación. En tiempos de mons. Gastaldi algunos se lamentaban de que hiciera rezar demasiado a los seminaristas, considerando que, tal vez, fuera mejor dedicar más tiempo al estudio. Pero él no se rindió. Luego nos decía: \"Me dicen, queridos seminaristas, que los hago rezar demasiado. ¡No, no, (y aquí se encendía en el gesto y en la voz) los hago rezar demasiado poco!\" Lo mismo les digo yo a ustedes: nunca se reza lo suficiente.", "s": 13}, {"k": "p", "t": "San Agustín recomendó a sus hijos la piedad, es decir el espíritu de oración. Parecería más adecuado que un doctor de la Iglesia, el más excelente filósofo y teólogo que haya existido, recomendara a los discípulos el estudio para adquirir mucha ciencia. En cambio no, les recomendó la piedad. Los santos saben apreciar la devoción y la prefieren a todo, sabiendo bien que \"la piedad es útil en todas las cosas\". Si hay piedad, hay unión con Dios y todo lo demás viene por añadidura, porque el Señor nos da las gracias que necesitamos, cuando rezamos bien. Antes de morir dijo estas palabras: caridad y piedad. Y saben que esas palabras dichas en ese momento son sagradas, son el testamento. 176. Cuanto más trabajo tengan, más deberán rezar. La oración es especialmente necesaria para los sacerdotes, los misioneros y las misioneras. San José Cafasso decía que el sacerdote debe ser un hombre de oración; que la oración (usaba un término un poco material, pero expresivo) es su oficio. Si un sacerdote no reza demasiado, no es un verdadero sacerdote. ¿Qué decir del misionero o de la misionera? ¿Qué pueden hacer quienes no conocen ni siquiera el medio que los ayuda a estar unidos a Dios? ¿Cómo podemos hacer el bien si no estamos unidos a él? Se hace más en un cuarto de hora después de haber rezado, que en dos horas sin oración. Nuestras palabras no valen nada sin la gracia de Dios. Nuestro primer deber — ¡recuérdenlo siempre!— no es matarse trabajando, sino rezar.", "s": 13}, {"k": "p", "t": "Además, san José Cafasso decía: \"¡Me dan pena los sacerdotes que tienen demasiado trabajo!\". La afirmación \"quien trabaja, reza\", tomada así a la ligera, no es correcta. Quien trabaja por obediencia y necesidad, refiriendo el trabajo a Dios, reza. Pero eso no quita que deba rezar de verdad, aun quitándole un poco de tiempo a las obras de apostolado. Recuerden la expresión de san Bernardo: debemos ser no sólo canales, sino caracoles. Los canales dejan pasar toda el agua, sin retener nada para sí; los caracoles, en cambio, primero se llenan ellos y luego dejan pasar lo que sobra a los demás.", "s": 13}, {"k": "p", "t": "Oigan a san Pablo: \"Yo planté y Apolo regó, pero el que ha hecho crecer es Dios. Ni el que planta ni el que riega valen algo, sino Dios, que hace crecer\" (1 Cor 3,6-7). No somos nosotros los que hacemos, es nuestro Señor; si él no bendice, todo es inútil. Da pena sentir decir: \"¡No puedo rezar porque tengo que predicar tanto!\". Sí, tú predicas, ¡pero estás gritándole al viento! Pregúntenle a san José cafasso si omitió alguna vez el breviario, el rosario, la meditación ¡sólo porque tenía mucho que hacer! Si no tenía tiempo de día, rezaba de noche. ¡Entonces sí que podía componer aquellas bellas prédicas y esas apasionadas oraciones a Jesús Sacramentado!", "s": 13}, {"k": "p", "t": "En fin: ¡es tan fácil confundir las cosas! Ante todo, tenemos que hacernos santos nosotros, primero rezar, después hacer el bien a los demás. ¡Amemos la oración! ¡Sí, rezar, rezar bien! No creer que el tiempo dedicado a la oración es tiempo perdido. Alguien dice: \"¡en estos tiempos se necesita acción, acción!\". Sí, sí, trabajar; pero hay más necesidad de la oración que de otras cosas. Necesitamos del espíritu de Dios. Lo mismo en las misiones: No crean que se va sólo a trabajar. Cuanto más trabajo tengan, más deberán rezar. Algunos, con la excusa de hacer el bien a los demás, no rezan más, ni para sí ni para los demás; aun más, se vuelven inútiles para sí y para los demás. Les digo todo esto, porque quiero que se conviertan en hombres y mujeres de oración, ¡desde la mañana hasta la noche! 177. El Señor no da piedras a cambio de panes. Recemos con la confianza de obtener lo que pedimos. Dios es omnipotente e infinitamente bueno; desea y puede darnos las gracias que necesitamos; sólo debemos pedírselas. El que sabe rezar bien, le ata las manos a Dios y lo obliga a concederle lo que pide. Ciertas personas rezan temiendo no obtener lo que piden: \"¿Quién sabe si el Señor me concederá esta gracia?\". Al Señor no le gusta esta fe débil. Hay que tener confianza y decir: \"¡La quiero!\". Tenemos que arrancarle las gracias al Señor con nuestra fe. Se necesita mucha confianza para poder ser un poco audaces, un poco \"prepotentes\", para pedir milagros. El Señor no se ofende por eso.", "s": 13}, {"k": "p", "t": "Recemos con humildad. Si nos acercamos al Señor como el fariseo y le decimos: \"Mira lo que he dejado por ti, los sacrificios que he hecho, etc.\", regresaremos con las manos vacías. La actitud que debemos tener al rezar debe ser la humildad: \"Padre, no merezco nada, pero contando con los méritos de tu Hijo, te ruego me concedas la gracia que necesito\". Los pedidos de gracias tienen que pasar primero por el arroyo que es María Santísima, después por el río que es nuestro Señor y llegar al mar que es el Padre.", "s": 13}, {"k": "p", "t": "Recemos con perseverancia, sin desanimarnos si Dios no responde enseguida a nuestras oraciones. Golpeemos a su puerta: si no nos abre, golpeemos más fuerte; si eso no basta, ¡rompamos la puerta! El Señor mismo nos enseña a proceder de este modo en la parábola del hombre que fue a molestar al amigo durante la noche, hasta que obtuvo el pan que deseaba (cf. Lc 11,5-9).", "s": 13}, {"k": "p", "t": "Generalmente, cuando para obtener alguna gracia se hace una novena a los santos, no se la recibe enseguida; pareciera que los santos no escuchen por ser la primera. Se hace una segunda novena, y el santo comienza a escuchar; se hace una tercera, y el santo se abre a nuestro pedido y nos obtiene la gracia. Pero si no recibimos la gracia solicitada, pensemos que ni siquiera un hilo, ni una palabra de nuestras oraciones han caído en el vacío. La oración no es tiempo perdido; la necesitamos para hacer el bien. 178. Rezar la liturgia de las horas. La liturgia de las horas es definida por san Benito: \"obra de Dios\", y por san Buenaventura: \"imitación del concierto celestial\". Así como en el cielo los ángeles y los beatos elevan a Dios una alabanza incesante, del mismo modo la Iglesia eleva a Dios, a través de la liturgia de las horas, una alabanza perenne. Este pensamiento está bastante bien expresado en el himno litúrgico para la fiesta de la Dedicación de las Iglesias: \"En la celestial demora - siempre resuena la alabanza - y con canto incesante - viene exaltado Dios Uno y Trino. - Nosotros en la alabanza a ellos nos unimos - imitando el alma de Sión\".", "s": 13}, {"k": "p", "t": "Al rezar la liturgia de las horas nos identificamos con los sentimientos expresados en ella. Por ejemplo, rezando los salmos, recordemos lo que dice san Agustín: \"Si el salmo gime, giman; si reza, recen; si goza, gocen; si espera, esperen, si teme, teman\". ¡Observen qué hermosas son las palabras de la Iglesia! Es más, estas son palabras del Espíritu Santo. Habría que disponer de días enteros para poder gustarlas adecuadamente. Recuerdo que cuando era seminarista me había propuesto leer todos los salmos durante las vacaciones. No puedo decir que lo haya llevado a cabo integralmente, pero me lo había propuesto; y así me di cuenta que siempre hay algo que aprender. Cuando uno se acerca a la ordenación, debería leer todos los salmos para comprenderlos bien.", "s": 13}, {"k": "p", "t": "Observemos las indicaciones de la Iglesia con respecto al tiempo para la oración de la liturgia de las horas. Tener mucho trabajo no nos debe llevar a postergarla. Rezada con tiempo, es un dulce peso. Con respecto al lugar, si es posible, récenla en el templo, que es la casa destinada a la oración. La liturgia de las horas es la oración más excelente, después de la misa. ¡Que alabar a Dios sea una de nuestras principales ocupaciones, como lo será por toda la eternidad! 179. Meditar para apasionarse. Debemos despertar en noso-tros un ardoroso amor de Dios, sobretodo con la oración bien hecha y la meditación cotidiana, que es el fuego con el que se enciende el alma. Quiero que todos se convenzan de lo importante que es la meditación o la oración mental, que aprendan a hacerla bien y a tomarle gusto. Ella es necesaria para que adquieran el espíritu de piedad, crezcan en el amor de Dios y eviten el pecado. San Alfonso dejó escrito que todos los santos se santificaron con la oración mental y que, por lo tanto, ella es el camino más breve para alcanzar la santidad. Además, es necesaria para hacer el bien a los demás, como está escrito: \"Feliz el hombre [...] que se complace en la ley del Señor y la medita de día y de noche. Él es como un árbol plantado al borde de las aguas, que produce fruto a su debido tiempo, y cuyas hojas nunca se marchitan: todo lo que haga le saldrá bien\" (Sal 1,2-3).", "s": 13}, {"k": "p", "t": "Distingamos la meditación en sentido amplio y en sentido formal. La primera puede ser hecha por cualquier persona durante todo el día. \"¡Cuánto amo tu ley, todo el día la medito!\" (Sal 119,97). También las personas simples pueden meditar cuando, por ejemplo, yendo al campo, empiezan a decir: \"¡Señor, te agradezco por el buen tiempo que nos mandas!\".", "s": 13}, {"k": "p", "t": "Luego, en el trabajo: \"¡Señor, es por ti que hago esto!\"; también dirigiendo de vez en cuando el pensamiento a Dios. Es esta la meditación de la que hablan los santos, y de la que recomiendan su necesidad. Un día vino a verme un campesino cuya hija había decidido hacerse religiosa. Le dije que iba a rezar para que el Señor lo ayudara a enfrentar ese sacrificio. Él me respondió: \"Sí, rece, porque necesito de oraciones; yo no rezo porque siempre estoy distraído\". Pero en pocos minutos me habló espontáneamente de tantas cosas profundas en relación a la fe y a los sentimientos que me demostró que ante cualquier cosa sabía elevar el pensamiento a Dios. Esta no es la meditación formal, pero es verdadera meditación, así como lo es también el rezar despacio, reflexionando sobre las palabras. De esta manera, se puede meditar en cada acción que se realiza, y de todo puede obtenerse un pensamiento que nos ponga en presencia de Dios.", "s": 13}, {"k": "p", "t": "Para los cristianos, la meditación en este sentido amplio basta. Pero nosotros nos comprometemos también a hacer meditación formal, la cual consiste prácticamente en leer un texto y reflexionarlo, con el fin de poner en movimiento la voluntad hacia afectos y decisiones concretas. Se toma el texto que nos ha impactado más y se medita haciendo actos de amor, de agradecimiento y de alabanza. La meditación es un trabajo de la mente, pero para dar calor al corazón. Repito: no basta simplemente con razonar, también son necesarios los afectos y los propósitos. Doy por descontado que uno no debe empezar a meditar si está distraido. Ante todo, tenemos que ponernos en la presencia de Dios. Por lo tanto, se lee ese texto que nos ha impactado más; pero, luego, no es necesario meditar sobre cada palabra; es mejor detenerse en un solo punto, si el corazón ha encontrado allí su alimento; después se rumia como hace el buey después de haber comido. Se termina la meditación pidiéndole al Señor que nos ayude a mantener nuestros propósitos, que deben ser pocos y prácticos.", "s": 13}, {"k": "p", "t": "Esta mañana, por ejemplo, medité sobre la parábola del buen grano y la cizaña. Pensé: mi corazón es como un campo; ¿en él ha sido sembrado buen grano? Debería ser así, pero, lamentablemente, la cizaña tampoco falta. Cizaña puede ser esa maldad, esa imperfección; es cizaña tardar en el cumplimiento de un acto de obediencia. ¡Señor, cuánta cizaña! Concédeme la gracia de destruirla enseguida, no quiero demorarme en extirparla. Y luego: ¿mi siembra ha perdido fuerza? ¡Si pudiera ser bella y próspera! Por eso, en este día quiero que todo lo que haga sea grano puro; por lo tanto, evitaré tal o cual circunstancia, etc. Comprometámonos seriamente en hacer bien la meditación y a no dejarla nunca; cuando le hayamos encontrado el gusto, siempre encontraremos el tiempo para hacerla. Por lo tanto, recuerden siempre las palabras de san Alfonso: debemos considerar como perdido el día en que no hayamos hecho la meditación. 180. Puntos de referencia a lo largo del día. La oración mental no basta, también es importante la oración vocal, para manifestar externamente a Dios los afectos internos. Cuando uno está lleno del amor de Dios, cuando siente tanto fervor, le es espontáneo manifestar sus propios sentimientos: esto se logra con la oración vocal. Las oraciones vocales son necesarias, así como es necesario el culto externo, que es su sostén y casi la consecuencia natural del culto interno. Cuando en el Evangelio Jesús nos dice: \"Recen\", no se refiere sólo a la oración mental, sino también a la oración vocal.", "s": 13}, {"k": "p", "t": "¿Cómo hay que rezar vocalmente? Ante todo, no es suficiente rezar sólo con los labios. El Señor, por medio de Isaías, regañaba al pueblo judío de esta manera: \"Este pueblo se acerca a mí con la boca y me honra con los labios, pero su corazón está lejos de mí\" (Is 29,13). No alcanza con repetir tantos \"Padrenuestros\". La oración supone la atención de la mente y el afecto del corazón. Prestar atención a lo que se dice, entender y seguir su significado, hablarle a Dios de corazón a corazón.", "s": 13}, {"k": "p", "t": "La oración vocal puede ser comunitaria o individual. Es verdad que la oración comunitaria tiene mucha fuerza y que el Señor la escucha con gusto, como Él mismo lo prometió en el Evangelio. Por lo tanto, en la oración común comprometámonos a unir nuestra voz a la de los demás. La Iglesia quiere que recemos, entonces recemos; y no sólo individualmente, sino como comunidad, Los que están en las misiones también se unen a nosotros en esta oración, de modo tal que es el cuerpo del Instituto el que reza en unión con la Iglesia. Las oraciones comunitarias deben referirse a las individuales, las cuales es mejor que sean pocas y bien dichas.", "s": 13}, {"k": "p", "t": "En nuestro Instituto están prescriptas diferentes oraciones vocales comunitarias. Por eso les pregunto: ¿para qué están distribuidas a lo largo del día? Para que nos ayuden a santificarlo manteniendo vivo en nosotros el amor a Dios durante las diferentes acciones. San Pablo nos exhorta: \"Todo lo que puedan decir o realizar, háganlo siempre en nombre del Señor Jesús, dando gracias por él a Dios Padre\" (Col 3,17). Las oraciones vocales son los puntos de referencia esparcidos a lo largo de la jornada para hacernos entrar en nosotros mismos y mantenernos unidos a Dios. Hagamos el propósito de rezar bien las oraciones vocales, con piedad interna y externa, y sin tanto apuro. Nunca hay motivos para rezar apurados. La oración vocal, si es bien dicha y despacio, también es oración mental.", "s": 13}, {"k": "p", "t": "181. Espíritu de oración. Como sabemos, Jesús dice que debemos rezar siempre (cf. Lc 18,1); esto significa ser como revestidos del espíritu de oración, tal como la ropa nos reviste el cuerpo. Nosotros rezamos por la mañana, por la noche y varias veces a lo largo del día; pero estos son actos de oración, no hábitos que forman el espíritu de oración.", "s": 13}, {"k": "p", "t": "¿Por qué después de tantos días, meses, años realizando esos actos de piedad, estamos aún tan lejos de la perfección? Y esto no lo decimos sólo por humildad, sino partiendo de la realidad. La respuesta no puede ser sino esta: o no los hacemos bien, o no tratamos de sacar provecho de los mismos. En un campo, en una vid, no basta con sembrar o plantar bien una buena semilla, sino que, después, también hay que cuidar lo sembrado hasta el final de la cosecha. Debemos salir de todos los ejercicios de piedad como si saliéramos de un jardín donde hemos recogido un ramo de flores, para poder sentir su perfume a lo largo del día.", "s": 13}, {"k": "p", "t": "Además, es necesario vivir recogidos, evitando las disipaciones y permaneciendo ante la presencia de Dios. La disipación es como el viento que arrastra todas las cosas. Evidentemente, se necesita tiempo y esfuerzo para formarnos en el recogimiento; pero lo necesitamos. Luego, en las misiones, será aún más difícil, a causa de sus ocupaciones. El recogimiento es absolutamente necesario para poder sacar provecho de lo que se hace; de lo contrario, nos quedan esas especies de oasis que son las prácticas espirituales, pero fuera de ellas, todo es árido. Cuando, después, no podemos tener la mente fija en Dios, basta referir nuestras acciones a él y todo se convierte en oración. En esto consiste el espíritu de oración, que ayuda mucho a la vida interior.", "s": 13}, {"k": "p", "t": "Un misionero y una misionera deben ser capaces de mantener el recogimiento en cualquier lugar; saber pasar del estudio o del trabajo a la oración; permanecer unidos a Dios con una elevación permanente del corazón, o al menos frecuente; en fin, trabajar con mucho empeño y, al mismo tiempo, rezar. Si no tienen este espíritu, no serán nunca buenos misioneros y misioneras. Podrán creer que lo son, pero en realidad, no lo son. ¡Felices ustedes si tratarán siempre de avanzar en la vida interior, con el espíritu de recogimiento y oración! 182. En presencia de Dios. Lo ideal es que lleguemos a vivir continuamente en presencia de Dios, que es uno de los medios más eficaces de santificación. Ya el Señor había dicho a Abrahán: \"Yo soy el Dios Todopoderoso. Camina en mi presencia y sé irreprochable\" (Gén 17,1). Muchos de los patriarcas son alabados justamente por haber caminado en presencia de Dios, como Henoc, que siguió los caminos de Dios\" (Gén 5,22); o Noé, hombre justo e íntegro entre sus contemporáneos que \"siguió siempre los caminos de Dios\" (Gén 6,9). ¡Qué elogio! ¡Siempre caminaban ante la presencia de Dios! Por lo tanto, cuando se camina en presencia de Dios, se hacen las cosas bien, con perfección.", "s": 13}, {"k": "p", "t": "Es realmente necesario que vivamos, que respiremos, que nos perdamos en Dios. \"Mis ojos están siempre fijos en el Señor\" (Sal 24,15). Me gusta mucho esta frase y tienen que recordarla. Dirijamos siempre los ojos hacia el Señor, así como los ojos de Dios están contínuamente dirigidos hacia nosotros. ¡Dios me ve! Los ángeles y los beatos gozan en el paraíso, porque \"están constantemente en presencia de mi Padre celestial\" (Mt 18,11). Nosotros, aún sin verlo con los ojos del cuerpo, si estamos acostumbrados a estar en su presencia, gozamos del paraíso en la tierra. ¡El Señor es todo el paraíso!", "s": 13}, {"k": "p", "t": "Un modo de vivir en presencia de Dios es reflexionando sobre su inmensidad: \"En él vivimos, nos movemos y existimos\" (Hech 17,28). No podemos dar ni siquiera un paso si no es en Dios. San Ambrosio afirma que \"Dios está afuera, Dios está adentro, Dios está en todas partes\". Otra forma es considerar que el Señor Jesús está presente en nuestros templos. Él está en el Santísimo Sacramento con su presencia real, así como real es nuestra presencia ante él, porque la distancia no cuenta para él. Por lo tanto, hagamos que la presencia de Jesús Sacramentado sea habitual y familiar. Él me mira y yo lo miro, y nuestras miradas se encuentran en el amor. Otro modo más para vivir en presencia de Dios consiste en considerar su inhabitación en nosotros: \"El que me ama será fiel a mi palabra, y mi Padre lo amará; iremos a él y habitaremos en él\" (Jn 14,23). San Pablo dice: \"¿No saben que son templo de Dios y que el Espíritu de Dios habita en ustedes?\" (1Cor 3,16). ¡Qué pensamiento profundo y consolador! ¡Nosotros somos verdaderamente el templo de Dios!", "s": 13}, {"k": "p", "t": "José Cafasso hizo imprimir muchos cartelitos, que después pegó por todas partes, con la frase: \"¡Dios me ve!\". Ya había hecho lo mismo Cottolengo en la Pequeña Casa de la Divina Providencia. Repitamos seguido: \"¡Dios me ve!\". Nunca olviden que están en presencia de Dios. Eso no dificulta para nada el ejercicio de nuestros compromisos. Uno puede dedicarse totalmente al propio deber y a Dios. Recuerden que, para vivificar las acciones cotidianas es necesario aferrarse a estos medios. Son cosas que nos impactan, cosas que causan placer. ¡Prueben y verán si no es un paraíso!", "s": 13}, {"k": "h2", "t": "11. Caminar en el Espíritu", "s": 14}, {"k": "h3", "t": "Examen de conciencia", "s": 14}, {"k": "p", "t": "183. Conscientes de lo que somos. Todos los santos y maestros del espíritu han alabado el examen de conciencia, definiéndolo como uno de los medios más eficaces para superar los defectos y obtener frutos de conversión y de santificación. Ese gran maestro espiritual que fue san Ignacio, en cierto mo-do lo estimaba más que la oración vocal y la misma meditación, diciendo que el Señor en la meditación nos hace ver lo que debemos hacer, pero es el examen de conciencia el que nos permite saber si lo hacemos. A sus primeros discípulos, entre los medios de santificación, después de los sacramentos, aconsejaba el examen de conciencia. Dubois, excelente director espiritual, dice: \"Cada sacerdote —y yo agrego: cada misionero y cada misionera— que hace bien su examen de conciencia cada día, seguramente será santo. El que, en cambio, lo descuida, cometerá siempre las mismas faltas, y nunca las corregirá\".", "s": 14}, {"k": "p", "t": "Con respecto al modo de hacer el examen de conciencia, les propongo el de san Ignacio: poniéndose en presencia de Dios, renovar la fe y agradecer por los bienes recibidos; pedir luz para conocernos a nosotros mismos hasta el fondo del corazón, hasta la raíz: que nos haga conocer no sólo nuestros pecados y defectos, sino también sus causas; examinarnos sobre nuestros pensamientos, palabras, obras y omisiones; encender en nosotros el dolor por las faltas cometidas; hacer propósitos prácticos.", "s": 14}, {"k": "p", "t": "Si después de haber prometido no caer, caemos de nuevo, no debemos desanimarnos, sino recomenzar una y otra vez. El Señor bendice nuestros esfuerzos. Amen el examen de conciencia, no sólo ahora, sino durante toda la vida, incluso en las misiones. Pongan en práctica estas cosas y también ustedes darán grandes pasos en el camino de la santidad.", "s": 14}, {"k": "h3", "t": "Lecturas espirituales", "s": 14}, {"k": "p", "t": "184. Un rocío fecundo para nuestra vida. Cuando hablamos de lecturas espirituales nos referimos a las lecturas que se hacen sobre un libro de ascética u otros parecidos, con el fin de formarnos al espíritu sacerdotal, religioso y misionero. San Jerónimo aconseja a Nepociano: \"No descuides el ejercicio de la lectura cotidiana\". San Francisco de Sales agrega que las lecturas espirituales son el aceite de la lámpara de la oración.", "s": 14}, {"k": "p", "t": "Las lecturas espirituales pueden favorecer la conversión de las personas. San Ignacio, por ejemplo, fue convertido por una lectura espiritual. Lo mismo le sucedió a san Agustín. Las oraciones y las lágrimas de su madre aún no habían logrado alejarlo de la vida mundana y de los errores; tampoco las conferencias de san Ambrosio lograban convencerlo. Él mismo afirma que las pasiones dominaban su corazón. Así pasó años dudando, hasta que un día tuvo ante sus ojos aquella frase de san Pablo: \"Como en pleno día, procedamos dignamente: basta de excesos en la comida y en la bebida, basta de lujuria y libertinaje, no más peleas ni envidias. Por el contrario, revístanse del Señor Jesucristo, y no se preocupen por satisfacer los deseos de la carne\" (Rom 13,13-14). Esto bastó para que cambiara de vida. Ante esa simple lectura, todas sus dudas se disiparon.", "s": 14}, {"k": "p", "t": "San Jerónimo explica que, en la oración, somos nosotros los que le hablamos a Dios, en la lectura espiritual, en cambio, es Dios quien nos habla a nosotros. Ante cualquier lectura se puede decir: \"¡Habla, porque tu servidor escucha!\" (1Sam 3,10). Tratemos de que lo que leemos penetre en nuestros corazones. No conformémonos con leer para aprender, sino para alimentar el espíritu. Cualquier lectura debe ser recibida con un buen espíritu y con sencillez; ¡entonces sí que es como un rocío fecundo para nuestra vida! Aprendamos a sacar provecho de todo. Somos como un guardarropa, donde se amontonan telas sobre tela. De esta manera, en las misiones nos daremos cuenta de que tendremos un depósito lleno de tantas cosas buenas y útiles. Es necesario que, después de cada lectura espiritual, uno se quede con algún buen sentimiento, alguna reflexión, para gustarla más tarde.", "s": 14}, {"k": "p", "t": "La Imitación de Cristo es un libro que me ha acompañado durante toda la vida. He regalado tantas copias, pero la mía la he conservado conmigo y me ha servido. En el seminario había hecho un compendio de la misma; cada mañana leía algún punto, que luego rumiaba a lo largo del día. Es imposible leer la Imitación sin sentirse tocado por sus palabras. Contiene expresiones que reconfortan el corazón, como por ejemplo: \"¡Hijo, que de ninguna manera te derriben las fatigas que has emprendido por mí!\"; \"Que todo nuestro empeño sea meditar la vida de nuestro Señor Jesucristo\".", "s": 14}, {"k": "h3", "t": "Sacramento de la Reconciliación", "s": 14}, {"k": "p", "t": "185. Amor a la Confesión. San Juan afirma que \"la sangre de su Hijo Jesús nos purifica de todo pecado\" (1Jn 1,7); por lo tanto, también de nuestros pecados cotidianos, \"porque todos faltamos de muchas maneras\" (Sant 3,2). Agradezcamos al Señor que nos ha dado este gran beneficio de la Confesión y sepamos servirnos de la misma para nuestra santificación. Este sacramento nos confirma en el bien y en la pureza de consciencia. El padre Bruno dice que la Reconciliación es el gran medio para adquirir una pureza de vida cada vez mayor. También san Agustín afirma: \"Si quieres salud, belleza y santidad, ama la Confesión\". San Juan Bosco afirma que en ninguna otra práctica se ejercen tantas virtudes como en este sacramento: la fe, la esperanza, la caridad, la humildad, etc. El que se confiesa con frecuencia está más preparado para recibir la gracia del Señor. 186. Con espíritu de fe. Confesarse bien. Esto es importante. La primera condición para confesarse bien es la de acercarse con espíritu de fe, ver a Jesús en cualquier confesor. Hay que reavivar la fe, pensando que nos confesamos con nuestro Señor y que él nos dice: \"Yo te absuelvo\".", "s": 14}, {"k": "p", "t": "La segunda condición es hacer bien el examen de consciencia. Sin dejarse llevar por los escrúpulos, ni confesando las virtudes o los pecados de los demás, sino los pecados verdaderos, advertidos, voluntarios, incluso los pequeños. Que nuestro examen sea sobre todas nuestras acciones, palabras, pensamientos, y no sólo sobre las dos o tres cosas de siempre. 187. Ir a las raíces. Examinémonos, además, sobre la causa de los pecados que confesamos. Por ejemplo: he faltado a la caridad. Está bien, pero vayamos más allá. ¿Por qué lo hiciste? Porque tienes un poco de envidia de esa persona. Por lo tanto, no confesemos sólo los actos externos contra la caridad, sino también la causa interna que es la envidia: falté a la caridad por envidia. Se trata de buscar las raíces de nuestros pecados.", "s": 14}, {"k": "p", "t": "¿Cómo es posible que, después de tantas confesiones, de tantos propósitos, estamos siempre en el mismo punto, cometemos las mismas caídas, seguimos con los mismos defectos? Porque nunca fuimos a la raíz de los mismos; nos conformamos con examinarnos superficialmente, sin penetrar hasta el fondo de nuestra alma y así descubrir el porqué de esas permanentes faltas contra la caridad, de esos actos de orgullo. ¡Abajo, abajo ese muro que no nos deja ver bien las raíces más profundas de nuestras pasiones! Por lo tanto, exámenes límpidos y confesiones sinceras.", "s": 14}, {"k": "p", "t": "Además debemos sentir dolor por haber pecado. Es aquí donde más fácilmente fallamos. Como normalmente nos confesamos por pequeñeces, vamos a confesarnos sin dolor. No es necesario sentirlo, sino desear tenerlo. Sin embargo, no debemos volver siempre sobre las culpas cometidas. Cuando un pecado es perdonado, no piensen más en él, para que el Señor no tenga que decirnos: ¿hasta cuándo seguirás sufriendo? (cf. Sal 4,3). Estemos atentos y apreciemos oportunamente este sacramento. Es una santa práctica y no debemos sentirlo como un peso.", "s": 14}, {"k": "h3", "t": "Retiros espirituales", "s": 14}, {"k": "p", "t": "188. Ejercicios espirituales. Nuestro Señor solía retirarse a un lugar apartado para rezar y pedía a los apóstoles que lo acompañaran: \"Vengan ustedes solos a un lugar desierto, para descansar un poco\" (Mc 6,31). La misma propuesta les hace a ustedes para que dejen todas las demás ocupaciones y se retiren en soledad para los ejercicios espirituales. Los ejercicios son una gracia muy grande, son realmente días muy fecundos. Son días de paz en los que debemos ser agradecidos al Señor.", "s": 14}, {"k": "p", "t": "Preparémonos con la oración, pidiendo con frecuencia que el Espíritu Santo venga en nuestra ayuda, para que no recibamos en vano la gracia de Dios. Para hacer bien los ejercicios es necesaria una preparación remota. Dispongan el espíritu, la mente y el corazón, antes de entrar en la gran oración de los ejercicios espirituales, para aprovechar las gracias que el Señor tiene preparadas para ustedes. Además prepárense con generosidad diciendo: \"Quiero que estos ejercicios sean los mejores de toda mi vida\". Por lo tanto, predispónganse desde ahora a no poner obstáculos a la gracia.", "s": 14}, {"k": "p", "t": "¿Qué harán durante estos días? Rezar más, rezar con placer, rezar bien: esto es lo primero. Después están las meditaciones y los tiempos dedicados a las reflexiones. Las palabras del predicador ayudan, pero son ustedes los que deben ir hasta el fondo de sus corazones. ¡Si pudiéramos abrirlo, si pudiéramos sondearlo hasta sus fibras más íntimas! Pero para lograrlo es necesario el silencio. Sin embargo, no basta el silencio externo de palabras y miradas; también es necesario el silencio interno: estar recogidos. Reflexionen sobre lo que han oído, medítenlo, rúmienlo. En fin, estén unidos a Dios y hablen con él. Sólo Dios y mi alma. El tiempo de los ejercicios es un tiempo muy valioso y no hay que desperdiciarlo en lo más mínimo. No sólo debemos hablarle nosotros a Dios, sino dejar que también él nos hable. Decirle con Samuel: \"Habla, Señor, que tu siervo escucha\" (1Sam 3,9); y luego, escucharlo. Es necesario estar dispuestos a hacer lo que el Señor quiere de nosotros.", "s": 14}, {"k": "p", "t": "Examinen bien si siguen los ejemplos del Señor Jesús en quien encontramos todas las virtudes, para imitarlo. Si todos deben ser imitadores de Jesús, con más razón los misioneros y misioneras. Sobre todo estén atentos a los defectos más frecuentes; en general son aquellos a los que prestamos menos atención.", "s": 14}, {"k": "p", "t": "Por último están los propósitos, que deben ser prácticos, sobre el defecto preponderante, o sobre la virtud que más nos hace falta desarrollar. San Santiago dice que la Palabra de Dios no sólo debe ser escuchada, sino también puesta en práctica. No basta con escribir los propósitos sobre un papel: \"Pongan en práctica la Palabra y no se contenten sólo con oírla, de manera que se engañen a ustedes mismos\" (Sant 1,22); entonces los propósitos serán una gracia de Dios y les proporcionarán bendiciones. Cuando respondemos a los dones de Dios, estos se multiplican; y con frecuencia basta una buena decisión. Todos los santos eran como nosotros; sintieron la voz del Señor, se entregaron a él, le respondieron afirmativamente. ¡Ustedes deben hacer lo mismo! 189. Retiro mensual. En el retiro mensual nos ocupamos \"de lo único que es necesario\" (cf. Lc 10,42), para despertarnos, renovar los propósitos de los ejercicios espirituales y volver al fervor primitivo. Pero hay que hacerlo bien. ¿De qué manera? El retiro mensual es, ante todo, un día de silencio. Sin embargo estén atentos para que no sea un silencio mudo, sino locuaz con Dios. Silencio y recogimiento. Que todo lo que hagamos en este día sea como una oración.", "s": 14}, {"k": "p", "t": "Lo más importante es el examen sobre el defecto preponderante y, particularmente, sobre el progreso en la virtud particular que nos comprometimos a hacer crecer en nosotros. ¡Felices las comunidades y feliz nuestro instituto si se realiza bien el retiro mensual! ¡Es una santa práctica que nuestro Instituto nunca perderá! De ella me espero mucho bien para nosotros y para nuestro apostolado.", "s": 14}, {"k": "h2", "t": "12. Modelos e intercesores", "s": 15}, {"k": "h3", "t": "San José", "s": 15}, {"k": "p", "t": "190. San José es el patrono de la Iglesia y, por lo tanto, es el patrono de las misiones, que forman parte de su esencia. También es nuestro especial protector; después de la Santísima Consolata viene él. El Evangelio lo llama \"Justo\" (Mt 1,19). Fue el ser más justo después de nuestro Señor y de la Virgen. Fue justo en la observación de la ley y de los mandamientos; justo en las palabras, en los juicios, en las obras. Pidámosle esta justicia, que es sinónimo de santidad. Seamos devotos de este gran santo. Por bien que lo honremos, nunca será como lo hizo el Señor, siéndole obediente durante tantos años.", "s": 15}, {"k": "nota", "t": "1 Para José Allamano todos los santos podían ser propuestos como ejemplos de vida para sus misioneros y misioneras, justamente por su compromiso con la santidad. Pero algunos eran más idóneos por las características con las que él se sentía en una sintonía particular o por su relación más directa con la evangelización. Aquí presentamos algunas de las figuras más citadas por José Allamano durante sus conversaciones formativas y de las que ha hecho una presentación específica. San José Cafasso era uno de los principales modelos que Allamano proponía con mayor frecuencia. Pero en esta lista no ha sido incluido. El motivo es que José Alamazo nunca habló de él específicamente, ya que José Cafasso aún no tenía una fiesta litúrgica propia porque no había sido aún beatificado. Sin embargo, el espíritu de José Cafasso emerge continuamente en las charlas espirituales de José Allamano, come se puede comprobar abundantemente en las páginas de este libro.", "s": 15}, {"k": "p", "t": "San José, después de María Santísima, es el primero al cual debemos recurrir en medio de nuestras necesidades espirituales y temporales. Santa Teresa dejó escrito: \"No recuerdo haberle rezado a san José para pedirle una gracia y que no me la haya concedido\". También Don Bosco solía decir: \"¡San José nunca dejó de concederme todo lo que le he pedido!\". Recuerdo que, cuando era niño, Don Bosco me decía: \"Para tener salud e inteligencia, recurre a san José\". Él es un gran intercesor ante Dios. Por lo tanto, cuando estarán en las misiones, diríjanse a él en todas sus necesidades, incluso temporales. Primero pidámosle las gracias espirituales que, luego, nos concederá también las otras. Pidámosle por nosotros, por la comunidad, por las misiones, por toda la Iglesia.", "s": 15}, {"k": "p", "t": "Para honrar a un santo no basta con rezarle, también hay que imitarlo. Les propongo a san José como especial modelo de fidelidad y de vida interior. Él no hizo milagros, no predicó, y sin embargo fue santo por su humildad y fidelidad en las pequeñas cosas. Fidelidad a las pequeñas cosas, este es el secreto de las comunidades. La gracia que le he pedido para ustedes es que tengan una fidelidad sólida, de la mañana hasta la noche, sin desanimarse. Su vida, además, fue siempre una vida interior, por eso es el protector particular de las personas consagradas. Quien no sabe rezar, quien no sabe meditar o hacer silencio, que se ponga en sus manos. En las misiones tendrán una vida muy agitada; imiten a san José que, en medio de todas sus obras externas permanece siempre unido a Jesús y a María, por eso su corazón se encendía con el ardor de esos dos corazones.", "s": 15}, {"k": "p", "t": "También imítenlo en su vida humilde, escondida y laboriosa. Trabajaba y se mantenía gracias al fruto de su trabajo. El Señor lo condujo por el camino común del trabajo, de la vida oculta, del sacrificio. Pero san José trabajaba con \"espíritu\". Se dedicaba atentamente al cuidado del Señor y de la Virgen; nosotros debemos hacer lo mismo cuando honramos a Dios. Trataba de hacer felices a Jesús y a María de todas las formas posibles; nosotros también deberíamos hacerlo todo por el mismo motivo.", "s": 15}, {"k": "p", "t": "También pidámosle a san José que infunda en nosotros el amor a la Virgen y a la virtud de la castidad. ¡Ciertamente debía de ser castísimo si el Padre le confió la protección de Jesús y de María! Digámosle de corazón: \"San José: haz que vivamos una vida santa y siempre segura bajo tu protección\".", "s": 15}, {"k": "p", "t": "Agradezcan a san José por la protección que nos da; y no sólo ahora porque estoy yo, que me llamo José, sino también después, cuando ya no estaré más. Esta devoción debe estar \"encarnada\" en ustedes. Después de nuestro Señor y de la Virgen viene san José, sin necesidad de buscar a otros.", "s": 15}, {"k": "h3", "t": "San Juan Bautista", "s": 15}, {"k": "p", "t": "191. San Juan Bautista es el patrono de la diócesis de Turín y, para nosotros, es fiesta. Cuando él nació, la alegría se difundió por todas las montañas de Judea, entre parientes y conocidos; mientras el padre, Zacarías, enmudecido por la desconfianza que mostró ante el anuncio del ángel, recuperó el habla y entonó el hermoso canto del \"Benedictus\", en el que Juan es proclamado \"profeta del Altísimo\" y \"precursor del Mesías\".", "s": 15}, {"k": "p", "t": "Puede ser considerado el tipo y modelo de los misioneros y misioneras en la vocación, en la preparación y en la vida apostólica. Elegido para preparar el camino al Señor, tuvo una misión divina: fue \"enviado por Dios\" (Jn 1,6). No como los otros profetas, que predijeron la venida del Mesías e indicaron los signos que habrían indicado su inminencia. Él dispuso los corazones para recibirlo con la penitencia. Cuando después Jesús se manifestó, lo presentó al pueblo de esta manera: \"Este es el Cordero de Dios que quita el pecado del mundo\" (Jn 1,29), y envió a sus discípulos hacia él. Después de recibir el bautismo de Juan, Jesús comenzó su misión en la tierra.", "s": 15}, {"k": "p", "t": "Ustedes también, por especial gracia de Dios, desde toda la eternidad, fueron predestinados no sólo a la vida, no sólo al cristianismo, sino al apostolado. Por lo tanto, el Señor los enriqueció con un físico sano, con un espíritu capaz de amarlo y hacerlo amar. Agradézcanle por esta predilección. No, no están aquí por casualidad. Él los eligió para ser misioneros y preparar el camino al Señor entre los no cristianos. Lo precederán con el testimonio de sus virtudes, con la predicación y la administración de los sacramentos.", "s": 15}, {"k": "p", "t": "¿Cómo se preparó san Juan a su gran misión? Fue santificado por Dios en el seno materno; le fue dado un nombre especial, que significa \"gracia\"; y, en el momento de su nacimiento, se dieron muchos prodigios. Por su parte, respondió a la vocación y se preparó a las misiones retirándose en el desierto y viviendo una vida de penitencia. Del mismo modo ustedes, recibida la primera educación de sus padres, se esfuerzan formándose a la misión con la oración, el estudio y la educación de las pasiones.", "s": 15}, {"k": "p", "t": "San Juan vivió especialmente cuatro virtudes, que les propongo a ustedes, porque son necesarias para formar a un verdadero misionero, a una verdadera misionera: la penitencia, la castidad, la humildad y el ardor misionero. Ante todo la penitencia: él dejó todo y a todos para retirarse en el desierto, donde se vistió sólo con una piel de camello y se alimentó con miel selvática y langostas, es decir conformándose sólo con lo necesario. Ustedes también, para prepararse al apostolado, deben formarse al espíritu de penitencia, no sólo la penitencia interna, sino también la externa, como tantas veces les dije. Es decir, deben realizar pequeñas mortificaciones, tan útiles en las misiones.", "s": 15}, {"k": "p", "t": "Juan el Bautista fue casto, es más, fue mártir de la castidad. Fue decapitado por orden de Herodes por haber defendido la integridad del matrimonio. Por eso, ustedes deben ser castos y puros, de modo tal que, con su ejemplo, puedan animar a todos los que se acercan a ustedes al amor y a la práctica de es
