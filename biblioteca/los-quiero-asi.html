mis tiempos; allí hablamos en confianza y pudimos comprendernos un poco. Pasé por la tumba de la señora De Luca, también por las de las Hermanas de la Visitación, las Sacramentinas y las Josefinas, y me detuve en la tumba de mons. Demichelis, a quien le dije: \"Cuando nos volvamos a ver en el paraíso, ¿estará contento del uso que hago de sus bienes?\", y conversé un poco con él. Luego fui a la tumba del abad N. di Robilant, quien durante su enfermedad estaba siempre alegre y sereno. Por último, después de haber pasado por las tumbas de los obispos, regresé a casa en tranvía.", "s": 7}, {"k": "p", "t": "El día de la conmemoración de los fieles difuntos para mí no es un día de melancolía, sino de alegría; no me atrevo a decirlo a los demás, pero ustedes me entienden.", "s": 7}, {"k": "h2", "t": "5. Virtudes teologales", "s": 8}, {"k": "h3", "t": "Fe", "s": 8}, {"k": "p", "t": "85. Doblemente felices. San Agustín compara la santidad con un edificio que, para ser levantado, necesita buenos cimientos sobre los cuales, con material bien colocado, se construyen los diferentes pisos. Así es nuestra santidad: se basa en la fe, se construye con la esperanza y se perfecciona con la caridad. Por lo tanto, la fe es el fundamento de la santidad y, como consecuencia, de todas las virtudes.", "s": 8}, {"k": "p", "t": "Jesús les dijo un día a los discípulos: \"Felices los ojos que ven lo que ustedes están viendo. De hecho, muchos profetas y reyes quisieron ver lo que ustedes ven y no pudieron\" (Lc 10,23). Ciertamente fue una gracia muy grande vivir en los tiempos del Señor, conocerlo personalmente, oírlo hablar y ser testigos de sus milagros. Esa gracia no la tuvieron los patriarcas, los reyes y los profetas del Antiguo Testamento. Como Abraham, ellos suspiraron por ver al Mesías: \"Abraham, el padre de ustedes, se estremeció de gozo esperando ver mi Día; lo vio y se llenó de alegría\" (Jn 8,56). Lo vio, sí, pero sólo en una visión, como David e Isaías, los cuales escribieron sobre él anticipadamente. Los discípulos, en cambio, pudieron ver y oír a Jesús personalmente, relacionarse con él familiarmente.", "s": 8}, {"k": "p", "t": "Y nosotros, ¿no somos felices? A Tomás, después de haberle mostrado las llagas, Jesús le dijo: \"Ahora crees, porque me has visto: ¡Felices los que creen sin haber visto!\" (Jn 20,29). Por lo tanto, nosotros también somos felices si creemos en él. Es más: nosotros somos doblemente felices. Primero porque creemos sin ver; después, porque realmente vemos y escuchamos. No es necesario ver con los ojos y oír con los oídos para decir que vemos y oímos. Las cosas se conocen también mediante la historia; por lo tanto, sabemos todo lo que dijo e hizo Jesús durante su vida terrena, así como a lo largo de los siglos, a través de la Iglesia. Él está siempre con nosotros hasta el fin de los tiempos, especialmente en el Santísimo Sacramento, vivo como en el cielo, donde podemos verlo con los ojos de la fe y escucharlo. 86. Vivir de la fe. ¿Qué significa vivir de la fe? Significa formar, moldearnos completamente según los principios de la fe. Si ella es el punto de referencia, la regla de nuestras acciones, tratemos de hacer todo según los criterios que nos ofrece la fe. Juzguemos todo a la luz de la fe, apreciando todas las cosas según el valor que ella les atribuye. Todos los cristianos necesitan de la fe para salvarse: \"Sin la fe es imposible agradarle a Dios\" (Heb 11,6). Esta fe, sin mérito de nuestra parte, la recibimos en el Bautismo, que volvió a incorporarnos en el orden sobrenatural. Que el espíritu de fe nos acompañe en cada acción, desde la mañana hasta la noche, todo el día, y sea una certeza viva y profunda que guía la vida concreta.", "s": 8}, {"k": "p", "t": "San Pablo recomendaba a Timoteo que tuviera fe: \"En lo que a ti concierne, hombre de Dios, huye de todo esto […] practica la fe\" (1 Tim 6,11); es decir, que la mantuviera y la perfeccionara. ¿Qué podemos hacer? Siendo la fe un don de Dios, debemos pedirla con frecuencia. El Señor, antes de echar el demonio de un joven, quiso una profesión de fe de su padre, el cual pidió a Jesús que se la aumentara: \"Creo, ayúdame porque tengo poca fe\" (Mc 9,24). Del mismo modo, también nosotros le decimos al Señor: ¡ayúdanos a creer! O bien: \"Auméntanos la fe\" (Lc 17,5). San Agustín exhorta a rezar seguido y bien el Credo, que contiene las verdades de la fe como tantas perlas preciosas. Es necesario vivir de la fe: \"El justo vivirá por la fe\" (Heb 10,38). 87. En las misiones. Para ir hacia Dios no se necesitan tantas palabras, sino un gran espíritu de fe. Si todos deben tener este espíritu de fe, ¡cuánto más los misioneros y las misioneras! Sin él, en las misiones, ¿qué podemos hacer? Ustedes deben despertarla en tantos millones de no cristianos. \"El que no nace del agua y del Espíritu no puede entrar en el Reino de Dios\" (Jn 3,5). ¡Miren qué grande es el valor de la fe para nosotros y para los demás y qué privilegiados son ustedes por esta sublime misión! Debemos tener tanta fe y estar dispuestos a profesarla públicamente, hasta el martirio.", "s": 8}, {"k": "p", "t": "Con el espíritu de fe nunca nos sentiremos abandonados. Todos pueden abandonarnos, pero Dios no. Si uno vive de la fe, hasta el peso de la responsabilidad misionera desaparece, porque si solos no podemos hacer nada, con Dios lo podemos todo. Es en este sentido que pedimos que aumente nuestra fe. No se trata tanto de pedir la fe teológica, que ya poseemos, sino un aumento de la fe práctica y del espíritu de fe. De Cottolengo se dice que tenía más fe que todos los habitantes de Turín. Se necesita una fe muy fuerte. Ni siquiera uno solo de nuestros cabellos se cae sin que lo quiera Dios (cf Lc 21,18). Por eso pidamos que aumente nuestra fe. Siempre una pizca de fe que impregne todo. 88. Fe práctica. Ustedes me dirán que, gracias a Dios, ya tienen fe y que la valoran mucho. Ahora bien, ustedes tienen la fe teórica, pero ¿poseen la fe práctica? De hecho, no basta con tener fe. Si nuestra fe no se hace explícita a través de las obras, está muerta: \"La fe sin obras es estéril\" (Sant 2,20).", "s": 8}, {"k": "p", "t": "Que todos nuestros pensamientos estén iluminados por la fe. Preguntémonos: ¿este pensamiento le gusta a Dios? Sí, ¡sólo Dios! ¡Todo de Dios, todo por Dios, todo en Dios! Por lo tanto, alejemos de nosotros los pensamientos inútiles, porque de ellos nacen algunos juicios: sobre los compañeros, sobre las disposiciones de los superiores, sobre los eventos pasados y presentes, sobre las cosas de la tierra, etc. ¿Qué beneficio nos dejan para la eternidad? San José Benito Labre, pasando un día todo harapiento y sucio frente a un señor, escuchó que le decía: \"¡Pobre desgraciado!\". El santo, muy alegre, le respondió: \"¡No, no soy un desgraciado, estoy en gracia de Dios!\". Ven, esa persona juzgaba según el espíritu del mundo, en cambio el santo lo hacía según el espíritu de fe. Lo mismo podemos decir de los falsos juicios que los demás pueden dar de nosotros. ¿Qué importa? \"¡Quien me debe juzgar es el Señor!\" (1 Cor 4,4).", "s": 8}, {"k": "p", "t": "¿Nuestros afectos corresponden al espíritu de fe? ¿No tenemos ningún afecto o apego contrario al mismo? Me refiero a esos apegos que podemos tener a una cosa insignificante, pero que nos impiden pertenecerle completamente a Dios. Un corazón lleno de Dios se expresa de este modo: \"La boca habla de la abundancia del corazón\" (Mt 12,34).", "s": 8}, {"k": "p", "t": "De este modo, en todo lo que hacemos debemos regularnos según el espíritu de fe, especialmente en esas acciones que conciernen más directamente el servicio de Dios. Mons. Gastaldi, durante la visita pastoral a una parroquia, habiendo encontrado los corporales y todos los otros elementos litúrgicos sucios, mientras toda la ropa blanca de la casa estaba impecable, le dijo al párroco: \"¿Usted cree en la presencia del", "s": 8}, {"k": "p", "t": "Señor en el Santísimo Sacramento?\" — \"¡Monseñor, me ofende!\" — \"No, no, responda: cree o no cree?\" — \"¡Claro que creo!\" — \"¡Mucho peor, entonces! Porque si cree, entonces no tiene ninguna excusa\". Si yo les preguntara a cada uno de ustedes: \"¿Crees en la presencia real del Señor en la Hostia consagrada?\", la respuesta sería afirmativa. Entonces podría preguntarles: \"¿Por qué haces mal la genuflexión, te distraes voluntariamente, te aburres durante la visita al Santísimo Sacramento, te olvidas del Señor durante el día?\". No, no basta tener una fe puramente teórica, abstracta; necesitamos tener una fe práctica, inspirando en ella todas nuestras acciones. 89. Fe simple e íntegra. San Agustín advierte: \"Surgen los ignorantes y se llevan el Reino de Dios, y a nosotros, con toda nuestra doctrina, ¡nos dejan la tierra!\". Claro, no hay que creer sin autoridad ni razones, pero cuando hay motivos para creer y quien enseña es veraz, entonces creamos. Jesús exclama: \"Te alabo, Padre, Señor del cielo y de la tierra, por haber ocultado estas cosas a los sabios y a los prudentes y haberlas revelado a los pequeños\". (Mt 11,25). Santo Tomás de Aquino explica que la fe no es sólo algo que concierne el intelecto, sino también la voluntad, y que no es la razón sino la voluntad la que nos predispone a creer. Debemos ser simples para poder creer.", "s": 8}, {"k": "p", "t": "Un misionero o una misionera que no tenga esta fe simple e íntegra que le permita encontrar al final del día el consuelo a los pies de Jesús Sacramentado, ¿cómo resistirá? Cuando no se tiene esta fe humilde, simple e íntegra, no se tiene más nada.", "s": 8}, {"k": "p", "t": "Se pueden profundizar las cosas, es más, se debe estudiar, pero siempre diciendo: ¡creo, Señor! San Pedro exhortaba así a los primeros cristianos: \"Como niños recién nacidos, deseen la leche pura de la Palabra, que los hará crecer para la salvación\" (1 Pe 2,2). ¡Sigamos adelante con humildad y sencillez en las cosas de la fe! Aquel que duda de todo, poco a poco llegará a dudar también de las cosas de la fe. Serán sólo tentaciones, pero molestan. Es necesario que en esta casa haya sencillez. Quiero que sean simples, lo que no significa que haya que creer en todo. Una cosa es la fe simple y otra la credulidad. El Señor nos advirtió: \"Sean astutos como serpientes y sencillos como palomas\" (Mt 10,16).", "s": 8}, {"k": "p", "t": "90. Bajo la guía de la Iglesia. Amen las verdades de la fe, estudien su belleza, su razón de ser, los beneficios que derivan de las mismas en el tiempo y para la eternidad, bajo la guía de la Iglesia. El estudio podrá darnos una ciencia teológica, pero no una fe católica. Fe católica significa creer porque la Iglesia nos lo propone. Nuestros institutos y cada uno de sus miembros deben estar unidos al Romano Pontífice y a la Iglesia: \"Donde está Pedro está la Iglesia\". Por lo tanto, profesemos una adhesión plena a la Iglesia y al Papa; y no a esto o aquello, sino al Papa como tal. También en las cosas que no son obligatorias queremos estar con él. Si aquí adentro alguien pensara de forma diferente al Papa, aun en cosas que no conciernen la fe o la moral, no es para nosotros. Nosotros queremos ser \"Papalinos\" en todo el sentido de la palabra. Pidamos a los Santos Apóstoles Pedro y Pablo que nos concedan estar siempre unidos a la Santa Sede, tanto colectiva como individualmente. Esta gracia dará estabilidad al Instituto.", "s": 8}, {"k": "h3", "t": "Esperanza", "s": 8}, {"k": "p", "t": "91. Abrir el corazón a la esperanza. Según san Agustín, como sabemos, el edificio de nuestra santificación se construye con la esperanza. Fíjense qué importancia le da a la esperanza. Y sin embargo, hablando en general, no todos la estiman del mismo modo. Se siente la obligación de creer, pero se teme tener demasiada esperanza y así se admiten faltas de confianza bajo el nombre de bondad y temor de Dios.", "s": 8}, {"k": "p", "t": "No es el caso de José Cafasso, que fue el hombre de la esperanza. Él poseía esta virtud en grado excelente. Tenía tanta que podía infundirla en los demás. Cuando se le decía que la puerta del paraíso era estrecha, respondía: \"¡Bueno, entonces pasaremos uno por vez!\". Infundía esperanza también en los condenados a muerte, encomendándolos a la Virgen y, después de su ejecución, exclamaba: \"¡Un santo más!\". También agregaba: \"¡Esos bribones nos roban el paraíso!\". Sabía cambiar la desesperación en la mejor confianza. No, no hay que desesperarse por nadie. ¡La misericordia de Dios es infinita! Cuando nos preguntaban cuál era la virtud más importante de José Cafasso, no sabíamos qué responder, porque todo era importante. Algunos afirmaban que era el celo por la salvación de las almas. Otros decían que era la confianza en Dios: de hecho tenía confianza para él y para los demás. Sin duda, la esperanza o confianza en Dios fue la característica principal de José Cafasso. Esto lo dije en los procesos de beatificación y canonización. Algunos tienen la fe bastante activa, pero esperan poco, no son capaces de ensanchar el corazón.", "s": 8}, {"k": "p", "t": "Abramos el corazón a una esperanza viva. No debemos sólo esperar, sino súper esperar, esperar contra toda esperanza. Cuando se espera poco, le estamos fallando al Señor, \"el cual quiere que todos los hombres se salven\" (1 Tim 2,4). José Cafasso decía que ciertas personas pensaban que salvarse era como jugar a la lotería: \"Quién sabe si alguna vez ganaré a la lotería\". Del mismo modo, algunos cristianos parecen decir: \"Quién sabe si me salvaré\". No, no es así. Tenemos que vivir con la certeza de que el Señor comprende nuestras debilidades con tal de que nosotros pongamos un poco de buena voluntad. No debemos tener miedo de esperar demasiado. San Hilarión se daba ánimos en el lecho de muerte diciéndose: \"¿Has servido al Señor durante setenta años y temes a la muerte?\".", "s": 8}, {"k": "p", "t": "Por lo tanto, no digas \"Quién sabe si me salvaré\", sino \"Quiero salvarme y, por lo tanto, quiero corregir mis defectos y no desanimarme\". El temor de no salvarse proviene, además, de la pereza. Es necesario despertarse, trabajar, como hacían los santos. Tampoco nos deben desanimar los pecados de la vida pasada. No está mal recordarlos para crecer en la humildad, pero tampoco vivir recordándolos, como si el Señor no nos los hubiera perdonado. ¡Al Señor le gusta mucho que creamos en su bondad, en su misericordia! Por lo tanto, ¡tengamos mucha esperanza, mucha! ¡En Ti, Señor, he esperado, jamás seré defraudado! 92. Con la mirada puesta en el paraíso. Debemos pensar siempre en el paraíso. Este es el pensamiento que ha formado a los santos, que pobló los desiertos de ermitaños, las casas religiosas de consagrados y los países de misión de fervorosos misioneros. Como ven, este pensamiento produce en nosotros grandes efectos. Ante todo, nos aleja de lo que es terrenal. José Cafasso escribía: \"Todo lo de aquí abajo lo considero en función del premio allá arriba; y si es algo feo y me da pena, pienso que en el paraíso ya no lo tendré que vivir\". Además, este pensamiento del paraíso nos hace vencer todos los obstáculos, las penas, las tribulaciones de esta vida. Cuando el aburrimiento, el tedio y la indolencia nos hagan vivir horas o días oscuros, repitamos con san Francisco de Asís: \"¡Es tan grande el bien que espero, que cualquier pena me resulta una alegría!\" Y si una pena no puede convertirse en alegría, que al menos seamos capaces de soportarla. El sufrimiento dura poco, en cambio el premio es eterno. San Pablo dice: \"Nuestra angustia, que es leve y pasajera, nos prepara una gloria eterna, que supera toda medida\" (2 Cor 4,17).", "s": 8}, {"k": "p", "t": "El pensamiento del paraíso también nos sirve para facilitarnos la adquisición de todas las virtudes y para responder con más fidelidad y generosidad a nuestra vocación, que es ser santos, grandes santos, lo más que podamos. Por lo tanto, pensar en el paraíso es un gran pensamiento, porque nos incentiva a hacernos santos. Los años pasan rápidamente y, por lo tanto, seremos felices si , al final de nuestras vidas, podremos decir con san Pablo: \"He peleado hasta el fin el buen combate, concluí mi carrera, conservé la fe. Y ya está preparada para mí la corona de justicia, que el Señor, como justo Juez, me dará en ese Día\" (2 Tim 4,7-8). Don Bosco había escrito arriba de una puerta: \"¡El paraíso no es para los perezosos!\". Yo diría que no sólo no es para los perezosos, sino tampoco para los que pertenecen al Señor a medias.", "s": 8}, {"k": "p", "t": "Cuando piensen en el paraíso, no piensen en forma abstracta, sino en el paraíso del misionero y de la misionera que son fieles a su vocación. El Señor dijo: \"Yo voy a prepararles un lugar\" (Jn 14,2). Pero para esto es necesario trabajar, y trabajar mucho. ¡Sería demasiado cómodo tener el paraíso ahora, tan pronto! No, no; trabajar cuarenta, cincuenta años, incluso más. Me parece que este pensamiento del paraíso debería consolarnos. Nuestro premio está allí, ¡y es muy grande! Pensemos con frecuencia en él. 93. Una gran reserva de confianza. La esperanza más eximia y más robusta se llama confianza. La confianza es como la quinta esencia de la esperanza. Necesitamos de ella para cubrir la desproporción que hay entre nuestra nada y la grandeza de nuestra vocación religiosa, sacerdotal, misionera.", "s": 8}, {"k": "p", "t": "Hay que tener una gran reserva de confianza para poder infundirla en los demás. Sin confianza no se puede hacer nada. Desconfiando le fallamos a Dios. José Cafasso decía que la falta de confianza es el pecado de los dementes. ¡Cuesta tan poco confiar en Dios! Entonces, ¿por qué no confiamos en él?", "s": 8}, {"k": "p", "t": "Todos necesitan de la confianza. Los malos la necesitan para recuperarse de los vicios y retomar el camino de la virtud: \"Ahora mismo iré a la casa de mi Padre\" (Lc 15,18). La necesitan los tibios para despertarse y llenarse de fervor: \"El Señor es bondadoso con los que esperan en él\" (Lam 3,25). Pero, es más, la necesitan también los fervorosos para no desanimarse ante las exigencias de Dios, así como para no desanimarse en las caídas frecuentes, en los defectos y pecados que se cometen. Haciendo una revisión de vida, uno se encuentra siempre con las mismas imperfecciones y estaría tentado de decir: \"¡Todo es inútil, total no cambiaré nunca!\" Pero, digo yo, ¿por qué cometes siempre los mismos pecados? ¡Porque eres flojo! ¡Haz lo que puedas y el Señor te ayudará! ¡Estamos realmente locos cuando nos falta la confianza en Dios!", "s": 8}, {"k": "p", "t": "Lo esencial es encontrarle el lado bueno a todas las cosas. San Pablo nos asegura que \"Dios dispone todas las cosas para el bien de los que lo aman\" (Rom 8,28). Sí, todas las cosas, también los pecados, cuando hay buena voluntad. En todo, incluso en el pecado, es posible encontrar algo bueno, si somos humildes.", "s": 8}, {"k": "p", "t": "Confianza, confianza. Después de la confesión, pensemos en las virtudes y no más en los pecados. ¡Ánimo, un poco de amor de Dios lo acomoda todo! Nunca nos desanimemos, volvamos a empezar siempre: \"¡Nunc coepi!\", ¡empiezo ahora! Diría que este es el lema de nuestros institutos. Si tenemos esta confianza, evitaremos los obstáculos de la turbación y los escrúpulos. En las turbaciones e incertidumbres, permanezcamos fieles a la voz que nos transmite serenidad. San José Cafasso decía \"que no debemos pedir perdón a cada momento. Así como entre amigos íntimos no nos pedimos perdón por cada pequeñez, del mismo modo en nuestra relación con Dios. ¡El amor de Dios lava todo!\". También decía: \"Señor, tú sabes que no quiero ofenderte, que te quiero; por lo tanto, si fallo en algo, no quiero ni siquiera pedirte perdón\".", "s": 8}, {"k": "p", "t": "Esta confianza les será necesaria también en el futuro, cuando estarán en las misiones. Se desanimarán por los errores cometidos, por el poco fruto de su apostolado, por la soledad, etc. Ánimo, ánimo, coraje. \"Los que confían en el Señor son como el monte Sión, que permanece inconmovible para siempre\" (Sal 124,1). Si no tendrán la suficiente confianza, una reserva de confianza, en las misiones vivirán tristes. Un misionero o una misionera sin esperanza, no pueden hacer el bien, es más, son un tormento para ellos y para los demás.", "s": 8}, {"k": "p", "t": "El miedo y la falta de confianza impiden avanzar por los caminos del espíritu. Tengan el corazón grande, de lo contrario no podrán hacer nada. No hay que perderse en tantas pequeñeces, sino ser espontáneos. Jesús es el Dios de la paz, no de la inquietud. Pidámosle la paz también para nosotros, para no dejarnos dominar por los escrúpulos, aun teniendo una consciencia sensible. ¡Nada de escrúpulos! ¡Nada de dudas! Que todo sea claro y limpio. Sigan con esa tranquilidad de espíritu que aleja de los escrúpulos y las dudas. ¡Este es el espíritu que quiero en ustedes! 94. Todo en las manos de Dios. La confianza es una confianza amorosa en la Divina Providencia, que nos acompaña en cada momento de nuestra vida. Confiemos en Dios y pongamos todo en sus manos. Él es padre y hace todo para nuestro bien. No debemos temer ni por el Instituto, ni por alguien en particular. En todo, aun en las cosas más pequeñas, descansemos en Dios y confiemos sólo en Él, vayan como vayan las cosas. No pongamos nuestra confianza en los medios humanos que poseemos: talento, fuerzas, virtudes, etc., o en los de los demás. Hagamos siempre lo que podamos de nuestra parte, después dejemos todo en las manos del Señor, sin temor. Él no deja nunca su obra por la mitad. 95. Confiar en la Providencia. Estamos invitados a nutrir una gran confianza en la Divina Providencia: \"No se inquieten entonces, diciendo: ¿Qué comeremos, qué beberemos, o con qué nos vestiremos?\" (Mt 6,31). El Señor, que provee el alimento a los pájaros, tanto más lo dará a sus apóstoles. Suponiendo que sea voluntad de Dios que entren muchos jóvenes y que ellos respondan a la vocación recibida, Dios debe hacer milagros, como los hace en el Cottolengo, la Pequeña Casa de la Divina Providencia. Allí se trata de \"pobres cuerpos\" que son aliviados. En nuestro caso se trata de salvar a \"pobres almas\".", "s": 8}, {"k": "p", "t": "Es necesario confiar en Dios, pero también comprometerse en responderle. ¡Cuánto cuesta mantener a un misionero, a una misionera! Mi preocupación no es que entre dinero, sino que nos lo merezcamos. Si nos llegara a faltar lo necesario para seguir, me pondría ante el Señor o ante la Virgen, que se ocupa de los bienes, y les diría: \"O los que están en las misiones no hacen su deber, o aquí entre nosotros hay un amalecita que no responde a su vocación\". Yo no dudo de la Providencia. Sin esta confianza no podríamos seguir adelante. A veces sucede que llegamos a la noche y nos falta el dinero para pagar una factura que se vence. Y bien, al día siguiente el dinero llega y se salda la deuda. Les aseguro que nunca dejé de dormir tranquilamente por este fastidio. No voy a buscar dinero, pero no me avergonzaría si tuviera que ir y pedir limosna para ustedes y para las misiones. Pero a veces el Señor quiere probarnos un poco y nos hace esperar. Con eso quiere recordarnos que somos pobres, que nuestro Dueño es él. Pero si respondemos a su llamado, siempre nos bendecirá.", "s": 8}, {"k": "p", "t": "Jesús en el Evangelio prohibe ese afán excesivo que nace de la desconfianza en Dios y del apego desmedido a las cosas de la tierra. Pero la confianza en la Divina Providencia, no excluye que también nosotros nos comprometamos en pensar, trabajar y proveer para el futuro. Por lo tanto, espero que todos cooperen al bien común, cuidando las cosas de la comunidad y contentándose de lo necesario. Sobre todo, si llevan una vida fervorosa meritarán las bendiciones de Dios, incluso aquellas temporales: \"Busquen primero el Reino y su justicia, y todo lo demás se les dará por añadidura\" (Mt 6,33). Cuando ustedes, en el \"Padre nuestro\", piden el pan cotidiano, ponen la intención de pedir, en primer lugar, la santa Comunión y la Palabra de Dios, pero también el pan material. Porque si Dios provee con tanta generosidad las cosas materiales, ¡cuánto más las espirituales! Quisiera que nuestros Institutos en general, y ustedes en particular, tuvieran siempre esta gran confianza en Dios: \"El que confía en el Señor no será decepcionado\" (Ecli 32,24).", "s": 8}, {"k": "h3", "t": "Caridad", "s": 8}, {"k": "p", "t": "96. Amarás al Señor tu Dios. El edificio de nuestra santidad, según san Agustín, se perfecciona con la caridad. Dios y el prójimo son dos objetos, o un único objeto bajo dos aspectos de la caridad: Dios en sí mismo y por sí mismo, el prójimo en Dios y por Dios. 1 La caridad hacia Dios consiste no tanto en un sentimiento cuanto en un acto de voluntad. Se puede amar mucho y no sentir, o inclusive experimentar repugnancia. Se puede sentir mucho e inclusive llorar de ternura y no amar. La caridad hacia Dios es el primer gran mandamiento. A la pregunta del doctor de la ley: \"Maestro, ¿cuál es el mandamiento más grande de la Ley?\", Jesús responde: \"Amarás al Señor, tu Dios, con todo tu corazón, con toda tu alma y con todo tu espíritu\" (Mt 22,36-37). El evangelista Marcos agrega: \"y con todas tus fuerzas\" (Mc 12,30).", "s": 8}, {"k": "p", "t": "La santidad consiste esencialmente en la caridad, según santo Tomás: \"Esencialmente, la perfección de la vida cristiana en sí misma consiste en la caridad\". La caridad es santidad; amar y hacerse santos es lo mismo. Cuando hay amor, no se necesita nada más. Las otras virtudes teologales son necesarias porque están inseparablemente unidas a la caridad. No se puede amar sin creer, y se espera lo que se ama.", "s": 8}, {"k": "p", "t": "San Francisco de Sales confirma: \"La verdadera santidad consiste en el amor de Dios; más se ama a Dios, más se es santo\". Y san Agustín: \"Ama y haz lo que quieras\". Quien ama a Dios no lo ofende, sino que lo sirve fielmente. Por lo tanto, la caridad es el compendio de todas las virtudes y la perfección de todas ellas. Este es el motivo por el que san Pablo afirma que la caridad es \"la plenitud de la Ley\" (Rom 13,10) y \"el vínculo de la perfección\" (Col 3,14). No duda en afirmar que, sin", "s": 8}, {"k": "nota", "t": "1 José Allamano hablaba de la caridad en modo unitario, como en el Evangelio, es decir hacia Dios y hacia el prójimo. Sin embargo, habitualmente desarrollaba sus enseñanzas sobre la caridad hacia el prójimo, sobre todo en el contexto de la vida comunitaria, como ha sido mantenido en estas páginas.", "s": 8}, {"k": "p", "t": "la caridad, todo lo demás no sirve. Aunque habláramos las lenguas de los ángeles, aunque tuviéramos el don de la profecía y conociéramos todos los misterios, aunque poseyéramos toda la ciencia y tuviéramos fe para transportar montañas, aunque ofreciéramos nuestro cuerpo para ser quemado vivo, sin la caridad ¡no sirve de nada! (cf. 1 Cor 13,1ss). 97. Amor como amistad. Según santo Tomás, la caridad es una amistad entre Dios y el hombre. Dios nos ha preferido desde la eternidad: \"Yo te amé con un amor eterno\" (Jer 31,3). Ha puesto su mirada sobre nosotros: \"y mi delicia era estar entre los hijos de los hombres\" (Prov 8,31). Dios nos quiere de verdad; nos da gracias permanentemente para sostenernos en el bien y hacernos santos; y, si pecamos, nos perdona. Cuando estamos afligidos nos dice: \"Vengan a mí todos los que están afligidos y agobiados, y yo los aliviaré\" (Mt 11,28). Él nos dio todo lo que tenemos, aun no necesitando de nosotros y, al mismo tiempo, aprecia cada gesto virtuoso que le ofrecemos devolviéndolo con numerosas gracias. También nosotros debemos ser agradecidos con Él, repitiendo con frecuencia: \"¡Te damos gracias, Señor Dios nuestro!\" San Jerónimo nos enseña que \"el querer lo que el amigo quiere y el no querer lo que no quiere, es un signo de verdadera amistad\". 98. Amar a Dios con ardor. San Agustín dice: \"Nos has creado para ti y nuestro corazón no descansa si no es en ti\". ¿Cómo amar a Dios? Es necesario amarlo con ardor, con vivacidad. Santa Teresa del Niño Jesús a los veinticuatro años ya quemaba del amor a Dios. ¿Y nosotros, misioneros y misioneras? Él quiere todo nuestro corazón. Ven, no es que nosotros no amamos al Señor, sino que no lo amamos en el modo y la medida como él quiere que lo amemos.", "s": 8}, {"k": "p", "t": "Nuestro corazón es ya tan pequeño, que no debemos dividirlo. San Francisco de Sales decía que si hubiera encontrado una sola fibra en su corazón que no fuera para Dios, la habría arrancado sin misericordia. ¿Y nosotros? ¿Realmente amamos al Señor con todo el corazón? Si Jesús en este momento nos hiciera la pregunta que dirigió a san Pedro: \"¿Me amas más que estos?\" (Jn 21,15), ¿qué podríamos responderle? Les propongo este exámen de conciencia. Preguntémonos con frecuencia, especialmente nosotros, misioneros y misioneras, si nuestro corazón es libre, si no está dividido, si es constante. El Señor se da totalmente a nosotros; entonces, ¿cómo podemos darnos a él parcialmente?", "s": 8}, {"k": "p", "t": "Amemos a Dios con toda el alma, es decir con toda la voluntad, queriendo lo que él quiere y como él lo quiere. Demostrémosle nuestro amor evitando el mal y buscando lo más perfecto. Con frecuencia nos engañamos en la vida práctica, especialmente en las adversidades o en los tiempos de aridez. El amor de voluntad resiste a todo y permanece fuerte aun en medio de las pruebas. Amar al Señor cuando todo va con viento a favor, es decir cuando todo sale bien ¡es tan fàcil! Pero amarlo cuando se está en las tinieblas, en la oscuridad del espíritu y el corazón se ha enfriado, ¡entonces sí que es verdadero amor! Hagamos nuestras las palabras de san Pablo: \"¿Quién podrá entonces separarnos del amor de Cristo? ¿Las tribulaciones, las angustias, la persecución, el hambre, la desnudez, los peligros, la espada? [...] Ninguna criatura podrá separarnos jamás del amor de Dios, manifestado en Cristo Jesús, nuestro Señor\" (Rom 8,35-39).", "s": 8}, {"k": "p", "t": "Amemos a Dios con toda la mente, con todas las fuerzas. Preguntémonos: ¿cuáles son nuestros pensamientos? ¿Y nuestros juicios? ¿Son todos según Dios? Amar a Dios con toda la mente quiere decir hacer todo con buena intención: todo por Él, nada por nosotros. Y, además, amar con toda la fuerza significa amar al Señor lo mejor posible, sin temor de amarlo demasiado. Con frecuencia, nuestro corazón está lleno de amor propio. ¿Y nosotros, misioneros y misioneras? Si el corazón está lleno del amor de Dios, se manifiesta en nuestra vida. Recuérdenlo: quien no arde, no puede incendiar. 99. Crecer en el amor. Crecer en el amor de Dios con la oración: pedirle con frecuencia a Dios la caridad, que es la reina de todas las virtudes. San Agustín repetía: \"Señor, que yo te ame\". Y san Ignacio: \"¡Dame, Señor, tu amor y tu gracia, con eso me alcanza!\". Pidamos la intercesión de María, \"Madre del santo amor\", y de aquellos santos o santas que se destacaron en este amor. También en la meditación el corazón se enciende de amor, especialmente la meditación de la Pasión del Señor. San Francisco de Sales decía que el Calvario es el teatro de los amantes. Cada frase del \"Padre nuestro\" es un acto de amor de Dios. Del mismo modo, cada frase del \"Tantum ergo\". Por ejemplo las palabras: \"Adoremos el Sacramento\" son un acto de amor, porque la verdadera adoración es el amor. Por eso, palabras como estas: \"que la fe supla el límite de los sentidos\", nos ayudan a alegrarnos por no ver ni sentir nada con los sentidos, y así podamos creer en Su palabra, ya que esto también es amor. Y también: \"Al Padre, al Hijo, gloria y alabanza\". ¡Cuántos actos de amor: que Dios sea alabado, que todos lo amen, que todos conozcan su grandeza! Todo esto es amor, puro amor, con tal de que estas bellas expresiones broten de nuestro corazón.", "s": 8}, {"k": "p", "t": "Crecer en el amor de Dios con las obras: hagamos obras que le gustan a Dios. Como enseña san Gregorio Magno: \"La prueba de la caridad es la acción\". Jesús dijo: \"Si ustedes me aman, cumplirán mis mandamientos\" (Jn 14,15). El termómetro para conocer el grado de nuestro amor a Dios está en las obras. Por lo tanto, no nos conformemos con las palabras, pasemos a la práctica. Nosotros, en particular, debemos tener \"sed de almas\", como nuestro Señor. También a través de las acciones comunes de cada día podemos ser colaboradores del Redentor. Todo aquí está pensado para que un día puedan hacer el bien. En las misiones se debe tener el corazón abierto a todas las debilidades y, por lo tanto, tiene que estar lleno del amor de Dios. San Francisco Javier estaba lleno de este amor y, por lo tanto, era un misionero apasionado. El que no ama nunca podrá hacer nada bueno. Felices ustedes que tendrán la posibilidad de ser apóstoles en las misiones... ¡si serán santos! Y serán santos en la medida en que estén llenos del amor de Dios.", "s": 8}, {"k": "p", "t": "Crecer en el amor con intenciones puras. La pureza de intención es un acto de amor por medio del cual referimos todas nuestras acciones solamente a Dios, a su gloria: \"¡Mi Dios, mi todo!\". Cuanto más perfecto es el fin, más perfecta es nuestra obra. El Señor dijo: \"Si el ojo (es decir tus intenciones) está sano, todo el cuerpo estará iluminado (es decir todas tus obras serán buenas ante Dios). Pero si el ojo está enfermo, ¡todo el cuerpo estará en tinieblas!\" (Mt 6,22-23). ¡Qué felices seríamos si todo lo refiriéramos solamente a Dios! Sólo él puede bendecirnos, consolarnos, hacer prosperar todas nuestras obras. Es verdad que cada mañana dirigimos a Dios todos nuestros pensamientos, afectos y acciones, pero no basta. Con frecuencia, también durante el día necesitamos renovar nuestras rectas intenciones. Estemos atentos y purifiquémoslas. ¡Sólo Dios! ¡Sólo a Él honor y gloria! 100. Querer lo que quiere Dios. Cuando se hace la voluntad de Dios se encuentra la santidad más perfecta y la felicidad más completa. San Basilio afirma que el secreto para ser felices, también en este mundo, es hacer la voluntad de Dios. San Pablo, apenas convertido, la abraza plenamente: \"¿Qué debo hacer, Señor?\" (Hch 22,10). José Cafasso explica así la unión de nuestra voluntad a la de Dios: \"Querer lo que Dios quiere; quererlo de ese modo, en ese tiempo, en las mismas circunstancias que él quiere, y quererlo sólo porque lo quiere nuestro Dios\". El Señor Jjesucristo nos ha dado ejemplo de esto con las palabras y los hechos. Si rezaba, si trabajaba, si predicaba, lo hacía para cumplir la voluntad del Padre. Sobre la cruz, después de haber declarado que todo se había cumplido, inclinó la cabeza (cf. Jn 19,30) como para indicar que, también en ese acto final de la muerte, estaba haciendo la voluntad del Padre.", "s": 8}, {"k": "p", "t": "Si uno se une a la voluntad de Dios, ve las cosas como las ve Dios, ve las cosas como las ve Él, del mismo modo, busquémosla tanto en las cosas grandes como en las pequeñas, tanto públicamente como en privado. Hagan las cosas bien sin esperar nada de los demás. ¡Sólo Dios basta! Si suceden desgracias, acéptenlas sin lamentarse, viendo en ellas la voluntad de Dios. David, mientras Simei tiraba contra él piedras y maldiciones, respondía a Abisai, que habría querido matarlo: \"Si él maldice, es porque el Señor le ha dicho: ¡Maldice a David! ¿Quién podrá entonces reprochárselo?\" (2 Sam 16,10). El Señor siempre es capaz de transformar el mal en un bien.", "s": 8}, {"k": "p", "t": "Pero estén atentos porque muchas veces el amor propio nos hace ver como voluntad de Dios lo que no lo es. Hacemos tantas cosas en la ilusión de estar cumpliendo la voluntad de Dios, pero perdemos de vista la presencia frecuente del amor propio. ¡Miremos siempre hacia el cielo! Nuestra mirada debe estar siempre allí: ¡Sólo Dios! No nos preocupemos por el resultado de las obras; Dios nos premiará según nuestro trabajo y no según el resultado que a veces el Señor permite que sea mezquino o nulo para darnos una lección de humildad. ¡Por eso es importante orientar bien todo lo que hacemos! El Señor, si ponemos en sus manos el comienzo de una obra, nos ayuda con el resto. Lo que ha hecho y hace santos es la voluntad, la buena voluntad; es el no poner límites en el servicio de Dios.", "s": 8}, {"k": "p", "t": "Necesitamos examinarnos fríamente y ponernos ante el Señor: \"Señor, que yo te conozca a ti y a tu voluntad!\", porque el amor propio nos lo esconde. Santa Gertrudis decía cotidianamente y varias veces al día esta invocación: \"Amabilísimo Jesús, que no se haga mi voluntad sino la tuya\". Digámosla también nosotros alguna vez, especialmente en medio de las adversidades. En el \"padrenuestro\" pedimos que se extienda el Reino de Dios e, inmediatamente después, que se haga su santa voluntad así en la tierra como en el cielo. Por lo tanto, tratemos de vivir permanentemente en la voluntad de Dios.", "s": 8}, {"k": "p", "t": "Naturalmente, todo esto cuesta. Pero, como dicen los santos, sólo los inicios cuestan, porque se goza después. Examinémonos seriamente, ¡porque es fácil decir \"hágase tu voluntad\" en los momentos de fervor! Pero, prácticamente, ¿nos gusta hacer en todo la voluntad de Dios? Siempre debemos desprendernos de nuestra voluntad e interrogarnos en cada acción: ¿es esto lo que Dios quiere de mí? No está mal que, aquí y en las misiones, se cambien los cargos y, quien ejercía la autoridad, tenga que volver a obedecer. Así se acostumbra a buscar y hacer concretamente la voluntad de Dios, a obrar sólo por Él. Digámosle así a Dios: acepto todo, quiero todo sin restricciones, no sólo en general, sino en las más pequeñas circunstancias. ¡Ni un suspiro, ni una palabra, ni una obra que no sea por ti, mi Dios! Quien cumple siempre la voluntad de Dios, además de gozar de la paz perfecta, ¡cuántos méritos adquiere!", "s": 8}, {"k": "p", "t": "Lo que más me consuela es que siempre he hecho lo que el Señor ha querido de mí; me consuela saber que nunca he perdido el rumbo. Cuando mons. Gastaldi me nombró director espiritual del seminario, fui a verlo y le dije: \"Soy demasiado joven y, además, esperaba un día poder ser un humilde párroco; pero soy hijo de la obediencia\". Él me respondió: \"¿Quieres ser párroco? Te doy la parroquia más importante de Turín: el seminario\". Cuando me mandó a la Consolata, todavía no tenía treinta años y allí había una comunidad de sacerdotes ancianos. Le pregunté: \"¿Es realmente la voluntad de Dios? Todavía no cumplí los treinta años, no tengo experiencia\" — \"¿Ves? — me respondió — ser joven es un defecto que se corrije de a poco. Los errores que, precisamente, cometerás por ser joven, tendrás tiempo para repararlos\". ¿Se dan cuenta? Hay que estar allí donde nos quiere el Señor. Si yo no hubiera aceptado, mons. Gastaldi habría aceptado mi rechazo, pero yo no habría emprendido el camino en el que me quería el Señor.", "s": 8}, {"k": "p", "t": "101. Misión confiada a quien ama mucho. La caridad hacia Dios es necesaria, especialmente en nosotros, que hemos recibido la vocación y la misión de comunicarla: \"¡Yo he venido a traer fuego sobre la tierra, ¡y cómo desearía que ya estuviera ardiendo!\" (Lc 12,49). ¿Cómo podremos comunicar este sagrado fuego si primero no nos llenamos de Él? El Señor Jesús, antes de confiar a Pedro el cuidado de su rebaño, le preguntó tres veces si lo amaba. Jesús confía la misión de evangelizar sólo a quien lo ama, a quien lo ama mucho, a quien lo ama muchísimo. No basta amarlo de cualquier manera, se necesita un amor superlativo. Sólo un gran amor nos convertirá en ardientes misioneros y misioneras, nos hará soportar con gusto los sacrificios de la vida apostólica y asegurará el fruto de nuestras fatigas. El Señor, en todo lo que permite, quiere siempre y sólo nuestro bien. Digámosle de corazón: ¡Hágase tu voluntad! No sólo conformidad, sino también uniformidad con la voluntad de Dios, que es más perfecto. El amor vence todo, supera todo.", "s": 8}, {"k": "p", "t": "Examinémonos para ver si en los casos prácticos seguimos estos principios. Si lo hacemos, entonces el Señor se servirá de nosotros para hacer mucho bien, como se sirvió de san Francisco Javier. Además, si hacemos siempre la voluntad de Dios con una intención pura, nuestros días serán verdaderamente plenos, porque desde la mañana hasta la noche acumularemos permanentemente tesoros en el cielo. Al final de la vida nos daremos cuenta de que hicimos mucho, si bien en el presente nos parecerá que estamos haciendo poco.", "s": 8}, {"k": "h2", "t": "6. Votos religiosos y misioneros", "s": 9}, {"k": "h3", "t": "Vida consagrada", "s": 9}, {"k": "p", "t": "102. Nuevo bautismo. Como dicen las Constituciones, ustedes están en el Instituto para ser \"primero\" buenos y santos religiosos y religiosas, \"después\" misioneros y misioneras. Reflexionen sobre esto: nuestros Institutos son religiosos y misioneros. ¿Qué entendemos por vida consagrada en el estado religioso? Es un estado de perfección, no porque los que lo abrazan son perfectos, sino porque tienden hacia ese estado continuamente, con todo empeño. Es un nuevo bautismo, una entrega superior a cualquier sacrificio, ya que en los sacrificios le ofrecemos al Señor cosas externas, mientras que aquí nos damos a nosotros mismos. Es como un martirio permanente, sereno, a fuego lento, sacrificando los propios bienes, las propias comodidades, la propia voluntad.", "s": 9}, {"k": "p", "t": "Todos los cristianos están llamados a tender hacia la perfección de las virtudes, porque el Señor les dice a todos: \"Sean perfectos como es perfecto el Padre que está en el cielo.\" (Mt 5,48). Esta vocación a la santidad consiste esencialmente en la caridad hacia Dios y hacia el prójimo. Para los consagrados significa tender hacia la caridad perfecta, no sólo con la observancia de los mandamientos, sino también de todos los consejos evangélicos, según las propias posibilidades y la gracia de Dios.", "s": 9}, {"k": "p", "t": "103. En libertad. Ahora bien, todas las congregaciones religiosas se comprometen a través de votos a vivir los tres consejos evangélicos de pobreza, castidad y obediencia. Con ellos la voluntad es más firme, se tiene más mérito y se da a Dios no sólo lo que se tiene, sino también la libertad, como explica santo Tomás. San Anselmo agrega que, con los santos votos, no se le da al Señor sólo el uso de una cosa, sino la cosa misma: no sólo los frutos, sino el árbol. Sin embargo, los votos no nos quitan la libertad. Diría que la aumentan, ya que nos hacen más dueños de nosotros mismos, menos condicionados por las pasiones, San Agustín exclama: \"¡Feliz necesidad que nos lleva a hacer lo que es mejor!\"", "s": 9}, {"k": "p", "t": "Todos los Institutos renuevan los votos cada año. ¿Por qué? Para aumentar el fervor, para conservar su recuerdo y confirmar nuestro compromiso. No se asusten por los votos que han hecho. Vivan tranquilos como antes, o inclusive más que antes, porque, además de ser un segundo bautismo, ellos marcan el comienzo de una nueva vida de perfección, de santidad. Al Señor le gusta mucho este sacrificio total de nosotros mismos, alma y cuerpo; él nos inunda de gracias con las que nos sentimos más fuertes, más valientes, más tranquilos. Abandonémonos totalmente a él, completamente sometidos a su voluntad. Dejemos que disponga de nosotros como mejor le plazca; así pronto nos volveremos verdaderamente santos. No olviden que con la profesión religiosa no firmamos un contrato, sino que seguimos una vocación. Al Señor no le gustan los contratos. Él siempre es generoso. Si Él nos ha dado la vocación, no nos la quitará. Él no cambia, somos nosotros los que cambiamos. Sólo debemos vivir lo que hemos prometido. Nos hemos consagrado al Señor, entonces ¡adelante!, cueste lo que cueste.", "s": 9}, {"k": "p", "t": "104. Para la misión. Sus votos son votos de misioneros y misioneras. Cuando los hagan o los renueven deben pensar en las misiones, exponer sus deseos de celo ardiente y de colaborar en la evangelización. Deberíamos hacer el voto de servir a la misión aunque nos cueste la vida, contentos de morir en la brecha. Cuando hagan los votos o los renueven, recuerden que también implican todo esto. El Señor responde a estos deseos.", "s": 9}, {"k": "h3", "t": "Pobreza evangélica", "s": 9}, {"k": "p", "t": "105. \"Les he dado el ejemplo\" (Jn 13,15). Jesús ha vivido todas las virtudes, pero hay una que parece haber preferido y de la que ha querido ser su modelo en forma particular: la pobreza. También lo afirma san Pablo: \"Siendo rico, se hizo pobre por nosotros, a fin de enriquecernos con su pobreza\" (2Cor 8,9). Por lo tanto, él fue pobre en su nacimiento, y más pobre fue durante su vida, muy pobre sobre la Cruz. Jesús", "s": 9}, {"k": "nota", "t": "1 José Allamano, con una carta del 8 de diciembre de 1916, presentó un \"Tratado sobre la pobreza\", en el que ilustraba el significado del voto y de la virtud, con todas las implicaciones prácticas a las exigencias de la vida consagrada para la misión. En la conferencia a las comunidades respectivamente de los misioneros y de las misioneras, el 5 de enero 1917 lo comunicó con estas palabras: \"Desde hace tiempo deseaba ofrecerles una especie de Tratadito sobre la Santa Pobreza y desde hace dos años, con la ayuda del can. Santiago Camisassa, aquí lo tienen. Es una materia sutil y compleja. Fundándonos en grandes teólogos como santo Tomás, Suárez, san Alfonso y otros, hemos recogido lo que es verdad, pesando cada palabra, para ser exactos. Recíbanlo como la carta de su superior y, por lo tanto, de Dios. El Señor les dé luz y gracia para comprender y vivir bien el voto y la virtud de la pobreza, del que depende el espíritu y la fecundidad del Instituto\". En estas páginas se reproducen el espíritu y la substancia de este tratado, aun cuando no sea citado.", "s": 9}, {"k": "p", "t": "nació pobre por propia voluntad, eligió como Madre a María, que era una mujer pobre, y como padre y custodio a san José, que con el trabajo manual ganaba lo necesario para vivir. Durante su vida pública pudo afirmar: \"El Hijo del hombre no tiene dónde reposar la cabeza\" (Mt 8,20). También había exclamado antes, en las Bienaventuranzas: \"Felices ustedes, los pobres, porque el Reino de Dios les pertenece\" (Lc 6,20). Para ser sepultado tuvo necesidad de la caridad de una sábana y hasta del mismo sepulcro.", "s": 9}, {"k": "p", "t": "El ejemplo y las enseñanzas del Señor son el estímulo más fuerte e importante para hacernos apreciar y practicar la pobreza, con más razón a nosotros que queremos imitarlo. Todos los santos, a la luz de su ejemplo, amaron y vivieron la pobreza. San Francisco de Asís la llamaba \"mi esposa\". 106. Vida de las virtudes. En cierto modo, todas las otras virtudes reciben vida de la pobreza. En efecto, si nosotros examinamos cada virtud, vemos que existen y se desarrollan sólo si hay amor a la pobreza. ¿Puede haber fe sin pobreza? ¿Cómo puede decir que tiene fe aquel que, aun sabiendo que Jesús ha dicho: \"Felices los pobres\", considera como buenas las riquezas y afortunados a los ricos? Lamentablemente también nosotros podemos preferir a los ricos en lugar de los pobres. Si tenemos fe, es necesario que pensemos, que hablemos, que obremos según este principio de la fe: ¡\"Felices los pobres\"!", "s": 9}, {"k": "p", "t": "La esperanza está toda dirigida hacia el paraíso y no se preocupa por las cosas terrenales. Dice el autor del libro sagrado: ¡Feliz el hombre que no ha ido detrás del oro, ni ha puesto su esperanza en el dinero y en los tesoros! ¿Quién es él? Y lo proclamaremos feliz (cf Ecli 31,8-9). ¡Es tan fácil confiar en el dinero! No, no; en cambio hay que decir: \"¡Señor, en ti he puesto mi esperanza!\".", "s": 9}, {"k": "p", "t": "El amor de Dios tampoco puede subsistir sin la pobreza de espíritu. Para amar a Dios con todo el corazón es necesario no vivir apegados a nada, sobre todo a las cosas; si no el corazón permanece dividido. La razón por la que tantas personas sacrifican sus bienes materiales y abrazan la pobreza voluntaria es, justamente, para tener el corazón libre, y así poder amar a Dios y darse totalmente a Él. También para realizar obras a favor del prójimo es necesario tener el corazón alejado de las cosas de la tierra. San Bernardo, al hablar de la santidad, dice que debemos ser cuencos y no canales. Pero, con respecto a la pobreza, les digo que debemos ser sólo canales y no cuencos. Sin la pobreza de espíritu no se puede ser ni humiles ni castos. La pobreza custodia también el ardor misionero. San Bernardo aplica al desapego de las cosas las palabras de Jesús: \"Y cuando yo sea levantado en alto sobre la tierra, atraeré a todos hacia mí\". (Jn 12,32). De esto se desprende que colaboraremos en la evangelización de los pueblos en la medida en que seremos pobres, al menos de espíritu. 107. Con la fuerza del voto. El Señor puso como primera condición al joven rico: \"Si quieres ser perfecto, vende todo lo que tienes y dalo a los pobres\" (Mt 19,21). Todas las congregaciones religiosas colocan como primer voto a la pobreza porque, según santo Tomás, \"la pobreza voluntaria es el primer fundamento para alcanzar la perfección\". San Ignacio de Loyola define la pobreza como \"el muro de defensa de las órdenes religiosas\".", "s": 9}, {"k": "p", "t": "Una congregación religiosa vive y prospera según su fidelidad al espíritu de pobreza. Cuando una comunidad cede en este punto, todo el espíritu decae. Lo mismo puede decirse de cada miembro: cuanto más se vive la pobreza prometida, más se crece en santidad. Es necesario tomarla en serio. Cuando se descuida este voto, la comunidad se acerca a su fin. En cambio, si se lo observa según las Constituciones, con el verdadero espíritu, la comunidad será bendecida por Dios.", "s": 9}, {"k": "p", "t": "El voto de pobreza consiste esencialmente en renunciar al derecho de usar y disponer de los bienes temporales, según los propios intereses y sin depender del legítimo superior. Este es el voto simple, que hacemos nosotros y las congregaciones modernas. El voto solemne, en cambio, implica la renuncia al dominio radical y a cualquier propiedad sobre los bienes temporales. Esto explica la gran diferencia entre el voto simple y el voto solemne. Pero, ¿por qué hacemos voto simple? La razón es que la pobreza no consiste esencialmente en despojarse de todo, sino en renunciar al derecho de disponer según el propio arbitrio —es decir sin permiso del superior— tanto de los bienes de la comunidad como de los propios. Esta renuncia es por amor a nuestro Señor, que es la razón específica del voto. La expresión: \"¡Felices los pobres!\" es para todos; y ya el salmo decía: \"Aunque aumenten las riquezas, no pongan el corazón en ellas\" (Sal 61,11). 108. Lo necesario, como los pobres. San Bernardo dice: \"La pobreza no es una virtud en sí misma, sino el amor a la pobreza\". Un pobre puede non tener dinero, pero no por eso vivir la virtud de la pobreza. Los consagrados no sólo deben evitar todo lo que es contrario al voto, sino comprometerse a observar la pobreza en toda su perfección.", "s": 9}, {"k": "p", "t": "Por lo tanto, ¿qué se necesita para vivir plenamente la virtud de la pobreza? Abandonar todo lo que es vano y superfluo. Nada de esto debe existir en la vida de un consagrado. Entonces, afuera todo elemento rebuscado al vestirse, en las casas, en los muebles, en las comidas, en todo. San Pablo explica: \"Contentémonos con el alimento y el abrigo\" (1 Tim", "s": 9}, {"k": "p", "t": "6,8). Hagamos el voto de pobreza; por lo tanto, contentémonos sólo de lo necesario y, aun de lo necesario, contentémonos con tenerlo pobremente.", "s": 9}, {"k": "p", "t": "Para crecer en la virtud de la pobreza también hay que sufrir con paciencia y alegría por no poder contar a veces con lo necesario. ¡Es tan cómodo hacer el voto de pobreza sin sentir sus efectos! Se lo podría llamar el voto de tener todo lo necesario. Si hay algo que deseamos y no lo tenemos, bueno, hacemos un acto de pobreza. Justamente es el no tener todo lo que quisiéramos lo que nos hace practicar la pobreza. Yo digo que es bueno que a veces falte lo necesario. Este espíritu los ayudará también a no pretender excepciones en la comunidad. A mí no me gustan las particularidades. Sí, sí: lo que es necesario, es necesario; pero no olviden que el Señor nos ayuda en lo que es necesario para los pobres, no en lo que es necesario para los ricos. El que no sabe acostumbrarse a algunas privaciones nunca será un buen misionero o una buena misionera.", "s": 9}, {"k": "p", "t": "No digan que el Instituto tiene muchos bienhechores. Los bienhechores no siempre son suficientes. Además, nunca se olviden de que las ofertas son el fruto de los sacrificios de nuestros bienhechores e implican de nuestra parte no sólo que recemos por ellos, sino sobre todo que respondamos a sus sacrificios con algunas renuncias: estar contentos por tener lo necesario e inclusive de que nos falte algo. Los bienhechores tratan de proveernos de lo necesario. Cuando leo la lista de las ofrendas en el periódico, les aseguro que hago una verdadera meditación. Me detengo de tanto en tanto a pedirle a Dios por ellos, a rezar por los que murieron. ¡Esas cifras son lágrimas, son sangre! ¿Les parece justo no querer hacer ningún sacrificio?", "s": 9}, {"k": "p", "t": "La virtud de la pobreza requiere también un desapego total del corazón de las cosas necesarias y útiles que usamos. Esta es la esencia de la pobreza de espíritu. Este desapego del corazón debe ser muy importante para ustedes. Recuerden que todo apego, aun pequeño, obstaculiza el camino del crecimiento. Desprenderse de todo, de todo. Un pequeño pájaro, aunque esté atado con una cuerda o con un simple hilo, no puede volar. Por lo tanto, no estén atados a nada, ni siquiera por un hilo. Si existiera, hagámoslo pasar por el Corazón de Jesús y se transformará en un hilo de oro: el de la renuncia. Cuanto más desapegados estén de todos y de todo, mayor será el bien que harán en las misiones. A veces se va a las misiones deseando el martirio ¡y después nos perdemos discutiendo por un armario! Es la idea falsa que nos hacemos de lo necesario. Todos estos apegos también nos sacan la paz del corazón y a veces nos llevan a faltar a la obediencia. Por eso insisto: no se apeguen a nada, por pequeño que sea, para que no suceda que en las misiones, teniendo que dejar un lugar, lo desvalijen. En nuestra comunidad necesitamos este espíritu de desapego; entonces el Señor la bendecirá. 109. Cuidarlo todo. El espíritu de pobreza también significa cuidar de todo, usar las cosas con delicadeza y respeto. En cambio, a veces sucede que se cuidan las cosas propias y poco o nada las de la comunidad, como si no fueran de nadie y se las pudiera descuidar o no prestarles atención. No, esto es injusto, porque si no es lícito derrochar lo nuestro, mucho menos las cosas de la comunidad. No sólo es faltar a la pobreza, sino a la justicia. Lamentablemente es el punto más descuidado y sobre el que es necesario insitir más.", "s": 9}, {"k": "p", "t": "Espíritu de pobreza significa, además, cooperar para que nada se deteriore o se desperdicie, recordando que vivimos de la caridad. Da gusto ver a alguien interesado por las cosas de la comunidad: cerrar una puerta, una ventana que se golpea, poner en su lugar un objeto, apagar una luz, etc. Con esto no quiero decir que se tengan que ocupar de lo que no les corresponde, pero hay muchas pequeñas cosas que nos conciernen a todos: no arruinar nada, tratar todo con cuidado, no usar de más algo cuando basta usar menos, etc. Es realmente necesario que adquieran este espíritu: cuidarlo todo. Miren, yo todavía tengo el mismo reloj de cuando era seminarista...", "s": 9}, {"k": "p", "t": "La pobreza es una cosa delicada y se falta a la misma fácilmente. Si también tuviéramos en abundancia, no se debe dar más de lo debido. Es necesario tener esta convicción: son cosas de Dios. Acostúmbrense desde ahora a esta delicadeza, a este cuidado y atención en el uso de las cosas; de lo contrario, cuando estén en las misiones derrocharán lo que tienen. Se necesita el compromiso de todos, este es el espíritu de unión, de familia. Todos interesados, todos comprometidos por el bien del Instituto. Tenemos que regularnos de esta manera para que el buen Dios nos ayude ahora y en el futuro. No debemos esperar ociosos que nos ayude la Providencia; el Señor no siempre está obligado a hacer milagros. 110. Trabajar como los pobres. Hemos hablado de la pobreza como desapego afectivo y efectivo de las cosas temporales. La pobreza también tiene otro aspecto que es el de trabajar como trabajan los pobres. Nosotros como misioneros y misioneras debemos trabajar materialmente. Cuando trabajamos, pensemos que ahorramos tantos gastos a la comunidad. También el tratar de ganar algo para la comunidad es un deber de la pobreza. Es necesario ser miembros activos porque esto no es un colegio donde se paga, sino una familia donde todos pagamos del mismo modo. Si podemos ser útiles en algo, debemos considerarnos afortunados y, por lo tanto, hacerlo con gusto y también por deber.", "s": 9}, {"k": "p", "t": "Si todos los consagrados deben vivir desapegados de todo y tener el espíritu de pobreza, con mucha más razón los misioneros y las misioneras.", "s": 9}, {"k": "h3", "t": "Castidad por el Reino", "s": 9}, {"k": "p", "t": "111. Sean castos. Como atestiguan las Sagradas Escrituras, la excelencia de la castidad es muy grande. El mismo Redentor quiso nacer de una madre Virgen. El Apóstol Juan supo amar al Señor en modo tan particular porque era puro, casto, virgen. El Señor, al morir, le confió su madre: le confió la Virgen a un virgen.", "s": 9}, {"k": "p", "t": "La palabra castidad normalmente se hace derivar de la palabra \"castigo\"; y la razón, según santo Tomás, está en que en los castos la concupiscencia es castigada, es decir mortificada por medio de la razón. Como consagrados vivamos la castidad virginal que consiste formalmente en el propósito interno, firme y constante de no admitir nada que sea contrario a la integridad virginal. El padre Semeria, justamente, hace notar que la castidad virginal no tiene que ver sólo con el cuerpo, sino precisamente con el espíritu. Lo mismo afirma san Agustín: \"¿Quién puede dudar de que la castidad, cuando es una virtud, pertenezca a la dimensión espiritual? Ella no puede flaquear si permanece firme en el corazón, en la voluntad\".", "s": 9}, {"k": "nota", "t": "2 La teología ascética, en tiempos de José Allamano, ilustraba la virtud de la castidad perfecta por el Reino desde el punto de vista moral. Él, que había sido formado con este enfoque no muy de ascuerdo con el Reino, se centraba menos en la teología de la castidad, que conocía muy bien y proponía, desarrollando más bien los compromisos para custodiarla.", "s": 9}, {"k": "p", "t": "La castidad virginal es sumamente necesaria para los consagrados y las consagradas. Como misioneros y misioneras estarán expuestos a los más graves peligros, por lo que deberán estar sólidamente fundados en esta virtud. Para hacer el bien a aquellos pueblos, ustedes deben ser reconocidos como seres \"sobrenaturales\", que no tienen nada que ver con este mundo: \"Ustedes no son del mundo\" (Jn 15,19). La castidad los hará aparecer como tales, y bastará su presencia para atraer a los corazones. Si serán castos, siempre castos, estoy seguro de que todo saldrá bien. El Señor se comunica a los puros de corazón, y ustedes harán milagros. Por lo tanto, dirijo a cada uno de ustedes las palabras de san Pablo a Timoteo: \"Consérvate puro\" (1Tim 5,22). ¿Cómo se puede hacer caber en una botella de agua una botella de vino? Se quita el agua y se pone el vino. Muy bien: vaciemos nuestro corazón de todos los amores mundanos y llenémoslo del amor de Dios. Quiero que se sientan atraidos hacia la castidad más por la belleza de la virtud que por la fealdad del vicio. ¡Sean castos!", "s": 9}, {"k": "p", "t": "112. En vistas del sacerdocio. La Iglesia Católica, inspirada por el Espíritu Santo, desde los tiempos apostólicos vio la necesidad de que sus ministros resplandecieran por vivir la castidad. El sacerdote necesita de todas las virtudes, pero de esta en modo particular. Sobre todo a los que aspiran al sacerdocio los exhorto a reflexionar bien sobre la necesidad de esta virtud. Recuérdenlo: uno de los primeros signos de vocación es la castidad. Se necesita una castidad sólida y sincera. Busquen la pureza de vida, cueste lo que cueste. Examínense atentamente. ¿Están preparados para conservar durante toda la vida una castidad perfecta y hacer todos los sacrificios internos y externos necesarios para conservarla? Por lo tanto, si confiando en la ayuda divina sienten la fuerza y la voluntad, ¡ánimo y no tengan miedo! Dios, que es su esperanza, será también su fuerza. 113. Virtud del corazón. San Pablo escribe a los Tesalonicenses: \"Les rogamos y los exhortamos en el Señor Jesús, que vivan conforme a lo que han aprendido de nosotros sobre la manera de comportarse para agradar a Dios. La voluntad de Dios es que sean santos, que se abstengan del pecado carnal, que cada uno sepa usar de su cuerpo con santidad y respeto\" (1 Tes 4,1-4). Y sobre ese precepto el Apóstol habla muchas otras veces. ¡La castidad es la virtud de nuestro corazón! No se desanimen si se sienten tentados. El oro se purifica en el fuego y el Señor nos purifica con estas debilidades. Si será para nuestro bien, él nos librará de ellas, pero mientras tanto desea que seamos purificados. Seamos humildes y tengamos confianza, y sigamos adelante unidos al Señor. Expresemos siempre nuestro amor a Dios; no cuesta mucho hacerlo, a veces basta un suspiro. 114. Un tesoro en vasijas de barro. La castidad es un \"tesoro que llevamos en recipientes de barro, para que se vea bien que este poder extraordinario no procede de nosotros, sino de Dios\" (2Cor 4,7), y para custodiarlo son necesarias la vigilancia y, sobre todo, la oración. Esto lo afirman todos: la Sagrada Escritura, los Santos Padres, los maestros de espíritu. Rezar, rezar bien, rezar siempre. Si la oración es necesaria para obtener todas las gracias, con más razón lo es para mantenernos castos. San Cipriano afirma: \"Entre los medios para obtener la castidad, el primero y principal es pedir ayuda al cielo\". San Gregorio, a su vez, dice que \"la oración es la tutela de la pureza\". San Juan Crisóstomo afirma que el ayuno y la oración son como dos alas que llevan al alma por encima de las tempestades, la hacen más ardiente que el fuego, terrible ante los enemigos. Y concluye: \"Nada ni nadie es más potente que aquel que reza\".", "s": 9}, {"k": "p", "t": "Por lo tanto, pidámosle al Señor la castidad. Pidámosla siempre. Recuérdenlo: no basta rezar de a ratos y en la capilla, no basta decir tres \"Ave María\" a la mañana y a la noche, no basta con llevar a cabo las comunes prácticas de piedad a lo largo del día, sino tener el espíritu de oración. Adquiramos el hábito, especialmente en las tentaciones, de refugiarnos enseguida en el Corazón de Jesús y dejemos que sea él quien responda. Así procedía san Agustín, que encontraba refugio y reposo en las llagas del Salvador Divino. Las tentaciones siempre estarán, pero allí, en el Corazón de Jesús, no puede suceder nada.", "s": 9}, {"k": "p", "t": "Un medio muy potente, sin el cual es casi imposible mantenerse castos, es una tierna devoción a María Santísima. Ella es la que concede todas las gracias, por lo tanto, también ésta. Pongamos nuestra castidad bajo su especial protección, consagrémosla a ella, diciendo con frecuencia: \"¡Madre purísima, Madre castísima, Virgen de las vírgenes, ruega por nosotros!\". Recemos y Dios nos dará la gracia inestimable de conservarnos castos durante toda la vida.", "s": 9}, {"k": "p", "t": "Para custodiar la castidad también es necesaria la mortificación externa e interna, que siempre fue practicada por todos los santos, en todos los tiempos, y por todas las personas que quieren vivir como buenos cristianos. San Pablo decía: \"castigo mi cuerpo y lo tengo sometido, no sea que después de haber predicado a los demás, yo mismo quede descalificado\" (1 Cor 9,27). Querer tratar delicadamente el cuerpo y pretender que no se rebele, es un sin sentido: \"La carne desea contra el espíritu y el espíritu contra la carne. Ambos luchan entre sí y, por eso, ustedes no pueden hacer todo el bien que quieren” (Gál 5,17).", "s": 9}, {"k": "p", "t": "Mortificar el gusto, es decir comer para vivir y poder realizar el propio deber, y no vivir para comer. No digo que dejen lo necesario, no, sino que sepan hacer tantas pequeñas mortificaciones. Mortificar los ojos: quiero que sean espontáneos, pero también reservados y mortificados. Para adquirir este dominio sobre los propios ojos, es útil privarse, no digo siempre, de mirar lo que es lícito. Es verdad que los santos sabían elevarse a Dios mirando una flor, pero a veces también podemos dejar de mirar. Acostumbrar el cuerpo al frío y al calor, a lo duro y no a lo blando. Escapar del ocio estando siempre ocupados. Por lo tanto, trabajar no sólo por deber, por obediencia, por pobreza, sino también para dominar el cuerpo. Mortificar el orgullo, la soberbia, practicando la humildad. Pobres de los que no son humildes: \"El que se cree muy seguro, ¡cuídese de no caer!\" (1 Cor 10,12). San Francisco de Sales decía: \"La castidad sin humildad es vanidad\".", "s": 9}, {"k": "p", "t": "Estoy seguro de que en las misiones estarán tranquilos y seguros sobre este punto, porque el Señor abundará en gracia, si viven muy unidos a él y usan todos los medios de los que hemos hablado.", "s": 9}, {"k": "h3", "t": "Obediencia misionera", "s": 9}, {"k": "p", "t": "115. Habitual en todos. De los tres votos, el más excelente es el de la obediencia. De hecho, con él se le ofrece a Dios algo más de lo que se le ofrece con la pobreza y la castidad.", "s": 9}, {"k": "p", "t": "La virtud de la obediencia debe ser habitual en todos. Basta pensar en el ejemplo de Jesús: \"Tengan en ustedes los mismos sentimientos de Cristo Jesús. Él, que era de condición divina, no consideró esta igualdad con Dios como algo que debía guardar celosamente: al contrario, se anonadó a sí mismo, tomando la condición de servidor y haciéndose semejante a los hombres. Y presentándose con aspecto humano, se humilló hasta aceptar por obediencia la muerte\" (Fil 2,5-8); \"Mi comida es hacer la voluntad de aquel que me envió y llevar a cabo su obra\" (Jn 4,34); \"El que me envió está conmigo y no me ha dejado solo, porque yo hago siempre lo que le agrada\" (Jn 8,29).", "s": 9}, {"k": "p", "t": "Los santos dicen que la obediencia es el camino seguro hacia el paraíso. San Juan Crisóstomo la llama: \"navegación segura, puerta del paraíso\". San Agustín agrega que la obediencia es el custodio de todas las virtudes. Y santo Tomás afirma que es superior a todas las otras virtudes, porque le ofrece a Dios el mejor don: nuestra voluntad.", "s": 9}, {"k": "p", "t": "La obediencia hace milagros y, si serán obedientes, los harán también ustedes, sobre todo cuando se trata de la evangelización. Lo que importa no es hacer mucho o poco, sino obedecer. La obediencia es la que nos ayuda a destruir la soberbia y le devuelve la paz al corazón. Así estamos seguros de realizar siempre la voluntad de Dios. ¡Esta no es la casa ni de las voluntades ni de las obediencias a medias! 116. Virtud fundamental. En una comunidad religiosa la obediencia es totalmente necesaria. Con más razón en las misiones, como dicen las Constituciones: \"La virtud fundamental de un Instituto Misionero es el espíritu práctico de obediencia absoluta a los superiores. Sin ella no es posible la unidad en el trabajo y, como consecuencia, el éxito en el apostolado\". 3 Estas palabras fueron tomadas literalmente de la Regla de los Padres Blancos. Todos los medios para llegar a ser un día", "s": 9}, {"k": "nota", "t": "3 José Allamano aquí cita el artículo 37 de las Constituciones de los Misioneros (1909) y el artículo 45 de las Constituciones de las Misioneras (1913).", "s": 9}, {"k": "p", "t": "misioneros y misioneras idóneos están concentrados en la obediencia. Nunca se los repetiré lo suficiente: obediencia absoluta, si quieren ser buenos misioneros y misioneras. Obediencia no sólo a las disposiciones, sino también a los deseos de los superiores. Los inconvenientes que se verifican en las misiones generalmente son causados por la falta de obediencia. Esta es la virtud principal y fundamental del Instituto y, diría, debemos tenerla incorporada. Como san Ignacio 4 , quiero que la obediencia sea algo que los caracterice.", "s": 9}, {"k": "p", "t": "117. Virtud sobrenatural. Debemos proponernos obedecer al superior \"como al Señor\". Es el motivo sobrenatural el que da valor y mérito de virtud a la obediencia. Obedecer por motivos humanos no es lo que Dios quiere de nosotros, ni lo que nos va a diferenciar, en el mundo, de todos los que obedecen órdenes porque no tienen más remedio, o por intereses de lucro, o por respeto humano. Nosotros, en cambio, debemos ver a Dios en el superior: \"¡Es Dios!\"", "s": 9}, {"k": "p", "t": "Grábenselo bien en la mente y no lo olviden nunca: es absolutamente necesario que nuestra obediencia se base en este motivo sobrenatural. Por lo tanto, debemos tener fe y no limitarnos a las apariencias o a lo que se ve en la superficie. ¡Pobre del que obedece creyendo que lo hace hacia una persona humana! Nuestra obediencia es una virtud sobrenatural", "s": 9}, {"k": "nota", "t": "4 José Allamano asumió la \"Carta sobre la obediencia\" que san Ignacio de Loyola había dirigido a la comunidad de los Jesuitas, proponiendo a los Misioneros y a las Misioneras de la Consolata su contenido y espíritu como característica propia. La renovación que se dio en la Iglesia sobre el ejercicio de esta virtud, junto al diálogo, incluye también la actitud de disponibilidad total a la obediencia, que Allamano llama \"perfección de la obediencia\" o \" obediencia ciega\". Conservamos su terminología, aun cuando ya no se use demasiado, para poder expresar mejor la profundidad de su pensamiento.", "s": 9}, {"k": "p", "t": "en la medida en que obedecemos a Dios en la persona del superior. Si uno tiene espíritu de fe, no tendrá dificultad en obedecer a cualquier superior y a cualquier decisión. 118. Universal, inmediata, cordial, simple. Nuestras Constituciones dicen que la obediencia debe ser universal, inmediata y cordial. Después, casi como coronándola, ser sencilla y generosa, que son características propias de la obediencia ciega. Ante todo, obediencia universal, obedeciendo a todos, sin hacer diferencias entre un superior y otro. Quien no tiene esta obediencia no puede gustar al Señor; tampoco podrá avanzar en el camino de la santidad. Por lo tanto, obediencia universal quiere decir también no hacer diferencias entre las diferentes formas de gobernar, entre pedidos grandes y pequeños, entre substancia y accidente. Este es el espíritu que quiero que tengan. No obedecer en general, sino hasta en los mínimos particulares, con respecto al lugar, al tiempo y al modo. El Señor, en vistas de nuestra buena voluntad y como premio por nuestra obediencia, hará su parte; de esa manera hasta haremos cosas extraordinarias. Algo hecho por capricho sale mal, porque el Señor no lo bendice.", "s": 9}, {"k": "p", "t": "San Bernardo dice que el verdadero obediente no se hace esperar y está listo para aceptar y realizar lo que le pide su superior. La obediencia debe ser inmediata, nuestro pan de cada hora, de cada minuto. No se puede llamar verdadera obediencia cuando se duda si realizarla o no o se la quiere llevar a cabo a su manera. Obedecer inmediatamente, en todo. No todo lo que es bueno está bien hecho. Lo es cuando el Señor lo quiere. Es necesario hacer no lo que se quiere, sino lo que se debe hacer, que es lo que establece la obediencia. Quien descuida estas disposiciones, no sólo no tiene el espíritu de obediencia, sino tampoco el de comunidad.", "s": 9}, {"k": "p", "t": "Además de inmediata, la obediencia debe ser cordial. San Pablo, escribiendo a los Romanos, dice: \"Gracias a Dios, ustedes, después de haber obedecido, han obedecido de corazón a la regla de doctrina, a la cual fueron confiados\" (Rom 6,17). Si no se obedece de corazón, la obediencia es imperfecta y se pierden muchos méritos. San Bernardo dice que la alegría en el rostro y la dulzura en las palabras son una buena forma de coronar la obediencia. Por lo tanto, no obedezcan de mala gana, sino cordialmente.", "s": 9}, {"k": "p", "t": "Es necesario disponer la voluntad a obedecer enseguida. Si hay dificultades u observaciones que hacer, manifestémoslas, pero después alegrémonos de lo que dispone la obediencia: \"Dios ama al que da con alegría\" (2 Cor 9,7). ¡Qué desagradable es manifestar el propio rechazo en el rostro, en los gestos, en las palabras!", "s": 9}, {"k": "p", "t": "La perfección de la obediencia tiene tres grados: realizar lo que se nos pide, unir nuestra voluntad a la del superior y aceptar con nuestra inteligencia lo que él dispone. Es necesario que sean generosos; no nos contentemos con el primer o el segundo grado, sino lleguemos hasta el final, renunciando a nuestros puntos de vista. Esta es la obediencia ciega —¡pero que \"ve\" muy bien!— que acoge con sencillez una orden y la cumple. Por eso, como se darán cuenta, obedeciendo avanzan mejor y viven más tranquilos. Obedecer ciegamente no quiere decir hacer las cosas sin pensar; es más, deben estar bien atentos para realizarlas de la mejor forma posible. Vista de esta manera, pueden darse cuenta de lo sabia que es la obediencia. Examínense con frecuencia sobre el modo en que la viven y propónganse tender hacia la perfección. El que obedece ciegamente tiene muy buena vista y ve profundamente en las cosas espirituales, porque ve con los mismos ojos de Dios.", "s": 9}, {"k": "p", "t": "119. Formarse a la obediencia. ¿Cuáles son los medios para formarnos a esta obediencia? Repito los principales: ante todo, la humildad. El humilde sabe que se equivoca y no se aferra a su propio juicio; y si hasta el superior se equivocara al pedir algo, uno no se equivoca nunca si le obedece. Después, ver a Dios en el superior y en sus indicaciones. Además, imitar los ejemplos de nuestro Señor, que fue obediente hasta la muerte en la cruz. Por último, seguir los ejemplos de los santos. ¡La obediencia es la astucia de los santos!", "s": 9}, {"k": "p", "t": "120. Obediencia a las Constituciones. San Vicente de Paul, cuando decidió dar una Regla a su Congregación, lo hizo con estas palabras: \"Les presento las Reglas que el Señor me ha inspirado; recíbanlas de mis manos como de las manos de Dios\". Si él dijo esto, yo también puedo decirlo. De hecho, les puedo asegurar que quien me guiaba era el Señor. Yo no quiero cosas extraordinarias, pero en las cosas ordinarias les aseguro que siempre me ha guiado Dios. Cada palabra fue meditada, estudiada; sobre ellas he rezado, trabajado durante años, y ahora se han convertido en voluntad de Dios. Deseo que las reciban con espíritu de fe; se puede decir que la santificación de ustedes depende de cómo las recibirán. Estúdienlas y obsérvenlas, dando la máxima importancia a las cosas grandes así como a las pequeñas. Todo es oro. Confío mucho en que la obediencia a las mismas ayudará a conservar el espíritu de la comunidad. No estamos en un colegio, sino en una familia donde debemos santificarnos mutuamente. Cada uno de ustedes debería ser una columna del Instituto, de manera tal que los que vengan después puedan ver en ustedes un modelo a imitar. Si se perdieran las Constituciones, que cada uno de ustedes sea una constitución viviente, siempre.", "s": 9}, {"k": "h2", "t": "7. Actitudes misioneras", "s": 10}, {"k": "h3", "t": "Pasión misionera", "s": 10}, {"k": "p", "t": "121. Hasta dar la vida. El ardor apostólico, según san Agustín, es un efecto del amor; es más, no se diferencia de él. Pero no es efecto de un amor cualquiera, sino de un amor intenso y ardiente. El ardor apostólico es el carácter propio del misionero y de la misionera. No se va a las misiones por capricho, o por turismo, sino únicamente por amor a Dios, que es inseparable del amor al prójimo. Por lo tanto, no sólo como cristianos, sino también, y mucho más, como misioneros, tenemos el compromiso de buscar la gloria de Dios colaborando en la salvación de las almas. 1 Este es el fin de nuestra vocación especial. Es necesario tener tanta caridad hasta dar la vida. Sin este amor pueden tener el nombre de apóstoles, pero no la realidad, ni la substancia del apostolado.", "s": 10}, {"k": "p", "t": "Dice san Dionisio Areopagita que cooperar en la salvación de las almas es la más divina de todas las obras divinas. Dios", "s": 10}, {"k": "nota", "t": "1 José Allamano usaba la expresión \"salvar las almas\" para indicar la tarea específica del apóstol. Sin traicionar su pensamiento, aquí normalmente es modificada por \"colaborar en la salvación de las almas\", según el pensamiento de Pablo en 1 Cor 3,9, texto usado también por José Allamano, en el que los apóstoles son precisamente presentados como \"colaboradores de Dios para la salvación\".", "s": 10}, {"k": "p", "t": "quiere servirse de nosotros. Como afirma san Pablo, \"nosotros somos colaboradores de Dios\" (1 Cor 3,9). Piensen en esto: ¡colaboradores de Dios para la salvación de la humanidad! ¡Como si Dios necesitara de nuestra ayuda! A nosotros la Iglesia nos confía el gran mandato de la evangelización que recibió del Resucitado. Es la obra por excelencia.", "s": 10}, {"k": "p", "t": "La creación, la encarnación, la redención, la misión del Espíritu Santo, todo tiene como fin la salvación de la humanidad. \"Por eso soporto estas pruebas por amor a los elegidos, a fin de que ellos también alcancen la salvación que está en Cristo Jesús\" (2 Tim 2,10). Dios mismo nos suplica que nos comprometamos con su misma causa: ¿quién puede no escuchar su voz? ¿Quién puede no sentirse afortunado con una vocación como esta?", "s": 10}, {"k": "p", "t": "\"Yo los elegí a ustedes y los destiné para que vayan y den fruto, y ese fruto sea duradero\" (Jn 15,16). Este llamado es un gran don de Jesús, pero también un gran deber para nosotros. \"¡Ay de mí si no predicara el Evangelio!\" (1 Cor 9,16). Sin embargo, acuérdense de que no basta con predicar, también debemos comprometernos en todo lo que hagamos y aceptar todos los sacrificios de la vida apostólica, cuesten lo que cuesten. \"¡Trabajemos, trabajemos —exclamaba José Cafasso—, descansaremos en el paraíso!\" No lamentemos el dispersarnos un poco por tener que cumplir con nuestros compromisos misioneros. Sólo recemos mucho, como hacía san Francisco Javier. 122. Se necesita fuego para ser apóstoles. Buscar la paz y la calma en los monasterios sólo para huir del cansancio, no es amor a Dios. ¡Este tiempo es para trabajar y sacrificarnos! Hagamos nuestras las palabras de Pablo: \"Todo lo hago por amor al Evangelio!\" (1 Cor 9,23). ¡Todo, todo! ¡Me daré totalmente y me sacrificaré! Al Señor no tendremos que presentarle afectos o deseos, sino trabajo apostólico.", "s": 10}, {"k": "p", "t": "San Bernardo dice que el apóstol debe ser encendido por la caridad, completado por la ciencia, estable por la constancia. Por lo tanto, el verdadero apóstol es encendido por la caridad, es decir por la pasión de hacer conocer y amar al Señor; busca el bien de las personas y no de sí mismo. Jesús dice: \"Yo he venido a traer fuego sobre la tierra, ¡y cómo desearía que ya estuviera ardiendo!\" (Lc 12,49). Se necesita fuego para ser apóstoles. Si no se es ni calientes ni fríos, es decir tibios, nunca lograremos nada. El hombre vive en la medida en que obra por amor a Dios. Se puede estar unidos íntimamente a Dios y, al mismo tiempo, trabajar. Si hay amor, hay celo, y esto hará que no pongamos reservas o demoras para darnos
