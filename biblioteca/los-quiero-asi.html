ta virtud. Su testimonio de vida atraerá la benevolencia y el respeto de la gente y harán mucho bien. Además, san Juan el Bautista fue muy humilde. Cuando el Señor se presentó ante él para hacerse bautizar, sólo aceptó hacerlo por obediencia. Frente a la multitud se declaró indigno de desatar los cordones de las sandalias del Mesías. Y cuando Jesús comenzó su vida pública, desapareció: \"Es necesario que él crezca y yo disminuya\" (Jn 3,30). También el misionero y la misionera deben ser humildes. Harán el bien en la medida en que serán humildes, atribuyendo todo a Dios y nada a sí mismos. Por último, Juan el Bautista, después de la preparación en el desierto, se dedicó a la predicación para predisponer los corazones a recibir al Señor; y en este ministerio demostró celo y fortaleza hasta la muerte. Ustedes no fueron llamados a ser Trapenses o Cartujos, sino misioneros y misioneras: a trabajar para la extensión del Reino del Señor, sacrificando para este fin inclusive la propia tranquilidad.", "s": 15}, {"k": "p", "t": "A veces se me cruzó por la mente la idea de no ocuparme más ni de ustedes ni de los sacerdotes jóvenes, para ocuparme más de mí mismo. \"¡No, no! —me dice el Señor— yo quiero que me des a conocer por medio de estos sacerdotes, de estos misioneros y misioneras. Luego, cuando estarás en el paraíso, me contemplarás todo lo que quieras\". A veces me encierro en mi habitación y dejo que suene el timbre... Es para no volverme árido, no derramar todo afuera, todo a los demás. En fin, se hace lo que se puede.", "s": 15}, {"k": "p", "t": "Juan el bautista, con una vida de sacrificio y de celo se convirtió en un gran santo e, incluso, después de tantos siglos, es honrado sobre la tierra, mientras nadie habla más de tantos otros que, aquí en la tierra, hicieron tanto ruido. Queridos míos, ánimense con estos ejemplos y traten de perfeccionarse en aquellas virtudes de las que él nos ha dado ejemplo. De él se dijo que era \"una luz ardiente y resplandeciente\"; del mismo modo ustedes deben arder de amor a Dios, para ser luz en medio de los pueblos.", "s": 15}, {"k": "h3", "t": "Santos Pedro y Pablo", "s": 15}, {"k": "p", "t": "192. San Pedro. Tenía una fe viva. Cuando el Señor interrogó a los apóstoles: \"¿Qué dice la gente sobre el Hijo del hombre?\", ellos le respondieron: \"Unos dicen que es Juan el Bautista, otros Elías, y otros Jeremías o alguno de los profetas\". Que los hombres digan esto está bien; pero \"y ustedes, ¿quién dicen que soy?\". Respondió Simón Pedro: \"Tú eres el Mesías, el Hijo de Dios vivo\" (cf. Mt 16,16). ¡Qué hermosa profesión de fe! Lo declaró verdadero Hijo de Dios y lo hizo públicamente. Entonces el Señor le prometió hacer de él la piedra fundamental de su Iglesia, dándole el supremo poder de desatar y atar sobre la tierra.", "s": 15}, {"k": "p", "t": "La fe de san Pedro se manifestó también en otras circunstancias, como cuando Jesús hizo la promesa de dar su Carne como alimento y su Sangre como bebida, y muchos se escandalizaron y se fueron. Entonces el Señor se dirigió a sus apóstoles: \"¿También ustedes quieren irse?\". Pero Pedro respondió: ¡No, Señor, nosotros estaremos siempre contigo, porque \"¡tú tienes palabras de vida eterna!\" (cf. Jn 6,68). Y así en muchas otras circunstancias, demostrando ser uno de los primeros, es más el primero por la fuerza de su fe. Es verdad que el Señor predijo la triple negación, pero también es verdad que enseguida agregó: \"Yo he rogado por ti, para que no te falte la fe\" (Lc 22,32).", "s": 15}, {"k": "p", "t": "San Pedro era todo fuego de amor por Jesús. Después de la resurrección él lo interrogó: \"Simón, hijo de Juan, ¿me amas más que estos?\" (Jn 21,15). Pedro, recordando el haberlo renegado, no se atrevía a decir que lo amaba más que a los demás, y sólo respondió: bueno... confío en tu corazón: \"Señor, tú lo sabes todo; sabes que te quiero\" (Jn 21,17). De este amor Pedro hacía brotar el compromiso de hacer amar a Jesús, de soportar tanto cansancio apostólico hasta el martirio.", "s": 15}, {"k": "p", "t": "Miren, lo que distingue a los apóstoles, a los misioneros y las misioneras es el amor por nuestro Señor. No un amor simple, afectuoso, sensible, sino fuerte en medio de los sufrimientos. No ese amor que dura sólo un día. ¡San Pedro no amó de esa manera! El Señor quiere que quien colabora en la salvación de las almas tenga un amor fuerte y constante. Cada uno de nosotros debería poder decir que ama a Jesús más que a todos los demás, o al menos que desea amarlo así. Y esto, sépanlo bien, ¡no es soberbia! 193. San Pablo. San Juan Crisóstomo dijo: \"¡El corazón de Pablo era como el Corazón de Jesús!\". ¡Una misma llama! En sus cartas, Pablo no se cansaba de repetir el nombre de Jesús; de cómo no le importaban las fatigas y los sacrificios con tal de salvar almas: \"De buena gana entregaré lo que tengo y hasta me entregaré a mí mismo, para el bien de ustedes\" (2 Cor 12,15). Y es, justamente, este amor ardiente hacia el Señor el que lo impulsaba a darse a todos, como si hubiera estado en deuda con ellos. Quien ama actúa; si alguien no se compromete es porque no tiene amor. Él trabajaba por este único motivo: amar y hacer amar al Señor.", "s": 15}, {"k": "p", "t": "Un amor profundo que lo llevaba a exclamar: \"¿Quién podrá entonces separarnos del amor de Cristo?\" (Rom 8,35). Y concluía diciendo que nada ni nadie habría podido separarlo: ¡ni los hombres, ni los demonios, ni los ángeles! Y no eran puras palabras, porque, en efecto, nunca se desanimó ante las persecuciones, las flagelaciones, las lapidaciones, los peligros por tierra y por mar, los ataques de sus enemigos.", "s": 15}, {"k": "p", "t": "También nosotros hagámoslo todo para que el Señor sea glorificado y amado por todos. Así se demuestra el amor: trabajar, cansarse, sacrificarse por él; no dejarse separar de él por ninguna tentación, ninguna prueba, ninguna dificultad; atribuirlo todo a él y nada a nosotros mismos. Este es el amor que tenemos que pedirle a san Pablo: amor ardiente, operativo, constante.", "s": 15}, {"k": "p", "t": "Además del amor, otra característica de san Pablo es la energía, la tenacidad, el ardor. Fue tan tenaz en la evangelización de los no crsitianos cuanto lo había sido precedentemente en perseguir a los cristianos. Después del trayecto hacia Damasco, \"una luz que venía del cielo lo envolvió de improviso con su resplandor. Y, cayendo en tierra, oyó una voz que le decía: Saulo, Saulo, ¿por qué me persigues? Él preguntó: ¿Quién eres tú, Señor?\". \"Yo soy Jesús, a quien tú persigues\" (Hech 9,3-5). Entonces él respondió con estas hermosas palabras: \"Señor, ¿qué quieres que haga?\", que era como decir: \"¡Sí, Señor, te reconozco como mi Dios, me doy a ti totalmente, listo para hacer todo lo que quieres que haga!\". Sin concederle nada a la carne y a la sangre, puso su carácter ardiente a disposición del Señor, para la propagación de la fe. ¡Cuánta energía tenía! Aquellos que son tenaces hacen mucho bien. Necesitamos gente enérgica. Ser tenaces de carácter. El que es enérgico se santifica. Pueden hacerse santos sin hacer milagros, ¡pero no sin trabajar! Sin energía no podrán hacer el bien en las misiones. ¡Coraje, energía, voluntad de hierro! Pero para esto hay que amar mucho a nuestro Señor, amarlo sin medida, como lo amó san Pablo. No olvidemos nunca al apóstol de los gentiles. Él es nuestro protector y modelo natural.", "s": 15}, {"k": "h3", "t": "San Ignacio de Loyola", "s": 15}, {"k": "p", "t": "194. En el santuario de san Ignacio, a los pies de la gran estatua, hay un ángel que lleva el escudo del santo con la frase: \"Ad majorem Dei gloriam\". Toda su vida, toda la misión está sintetizada en estas palabras: De hecho, su lema era: \"¡Todo para la mayor gloria de Dios!\". No se ocupaba de otra cosa que no fuera la gloria de Dios.", "s": 15}, {"k": "p", "t": "San Ignacio fue misionero, fundador y superior de misioneros; por lo tanto, conoció sus necesidades y los protege desde el cielo. Apenas fundada la Compañía de Jesús, junto a los primeros compañeros hizo el voto de ir a Tierra Santa para venerar esos lugares y dedicarse a la evangelización. Al no poder realizar este deseo, fue a Roma para ponerse a disposición del Papa. En las Constituciones incluyó un voto de \"Misión\" y envió a san Francisco Javier a las misiones junto a tantos otros jesuitas.", "s": 15}, {"k": "p", "t": "Ignacio es un gran santo, que tuvo la energía para santificarse en medio de tantas peripecias y fundar una Congregación de Religiosos enérgicos, para la gloria de Dios. Era uno de los protectores de san José Cafasso. No obstante gozase del bien que hacía la Compañía que había fundado, decía que si el Señor hubiera querido suprimirla, habría sufrido, pero le habría bastado un cuarto de hora de oración ante el sagrario para volver a recuperar la paz del corazón.", "s": 15}, {"k": "p", "t": "¿Qué debemos hacer en su honor? Ante todo, invocarlo, rezarle. Cuando digan esa hermosa oración: \"Anima Christi\", 2 recuerden que es atribuida a san Ignacio. Díganla siempre después de la Comunión; yo no la descuido nunca. San Ignacio escribió pocas oraciones, pero muy eficaces para despertarnos, porque estaba lleno de amor al Señor.", "s": 15}, {"k": "p", "t": "Además, tenemos que imitarlo buscando la gloria de Dios, sólo la gloria de Dios, la mayor gloria de Dios. Estamos en este mundo sólo para conocer, amar y hacer amar al buen Dios. Él sólo podía crearnos para él, por eso nosotros debemos buscarlo sólo a él, buscar su mayor gloria, haciendo su voluntad. Hagamos todo lo que le gusta al Señor; busquemos no sólo el bien sino lo mejor; deseemos, preocupémonos por hacer que el Señor sea glorificado. San Ignacio tenía este deseo ardiente; el fuego del amor y del apostolado le quemaba el corazón. Obremos de manera tal que el Señor no tenga que avergonzarse de nosotros. San Ignacio no era un flojo y yo no quiero flojos, sino personas alegres y activas, que no se disipen. También quiero voluntades de hierro: capaces de", "s": 15}, {"k": "nota", "t": "2 La oración completa es: \"Alma de Cristo, santifícame. Cuerpo de Cristo, sálvame. Sangre de Cristo, embriágame. Agua del costado de Cristo, lávame. Pasión de Cristo, confórtame. Oh buen Jesús, óyeme. Dentro de tus llagas, escóndeme. No permitas que me aparte de ti. Del enemigo malo, defiéndeme. En la hora de mi muerte, llámame y mándame ir a ti, para que con tus santos te alabe, por los siglos de los siglos, amén\". Esta oración que José Allamano atribuye a san Ignacio, es en realidad algunos siglos anterior a él.", "s": 15}, {"k": "p", "t": "santificarse, y que todo lo que hagamos aquí y en las misiones, ¡sea para la mayor gloria de Dios!", "s": 15}, {"k": "h3", "t": "San Francisco Javier", "s": 15}, {"k": "p", "t": "195. San Francisco Javier es patrono de nuestro Instituto. Enseguida, después de san Pablo, él es el modelo de los misioneros y las misioneras. Su vida, según el padre Chaignon, se sintetizaba en estas palabras: \"Todo de Dios, todo del prójimo, todo de sí mismo\".", "s": 15}, {"k": "p", "t": "Todo de Dios: Cuando fue de España a París, se dedicó por entero a los estudios filosóficos, para ser maestro. San Ignacio, habiendo ido él también a París, le repetía permanentemente: \"¿Quid prodest, para qué sirve?\" Oh, Francisco, ¿para qué te sirve adquirir tanta ciencia, tanto honor, si después pierdes tu alma? Esta palabra fue el punto de partida de la conversión de Francisco. Luchó dentro de su corazón bueno y recto, y superó tentaciones muy violentas; luego se entregó totalmente a san Ignacio, para que lo formara y lo dirigiera por los caminos de Dios. \"¿Para qué sirve?\". Estas palabras dieron un santo a Dios y a la Iglesia, convirtieron a muchos ya sumergidos en las cosas del mundo y han poblado los desiertos de santos ermitaños. Francisco se dio totalmente a Dios; no fue un misionero de los que empiezan a trabajar con entusiasmo pero después, ante la primera dificultad, se abaten y desisten. Él se mantuvo firme ante los enormes obstáculos que surgían en su camino; obstáculos de tal magnitud que uno solo de ellos habría hecho retroceder a un gigante.", "s": 15}, {"k": "p", "t": "Desde el momento en que se consagró al servicio de Dios, Francisco no tuvo otro objetivo que amarlo y hacerlo amar. Vivió siempre con el deseo de glorificarlo en él mismo y en los demás. Obediente a san Ignacio, partió para la India; de la India pasó al Japón, y desde allí deseaba ir a la China. Soñaba con volver a Europa para convertir a los malos cristianos; ir a África, para luego volver a Asia y conquistar siempre nuevos reinos para nuestro Señor Jesucristo. Todo lo hacía para la mayor gloria de Dios, según las enseñanzas y el lema de san Ignacio. También nosotros preguntémonos: \"¿Para qué sirve?\", \"¿para qué vine?\", y alejémonos de todo lo que es mundano, para ser totalmente de Dios. Encomiéndenle a él la vocación, para responderle plenamente, constantemente. No esperen a ser santos en los días en que el Señor se hace sentir. Aridez o no, trabajen siempre para la gloria de Dios. Este es nuestro modelo: amar al Señor, buscar su gloria con todo el ardor posible; repitamos seguido con san Pablo: \"El amor de Cristo nos apremia\" (2 Cor 5,14).", "s": 15}, {"k": "p", "t": "Todo del prójimo: Francisco ejerció primero la caridad en los hospitales, dedicándose al servicio de los más humildes. Para ayudar a sus enfermos no se avergonzaba de mendigar puerta por puerta. Cuando se embarcó para las misiones, durante el largo trayecto distribuía entre los necesitados la comida que él recibía en el comedor del capitán. Al llegar a las misiones, se dio en cuerpo y alma para ayudar a los pobres material y espiritualmente. Por este fin soportó insólitos sufrimientos por tierra y por mar, en la comida y en la vestimenta. Lloraba al ver que por amor al oro muchos cristianos trabajaran tanto, y que en Europa tanta inteligencia se perdiera detrás de los honores mundanos, en vez de comprometerse con la evangelización.", "s": 15}, {"k": "p", "t": "Todo de sí mismo: ¡es decir todo por la propia santificación! ¡Es tan fácil, en el trabajo, perderse a sí mismo y descuidar la propia vida espiritual! En medio de sus múltiples fatigas apostólicas, tan variadas y apremiantes, encontraba tiempo para rezar, manteniéndose muy fiel a la oración. Siguiendo el ejemplo de Jesús, de tanto en tanto sabía alejarse de las obras externas, para pensar en sí mismo y estar con Dios. Y cuando no lo podía hacer de día, pasaba las noches a los pies de Jesús Sacramentado. Vencido por el cansancio, dormía sobre los escalones del altar. De la Eucaristía y del Crucifijo esperaba la gracia de iluminar las mentes y convertir los corazones, sabiendo que las conversiones verdaderas y estables no derivan de nuestras iniciativas, sino de la gracia de Dios.", "s": 15}, {"k": "p", "t": "¡Este es nuestro modelo! Nosotros solemos admirar a san Francisco, pero nos limitamos a la admiración. En cambio, teniendo la misma vocación religiosa y misionera, ¿por qué no podríamos ser nosotros también santos y hacer el bien como él, considerado el más grande misionero después de los apóstoles? Estoy convencido de que todos podrían convertirse en otro san Francisco Javier y realizar tantos milagros de conversión. De hecho, Dios no ha reducido, en nuestros días, su generosidad y quiere que nosotros también hagamos milagros de conversión.", "s": 15}, {"k": "p", "t": "Llamado a las misiones, Francisco sólo pensó en prepararse espiritualmente. La virtud no se adquiere en un momento; hay que insistir, resistir, combatir, nunca darse por vencidos, tampoco frente a un gran sacrificio, ni ante uno pequeño.", "s": 15}, {"k": "p", "t": "Francisco era tan obediente al superior, que le habría bastado una palabra para dejarlo todo. ¿Qué importa si la obediencia nos asigna un trabajo humilde? Sólo una cosa es importante: cumplir con el propio deber. La obediencia es hija de la humildad. No de la falsa humildad que se desanima por haber descubierto un defecto; sino de la que nos hace buscar los propios defectos; tampoco de la que nos quita la paz, sino de la que nos hace perseverar y enseguida nos pone en el lugar que nos corresponde.", "s": 15}, {"k": "p", "t": "Francisco rezaba y trabajaba, trabajaba y rezaba. Si rezar sin trabajar es tentar al Señor, lo mismo es trabajar sin rezar. Normalmente, para hacer el bien el Señor se sirve sólo de los santos; tal vez por eso tantos misioneros y misioneras no hacen todo el bien que podrían. Primero santos, después misioneros; si no, no seremos ni una cosa ni la otra. Por lo tanto, seamos también nosotros como Francisco; una santidad especial, heroica, poniendo en práctica su programa de vida: ¡todo de Dios, todo del prójimo, todo de sí mismo!", "s": 15}, {"k": "h3", "t": "Santa Teresa de Ávila", "s": 15}, {"k": "p", "t": "196. Santa Teresa es una gran santa, un ejemplo no sólo para las mujeres, sino también para los hombres. La característica fundamental de la santa fue el amor. Y aquí quiero que observen que, generalmente, cuando sentimos un poco de ternura en el corazón, nos parece que amamos; pero eso no es el amor verdadero, o mejor, no es sólo ese el amor que debemos sentir por el Señor. Por lo tanto, ¿cuál es el amor verdadero? \"El amor hace soportar incansablemente. Hace trabajar sin descanso, hace fatigarnos útilmente\". Esta es la definición del amor de santo Tomás; este no consiste sólo en sentimientos; se puede ser muy fríos como el hielo y amar mucho, como, de hecho, sucedió a santa Teresa, que por muchos años sufrió una aridez espiritual tan grande que sacudía el reloj de arena para que pasara más rápido el tiempo de la meditación. Quería amar, pero no le encontraba el gusto. Y, sin embargo, era una santa también en esos momentos; es más, era a través de esos momentos que el Señor la santificaba. El amor de santa Teresa por nuestro Señor tuvo las tres cualidades del amor verdadero y sólido que hemos recordado.", "s": 15}, {"k": "p", "t": "Soportar infatigablemente, ya que el amor nos hace soportar cualquier sufrimiento. Cuando tenía apenas siete años huyó con su hermanito para ir a convertir a los no cristianos, deseando morir mártir, pero su tío los encontró y los hizo regresar a casa. Sin embargo, Teresa no abandonó ese deseo y concretó sus aspiraciones con la santidad de vida. Fue misionera y mártir con el deseo.", "s": 15}, {"k": "p", "t": "Cuando entró en las Carmelitas, se propuso perseverar con constancia a cualquier precio. Ella misma confesó que, al abandonar la casa paterna donde era tiernamente amada, experimentó tanto dolor que sintió como si le estuvieran dislocando todos los huesos. Era una mujer tenaz en sus propósitos. El amor le hizo soportar cualquier sufrimiento, con tal de ser una santa carmelita. También ustedes tengan fuerza de voluntad para poder dejar a sus familias, la patria y a ustedes mismos, porque son llamados a ser misioneros y misioneras.", "s": 15}, {"k": "p", "t": "Obrar sin descanso: dice un autor que santa Teresa siempre estuvo en movimiento con el corazón, con la lengua y con las manos. Escribió tanto que llegó a ser como un Padre de la Iglesia. Siempre en movimiento, siempre activa. Trabajó continuamente para adquirir las virtudes, hasta vincularse con el voto de lo más perfecto y para la mayor gloria de Dios. Decía que para gustarle al Señor y llegar a gozar de él, no habría retrocedido ante el martirio. De hecho, tuvo que sufrir mucho, especialmente como reformadora del Carmelo. Fue una mujer fuerte, una mujer de oración, de acción y sacrificio. La contemplación no le impedía trabajar. Recuerden también esa expresión que tanto le gustaba repetir: \"¡O sufrir o morir!\". No tenía un término medio; entendía que, para identificarse con nuestro Señor, no hay otro camino. Las mortificaciones no consumen el cuerpo. ¡Se necesita ánimo y fuerza!", "s": 15}, {"k": "p", "t": "Fatigarse útilmente: la santa, llena de amor a Dios, ardía como una fogata, sólo deseando amar cada vez más a su Señor y despreciando todo lo demás. Decía: \"Tolero que en el paraíso haya otros por encima mío, ¡pero no que amen a Dios más que yo!\". Una vez el Niño Jesús se le apareció en el pórtico del monasterio y le hizo esta simpática pregunta: \"¿Quién eres tú? — ¡Yo soy Teresa de Jesús! — ¡Y yo soy Jesús de Teresa!\". También a nosotros nos gustaría que nos sucediera esto, pero nos llenaríamos de soberbia; en cambio, si nos encontráramos en el punto de perfección de Teresa, no correríamos ese peligro. Este es el premio para quien ama verdaderamente a Dios con un amor incansable, operativo, total.", "s": 15}, {"k": "p", "t": "¡Fíjense qué religiosa era! Una verdadera misionera en el claustro. No habiendo podido ir a las misiones, se ofreció como víctima por los no cristianos. Todo lo que hacía y sufría era dirigido a este fin. Esta es la idea que deben formarse de la vida religiosa y misionera: no de descanso, sino de trabajo; no de placer sino de sacrificio; no para conformarse con una santidad a medias, sino para querer toda la santidad y con todas las fuerzas. Imitémosla en esta fortaleza; ser fuertes también en los días y los momentos un poco difíciles. Recuerden que no son los defectos los que impiden que el Señor distribuya sus gracias. Santa teresa decía: \"¿Quién tiene más defectos que yo?\". Y sin embargo, sin ceder nunca a la naturaleza, y confiando en Dios, hizo bien todo lo que emprendió. Su leit motiv era: \"¡Nada te turbe, nada te espante!\". Después de una caída decía el \"nunc coepi\", es decir, \"ahora vuelvo a empezar\", cuarenta o cincuenta veces al día; pedía perdón al", "s": 15}, {"k": "p", "t": "Señor, y exclamaba: \"¡hierba de mi jardín, no has sido bien cultivada!\". Se humillaba por sus defectos, sin perder la confianza. Ustedes hagan lo mismo: siempre vuelvan a empezar; a fuerza de intentarlo, algo lograremos hacer. Ya el renovar la voluntad es algo que, de por sí, agrada al Señor.", "s": 15}, {"k": "p", "t": "Que el Señor, por intercesión de santa Teresa, les de, ante todo, amor a la oración, aún en medio de arideces y, luego, ese ánimo fuerte que es necesario para poder ser verdaderos misioneros y misioneras.", "s": 15}, {"k": "h3", "t": "San Fidel de Sigmaringa", "s": 15}, {"k": "p", "t": "197. Nuestro Instituto debe ser devoto de san Fidel de Sigmaringa y considerarlo como un especial protector, junto a san Francisco Javier y san Pedro Claver. Es el primer misionero enviado por \"Propaganda Fide\" a evangelizar la región de la Alta Rezia. También fue el primer mártir de Propaganda. Un misionero y una misionera siempre deben estar dispuestos al martirio; ofrecerse como víctima al Señor, listos para cualquier sacrificio.", "s": 15}, {"k": "p", "t": "Nosotros tenemos un motivo especial para serle devotos. En efecto, fue el día de su memoria, el 24 de abril de 1900, que en Rívoli (Turín), celebrando la misa en su honor, puse sobre el altar una carta dirigida a nuestro arzobispo, en la que pedía la palabra definitiva para fundar el Instituto de los misioneros, que recibí más tarde. Si quieren, agreguen también la especial predilección que tuve por este santo desde que era seminarista; una predilección ciertamente infundida por Dios de cara al futuro.", "s": 15}, {"k": "p", "t": "Recurran a la intercesión de san Fidel para poder enriquecer su mente con el estudio de las varias disciplinas y entrenar el ánimo en la práctica constante de todas las virtudes. Él los ayudará a superar las tentaciones de desánimo y a controlar el ímpetu juvenil en el ministerio. Para ser apóstoles, es necesario prepararse seriamente y por mucho tiempo; hay que tener ese bagaje de conocimientos divinos y humanos requeridos por los tiempos y las poblaciones que debemos evangelizar; se necesitan virtudes no comunes y un excelente espíritu de inmolación.", "s": 15}, {"k": "p", "t": "Recémosle y tomémoslo como modelo de la virtud que lo caracterizó, es decir la fidelidad a la vocación. Desde que era un joven estudiante fue fiel a todos los deberes cristianos, así como a su profesión de abogado y a la voz de Dios que lo llamaba, eligiendo el humilde hábito de los Capuchinos. Observó con máxima fidelidad las reglas de su Orden, primero como simple fraile, luego como superior. Habiéndole propuesto la difícil misión de la Alta Rezia, obedeció con fidelidad, desarrollando su tarea hasta el martirio.", "s": 15}, {"k": "p", "t": "Por eso este santo les es propuesto a ustedes como modelo de vida consagrada y apostólica. Imítenlo en la fidelidad a sus deberes presentes y futuros, fidelidad universal, cordial y simple. Fidelidad en las cosas grandes y en las pequeñas, fidelidad para corresponder a las gracias de Dios y dejarse formar; fidelidad a las reglas y a los medios que Dios les da para poder ser misioneros y misioneras dignos, fieles también a sus propósitos; fidelidad en todo, porque como dice la Iglesia en la oración de la misa, \"también nosotros hemos sido considerados fieles hasta la muerte\". De esta manera recibirán el premio prometido por nuestro Señor a su siervo: \"Está bien, servidor bueno y fiel, ya que respondiste fielmente en lo poco, te encargaré de mucho más\" (Mt 25,21).", "s": 15}, {"k": "h3", "t": "San Pedro Claver", "s": 15}, {"k": "p", "t": "198. San Pedro Claver es propuesto por la Iglesia como patrono de los afrodescendientes de africanos, porque ejerció el ministerio entre los esclavos transportados de África a Cartagena. Con caridad y paciencia heroica, por más de cuarenta años, tuvo compasión de ellos y se comprometió a cuidar de sus almas y de sus cuerpos, fiel a esta misión hasta la muerte. Del mismo modo ustedes, para poder ser santos misioneros y misioneras, con la necesaria caridad y paciencia, fórmense desde que son jóvenes y adquieran estas virtudes.", "s": 15}, {"k": "p", "t": "San Pedro Claver era noble, sensible, y se hizo religioso de la Compañía de Jesús, abandonando a sus padres a pesar de quererlos mucho. Después de haber estudiado teología, pidió ser hermano coadjutor, renunciando al sacerdocio. Los superiores no estuvieron de acuerdo y, con la ayuda de Dios, se convirtió en un gran apóstol. Tuvo como consejero a san Alfonso Rodríguez, a quien escuchó cuando le mostró su especial misión.", "s": 15}, {"k": "p", "t": "¿Cómo se preparó para ese apostolado tan difícil? A lo largo de su vida, nunca trasgredió una regla. Él decía que el carácter del buen novicio consiste en esto: buscar siempre a Dios en todas las cosas, sirviéndose de ellas como si fueran una escalera para ir a Dios; hacer todos los esfuerzos necesarios para adquirir una perfecta obediencia; hacer todo para la mayor gloria de Dios; no buscar otra cosa que no sea la salvación de las almas, hasta morir en la cruz, a imitación del Señor Jesús.", "s": 15}, {"k": "h3", "t": "San Francisco de Sales", "s": 15}, {"k": "p", "t": "199. La fecha solemne de la aprobación oficial del Instituto de los misioneros (29 de enero de 1901) coincide con la fiesta de", "s": 15}, {"k": "p", "t": "San Francisco de Sales. 3 Pero no se trató de una casualidad. En los designios de la Divina Providencia y tal vez en la mente de nuestro arzobispo, el cardenal Agustín Richelmy, el Instituto fue aprobado ese día justamente para estar bajo la protección de este gran santo, apóstol de la zona de Chablais. Siempre fue considerado un santo de Turín, adonde su madre vino varias veces. Fue devoto de la Santísima Consolata. Una vez vino al Santuario, donde se alojó durante tres meses. Él es uno de nuestros protectores.", "s": 15}, {"k": "p", "t": "Preguntémonos: ¿cómo pudo hacer tanto bien este hombre? Fue apóstol, fundador de una orden religiosa, escritor, luego proclamado doctor de la Iglesia. ¿Ven? Normalmente admiramos las virtudes y obras de los santos, pero, ¿nos remontamos a las fuentes, al medio, a la causa de tanto bien y de tanta santidad? Francisco de Sales no nació santo, pero se formó respondiendo coeherentemente desde el principio a la gracia de Dios. Luchó para moderar su carácter tendencialmente colérico. Sí, nosotros ahora admiramos su dulzura, pero no la recibió de la naturaleza, ni siquiera le fue infusa, sino que la adquirió a través del ejercicio de la renuncia a sí mismo. Luchó por la castidad, por la que tuvo que enfrentar en París batallas muy violentas; pero no se dejó vencer, resistió e hizo el voto de castidad que luego renovó en Loreto. Luchó para seguir la vocación sacerdotal y poder ir a la zona de Chablais. Nadie tenía el coraje para emprender una obra tan ardua y peligrosa; entonces se ofreció al obispo, sin ceder ante las lágrimas de la madre ni ante la oposición del padre. Partió sin nada, pero tenía todo, porque llevaba a Dios con él.", "s": 15}, {"k": "nota", "t": "3 Cuando José Allamano pronunciaba estas palabras la memoria litúrgica de san Francisco de Sales caía el 29 y no el 24 de enero, como en la actualidad.", "s": 15}, {"k": "p", "t": "A toda costa quiso ser el cuarto santo de nombre Francisco y lo logró. Siempre, desde el principio, tuvo esta voluntad de hierro. \"¡Lo quiero, lo quiero!\". Y lo logró. Esta es la hermosa lección que nos deja. También a nosotros Dios nos concede las gracias necesarias y abundantes para alcanzar ese grado de santidad al que nos llama. Si él, y tantos otros más, lo lograron, ¿por qué no yo? ¿Por qué no nosotros? El haber sido llamados al apostolado ya es un signo y una garantía de que el Señor nos tiene preparadas muchas gracias para santificarnos. San Francisco de Sales es un santo moderno. Tal vez tenía más miserias que nosotros, pero se venció a sí mismo y se convirtió en el más grande santo de su tiempo. Ahora, lo que hizo él, también nosotros podemos hacerlo.", "s": 15}, {"k": "p", "t": "Elegido obispo de una Iglesia pobre, algunos le sugerían que cambiara de obispado, eligiendo uno más conveniente económicamente, como el de París; pero él respondía: \"El que se casó con una esposa pobre, no la deja por ese motivo\". Cuando el Senado lo amenazó con quitarle los bienes materiales, simplemente dijo: \"¡Entonces seré más espiritual!\".", "s": 15}, {"k": "p", "t": "¡Cuántos sacrificios tuvo que soportar durante su vida apostólica! Siempre atacado, a veces amenazado de muerte, incluso calumniado. Dejó el cargo de arcipreste, bastante cómodo, para irse como misionero. En las misiones desplegó un celo apostólico típicamente suyo, con pureza de intenciones, espíritu de sacrificio y, especialmente, de mansedumbre. Fue un verdadero misionero y será siempre un protector del Instituto. Pídanle que les conceda el espíritu de desarraigo, de sacrificio, de celo por la gloria de Dios.", "s": 15}, {"k": "p", "t": "Pero si hizo tanto bien es porque fue humilde. \"Era muy humilde la opinión que tenía de sí —escribe Francisca Fremiot de Chantal—, amaba su propia bajeza; no pudiendo ignorar la estima que tenían de él, se avergonzaba de sí mismo\". En el prefacio del Tratado del amor de Dios escribía: \"En este mundo hay muchas cosas perfectas, pero no deben buscarlas en mi casa\". Al volver a Milán, les dijo a las religiosas: \"Yo soy un fantasma, una sombra de obispo, indigno de besar la tierra donde el arzobispo de Milán (san Carlos Borromeo) pone sus pies\". Tratemos de imitarlo asimilando bien la virtud de la humildad. Si son humildes, tendrán celo, porque no se buscarán a ustedes mismos, sino sólo la gloria de Dios.", "s": 15}, {"k": "p", "t": "El celo apostólico de san Francisco de Sales fue, además, caracterizado por la dulzura, la mansedumbre; también en esta virtud, tan necesaria para el misionero y la misionera, él debe ser nuestro modelo. Tenía un carácter de fuego y, sin embargo, adquirió una mansedumbre admirable y admirada.", "s": 15}, {"k": "p", "t": "Pero su mansedumbre y dulzura iban de la mano con una fuerza igualmente admirable. Recuerden sus palabras: \"¡Si en mi corazón hubiera alguna fibra que no fuese para el Señor, la arrancaría sin piedad!\". A veces creemos que nos dimos totalmente al Señor, pero si analizamos en profundidad, ¡qué aferrados estamos a nosotros mismos!\" Restos de envidia, de falta de mortificación, de tibieza; a veces incluso de cosas más graves. San Francisco de Sales buscó sólo y cada vez más agradarle a Dios. El lema que asignó a sus religiosas era: \"¡Sólo Dios!\".", "s": 15}, {"k": "p", "t": "Pidamos, por intercesión de este gran santo, la gracia de poder amar al Señor con todo el corazón y al prójimo como a nosotros mismos, por amor a Dios. Estos dos amores generan en nosotros el celo misionero. A quien se esfuerza humanamente, el Señor le concede el céntuplo, inclusive en esta vida. Por lo tanto, ánimo, y estén alegres. San Francisco de Sales siempre estaba contento. \"¡Sirvan al Señor con alegría!\" (Sal 100,2).", "s": 15}, {"k": "h3", "t": "Los ángeles custodios", "s": 15}, {"k": "p", "t": "200. En el Instituto nunca abandonen la devoción a los santos ángeles. Seamos devotos por nosotros y por los demás; por los que no les dan importancia; también por los no cristianos, para que nos ayuden a evangelizarlos. Los ángeles buenos nos aman, nos cuidan y nos protegen.", "s": 15}, {"k": "p", "t": "En la Sagrada Escritura se habla de los ángeles. En el salmo leemos: \"Él te encomendó a sus ángeles para que te cuiden en todos tus caminos\" (Sal 90,11). En la Carta a los Hebreos leemos: \"¿Y a cuál de los ángeles dijo jamás: Siéntate a mi derecha, hasta que ponga a tus enemigos debajo de tus pies? ¿Acaso no son todos ellos espíritus al servicio de Dios, enviados en ayuda de los que van a heredar la salvación?\" (Heb 1,13-14). Después de haber advertido que no se debe escandalizar a los pequeños, el Señor dice: \"Cuídense de despreciar a cualquiera de estos pequeños, porque les aseguro que sus ángeles en el cielo están constantemente en presencia de mi Padre celestial\" (Mt 18,10). Están siempre en presencia de Dios mientras nos protejen. Hay hechos en la Biblia que hablan de los ángeles: en la historia de Lot, de Tobías, de Daniel entre los leones, de los tres jóvenes entre las llamas, de san Pedro en la cárcel, etc. (Cf. Gén 19; Tob 5; Dn 3,43; 6,22; Hech 12,1-11). Y san Jerónimo escribe: \"¡Qué grande es la dignidad humana, ya que cada persona tiene, desde el nacimiento, su propio ángel!\".", "s": 15}, {"k": "p", "t": "Los ángeles nos guían, nos asisten y ofrecen a Dios nuestras oraciones y las obras buenas; estimulan el intelecto y la voluntad", "s": 15}, {"k": "nota", "t": "3 Al final de esta lista han sido incluidos los ángeles custodios, ya que José Allamano los proponía como especiales protectores y guías para los misioneros y las misioneras.", "s": 15}, {"k": "p", "t": "para hacer el bien; nos liberan de los peligros materiales y, más aún, de los espirituales. Agradezcamos a Dios por habernos dado al ángel custodio, que tanto nos cuida, y dejémonos guiar por él. ¿Por qué no deberíamos recurrir a su ayuda si siempre busca nuestro bien? ¡Hay que tener una fe viva!", "s": 15}, {"k": "p", "t": "Nuestros deberes hacia el ángel custodio son, ante todo, respeto por su presencia permanente; no es necesario que lo veamos, basta saber que está. Además, gratitud por la benevolencia que nos demuestra haciéndonos todo el bien posible. Por último, confianza en la protección que él nos brinda. Invoquémoslo en nuestras necesidades, escuchemos sus inspiraciones.", "s": 15}, {"k": "p", "t": "El recomendarles esta devoción nunca será demasiado. Hay cristianos que no piensan nunca en el ángel custodio. Una vez le recomendé a un enfermo grave que recurriera al ángel custodio. Me respondió: \"¿Cómo puedo hacer, si nunca pienso en él?\" — \"¡No importa, invóquelo de todos modos!\". Claro, en ese momento el pobre habría preferido poder decir que siempre había sido devoto.", "s": 15}, {"k": "p", "t": "Nosotros misioneros y misioneras tenemos motivos particulares para honrar a los ángeles custodios. Nuestra devoción debe ser mucho más viva y estar arraigada en el corazón, por la relación especial que vincula a los misioneros con los ángeles. Ellos tienen la tarea de alabar al Señor por sí mismos, como criaturas suyas, y también por todos los que han sido confiados a su protección. Esta es la misma tarea de los misioneros, que deben llevar una vida de unión con Dios y alabarlo permanentemente por sí mismos y por los demás. Sobre todo en las misiones deberán pensar en este compromiso: alabar al Señor por todos los que son confiados al cuidado de ustedes, especialmente por los que aún no conocen al Señor.", "s": 15}, {"k": "p", "t": "Además, los ángeles son ministros de salvación. Este también es el fin especial de la vocación misionera. Por esta participación a las mismas tareas apostólicas que ellos, ustedes tienen una cierta afinidad; están más cerca de ellos, y ellos los quieren a ustedes con un afecto especial, deseosos de ayudarlos. Por lo tanto, deben confiar mucho en ellos. ¡Cuánto bien harán si vivirán esta unión de pensamiento y de corazón con su propio ángel!", "s": 15}, {"k": "p", "t": "Que esta devoción al ángel custodio esté profundamente arraigada y se convierta en la característica del misionero y la misionera. Que cada uno diga: yo tengo un ángel todo para mí. Él está siempre conmigo. Cuando el Señor me puso en manos de mi ángel custodio, me dijo: \"Él te precederá, te ayudará siempre; está contigo, por ti, en ti; contigo en las batallas, contigo en las luchas, ganándolas; en ti para sugerirte pensamientos según la voluntad de Dios, para animarte y ayudarte\".", "s": 15}, {"k": "h2", "t": "Bibliografía esencial", "s": 16}, {"k": "bib", "t": "En italiano Escritos de José Allamano", "s": 16}, {"k": "bib", "t": "SALES Lorenzo, La dottrina spirituale del Servo di Dio Can.", "s": 16}, {"k": "bib", "t": "Giuseppe Allamano - Fondatore dei Missionari e delle Missionarie della Consolata - ricavata dalle Conferenze Spirituali, vol. I, ed. Missioni Consolata, Torino 1949, pp 371; vol II, ed. Missioni Consolata, Torino 1950.", "s": 16}, {"k": "bib", "t": "SALES Lorenzo, La Vita Spirituale dalle conversazioni ascetiche del Servo di Dio Giuseppe Allamano, Fondatore dei Missionari e delle Missionarie della Consolata, Torino 1963.", "s": 16}, {"k": "bib", "t": "Le \"Conferenze Spirituali\" del Servo di Dio Giuseppe Allamano.", "s": 16}, {"k": "bib", "t": "Gli autografi e le trascrizioni dalla viva voce, a cura di Igino Tubaldo IMC, 3 voll., ed. Missioni Consolata, Torino 1981.", "s": 16}, {"k": "bib", "t": "Conferenze del Servo di Dio Giuseppe Allamano alle Suore Missionarie, a cura dell'ufficio storico, 3 voll., ed. Suore Missionarie della Consolata, Grugliasco (TO), 1984.", "s": 16}, {"k": "bib", "t": "Quasi una vita... Lettere scritte e ricevute dal beato Giuseppe Allamano con testi e documenti coevi, a cura di Candido Bona", "s": 16}, {"k": "bib", "t": "IMC, 10 voll., ed. Missioni Consolata, Torino 1990-2002.", "s": 16}, {"k": "bib", "t": "ALLAMANO Giuseppe, Lettere ai Missionari e alle Missionarie della Consolata, a cura di Igino Tubaldo, ed. Art Grafiche San Rocco, Grugliasco (TO) 2004.", "s": 16}, {"k": "bib", "t": "Biografías", "s": 16}, {"k": "bib", "t": "SALES Lorenzo, Il Canonico Giuseppe Allamano. Fondatore dei Missionari e delle Missionarie della Consolata, ed. Missioni Consolata, Torino 1936.", "s": 16}, {"k": "bib", "t": "SALES Lorenzo, Compendio della vita del Canonico Giuseppe Allamano. Fondatore dei Missionari e delle Missionarie della Consolata, ed. Missioni Consolata, Torino 1938.", "s": 16}, {"k": "bib", "t": "BARRA Giovanni, Padre di Apostoli. Canonico Giuseppe Allamano- Fondatore dell'Istituto Missioni Consolata, ed.", "s": 16}, {"k": "bib", "t": "Morcelliana, Brescia 1955.", "s": 16}, {"k": "bib", "t": "TUBALDO Igino, Giuseppe Allamano. Il suo tempo - La sua vita - La sua opera, 5 voll., ed. Missioni Consolata. Torino 1982-1986.", "s": 16}, {"k": "bib", "t": "MINA Giuseppe - ZANUBER Lino, Quando la missione invade la vita. Il Servo di Dio Giuseppe Allamano Fondatore dei Missionari e delle Missionarie della Consolata, ed. M <script>
(function () {
  'use strict';

  var TEMAS = ['claro', 'sepia', 'oscuro'], NOM = { claro: 'Claro', sepia: 'Sepia', oscuro: 'Oscuro' };

  function fsActual() { return (pref.vista === 'libro' ? pref.fsL : pref.fsD) || defFs(pref.vista); }

  var zoomT = null, resT = null, CH = [], curCh = -1, curSec = null, segPages = [];

  /* ---------- nodos de texto ---------- */
  function words(t) { return t.split(' '); }

  function makeNode(seg) {

  /* ---------- paginación por medición ---------- */

    function fitsSeg(seg) { var n = makeNode(seg); h.appendChild(n); var ok = fits(h); h.removeChild(n); return ok; }

  }

  }

  }

  }

    $('stage').classList.toggle('solo', spread && (pi === 0 || pi > last));
    syncUi();
  }

  /* ---------- barra: indicador, zoom, progreso y capítulo actual ---------- */
  function syncUi() {

    if (pi === 0) main = 'Portada';
    else if (!spread) main = 'Pág. ' + pi;
    else if (pi <= last) main = 'Págs. ' + (pi - 1) + '–' + pi;

  }
  function refreshPn() {
    CH.forEach(function (c) {
      c.pn.textContent = itemPage[c.idx] || '';
      c.kids.forEach(function (s) { s.pn.textContent = itemPage[s.idx] || ''; });
    });
  }
  function markCurrent(idx) {
    var ci = -1, c;
    for (c = 0; c < CH.length; c++) { if (CH[c].idx <= idx) ci = c; else break; }

      if (ci >= 0) CH[ci].el.classList.add('cur');

    if (ci >= 0) {
      var kids = CH[ci].kids;
      for (var k = 0; k < kids.length; k++) { if (kids[k].idx <= idx) sec = kids[k]; else break; }
    }

    if (sb !== curSec) {
      if (curSec) curSec.classList.remove('cur');
      if (sb) sb.classList.add('cur');
      curSec = sb;
    }
  }

  /* ---------- volteo estilo Manual ---------- */

    var DUR = dur();

      else { front = pi - 1; back = pi - 2; baseL = pi - 3; baseR = pi; leafLeft = 0; origin = 'right center'; to = 'rotateY(180deg)'; cls = 'fl-prev'; }

    leaf.style.left = leafLeft + 'px';

    }, DUR + 40);
  }

  /* ---------- ir a una sección / página ---------- */
  // ancla: { i: índice del elemento (-1 = portada), w: palabra dentro del elemento }
  function curAnchor() {
    if (pref.vista === 'libro') {

    return { i: 0, w: 0 };
  }
  function pageFor(an) {
    var list = segPages[an.i] || [], p = itemPage[an.i];
    for (var k = 0; k < list.length; k++) { if (list[k].a <= an.w) p = list[k].p; else break; }
    return p === undefined ? 1 : p;
  }
  function flashEl(e) { if (e) { e.classList.remove('hit'); void e.offsetWidth; e.classList.add('hit'); } }
  function goAnchor(an, flash) {
    if (pref.vista === 'libro') {

      else { pi = an.i < 0 ? 0 : stateFor(pageFor(an)); render(); }
      if (flash && an.i >= 0) flashEl(document.querySelector('#stage [data-i="' + an.i + '"]'));
    } else {
      var d = $('desp'), i = Math.max(0, an.i);
      var e = d.querySelector('[data-i="' + i + '"]');

  function relayout(an) {
    if (!an) an = curAnchor();

  }
  function relayoutSoon() { clearTimeout(zoomT); zoomT = setTimeout(function () { if (pref.vista === 'libro') relayout(); else dirty = true; }, 160); }

  /* ---------- tamaño del texto (zoom) ---------- */
  function setFs(v) {

    syncUi();

  /* ---------- modo: libro / texto seguido ---------- */
  function buildDesp() {
    var d = $('desp-tx');
    d.innerHTML = '';
    for (var i = 0; i < N; i++) d.appendChild(makeNode({ idx: i, a: 0, b: null, withDate: true }));
  }
  function aplicarVista() {
    var libro = pref.vista === 'libro';
    document.body.classList.toggle('modo-desp', !libro);
    $('stage').style.display = libro ? '' : 'none';
    $('desp').classList.toggle('on', !libro);
    $('vista-n').textContent = libro ? 'Libro' : 'Texto seguido';
    $('ico-libro').hidden = !libro;
    $('ico-texto').hidden = libro;
    var bv = $('b-vista'), t = libro ? 'Cambiar a texto seguido' : 'Cambiar a vista de libro';
    bv.title = t; bv.setAttribute('aria-label', t);
  }
  function setVista(v) {
    if (v === pref.vista) return;
    var an = curAnchor();
    pref.vista = v; guardar();
    aplicarVista();
    root.style.setProperty('--fs', fsActual() + 'px');
    closeSide(); toggleGoto(false);
    if (v === 'libro') relayout(an);
    else goAnchor(an, false);
  }
  $('b-vista').onclick = function () { setVista(pref.vista === 'libro' ? 'desp' : 'libro'); };

  /* ---------- tema ---------- */
  var temaBtns = document.querySelectorAll('.seg [data-th]');
  function setTema() {
    root.setAttribute('data-theme', pref.tema);
    for (var i = 0; i < temaBtns.length; i++) {
      temaBtns[i].setAttribute('aria-pressed', temaBtns[i].getAttribute('data-th') === pref.tema ? 'true' : 'false');
    }
    var t = 'Tema de lectura: ' + NOM[pref.tema];
    $('b-th').title = t; $('b-th').setAttribute('aria-label', t);
  }
  for (var tb = 0; tb < temaBtns.length; tb++) {
    temaBtns[tb].onclick = (function (btn) {
      return function () { pref.tema = btn.getAttribute('data-th'); setTema(); guardar(); };
    })(temaBtns[tb]);
  }
  $('b-th').onclick = function () {
    pref.tema = TEMAS[(TEMAS.indexOf(pref.tema) + 1) % TEMAS.length];
    setTema(); guardar();
  };

  /* ---------- botones de la barra ---------- */
  $('b-zp').onclick = function () { setFs(fsActual() + 2); };
  $('b-zm').onclick = function () { setFs(fsActual() - 2); };
  function scrollDesp(dir) { var d = $('desp'); d.scrollTop += dir * d.clientHeight * 0.85; }
  $('b-prev').onclick = function () { if (pref.vista === 'libro') turn(-1); else scrollDesp(-1); };
  $('b-next').onclick = function () { if (pref.vista === 'libro') turn(1); else scrollDesp(1); };
  $('zl').onclick = function () { turn(-1); };
  $('zr').onclick = function () { turn(1); };
  $('b-ind').onclick = function () { if (pref.vista === 'libro') toggleGoto(); else openSide(); };
  var dRaf = 0;
  $('desp').addEventListener('scroll', function () {
    if (dRaf) return;
    dRaf = requestAnimationFrame(function () { dRaf = 0; if (pref.vista !== 'libro') syncUi(); });
  }, { passive: true });

  /* ---------- panel lateral: índice y buscador ---------- */
  var side = $('sidebar'), scrim = $('scrim');
  function openSide() {
    side.classList.add('open'); side.setAttribute('aria-hidden', 'false'); scrim.classList.add('on');
    $('b-toc').setAttribute('aria-expanded', 'true');
    toggleGoto(false);
    markCurrent(curAnchor().i);
    revealCurrent();
  }
  function closeSide() {
    if (!side.classList.contains('open')) return;
    side.classList.remove('open'); side.setAttribute('aria-hidden', 'true'); scrim.classList.remove('on');
    $('b-toc').setAttribute('aria-expanded', 'false');
  }
  function toggleSide() { if (side.classList.contains('open')) closeSide(); else openSide(); }
  function revealCurrent() {
    if (curCh < 0 || $('toc').hidden) return;
    var c = CH[curCh];
    c.el.classList.add('open');
    var target = curSec || c.el.querySelector('.ch-btn');
    var sc = $('sb-scroll'), box = sc.getBoundingClientRect(), r = target.getBoundingClientRect();
    if (r.top < box.top + 60 || r.bottom > box.bottom - 60) sc.scrollTop += r.top - box.top - box.height / 3;
  }
  $('b-toc').onclick = toggleSide;
  $('sb-close').onclick = closeSide;
  scrim.onclick = closeSide;

  function buildToc() {
    var toc = $('toc');
    var cur = null;
    for (var i = 0; i < N; i++) {
      var it = ITEMS[i];
      if (it.k === 'h2') { cur = { idx: i, t: it.t, kids: [], el: null, pn: null }; CH.push(cur); }
      else if (it.k === 'h3' && cur) cur.kids.push({ idx: i, t: it.t, btn: null, pn: null });
    }
    var firstNum = -1;
    CH.forEach(function (c, k) { if (/^\d/.test(c.t) && firstNum < 0) firstNum = k; });
    var grp = '';
    CH.forEach(function (c, k) {
      var g = /^\d/.test(c.t) ? 'Capítulos' : (firstNum < 0 || k < firstNum ? 'Preliminares' : 'Final');
      if (g !== grp) { toc.appendChild(el('div', 'grp', g)); grp = g; }
      var ch = el('div', 'ch'), row = el('div', 'ch-row');
      var b = el('button', 'ch-btn'); b.type = 'button';
      b.appendChild(el('span', 'dot'));
      b.appendChild(el('span', 'ct', c.t));
      var pn = el('span', 'pn');
      b.appendChild(pn);
      b.onclick = function () { closeSide(); goTo(c.idx, true); };
      row.appendChild(b);
      c.el = ch; c.pn = pn;
      if (c.kids.length) {
        var tg = el('button', 'ch-tg'); tg.type = 'button'; tg.setAttribute('aria-label', 'Mostrar apartados de ' + c.t);
        tg.setAttribute('aria-expanded', 'false');
        tg.innerHTML = '<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>';
        tg.onclick = function () {
          var open = ch.classList.toggle('open');
          tg.setAttribute('aria-expanded', open ? 'true' : 'false');
        };
        row.appendChild(tg);
      }
      ch.appendChild(row);
      if (c.kids.length) {
        var secs = el('div', 'secs');
        c.kids.forEach(function (s) {
          var sb = el('button', 'sec-btn'); sb.type = 'button';
          sb.appendChild(el('span', '', s.t));
          var sp = el('span', 'pn');
          sb.appendChild(sp);
          sb.onclick = function () { closeSide(); goTo(s.idx, true); };
          s.btn = sb; s.pn = sp;
          secs.appendChild(sb);
        });
        ch.appendChild(secs);
      }
      toc.appendChild(ch);
    });
  }

  /* ---------- buscador (con mapa de posiciones: resalta bien aunque haya tildes) ---------- */
  function fold(s) {
    var f = '', map = [];
    for (var k = 0; k < s.length; k++) {
      var parts = s.charAt(k).normalize('NFD');
      for (var m = 0; m < parts.length; m++) {
        var c = parts.charAt(m);
        if (/[̀-ͯ]/.test(c)) continue;
        f += c.toLowerCase(); map.push(k);
      }
    }
    return { f: f, map: map };
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var timer = null;
  function buscar(q) {
    var lista = $('results'), meta = $('sb-meta'), toc = $('toc');
    lista.innerHTML = '';
    $('sb-search').classList.toggle('has', q.length > 0);
    var raw = q.trim();
    if (!raw) { lista.hidden = true; toc.hidden = false; meta.textContent = ''; return; }
    toc.hidden = true; lista.hidden = false;
    var fq = fold(raw).f;
    if (fq.length < 2) { meta.textContent = 'Escribe al menos 2 letras.'; return; }
    var hits = [];
    for (var i = 0; i < N; i++) {
      var t = ITEMS[i].t, fo = fold(t), j = fo.f.indexOf(fq);
      if (j >= 0) hits.push({ i: i, t: t, s: fo.map[j], e: fo.map[j + fq.length - 1] + 1 });
    }
    meta.textContent = hits.length
      ? hits.length + (hits.length === 1 ? ' resultado' : ' resultados') + (hits.length > 60 ? ' · se muestran 60' : '')
      : 'Sin resultados para “' + raw + '”.';
    hits.slice(0, 60).forEach(function (h) {
      var btn = el('button', 'res'); btn.type = 'button';
      var head = el('div', 'rh2');
      head.appendChild(el('span', '', SECS[ITEMS[h.i].s].t));
      if (pref.vista === 'libro' && itemPage[h.i] !== undefined) head.appendChild(el('span', '', 'Pág. ' + itemPage[h.i]));
      var body = el('div');
      var a = Math.max(0, h.s - 60), b = Math.min(h.t.length, h.e + 80);
      body.innerHTML = (a > 0 ? '…' : '') + esc(h.t.slice(a, h.s)) + '<mark>' + esc(h.t.slice(h.s, h.e)) + '</mark>' + esc(h.t.slice(h.e, b)) + (b < h.t.length ? '…' : '');
      btn.appendChild(head); btn.appendChild(body);
      btn.onclick = function () { closeSide(); goTo(h.i, true); };
      lista.appendChild(btn);
    });
  }
  $('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    var v = e.target.value;
    timer = setTimeout(function () { buscar(v); }, 160);
  });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); buscar(this.value); }
  });
  $('q-clr').onclick = function () { $('q').value = ''; buscar(''); $('q').focus(); };

  /* ---------- ir a una página ---------- */
  var gotoBox = $('goto');
  function toggleGoto(force) {
    var on = force === undefined ? gotoBox.hidden : !!force;
    gotoBox.hidden = !on;
    if (on) {
      var n = $('goto-n');
      n.max = last;
      n.value = pi === 0 ? 1 : Math.max(1, spread ? pi - 1 : pi);
      setTimeout(function () { n.focus(); n.select(); }, 30);
    }
  }
  $('form-goto').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = parseInt($('goto-n').value, 10);
    if (isNaN(n)) return;
    if (dirty) relayout();
    n = Math.max(1, Math.min(last, n));
    pi = stateFor(n);
    render();
    toggleGoto(false);
  });
  document.addEventListener('click', function (e) {
    if (gotoBox.hidden) return;
    if (e.target.closest && e.target.closest('#goto, #b-ind')) return;
    toggleGoto(false);
  });

  /* ---------- teclado ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSide(); toggleGoto(false); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '0')) {
      e.preventDefault();
      if (e.key === '0') setFs(defFs(pref.vista));
      else setFs(fsActual() + (e.key === '-' ? -2 : 2));
      return;
    }
    if (e.target && e.target.tagName === 'INPUT') return;
    if (pref.vista !== 'libro') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') turn(1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') turn(-1);
  });

  /* ---------- rueda con Ctrl = zoom ---------- */
  $('area').addEventListener('wheel', function (e) {
    if (e.ctrlKey) { e.preventDefault(); setFs(fsActual() + (e.deltaY < 0 ? 1 : -1)); }
  }, { passive: false });

  /* ---------- gestos táctiles: deslizar pasa página, pellizcar cambia el texto ---------- */
  var sx = 0, sy = 0, pd = 0, pf = 0, pinching = false, swiping = false;
  function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
  var area = $('area');
  area.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) { pinching = true; swiping = false; pd = dist(e.touches); pf = fsActual(); }
    else if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true; pinching = false; }
  }, { passive: true });
  area.addEventListener('touchmove', function (e) {
    if (pinching && e.touches.length === 2) { e.preventDefault(); setFs(pf * (dist(e.touches) / (pd || 1))); }
  }, { passive: false });
  area.addEventListener('touchend', function (e) {
    if (pinching) { if (e.touches.length === 0) pinching = false; return; }
    if (!swiping || pref.vista !== 'libro') return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 60) turn(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- cambios de tamaño ---------- */
  window.addEventListener('resize', function () {
    clearTimeout(resT);
    resT = setTimeout(function () {
      if (pref.vista === 'libro') { if (layout() !== lastKey) relayout(); }
      else dirty = true;
    }, 220);
  });
  if (movil.addEventListener) movil.addEventListener('change', function () { if (pref.vista === 'libro') relayout(); });

  /* ---------- inicio ---------- */
  setTema();
  buildToc();
  buildDesp();
  aplicarVista();
  if (pref.vista === 'libro') relayout({ i: -1, w: 0 });
  else { root.style.setProperty('--fs', fsActual() + 'px'); syncUi(); }
  var ld = $('loading');
  requestAnimationFrame(function () { ld.classList.add('hide'); setTimeout(function () { ld.remove(); }, 400); });
})();

</script>
</body>
</html>
