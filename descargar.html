<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061536">
<title>JUMA Duaca · Descargar Aplicación Oficial</title>
<meta name="description" content="Descarga la aplicación oficial de JUMA Duaca · Juventud Misionera Allamaniana.">
<link rel="icon" type="image/png" href="https://gabrielg739-prog.github.io/juma/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #061536;
  --cloth: #0C2D74;
  --royal: #2452C8;
  --sky: #8EC9FF;
  --paper: #F6F9FE;
  --mist: #E6EEFA;
  --ink: #0A1B3F;
  --muted-lt: #C3D3EE;
  --c1: #2A5FE6;
  --c2: #F5C518;
  --c3: #17824A;
  --c4: #C8322D;
  --c5: #FFFFFF;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--navy);
  color: #fff;
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== CINTA DE LOS CINCO CONTINENTES ===== */
.ribbon {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 6px;
  z-index: 30;
  background: linear-gradient(90deg, var(--c1) 0 20%, var(--c2) 20% 40%, var(--c3) 40% 60%, var(--c4) 60% 80%, var(--c5) 80% 100%);
}

/* ===== COLLAGE VISUAL DE FOTOS DE JUMA (PROTAGONISTA DE FONDO) ===== */
.stage {
  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 28px 18px;
  overflow: hidden;
}

.collage {
  position: fixed;
  inset: -6%;
  z-index: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(200px, 1fr));
  grid-auto-rows: 220px;
  gap: 14px;
  transform: rotate(-4deg) scale(1.05);
  pointer-events: none;
  user-select: none;
}
.tile {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: var(--cloth);
  box-shadow: 0 18px 36px -14px rgba(0, 0, 0, .7);
  border: 2px solid rgba(255, 255, 255, .18);
  animation: floatTile 18s ease-in-out infinite alternate;
}
.tile:nth-child(even) {
  animation-duration: 24s;
  animation-direction: alternate-reverse;
}
.tile:nth-child(3n) {
  grid-row: span 2;
}
.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
@keyframes floatTile {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-22px); }
}

/* Velo azul Consolata limpio que deja ver las fotos con claridad */
.veil {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 50%, rgba(6, 21, 54, 0.52) 0%, rgba(6, 21, 54, 0.82) 75%, rgba(6, 21, 54, 0.94) 100%);
  pointer-events: none;
}

/* ===== ESTANDARTE CENTRAL LIMPIO (ESTILO JUMA OFICIAL) ===== */
.banner-wrap {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 480px;
  animation: unroll 750ms var(--ease-out) both;
}
@keyframes unroll {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}

/* La vara metálica característica de JUMA */
.rod {
  position: relative;
  height: 6px;
  margin: 0 -6px;
  border-radius: 3px;
  background: linear-gradient(180deg, #F1F6FD, #9BB0D6);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
}
.rod::before, .rod::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFFFFF, #9BB0D6);
  transform: translateY(-50%);
}
.rod::before { left: -8px; }
.rod::after { right: -8px; }

.banner {
  position: relative;
  background: rgba(12, 45, 116, 0.88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-left: 1px solid rgba(255, 255, 255, .18);
  border-right: 1px solid rgba(255, 255, 255, .18);
  padding: 36px 28px 74px;
  text-align: center;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 42px), 0 100%);
  box-shadow: 0 28px 60px rgba(0, 0, 0, .65);
}

.banner-ribbon {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--c1) 0 20%, var(--c2) 20% 40%, var(--c3) 40% 60%, var(--c4) 60% 80%, var(--c5) 80% 100%);
}

.logo-box {
  width: 96px;
  height: 96px;
  margin: 0 auto 16px;
  padding: 10px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 14px 32px rgba(6, 21, 54, .5);
  display: grid;
  place-items: center;
}
.logo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.kicker {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--sky);
}

h1 {
  margin: 10px 0 0;
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(46px, 9vw, 66px);
  line-height: .9;
  text-transform: uppercase;
  letter-spacing: .01em;
  color: #FFFFFF;
}

.welcome {
  margin: 16px auto 0;
  max-width: 34ch;
  font-size: 17px;
  line-height: 1.55;
  color: #DCE7F8;
}

/* ===== BOTÓN PRINCIPAL LIMPIO (ESTILO JUMA) ===== */
.cta-wrap {
  margin-top: 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.btn-dl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 58px;
  padding: 0 26px;
  border-radius: 12px;
  background: #FFFFFF;
  color: var(--navy);
  font-family: var(--body);
  font-weight: 700;
  font-size: 17px;
  text-decoration: none;
  box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .55);
  transition: transform 160ms var(--ease-out), background-color 180ms ease;
}
.btn-dl:hover {
  background: var(--sky);
  transform: translateY(-2px);
}
.btn-dl:active {
  transform: scale(.97);
}
.btn-dl svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.status-note {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--sky);
}

@media (max-width: 760px) {
  .collage {
    grid-template-columns: repeat(3, minmax(130px, 1fr));
    grid-auto-rows: 165px;
    gap: 10px;
    inset: -4%;
  }
  .banner {
    padding: 30px 22px 66px;
  }
}
</style>
</head>
<body>

<div class="ribbon" aria-hidden="true"></div>

<!-- COLLAGE DE FOTOS DE JUMA DE FONDO -->
<div class="collage" aria-hidden="true">
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/hero-900.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/new-chicas-capilla.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/grupo-iglesia.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/coromoto.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/new-danza-capilla.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/ourem.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/new-fam-grupo-frente.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/cena.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/mirador.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/alegria.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/puente.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/new-grupo-presbiterio.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/retrato.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/fatima-banderas.jpg" alt=""></div>
  <div class="tile"><img src="https://gabrielg739-prog.github.io/juma/img/new-lectura-palabra.jpg" alt=""></div>
</div>
<div class="veil" aria-hidden="true"></div>

<!-- ESTANDARTE CENTRAL DE BIENVENIDA Y DESCARGA -->
<main class="stage">
  <div class="banner-wrap">
    <div class="rod" aria-hidden="true"></div>
    <section class="banner" aria-labelledby="t-title">
      <div class="banner-ribbon" aria-hidden="true"></div>

      <div class="logo-box">
        <img src="https://gabrielg739-prog.github.io/juma/img/logo.png" alt="Logo JUMA Duaca">
      </div>

      <span class="kicker">Juventud Misionera Allamaniana · Duaca</span>
      <h1 id="t-title">Bienvenido a JUMA</h1>

      <p class="welcome">
        Nos alegra caminar contigo en la fe y la misión. Descarga nuestra aplicación oficial en tu teléfono para comenzar.
      </p>

      <div class="cta-wrap">
        <a class="btn-dl" id="btn-apk" href="JUMA.apk" download="JUMA.apk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Descargar App JUMA (.APK)</span>
        </a>
        <p class="status-note" id="dl-note" role="status" aria-live="polite">
          Iniciando descarga automática…
        </p>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  var btn = document.getElementById('btn-apk');
  var note = document.getElementById('dl-note');
  setTimeout(function () {
    note.textContent = '✓ Descarga iniciada · Abre JUMA.apk al terminar';
    var a = document.createElement('a');
    a.href = btn.getAttribute('href');
    a.setAttribute('download', 'JUMA.apk');
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); }, 1500);
  }, 1000);
  btn.addEventListener('click', function () {
    note.textContent = '✓ Descargando JUMA.apk en tu teléfono…';
  });
})();
</script>
</body>
</html>
