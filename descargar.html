<head>

<title>JUMA Duaca · Descargar App Oficial</title>
<meta name="description" content="Descarga la aplicación oficial de JUMA Duaca · Juventud Misionera Allamaniana.">

<style>
:root {
  --navy: #061536;
  --cloth: #0C2D74;
  --royal: #2452C8;
  --sky: #8EC9FF;
  --ice: #DCE7F8;
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--navy);
  color: #FFFFFF;
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== FONDO DE COLLAGE DE FOTOS DE JUMA ===== */
.collage-bg {
  position: fixed;
  inset: -10% -10%;
  z-index: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(180px, 1fr));
  gap: 14px;
  transform: rotate(-5deg) scale(1.06);
  pointer-events: none;
  user-select: none;
}
.collage-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: floatCol 36s ease-in-out infinite alternate;
}
.collage-col:nth-child(2) { animation-duration: 42s; animation-direction: alternate-reverse; margin-top: -55px; }
.collage-col:nth-child(3) { animation-duration: 38s; margin-top: -25px; }
.collage-col:nth-child(4) { animation-duration: 46s; animation-direction: alternate-reverse; margin-top: -70px; }

@keyframes floatCol {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-95px); }
}

.collage-tile {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  background: #0A1F4D;
  box-shadow: 0 12px 28px rgba(0, 0, 0, .5);
  border: 1.5px solid rgba(142, 201, 255, .22);
}
.collage-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Velo azul suave sobre el collage */
.collage-veil {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(circle at 50% 50%, rgba(6, 21, 54, 0.48) 0%, rgba(6, 21, 54, 0.80) 75%, rgba(4, 13, 36, 0.92) 100%);
  pointer-events: none;
}

/* ===== CONTENEDOR PRINCIPAL ===== */
.page-wrap {
  position: relative;
  z-index: 5;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
}

/* ===== MARCO AZUL CENTRAL CON VIDEO EN MARCA DE AGUA ===== */
.card {
  position: relative;
  width: 100%;
  max-width: 470px;
  background: rgba(8, 28, 76, 0.86);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border: 1.5px solid rgba(142, 201, 255, 0.38);
  border-radius: 28px;
  box-shadow:
    0 28px 65px rgba(0, 0, 0, 0.68),
    0 0 42px rgba(36, 82, 200, 0.38);
  overflow: hidden;
  animation: cardIn 650ms var(--ease-out) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px) scale(0.98); }
  to { opacity: 1; transform: none; }
}

/* Video reproduciéndose como marca de agua dentro del marco azul */
.card-video-watermark {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.24;
  mix-blend-mode: screen;
  filter: saturate(1.1) contrast(1.08);
  pointer-events: none;
  z-index: 0;
}
.card-video-veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(6, 21, 54, 0.55) 0%, rgba(12, 45, 116, 0.62) 50%, rgba(6, 21, 54, 0.86) 100%);
  pointer-events: none;
  z-index: 1;
}

.card-body {
  position: relative;
  z-index: 2;
  padding: clamp(32px, 6vw, 48px) clamp(24px, 5vw, 38px);
  text-align: center;
}

/* ===== LOGO DE JUMA CON ARO AZUL CELESTE QUE COMBINA ===== */
.logo-ring {
  width: 106px;
  height: 106px;
  margin: 0 auto 20px;
  padding: 4px;
  border-radius: 50%;
  background: linear-gradient(145deg, #8EC9FF, #2452C8);
  box-shadow:
    0 0 0 4px rgba(142, 201, 255, 0.18),
    0 14px 32px rgba(6, 21, 54, 0.65);
  display: grid;
  place-items: center;
}
.logo-ring-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #FFFFFF;
  display: grid;
  place-items: center;
  padding: 7px;
}
.logo-ring img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ===== MENSAJE DE BIENVENIDA LIMPIO ===== */
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(42px, 8.5vw, 60px);
  line-height: 0.92;
  text-transform: uppercase;
  letter-spacing: 0.015em;
  color: #FFFFFF;
}
h1 span {
  display: block;
  color: var(--sky);
}

.welcome-text {
  margin: 16px auto 0;
  max-width: 34ch;
  font-size: 16.5px;
  line-height: 1.58;
  color: var(--ice);
}

/* ===== BOTÓN DE DESCARGA EN TONOS AZUL Y BLANCO ===== */
.btn-apk {
  margin-top: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 58px;
  padding: 14px 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2452C8 0%, #1B419F 100%);
  border: 1.5px solid var(--sky);
  color: #FFFFFF;
  text-decoration: none;
  font-weight: 700;
  font-size: 17.5px;
  letter-spacing: 0.01em;
  box-shadow:
    0 14px 32px rgba(6, 21, 54, 0.65),
    0 0 24px rgba(142, 201, 255, 0.28);
  transition: transform 160ms var(--ease-out), background 180ms ease, box-shadow 180ms ease;
  cursor: pointer;
}
.btn-apk:hover {
  background: linear-gradient(135deg, #2E62E6 0%, #2452C8 100%);
  transform: translateY(-2px);
  box-shadow:
    0 18px 36px rgba(6, 21, 54, 0.75),
    0 0 30px rgba(142, 201, 255, 0.42);
}
.btn-apk:active {
  transform: scale(0.98);
}
.btn-apk svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: var(--sky);
}

.status-note {
  margin: 12px 0 0;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--sky);
  opacity: 0.92;
}

@media (max-width: 680px) {
  .collage-bg {
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    inset: -8% -10%;
    gap: 10px;
  }
  .collage-col:nth-child(3),
  .collage-col:nth-child(4) {
    display: none;
  }
}
</style>
</head>

      <div class="logo-ring">
        <div class="logo-ring-inner">
          <img src="https://gabrielg739-prog.github.io/juma/img/logo.png" alt="Logo JUMA Duaca">

        Nos alegra que seas parte de nuestra familia misionera. Descarga nuestra aplicación oficial en tu teléfono para caminar juntos en la fe, la formación y la misión.
      </p>

      <a class="btn-apk" id="btn-download-apk" href="JUMA.apk" download="JUMA.apk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Descargar App JUMA (.APK)</span>
      </a>

      <p class="status-note" id="auto-text" role="status" aria-live="polite">
        Iniciando descarga automática…
      </p>
    </div>
  </section>
</main>

<script>
(function () {
  var btn = document.getElementById('btn-download-apk');
  var statusTxt = document.getElementById('auto-text');
  var vid = document.querySelector('.card-video-watermark');
  if (vid && vid.play) {
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }

  setTimeout(function () {
    statusTxt.textContent = '✓ Descarga iniciada · Abre JUMA.apk al terminar';
    var a = document.createElement('a');
    a.href = btn.getAttribute('href');
    a.setAttribute('download', 'JUMA.apk');
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); }, 1500);
  }, 1100);

  btn.addEventListener('click', function () {
    statusTxt.textContent = '✓ Descargando JUMA.apk en tu teléfono…';
  });
})();
</script>
