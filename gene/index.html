<style>

.act,.act2{border-radius:8px;padding:9px 16px;min-height:42px;font-weight:700;cursor:pointer}.act{background:var(--acc);border:0;color:#fff}.act2{background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.hint{color:var(--mut);margin:0;font-size:15px}.scorebar{font-size:15px;color:var(--mut)}.scorebar b{color:var(--ink);margin-right:10px}

var DATA=[{"k":"t","ch":"inicio","big":"Hola, soy Gene","lead":"Ingeniería de optimización, de Xin-She Yang · capítulos 1, 2 y 4","lines":[["¡Hola! Soy Gene. Soy una red neuronal: un sistema que aprende ajustando sus pesos, o sea, optimizando. Por eso este tema me toca de cerca.","","happy"],["Vamos a recorrer, sin saltarnos nada, los capítulos 1, 2 y 4 del libro Ingeniería de optimización, de Xin-She Yang."],["El capítulo 1 cuenta la historia de la optimización. El capítulo 2 explica cómo se plantea y se clasifica un problema de ingeniería. Y el capítulo 4 presenta los métodos clásicos para resolverlo.","","point"],["Cuando aparezca un científico, verás su retrato recreado. Cuando aparezca una ecuación, la construiremos paso a paso. Y al final tienes resúmenes, puntos clave y todos los ejercicios resueltos."],["Puedes pausar, saltar de escena o elegir un tema en el menú de abajo. Empezamos."]],"aud":[{"f":"audio/1jzhm78.mp3","t":[0,10.769,20.11,33.816,47.476]}]},{"k":"t","ch":"c1","big":"Capítulo 1","lead":"Breve historia de la optimización","lines":[["Capítulo 1: breve historia de la optimización."]],"aud":[{"f":"audio/m2nyzu.mp3","t":[0]}]},{"0":"i","1":"n","2":"t","3":"r","4":"o","k":"l","ch":"c1","code":"Capítulo 1 · Introducción","q":"La optimización está en todas partes","lines":[["La optimización está presente en todas partes: desde el diseño de ingeniería hasta los mercados financieros, desde nuestras actividades diarias hasta la planificación de las vacaciones, y desde las ciencias de la computación hasta las aplicaciones industriales.",0],["Siempre intentamos maximizar o minimizar algo. Fíjate en esta curva: buscar su punto más bajo es minimizar.",1,"point"],["Una organización quiere maximizar sus beneficios, minimizar sus costes y maximizar su rendimiento.",2],["Incluso al planificar unas vacaciones queremos maximizar el disfrute con el menor coste posible, o, idealmente, sin coste alguno.",2],["De hecho, buscamos constantemente las soluciones óptimas para cada problema que encontramos, aunque no siempre somos capaces de encontrarlas.",3]],"aud":[{"f":"audio/1hcr9nh.mp3","t":[0,16.086,24.777,31.413,40.417]}]},{"k":"l","ch":"c1","code":"Capítulo 1 · Introducción","q":"Tan antigua como la humanidad","bl":[["El principio del mínimo esfuerzo explica muchos comportamientos humanos.",1],["La distancia más corta entre dos puntos de un plano es una línea recta… pero demostrarlo formalmente requiere el cálculo de variaciones.",2],["Muchos fenómenos físicos obedecen el principio de mínima acción.",3],["La luz sigue el principio de Fermat: viaja en el menor tiempo posible, y de ahí sale la ley de Snell.",4],["Toda la mecánica analítica se basa en el principio de mínima acción.",5]],"lines":[["No es exagerado decir que buscar soluciones a problemas de optimización, de forma intencionada o inconsciente, es tan antiguo como la propia historia de la humanidad.",0],["Por ejemplo, el principio del mínimo esfuerzo suele explicar muchos comportamientos humanos.",1],["Sabemos que la distancia más corta entre dos puntos cualesquiera de un plano es una línea recta. Sin embargo, para demostrar formalmente que ese segmento es, efectivamente, el más corto, a menudo hacen falta matemáticas complejas, como el cálculo de variaciones.",2],["De hecho, muchos fenómenos físicos se rigen por el llamado principio de mínima acción, o por alguna de sus variantes.",3],["Por ejemplo, la luz se propaga obedeciendo el principio de Fermat: viaja de un medio a otro en el menor tiempo posible, y eso da lugar a la ley de Snell.",4,"point"],["Toda la mecánica analítica se basa en este principio de mínima acción.",5]],"aud":[{"f":"audio/1s2lta7.mp3","t":[0,10.014,16.255,34.014,41.567,51.697]}]},{"k":"c","ch":"c1","id":"1cqxh1l","q":"¿Qué principio explica que la luz se doble al cambiar de medio?","o":["El principio de mínimo esfuerzo","El principio de Fermat: viaja en el menor tiempo","La ley de rendimientos decrecientes","La desigualdad de Jensen"],"a":1,"w":  distancia entre dos puntos a lo largo de un camino reflejado en un espejo es la más corta cuando la luz se refleja cumpliendo cierta simetría.",0],["La luz sale de P, toca el espejo en un punto A y llega a Q. Movemos A y medimos la longitud total.",1],["El truco es reflejar Q por debajo del espejo. El camino más corto hasta ese reflejo es una recta, y esa recta corta el espejo justo en el punto óptimo.",2,"point"],["En ese punto, el ángulo de incidencia es igual al ángulo de reflexión. Es un problema de optimización muy conocido, llamado el problema de Herón, descrito por primera vez en su obra Catóptrica, o Sobre los espejos.",3]],"aud":[{"f":"audio/1atp98u.mp3","t":[0,13.846,20.795,31.993]}]},{"k":"c","ch":"c1a","id":"1d10sxi","q":"En el camino más corto reflejado en un espejo…","o":["el ángulo de incidencia es el doble del de reflexión","los ángulos de incidencia y reflexión son iguales","la luz toca el espejo en su centro","la luz no se refleja"],"a":1,"w":"Herón mostró que el camino P A Q es mínimo cuando ambos ángulos son iguales.","lines":[["En el camino más corto reflejado en un espejo…"]],"aud":[{"f":"audio/tblvxd.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Kepler, 1613","q":"El problema del matrimonio, o del secretario","viz":"kepler","who":["kepler","gardner"],"lines":[["El célebre astrónomo alemán Johannes Kepler es famoso sobre todo por descubrir sus tres leyes del movimiento planetario.",0],["Sin embargo, en 1613 encontró una solución óptima al llamado problema del matrimonio, o problema del secretario, cuando empezó a buscar a su segunda esposa.",1],["Describió su método en una carta personal fechada el 23 de octubre de 1613, dirigida al barón Strahlendorf. En ella incluía el balance de virtudes e inconvenientes de cada candidata, su dote, sus dudas y los consejos de sus amigos.",2],["De las once candidatas entrevistadas, Kepler eligió a la quinta, aunque un amigo le sugirió elegir a la cuarta. Esto podría implicar que Kepler intentaba optimizar algún tipo de función de utilidad.",3,"point"],["Martin Gardner presentó formalmente este problema en febrero de 1960, en su columna de juegos matemáticos de la revista Scientific American. Desde entonces se ha convertido en un campo de la optimización probabilística, como los problemas de parada óptima.",4]],"aud":[{"f":"audio/1jyqka8.mp3","t":[0,7.53,19.251,35.117,48.184]}]},{"k":"c","ch":"c1a","id":"1cgtarc","q":"¿A qué campo dio origen el problema del secretario de Kepler?","o":["A la programación lineal","A la optimización probabilística: problemas de parada óptima","Al cálculo de variaciones","A la teoría de grafos"],"a":1,"w":"Martin Gardner lo popularizó en 1960 y hoy es un clásico de parada óptima.","lines":[["¿A qué campo dio origen el problema del secretario de Kepler?"]],"aud":[{"f":"audio/imubnc.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Snell, Huygens y Descartes","q":"La ley de la refracción","viz":"snell","who":["snell","huygens","descartes"],"lines":[["Willebrord van Royen Snell descubrió la ley de la refracción en 1621, pero no la publicó. Más tarde, Christiaan Huygens mencionó los resultados de Snell en su obra Dióptrica, en 1703.",0],["La ley fue redescubierta de forma independiente por René Descartes, que la publicó en su tratado Discurso del método, en 1637.",1],["La luz va del punto A, en el aire, al punto B, en el agua, donde viaja más lento. Movemos el punto donde cruza la superficie y medimos el tiempo total.",1],["El tiempo mínimo no está sobre la línea recta: a la luz le conviene recorrer más camino en el aire, donde es rápida. Por eso se dobla.",2,"point"],["Ese quiebre cumple la ley de Snell: sen θ1 / v1 = sen θ2 / v2.",3]],"aud":[{"f":"audio/pfkja6.mp3","t":[0,14.113,23.755,35.999,45.177]}]},{"k":"l","ch":"c1a","code":"1.1 · Fermat, 1657","q":"El principio de Fermat","who":["fermat","descartes"],"big":1,"eq":[["\\frac{\\sin\\theta_1}{v_1}=\\frac{\\sin\\theta_2}{v_2}",3,"ley de Snell, deducida del menor tiempo"]],"bl":[["Unos 20 años después, los alumnos de Descartes contactan a Fermat para recopilar su correspondencia.",1],["En 1657 Fermat reexamina la explicación de Descartes, que le parecía insatisfactoria.",2],["Deduce los resultados de Snell y Descartes de un principio más fundamental: la luz siempre se propaga en el menor tiempo posible.",3],["Hoy se llama principio de Fermat y sentó las bases de la óptica moderna.",4]],"lines":[["Unos veinte años más tarde, cuando los alumnos de Descartes contactaron a Pierre de Fermat para recopilar su correspondencia con Descartes…",1],["Fermat volvió a examinar, en 1657, su discusión sobre la descripción insatisfactoria que Descartes había dado de la refracción de la luz.",2],["Y dedujo los resultados de Snell y de Descartes a partir de un principio más fundamental: la luz siempre se propaga en el menor tiempo posible, en cualquier medio.",3,"point"],["Este principio de la luz se conoce hoy como el principio de Fermat, y sentó las bases de la óptica moderna.",4]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mfrac><mrow><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><msub><mi>v</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><msub><mi>v</mi><mn>2</mn></msub></mfrac></mrow></math>"],"aud":[{"f":"audio/ynacnt.mp3","t":[0,8.981,19.123,29.637]}]},{"k":"c","ch":"c1a","id":"k4vi55","q":"¿Quién publicó primero la ley de refracción?","o":["Snell, en 1621","Huygens, en 1703","Descartes, en 1637","Fermat, en 1657"],"a":2,"w":"Snell la descubrió en 1621 pero no la publicó; Descartes la publicó en 1637 y Fermat la dedujo del menor tiempo en 1657.","lines":[["¿Quién publicó primero la ley de refracción?"]],"aud":[{"f":"audio/1ydafkp.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Newton y Galileo","q":"El cuerpo de mínima resistencia","who":["newton","galileo"],"big":1,"bl":[["1685: Newton plantea el problema de la forma del cuerpo de mínima resistencia.",1],["1687: lo resuelve en sus Principia Mathematica. Hoy se considera un problema del cálculo de variaciones.",2],["Objetivo: la forma de un cuerpo simétrico de revolución que minimice la resistencia al moverse en un fluido.",3],["Después dedujo la ley de resistencia de los cuerpos. Galileo había planteado un problema parecido en 1638, en sus Discursos.",4]],"lines":[["En sus Principia Mathematica, publicados en 1687, Sir Isaac Newton resolvió el problema de la forma del cuerpo de mínima resistencia, que él mismo había planteado en 1685.",1],["Fue un problema pionero en optimización, y hoy se considera un problema del cálculo de variaciones.",2],["El objetivo principal era hallar la forma de un cuerpo simétrico de revolución que minimizara la resistencia al moverse en un fluido.",3,"point"],["Posteriormente, Newton dedujo la ley de resistencia de los cuerpos. Curiosamente, Galileo Galilei había planteado de forma independiente un problema similar en 1638, en sus Discursos.",4]],"aud":[{"f":"audio/obzfms.mp3","t":[0,14.705,21.503,30.368]}]},{"k":"l","ch":"c1a","code":"1.1 · Bernoulli, 1696","q":"La braquistócrona","viz":"brach","who":["bernoulli","newton"],"lines":[["En junio de 1696, Johann Bernoulli logró avances significativos en el cálculo. En un artículo publicado en Acta Eruditorum, retó a todos los matemáticos del mundo:",0],["encontrar la forma, o curva, que une dos puntos a distinta altura de modo que un cuerpo caiga por ella en el menor tiempo posible por efecto de la gravedad. Es decir, la línea de descenso más rápido. Bernoulli ya conocía la solución.",1],["La recta es el camino más corto, pero no el más rápido. Mira la carrera.",2,"point"],["Gana la curva de abajo: baja fuerte al principio, gana velocidad pronto y eso compensa el recorrido más largo.",3,"happy"],["El 29 de enero de 1697, Newton recibió el reto al llegar a casa a las cuatro de la tarde, y no durmió hasta resolverlo, hacia las cuatro de la madrugada. Ese mismo día envió su solución.",3]],"aud":[{"f":"audio/1f2nakn.mp3","t":[0,12.719,27.831,33.282,41.451]}]},{"k":"l","ch":"c1a","code":"1.1 · Bernoulli, 1696","q":"La cicloide y el cálculo de variaciones","who":["newton","euler","lagrange"],"big":1,"bl":[["Newton tardó menos de 12 horas; era director de la Casa de la Moneda desde el 19 de marzo de 1696.",1],["Algunos dijeron que un genio así debía resolverlo en media hora: ¿la primera prueba de que el trabajo administrativo frena a una persona?",2],["La solución es parte de una cicloide. Hoy se llama problema de la braquistócrona.",3],["Inspiró a Euler y a Lagrange a formular la teoría general del cálculo de variaciones.",4]],"lines":[["Aunque Newton lo resolvió en menos de doce horas, como se había convertido en director de la Casa de la Moneda Real el 19 de marzo de 1696, algunos sugirieron que un genio de su calibre debería haberlo resuelto en media hora.",1],["Otros afirmaron, en broma, que este fue el primer indicio de que el exceso de trabajo administrativo ralentiza el progreso de una persona.",2],["La solución, tal como la conocemos hoy, es parte de una cicloide. Este descenso más rápido se conoce como el problema de la braquistócrona.",3,"point"],["Y fue lo que inspiró a Euler y a Lagrange a formular la teoría general del cálculo de variaciones.",4]],"aud":[{"f":"audio/t7ple3.mp3","t":[0,15.32,24.824,33.538]}]},{"k":"c","ch":"c1a","id":"4pjji0","q":"¿Cuál es la curva de descenso más rápido entre dos puntos?","o":["La recta","Una parábola","Un arco de cicloide","Una catenaria"],"a":2,"w":"Es la braquistócrona: un arco de cicloide. Inspiró a Euler y Lagrange a crear el cálculo de variaciones.","lines":[["¿Cuál es la curva de descenso más rápido entre dos puntos?"]],"aud":[{"f":"audio/1l8lzjs.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Maupertuis, 1746","q":"El principio de mínima acción","who":["maupertuis"],"big":1,"eq":[["S=\\int_{t_1}^{t_2} L\\,dt\\;\\rightarrow\\;\\text{estacionaria}",2,"acción: integral de un funcional (forma moderna)"]],"bl":[["Propuesto para unificar diversas leyes del movimiento físico y explicar todos los fenómenos.",1],["En lenguaje moderno: un principio variacional de acción estacionaria.",2],["Papel central en la mecánica clásica de Lagrange y de Hamilton; importante en matemáticas y física.",3]],"lines":[["En 1746, Pierre-Louis de Maupertuis propuso el principio de mínima acción para unificar diversas leyes del movimiento físico y explicar con él todos los fenómenos.",1],["En terminología moderna, es un principio variacional de acción estacionaria, expresado como la integral de un funcional, dentro del marco del cálculo de variaciones.",2,"point"],["Desempeña un papel central en la mecánica clásica lagrangiana y hamiltoniana, y es también un principio importante en matemáticas y en física.",3]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>S</mi><mo>=</mo><msubsup><mo movablelimits=\"false\">∫</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub></msubsup><mi>L</mi><mspace width=\"0.1667em\"></mspace><mi>d</mi><mi>t</mi><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">→</mo><mspace width=\"0.2778em\"></mspace><mtext>estacionaria</mtext></mrow></math>"],"aud":[{"f":"audio/12z0i55.mp3","t":[0,12.418,23.616]}]},{"k":"l","ch":"c1a","code":"1.1 · Monge, 1781","q":"El problema del transporte","viz":"transport","who":["monge","kantorovich"],"lines":[["En 1781, Gaspard Monge, un ingeniero civil francés, investigó el problema del transporte: cómo optimizar el transporte y la asignación de recursos conociendo la distribución espacial inicial y la final.",0],["Imagina montones de tierra que hay que llevar a varios huecos. ¿Qué asignación minimiza el trabajo total?",1,"point"],["Cada flecha es un envío, y su coste depende de la distancia.",2],["En 1942, Leonid Kantorovich demostró que este problema de optimización combinatoria es, de hecho, un caso de programación lineal.",3]],"aud":[{"f":"audio/xx1hsx.mp3","t":[0,15.576,22.629,26.839]}]},{"k":"c","ch":"c1a","id":"1oiu8ob","q":"¿Qué demostró Kantorovich en 1942 sobre el problema de Monge?","o":["Que no tiene solución","Que es un caso de programación lineal","Que es NP-completo","Que se resuelve con mínimos cuadrados"],"a":1,"w":"El problema del transporte de Monge (1781) es un caso de programación lineal.","lines":[["¿Qué demostró Kantorovich en 1942 sobre el problema de Monge?"]],"aud":[{"f":"audio/uov9kb.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Gauss, Legendre y Adrain","q":"Los mínimos cuadrados","viz":"lsq","who":["gauss","legendre","adrain"],"lines":[["Hacia 1801, Friedrich Gauss afirmó haber usado el método de los mínimos cuadrados para predecir la posición orbital del asteroide Ceres, aunque su versión, con una base matemática más rigurosa, se publicó más tarde, en 1809.",0],["La idea: tenemos datos con error y buscamos la recta que mejor los representa. Cada línea roja es un residuo.",1],["Elevamos cada residuo al cuadrado y los sumamos. La mejor recta es la que hace mínima esa suma.",2],["Mira cómo baja la suma mientras la recta gira hasta su sitio.",3,"point"],["En 1805, Adrien Legendre fue el primero en describir el método, en un apéndice de su libro Nuevo método para determinar las órbitas de los cometas, y en 1806 lo usó para ajustar curvas.",3]],"aud":[{"f":"audio/2lyjgi.mp3","t":[0,16.795,24.557,32.342,37.631]}]},{"k":"l","ch":"c1a","code":"1.1 · Gauss, Legendre y Adrain","q":"Una disputa por la prioridad","who":["gauss","legendre","adrain"],"big":1,"bl":[["Gauss afirmó llevar más de veinte años usando el método.",1],["Dijo haber sentado sus bases en 1795: hubo disputas acaloradas con Legendre.",2],["1808: Robert Adrain lo publica sin conocer a Legendre, estudiando la incertidumbre y los errores de las observaciones.",3]],"lines":[["Gauss afirmó más tarde que llevaba más de veinte años usando este método…",1],["…y que había sentado las bases del análisis de mínimos cuadrados en 1795. Esto provocó disputas acaloradas con Legendre.",2,"warn"],["En 1808, Robert Adrain, sin conocer el trabajo de Legendre, publicó el método de mínimos cuadrados al estudiar la incertidumbre y los errores al hacer observaciones, sin usar la misma terminología que Legendre.",3]],"aud":[{"f":"audio/12bsfm5.mp3","t":[0,5.196,14.851]}]},{"k":"c","ch":"c1a","id":"1g3j9l8","q":"¿Qué minimiza el método de mínimos cuadrados?","o":["La suma de los residuos","La suma de los cuadrados de los residuos","El residuo mayor","El número de datos"],"a":1,"w":"Se minimiza la suma de los cuadrados de los errores entre datos y modelo.","lines":[["¿Qué minimiza el método de mínimos cuadrados?"]],"aud":[{"f":"audio/52ilfw.mp3","t":[0]}]},{"k":"l","ch":"c1a","code":"1.1 · Ricardo, 1815","q":"Rendimientos decrecientes","viz":"ricardo","who":["ricardo"],"lines":[["En 1815, David Ricardo propuso la ley de los rendimientos decrecientes en el cultivo de la tierra, que puede aplicarse a numerosas actividades.",0],["Por ejemplo, la productividad de una parcela o de una fábrica solo aumenta marginalmente con cada incremento adicional de insumos. Mira la curva: cada escalón añade menos.",1,"point"],["Esta ley también se llama ley del coste de oportunidad creciente.",2],["Establece que hay una relación fundamental entre la oportunidad y la escasez de recursos, y exige que los recursos escasos se usen de forma eficiente.",3]],"aud":[{"f":"audio/konp0x.mp3","t":[0,10.165,22.873,27.291]}]},{"k":"l","ch":"c1a","code":"1.1 · Cauchy, 1847","q":"El origen del método del gradiente","viz":"descent","who":["cauchy"],"lines":[["En 1847, en una breve nota, Augustin-Louis Cauchy propuso un método general para resolver sistemas de ecuaciones de forma iterativa.",0],["Esto conduce esencialmente a dos métodos iterativos de minimización, hoy llamados método del gradiente y descenso más pronunciado, para ciertas funciones de más de una variable.",1,"point"],["La idea es la que ves: desde un punto, avanzar en la dirección en que la función baja más rápido, y repetir.",3],["Veremos este método con todo detalle, con números, en el capítulo 4.",5]],"aud":[{"f":"audio/1q0svc6.mp3","t":[0,10.618,21.782,29.683]}]},{"k":"c","ch":"c1a","id":"k90hb4","q":"¿Qué método nace de la nota de Cauchy de 1847?","o":["El simplex","El método del gradiente y el descenso más pronunciado","La búsqueda tabú","La programación dinámica"],"a":1,"w":"Su método iterativo dio origen al gradiente y al descenso más pronunciado.","lines":[["¿Qué método nace de la nota de Cauchy de 1847?"]],"aud":[{"f":"audio/uzvjvk.mp3","t":[0]}]},{"k":"t","ch":"c1b","big":"1.2 El siglo XX","lead":"Convexidad, viajantes, programación lineal y dinámica","lines":[["Sección 1.2: el siglo veinte."]],"aud":[{"f":"audio/em560w.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Jensen, 1906","q":"La convexidad","viz":"convex","who":["jensen"],"lines":[["En 1906, el matemático danés Johan Jensen introdujo el concepto de convexidad y dedujo una desigualdad, hoy llamada desigualdad de Jensen, importante en la optimización convexa y en otras áreas como la economía.",0],["Una función es convexa si la cuerda entre dos de sus puntos queda siempre por encima de la curva.",1,"point"],["A la derecha, una función que no es convexa: la cuerda cruza la curva y aparecen varios valles.",2],["La optimización convexa es una clase especial pero muy importante, porque cualquier solución óptima encontrada está garantizada como óptima global.",3,"happy"],["Muchos problemas pueden reformularse como convexos, por eso tiene numerosas aplicaciones: sistemas de control, ajuste de datos y modelado, diseño óptimo, procesamiento de señales, finanzas matemáticas y otras.",3]],"aud":[{"f":"audio/1qacowg.mp3","t":[0,15.668,21.759,29.161,38.803]}]},{"k":"c","ch":"c1b","id":"kanbc8","q":"¿Por qué es tan valiosa la optimización convexa?","o":["Porque es lineal","Porque cualquier óptimo encontrado es global","Porque no tiene restricciones","Porque siempre es discreta"],"a":1,"w":"En un problema convexo, el óptimo local es también el global.","lines":[["¿Por qué es tan valiosa la optimización convexa?"]],"aud":[{"f":"audio/2syxuw.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Euler, Kirkman y Hamilton","q":"Recorridos por grafos","viz":"knight","who":["euler","kirkman","hamilton"],"lines":[["Ya en 1766, Leonhard Euler estudió el problema del recorrido del caballo: mover un caballo de ajedrez de modo que pase por todas las casillas exactamente una vez.",1,"point"],["Thomas Kirkman publicó un trabajo sobre cómo encontrar un recorrido que pase por cada vértice una y solo una vez en el grafo de un poliedro.",2],["Y en 1856, Sir William Rowan Hamilton popularizó su recorrido icosiano, un juego sobre los vértices de un dodecaedro.",3]],"aud":[{"f":"audio/1kxwyoj.mp3","t":[0,12.162,21.851]}]},{"k":"l","ch":"c1b","code":"1.2 · Menger, 1930","q":"El problema del viajante","viz":"tsp","who":["menger"],"lines":[["En febrero de 1930, Karl Menger planteó el problema del mensajero en un coloquio matemático en Viena, porque es un problema que enfrentan a menudo los carteros y los viajeros. Su trabajo se publicó en 1932.",0],["La tarea es encontrar el camino más corto que conecte un número finito de puntos, o ciudades, cuyas distancias por pares se conocen.",1],["En general, la regla simple de ir siempre al punto más cercano no da el camino más corto. Mira la ruta que produce.",2],["Ahora la ruta óptima: es más corta.",3,"point"],["Aunque el problema se puede resolver con un número finito de permutaciones, no existe un algoritmo eficiente para hallar la solución. Hoy se conoce como problema del viajante, relacionado con el enrutamiento en redes, la asignación de recursos, la programación de tareas y la investigación operativa.",3],["Ya en 1832, un manual para viajantes describía un recorrido por 45 ciudades alemanas con una ruta de 1248 kilómetros, aunque los fundamentos matemáticos exactos son bastante oscuros y pudieron existir antes de 1930.",3]],"aud":[{"f":"audio/1v1tsp5.mp3","t":[0,15.912,24.417,33.12,36.447,55.714]}]},{"k":"c","ch":"c1b","id":"vofajg","q":"¿Ir siempre a la ciudad más cercana da la ruta óptima del viajante?","o":["Sí, siempre","No necesariamente","Solo con menos de 10 ciudades","Solo si las ciudades están en círculo"],"a":1,"w":"La regla codiciosa del vecino más cercano en general no da el camino más corto.","lines":[["¿Ir siempre a la ciudad más cercana da la ruta óptima del viajante?"]],"aud":[{"f":"audio/n7q21o.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Hancock, 1917 · Kantorovich, 1939","q":"Primer libro y primera programación lineal","who":["hancock","kantorovich","koopmans"],"big":1,"bl":[["1917: Harris Hancock publica el primer libro sobre optimización, «Teoría de mínimos y máximos».",1],["1939: Kantorovich desarrolla el primer algoritmo de programación lineal y lo aplica a la economía.",2],["Formula el problema de producción de la planificación óptima y métodos eficaces para resolverlo.",3],["1975: comparte el Premio Nobel con Tjalling Koopmans.",4]],"lines":[["Curiosamente, Harris Hancock publicó en 1917 el primer libro sobre optimización: Teoría de mínimos y máximos.",1],["En 1939, Leonid Kantorovich fue el primero en desarrollar un algoritmo para la programación lineal y en aplicarlo a la economía.",2],["Formuló el problema de producción de la planificación óptima y métodos eficaces para hallar sus soluciones mediante programación lineal.",3],["Por este trabajo compartió el Premio Nobel con Tjalling Koopmans en 1975.",4,"happy"]],"aud":[{"f":"audio/tphbz6.mp3","t":[0,9.097,18.647,27.257]}]},{"k":"l","ch":"c1b","code":"1.2 · Dantzig, 1947","q":"El método simplex","who":["dantzig","kantorovich","koopmans","dorfman"],"bl":[["Dorfman (1984): la programación lineal se descubrió tres veces, de forma independiente, entre 1939 y 1947.",1],["Primero Kantorovich (ruso), luego Koopmans (neerlandés) y, en 1947, Dantzig (estadounidense).",2],["El simplex resuelve problemas de decisión de políticas óptimas de gran complejidad.",3],["Ejemplo clásico: la dieta óptima, con 9 ecuaciones y 77 incógnitas, resuelta con calculadoras de escritorio.",4]],"lines":[["El siguiente paso importante fue que George Dantzig inventó en 1947 un método sencillo para resolver problemas de programación lineal a gran escala.",0],["Dorfman escribió en un artículo de 1984 que la programación lineal se descubrió tres veces, de forma independiente, entre 1939 y 1947, cada vez de forma ligeramente distinta.",1],["El primer descubrimiento fue del matemático ruso Kantorovich, luego del economista neerlandés Koopmans, y el tercero, en 1947, del matemático estadounidense George Dantzig.",2],["El revolucionario método simplex de Dantzig es capaz de resolver una amplia gama de problemas de decisión de políticas óptimas de gran complejidad.",3,"point"],["Un ejemplo clásico, uno de los primeros, descrito en el libro de Dantzig de 1963, fue hallar la dieta óptima: un problema con 9 ecuaciones y 77 incógnitas, resuelto con calculadoras de escritorio manuales.",4]],"aud":[{"f":"audio/1cmtvco.mp3","t":[0,11.361,27.447,40.887,50.46]}]},{"k":"c","ch":"c1b","id":"9nw0nc","q":"¿Cuántas veces se descubrió la programación lineal entre 1939 y 1947, según Dorfman?","o":["Una","Dos","Tres","Cuatro"],"a":2,"w":"Tres veces: Kantorovich, Koopmans y Dantzig.","lines":[["¿Cuántas veces se descubrió la programación lineal entre 1939 y 1947, según Dorfman?"]],"aud":[{"f":"audio/cm5jbc.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Karush, Kuhn y Tucker","q":"Las condiciones de optimalidad","who":["karush","kuhn","tucker"],"big":1,"bl":[["1951: Kuhn y Tucker estudian la optimización no lineal y reformulan la condición de optimalidad.",1],["Karush había propuesto condiciones similares en 1939, en su tesis de maestría.",2],["Son la generalización de los multiplicadores de Lagrange a desigualdades no lineales.",3],["Hoy: condiciones de Karush-Kuhn-Tucker (KKT), necesarias para que una solución sea óptima en programación no lineal.",4]],"lines":[["En 1951, Harold Kuhn y Albert Tucker estudiaron el problema de optimización no lineal y reformularon la condición de optimalidad.",1],["William Karush había propuesto condiciones similares en 1939, en su tesis de maestría.",2],["De hecho, estas condiciones de optimalidad son la generalización de los multiplicadores de Lagrange a las desigualdades no lineales.",3,"point"],["Hoy se conocen como condiciones de Karush-Kuhn-Tucker, o simplemente de Kuhn-Tucker, y son condiciones necesarias para que una solución sea óptima en programación no lineal. Las resolveremos en el capítulo 4.",4]],"aud":[{"f":"audio/raqbl3.mp3","t":[0,10.038,17.08,25.573]}]},{"k":"c","ch":"c1b","id":"gbb5jn","q":"Las condiciones KKT generalizan…","o":["el método de Newton","los multiplicadores de Lagrange a desigualdades","el simplex a problemas no lineales","la programación dinámica"],"a":1,"w":"Son la generalización de los multiplicadores de Lagrange a restricciones de desigualdad.","lines":[["Las condiciones KKT generalizan…"]],"aud":[{"f":"audio/dlaaud.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Bellman, 1957","q":"Programación dinámica","who":["bellman","vonneumann","morgenstern"],"big":1,"bl":[["1957: Bellman (Stanford) desarrolla la programación dinámica y el principio de optimalidad, en la RAND Corporation.",1],["Estudiaba procesos de decisión y planificación en múltiples etapas; acuñó el término «programación dinámica».",2],["La idea se remonta a 1944: von Neumann y Morgenstern y los problemas de decisión secuencial.",3],["Von Neumann también hizo aportes importantes a la investigación operativa.",4]],"lines":[["Posteriormente, en 1957, Richard Bellman, de la Universidad de Stanford, desarrolló la programación dinámica y el principio de optimalidad mientras estudiaba procesos de decisión y planificación en múltiples etapas, durante su estancia en la RAND Corporation.",1],["También acuñó el término programación dinámica.",2],["La idea se remonta a 1944, cuando John von Neumann y Oskar Morgenstern estudiaron los problemas de decisión secuencial.",3],["John von Neumann también hizo contribuciones importantes al desarrollo de la investigación operativa.",4]],"aud":[{"f":"audio/1dd925h.mp3","t":[0,18.42,21.735,31.018]}]},{"k":"c","ch":"c1b","id":"1mktl4l","q":"¿Quién desarrolló la programación dinámica y el principio de optimalidad?","o":["Dantzig","Bellman","Turing","Holland"],"a":1,"w":"Richard Bellman, en 1957, en la RAND Corporation.","lines":[["¿Quién desarrolló la programación dinámica y el principio de optimalidad?"]],"aud":[{"f":"audio/g3v01h.mp3","t":[0]}]},{"k":"l","ch":"c1b","code":"1.2 · Investigación operativa","q":"De Babbage a la explosión de los años sesenta","who":["babbage"],"big":1,"bl":[["1840: Charles Babbage estudia el coste del transporte y la clasificación del correo: quizá la primera investigación operativa.",1],["Avances significativos durante la Segunda Guerra Mundial.",2],["Hoy: redes de comunicación, planificación de proyectos, programación, transporte y gestión.",3],["Desde 1960 la bibliografía crece de forma exponencial; el libro se centra en heurísticas y metaheurísticas.",4]],"lines":[["Ya en 1840, Charles Babbage estudió el coste del transporte y la clasificación del correo; esta podría ser la investigación más temprana sobre investigación operativa.",1],["Se lograron avances significativos durante la Segunda Guerra Mundial…",2],["…y desde entonces se ha ampliado para encontrar soluciones óptimas, o casi óptimas, en una amplia gama de problemas complejos e interdisciplinarios: redes de comunicación, planificación de proyectos, programación, planificación del transporte y gestión.",3],["A partir de la década de 1960, la bibliografía sobre optimización se multiplicó de forma exponencial; haría falta un libro entero para escribir siquiera una breve historia desde entonces.",4],["Como este libro trata sobre todo de algoritmos metaheurísticos, la historia se centra a partir de aquí en las heurísticas y metaheurísticas. De hecho, una parte importante de los algoritmos de optimización nuevos son metaheurísticos.",4]],"aud":[{"f":"audio/1b7s2ln.mp3","t":[0,12.371,17.602,36.011,49.659]}]},{"k":"t","ch":"c1c","big":"1.3 Heurísticas y metaheurísticas","lead":"De Turing a las luciérnagas","lines":[["Sección 1.3: heurísticas y metaheurísticas."]],"aud":[{"f":"audio/lqrkdz.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Definición","q":"¿Qué es una heurística?","viz":"treasure","lines":[["Una heurística es una estrategia de resolución basada en prueba y error para generar soluciones aceptables a un problema complejo en un tiempo razonablemente práctico.",0],["La complejidad del problema hace imposible buscar todas las soluciones o combinaciones posibles. Probar puntos al azar es lo más básico.",1],["El objetivo es encontrar soluciones buenas y viables en un plazo aceptable. No hay garantía de encontrar las mejores, y a veces ni siquiera sabemos si un algoritmo funcionará ni por qué.",2,"warn"],["La idea es tener un algoritmo eficiente y práctico que funcione la mayor parte de las veces y produzca soluciones de buena calidad.",3],["Entre las soluciones de calidad encontradas, se espera que algunas sean casi óptimas, aunque no hay garantía de dicha optimalidad.",4]],"aud":[{"f":"audio/b42j.mp3","t":[0,13.056,22.409,34.826,43.308]}]},{"k":"c","ch":"c1c","id":"a3vxad","q":"Una heurística garantiza…","o":["la solución óptima global","una solución buena en tiempo razonable, sin garantía de ser óptima","que el algoritmo converge siempre","el mínimo número de pasos"],"a":1,"w":"Busca soluciones buenas y viables en un tiempo práctico, sin garantía de optimalidad.","lines":[["Una heurística garantiza…"]],"aud":[{"f":"audio/1dt2j4.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Turing, 1940","q":"La Bombe y la búsqueda heurística","viz":"bombe","who":["turing","welchman"],"lines":[["Alan Turing fue probablemente el primero en usar algoritmos heurísticos, durante la Segunda Guerra Mundial, cuando descifraba los códigos alemanes de Enigma en Bletchley Park.",0],["Allí, Turing y el matemático británico Gordon Welchman diseñaron en 1940 una máquina criptoanalítica electromecánica, la Bombe, para facilitar el descifrado.",1],["La Bombe usaba un algoritmo heurístico, como lo llamaba Turing, para buscar entre unas 10 elevado a 22 combinaciones posibles la configuración probablemente correcta de un mensaje de Enigma.",2,"point"],["Turing llamó a su método búsqueda heurística porque, aunque se esperaba que funcionara la mayoría de las veces, no había garantía de encontrar la solución correcta. Aun así, fue un éxito rotundo.",3,"happy"]],"aud":[{"f":"audio/1rd4xlj.mp3","t":[0,11.419,23.488,36.405]}]},{"k":"c","ch":"c1c","id":"wwls0b","q":"¿Para qué usó Turing la búsqueda heurística?","o":["Para ordenar números","Para descifrar los códigos de Enigma con la Bombe","Para diseñar aviones","Para el problema del transporte"],"a":1,"w":"En 1940, en Bletchley Park, para buscar la configuración de Enigma.","lines":[["¿Para qué usó Turing la búsqueda heurística?"]],"aud":[{"f":"audio/c3wngr.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Turing, 1945-1948","q":"Maquinaria inteligente","who":["turing"],"big":1,"bl":[["1945: Turing entra al Laboratorio Nacional de Física (NPL) del Reino Unido.",1],["Presenta su diseño del Motor de Cálculo Automático (ACE).",2],["1948, informe «Maquinaria inteligente»: inteligencia y aprendizaje automáticos, redes neuronales y algoritmos evolutivos.",3]],"lines":[["En 1945, Turing fue contratado por el Laboratorio Nacional de Física del Reino Unido, donde presentó su diseño del Motor de Cálculo Automático, el ACE.",1,"point"],["En un informe del laboratorio de 1948, titulado Maquinaria inteligente, esbozó sus ideas innovadoras sobre la inteligencia y el aprendizaje de las máquinas…",2],["…las redes neuronales, como yo, y los algoritmos evolutivos, una versión temprana de los algoritmos genéticos.",3,"happy"]],"aud":[{"f":"audio/19lwccl.mp3","t":[0,11.872,23.814]}]},{"k":"l","ch":"c1c","code":"1.3 · Holland y De Jong","q":"Los algoritmos genéticos","viz":"ga","who":["holland","dejong"],"lines":[["El siguiente paso significativo fue el desarrollo de los algoritmos evolutivos en las décadas de 1960 y 1970. Primero, John Holland y sus colaboradores de la Universidad de Míchigan desarrollaron los algoritmos genéticos.",0],["Ya en 1962, Holland estudió los sistemas adaptativos y fue el primero en usar operaciones de cruce y recombinación para modelarlos. Su influyente libro, que resume el desarrollo de los algoritmos genéticos, se publicó en 1975.",1],["Ese mismo año, Kenneth De Jong terminó su importante tesis doctoral, que demostró el potencial de los algoritmos genéticos para funciones objetivo ruidosas, multimodales o incluso discontinuas.",1],["Los algoritmos genéticos son un método de búsqueda basado en la abstracción de la evolución darwiniana y la selección natural, representadas con operadores matemáticos: cruce o recombinación, mutación, aptitud y selección del más apto. Mira cómo la población sube generación tras generación.",2,"point"],["Han tenido tanto éxito que se han escrito miles de artículos y cientos de libros. Algunas estadísticas muestran que la gran mayoría de las empresas de la lista Fortune 500 los usan para resolver problemas combinatorios complejos como la planificación, el ajuste de datos y la programación de tareas.",3]],"aud":[{"f":"audio/16rlm21.mp3","t":[0,15.843,34.146,47.586,67.132]}]},{"k":"c","ch":"c1c","id":"cwmgla","q":"¿Cuáles son los operadores de un algoritmo genético?","o":["Pivote y holgura","Cruce, mutación, aptitud y selección","Gradiente y hessiana","Temperatura y enfriamiento"],"a":1,"w":"Imitan la evolución de Darwin: cruce o recombinación, mutación, aptitud y selección del más apto.","lines":[["¿Cuáles son los operadores de un algoritmo genético?"]],"aud":[{"f":"audio/1b1vm0u.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Rechenberg, Schwefel y Fogel","q":"Estrategias evolutivas y programación evolutiva","who":["rechenberg","schwefel","bienert","fogel"],"bl":[["1963, Universidad Técnica de Berlín: Rechenberg y Schwefel crean las estrategias evolutivas para la ingeniería aeroespacial.",1],["Peter Bienert construye un «experimentador automático» con reglas simples de mutación y selección.",2],["Sin cruce: solo mutación para producir descendencia, conservando en cada generación la solución mejorada. Es una escalada de colinas con aleatorización.",3],["1960: Fogel propone la evolución simulada como proceso de aprendizaje. 1966: con Owens y Walsh crea la programación evolutiva, con máquinas de estados finitos mutadas al azar.",4],["Todo esto forma hoy la computación evolutiva.",5]],"lines":[["En el mismo periodo, Ingo Rechenberg y Hans-Paul Schwefel, ambos entonces en la Universidad Técnica de Berlín, desarrollaron en 1963 una técnica de búsqueda para problemas de ingeniería aeroespacial, llamada estrategia evolutiva.",1],["Más tarde, Peter Bienert se unió a ellos y empezó a construir un experimentador automático usando reglas sencillas de mutación y selección.",2],["En esta técnica no hay cruce: solo se usa la mutación para producir descendencia, y en cada generación se conserva la solución mejorada. Es, en esencia, un algoritmo sencillo de escalada de colinas con aleatorización.",3,"point"],["Ya en 1960, Lawrence Fogel se propuso usar la evolución simulada como proceso de aprendizaje y herramienta para estudiar la inteligencia artificial. En 1966, junto con Owens y Walsh, desarrolló la programación evolutiva, representando las soluciones como máquinas de estados finitos y mutando una de ellas al azar.",4],["Estas ideas evolucionaron hasta formar una disciplina más amplia: los algoritmos evolutivos y la computación evolutiva.",5]],"aud":[{"f":"audio/1ckwxro.mp3","t":[0,16.214,24.766,39.308,62.093]}]},{"k":"c","ch":"c1c","id":"3lzcbf","q":"¿Qué operador NO usaban las estrategias evolutivas de Rechenberg y Schwefel?","o":["La mutación","La selección","El cruce","La conservación de la mejor solución"],"a":2,"w":"Solo usaban mutación y selección, sin cruce: una escalada de colinas con aleatorización.","lines":[["¿Qué operador NO usaban las estrategias evolutivas de Rechenberg y Schwefel?"]],"aud":[{"f":"audio/up2v2z.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Kirkpatrick, Gelatt y Vecchi, 1983","q":"El recocido simulado","viz":"anneal","who":["kirkpatrick","gelatt","vecchi"],"lines":[["Las décadas de 1980 y 1990 fueron la época más apasionante para los algoritmos metaheurísticos. El siguiente gran paso fue el recocido simulado, en 1983, de Kirkpatrick, Gelatt y Vecchi, inspirado en el recocido de los metales.",0],["Es un algoritmo de búsqueda basado en trayectorias: parte de una solución inicial a alta temperatura y enfría el sistema gradualmente.",1],["Un movimiento o nueva solución se acepta si es mejor; si no, se acepta con cierta probabilidad. Eso permite al sistema escapar de cualquier óptimo local.",2,"point"],["Se espera que, si el sistema se enfría lo bastante despacio, se alcance la solución óptima global.",3]],"aud":[{"f":"audio/3n1lcc.mp3","t":[0,19.778,29.27,39.285]}]},{"k":"c","ch":"c1c","id":"pqp8tt","q":"¿Por qué el recocido simulado acepta a veces soluciones peores?","o":["Por error","Para escapar de óptimos locales","Para ir más rápido","Porque no tiene objetivo"],"a":1,"w":"Aceptar pasos peores con cierta probabilidad le permite salir de valles locales.","lines":[["¿Por qué el recocido simulado acepta a veces soluciones peores?"]],"aud":[{"f":"audio/1y9a9ip.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Glover, Dorigo y Koza","q":"Tabú, hormigas y programación genética","viz":"ants","who":["glover","dorigo","koza"],"lines":[["El primer uso real de una metaheurística se remonta probablemente a la búsqueda tabú de Fred Glover, en 1986, aunque su influyente libro se publicó en 1997.",0],["En 1992, Marco Dorigo terminó su tesis doctoral sobre optimización y algoritmos naturales, donde describió la optimización por colonias de hormigas.",1],["Se inspira en la inteligencia colectiva de las hormigas, que usan feromonas como mensajeros químicos: los caminos cortos acumulan más feromona y atraen a más hormigas.",2,"point"],["También en 1992, John Koza, de Stanford, publicó un tratado sobre programación genética, que sentó las bases de un campo nuevo del aprendizaje automático. Ya en 1988 había registrado su primera patente. La idea es usar el principio genético para criar programas informáticos y producir los mejores para cada tipo de problema.",3]],"aud":[{"f":"audio/1q0mkrg.mp3","t":[0,12.638,23.465,34.942]}]},{"k":"c","ch":"c1c","id":"1crudie","q":"¿En qué se inspira la optimización por colonias de hormigas?","o":["En el enfriamiento de metales","En las feromonas que dejan las hormigas","En la evolución de Darwin","En las bandadas de aves"],"a":1,"w":"Las hormigas se comunican con feromonas; los caminos cortos acumulan más y atraen a más hormigas.","lines":[["¿En qué se inspira la optimización por colonias de hormigas?"]],"aud":[{"f":"audio/2o1n6u.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Kennedy y Eberhart, 1995","q":"Optimización por enjambre de partículas","viz":"swarm","who":["kennedy","eberhart"],"lines":[["Poco después, en 1995, el psicólogo social James Kennedy y el ingeniero Russell Eberhart desarrollaron la optimización por enjambre de partículas, PSO.",0],["Está inspirada en la inteligencia colectiva de peces y aves, e incluso en el comportamiento humano. Los agentes, llamados partículas, se mueven por el espacio de búsqueda partiendo de posiciones aleatorias.",1],["El enjambre comunica la mejor solución actual y comparte la mejor global para concentrarse en las soluciones de calidad. Mira cómo se agrupan en la zona más oscura, el mínimo.",2,"point"],["Desde entonces han surgido unas 20 variantes, aplicadas a casi todas las áreas con problemas complejos. Hay pruebas sólidas de que PSO supera a los algoritmos tradicionales e incluso a los genéticos en la mayoría de los problemas, aunque esto dista de ser concluyente.",3]],"aud":[{"f":"audio/w5xhwn.mp3","t":[0,12.603,26.704,39.076]}]},{"k":"c","ch":"c1c","id":"qqoox0","q":"En PSO, cada partícula se mueve guiada por…","o":["solo el azar","su mejor posición y la mejor del grupo","la hessiana","la temperatura"],"a":1,"w":"Combina la mejor posición personal con la mejor global del enjambre.","lines":[["En PSO, cada partícula se mueve guiada por…"]],"aud":[{"f":"audio/cpn02m.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Wolpert y Macready, 1997","q":"No hay almuerzo gratis","viz":"nfl","who":["wolpert","macready"],"lines":[["En 1997, la publicación de los teoremas de no hay almuerzo gratis en optimización, de David Wolpert y William Macready, causó un gran revuelo en la comunidad.",0],["Los investigadores siempre habían buscado algoritmos mejores, o incluso universalmente robustos, sobre todo para problemas NP difíciles. Pero estos teoremas establecen que si el algoritmo A funciona mejor que B en algunas funciones, entonces B supera a A en otras.",1],["Si se promedia sobre todo el espacio de funciones posibles, A y B rinden igual de bien. No existe un algoritmo universalmente mejor. Decepcionante, ¿verdad?",2,"warn"],["Pero no necesitamos el promedio sobre todas las funciones: queremos las mejores soluciones para nuestro problema concreto. Y sabemos por experiencia que algunos algoritmos superan a otros en ciertos tipos de problemas.",3,"point"],["Así que la investigación se centra en encontrar el mejor algoritmo para cada tipo de problema, para la mayoría de los problemas, no para todos. La búsqueda continúa.",3]],"aud":[{"f":"audio/tycylg.mp3","t":[0,11.721,30.42,41.618,55.046]}]},{"k":"c","ch":"c1c","id":"1hoed9c","q":"Según los teoremas NFL…","o":["PSO es el mejor algoritmo","promediado sobre todas las funciones, todos los algoritmos rinden igual","no hay que crear algoritmos nuevos","el simplex es universal"],"a":1,"w":"No hay un algoritmo universalmente mejor; sí hay mejores para problemas concretos.","lines":[["Según los teoremas NFL…"]],"aud":[{"f":"audio/y0azwp.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"1.3 · Siglo XXI","q":"Armonías, abejas y luciérnagas","who":["geem","nakrani","tovey","pham","karaboga","yang"],"bl":[["2001: Zong Woo Geem y otros crean la búsqueda armónica (HS): distribución de agua, transporte, programación.",1],["2004: Nakrani y Tovey proponen el algoritmo de la abeja melífera para centros de alojamiento web.",2],["2005: algoritmo de abejas de D. T. Pham y colaboradores; Colonia Artificial de Abejas (ABC) de Karaboga.",3],["2008: el autor del libro, Xin-She Yang, crea el algoritmo de las luciérnagas (FA).",4],["Cada vez hay más metaheurísticas: el libro intenta presentar las más recientes e importantes con sus aplicaciones.",5]],"lines":[["A principios del siglo veintiuno la situación se volvió aún más apasionante. En 2001, Zong Woo Geem y otros desarrollaron la búsqueda armónica, aplicada a la distribución de agua, la modelización del transporte y la programación.",1],["En 2004, Sunil Nakrani y Craig Tovey propusieron el algoritmo de la abeja melífera y su aplicación a la optimización de centros de alojamiento web.",2],["Le siguió en 2005 un novedoso algoritmo de abejas de D. T. Pham y colaboradores, y la Colonia Artificial de Abejas de Derviş Karaboğa.",3],["En 2008, el autor de este libro, Xin-She Yang, desarrolló el algoritmo de las luciérnagas. Se publicaron muchos artículos sobre él y ha despertado un amplio interés.",4,"point"],["Como vemos, cada vez se desarrollan más algoritmos metaheurísticos. Una gama tan diversa requiere un resumen sistemático, y el libro intenta presentar las metaheurísticas más recientes e importantes, junto con sus aplicaciones.",5]],"aud":[{"f":"audio/6kdo8h.mp3","t":[0,15.181,25.323,35.685,48.358]}]},{"k":"c","ch":"c1c","id":"1lpfvr7","q":"¿Quién creó el algoritmo de las luciérnagas y cuándo?","o":["Dorigo, 1992","Karaboga, 2005","Xin-She Yang, 2008","Geem, 2001"],"a":2,"w":"Lo creó en 2008 el propio autor del libro.","lines":[["¿Quién creó el algoritmo de las luciérnagas y cuándo?"]],"aud":[{"f":"audio/1c10zer.mp3","t":[0]}]},{"k":"l","ch":"c1c","code":"Capítulo 1 · Ejercicios y referencias","q":"Ejercicios propuestos del capítulo 1","bl":[["1.1 Halla el valor mínimo de f(x) = x² − x − 6 en (−∞, ∞).",1],["1.2 Para el problema anterior, usa la derivación simple para obtener el mismo resultado.",1],["1.3 Euclides demostró que, con perímetro fijo, el cuadrado encierra la mayor área entre todos los rectángulos. Da tu propia demostración.",2],["1.4 Diseña un depósito cilíndrico que use el mínimo material con la mayor capacidad. ¿Qué relación hay entre el radio r de la base y la altura h?",2],["1.5 Herón demostró que el camino PAQ es el más corto cuando el ángulo de incidencia α es igual al de reflexión β. Demuestra que α = β da la distancia PAQ más corta.",3]],"lines":[["El capítulo 1 termina con cinco ejercicios. Aquí están los enunciados.",1],["El 1.3 y el 1.4 piden demostraciones de optimización geométrica.",2],["Y el 1.5 pide demostrar el resultado de Herón. Todos están resueltos paso a paso en la sección final de ejercicios. El capítulo cierra con 41 referencias, que puedes consultar en la pestaña Referencias.",3,"point"]],"aud":[{"f":"audio/1sc8xr1.mp3","t":[0,5.568,11.101]}]},{"k":"t","ch":"c2","big":"Capítulo 2","lead":"Optimización en ingeniería","lines":[["Capítulo 2: optimización en ingeniería."]],"aud":[{"f":"audio/1dw4rrk.mp3","t":[0]}]},{"k":"l","ch":"c2","code":"Capítulo 2 · Introducción","q":"Muchos problemas, ningún método único","bl":[["La optimización abarca una gama muy amplia de problemas cuyo objetivo es buscar cierta optimalidad.",1],["Hay muchas formas de nombrar y clasificar estos problemas.",2],["Las técnicas de optimización pueden variar mucho de un problema a otro.",3],["No es posible un enfoque unificado: la complejidad depende sobre todo de la forma de las funciones objetivo y de las restricciones.",4]],"lines":[["La optimización puede abarcar una amplia gama de problemas cuyo objetivo es buscar cierta optimalidad.",1],["Por eso existen muchas formas distintas de nombrar y clasificar los problemas de optimización…",2],["…y, por lo general, las técnicas para resolverlos también varían mucho de un problema a otro.",3],["No es posible un enfoque unificado. La complejidad de un problema de optimización depende en gran medida de la forma de sus funciones objetivo y de sus restricciones.",4,"point"]],"aud":[{"f":"audio/1j4l35m.mp3","t":[0,6.996,13.295,20.407]}]},{"k":"t","ch":"c2a","big":"2.1 Optimización","lead":"La forma genérica de un problema","lines":[["Sección 2.1: optimización."]],"aud":[{"f":"audio/1wd23j4.mp3","t":[0]}]},{"k":"l","ch":"c2a","code":"2.1 · Ecuaciones 2.1 a 2.4","q":"La forma genérica","eq":[["\\underset{\\mathbf{x}\\in\\mathbb{R}^n}{\\text{minimizar}}\\; f_i(\\mathbf{x}),\\quad (i=1,2,\\dots,M)",1,"(2.1) funciones objetivo"],["\\text{sujeto a}\\; \\phi_j(\\mathbf{x})=0,\\quad (j=1,2,\\dots,J)",2,"(2.2) restricciones de igualdad"],["\\psi_k(\\mathbf{x})\\le 0,\\quad (k=1,2,\\dots,K)",3,"(2.3) restricciones de desigualdad"],["\\mathbf{x}=(x_1,x_2,\\dots,x_n)^T",4,"(2.4) vector de diseño"]],"lines":[["Como dijimos en la introducción, es posible escribir matemáticamente la mayoría de los problemas de optimización en una forma genérica. Primero: minimizar f sub i de x, para i igual a 1 hasta M.",1],["Sujeto a las restricciones fi sub j de x igual a cero, para j de 1 a J…",2],["…y psi sub k de x menor o igual que cero, para k de 1 a K.",3],["Donde f sub i, fi sub j y psi sub k son funciones del vector de diseño x, igual a x1, x2, hasta xn, traspuesto.",4,"point"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><mtext>minimizar</mtext><mrow><mi>𝐱</mi><mo>∈</mo><msup><mi>ℝ</mi><mi>n</mi></msup></mrow></munder></mrow><mspace width=\"0.2778em\"></mspace><msub><mi>f</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>i</mi><mo>=</mo><mn>1,2</mn><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><mi>M</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>sujeto a</mtext><mspace width=\"0.2778em\"></mspace><msub><mi>ϕ</mi><mi>j</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>j</mi><mo>=</mo><mn>1,2</mn><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><mi>J</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>ψ</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≤</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>k</mi><mo>=</mo><mn>1,2</mn><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><mi>K</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐱</mi><mo>=</mo><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>x</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>x</mi><mi>n</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>T</mi></msup></mrow></math>"],"aud":[{"f":"audio/gdtaz6.mp3","t":[0,13.474,19.622,24.726]}]},{"k":"c","ch":"c2a","id":"lmadk9","q":"En la forma genérica, ¿qué representa ψₖ(x) ≤ 0?","o":["La función objetivo","Las restricciones de igualdad","Las restricciones de desigualdad","El vector de diseño"],"a":2,"w":"φⱼ(x) = 0 son igualdades y ψₖ(x) ≤ 0 son desigualdades.","lines":[["En la forma genérica, ¿qué representa ψₖ(x) ≤ 0?"]],"aud":[{"f":"audio/1lrqho.mp3","t":[0]}]},{"k":"l","ch":"c2a","code":"2.1 · Terminología","q":"Cada parte tiene su nombre","viz":"spaces","bl":[["xᵢ: variables de diseño o de decisión; continuas, discretas o mixtas.",1],["fᵢ: funciones objetivo (también «coste» o «energía»). Si M = 1, un solo objetivo.",1],["Espacio de diseño o de búsqueda ℝⁿ: el de las variables.",2],["Espacio de soluciones o de respuesta: el de los valores del objetivo.",2],["φⱼ = 0 y ψₖ ≤ 0 son las restricciones; también pueden escribirse como ≥ 0, y maximizar en vez de minimizar.",3]],"lines":[["Las componentes x sub i del vector x se llaman variables de diseño o de decisión, y pueden ser reales continuas, discretas o una mezcla de ambas.",1],["Las funciones f sub i, con i de 1 a M, se llaman funciones objetivo; si M es 1, hay un solo objetivo. En la literatura, la función objetivo también se llama función de coste o función de energía.",1],["El espacio generado por las variables de decisión se llama espacio de diseño o espacio de búsqueda, erre a la n. El espacio formado por los valores de la función objetivo se llama espacio de soluciones o espacio de respuesta.",2,"point"],["Las igualdades fi y las desigualdades psi se llaman restricciones. Cabe señalar que también podemos escribir las desigualdades al revés, mayor o igual que cero, y formular los objetivos como un problema de maximización.",3]],"aud":[{"f":"audio/bp7xn7.mp3","t":[0,9.794,24.081,37.822]}]},{"k":"c","ch":"c2a","id":"1dzbmvu","q":"¿Cómo se llama el espacio formado por los valores de la función objetivo?","o":["Espacio de diseño","Espacio de búsqueda","Espacio de soluciones o de respuesta","Espacio de Krylov"],"a":2,"w":"El espacio de las variables es el de diseño o búsqueda; el de los valores del objetivo, el de soluciones o respuesta.","lines":[["¿Cómo se llama el espacio formado por los valores de la función objetivo?"]],"aud":[{"f":"audio/7id1sq.mp3","t":[0]}]},{"k":"l","ch":"c2a","code":"2.1 · Casos especiales","q":"Viabilidad, caja negra y objetivos difíciles de medir","bl":[["Sin objetivo, solo restricciones: problema de viabilidad; cualquier solución viable es óptima.",1],["Objetivo no explícito: un motor con máxima eficiencia y mínimas emisiones depende de geometría, combustible, encendido, mezcla, inyección, temperatura…",2],["Se estudia con simulación (CFD): optimización de caja negra, muy difícil. El libro se centra en objetivos explícitos como (2.1).",3],["Objetivo difícil de medir: el disfrute en vacaciones. Solo se puede maximizar lo que se puede escribir como una ecuación.",4]],"lines":[["En un caso raro pero extremo, no existe ningún objetivo y solo hay restricciones. Ese problema se llama problema de viabilidad, porque cualquier solución viable es una solución óptima.",1],["A veces no es posible escribir la función objetivo de forma explícita. Por ejemplo, queremos diseñar un motor de coche con la mayor eficiencia de combustible y la menor emisión de dióxido de carbono. Estos objetivos dependen de la geometría del motor, el tipo de combustible, el encendido, la mezcla aire-combustible y la inyección, la temperatura de trabajo y muchos otros factores.",2],["Esa dependencia suele investigarse con herramientas de simulación como la dinámica de fluidos computacional, CFD. La relación es tan compleja que no admite una forma explícita: es un problema de caja negra, muy difícil de resolver. El libro se centra en problemas con objetivos explícitos, y vuelve brevemente a la caja negra en la Parte III.",3,"warn"],["En otros casos el objetivo no es fácil de medir, pero aun así queremos maximizarlo: en vacaciones queremos maximizar el disfrute y minimizar el gasto. Es difícil medir el disfrute con una función, y cada persona lo define distinto. Matemáticamente, solo podemos maximizar algo si podemos escribirlo en forma de ecuación.",4]],"aud":[{"f":"audio/q5p20n.mp3","t":[0,12.847,38.465,61.564]}]},{"k":"c","ch":"c2a","id":"1th0kuk","q":"Un problema sin función objetivo, solo con restricciones, es…","o":["un problema de caja negra","un problema de viabilidad","un problema convexo","un problema estocástico"],"a":1,"w":"Es un problema de viabilidad: cualquier solución viable es óptima.","lines":[["Un problema sin función objetivo, solo con restricciones, es…"]],"aud":[{"f":"audio/79slh3.mp3","t":[0]}]},{"k":"l","ch":"c2a","code":"2.1 · Ecuaciones 2.5 y 2.6","q":"Optimización de funcionales: la cuerda colgante","viz":"catenary","eq":[["\\underset{y(x)}{\\text{minimizar}}\\;E_p=\\rho g\\int_A^B y\\sqrt{1+y'^2}\\,dx",2,"(2.5) energía potencial total"],["\\int_A^B\\sqrt{1+y'^2}\\,dx=L",3,"(2.6) restricción: longitud fija"]],"lines":[["En principio, todas las funciones f, fi y psi pueden incluir integrales, lo que complica muchísimo las cosas. Entonces estamos optimizando funcionales y, en la mayoría de los casos, hay que recurrir al cálculo de variaciones.",1],["Por ejemplo, para hallar la forma de una cuerda colgada, anclada en dos puntos A y B, buscamos la curva y de x que hace mínima la energía potencial total: E sub p igual a ro por g por la integral de A a B de y por raíz de 1 más y prima al cuadrado, de x. Aquí ro es la masa por unidad de longitud y g la aceleración de la gravedad.",2,"point"],["Además, la longitud L de la cuerda es fija: la integral de raíz de 1 más y prima al cuadrado, de A a B, es igual a L. Esa es la restricción.",3],["Este tipo de optimización suele requerir resolver la ecuación de Euler-Lagrange. Y cuando el objetivo es una integral y las restricciones son ecuaciones diferenciales, el problema se convierte en uno de control óptimo. El libro los trata solo brevemente; se centra en algoritmos para objetivos explícitos.",4]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><mtext>minimizar</mtext><mrow><mi>y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></munder></mrow><mspace width=\"0.2778em\"></mspace><msub><mi>E</mi><mi>p</mi></msub><mo>=</mo><mi>ρ</mi><mi>g</mi><msubsup><mo movablelimits=\"false\">∫</mo><mi>A</mi><mi>B</mi></msubsup><mi>y</mi><msqrt><mrow><mn>1</mn><mo>+</mo><msup><mi>y</mi><mrow class=\"tml-sml-pad\"><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo><mn>2</mn></mrow></msup></mrow></msqrt><mspace width=\"0.1667em\"></mspace><mi>d</mi><mi>x</mi></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msubsup><mo movablelimits=\"false\">∫</mo><mi>A</mi><mi>B</mi></msubsup><msqrt><mrow><mn>1</mn><mo>+</mo><msup><mi>y</mi><mrow class=\"tml-sml-pad\"><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo><mn>2</mn></mrow></msup></mrow></msqrt><mspace width=\"0.1667em\"></mspace><mi>d</mi><mi>x</mi><mo>=</mo><mi>L</mi></mrow></math>"],"aud":[{"f":"audio/dxo7i5.mp3","t":[0,15.471,38.372,50.233]}]},{"k":"c","ch":"c2a","id":"1gigx6b","q":"Si el objetivo es una integral, ¿qué herramienta se necesita?","o":["El simplex","El cálculo de variaciones (Euler-Lagrange)","Mínimos cuadrados","La búsqueda tabú"],"a":1,"w":"Se optimiza un funcional, y se resuelve con la ecuación de Euler-Lagrange.","lines":[["Si el objetivo es una integral, ¿qué herramienta se necesita?"]],"aud":[{"f":"audio/mohy2b.mp3","t":[0]}]},{"k":"t","ch":"c2b","big":"2.2 Tipos de optimización","lead":"Clasificar para elegir el método","lines":[["Sección 2.2: tipos de optimización."]],"aud":[{"f":"audio/11yr5rt.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Figura 2.1","q":"La clasificación","viz":"types","lines":[["La clasificación de la optimización no está bien establecida y hay cierta confusión en la bibliografía sobre algunos términos. El libro usa la terminología más extendida, sin pretender ser riguroso.",0],["Por número de objetivos: objetivo único, M igual a 1, o multiobjetivo, M mayor que 1. La multiobjetivo también se llama multicriterio o multiatributo.",1],["Por número de restricciones, J más K.",2],["Por la forma de las funciones: lineales o no lineales.",3],["Por el paisaje de la función objetivo: unimodal o multimodal.",4],["Por el tipo de variables: discretas, enteras, continuas o mixtas.",5],["Y por el determinismo: determinista o estocástica. Veamos cada criterio con detalle.",6,"point"]],"aud":[{"f":"audio/10b0aip.mp3","t":[0,12.836,25.601,28.812,32.662,37.289,42.439]}]},{"k":"l","ch":"c2b","code":"2.2 · Por número de objetivos","q":"Objetivo único y multiobjetivo","bl":[["Objetivo único: M = 1.",1],["Multiobjetivo: M > 1 (multicriterio, multiatributo). La mayoría de los problemas reales lo son.",2],["Motor: maximizar eficiencia, minimizar CO₂ y reducir ruido → tres objetivos, a menudo en conflicto.",3],["Vivienda: mejor ubicación, más espacio, menor gasto → hace falta un compromiso.",4],["El libro se centra en un solo objetivo; los algoritmos sirven para multiobjetivo con modificaciones.",5]],"lines":[["Si clasificamos por el número de objetivos, hay dos categorías: objetivo único, M igual a 1, y multiobjetivo, M mayor que 1.",1],["La optimización multiobjetivo también se llama multicriterio o multiatributo. La mayoría de los problemas reales son multiobjetivo.",2],["Por ejemplo, al diseñar un motor queremos maximizar la eficiencia de combustible, minimizar las emisiones de dióxido de carbono y reducir el ruido: tres objetivos, que a menudo entran en conflicto.",3,"point"],["Al alquilar o comprar una vivienda queremos la mejor ubicación y el mayor espacio, gastando lo menos posible: hay que llegar a un compromiso.",4],["Aunque los algoritmos del libro también sirven para multiobjetivo con algunas modificaciones, el libro se centra en problemas de un único objetivo.",5]],"aud":[{"f":"audio/14cqhm8.mp3","t":[0,10.432,19.17,32.632,41.892]}]},{"k":"c","ch":"c2b","id":"178eka0","q":"Diseñar un motor eficiente, limpio y silencioso es un problema…","o":["de un solo objetivo","multiobjetivo","lineal","sin variables"],"a":1,"w":"Tiene tres objetivos, a menudo en conflicto.","lines":[["Diseñar un motor eficiente, limpio y silencioso es un problema…"]],"aud":[{"f":"audio/1hnieoj.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Por número de restricciones","q":"Sin restricciones, igualdades y desigualdades","eq":[["J=K=0\\;\\Rightarrow\\;\\text{sin restricciones}",1],["K=0,\\;J\\ge 1\\;\\Rightarrow\\;\\text{con igualdades}",2],["J=0,\\;K\\ge 1\\;\\Rightarrow\\;\\text{con desigualdades}",3],["\\phi(\\mathbf{x})=0\\iff \\phi(\\mathbf{x})\\le 0\\;\\text{y}\\;\\phi(\\mathbf{x})\\ge 0",4,"una igualdad equivale a dos desigualdades"]],"lines":[["También podemos clasificar por el número de restricciones, J más K. Si no hay ninguna, J igual a K igual a cero, es un problema sin restricciones.",1],["Si K es cero y J es mayor o igual que 1, es un problema con restricciones de igualdad.",2],["Si J es cero y K es mayor o igual que 1, es un problema con restricciones de desigualdad.",3],["En algunas formulaciones solo se incluyen desigualdades, porque una igualdad puede escribirse como dos desigualdades: fi de x igual a cero equivale a fi menor o igual que cero y fi mayor o igual que cero.",4,"point"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>J</mi><mo>=</mo><mi>K</mi><mo>=</mo><mn>0</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mtext>sin restricciones</mtext></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>K</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>J</mi><mo>≥</mo><mn>1</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mtext>con igualdades</mtext></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>J</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>K</mi><mo>≥</mo><mn>1</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mtext>con desigualdades</mtext></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟺</mo><mspace width=\"0.2778em\"></mspace><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≤</mo><mn>0</mn><mspace width=\"0.2778em\"></mspace><mtext>y</mtext><mspace width=\"0.2778em\"></mspace><mi>ϕ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≥</mo><mn>0</mn></mrow></math>"],"aud":[{"f":"audio/9c6f7u.mp3","t":[0,10.873,17.544,24.447]}]},{"k":"c","ch":"c2b","id":"1xvw6t","q":"Una restricción de igualdad φ(x) = 0 equivale a…","o":["una sola desigualdad","dos desigualdades: φ ≤ 0 y φ ≥ 0","ninguna restricción","una función objetivo"],"a":1,"w":"Por eso algunas formulaciones solo usan desigualdades.","lines":[["Una restricción de igualdad φ(x) = 0 equivale a…"]],"aud":[{"f":"audio/1ndysjq.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Por la forma de las funciones","q":"Lineal y no lineal","bl":[["Funciones objetivo lineales o no lineales.",1],["Si todas las restricciones φⱼ y ψₖ son lineales: problema con restricciones lineales.",2],["Si restricciones y objetivo son lineales: programación lineal. «Programación» significa planificación, no código.",3],["Si fᵢ, φⱼ y ψₖ son no lineales: optimización no lineal.",4]],"lines":[["También podemos clasificar por la forma real de las funciones. Las funciones objetivo pueden ser lineales o no lineales.",1],["Si todas las restricciones fi sub j y psi sub k son lineales, es un problema con restricciones lineales.",2],["Si tanto las restricciones como los objetivos son lineales, es un problema de programación lineal. Aquí programación no tiene nada que ver con programar computadoras: significa planificación u optimización.",3,"point"],["En términos generales, si las funciones f, fi y psi son no lineales, tenemos un problema de optimización no lineal.",4]],"aud":[{"f":"audio/wfnut.mp3","t":[0,7.948,15.698,29.045]}]},{"k":"c","ch":"c2b","id":"1lz54zi","q":"En «programación lineal», la palabra programación significa…","o":["escribir código","planificación u optimización","usar computadoras","un lenguaje"],"a":1,"w":"No tiene nada que ver con programar computadoras.","lines":[["En «programación lineal», la palabra programación significa…"]],"aud":[{"f":"audio/1xyhskp.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Por el paisaje","q":"Unimodal, convexo y multimodal","viz":"landscape","lines":[["Desde otro punto de vista, podemos clasificar por el paisaje de la función objetivo. Con un solo objetivo, la forma del paisaje puede variar mucho en el caso no lineal.",0],["Si solo hay un valle o un pico, con un único óptimo global, el problema es unimodal: el óptimo local es el único óptimo y también el global. Por ejemplo, f igual a x² más y² es unimodal: el mínimo local en cero coma cero es el global.",1,"point"],["Una clase especial y muy importante de optimización unimodal es la convexa, cuyas funciones tienen convexidad y garantizan la solución óptima global. En ingeniería intentamos reformular los problemas en formas matriciales cuadráticas, que suelen ser convexas.",1,"happy"],["Sin embargo, la mayoría de las funciones objetivo tienen más de un modo, y estas funciones multimodales son mucho más difíciles de resolver. Por ejemplo, f igual a seno de x por seno de y es multimodal.",2],["Un método que solo baja se queda en el primer valle que encuentra.",3,"warn"]],"aud":[{"f":"audio/jy3o1o.mp3","t":[0,11.28,31.035,48.921,63.463]}]},{"k":"c","ch":"c2b","id":"lp2kwb","q":"¿Cuál de estas funciones es multimodal?","o":["x² + y²","sen x · sen y","2x + 3y","(x − 1)²"],"a":1,"w":"sen x · sen y tiene muchos picos y valles.","lines":[["¿Cuál de estas funciones es multimodal?"]],"aud":[{"f":"audio/l5hr0r.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Por el tipo de variables","q":"Discreta, entera, combinatoria, continua y mixta","bl":[["Todas las variables discretas → optimización discreta.",1],["Todas enteras → programación entera.",2],["Discreta ≈ combinatoria: grafos y rutas (viajante, árbol de expansión mínima, rutas de vehículos, horarios de vuelo, problema de la mochila). Es el tipo más popular.",3],["Todas continuas o reales en un intervalo → optimización continua.",4],["Mezcla de discretas y continuas → optimización de tipo mixto.",5]],"lines":[["El tipo de valor de las variables de diseño también sirve para clasificar. Si todas las variables son discretas, es optimización discreta.",1],["Si todos esos valores son enteros, es un problema de programación entera.",2],["En general, la optimización discreta también se llama combinatoria, aunque parte de la bibliografía dice que la discreta abarca la programación entera y la combinatoria. La combinatoria es, con diferencia, la más popular, y suele relacionarse con grafos y rutas: el viajante, el árbol de expansión mínima, el enrutamiento de vehículos, la programación de vuelos y el problema de la mochila.",3,"point"],["Si todas las variables son continuas, o reales en algún intervalo, es optimización continua.",4],["Y si hay variables discretas y continuas a la vez, es optimización de tipo mixto.",5]],"aud":[{"f":"audio/lfqsi3.mp3","t":[0,8.981,14.096,41.34,47.929]}]},{"k":"c","ch":"c2b","id":"zx1oc","q":"El problema de la mochila es de optimización…","o":["continua","combinatoria (discreta)","estocástica","lineal continua"],"a":1,"w":"Igual que el viajante o el árbol de expansión mínima: combinatoria.","lines":[["El problema de la mochila es de optimización…"]],"aud":[{"f":"audio/x1q0h3.mp3","t":[0]}]},{"k":"l","ch":"c2b","code":"2.2 · Por el determinismo","q":"Determinista, estocástica y robusta","bl":[["Hasta ahora: valores exactos, sin incertidumbre ni ruido → problemas deterministas.",1],["En el mundo real los parámetros se conocen con incertidumbre: el módulo de Young solo se mide con cierta precisión, y los materiales no son homogéneos.",2],["Con ruido o incertidumbre en variables, objetivos o restricciones → optimización estocástica, o robusta con ruido.",3],["Hay que reformularlos: evaluar el objetivo por su media y/o su incertidumbre.",4]],"lines":[["Hasta ahora hemos supuesto que los valores de las variables, del objetivo y de las restricciones son exactos, sin incertidumbre ni ruido. Todos esos problemas son deterministas: para cada conjunto de variables, los valores quedan determinados con exactitud.",1],["En el mundo real solo conocemos algunos parámetros con cierta incertidumbre. Por ejemplo, las propiedades de un material, como el módulo de Young, solo se miden con cierta precisión, y la falta de homogeneidad de los materiales reales suele ser intrínseca.",2],["Si hay incertidumbre o ruido en las variables, los objetivos o las restricciones, el problema se vuelve de optimización estocástica, o de optimización robusta con ruido.",3,"point"],["Para la mayoría de estos problemas hay que redefinirlos o reformularlos para que tengan sentido con las técnicas estándar. Normalmente se calcula una media en algún espacio, y el objetivo se evalúa por su media, en combinación con su incertidumbre.",4]],"aud":[{"f":"audio/1iqgo5t.mp3","t":[0,16.586,32.8,44.288]}]},{"k":"c","ch":"c2b","id":"cc0iff","q":"Si el módulo de Young de un material tiene incertidumbre, el problema es…","o":["determinista","estocástico o robusto","lineal","sin restricciones"],"a":1,"w":"La incertidumbre o el ruido convierten el problema en estocástico o robusto.","lines":[["Si el módulo de Young de un material tiene incertidumbre, el problema es…"]],"aud":[{"f":"audio/6yqfh2.mp3","t":[0]}]},{"k":"t","ch":"c2c","big":"2.3 Algoritmos de optimización","lead":"La búsqueda del tesoro","lines":[["Sección 2.3: algoritmos de optimización."]],"aud":[{"f":"audio/1n7kqp8.mp3","t":[0]}]},{"k":"l","ch":"c2c","code":"2.3 · La búsqueda del tesoro","q":"Una metáfora para entender los algoritmos","viz":"treasure","lines":[["Para distintos tipos de problemas usamos distintas técnicas, porque algunos algoritmos, como Newton-Raphson, son más adecuados para unos tipos de optimización que para otros. En sentido figurado, buscar la solución óptima es como buscar un tesoro escondido en un paisaje montañoso, con tiempo limitado.",0],["En un extremo, tenemos los ojos vendados y ninguna pista: es una búsqueda puramente aleatoria, normalmente poco eficiente.",1],["En el otro extremo, si sabemos que el tesoro está en la cima más alta de una región conocida, subimos directamente por la pendiente más empinada: es la escalada de colinas clásica. Pero puede atascarse en una cima local.",2,"warn"],["Casi siempre estamos entre los dos extremos: no tenemos los ojos vendados, pero no sabemos dónde buscar. Damos pasos al azar buscando pistas, de un lugar plausible a otro. Ese caminar al azar es una característica principal de los algoritmos modernos. Escalar desde varios puntos al azar, por ejemplo, mejora mucho.",3,"point"],["Podemos buscar solos, y entonces el recorrido es una búsqueda basada en trayectorias, como el recocido simulado. O podemos buscar en grupo y compartir la información: eso es inteligencia de enjambre, como el enjambre de partículas.",4],["Si el tesoro es importante y la zona es enorme, la búsqueda tardará. Sin límite de tiempo y con acceso a cualquier región, sin islas en un lago, por ejemplo, en teoría se puede encontrar el tesoro definitivo: el óptimo global.",4]],"aud":[{"f":"audio/m3ich8.mp3","t":[0,20.301,29.735,44.579,65.831,82.034]}]},{"k":"c","ch":"c2c","id":"1sg714c","q":"En la búsqueda del tesoro, ¿qué técnica corresponde a buscar en grupo compartiendo información?","o":["Escalada de colinas","Recocido simulado","Inteligencia de enjambre (PSO)","Búsqueda aleatoria"],"a":2,"w":"Buscar en grupo y compartir información es inteligencia de enjambre.","lines":[["En la búsqueda del tesoro, ¿qué técnica corresponde a buscar en grupo compartiendo información?"]],"aud":[{"f":"audio/nz84z0.mp3","t":[0]}]},{"k":"l","ch":"c2c","code":"2.3 · Mejores cazadores","q":"Quedarse con los mejores","viz":"ga","bl":[["Algunos cazadores son mejores que otros: nos quedamos con los mejores y reclutamos nuevos → algoritmos genéticos y evolutivos.",1],["Casi todas las metaheurísticas usan las mejores soluciones y aleatorizan o sustituyen las peores.",2],["Evalúan la aptitud de cada individuo junto con el historial del sistema: uso de la memoria.",3]],"lines":[["Podemos afinar la estrategia. Algunos cazadores son mejores que otros: nos quedamos con los mejores y reclutamos a otros nuevos. Esto se parece a los algoritmos genéticos o evolutivos, donde los agentes de búsqueda van mejorando.",1,"point"],["De hecho, en casi todas las metaheurísticas modernas usamos las mejores soluciones o agente
