ama de coste o de energía; el espacio de las variables es el de diseño o búsqueda, y el de los valores del objetivo, el de soluciones.",2],["Si no hay objetivo, es un problema de viabilidad.",3],["Si el objetivo no tiene fórmula explícita, como en un motor simulado con CFD, es de caja negra.",4],["Si el objetivo es una integral, como la energía de una cuerda colgante, se optimiza un funcional con el cálculo de variaciones, y si las restricciones son ecuaciones diferenciales, es control óptimo.",5]],"lines":[["Casi todo problema se escribe en forma genérica: minimizar las funciones objetivo f sub i de x, sujeto a restricciones de igualdad fi sub j de x igual a cero y de desigualdad psi sub k de x menor o igual que cero, sobre el vector de diseño x.",1],["Las componentes de x son las variables de decisión; la función objetivo también se llama de coste o de energía; el espacio de las variables es el de diseño o búsqueda, y el de los valores del objetivo, el de soluciones.",2],["Si no hay objetivo, es un problema de viabilidad.",3],["Si el objetivo no tiene fórmula explícita, como en un motor simulado con CFD, es de caja negra.",4],["Si el objetivo es una integral, como la energía de una cuerda colgante, se optimiza un funcional con el cálculo de variaciones, y si las restricciones son ecuaciones diferenciales, es control óptimo.",5]],"aud":[{"f":"audio/6za1vy.mp3","t":[0,18.327,32.393,36.324,44.04]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 2","q":"2.2 Tipos de optimización","bl":[["Los problemas se clasifican por el número de objetivos: único o multiobjetivo; por las restricciones: sin restricciones, con igualdades o con desigualdades, sabiendo que una igualdad equivale a dos desigualdades; por la forma: lineales, que dan la programación lineal, o no lineales; por el paisaje: unimodales, como x² más y², donde destacan los convexos, o multimodales, como seno de x por seno de y; por las variables: discretas, enteras o combinatorias, como el viajante o la mochila, continuas o mixtas; y por el determinismo: deterministas o estocásticos, cuando hay ruido o incertidumbre.",1]],"lines":[["Los problemas se clasifican por el número de objetivos: único o multiobjetivo; por las restricciones: sin restricciones, con igualdades o con desigualdades, sabiendo que una igualdad equivale a dos desigualdades; por la forma: lineales, que dan la programación lineal, o no lineales; por el paisaje: unimodales, como x² más y², donde destacan los convexos, o multimodales, como seno de x por seno de y; por las variables: discretas, enteras o combinatorias, como el viajante o la mochila, continuas o mixtas; y por el determinismo: deterministas o estocásticos, cuando hay ruido o incertidumbre.",1]],"aud":[{"f":"audio/v621ft.mp3","t":[0]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 2","q":"2.3 y 2.4 Algoritmos y metaheurísticas","bl":[["Buscar el óptimo es como buscar un tesoro: a ciegas es búsqueda aleatoria, subiendo la pendiente es escalada de colinas, solo es búsqueda por trayectoria y en grupo es inteligencia de enjambre.",1],["Los algoritmos determinísticos repiten siempre la misma trayectoria; pueden usar el gradiente, como Newton-Raphson, o no usarlo, como Hooke-Jeeves y Nelder-Mead.",2],["Los estocásticos usan azar y se dividen en heurísticos y metaheurísticos; la escalada con reinicio aleatorio es un híbrido.",3],["Toda metaheurística combina la selección de las mejores soluciones, que hace converger, con la aleatorización, que evita óptimos locales.",4],["Pueden ser de población, como los genéticos y PSO, o de trayectoria, como el recocido simulado.",5]],"lines":[["Buscar el óptimo es como buscar un tesoro: a ciegas es búsqueda aleatoria, subiendo la pendiente es escalada de colinas, solo es búsqueda por trayectoria y en grupo es inteligencia de enjambre.",1],["Los algoritmos determinísticos repiten siempre la misma trayectoria; pueden usar el gradiente, como Newton-Raphson, o no usarlo, como Hooke-Jeeves y Nelder-Mead.",2],["Los estocásticos usan azar y se dividen en heurísticos y metaheurísticos; la escalada con reinicio aleatorio es un híbrido.",3],["Toda metaheurística combina la selección de las mejores soluciones, que hace converger, con la aleatorización, que evita óptimos locales.",4],["Pueden ser de población, como los genéticos y PSO, o de trayectoria, como el recocido simulado.",5]],"aud":[{"f":"audio/bwn855.mp3","t":[0,12.685,23.454,31.726,40.649]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 2","q":"2.5 y 2.6 Notación de orden y complejidad","bl":[["f es O de g si el límite de f entre g es un número finito distinto de cero; si es 1, f es equivalente a g, y si es cero, f es o pequeña de g.",1],["Las constantes no cambian el orden y domina la mayor potencia.",2],["La serie de Stirling muestra que una aproximación asintótica puede tener un error absoluto enorme pero pequeño en relación.",3],["La burbuja es O de n² y el quicksort O de n log n.",4],["Los problemas P se resuelven en tiempo polinómico; los NP se verifican en tiempo polinómico; los NP completos son NP difíciles a los que se reducen todos los NP.",5],["El viajante es NP difícil, y P frente a NP sigue sin resolverse.",6]],"lines":[["f es O de g si el límite de f entre g es un número finito distinto de cero; si es 1, f es equivalente a g, y si es cero, f es o pequeña de g.",1],["Las constantes no cambian el orden y domina la mayor potencia.",2],["La serie de Stirling muestra que una aproximación asintótica puede tener un error absoluto enorme pero pequeño en relación.",3],["La burbuja es O de n² y el quicksort O de n log n.",4],["Los problemas P se resuelven en tiempo polinómico; los NP se verifican en tiempo polinómico; los NP completos son NP difíciles a los que se reducen todos los NP.",5],["El viajante es NP difícil, y P frente a NP sigue sin resolverse.",6]],"aud":[{"f":"audio/1optwgj.mp3","t":[0,11.686,15.733,23.309,28.552,40.842]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 2","q":"2.7 No hay almuerzo gratis","bl":[["Wolpert y Macready demostraron que, promediado sobre todas las funciones de coste posibles, todos los algoritmos rinden igual: no existe un método universalmente mejor.",1],["Pero ningún problema real exige ese promedio; para un tipo concreto de problema, algunos algoritmos son mucho mejores, y conocer el problema ayuda a elegirlos.",2],["Los teoremas están demostrados para un solo objetivo.",3]],"lines":[["Wolpert y Macready demostraron que, promediado sobre todas las funciones de coste posibles, todos los algoritmos rinden igual: no existe un método universalmente mejor.",1],["Pero ningún problema real exige ese promedio; para un tipo concreto de problema, algunos algoritmos son mucho mejores, y conocer el problema ayuda a elegirlos.",2],["Los teoremas están demostrados para un solo objetivo.",3]],"aud":[{"f":"audio/1is6mzs.mp3","t":[0,12.116,23.825]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 4","q":"4.1 Optimización sin restricciones","bl":[["Se busca donde f prima de x es cero, condición necesaria pero no suficiente.",1],["Si f segunda es positiva es un mínimo, si es negativa un máximo, y si es indefinida puede ser un punto de silla.",2],["Ejemplo: f igual a x por e a la menos x² tiene un máximo en raíz de 2 entre 2 y un mínimo en menos raíz de 2 entre 2.",3]],"lines":[["Se busca donde f prima de x es cero, condición necesaria pero no suficiente.",1],["Si f segunda es positiva es un mínimo, si es negativa un máximo, y si es indefinida puede ser un punto de silla.",2],["Ejemplo: f igual a x por e a la menos x² tiene un máximo en raíz de 2 entre 2 y un mínimo en menos raíz de 2 entre 2.",3]],"aud":[{"f":"audio/1wrdjx3.mp3","t":[0,5.498,13.724]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 4","q":"4.2 Métodos basados en el gradiente","bl":[["Newton usa el desarrollo de Taylor de segundo orden: x nuevo igual a x menos la inversa de la hessiana por el gradiente; es exacto en un paso para funciones cuadráticas, y con un paso alfa se obtiene el Newton modificado.",1],["Si se reemplaza la hessiana por la identidad se obtiene el descenso más pronunciado, que avanza contra el gradiente con un paso alfa elegido en cada iteración.",2],["En el ejemplo 4.1, desde 10, 15, llega casi a menos 0,8, 3,2 en tres iteraciones, aunque se vuelve lento cerca del mínimo.",3],["La búsqueda lineal acepta pasos que cumplan las condiciones de Wolfe: disminución suficiente o de Armijo, y curvatura.",4],["El método de gradientes conjugados resuelve A u igual a b minimizando una forma cuadrática, con direcciones conjugadas, y empieza con d cero igual al residuo; si A no es simétrica se usa GMRES.",5]],"lines":[["Newton usa el desarrollo de Taylor de segundo orden: x nuevo igual a x menos la inversa de la hessiana por el gradiente; es exacto en un paso para funciones cuadráticas, y con un paso alfa se obtiene el Newton modificado.",1],["Si se reemplaza la hessiana por la identidad se obtiene el descenso más pronunciado, que avanza contra el gradiente con un paso alfa elegido en cada iteración.",2],["En el ejemplo 4.1, desde 10, 15, llega casi a menos 0,8, 3,2 en tres iteraciones, aunque se vuelve lento cerca del mínimo.",3],["La búsqueda lineal acepta pasos que cumplan las condiciones de Wolfe: disminución suficiente o de Armijo, y curvatura.",4],["El método de gradientes conjugados resuelve A u igual a b minimizando una forma cuadrática, con direcciones conjugadas, y empieza con d cero igual al residuo; si A no es simétrica se usa GMRES.",5]],"aud":[{"f":"audio/1jc3rxj.mp3","t":[0,15.367,25.95,37.659,46.002]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 4","q":"4.3 a 4.5 Programación lineal y simplex","bl":[["Un problema lineal tiene objetivo y restricciones lineales.",1],["En el ejemplo del proveedor de internet, maximizar 2 x1 más 3 x2 con x1 más x2 menor o igual que 20, x1 hasta 16 y x2 hasta 10 da el óptimo en el vértice B, 10, 10, con beneficio 50 mil libras.",2],["El método simplex, de Dantzig, convierte las desigualdades en igualdades con variables de holgura, parte de una solución básica factible, que es un vértice, y pivota a vértices adyacentes mientras el objetivo mejore.",3],["En el ejemplo recorre O, A y B, con Z igual a 0, 30 y 50, y se detiene cuando ninguna variable no básica mejora el objetivo.",4]],"lines":[["Un problema lineal tiene objetivo y restricciones lineales.",1],["En el ejemplo del proveedor de internet, maximizar 2 x1 más 3 x2 con x1 más x2 menor o igual que 20, x1 hasta 16 y x2 hasta 10 da el óptimo en el vértice B, 10, 10, con beneficio 50 mil libras.",2],["El método simplex, de Dantzig, convierte las desigualdades en igualdades con variables de holgura, parte de una solución básica factible, que es un vértice, y pivota a vértices adyacentes mientras el objetivo mejore.",3],["En el ejemplo recorre O, A y B, con Z igual a 0, 30 y 50, y se detiene cuando ninguna variable no básica mejora el objetivo.",4]],"aud":[{"f":"audio/u64p13.mp3","t":[0,4.465,22.06,36.487]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 4","q":"4.6 a 4.8 Penalización y Lagrange","bl":[["La mayoría de los problemas reales son no lineales; si son convexos, gradiente cero garantiza el óptimo global.",1],["El método de penalización suma castigos al objetivo, pero necesita coeficientes muy grandes.",2],["Los multiplicadores de Lagrange forman L igual a f más lambda por g, y las condiciones de estacionariedad, incluida la derivada respecto a lambda que devuelve la restricción, dan la solución.",3],["En el ejemplo 4.2, lambda igual a 2 quintos da 1 quinto, 12 quintos; en el ejemplo 4.3, con dos restricciones, el mínimo es B, menos 1, cero, con f igual a menos 1.",4]],"lines":[["La mayoría de los problemas reales son no lineales; si son convexos, gradiente cero garantiza el óptimo global.",1],["El método de penalización suma castigos al objetivo, pero necesita coeficientes muy grandes.",2],["Los multiplicadores de Lagrange forman L igual a f más lambda por g, y las condiciones de estacionariedad, incluida la derivada respecto a lambda que devuelve la restricción, dan la solución.",3],["En el ejemplo 4.2, lambda igual a 2 quintos da 1 quinto, 12 quintos; en el ejemplo 4.3, con dos restricciones, el mínimo es B, menos 1, cero, con f igual a menos 1.",4]],"aud":[{"f":"audio/13hyylj.mp3","t":[0,8.203,14.119,26.711]}]},{"k":"l","ch":"rs","code":"Resumen · Capítulo 4","q":"4.9 Condiciones KKT","bl":[["Generalizan Lagrange a desigualdades: el gradiente de f más las combinaciones de gradientes de restricciones es cero, las desigualdades se cumplen, los multiplicadores de las desigualdades son no negativos y se cumple la holgura complementaria, mu por psi igual a cero.",1],["Cada desigualdad o está activa y se vuelve igualdad, o su multiplicador es cero y se ignora.",2],["En el ejemplo 4.4, de cuatro casos posibles solo el de ambas restricciones activas es viable: el óptimo es menos un tercio, cinco tercios, con f igual a 113 novenos.",3]],"lines":[["Generalizan Lagrange a desigualdades: el gradiente de f más las combinaciones de gradientes de restricciones es cero, las desigualdades se cumplen, los multiplicadores de las desigualdades son no negativos y se cumple la holgura complementaria, mu por psi igual a cero.",1],["Cada desigualdad o está activa y se vuelve igualdad, o su multiplicador es cero y se ignora.",2],["En el ejemplo 4.4, de cuatro casos posibles solo el de ambas restricciones activas es viable: el óptimo es menos un tercio, cinco tercios, con f igual a 113 novenos.",3]],"aud":[{"f":"audio/1c1hkx6.mp3","t":[0,17.131,23.906]}]},{"k":"t","ch":"cu","big":"Para tu cuaderno","lead":"Lo que debes copiar y cómo intervenir en clase","lines":[["Ahora te dicto lo que debes copiar en tu cuaderno, capítulo por capítulo, y te doy frases e ideas para intervenir en clase. También lo tienes todo en la pestaña Cuaderno, con botón para copiar.","","point"]],"aud":[{"f":"audio/ywt0gy.mp3","t":[0]}]},{"k":"l","ch":"cu","code":"Para tu cuaderno · Capítulo 1","q":"Breve historia de la optimización","bl":[["Concepto: Optimizar: buscar el mejor valor posible de una función (maximizar o minimizar) respetando unas restricciones.",1],["Concepto: Principio de mínima acción: muchos fenómenos físicos «optimizan». La luz sigue el principio de Fermat (menor tiempo) → ley de Snell.",2],["Fórmula: Ley de Snell (Fermat, 1657): sen θ₁ / v₁ = sen θ₂ / v₂",3],["Ejemplo: Euclides (300 a. C.): con perímetro fijo, el cuadrado tiene la mayor área. Herón (100 a. C.): en un espejo, ángulo de incidencia = ángulo de reflexión.",4],["Ejemplo: Braquistócrona (Bernoulli 1696, Newton 1697): la curva de descenso más rápido es una cicloide → origen del cálculo de variaciones (Euler y Lagrange).",5],["Concepto: Línea del tiempo clave: Monge 1781 (transporte) · Legendre 1805 y Gauss (mínimos cuadrados) · Cauchy 1847 (gradiente) · Jensen 1906 (convexidad) · Menger 1930 (viajante).",6],["Concepto: Programación lineal: Kantorovich 1939, Koopmans, Dantzig 1947 (simplex). KKT: Karush 1939, Kuhn y Tucker 1951. Programación dinámica: Bellman 1957.",7],["Concepto: Heurística: prueba y error; soluciones buenas en tiempo razonable, sin garantía de ser óptimas (Turing, Bombe, 1940).",8],["Concepto: Metaheurísticas: AG (Holland, 1975), estrategias evolutivas (1963), programación evolutiva (1966), recocido simulado (1983), tabú (1986), hormigas (1992), PSO (1995), búsqueda armónica (2001), abejas (2004-05), luciérnagas (2008).",9],["Concepto: NFL (Wolpert y Macready, 1997): ningún algoritmo es el mejor para todos los problemas.",10],["Para intervenir: «La optimización convexa es especial porque cualquier óptimo local es global; por eso conviene reformular los problemas de ingeniería como convexos.»",11],["Para intervenir: Pregunta para el profesor: «Si los teoremas NFL dicen que todos los algoritmos rinden igual en promedio, ¿cómo elegimos el algoritmo para un problema concreto?»",12]],"eq":[["\\frac{\\sin\\theta_1}{v_1}=\\frac{\\sin\\theta_2}{v_2}",3]],"lines":[["Copia: Optimizar: buscar el mejor valor posible de una función (maximizar o minimizar) respetando unas restricciones.",1,null],["Copia: Principio de mínima acción: muchos fenómenos físicos «optimizan». La luz sigue el principio de Fermat (menor tiempo) → ley de Snell.",2,null],["Copia: Ley de Snell (Fermat, 1657): sen θ₁ / v₁ = sen θ₂ / v₂",3,null],["Copia: Euclides (300 a. C.): con perímetro fijo, el cuadrado tiene la mayor área. Herón (100 a. C.): en un espejo, ángulo de incidencia = ángulo de reflexión.",4,null],["Copia: Braquistócrona (Bernoulli 1696, Newton 1697): la curva de descenso más rápido es una cicloide → origen del cálculo de variaciones (Euler y Lagrange).",5,null],["Copia: Línea del tiempo clave: Monge 1781 (transporte) · Legendre 1805 y Gauss (mínimos cuadrados) · Cauchy 1847 (gradiente) · Jensen 1906 (convexidad) · Menger 1930 (viajante).",6,null],["Copia: Programación lineal: Kantorovich 1939, Koopmans, Dantzig 1947 (simplex). KKT: Karush 1939, Kuhn y Tucker 1951. Programación dinámica: Bellman 1957.",7,null],["Copia: Heurística: prueba y error; soluciones buenas en tiempo razonable, sin garantía de ser óptimas (Turing, Bombe, 1940).",8,null],["Copia: Metaheurísticas: AG (Holland, 1975), estrategias evolutivas (1963), programación evolutiva (1966), recocido simulado (1983), tabú (1986), hormigas (1992), PSO (1995), búsqueda armónica (2001), abejas (2004-05), luciérnagas (2008).",9,null],["Copia: NFL (Wolpert y Macready, 1997): ningún algoritmo es el mejor para todos los problemas.",10,null],["Una buena intervención: «La optimización convexa es especial porque cualquier óptimo local es global; por eso conviene reformular los problemas de ingeniería como convexos.»",11,"point"],["Para participar, puedes preguntar: «Si los teoremas NFL dicen que todos los algoritmos rinden igual en promedio, ¿cómo elegimos el algoritmo para un problema concreto?»",12,"point"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mfrac><mrow><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><msub><mi>v</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><msub><mi>v</mi><mn>2</mn></msub></mfrac></mrow></math>"],"aud":[{"f":"audio/1brj8r6.mp3","t":[0,8.76,19.355,29.277,42.077,56.155,76.92,96.687,108.234,141.782,151.448,162.983]}]},{"k":"l","ch":"cu","code":"Para tu cuaderno · Capítulo 2","q":"Optimización en ingeniería","bl":[["Fórmula: Forma genérica: minimizar fᵢ(x), i = 1…M; sujeto a φⱼ(x) = 0, j = 1…J; ψₖ(x) ≤ 0, k = 1…K; x = (x₁, …, xₙ)ᵀ",1],["Concepto: Vocabulario: variables de diseño o decisión; función objetivo (coste o energía); espacio de diseño o búsqueda; espacio de soluciones o respuesta; restricciones.",2],["Concepto: Casos especiales: problema de viabilidad (sin objetivo); caja negra (sin fórmula explícita, p. ej. CFD); funcional (objetivo integral → cálculo de variaciones / control óptimo).",3],["Concepto: Clasificación: objetivos (único / multiobjetivo) · restricciones (sin / igualdad / desigualdad) · forma (lineal / no lineal) · paisaje (unimodal-convexo / multimodal) · variables (discreta, entera, combinatoria, continua, mixta) · determinismo (determinista / estocástico-robusto).",4],["Concepto: Algoritmos: determinísticos (con gradiente: Newton-Raphson; sin gradiente: Hooke-Jeeves, Nelder-Mead) y estocásticos (heurísticos y metaheurísticos, de población o de trayectoria).",5],["Concepto: Metaheurística = selección de los mejores (converge) + aleatorización (escapa de óptimos locales y da diversidad).",6],["Fórmula: Notación de orden: f = O(g) si lim f/g = K finito ≠ 0; f ~ g si K = 1; f = o(g) si el límite es 0.",7],["Ejemplo: Domina la mayor potencia: n² + 2n + 3 = O(n²). Burbuja O(n²) vs quicksort O(n log n): para n = 1000, ~10⁶ frente a ~3×10³ operaciones.",8],["Concepto: P: resoluble en tiempo polinómico. NP: verificable en tiempo polinómico. NP-completo: NP-difícil al que se reducen todos los NP. Viajante: NP-difícil.",9],["Fórmula: NFL: Σ_f P(sₘʸ | f, m, A) = Σ_f P(sₘʸ | f, m, B)",10],["Para intervenir: «Antes de elegir un método hay que clasificar el problema: si es convexo y suave conviene un método de gradiente; si es multimodal o de caja negra, una metaheurística.»",11],["Para intervenir: Pregunta para el profesor: «En un problema real con ruido, ¿optimizamos la media del objetivo, su varianza o una combinación?»",12]],"eq":[["\\min f_i(\\mathbf{x}),\\;\\phi_j(\\mathbf{x})=0,\\;\\psi_k(\\mathbf{x})\\le0",1],["f=O(g)\\iff\\lim_{x\\to x_0}\\frac{f}{g}=K\\ne0",7],["\\sum_f P(s_m^y|f,m,A)=\\sum_f P(s_m^y|f,m,B)",10]],"lines":[["Copia: Forma genérica: minimizar fᵢ(x), i = 1…M; sujeto a φⱼ(x) = 0, j = 1…J; ψₖ(x) ≤ 0, k = 1…K; x = (x₁, …, xₙ)ᵀ",1,null],["Copia: Vocabulario: variables de diseño o decisión; función objetivo (coste o energía); espacio de diseño o búsqueda; espacio de soluciones o respuesta; restricciones.",2,null],["Copia: Casos especiales: problema de viabilidad (sin objetivo); caja negra (sin fórmula explícita, p. ej. CFD); funcional (objetivo integral → cálculo de variaciones / control óptimo).",3,null],["Copia: Clasificación: objetivos (único / multiobjetivo) · restricciones (sin / igualdad / desigualdad) · forma (lineal / no lineal) · paisaje (unimodal-convexo / multimodal) · variables (discreta, entera, combinatoria, continua, mixta) · determinismo (determinista / estocástico-robusto).",4,null],["Copia: Algoritmos: determinísticos (con gradiente: Newton-Raphson; sin gradiente: Hooke-Jeeves, Nelder-Mead) y estocásticos (heurísticos y metaheurísticos, de población o de trayectoria).",5,null],["Copia: Metaheurística = selección de los mejores (converge) + aleatorización (escapa de óptimos locales y da diversidad).",6,null],["Copia: Notación de orden: f = O(g) si lim f/g = K finito ≠ 0; f ~ g si K = 1; f = o(g) si el límite es 0.",7,null],["Copia: Domina la mayor potencia: n² + 2n + 3 = O(n²). Burbuja O(n²) vs quicksort O(n log n): para n = 1000, ~10⁶ frente a ~3×10³ operaciones.",8,null],["Copia: P: resoluble en tiempo polinómico. NP: verificable en tiempo polinómico. NP-completo: NP-difícil al que se reducen todos los NP. Viajante: NP-difícil.",9,null],["Copia: NFL: Σ_f P(sₘʸ | f, m, A) = Σ_f P(sₘʸ | f, m, B)",10,null],["Una buena intervención: «Antes de elegir un método hay que clasificar el problema: si es convexo y suave conviene un método de gradiente; si es multimodal o de caja negra, una metaheurística.»",11,"point"],["Para participar, puedes preguntar: «En un problema real con ruido, ¿optimizamos la media del objetivo, su varianza o una combinación?»",12,"point"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><msub><mi>f</mi><mi>i</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><msub><mi>ϕ</mi><mi>j</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><msub><mi>ψ</mi><mi>k</mi></msub><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>𝐱</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≤</mo><mn>0</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>f</mi><mo>=</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>g</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⟺</mo><mspace width=\"0.2778em\"></mspace><mspace width=\"0.1667em\"></mspace><munder><mi>lim</mi><mrow><mi>x</mi><mo>→</mo><msub><mi>x</mi><mn>0</mn></msub></mrow></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><mfrac><mi>f</mi><mi>g</mi></mfrac><mo>=</mo><mi>K</mi><mo>≠</mo><mn>0</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>f</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mi>|</mi><mi>f</mi><mo separator=\"true\">,</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>A</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>f</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mi>|</mi><mi>f</mi><mo separator=\"true\">,</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>B</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/1163dij.mp3","t":[0,21.752,34.204,49.339,72.252,86.864,96.309,109.888,129.469,143.802,156.626,170.75]}]},{"k":"l","ch":"cu","code":"Para tu cuaderno · Capítulo 4","q":"Métodos clásicos de optimización I","bl":[["Fórmula: Sin restricciones: f′(x*) = 0 (necesaria). f″ > 0 mínimo; f″ < 0 máximo; indefinida → posible punto de silla.",1],["Ejemplo: f(x) = x e^(−x²): x* = ±√2/2; máximo ≈ 0,429 en +√2/2 y mínimo ≈ −0,429 en −√2/2.",2],["Fórmula: Newton: x⁽ⁿ⁺¹⁾ = x⁽ⁿ⁾ − H⁻¹∇f(x⁽ⁿ⁾). Exacto en un paso si f es cuadrática. Con H⁻¹ = I → cuasi-Newton = descenso.",3],["Fórmula: Descenso más pronunciado: x⁽ⁿ⁺¹⁾ = x⁽ⁿ⁾ − α∇f(x⁽ⁿ⁾); α pequeño = lento, grande = diverge.",4],["Ejemplo: Ejemplo 4.1: f = 10x₁² + 5x₁x₂ + 10(x₂ − 3)², desde (10, 15): ∇f = (275, 290), α₀ ≈ 0,04001; en 3 iteraciones ≈ (−0,8; 3,2) = (−4/5, 16/5).",5],["Fórmula: Wolfe: Armijo f(xₖ + αsₖ) ≤ f(xₖ) + γ₁α sₖᵀ∇f(xₖ); curvatura sₖᵀ∇f(xₖ + αsₖ) ≥ γ₂ sₖᵀ∇f(xₖ); 0 < γ₁ < γ₂ < 1.",6],["Fórmula: Gradientes conjugados (Au = b): rₙ = b − Auₙ; αₙ = rₙᵀrₙ / dₙᵀAdₙ; uₙ₊₁ = uₙ + αₙdₙ; βₙ = rₙ₊₁ᵀrₙ₊₁ / rₙᵀrₙ; dₙ₊₁ = rₙ₊₁ + βₙdₙ; d₀ = r₀.",7],["Ejemplo: Programación lineal (ISP): max P = 2x₁ + 3x₂; x₁ + x₂ ≤ 20, x₁ ≤ 16, x₂ ≤ 10 → óptimo en el vértice B(10, 10), P = 50 (50 000 libras).",8],["Concepto: Simplex (Dantzig, 1947): variables de holgura → forma estándar Ax = b, x ≥ 0; BFS = vértice; pivotar a vértices adyacentes mientras Z mejore. ISP: O (Z = 0) → A (Z = 30) → B (Z = 50).",9],["Fórmula: Penalización: Π = f + Σ μᵢφᵢ² + Σ νⱼψⱼ² (coeficientes grandes).",10],["Fórmula: Lagrange: L = f + Σ λⱼgⱼ; ∂L/∂xᵢ = 0 y ∂L/∂λⱼ = gⱼ = 0. Ej. 4.2: λ = 2/5 → (1/5, 12/5). Ej. 4.3: mínimo en B(−1, 0), f = −1.",11],["Fórmula: KKT: ∇f + Σλᵢ∇φᵢ + Σμⱼ∇ψⱼ = 0; ψⱼ ≤ 0; μⱼ ≥ 0; μⱼψⱼ = 0 (holgura complementaria). Ej. 4.4: óptimo (−1/3, 5/3), f = 113/9.",12],["Para intervenir: «En el ejemplo 4.4 del libro hay erratas: en el caso 3 el punto correcto es (6/5, 16/5) y en el caso 4 los multiplicadores son μ₁ = 4/9 y μ₂ = 46/9; la conclusión no cambia.»",13],["Para intervenir: Pregunta para el profesor: «¿Cuándo conviene usar penalización en vez de Lagrange o KKT en un problema de ingeniería real?»",14]],"eq":[["f'(x_*)=0,\\quad f''(x_*)\\gtrless0",1],["\\mathbf{x}^{(n+1)}=\\mathbf{x}^{(n)}-\\mathbf{H}^{-1}\\nabla f(\\mathbf{x}^{(n)})",3],["\\mathbf{x}^{(n+1)}=\\mathbf{x}^{(n)}-\\alpha\\nabla f(\\mathbf{x}^{(n)})",4],["f(\\mathbf{x}_k+\\alpha\\mathbf{s}_k)\\le f(\\mathbf{x}_k)+\\gamma_1\\alpha\\mathbf{s}_k^T\\nabla f(\\mathbf{x}_k)",6]],"lines":[["Copia: Sin restricciones: f′(x*) = 0 (necesaria). f″ > 0 mínimo; f″ < 0 máximo; indefinida → posible punto de silla.",1,null],["Copia: f(x) = x e^(−x²): x* = ±√2/2; máximo ≈ 0,429 en +√2/2 y mínimo ≈ −0,429 en −√2/2.",2,null],["Copia: Newton: x⁽ⁿ⁺¹⁾ = x⁽ⁿ⁾ − H⁻¹∇f(x⁽ⁿ⁾). Exacto en un paso si f es cuadrática. Con H⁻¹ = I → cuasi-Newton = descenso.",3,null],["Copia: Des ,[\\max\\{0,\\,a-x\\}]^2",2],["x<a:\\;\\Pi'=200(x-b)-2\\mu(a-x)=0\\;\\Rightarrow\\;x_\\mu=\\frac{100b+\\mu a}{100+\\mu}",3],["\\mu\\to\\infty\\;\\Rightarrow\\;x_\\mu\\to a,\\quad f_{\\min}=100(a-b)^2+\\pi",4],["a=2,b=1:\\;\\mu=10^2\\to1.5;\\;\\mu=10^4\\to1.990;\\;\\mu=10^6\\to1.9999",5]],"lines":[["Ejercicio 4.1: minimizar f igual a 100 por x menos b al cuadrado, más pi, sujeto a x menos a mayor o igual que cero, con a mayor que b. Sin restricción, el mínimo estaría en x igual a b, que no es viable porque b es menor que a.",1],["Escribimos la restricción como psi igual a a menos x, menor o igual que cero, y la penalizamos: pi mayúscula igual a f más mu por el máximo entre cero y a menos x, al cuadrado.",2],["En la zona x menor que a, derivamos e igualamos a cero: x sub mu igual a 100 b más mu a, entre 100 más mu.",3,"point"],["Cuando mu tiende a infinito, x sub mu tiende a a: la restricción queda activa. El mínimo es x igual a a, con f igual a 100 por a menos b al cuadrado más pi.",4,"happy"],["Por ejemplo, con a igual a 2 y b igual a 1: mu 100 da 1,5; mu 10 mil da 1,990; y mu un millón da 1,9999. Se ve el inconveniente: hace falta mu enorme para precisión alta.",5]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>100</mn><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mi>π</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo>≥</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>a</mi><mo>&gt;</mo><mi>b</mi></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi mathvariant=\"normal\">Π</mi><mspace></mspace></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>μ</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>100</mn><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mi>π</mi><mo>+</mo><mi>μ</mi><mspace width=\"0.1667em\"></mspace><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.1667em\"></mspace><mi>a</mi><mo>−</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mn>2</mn></msup></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>x</mi><mo>&lt;</mo><mi>a</mi><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mspace width=\"0.2778em\"></mspace><msup><mrow><mi mathvariant=\"normal\">Π</mi><mspace></mspace></mrow><mo lspace=\"0em\" rspace=\"0em\" class=\"tml-prime\">′</mo></msup><mo>=</mo><mn>200</mn><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>−</mo><mn>2</mn><mi>μ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo>−</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>0</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><msub><mi>x</mi><mi>μ</mi></msub><mo>=</mo><mfrac><mrow><mn>100</mn><mi>b</mi><mo>+</mo><mi>μ</mi><mi>a</mi></mrow><mrow><mn>100</mn><mo>+</mo><mi>μ</mi></mrow></mfrac></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>μ</mi><mo>→</mo><mi>∞</mi><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><msub><mi>x</mi><mi>μ</mi></msub><mo>→</mo><mi>a</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><msub><mi>f</mi><mrow><mi>min</mi><mo>⁡</mo></mrow></msub><mo>=</mo><mn>100</mn><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>a</mi><mo>−</mo><mi>b</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mi>π</mi></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>a</mi><mo>=</mo><mn>2</mn><mo separator=\"true\">,</mo><mi>b</mi><mo>=</mo><mn>1</mn><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mspace width=\"0.2778em\"></mspace><mi>μ</mi><mo>=</mo><msup><mn>10</mn><mn>2</mn></msup><mo>→</mo><mn>1.5</mn><mo separator=\"true\">;</mo><mspace width=\"0.2778em\"></mspace><mi>μ</mi><mo>=</mo><msup><mn>10</mn><mn>4</mn></msup><mo>→</mo><mn>1.990</mn><mo separator=\"true\">;</mo><mspace width=\"0.2778em\"></mspace><mi>μ</mi><mo>=</mo><msup><mn>10</mn><mn>6</mn></msup><mo>→</mo><mn>1.9999</mn></mrow></math>"],"aud":[{"f":"audio/1bsepdn.mp3","t":[0,17.282,30.571,39.586,51.563]}]},{"k":"l","ch":"e4","code":"Ejercicio 4.2","q":"Función de De Jong con dos métodos","viz":"dejong","code2":["% Ejercicio 4.2 (Octave/Matlab): f(x) = sum(x.^2), -5.12 <= x <= 5.12\nf = @(x) sum(x.^2);  g = @(x) 2*x;\nfor n = [5 50]\n  x0 = -5.12 + 10.24*rand(n,1);\n  % Método 1: descenso más pronunciado con paso fijo alfa = 0.1\n  x = x0;\n  for k = 1:200, x = x - 0.1*g(x); if f(x) < 1e-10, break; end, end\n  printf(\"n=%d  descenso: %d iteraciones, f = %.2e\\n\", n, k, f(x));\n  % Método 2: búsqueda aleatoria (estrategia evolutiva 1+1)\n  x = x0; s = 1;\n  for k = 1:20000\n    y = min(max(x + s*randn(n,1), -5.12), 5.12);\n    if f(y) < f(x), x = y; s = s*1.5; else, s = s*0.9; end\n    if f(x) < 1e-10, break; end\n  end\n  printf(\"n=%d  aleatorio: %d evaluaciones, f = %.2e\\n\", n, k, f(x));\nend",3],"lines":[["Ejercicio 4.2: programar dos métodos distintos para la función de De Jong, la suma de x i al cuadrado, en el cubo de menos 5,12 a 5,12, para n igual a 5 y n igual a 50. El mínimo exacto es cero, en el origen.",1],["Método 1, determinista: descenso más pronunciado. El gradiente es 2 x; con paso alfa igual a 0,1, cada iteración multiplica x por 0,8, y converge igual de rápido en 5 o en 50 dimensiones. Con paso exacto, alfa igual a un medio, llega en un solo paso.",2,"point"],["Método 2, estocástico: una estrategia evolutiva uno más uno, que muta el punto al azar y solo acepta mejoras, adaptando el tamaño de la mutación. No usa derivadas, pero necesita muchas más evaluaciones, sobre todo con n igual a 50. La gráfica muestra ambas curvas, calculadas en tu navegador; el código Octave está a la derecha.",3],["Conclusión: en un problema convexo y suave como este, el gradiente gana con claridad; los métodos estocásticos brillan en problemas multimodales o sin derivadas.",4,"happy"]],"aud":[{"f":"audio/osdagp.mp3","t":[0,18.211,40.764,65.186]}]},{"k":"l","ch":"e4","code":"Ejercicio 4.3","q":"Viajante con 20 ciudades","viz":"tsp20","code2":["% Ejercicio 4.3: vecino más cercano + mejora 2-opt (Octave/Matlab)\nn = 20; C = rand(n,2)*100;  D = squareform(pdist(C));\nruta = 1; libre = 2:n;\nwhile ~isempty(libre)            % vecino más cercano\n  [~,k] = min(D(ruta(end),libre)); ruta(end+1) = libre(k); libre(k) = [];\nend\nlongitud = @(r) sum(D(sub2ind([n n], r, [r(2:end) r(1)])));\nmejora = true;\nwhile mejora                     % 2-opt: invertir tramos si acorta\n  mejora = false;\n  for i = 2:n-1, for j = i+1:n\n    r = ruta; r(i:j) = r(j:-1:i);\n    if longitud(r) < longitud(ruta) - 1e-9, ruta = r; mejora = true; end\n  end, end\nend\nprintf(\"longitud final: %.1f\\n\", longitud(ruta));",2],"lines":[["Ejercicio 4.3: programar la búsqueda de la ruta más corta por 20 ciudades, visitando cada una exactamente una vez y volviendo al inicio.",1],["Un método práctico tiene dos fases. Primero, el vecino más cercano construye una ruta rápida, en ámbar. Luego, la mejora 2-opt invierte tramos de la ruta mientras eso la acorte, y elimina los cruces, en verde. Mira la animación: las 20 ciudades se generan en tu navegador.",2,"point"],["El caso simple donde la estrategia codiciosa falla lo vimos en la sección 1.2: con 8 ciudades, ir siempre a la más cercana daba una ruta claramente más larga que la óptima, porque al final hay que hacer saltos largos para volver.",3],["Con 20 ciudades hay 19 factorial entre 2 rutas, unos 6 por 10 elevado a 16, imposible de probar todas: por eso usamos heurísticas como esta.",4,"warn"]],"aud":[{"f":"audio/u69859.mp3","t":[0,10.154,29.038,44.567]}]},{"k":"l","ch":"e4","code":"Ejercicio 4.4","q":"Máximo de (|x| + |y|) e^(−x² − y²)","viz":"ex44","eq":[["f(x,y)=(|x|+|y|)\\,e^{-x^2-y^2}",1,"simétrica en los 4 cuadrantes"],["x,y\\ge0:\\;\\frac{\\partial f}{\\partial x}=e^{-x^2-y^2}[1-2x(x+y)]=0,\\quad\\frac{\\partial f}{\\partial y}=e^{-x^2-y^2}[1-2y(x+y)]=0",2],["\\Rightarrow x=y,\\;1-4x^2=0\\;\\Rightarrow\\;x=y=\\tfrac12",3],["f_{\\max}=e^{-1/2}\\approx0.6065\\;\\text{en}\\;(\\pm\\tfrac12,\\pm\\tfrac12)",4],["\\text{en los ejes: }xe^{-x^2}\\le\\tfrac{\\sqrt2}{2}e^{-1/2}\\approx0.429<0.6065",5]],"lines":[["Ejercicio 4.4: hallar el máximo de f igual a valor absoluto de x más valor absoluto de y, por e a la menos x² menos y². La función es simétrica: lo que pase en el primer cuadrante se repite en los otros tres. Además, el valor absoluto no es derivable en los ejes, así que los revisamos aparte.",1],["En el primer cuadrante, f es x más y por la exponencial. Las derivadas parciales se anulan cuando 1 menos 2 x por x más y es cero, y 1 menos 2 y por x más y es cero.",2],["Restando ambas, x es igual a y; sustituyendo, 1 menos 4 x² igual a cero: x igual a y igual a un medio.",3,"point"],["El valor es 1 por e a la menos un medio, unos 0,6065. Por simetría hay cuatro máximos globales, en más o menos un medio, más o menos un medio.",4,"happy"],["En los ejes, por ejemplo y igual a cero, f es x por e a la menos x², cuyo máximo es 0,429, el de la sección 4.1: menor. Así que el máximo global es e a la menos un medio. También se puede encontrar numéricamente con ascenso de gradiente desde cualquier punto del cuadrante.",5]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>|</mi><mi>x</mi><mi>|</mi><mo>+</mo><mi>|</mi><mi>y</mi><mi>|</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mspace width=\"0.1667em\"></mspace><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mo>−</mo><msup><mi>y</mi><mn class=\"tml-sml-pad\">2</mn></msup></mrow></msup></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo>≥</mo><mn>0</mn><mo lspace=\"0.2222em\" rspace=\"0.2222em\">:</mo><mspace width=\"0.2778em\"></mspace><mfrac><mrow><mi>∂</mi><mi>f</mi></mrow><mrow><mi>∂</mi><mi>x</mi></mrow></mfrac><mo>=</mo><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mo>−</mo><msup><mi>y</mi><mn class=\"tml-sml-pad\">2</mn></msup></mrow></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>x</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mfrac><mrow><mi>∂</mi><mi>f</mi></mrow><mrow><mi>∂</mi><mi>y</mi></mrow></mfrac><mo>=</mo><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mo>−</mo><msup><mi>y</mi><mn class=\"tml-sml-pad\">2</mn></msup></mrow></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">[</mo><mn>1</mn><mo>−</mo><mn>2</mn><mi>y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mn>0</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mo stretchy=\"false\">⇒</mo><mi>x</mi><mo>=</mo><mi>y</mi><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mn>1</mn><mo>−</mo><mn>4</mn><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mo>=</mo><mn>0</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mi>x</mi><mo>=</mo><mi>y</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>f</mi><mrow><mi>max</mi><mo>⁡</mo></mrow></msub><mo>=</mo><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mn>1</mn><mi>/</mi><mn>2</mn></mrow></msup><mo>≈</mo><mn>0.6065</mn><mspace width=\"0.2778em\"></mspace><mtext>en</mtext><mspace width=\"0.2778em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mo form=\"prefix\" stretchy=\"false\">±</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo separator=\"true\">,</mo><mo form=\"prefix\" stretchy=\"false\">±</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>en los ejes: </mtext><mi>x</mi><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup></mrow></msup><mo>≤</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><msqrt><mn>2</mn></msqrt><mn>2</mn></mfrac></mstyle><msup><mi>e</mi><mrow class=\"tml-sml-pad\"><mo form=\"prefix\" stretchy=\"false\" lspace=\"0em\" rspace=\"0em\">−</mo><mn>1</mn><mi>/</mi><mn>2</mn></mrow></msup><mo>≈</mo><mn>0.429</mn><mo>&lt;</mo><mn>0.6065</mn></mrow></math>"],"aud":[{"f":"audio/97g8a5.mp3","t":[0,23.389,35.737,45.496,57.844]}]},{"k":"l","ch":"e4","code":"Ejercicio 4.5","q":"Resolver Au = b con programación lineal","eq":[["\\mathbf{A}\\mathbf{u}+\\mathbf{e}^+-\\mathbf{e}^-=\\mathbf{b},\\quad\\mathbf{e}^\\pm\\ge0,\\;\\mathbf{u}=\\mathbf{u}^+-\\mathbf{u}^-,\\;\\mathbf{u}^\\pm\\ge0",1],["\\min Z=\\sum_i(e_i^++e_i^-)",2,"si Z* = 0, entonces Au = b exactamente"],["\\mathbf{A}=\\begin{pmatrix}2&1\\\\1&3\\end{pmatrix},\\;\\mathbf{b}=\\begin{pmatrix}3\\\\5\\end{pmatrix}\\;\\Rightarrow\\;\\mathbf{u}=\\begin{pmatrix}4/5\\\\7/5\\end{pmatrix},\\;Z^*=0",3]],"lines":[["Ejercicio 4.5: usar la programación lineal para resolver un sistema A u igual a b. La idea: el simplex exige variables no negativas, así que escribimos u como diferencia de dos vectores no negativos, y añadimos variables de error, e más y e menos, también no negativas.",1],["Minimizamos la suma de los errores. Si el mínimo es cero, todas las ecuaciones se cumplen exactamente: hemos resuelto el sistema. Si es positivo, no tiene solución, y obtenemos la mejor aproximación en norma uno. Es un problema de viabilidad como los de la sección 2.1.",2,"point"],["Ejemplo: A igual a 2, 1; 1, 3, y b igual a 3, 5. El simplex encuentra u igual a 4 quintos, 7 quintos, con error cero. Compruébalo: 2 por 0,8 más 1,4 es 3, y 0,8 más 3 por 1,4 es 5.",3,"happy"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐀</mi><mi>𝐮</mi><mo>+</mo><msup><mi>𝐞</mi><mo form=\"prefix\" stretchy=\"false\">+</mo></msup><mo>−</mo><msup><mi>𝐞</mi><mo form=\"prefix\" stretchy=\"false\">−</mo></msup><mo>=</mo><mi>𝐛</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><msup><mi>𝐞</mi><mo>±</mo></msup><mo>≥</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>𝐮</mi><mo>=</mo><msup><mi>𝐮</mi><mo form=\"prefix\" stretchy=\"false\">+</mo></msup><mo>−</mo><msup><mi>𝐮</mi><mo form=\"prefix\" stretchy=\"false\">−</mo></msup><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><msup><mi>𝐮</mi><mo>±</mo></msup><mo>≥</mo><mn>0</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi>min</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>Z</mi><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>i</mi></munder></mrow><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>e</mi><mi>i</mi><mo form=\"prefix\" stretchy=\"false\" class=\"tml-sml-pad\">+</mo></msubsup><mo>+</mo><msubsup><mi>e</mi><mi>i</mi><mo form=\"prefix\" stretchy=\"false\" class=\"tml-sml-pad\">−</mo></msubsup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐀</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>2</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>3</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>𝐛</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>3</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>5</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mi>𝐮</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>4</mn><mi>/</mi><mn>5</mn></mrow></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>7</mn><mi>/</mi><mn>5</mn></mrow></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><msup><mi>Z</mi><mo class=\"tml-med-pad\">∗</mo></msup><mo>=</mo><mn>0</mn></mrow></math>"],"aud":[{"f":"audio/eglk2c.mp3","t":[0,20.069,38.523]}]},{"k":"l","ch":"e4","code":"Ejercicio 4.6","q":"Gradientes conjugados en Octave","code2":["function u = gradconj(A, b, u, tol)\n% Ejercicio 4.6: versión más simple del gradiente conjugado\n  r = b - A*u;  d = r;  rr = r'*r;      % d0 = r0 (ec. 4.23)\n  for k = 1:numel(b)\n    Ad = A*d;\n    alfa = rr / (d'*Ad);                 % ec. 4.27\n    u = u + alfa*d;                       % ec. 4.25\n    r = r - alfa*Ad;\n    rrn = r'*r;\n    if sqrt(rrn) < tol, break; end\n    d = r + (rrn/rr)*d;  rr = rrn;        % ec. 4.26, beta = rrn/rr\n  end\nend\n\n% Ejemplo:\n% A = [4 1; 1 3]; b = [1; 2];\n% u = gradconj(A, b, [0; 0], 1e-10)   % -> [0.0909; 0.6364] = [1/11; 7/11]",1],"eq":[["\\mathbf{A}=\\begin{pmatrix}4&1\\\\1&3\\end{pmatrix},\\;\\mathbf{b}=\\begin{pmatrix}1\\\\2\\end{pmatrix}",2],["\\mathbf{u}=\\begin{pmatrix}1/11\\\\7/11\\end{pmatrix}\\approx\\begin{pmatrix}0.0909\\\\0.6364\\end{pmatrix}",3,"en 2 iteraciones (n = 2)"]],"lines":[["Ejercicio 4.6: la versión más simple del gradiente conjugado en Octave. Calculamos el residuo r igual a b menos A u, tomamos d cero igual a r cero, como exige el libro, y guardamos r traspuesta r.",1],["En cada iteración: alfa es r traspuesta r entre d traspuesta A d; actualizamos u y r; si la norma del residuo es menor que la tolerancia, paramos; si no, beta es el cociente de los nuevos y viejos cuadrados, y la nueva dirección es r más beta d.",2,"point"],["Con A igual a 4, 1; 1, 3, y b igual a 1, 2, desde cero, cero, el método llega en dos iteraciones, porque n es 2, a u igual a 1 onceavo, 7 onceavos.",3,"happy"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐀</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>4</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>1</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:5.9776pt;\"><mn>1</mn></mtd><mtd style=\"padding-left:5.9776pt;padding-right:0em;\"><mn>3</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>𝐛</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>1</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>2</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>𝐮</mi><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>1</mn><mi>/</mi><mn>11</mn></mrow></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mrow><mn>7</mn><mi>/</mi><mn>11</mn></mrow></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>≈</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mtable><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>0.0909</mn></mtd></mtr><mtr><mtd style=\"padding-left:0em;padding-right:0em;\"><mn>0.6364</mn></mtd></mtr></mtable><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/wv7op6.mp3","t":[0,15.692,32.126]}]},{"k":"t","ch":"t1","big":"Tarea 1","lead":"Identificar una función desconocida con el gradiente descendente","lines":[["¡Llegó la Tarea 1! Vamos a resolverla juntos, paso a paso, de forma sencilla, pero con todo el rigor que pide la materia.","","happy"],["Te la explico primero con ideas que entendería hasta un niño, y luego con las fórmulas exactas de Yang, capítulo 4. Al final te dejo el resumen para tu cuaderno."]],"aud":[{"f":"audio/wapltu.mp3","t":[0,8.888]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Planteamiento","q":"La caja misteriosa","viz":"mbox","key":"Hay que encontrar un modelo y(x1, x2) tal que |y(x1, x2) − χᵢ| < 0,1 en todas las muestras, usando el gradiente descendente.","lines":[["Imagina una caja cerrada. Le metes dos números, x1 y x2, y sale otro número, chi. No podemos abrirla: es la misión misteriosa.",0],["Lo único que tenemos son algunas pruebas: qué entró y qué salió. Mira cómo pasan los datos por la caja.",1,"point"],["Nuestra misión: construir una fórmula y de x1, x2 que imite a la caja tan bien que, en cada prueba, la diferencia entre lo que predice y lo que se midió sea menor que 0,1.",2],["Y debemos encontrarla con el método del gradiente descendente del capítulo 4 de Yang. Las entradas viven en el intervalo de cero a diez.",2]],"aud":[{"f":"audio/4kh3fo.mp3","t":[0,11.884,19.506,32.516,40.649]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Los datos","q":"Leer bien la tabla","viz":"tdata","bl":[["El valor antes de la coma es x1 y el de después es x2.",1],["Muestras: (0, 0) → 0; (0, 3) → 2,5; (0, 6) → 5.",2],["Ojo: x1 = 0 en las tres muestras.",3],["Los tres puntos están sobre una recta: 2,5/3 = 5/6 ≈ 0,8333.",4]],"lines":[["Primero, leer bien los datos. El enunciado dice que el número antes de la coma es x1 y el de después es x2.",1],["Tenemos tres muestras: cero coma cero da cero; cero coma tres da 2,5; y cero coma seis da 5.",2],["Algo muy importante: x1 vale cero en las tres. Es como querer saber cuánto azúcar endulza un café sin ponerle azúcar nunca. Volveremos a esto al final.",3,"warn"],["Si dibujamos la salida contra x2, los tres puntos caen sobre una misma recta: 2,5 entre 3 es igual a 5 entre 6, unos 0,8333. ¡Eso ya es una pista!",4,"point"]],"aud":[{"f":"audio/amotr3.mp3","t":[0,8.029,16,26.723]}]},{"k":"c","ch":"t1","id":"8dum6d","q":"¿Por qué no podremos saber cuánto influye x1?","o":["Porque el método es malo","Porque x1 vale 0 en todas las muestras","Porque x1 es negativo","Porque hay demasiados datos"],"a":1,"w":"Si x1 nunca cambia, los datos no contienen información sobre su efecto.","lines":[["¿Por qué no podremos saber cuánto influye x1?"]],"aud":[{"f":"audio/16wbj2s.mp3","t":[0]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Teoría de Yang","q":"La herramienta: bajar la montaña","viz":"descent","eq":[["\\mathbf{s}_k=-\\nabla f(\\mathbf{x}_k)",1,"dirección de máximo descenso"],["\\mathbf{x}_{k+1}=\\mathbf{x}_k+\\alpha_k\\mathbf{s}_k=\\mathbf{x}_k-\\alpha_k\\nabla f(\\mathbf{x}_k)",2,"Yang, sección 4.2.2"],["\\psi(\\alpha_k)=f(\\mathbf{x}_k+\\alpha_k\\mathbf{s}_k)",3,"búsqueda lineal, ec. 4.17"],["f(\\mathbf{x}_k+\\alpha_k\\mathbf{s}_k)\\le f(\\mathbf{x}_k)+\\gamma_1\\alpha_k\\mathbf{s}_k^T\\nabla f(\\mathbf{x}_k)",4,"Armijo, ec. 4.18"],["\\mathbf{s}_k^T\\nabla f(\\mathbf{x}_k+\\alpha_k\\mathbf{s}_k)\\ge\\gamma_2\\,\\mathbf{s}_k^T\\nabla f(\\mathbf{x}_k)",4,"curvatura, ec. 4.19; 0 < γ₁ < γ₂ < 1"]],"lines":[["Imagina que estás en una montaña con niebla y quieres llegar al valle. No ves el fondo, pero sí sientes hacia dónde baja el suelo bajo tus pies.",0],["Ese hacia dónde sube es el gradiente. Así que caminas al revés: s sub k igual a menos el gradiente.",1,"point"],["Y das un paso de tamaño alfa: x nuevo igual a x menos alfa por el gradiente. Es el descenso más pronunciado de la sección 4.2.2.",2],["Yang dice que hay dos decisiones: la dirección y el tamaño del paso. Elegir alfa se reduce a una función de una sola variable, psi de alfa, aunque haya muchas variables.",3],["Un paso aceptable cumple las condiciones de Wolfe: bajar lo suficiente, Armijo, y no ser ridículamente corto, curvatura. Y Yang avisa: cerca del mínimo el gradiente es casi cero y se avanza lento. En esta tarea, en vez de parar cuando el gradiente es pequeño, paramos cuando todos los errores sean menores que 0,1.",4]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐬</mi><mi>k</mi></msub><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">−</mo><mo form=\"prefix\" stretchy=\"false\">∇</mo><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>𝐱</mi><mi>k</mi></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>𝐱</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>𝐱</mi><mi>k</mi></ se\">[</mo><mn>0</mn><mo>+</mo><mn>1.5</mn><mo>⋅</mo><mn>3</mn><mo>+</mo><mn>2.75</mn><mo>⋅</mo><mn>6</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">]</mo></mrow><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>21</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>14</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mfrac><mrow><mi>∂</mi><mi>L</mi></mrow><mrow><mi>∂</mi><mi>b</mi></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>4.5</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mn>3</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>w</mi><mn>2</mn></msub><mo>=</mo><mn>1.25</mn><mo>−</mo><mn>0.05</mn><mo>⋅</mo><mn>14</mn><mo>=</mo><mn>0.55</mn><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mi>b</mi><mo>=</mo><mn>0.25</mn><mo>−</mo><mn>0.05</mn><mo>⋅</mo><mn>3</mn><mo>=</mo><mn>0.10</mn></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi>max</mi><mo>⁡</mo></mrow><mi>|</mi><msub><mi>e</mi><mi>i</mi></msub><mi>|</mi><mo>=</mo><mn>2.75</mn><mo>≥</mo><mn>0.1</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mtext>seguimos</mtext></mrow></math>"],"aud":[{"f":"audio/1712ln8.mp3","t":[0,21.09,28.144,40.399]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Paso 5","q":"Las 13 iteraciones en el mapa","viz":"gdpath","key":"Con α = 0,05 el criterio se cumple en la iteración 13: w₂ = 0,8135 y b = 0,0987 (máx |e| = 0,0987).","bl":[["k = 0: (0; 0), L = 10,42, máx |e| = 5",3],["k = 1: (1,25; 0,25), L = 3,29",3],["k = 2: (0,55; 0,10), L = 1,04",3],["k = 5: (0,8503; 0,1441), L = 0,0398",3],["k = 13: (0,8135; 0,0987), máx |e| = 0,0987 < 0,1 ✓",4]],"lines":[["El mapa muestra la montaña L vista desde arriba, en el plano de w2 y b: lo oscuro es lo bajo, y la estrella es el fondo exacto del valle.",1],["Empezamos en cero, cero, abajo a la izquierda.",2],["Ahora mira cómo avanza cada iteración: salta a la derecha, vuelve, salta otra vez… cada vez más cerca. Ese zigzag cruza el valle alargado.",3,"point"],["En la iteración 13, w2 vale 0,8135 y b vale 0,0987, y el mayor error es 0,0987: por fin menor que 0,1. ¡Misión cumplida! Las dos primeras filas coinciden con nuestro cálculo a mano.",4,"happy"]],"aud":[{"f":"audio/mjbkg0.mp3","t":[0,11.013,14.827,25.817,45.131]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Paso 6","q":"Búsqueda lineal exacta: el paso perfecto","viz":"gdexact","eq":[["\\psi(\\alpha)=L(\\mathbf{w}_k-\\alpha\\mathbf{g}_k)\\;\\text{es una parábola}",1],["\\alpha_k^*=\\frac{\\mathbf{g}_k^T\\mathbf{g}_k}{\\mathbf{g}_k^T\\mathbf{H}\\mathbf{g}_k}",1,"mínimo de la parábola en forma cerrada"],["k=0:\\;\\alpha^*=0.03202;\\quad k=1:\\;\\alpha^*=1.3",2],["w_2=0.8325,\\;b\\approx0\\;\\text{en 2 iteraciones}",3]],"lines":[["¿Y si en vez de un paso fijo elegimos el mejor paso posible cada vez? Es la búsqueda lineal de la sección 4.2.3. Como L es cuadrática, psi de alfa es una parábola, y su mínimo tiene fórmula: alfa estrella igual a g traspuesta g, entre g traspuesta H g.",1],["En la primera iteración sale alfa estrella 0,03202, y en la segunda 1,3. Mira el camino verde: dos zancadas y llega.",2,"point"],["En solo 2 iteraciones, w2 vale 0,8325 y b casi cero. Esto confirma la idea de Yang: elegir bien alfa es tan importante como elegir bien la dirección.",3,"happy"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>ψ</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>α</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mi>L</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub>< w₂ = 0,8135, b = 0,0987.",1],["α fijo 0,01 → 65 iteraciones; w₂ = 0,8129, b = 0,0994.",2],["Búsqueda exacta → 2 iteraciones; w₂ = 0,8325, b ≈ 0.",3],["Armijo (backtracking, γ₁ = 10⁻⁴): α = 0,0625 siempre → 80 iteraciones; w₂ = 0,8171.",4]],"lines":[["Comparemos. La gráfica muestra cómo baja L en cada estrategia, en escala logarítmica. Con alfa fijo 0,05: 13 iteraciones.",1],["Con alfa 0,01, pasos más pequeños: 65 iteraciones. Más seguro, pero más lento.",2],["Con la búsqueda lineal exacta: solo 2.",3,"happy"],["Y con Armijo por retroceso, que empieza en alfa igual a 1 y divide entre 2 hasta cumplir la condición, siempre acepta 0,0625, que también cumple la curvatura con gamma dos igual a 0,9. Pero está casi en el límite de estabilidad, 0,064, así que zigzaguea mucho: 80 iteraciones. Las condiciones de Wolfe garantizan convergencia, no rapidez.",4,"warn"]],"aud":[{"f":"audio/1badxuo.mp3","t":[0,10.514,18.171,21.498]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Resultado","q":"El modelo encontrado","viz":"fitfinal","eq":[["y=0.8135\\,x_2+0.0987\\quad(\\alpha=0.05,\\;13\\text{ it.})",1],["y=\\tfrac56x_2\\approx0.8333\\,x_2\\quad(\\text{mínimo exacto de }L)",2]],"lines":[["La línea azul es el modelo del gradiente con alfa 0,05: y igual a 0,8135 x2 más 0,0987. Pasa a menos de 0,1 de cada punto.",1,"point"],["La línea roja discontinua es el mínimo exacto de L: y igual a cinco sextos de x2, unos 0,8333 x2. Casi se superponen.",2]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>y</mi><mo>=</mo><mn>0.8135</mn><mspace width=\"0.1667em\"></mspace><msub><mi>x</mi><mn>2</mn></msub><mo>+</mo><mn>0.0987</mn><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>α</mi><mo>=</mo><mn>0.05</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mn>13</mn><mtext> it.</mtext><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>y</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>5</mn><mn>6</mn></mfrac></mstyle><msub><mi>x</mi><mn>2</mn></msub><mo>≈</mo><mn>0.8333</mn><mspace width=\"0.1667em\"></mspace><msub><mi>x</mi><mn>2</mn></msub><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>mínimo exacto de </mtext><mi>L</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/17peljs.mp3","t":[0,14.055]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Discusión","q":"Lo que hay que analizar","viz":"w1flat","bl":[["a) La tolerancia detiene el algoritmo antes del mínimo exacto: con tolerancia 10⁻⁶ converge a w₂ = 0,833333, b ≈ 0.",1],["b) w₁ no se puede identificar: ∂L/∂w₁ = 0 y la hessiana tiene un autovalor nulo. No es error del método: faltan datos con x₁ ≠ 0.",2],["c) Lentitud cerca del mínimo: el gradiente se acerca a cero, como advierte Yang.",3],["d) Validez del modelo lineal: los tres puntos son colineales; harían falta más mediciones en [0, 10] para descartar no linealidades.",4]],"lines":[["Cuatro ideas para la discusión. Primera: la tolerancia detiene el algoritmo antes del mínimo exacto. Con 0,1 paramos en 0,8135; si la bajamos a 10 a la menos 6, llega a 0,833333 con b casi cero. Hay muchas soluciones aceptables, pero el mínimo de mínimos cuadrados es único en w2 y b.",1],["Segunda: w1 no se puede identificar. Mira el mapa: moverse en la dirección de w1 no cambia nada, es una dirección plana, con autovalor cero. No es culpa del método: los datos no tienen información de x1. Haría falta al menos una medición con x1 distinto de cero, como 3, 0 o 5, 5.",2,"warn"],["Tercera: la lentitud cerca del mínimo. Al principio el error baja mucho y al final poco, porque el gradiente se acerca a cero: justo lo que describe Yang.",3],["Cuarta: la validez del modelo lineal. Los tres puntos son colineales, así que el ajuste lineal es exacto, pero con solo tres muestras no podemos descartar algo no lineal en otras zonas del intervalo de cero a diez.",4]],"aud":[{"f":"audio/16ggm1z.mp3","t":[0,24.387,47.451,57.791]}]},{"k":"c","ch":"t1","id":"765d75","q":"¿Qué haría falta para identificar w1?","o":["Usar un α más pequeño","Al menos una medición con x1 ≠ 0","Más iteraciones","Usar Armijo"],"a":1,"w":"El problema son los datos, no el método: con x1 = 0 siempre, ∂L/∂w1 = 0.","lines":[["¿Qué haría falta para identificar w1?"]],"aud":[{"f":"audio/p3v74h.mp3","t":[0]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Conclusión","q":"La función de la caja","eq":[["y(x_1,x_2)\\approx0.8333\\,x_2=\\frac{5x_2}{6}",1,"el aporte de x₁ queda indeterminado por falta de datos"],["w_1+w_2=8.333\\;?",3,"si se leyera x₁ = x₂ = 0,3 y 0,6, solo se identificaría la suma"]],"lines":[["Conclusión: según los datos y el gradiente descendente, la caja se comporta como y igual a 0,8333 por x2, es decir, cinco sextos de x2. El aporte de x1 queda indeterminado por falta de datos.",1,"happy"],["El paso fijo de 0,05 cumple el criterio en 13 iteraciones; la búsqueda lineal exacta en 2; y Armijo con Wolfe converge, pero en 80. La elección alfa menor que 2 entre lambda máxima se justificó con la hessiana.",2],["Una nota: si los datos se leyeran de otra forma, con x1 igual a x2, el procedimiento sería idéntico, pero solo podríamos identificar la suma w1 más w2. La indeterminación seguiría.",3]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>y</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>x</mi><mn>2</mn></msub><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>0.8333</mn><mspace width=\"0.1667em\"></mspace><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mn>5</mn><msub><mi>x</mi><mn>2</mn></msub></mrow><mn>6</mn></mfrac></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>w</mi><mn>1</mn></msub><mo>+</mo><msub><mi>w</mi><mn>2</mn></msub><mo>=</mo><mn>8.333</mn><mspace width=\"0.2778em\"></mspace><mo form=\"postfix\" stretchy=\"false\">?</mo></mrow></math>"],"aud":[{"f":"audio/9rhq0g.mp3","t":[0,16.202,32.103]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Código","q":"El algoritmo en Python","code2":["import numpy as np\n\n# Datos: columnas (x1, x2) y salida medida chi\nX   = np.array([[0, 0], [0, 3], [0, 6]], dtype=float)\nchi = np.array([0, 2.5, 5])\nN   = len(chi)\n\nw, b  = np.zeros(2), 0.0      # valor inicial\nalpha = 0.05                  # alpha < 2/lambda_max = 0.064\ntol   = 0.1                   # criterio |y_i - chi_i| < 0.1\n\nk = 0\nwhile True:\n    y = X @ w + b             # predicción del modelo\n    e = y - chi               # error por muestra\n    if np.all(np.abs(e) < tol):\n        break\n    grad_w = (2/N) * X.T @ e  # dL/dw1, dL/dw2\n    grad_b = (2/N) * e.sum()  # dL/db\n    w -= alpha * grad_w       # paso en dirección -gradiente\n    b -= alpha * grad_b\n    k += 1\n\nprint(f\"Iteraciones: {k}\")\nprint(f\"y = {w[0]:.4f}*x1 + {w[1]:.4f}*x2 + {b:.4f}\")",1],"bl":[["X @ w + b: el modelo para las tres muestras a la vez.",1],["e = y − chi: los errores.",2],["np.all(|e| < 0,1): el criterio de parada.",3],["(2/N)·Xᵀe y (2/N)·Σe: el gradiente.",4],["w −= α·grad: el paso de descenso.",5]],"lines":[["El código hace exactamente lo que hicimos a mano. Primero, los datos y los valores iniciales: perillas en cero, alfa 0,05 y tolerancia 0,1.",1],["En el bucle: calcula la predicción para las tres muestras a la vez y los errores.",2],["Si todos los errores son menores que 0,1, se detiene.",3],["Si no, calcula el gradiente con las fórmulas del paso 3…",4,"point"],["…y da el paso en la dirección contraria. Al terminar imprime 13 iteraciones y el modelo encontrado.",5]],"aud":[{"f":"audio/138fm20.mp3","t":[0,11.953,17.3,21.37,25.789]}]},{"k":"l","ch":"t1","code":"Tarea 1 · Para tu cuaderno","q":"Resumen para resolver el ejercicio en clase","bl":[["1. Datos: (x1, x2) → χ: (0,0)→0; (0,3)→2,5; (0,6)→5. Criterio |yᵢ − χᵢ| < 0,1.",1],["2. Modelo: y = w1x1 + w2x2 + b. Incógnitas: w = (w1, w2, b).",2],["3. Objetivo: L = (1/N)Σ(yᵢ − χᵢ)², N = 3 (cuadrado: derivable).",3],["4. Gradiente: ∂L/∂w1 = (2/N)Σeᵢx1,ᵢ = 0; ∂L/∂w2 = (2/N)Σeᵢx2,ᵢ; ∂L/∂b = (2/N)Σeᵢ.",4],["5. Paso: H = [[0,0,0],[0,30,6],[0,6,2]], λ ≈ 0; 0,768; 31,23 → α < 2/31,23 ≈ 0,064 → α = 0,05.",5],["6. Iteración: w ← w − α∇L. k=0: ∇=(−25, −5) → (1,25; 0,25). k=1: ∇=(14, 3) → (0,55; 0,10).",6],["7. Resultado: k = 13 → y = 0,8135x2 + 0,0987 (máx |e| = 0,0987).",7],["8. Búsqueda exacta α* = gᵀg/gᵀHg → 2 it. (0,8325; 0). α = 0,01 → 65 it. Armijo → 80 it.",8],["9. Conclusión: y ≈ 0,8333x2 = 5x2/6; w1 indeterminado porque x1 = 0 en todos los datos.",9]],"lines":[["Ahora, lo que debes copiar en tu cuaderno para resolverlo en clase. Uno: los datos y el criterio, error menor que 0,1.",1],["Dos: el modelo, y igual a w1 x1 más w2 x2 más b, con las perillas como incógnitas.",2],["Tres: la función objetivo, el error cuadrático medio, al cuadrado porque es derivable.",3],["Cuatro: las tres derivadas, y que la de w1 es cero porque x1 siempre es cero.",4,"warn"],["Cinco: la hessiana, sus autovalores y la regla alfa menor que 2 entre lambda máxima, unos 0,064; por eso alfa igual a 0,05.",5,"point"],["Seis: la iteración, w menos alfa por el gradiente, con las dos primeras vueltas a mano.",6],["Siete: el resultado tras 13 iteraciones, y igual a 0,8135 x2 más 0,0987.",7],["Ocho: la comparación: búsqueda exacta en 2, alfa 0,01 en 65, y Armijo en 80.",8],["Y nueve: la conclusión, y aproximadamente cinco sextos de x2, con w1 indeterminado por falta de datos. ¡Con esto puedes resolverlo y explicarlo en clase!",9,"happy"]],"aud":[{"f":"audio/bnqnvn.mp3","t":[0,8.877,17.556,24.284,30.549,42.537,49.184,58.804,66.67]}]},{"k":"t","ch":"quiz1","big":"Quiz 1: historia","lead":"Responde en voz alta an
