s, y aleatorizamos o sustituimos a los que no son tan buenos…",2],["…mientras evaluamos la aptitud de cada individuo en combinación con el historial del sistema, es decir, usando memoria. Con ese equilibrio buscamos algoritmos mejores y más eficientes.",3]],"aud":[{"f":"audio/mp6dke.mp3","t":[0,14.949,25.323]}]},{"k":"l","ch":"c2c","code":"2.3 · Figura 2.2","q":"Determinísticos y estocásticos","viz":"algtree","lines":[["En general, los algoritmos se dividen en dos categorías: determinísticos y estocásticos. Los determinísticos siguen un procedimiento riguroso; su trayectoria y los valores de las variables y funciones son repetibles. La escalada de colinas, desde el mismo punto, sigue el mismo camino hoy o mañana.",1],["La mayoría de los algoritmos clásicos son determinísticos, como el método simplex de la programación lineal. Algunos usan el gradiente: Newton-Raphson usa los valores de la función y sus derivadas, y funciona extremadamente bien en problemas unimodales suaves.",2],["Pero si hay alguna discontinuidad en el objetivo no funciona bien, y es preferible un algoritmo sin gradiente, que solo usa los valores de la función. Ejemplos: la búsqueda por patrones de Hooke-Jeeves y el símplex descendente de Nelder-Mead.",3],["Los estocásticos siempre tienen cierta aleatoriedad. En los algoritmos genéticos, las soluciones de la población son distintas en cada ejecución porque usan números pseudoaleatorios; los resultados finales se parecen, pero las trayectorias no son repetibles.",4],["Hay un tercer tipo, híbrido: la escalada con reinicio aleatorio usa un algoritmo determinista desde distintos puntos iniciales, lo que evita quedarse atascado en un pico local. Como contiene azar, se suele clasificar como estocástico. Entre los estocásticos hay dos tipos: heurísticos, que significa encontrar o descubrir por prueba y error…",5],["…y metaheurísticos: meta significa más allá o de nivel superior, y suelen rendir mejor que las heurísticas simples. Todos combinan aleatorización y búsqueda local. No hay definiciones consensuadas, y algunos autores usan ambos términos como sinónimos; la tendencia es llamar metaheurísticos a todos los estocásticos con aleatorización y búsqueda local. La aleatorización permite pasar de la búsqueda local a la global, por eso casi todos pretenden servir para optimización global.",6,"point"]],"aud":[{"f":"audio/vtxj0b.mp3","t":[0,19.453,36.77,51.858,68.014,91.67]}]},{"k":"c","ch":"c2c","id":"15yyynj","q":"La escalada de colinas con reinicio aleatorio se clasifica como…","o":["determinística","estocástica (híbrida)","programación lineal","sin gradiente pura"],"a":1,"w":"Tiene un componente aleatorio, por eso se clasifica como estocástica.","lines":[["La escalada de colinas con reinicio aleatorio se clasifica como…"]],"aud":[{"f":"audio/5armre.mp3","t":[0]}]},{"k":"l","ch":"c2c","code":"2.4 · Metaheurísticas","q":"Inspiradas en la naturaleza","viz":"swarm","bl":[["Casi todas se inspiran en la naturaleza: algunas en la evolución de Darwin (bioinspiradas).",1],["Dos componentes: selección de las mejores soluciones y aleatorización.",2],["Selección → convergencia hacia la optimalidad. Aleatorización → evita óptimos locales y aumenta la diversidad.",3],["Clasificación: basadas en poblaciones (AG, PSO, «basado en agentes») o en trayectorias (SA).",4],["Parte II del libro: GA, ACO, BA, PSO, SA, HS, FA y otros.",5]],"lines":[["La mayoría de los algoritmos metaheurísticos se inspiran en la naturaleza, que ha evolucionado durante millones de años y ha encontrado soluciones perfectas a casi todos sus problemas. Algunos se basan en la teoría evolutiva de Darwin: se dice que son bioinspirados.",1],["Dos componentes principales de cualquier metaheurística son la selección de las mejores soluciones y la aleatorización.",2,"point"],["La selección garantiza que las soluciones converjan hacia la optimalidad; la aleatorización evita que queden atrapadas en óptimos locales y aumenta su diversidad. Una buena combinación de ambas suele garantizar que se alcance la optimalidad global.",3],["Una forma de clasificarlas: basadas en poblaciones o en trayectorias. Los algoritmos genéticos usan un conjunto de cadenas; el enjambre de partículas usa múltiples agentes, y por eso también se llama algoritmo basado en agentes. El recocido simulado usa un único agente que se mueve por tramos; siempre acepta un movimiento mejor, y uno peor con cierta probabilidad. Sus pasos trazan una trayectoria con probabilidad no nula de llegar al óptimo global.",4],["La Parte II del libro analiza las principales: algoritmos genéticos, colonias de hormigas, abejas, enjambre de partículas, recocido simulado, búsqueda armónica, luciérnagas y otros. La eficiencia de un algoritmo depende en gran medida de su complejidad, que se expresa con la notación de orden.",5]],"aud":[{"f":"audio/u8nz6z.mp3","t":[0,16.353,23.616,39.97,71.102]}]},{"k":"c","ch":"c2c","id":"hn0vuv","q":"Los dos componentes de toda metaheurística son…","o":["gradiente y hessiana","selección de las mejores soluciones y aleatorización","pivote y holgura","cruce y temperatura"],"a":1,"w":"La selección converge; la aleatorización evita óptimos locales.","lines":[["Los dos componentes de toda metaheurística son…"]],"aud":[{"f":"audio/5jnzo2.mp3","t":[0]}]},{"k":"t","ch":"c2d","big":"2.5 Notación de orden","lead":"y 2.6 Complejidad de los algoritmos","lines":[["Secciones 2.5 y 2.6: notación de orden y complejidad."]],"aud":[{"f":"audio/1kcqlk2.mp3","t":[0]}]},{"k":"l","ch":"c2d","code":"2.5 · Ecuaciones 2.7 a 2.9","q":"La notación O grande","viz":"order","eq":[["\\lim_{x\\to x_0}\\frac{f(x)}{g(x)}\\to K",1,"(2.7) K finito y distinto de cero"],["f=O(g)",1,"(2.8)"],["f\\sim g\\quad (K=1)",2,"(2.9) f/g → 1 y g/f → 1"]],"lines":[["La eficiencia de un algoritmo se mide con la complejidad algorítmica o computacional, también llamada en la literatura complejidad de Kolmogorov. Para un problema de tamaño n, se denota con la notación O grande, como O de n² u O de n log n.",0],["En términos generales, para dos funciones f y g, si el límite de f entre g cuando x tiende a x sub cero es un número K finito y distinto de cero, escribimos f igual a O de g. Significa que f es asintóticamente equivalente al orden de g.",1,"point"],["Si el límite es la unidad, K igual a 1, decimos que f es del orden de g, y escribimos f tilde g. Equivale a que f entre g tiende a 1 y g entre f tiende a 1. Aquí x sub cero puede ser cualquier valor, incluidos 0 e infinito.",2]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><munder><mi>lim</mi><mrow><mi>x</mi><mo>→</mo><msub><mi>x</mi><mn>0</mn></msub></mrow></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><mfrac><mrow><mi>f</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow><mrow><mi>g</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></mfrac><mo>→</mo><mi>K</mi></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>f</mi><mo>=</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>g</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>f</mi><mo>∼</mo><mi>g</mi><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>K</mi><mo>=</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/axad78.mp3","t":[0,16.98,35.528]}]},{"k":"l","ch":"c2d","code":"2.5 · Ecuaciones 2.10 y 2.11","q":"Del orden de, aproximadamente y o pequeña","eq":[["\\sin x\\sim x,\\quad \\sin x\\approx x\\quad (x\\to 0)",1],["f\\sim 100\\;\\not\\Rightarrow\\; f\\approx 100\\;\\;(\\text{puede estar entre }50\\text{ y }150)",2],["\\lim_{x\\to x_0}\\frac{f}{g}\\to 0\\quad\\Longleftrightarrow\\quad f=o(g)",3,"(2.10) y (2.11)"],["e^x\\approx 1+x+O(x^2)\\approx 1+x+\\frac{x^2}{2}+o(x)",4]],"lines":[["La tilde no significa necesariamente aproximadamente igual, aunque a veces dan el mismo resultado, sobre todo cuando x tiende a cero: por ejemplo, seno de x tilde x, y seno de x aproximadamente x.",1],["Cuando decimos que f es del orden de 100, no significa que f valga aproximadamente 100: puede estar entre 50 y 150.",2],["La o pequeña se usa cuando el límite tiende a cero: si f entre g tiende a cero, escribimos f igual a o de g. Si g es positiva, f igual a o de g equivale a f mucho menor que g.",3,"point"],["Por ejemplo, para todo x real, e a la x es aproximadamente 1 más x más O de x², y aproximadamente 1 más x más x² entre 2, más o de x.",4]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>x</mi><mo>∼</mo><mi>x</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><mrow><mi>sin</mi><mo>⁡</mo><mspace width=\"0.1667em\"></mspace></mrow><mi>x</mi><mo>≈</mo><mi>x</mi><mspace width=\"1em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo>→</mo><mn>0</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>f</mi><mo>∼</mo><mn>100</mn><mspace width=\"0.2778em\"></mspace><mo>⇏</mo><mspace width=\"0.2778em\"></mspace><mi>f</mi><mo>≈</mo><mn>100</mn><mspace width=\"0.2778em\"></mspace><mspace width=\"0.2778em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mtext>puede estar entre </mtext><mn>50</mn><mtext> y </mtext><mn>150</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><munder><mi>lim</mi><mrow><mi>x</mi><mo>→</mo><msub><mi>x</mi><mn>0</mn></msub></mrow></munder><mo>⁡</mo><mspace width=\"0.1667em\"></mspace><mfrac><mi>f</mi><mi>g</mi></mfrac><mo>→</mo><mn>0</mn><mspace width=\"1em\"></mspace><mo stretchy=\"false\">⟺</mo><mspace width=\"1em\"></mspace><mi>f</mi><mo>=</mo><mi>o</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>g</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>e</mi><mi class=\"tml-sml-pad\">x</mi></msup><mo>≈</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>≈</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>+</mo><mfrac><msup><mi>x</mi><mn class=\"tml-sml-pad\">2</mn></msup><mn>2</mn></mfrac><mo>+</mo><mi>o</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>x</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/jw4mqr.mp3","t":[0,14.763,23.663,36.928]}]},{"k":"l","ch":"c2d","code":"2.5 · Ejemplo 2.1","q":"Las constantes no cambian el orden","eq":[["n+1,\\;n+5,\\;n+15 \\;=\\;O(n)",1],["0.7n,\\;1.5n,\\;2n+1,\\;3n+7 \\;=\\;O(n)",2],["n\\gg 1\\;\\Rightarrow\\; n\\ll n^2\\;\\;(n/n^2\\ll 1)",3],["n^2+2n+3 = O(n^2),\\qquad n^3+2n^2+5n+20=O(n^3)",4]],"lines":[["Ejemplo 2.1. De la definición de orden se deduce que sumar un número de orden O de 1 no cambia el orden de una expresión: n más 1, n más 5 y n más 15 son todos de orden n.",1],["Del mismo modo, un factor de orden O de 1 apenas influye: 0,7 n, 1,5 n, 2 n más 1 y 3 n más 7 son todos de orden n.",2],["En computación siempre trabajamos con enteros n mucho mayores que 1, así que n es mucho menor que n², porque n entre n² es mucho menor que 1.",3],["Predomina el término de mayor potencia: n² más 2 n más 3 es de orden n², y n³ más 2 n² más 5 n más 20 es de orden n³.",4,"point"]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>n</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>n</mi><mo>+</mo><mn>5</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mi>n</mi><mo>+</mo><mn>15</mn><mspace width=\"0.2778em\"></mspace><mo>=</mo><mspace width=\"0.2778em\"></mspace><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mn>0.7</mn><mi>n</mi><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mn>1.5</mn><mi>n</mi><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mn>2</mn><mi>n</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mspace width=\"0.2778em\"></mspace><mn>3</mn><mi>n</mi><mo>+</mo><mn>7</mn><mspace width=\"0.2778em\"></mspace><mo>=</mo><mspace width=\"0.2778em\"></mspace><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>n</mi><mo>≫</mo><mn>1</mn><mspace width=\"0.2778em\"></mspace><mo stretchy=\"false\">⇒</mo><mspace width=\"0.2778em\"></mspace><mi>n</mi><mo>≪</mo><msup><mi>n</mi><mn>2</mn></msup><mspace width=\"0.2778em\"></mspace><mspace width=\"0.2778em\"></mspace><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mi>/</mi><msup><mi>n</mi><mn>2</mn></msup><mo>≪</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msup><mi>n</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>n</mi><mo>+</mo><mn>3</mn><mo>=</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>2</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"2em\"></mspace><msup><mi>n</mi><mn>3</mn></msup><mo>+</mo><mn>2</mn><msup><mi>n</mi><mn>2</mn></msup><mo>+</mo><mn>5</mn><mi>n</mi><mo>+</mo><mn>20</mn><mo>=</mo><mi>O</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msup><mi>n</mi><mn>3</mn></msup><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>"],"aud":[{"f":"audio/47ck0i.mp3","t":[0,13.428,25.95,37.52]}]},{"k":"c","ch":"c2d","id":"1vv2jct","q":"n³ + 2n² + 5n + 20 es de orden…","o":["O(n)","O(n²)","O(n³)","O(20)"],"a":2,"w":"Domina el término de mayor potencia.","lines":[["n³ + 2n² + 5n + 20 es de orden…"]],"aud":[{"f":"audio/17b2s97.mp3","t":[0]}]},{"k":"l","ch":"c2d","code":"2.5 · Ejemplo 2.2","q":"La serie de Stirling","eq":[["n!\\sim\\sqrt{2\\pi n}\\left(\\frac{n}{e}\\right)^n\\left(1+\\frac{1}{12n}+\\frac{1}{288n^2}-\\frac{139}{51480n^3}-\\dots\\right)",1,"(2.12)"],["R_2=\\frac{1}{12n}\\cdot\\sqrt{2\\pi n}\\,(n/e)^n",2,"el error no tiende a cero: R₂ → ∞ si n ≫ 1"],["100! = 9.3326\\times10^{157},\\quad \\sqrt{2\\pi n}(n/e)^n=9.3248\\times10^{157}",3],["\\text{diferencia}=7.7740\\times10^{154}",4,"tres órdenes menor que la aproximación"]],"lines":[["Ejemplo 2.2. Un ejemplo clásico es la serie asintótica de Stirling para el factorial: n factorial tilde raíz de 2 pi n, por n entre e a la n, por 1 más 1 entre 12 n, más 1 entre 288 n², menos 139 entre 51480 n³, y así sucesivamente.",1,"point"],["En las series de potencias estándar el error tiende a cero. En una serie asintótica, el error de la serie truncada se hace pequeño comparado con el término principal, raíz de 2 pi n por n entre e a la n, pero no tiende necesariamente a cero. De hecho, R sub 2, igual a 1 entre 12 n por el término principal, sigue siendo muy grande, y tiende a infinito si n es mucho mayor que 1.",2],["Por ejemplo, para n igual a 100, n factorial vale 9,3326 por 10 elevado a 157, mientras que la aproximación principal da 9,3248 por 10 elevado a 157.",3],["La diferencia es 7,7740 por 10 elevado a 154: sigue siendo enorme, aunque tres órdenes de magnitud menor que la aproximación principal.",4]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>n</mi><mo form=\"postfix\" stretchy=\"false\">!</mo><mo>∼</mo><msqrt><mrow><mn>2</mn><mi>π</mi><mi>n</mi></mrow></msqrt><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mi>n</mi><mi>e</mi></mfrac><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>n</mi></msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>+</mo><mfrac><mn>1</mn><mrow><mn>12</mn><mi>n</mi></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>288</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mn>139</mn><mrow><mn>51480</mn><msup><mi>n</mi><mn>3</mn></msup></mrow></mfrac><mo>−</mo><mo>…</mo><mspace width=\"0.1667em\"></mspace><mo fence=\"true\" form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>12</mn><mi>n</mi></mrow></mfrac><mo>⋅</mo><msqrt><mrow><mn>2</mn><mi>π</mi><mi>n</mi></mrow></msqrt><mspace width=\"0.1667em\"></mspace><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mi>/</mi><mi>e</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>n</mi></msup></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mn>100</mn><mo form=\"postfix\" stretchy=\"false\">!</mo><mo>=</mo><mn>9.3326</mn><mo>×</mo><msup><mn>10</mn><mn>157</mn></msup><mo separator=\"true\">,</mo><mspace width=\"1em\"></mspace><msqrt><mrow><mn>2</mn><mi>π</mi><mi>n</mi></mrow></msqrt><msup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>n</mi><mi>/</mi><mi>e</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mi>n</mi></msup><mo>=</mo><mn>9.3248</mn><mo>×</mo><msup><mn>10</mn><mn>157</mn></msup></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mtext>diferencia</mtext><mo>=</mo><mn>7.7740</mn><mo>×</mo><msup><mn>10</mn><mn>154</mn></msup></mrow></math>"],"aud":[{"f":"audio/1aatyv4.mp3","t":[0,23.517,49.1,65.198]}]},{"k":"c","ch":"c2d","id":"1qs7e7o","q":"En la serie de Stirling para n = 100, la diferencia entre n! y la aproximación es…","o":["cero","enorme en valor absoluto, pero mucho menor que el término principal","mayor que n!","negativa"],"a":1,"w":"Es 7,7740 × 10¹⁵⁴: grande, pero tres órdenes menor que la aproximación.","lines":[["En la serie de Stirling para n = 100, la diferencia entre n! y la aproximación es…"]],"aud":[{"f":"audio/jwb3w5.mp3","t":[0]}]},{"k":"l","ch":"c2d","code":"2.6 · Ejemplo 2.3","q":"Burbuja contra quicksort","viz":"sort","lines":[["Volvamos a la complejidad computacional. Ordenar n datos de forma ascendente o descendente requiere un tiempo que depende del tamaño n. O de n es complejidad lineal y O de n² cuadrática: si n se duplica, el tiempo se duplica en el caso lineal, pero se cuadruplica en el cuadrático.",1],["Ejemplo 2.3. El método de la burbuja empieza comparando los dos primeros elementos; si el primero es menor que el segundo, los intercambia. Ese proceso de comparar e intercambiar sigue para cada par de elementos adyacentes. Hay n por n pares, porque hacen falta dos bucles sobre todos los datos: la complejidad es O de n².",2],["El quicksort usa divide y vencerás mediante partición: elige un elemento pivote, pone los menores antes y los mayores después, y ordena cada sublista de forma recursiva. Su complejidad es O de n log n, mucho más eficiente.",3,"point"],["Para n igual a 1000, la burbuja necesita del orden de 10 elevado a 6 cálculos, y el quicksort solo del orden de 3 por 10 elevado a 3: al menos dos órdenes de magnitud menos.",4]],"aud":[{"f":"audio/tottpg.mp3","t":[0,19.918,41.763,58.36]}]},{"k":"c","ch":"c2d","id":"18bpsbi","q":"Si n se duplica en un algoritmo O(n²), el tiempo…","o":["se duplica","se cuadruplica","no cambia","se reduce"],"a":1,"w":"(2n)² = 4n².","lines":[["Si n se duplica en un algoritmo O(n²), el tiempo…"]],"aud":[{"f":"audio/jqtswg.mp3","t":[0]}]},{"k":"l","ch":"c2d","code":"2.6 · Complejidad de los problemas","q":"P, NP, NP-difícil y NP-completo","viz":"pnp","lines":[["Desde el punto de vista del esfuerzo computacional, los problemas se clasifican en polinómicos y NP. Si una solución puede verificarse en tiempo polinómico de forma determinista, a menudo con una máquina de Turing determinista, decimos que el problema se resuelve en tiempo polinómico: tiene complejidad P. Por ejemplo, Agrawal y colaboradores demostraron en 2002 que se puede determinar en tiempo polinómico si un número es primo. Un algoritmo de complejidad P se considera eficiente.",1],["Si un problema no es resoluble en tiempo polinómico, hablamos de tiempo polinómico no determinista, NP. Una solución sí puede verificarse en tiempo polinómico; la dificultad está en encontrarla eficientemente, y puede requerir más que tiempo NP.",2],["En programación matemática, un problema fácil o tratable se resuelve con un número de pasos que es función polinómica del tamaño n, con al menos un algoritmo que lo resuelva. Un problema difícil o intratable requiere tiempo exponencial en n, y esos algoritmos se consideran ineficientes. Mira cómo explota el número de rutas del viajante.",3,"warn"],["Un problema es NP si su solución solo puede adivinarse y evaluarse en tiempo polinómico, sin regla conocida para adivinar, de ahí no determinista. No hay algoritmos eficientes conocidos para los NP difíciles, solo soluciones aproximadas o heurísticas; por eso las metaheurísticas son tan prometedoras. Un problema es NP completo si es NP difícil y todos los demás problemas NP se reducen a él con algoritmos de reducción de tiempo polinómico. Ejemplo de NP difícil: el viajante.",4,"point"],["Si los NP completos se resuelven o no en tiempo polinómico sigue sin resolverse; el Instituto Clay ofrece un millón de dólares por una demostración formal. La mayoría de los problemas reales son NP difíciles, así que cualquier avance tendrá impacto en muchísimas aplicaciones.",4]],"aud":[{"f":"audio/12ovgqt.mp3","t":[0,31.795,49.982,72.431,105.514]}]},{"k":"c","ch":"c2d","id":"17jx1r","q":"¿Qué caracteriza a un problema NP?","o":["Se resuelve siempre rápido","Su solución se verifica en tiempo polinómico, aunque encontrarla sea difícil","No tiene solución","Es lineal"],"a":1,"w":"Verificar es fácil; encontrar puede requerir tiempo exponencial.","lines":[["¿Qué caracteriza a un problema NP?"]],"aud":[{"f":"audio/rkm3cu.mp3","t":[0]}]},{"k":"t","ch":"c2e","big":"2.7 No hay almuerzo gratis","lead":"Los teoremas de Wolpert y Macready","lines":[["Sección 2.7: los teoremas de no hay almuerzo gratis."]],"aud":[{"f":"audio/9dzixn.mp3","t":[0]}]},{"k":"l","ch":"c2e","code":"2.7 · Ecuación 2.13","q":"El enunciado matemático","who":["wolpert","macready"],"eq":[["N=n_f^{\\,n_\\theta}",1,"número de funciones de coste posibles: finito, pero enorme"],["\\sum_f P(s_m^y\\mid f,m,A)=\\sum_f P(s_m^y\\mid f,m,B)",2,"(2.13)"],["s_m=\\{(s_m^x(1),s_m^y(1)),\\dots,(s_m^x(m),s_m^y(m))\\}",3,"m puntos visitados, en orden cronológico"]],"lines":[["El método para un problema depende del tipo y de las características del propio problema: no hay un método universal, ni garantía de encontrar el óptimo en optimización global. Los teoremas de no hay almuerzo gratis, de Wolpert y Macready, afirman que si un algoritmo A supera a B buscando un extremo de una función de coste, B superará a A en otras funciones. Se aplican cuando un conjunto de parámetros theta, continuos, discretos o mixtos, mapea las funciones de coste en un conjunto finito.",0],["Sea n sub theta el número de valores de theta, por ser discretos o por la precisión finita de la máquina, y n sub f el número de valores de la función de coste. El número de funciones posibles es N igual a n sub f elevado a n sub theta: finito, pero normalmente enorme.",1],["Los teoremas demuestran que el rendimiento medio sobre todas las funciones de coste posibles es el mismo para todos los algoritmos. Si P de s sub m dado f, m y A es el rendimiento, en sentido probabilístico, de un algoritmo A iterado m veces sobre la función f con la muestra s sub m, la suma sobre todas las f es igual para A que para B.",2,"point"],["Aquí s sub m es el conjunto, ordenado en el tiempo, de m puntos distintos visitados. Lo interesante es que el rendimiento es independiente del propio algoritmo: promediados sobre todas las funciones, todos rinden igual. No existe un método universalmente óptimo.",3]],"eqh":["<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mi>N</mi><mo>=</mo><msubsup><mi>n</mi><mi>f</mi><mrow><mspace width=\"0.1667em\"></mspace><msub><mi>n</mi><mi>θ</mi></msub></mrow></msubsup></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>f</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>f</mi><mo separator=\"true\">,</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>A</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><munder><mo movablelimits=\"false\">∑</mo><mi>f</mi></munder></mrow><mi>P</mi><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mo lspace=\"0.22em\" rspace=\"0.22em\" stretchy=\"false\">|</mo><mi>f</mi><mo separator=\"true\">,</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>B</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow></mrow></math>","<math display=\"block\" class=\"tml-display\" style=\"display:block math;\"><mrow><msub><mi>s</mi><mi>m</mi></msub><mo>=</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">x</mi></msubsup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mn>1</mn><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">x</mi></msubsup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>m</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo separator=\"true\">,</mo><msubsup><mi>s</mi><mi>m</mi><mi class=\"tml-sml-pad\">y</mi></msubsup><mrow><mo fence=\"true\" form=\"prefix\" stretchy=\"false\">(</mo><mi>m</mi><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">)</mo></mrow><mo fence=\"true\" form=\"postfix\" stretchy=\"false\">}</mo></mrow></mrow></math>"],"aud":[{"f":"audio/1fskqg2.mp3","t":[0,32.921,52.42,75.392]}]},{"k":"l","ch":"c2e","code":"2.7 · Interpretación","q":"Entonces, ¿para qué crear algoritmos?","viz":"nfl","lines":[["Se podría pensar que no hace falta crear algoritmos nuevos porque todos funcionan igual de bien. Pero el rendimiento se mide en sentido estadístico y sobre todas las funciones posibles.",1],["Eso no significa que todos funcionen igual de bien en funciones concretas. En realidad, ningún problema requiere el rendimiento promedio sobre todas las funciones.",2,"warn"],["Aunque los teoremas son válidos matemáticamente, su influencia práctica es limitada: para un conjunto concreto de funciones, algunos algoritmos funcionan mucho mejor que otros. El problema principal es encontrar esos mejores algoritmos para cada tipo de problema.",3,"point"],["Por otra parte, si no se puede alcanzar el óptimo, hay que centrarse en la mejor estimación o en soluciones subóptimas. Conocer el problema concreto siempre ayuda a elegir el método más eficiente. Cabe señalar que los teoremas se han demostrado para problemas de un solo objetivo; para multiobjetivo siguen sin demostrarse.",3]],"aud":[{"f":"audio/w9gzqm.mp3","t":[0,11.721,22.281,40.248]}]},{"k":"c","ch":"c2e","id":"16bopul","q":"Los teoremas NFL están demostrados para…","o":["problemas multiobjetivo","problemas de un solo objetivo","solo problemas lineales","ningún problema"],"a":1,"w":"Para multiobjetivo siguen sin demostrarse.","lines":[["Los teoremas NFL están demostrados para…"]],"aud":[{"f":"audio/f4cnom.mp3","t":[0]}]},{"k":"l","ch":"c2e","code":"Capítulo 2 · Ejercicios y referencias","q":"Ejercicios propuestos del capítulo 2","bl":[["2.1 Halla el mínimo global de f(x, y) = x² + y². ¿De qué tipo es la optimización?",1],["2.2 Indica el tipo de: a) max exp(−x²), −2 ≤ x ≤ 5; b) min x² + y², (x − 2)², (y − 3)³; c) max 2x + 3y, x > 0, 0 < y ≤ 10, y ≥ x; d) min x²y⁶ con x² + y²/4 = 1; e) un motor más silencioso, eficiente y barato; f) software para predecir la bolsa.",1],["2.3 Complejidad de: sumar n reales; multiplicar dos matrices n × n; hallar el máximo de n números; evaluar un polinomio de grado n; ordenar n números por comparación de pares.",2],["2.4 Simplifica al orden más cercano: 0,9n + 15; 5n² − 5; 1,5n³ + 2n² + 10n; n⁵ + 100n³ + 200; n log(n) + log(2n).",2],["2.5 Máximo global de f(x, y) = x + y con 0 ≤ x ≤ 5, 0 ≤ y ≤ 2 y 2x + y = 8.",3]],"lines":[["El capítulo 2 termina con cinco ejercicios. Aquí están los enunciados completos.",1],["El 2.3 y el 2.4 son de complejidad y notación de orden.",2],["Y el 2.5 es un pequeño problema lineal. Los resolvemos todos en la sección final. El capítulo cita 5 referencias; están en la pestaña Referencias.",3,"point"]],"aud":[{"f":"audio/j5e5ud.mp3","t":[0,5.986,11.391]}]},{"k":"t","ch":"c4","big":"Capítulo 4","lead":"Métodos clásicos de optimización I","lines":[["Capítulo 4: métodos clásicos de optimización."]],"aud":[{"f":"audio/uwvnvd.mp3","t":[0]}]},{"k":"t","ch":"c4a","big":"4.1 Optimización sin restricciones","lead":"Derivadas y puntos estacionarios","lines":[["Sección 4.1: optimización sin restricciones."]],"aud":[{"f":"audio/kek85l.mp3","t":[0]}]},{"k":"l","ch":"c4a","code":"4.1 · Ecuación 4.1","q":"La condición de estacionariedad","eq":[["f'(x)=0",1,"(4.1) condición necesaria, no suficiente"],["f'(x_*)=0,\\; f''(x_*)>0\\;\\Rightarrow\\;\\text{mínimo local}",2],["f'(x_*)=0,\\; f''(x_*)<0\\;\\Rightarrow\\;\\text{máximo local}",3],["f'(x_*)=0,\\; f''(x)\\;\\text{indefinida cuando}\\;x\\to x_*\\;\\Rightarrow\\;\\text{posible punto de silla}",4]],"lines":[["La optimización más sencilla, sin restricciones, es probablemente buscar los máximos o mínimos de una función f de x. Para ello hay que hallar la raíz de la primera derivada, es decir, la condición de estacionariedad: f prima de x igual a cero.",1],["Pero esa condición es solo necesaria, no suficiente. Si f prima de x estrella es cero y f segunda de x estrella es mayor que cero, es un mínimo local.",2,"point"],["Si f prima de x estrella es cero y f segunda es menor que cero, es un máximo local.",3],["Y si f prima es cero pero f segunda es indefinida cuando x tiende a x estrella, ento
